abstract: The hydrodynamical behavior of supernova models based on accreting carbon-oxygen
  white dwarfs is computed through the explosion for three cases with different accretion
  rates. For intermediate accretion rates, the helium flash is so strong that it produces
  a helium detonation wave propagating outward and a carbon detonation wave propagating
  inward, which results in most of the star's material being converted into N-56 and
  the star itself being completely disrupted. For the case with a slower accretion
  rate, the helium flash is only strong enough to form a single detonation wave propagating
  outward, leaving behind either a white dwarf remnant or disrupting the star completely,
  depending on conditions in the white dwarf. The ejecta of double detonation supernovae
  is composed mostly of N-56, while the single detonation ejects a small amount of
  N-56 or N-56, C, and O in the case of total disruption. These models are compared
  with observed features of type I supernovae.
