abstract: A statistical analysis of radio pulsar data is presented. The basic theory
  behind the analysis is discussed, and all the selection effects of the major pulsar
  surveys are considered in detail, paying particular attention to those that depend
  on pulsar period. The birthrate of pulsars is estimated to be one pulsar in about
  56 years, and the local rate in the solar neighborhood is estimated to be one pulsar
  in about 90,000 yr/sq kpc. The calculations confirm an earlier result from Vivekanand
  and Narayan (1981) that many pulsars are born with initial periods as slow as 0.5
  s. Three possibilities are discussed for the correlation between initial spin period
  and magnetic field. The issue of a luminosity model for radio pulsars is also addressed,
  and the model of Lyne et al. (1985) is rejected in favor of a power-law model, which
  fits the data better.
