abstract: BV(RI)\_KC\_ light curves are presented for 27 type Ia supernovae discovered
  during the course of the Calan/Tololo Survey and for two other SNe Ia observed during
  the same period. Estimates of the maximum light magnitudes in the B, V, and I bands
  and the initial decline rate parameter {DELTA}m\_15\_(B) are also given.
