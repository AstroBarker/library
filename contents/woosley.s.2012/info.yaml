abstract: In the collapsar model for common gamma-ray bursts (GRBs), the formation
  of a centrifugally supported disk occurs during the first ~10 s following the collapse
  of the iron core in a massive star. This only occurs in a small fraction of massive
  stellar deaths, however, and requires unusual conditions. A much more frequent occurrence
  could be the death of a star that makes a black hole and a weak or absent outgoing
  shock, but in a progenitor that only has enough angular momentum in its outermost
  layers to make a disk. We consider several cases where this is likely to occur---blue
  supergiants with low mass-loss rates, tidally interacting binaries involving either
  helium stars or giant stars, and the collapse to a black hole of very massive pair-instability
  supernovae. These events have in common the accretion of a solar mass or so of material
  through a disk over a period much longer than the duration of a common GRB. A broad
  range of powers is possible, 1047-1050 erg s-1, and this brightness could be enhanced
  by beaming. Such events were probably more frequent in the early universe where
  mass-loss rates were lower. Indeed, this could be one of the most common forms of
  gamma-ray transients in the universe and could be used to study first generation
  stars. Several events could be active in the sky at any one time. Recent examples
  of this sort of event may have been the Swift transients Sw-1644+57, Sw-2058+0516,
  and GRB 101225A.
