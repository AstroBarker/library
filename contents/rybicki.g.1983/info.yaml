abstract: Radiation emitted by a three-dimensional medium and received by a distant
  observer is expressed in terms of the specific luminosity, which can be evaluated
  in terms of escape probability functions for the medium. This approach is simpler
  in many cases than an integration over the plane of the sky, because it allows any
  symmetries of the problem to be more fully exploited. Integral theorems are derived
  involving averaged escape probabilities that generalize a theorem of Irons. Analogous
  results are presented for a three-dimensional line-emitting region in the Sobolev
  (or large velocity gradient) limit. To illustrate the theory, results for expanding
  spherical media and differently rotating thin disks are discussed. Computationally
  useful results for several related escape probability functions are given.
