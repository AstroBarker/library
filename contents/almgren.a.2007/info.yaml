abstract: Convective astrophysical flows, such as those leading up to Type Ia supernovae,
  can be characterized by low Mach numbers (M << 1). One can neglect acoustic waves
  in the modeling of these flows, but must retain compressibility effects due to nuclear
  reactions and background stratification in order to accurately model the convection
  and initial burning. We present here a new algorithm, MAESTRO, that is specifically
  designed for efficient long-time integration leading to ignition. Here, we discuss
  the state of this new algorithm and its application to Type Ia supernovae.
