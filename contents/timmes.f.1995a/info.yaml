abstract: Using the output from a grid of 60 Type II supernova models (Woosley \&
  Weaver 1995) of varying mass (11 approx. less than (M/solar mass) approx. less than
  40) and metallicity (0, 10-4, 0.01, and 1 solar metallicity), the chemical evolution
  of 76 stable isotopes, from hydrogen to zinc, is calculated. The chemical evolution
  calculation employs a simple dynamical model for the Galaxy (infall with a 4 Gyr
  e-folding timescale onto a exponential disk and 1/r2 bulge), and standard evolution
  parameters, such as a Salpeter initial mass function and a quadratic Schmidt star
  formation rate. The theoretical results are compared in detail with observed stellar
  abundances in stars with metallicities in the range -3.0 approx. less than (Fe/H)
  approx. less than 0.0 dex. While our discussion focuses on the solar neighborhood
  where there are the most observations, the supernova rates, an intrinsically Galactic
  quality, are also discussed.
