abstract: 'A simple geometrical model for the emission nebula around SN1987A, whose
  morphology has been likened to Napoleon''s hat, is presented. The model consists
  of a ring and a truncated double cone. When the effects of light travel time are
  included, the model reproduces the important topological structures of the nebula
  and makes detailed quantitative predictions for its future appearance. In particular,
  the hat-shaped northern rim is simply explained as the interaction of the light
  front with the northern cone. To explain the origin of the double cone, it is argued
  that the progenitor of SN1987A was in a binary system: its strong wind, colliding
  with a weaker wind from the companion star, created an asymptotic shock surface
  that was spread out into the required geometry by the rotation of the binary.'
