abstract: OPAL opacities have recently helped to resolve a number of long-standing
  discrepancies between theory and observation. This success has made it important
  to provide the associated equation-of-state (EOS) data. The OPAL EOS is based on
  an activity expansion of the grand canonical partition function of the plasma in
  terms of its fundamental constituents (electrons and nuclei). The formation of composite
  particles and many- body effects on the internal bound states occur naturally in
  this approach. Hence, pressure ionization is a consequence of the theory. In contrast,
  commonly used approaches, all of which are based on minimization of free energy,
  are forced to assert the effect of the plasma on composite particles and must rely
  on an ad hoc treatment of pressure ionization. Another advantage of the OPAL approach
  is that it provides a systematic expansion in the Coulomb coupling parameter that
  includes subtle quantum effects generally not considered in other EOS calculations.  Tables
  have been generated that provide pressure, internal energy, entropy, and a variety
  of derivative quantities. These tables cover a fairly broad range of conditions
  and compositions applicable to general stellar-evolution calculations for stars
  more massive than \texttildelow{}0.8 Msun. An interpolation code is provided along
  with the tables to facilitate their use.
