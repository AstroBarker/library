abstract: The kinetic energy of supernovae (SNe) accompanied by gamma-ray bursts (GRBs)
  tends to cluster near 1052 erg, with 2 \texttimes{} 1052 erg an upper limit to which
  no compelling exceptions are found (assuming a certain degree of asphericity), and
  it is always significantly larger than the intrinsic energy of the GRB themselves
  (corrected for jet collimation). This energy is strikingly similar to the maximum
  rotational energy of a neutron star rotating with period 1 ms. It is therefore proposed
  that all GRBs associated with luminous SNe are produced by magnetars. GRBs that
  result from black hole formation (collapsars) may not produce luminous SNe. X-ray
  flashes, which are associated with less energetic SNe, are produced by neutron stars
  with weaker magnetic field or lower spin.
