abstract: The comoving-frame equation of radiative transfer and moment equations are
  derived in orthogonal, curvilinear coordinates, inclusive of terms of order v/c.
  The equation of radiative transfer, which contains the terms due to the effect of
  curvature of coordinate lines explicitly as well as those of Doppler shift and aberration,
  is the generalization of Castor's equation for spherical symmetry and of Buchler's
  equation for Cartesian coordinates. The moment equations agree with Buchler's.
