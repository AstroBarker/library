abstract: 'The elements germanium (Ge, Z = 32), arsenic (As, Z = 33), and selenium
  (Se, Z = 34) span the transition from charged-particle or explosive synthesis of
  the iron-group elements to neutron-capture synthesis of heavier elements. Among
  these three elements, only the chemical evolution of germanium has been studied
  previously. Here we use archive observations made with the Space Telescope Imaging
  Spectrograph on board the Hubble Space Telescope and observations from several ground-based
  facilities to study the chemical enrichment histories of seven stars with metallicities
  -2.6 <= [Fe/H] <= -0.4. We perform a standard abundance analysis of germanium, arsenic,
  selenium, and several other elements produced by neutron-capture reactions. When
  combined with previous derivations of germanium abundances in metal-poor stars,
  our sample reveals an increase in the [Ge/Fe] ratios at higher metallicities. This
  could mark the onset of the weak s-process contribution to germanium. In contrast,
  the [As/Fe] and [Se/Fe] ratios remain roughly constant. These data do not directly
  indicate the origin of germanium, arsenic, and selenium at low metallicity, but
  they suggest that the weak and main components of the s-process are not likely sources.  Based
  on observations made with the NASA/ESA Hubble Space Telescope, obtained from the
  data archive at the Space Telescope Science Institute. STScI is operated by the
  Association of Universities for Research in Astronomy, Inc., under NASA contract
  NAS 5-26555. This research made use of StarCAT, hosted by the Mikulski Archive at
  the Space Telescope Science Institute (MAST). These data are associated with Programs
  GO-7348, GO-7433, GO-8197, GO-9048, GO-9455, and GO-9804.Based on data obtained
  from the European Southern Observatory (ESO) Science Archive Facility. These data
  are associated with Programs 67.D-0439(A), 074.C-0364(A), 076.B-0055(A), and 080.D-0347(A).This
  research has made use of the Keck Observatory Archive (KOA), which is operated by
  the W.M. Keck Observatory and the NASA Exoplanet Science Institute (NExScI), under
  contract with the National Aeronautics and Space Administration. These data are
  associated with Programs H2aH, H6aH, and H39aH (PI: Boesgaard), N01H (PI: Latham),
  and U11H (PI: Prochaska).This paper includes data taken at The McDonald Observatory
  of The University of Texas at Austin.'
