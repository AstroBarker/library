abstract: 'Aims: We present photometric properties and distance measurements of 252
  high redshift Type Ia supernovae (0.15 < z < 1.1) discovered during the first three
  years of the Supernova Legacy Survey (SNLS). These events were detected and their
  multi-colour light curves measured using the MegaPrime/MegaCam instrument at the
  Canada-France-Hawaii Telescope (CFHT), by repeatedly imaging four one-square degree
  fields in four bands. Follow-up spectroscopy was performed at the VLT, Gemini and
  Keck telescopes to confirm the nature of the supernovae and to measure their redshifts.  Methods:
  Systematic uncertainties arising from light curve modeling are studied, making use
  of two techniques to derive the peak magnitude, shape and colour of the supernovae,
  and taking advantage of a precise calibration of the SNLS fields.  Results: A flat
  LambdaCDM cosmological fit to 231 SNLS high redshift type Ia supernovae alone gives
  Omega\_M = 0.211 $\pm$ 0.034(stat) \$\pm\$ 0.069(sys). The dominant systematic uncertainty
  comes from uncertainties in the photometric calibration. Systematic uncertainties
  from light curve fitters come next with a total contribution of \.026 on Omega\_M.
  No clear evidence is found for a possible evolution of the slope (beta) of the colour-luminosity
  relation with redshift.  Based on observations obtained with MegaPrime/MegaCam,
  a joint project of CFHT and CEA/DAPNIA, at the Canada-France-Hawaii Telescope (CFHT)
  which is operated by the National Research Council (NRC) of Canada, the Institut
  National des Sciences de l''Univers of the Centre National de la Recherche Scientifique
  (CNRS) of France, and the University of Hawaii. This work is based in part on data
  products produced at the Canadian Astronomy Data Centre as part of the Canada-France-Hawaii
  Telescope Legacy Survey, a collaborative project of NRC and CNRS. Based on observations
  obtained at the European Southern Observatory using the Very Large Telescope on
  the Cerro Paranal (ESO Large Programme 171.A-0486 \& 176.A-0589). Based on observations
  (programs GS-2003B-Q-8, GN-2003B-Q-9, GS-2004A-Q-11, GN-2004A-Q-19, GS-2004B-Q-31,
  GN-2004B-Q-16, GS-2005A-Q-11, GN-2005A-Q-11, GS-2005B-Q-6, GN-2005B-Q-7, GN-2006A-Q-7,
  GN-2006B-Q-10) obtained at the Gemini Observatory, which is operated by the Association
  of Universities for Research in Astronomy, Inc., under a cooperative agreement with
  the NSF on behalf of the Gemini partnership: the National Science Foundation (United
  States), the Particle Physics and Astronomy Research Council (United Kingdom), the
  National Research Council (Canada), CONICYT (Chile), the Australian Research Council
  (Australia), CNPq (Brazil) and CONICET (Argentina). Based on observations obtained
  at the W.M. Keck Observatory, which is operated as a scientific partnership among
  the California Institute of Technology, the University of California and the National
  Aeronautics and Space Administration. The Observatory was made possible by the generous
  financial support of the W.M. Keck Foundation. Mark Sullivan acknowledges support
  from the Royal Society.Table 9 is available in electronic form at http://aanda.org
  and at the CDS via anonymous ftp to cdsarc.u-strasbg.fr (130.79.128.5) or via http://cdsarc.u-strasbg.fr/viz-bin/qcat?J/A+A/523/A7.
  Tables 10 and 11 are only available in electronic form at the CDS'
