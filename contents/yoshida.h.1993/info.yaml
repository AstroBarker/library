abstract: In this paper various aspect of symplectic integrators are reviewed. Symplectic
  integrators are numerical integration methods for Hamiltonian systems which are
  designed to conserve the symplectic structure exactly as the original flow. There
  are explicit symplectic schemes for systems of the formH=T(p)+V(q), and implicit
  schemes for general Hamiltonian systems. As a general property, symplectic integrators
  conserve the energy quite well and therefore an artificial damping (excitation)
  caused by the accumulation of the local truncation error cannot occur. Symplectic
  integrators have been applied to the Kepler problem, the motion of minor bodies
  in the solar system and the long-term evolution of outer planets.
