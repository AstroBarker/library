abstract: We present optical narrow-band imaging of multiple rings existing around
  galactic Wolf-Rayet (WR) stars. The existence of multiple rings of material around
  Wolf-Rayet stars clearly illustrates the various phases of evolution that massive
  stars go through. The objects presented here show evidence of a three stage evolution.
  O stars produce an outer ring with the cavity being partially filled by ejecta from
  a red supergiant of luminous blue variable phase. A wind from the Wolf-Rayet star
  then passes into the ejecta materials. A simple model is presented for this three
  stage evolution. Using observations of the size and dynamics of the rings allows
  estimates of time scales for each stage of the massive star evolution. These are
  consistent with recent theoretical evolutionary models. Mass estimates for the ejecta,
  from the model presented, are consistent with previous ring nebula mass estimates
  from IRAS data, showing a number of ring nebulae to have large masses, most of which
  must in be in the form of neutral material. Finally, we illustrate how further observations
  will allow the determination of many of the parameters of the evolution of massive
  stars such as total mass loss, average mass loss rates, stellar abundances, and
  total time spent in each evolutionary phase.
