abstract: The process of star formation from metal-free gas is investigated by following
  the evolution of accreting protostars with emphasis on the properties of massive
  objects. The main aim is to establish the physical processes that determine the
  upper mass limit of the first stars. Although the consensus is that massive stars
  were commonly formed in the first cosmic structures, our calculations show that
  their actual formation depends sensitively on the mass accretion rate and its time
  variation. Even in the rather idealized case in which star formation is mainly determined
  by Macc, the characteristic mass scale of the first stars is rather uncertain. We
  find that there is a critical mass accretion rate Mcrit~=4\texttimes{}10-3Msolaryr-1
  that separates solutions with Macc<Mcrit in which objects with mass >>100 Msolar
  can form, provided there is sufficient matter in the parent clouds, from others
  (Macc>Mcrit) where the maximum mass limit decreases as Macc increases. In the latter
  case, the protostellar luminosity reaches the Eddington limit before the onset of
  hydrogen burning at the center via the CN cycle. This phase is followed by a rapid
  and dramatic expansion of the radius, possibly leading to reversal of the accretion
  flow when the stellar mass is about 100 Msolar. Under a realistic time-dependent
  accretion rate that starts at high values (~10-2 Msolar yr-1) and decreases rapidly
  in the high-mass regime (M\textasteriskcentered>~90 Msolar), the evolution follows
  the case of Macc<Mcrit and accretion can continue unimpeded by radiation forces.
  Thus, the maximum mass is set by consideration of stellar lifetimes rather than
  by protostellar evolution. In this case, the upper limit can be as high as ~600
  Msolar. We consider also the sensitivity of the results to the presence of heavy
  elements with abundances in the range Z=5\texttimes{}10-5 to 5\texttimes{}10-3 Zsolar.
  The main evolutionary features of protostars are similar to those of metal-free
  objects, except that the value of Mcrit increases for metal-enriched protostars.
  Since the accretion rate is lower in a slightly polluted environment, the condition
  Macc<Mcrit is expected to be more easily met. We find that for metallicities below
  ~10-2 Zsolar, where radiation forces onto dust grains in the flow are negligible,
  a slightly metal-rich gas favors continued accretion and the formation of very massive
  stars.
