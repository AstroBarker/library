abstract: White dwarfs (WDs) experience a thermal renaissance when they receive mass
  from a stellar companion in a binary. For accretion rates of less than 10-8Msolaryr-1,
  the freshly accumulated hydrogen/helium envelope ignites in a thermally unstable
  manner that results in a classical nova (CN) outburst and ejection of material.
  We have undertaken a theoretical study of the impact of the accumulating envelope
  on the thermal state of the underlying WD. This has allowed us to find the equilibrium
  WD core temperatures (Tc), the CN ignition masses (Mign), and the thermal luminosities
  for WDs accreting at rates of 10-11 to 10-8 Msolar yr-1. These accretion rates are
  most appropriate for WDs in cataclysmic variables (CVs) of Porb<~7 hr, many of which
  accrete sporadically as dwarf novae. We have included 3He in the accreted material
  at levels appropriate for CVs and find that it significantly modifies the CN ignition
  mass. We compare our results with several others from the CN literature and find
  that the inclusion of 3He leads to lower values of Mign for <M>>~10-10Msolaryr-1
  and that for <M> values below this the particular author's assumption concerning
  Tc, which we calculate consistently, is a determining factor. Initial comparisons
  of our CN ignition masses with measured ejected masses find reasonable agreement
  and point to ejection of material comparable to that accreted.
