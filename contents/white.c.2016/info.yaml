abstract: We present a new general relativistic magnetohydrodynamics (GRMHD) code
  integrated into the Athena++ framework. Improving upon the techniques used in most
  GRMHD codes, ours allows the use of advanced, less diffusive Riemann solvers, in
  particular HLLC and HLLD. We also employ a staggered-mesh constrained transport
  algorithm suited for curvilinear coordinate systems in order to maintain the divergence-free
  constraint of the magnetic field. Our code is designed to work with arbitrary stationary
  spacetimes in one, two, or three dimensions, and we demonstrate its reliability
  through a number of tests. We also report on its promising performance and scalability.
