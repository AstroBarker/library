abstract: The present investigation is concerned with detailed abundance changes resulting
  from the passage of a shock of 10 km/s through an interstellar cloud of initial
  density 100 per cu cm. Two limiting cases are considered. In the first, the postshock
  material is completely shielded from ultraviolet radiation. In the second case,
  the shocked gas is subjected to the interstellar ultraviolet radiation field with
  only 1 mag of extinction. In the shielded cloud, it is found that the molecules
  CO(+), HCO(+), O2, OH, CH(+), CH2(+), CH3(+), CH, CH2, CH3, NH, and NO reach a high
  abundance in the postshock gas, but decrease in abundance after the gas has cooled.
  In the shielded calculation, it is found that the species C, CH4, C2H2, H2O, CO2,
  H2CO, HCN, CN, NH3, CS, and H2CS achieve enhanced abundance and remain at a high
  abundance for the 100,000 years considered in the calculation.
