abstract: 'We present spectroscopic observations of GRB 091127 (z = 0.490) at the
  peak of the putative associated supernova SN 2009nz. Subtracting a late-time spectrum
  of the host galaxy, we isolate the contribution of SN 2009nz and uncover broad features
  typical of nearby gamma-ray-burst-supernovae (GRB-SNe). This establishes unambiguously
  that GRB 091127 was accompanied by a broad-lined Type Ic SN, and links a cosmological
  long burst with a standard energy release (E gamma, iso \approx{} 1.1 \texttimes{}
  1052 erg) to a massive star progenitor. The spectrum of SN 2009nz closely resembles
  that of SN 2006aj, with SN 2003dh also providing an acceptable match, but has significantly
  narrower features than SNe 1998bw and 2010bh, indicative of a lower expansion velocity.
  The photospheric velocity inferred from the Si II lambda6355 absorption feature,
  v ph \approx{} 17, 000 km s-1, is indeed closer to that of SNe 2006aj and 2003dh
  than to the other GRB-SNe. Combining the measured velocity with the light curve
  peak brightness and width, we estimate the following nominal (maximal) explosion
  parameters: M Ni \approx{} 0.35 (0.6) M \&sun;, EK \approx{} 2.3 \texttimes{} 1051
  (8.4 \texttimes{} 1051) erg, and M ej \approx{} 1.4 (3.5) M \&sun;, similar to those
  of SN 2006aj. These properties indicate that SN 2009nz follows a trend of lower
  M Ni for GRB-SNe with lower EK and M ej. Equally important, since GRB 091127 is
  a typical cosmological burst, the similarity of SN 2009nz to SN 2006aj either casts
  doubt on the claim that XRF 060218/SN 2006aj was powered by a neutron star or indicates
  that the nature of the central engine is encoded in the SN properties but not in
  the prompt emission. Future spectra of GRB-SNe at z >~ 0.3 will shed light on the
  full dispersion of SN properties for standard long GRBs, on the relation between
  SNe associated with sub-energetic and standard GRBs, and on a potential dispersion
  in the associated SN types.'
