abstract: The Eddington diffusion approximation to neutrino transport is derived paying
  careful attention to induced absorption and scattering, both elastic and inelastic.
  Rosseland means for energy and neutrino number transport by both scattering and
  absorption are calculated analytically, for arbitrary neutrino degeneracy, eta.
  In neutrino transport out of a stellar core, the neglect of neutrino inelasticity
  in scattering is justified, except during the initial neutrino thermalization phase.
  Two appendices treat (1) the equation of state of a neutrino-antineutrino gas and
  (2) exact expressions for even and odd combinations of the Fermi integrals Fk (eta).
