abstract: It is shown here that the behavior of nuclear burning on accreting neutron
  stars depends on the mass accretion rate per unit area sigma-dot, the temperature
  T, and the column density of accreted matter sigma, and is thus intrinsically a
  three-dimensional problem. The concepts of a nuclear fuel surface and an ignition
  surface in (sigma-dot, T, sigma) space is introduced. It is shown that certain cuts
  taken through the ignition surface correspond to particular physical situations.
  It is found that at high temperatures a succession of hydrogen flashes leads eventually
  to a pure helium flash. At low temperatures, compressional heating completely determines
  the burst behavior. Burst sources are expected to show highly erratic behavior if
  they lie near the boundaries of the H and He ignition surfaces, resolving a major
  discrepancy between the thermonuclear flash model and observations.
