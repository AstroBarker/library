abstract: 'The accelerating expansion of the Universe, and the need for dark energy,
  were inferred from observations of type Ia supernovae. There is a consensus that
  type Ia supernovae are thermonuclear explosions that destroy carbon-oxygen white
  dwarf stars that have accreted matter from a companion star, although the nature
  of this companion remains uncertain. These supernovae are thought to be reliable
  distance indicators because they have a standard amount of fuel and a uniform trigger:
  they are predicted to explode when the mass of the white dwarf nears the Chandrasekhar
  mass of 1.4 solar masses (Msolar). Here we show that the high-redshift supernova
  SNLS-03D3bb has an exceptionally high luminosity and low kinetic energy that both
  imply a super-Chandrasekhar-mass progenitor. Super-Chandrasekhar-mass supernovae
  should occur preferentially in a young stellar population, so this may provide an
  explanation for the observed trend that overluminous type Ia supernovae occur only
  in `young'' environments. As this supernova does not obey the relations that allow
  type Ia supernovae to be calibrated as standard candles, and as no counterparts
  have been found at low redshift, future cosmology studies will have to consider
  possible contamination from such events.'
