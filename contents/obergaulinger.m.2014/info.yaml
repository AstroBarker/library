abstract: Observations in all electromagnetic bands show that many supernova remnants
  (SNRs) have a very aspherical shape. This can be the result of asymmetries in the
  supernova explosion or a clumpy circumstellar medium. We study the generation of
  inhomogeneities and the mixing of elements arising from these two sources in multidimensional
  hydrodynamic simulations of the propagation of a supernova blast wave into a cloudy
  environment. We model a specific SNR, Vela Jr (RX J0852.0-4622). By comparing our
  results with recent observations, we can constrain the properties of the explosion.
  We find that a very energetic explosion of several 1051 erg occurring roughly about
  800 years ago is consistent with the shape and emission of the SNR, as well as a
  supernova with an energy closer to the canonical value of 1051 erg a few thousand
  years ago.
