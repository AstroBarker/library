abstract: The possible presence of massive black holes in the nuclei of galaxies has
  been suggested many times. In addition, there is considerable observational evidence
  for high stellar densities in these nuclei. I show that the tidal breakup of stars
  passing within the Roche limit of a black hole initiates a chain of events that
  may explain many of the observed principal characteristics of QSOs and the nuclei
  of Seyfert galaxies.
