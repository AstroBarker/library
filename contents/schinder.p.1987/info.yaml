abstract: The results of numerical integrations of the rates and emissivities of the
  photo, pair, and plasma neutrino emission mechanisms in the Weinberg-Salam theory
  of the weak interaction are presented. The range of densities from 10 to 10 to the
  14th g/cu cm and the temperature range from 10 to the 8th to 10 to the 11th K are
  considered. Fitting formulas, similar to those provided by Beaudet et al. (1967),
  which reproduce the authors' numerical result for the total emissivity to within
  20 percent in the temperature range from 10 to the 8.2 to 10 to the 11th K, are
  presented.
