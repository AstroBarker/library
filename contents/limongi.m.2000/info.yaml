abstract: We present the evolutionary properties of a set of massive stellar models
  (namely 13, 15, 20, and 25 Msolar) from the main-sequence phase up to the onset
  of the iron core collapse. All these models have initial solar chemical composition,
  i.e., Y=0.285 and Z=0.02. A 179 isotope network, extending from neutron up to 68Zn
  and fully coupled to the evolutionary code has been adopted from the carbon burning
  onward. Our results are compared, whenever possible, to similar computations available
  in literature.
