abstract: We have studied detailed nucleosynthesis in the shocked surface layers of
  an oxygen-neon-magnesium core-collapse supernova with an eye to determining whether
  the conditions are suitable for r-process nucleosynthesis. We find no such conditions
  in an unmodified model, but do find overproduction of N = 50 nuclei (previously
  seen in early neutron-rich neutrino winds) in amounts that, if ejected, would pose
  serious problems for Galactic chemical evolution.
