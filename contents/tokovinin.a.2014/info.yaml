abstract: Data on the multiplicity of F- and G-type dwarf stars within 67 pc of the
  Sun are presented. This distance-limited sample based on the Hipparcos catalog contains
  4847 primary stars (targets) with 0.5 < V - IC < 0.8 and is >90\% complete. There
  are 2196 known stellar pairs; some of them belong to 361 hierarchical systems from
  triples to quintuples. Models of companion detection by radial velocity, astrometric
  acceleration, direct resolution, and common proper motion are developed. They serve
  to compute completeness for each target, using the information on its coverage collected
  here. About 80\% of companions to the primary stars are detected, but the census
  of subsystems in the secondary components is only about 30\%. Masses of binary components
  are estimated from their absolute magnitudes or by other methods; the periods of
  wide pairs are evaluated from their projected separations. A third of binaries with
  periods shorter than ~100 yr are spectroscopic and/or astrometric pairs with yet
  unknown periods and mass ratios. These data are used in the accompanying Paper II
  to derive unbiased statistics of hierarchical multiple systems.
