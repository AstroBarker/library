abstract: We consider the decay of an initial discontinuity in a polytropic gas in
  a Minkowski space-time (the special relativistic Riemann problem). In order to get
  a general analytical solution for this problem, we analyse the properties of the
  relativistic flow across shock waves and rarefactions. As in classical hydrodynamics,
  the solution of the Riemann problem is found by solving an implicit algebraic equation
  which gives the pressure in the intermediate states. The solution presented here
  contains as a particular case the special relativistic shock-tube problem in which
  the gas is initially at rest. Finally, we discuss the impact of this result on the
  development of high-resolution shock-capturing numerical codes to solve the equations
  of relativistic hydrodynamics.
