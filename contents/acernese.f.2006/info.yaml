abstract: We report on the status of the Virgo detector, under commissioning. We will
  focus on the last year's activity. The two commissioning runs performed during 2005
  allowed us to reach a sensitivity of h ~ 6 \texttimes{} 10-22. The data obtained
  during the runs were used to test a few data analysis algorithms, namely coalescing
  binaries and burst searches. The main improvements made on the detector during this
  year will be described, as well as the plans and activities foreseen in the coming
  years.
