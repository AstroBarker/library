abstract: The present effort to develop an automatic adaptive mesh-refinement (AMR)
  strategy for the solution of hyperbolic conservation laws in two dimensions gives
  attention to the presence of discontinuities in the solution and the effects of
  discontinuities in the mesh upon them; an attempt is also made to minimize memory
  and CPU requirements. The MR code obtained consists of 3000 lines of FORTRAN, and
  has been applied to transonic flow computations in conjunction with FLO52, as well
  as to combustion problem computations involving a simple induction-time model for
  chemistry. The most difficult problems are solved by combining several adaptive
  techniques.
