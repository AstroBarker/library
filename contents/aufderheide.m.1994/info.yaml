abstract: A search is made for the most important electron captures and beta-decays
  after core silicon burning in massive stars. A nuclear statistical equilibrium code
  is used to compute isotopic abundances. Electron capture and beta-decay rates are
  estimated for the 150 most abundant isotopes in a simplified fashion which generally
  includes the strongest transitions. These estimates are made for nuclei in the fp-shell
  and use techniques similar to Fuller, Fowler, \& Newman (1982a), and are compared
  to them. The general behavior of the rate of change of Ye is examined. These methods
  are then used to follow a typical stellar trajectory, seeking the most important
  weak interactions during the formation of the iron core. Ranked lists of nuclei
  are given, to prioritize more detailed studies on individual nuclei. Beta-decays
  are found to ben an important modification to the evolution below the rate of change
  of Ye approx. = 0.46 as the core approaches a state of dynamic equilibrium between
  electron captures and beta-decays.
