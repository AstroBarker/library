abstract: 'We construct an extensive set of equilibrium sequences of rotating polytropes
  in general relativity. We determine a number of important physical parameters of
  such stars, including maximum mass and maximum spin rate. The stability of the configurations
  against quasi-radial perturbations is diagnosed. Two classes of evolutionary sequences
  of fixed rest mass and entropy are explored: normal sequences which behave very
  much like Newtonian evolutionary sequences, and supramassive sequences which exist
  solely because of relativistic effects. Dissipation leading to loss of angular momentum
  causes a star to evolve in a quasi-stationary fashion along an evolutionary sequence.
  Supramassive sequences evolve towards eventual catastrophic collapse to a black
  hole. Prior to collapse, the star must spin up as it loses angular momentum, an
  effect which may provide an observational precursor to gravitational collapse to
  a black hole.'
