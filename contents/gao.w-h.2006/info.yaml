abstract: We suggest a short-lived supermassive magnetar model to account for the
  X-ray flares following short gamma-ray bursts. In this model the central engine
  of the short gamma-ray bursts is a supermassive millisecond magnetar, formed in
  coalescence of double neutron stars. The X-ray flares are powered by the dipole
  radiation of the magnetar. When the magnetar has lost a significant part of its
  angular momentum, it collapses to a black hole and the X-ray flares cease abruptly.
