abstract: Approximate solutions are presented for the transfer of radiation through
  spherically symmetric gas clouds surrounding a point source of X-rays. The approach
  is similar to that of Tarter and Salpeter (1969) except that heating by Compton
  scattering and the Auger effect is included. The temperature and ionization structure
  are sensitive to the source spectrum, and the solutions are not unique if soft X-rays
  are deficient. The emergent spectrum is rich in optical, ultraviolet, and X-ray
  emission lines. The radiation force due to photoelectric absorption of X-rays may
  exceed the force due to Compton scattering by a factor of order 10 for the radiation
  fields and densities likely to be encountered in galactic binary X-ray sources.
