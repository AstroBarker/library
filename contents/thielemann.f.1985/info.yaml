abstract: The authors present results of detailed nucleosynthesis calculations for
  (hydrostatic) core Ne to Si burning, with a complete reaction network. The extensive
  network (254 nuclear species) is chosen to properly follow the small reaction flows
  and low abundances which may affect the neutron excess, which is of great importance
  for the structure and evolution of the core up to an including collapse. The shell
  burning conditions in a presupernova are simulated and a preliminary prediction
  given for nucleosynthesis yields of a 20 - 25 M\_sun; star (8 M\_sun; original He
  core). Varying the 12C(alpha,gamma)16O rate within the present uncertainties can
  remove problems with predicted abundance yields (compared to solar).
