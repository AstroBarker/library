abstract: Observations are providing increasingly detailed quantitative information
  about the accretion flows that power such high energy systems as X-ray binaries
  and Active Galactic Nuclei. These observations have been modeled in some detail
  by a variety of accretion scenarios, but such models rely on unavoidable assumptions
  such as regular flow geometry and a simple, parameterized stress. Global numerical
  simulations offer a way to investigate the basic physical dynamics of accretion
  flows without these assumptions. We are now carrying out fully three-dimensional
  general relativistic magnetohydrodynamic simulations of time-dependent inflows into
  Kerr black holes. The results from recent global simulations of black hole accretion
  disks will be reviewed, and some implications of those results for observations
  will be discussed.
