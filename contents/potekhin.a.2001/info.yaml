abstract: The thermal structure of neutron stars with magnetized envelopes is studied
  using modern physics input. The relation between the internal (Tint) and local surface
  temperatures is calculated and fitted by analytic expressions for magnetic field
  strengths B from 0 to 1016 G and arbitrary inclination of the field lines to the
  surface. The luminosity of a neutron star with dipole magnetic field is calculated
  and fitted as a function of B, Tint, stellar mass and radius. In addition, we simulate
  cooling of neutron stars with magnetized envelopes. In particular, we analyse ultramagnetized
  envelopes of magnetars and also the effects of the magnetic field of the Vela pulsar
  on the determination of critical temperatures of neutron and proton superfluids
  in its core.
