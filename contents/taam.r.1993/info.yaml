abstract: The evolution of a neutron star undergoing a series of thermonuclear flashes
  in its accreted hydrogen-rich layer has been numerically followed to determine the
  effects of the history of the neutron star's thermal and compositional structure
  on the properties of the emitted X-ray bursts. Burst characteristics are studied
  for a range of mass accretion rates, CNO abundances in the accreted matter, and
  initial thermal states of the underlying neutron star core; the bursts exhibit erratic
  behavior for low CNO metal abundances and cool neutron star cores, with the burst
  recurrence time scales varying by 1-2 orders of magnitude. There is typically a
  continued presence of a substantial amount of unburnt hydrogen in the accreted layer
  throughout the series of the X-ray burst events. Convective mixing during the quiescent
  phase leads to the inward transport of helium to high densities and eventually to
  the initiation of the next outburst. The resulting bursts can be weak and, in such
  cases, are characterized by short recurrence time scales (1-2 hr), low peak luminosities
  (0.1-0.2 times the Eddington value), and low alpha-values (about 20).
