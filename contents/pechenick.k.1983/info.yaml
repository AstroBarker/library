abstract: A simple model is presented for including gravity in the light curves of
  slowly rotating neutron stars whose emission is confined to circular antipodal polar
  caps. Both thermal and near thermal cases are condidered. It is found that for hot
  polar caps and typical neutron star parameters the light curves are essentially
  flat as a result of gravitational effects. If, however, photon emission is beamed,
  structure is, in general, restored to the light curve, depending on the nature of
  the beaming. For the most relativistic neutron stars it is found that there can
  be sharp peaks in the light curve induced solely by the gravitational lensing effect
  of the star. Results for a single hot spot are also presented. In an appendix the
  tidal deformation of an initially circular cone of light rays is derived.
