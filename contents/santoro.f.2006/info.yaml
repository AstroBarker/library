abstract: 'The influence of the first stars on the formation of second-generation
  objects at high redshift may be determined, in part, by their metal enrichment of
  surrounding gas. At a critical metallicity, Zcrit, primordial gas cools more efficiently
  by fine-structure lines of [C II] (157.74 mum), [O I] (63.18 mum, 145.5 mum), [Si
  II] (34.8 mum), and [Fe II] (25.99 mum, 35.35 mum) than by H I or H2 emission. This
  cooling may alter the process of fragmentation into smaller units. We study the
  time-dependent cooling of primordial gas enriched by heavy elements from early massive
  stars, particularly O, Si, and Fe. We define Zcrit as the point when the total cooling
  rate by metals plus H2 equals the adiabatic compressional heating. We explore two
  metallicity scenarios: (1) a single metallicity for all heavy elements and (2) individual
  metallicities (ZC, ZO, ZSi, and ZFe) from theoretical supernova yields. For dense
  gas (n>=103 cm-3) with metals in relative solar abundances, fragmentation occurs
  at Zcrit~10-3.5 Zsolar. However, for lower density gas (n=1-100 cm-3), particularly
  in halos enriched in Si, O, and Fe, we find Zcrit~0.1\%-1\% Zsolar. The critical
  metallicity approaches a minimum value at high n set by efficient LTE cooling, with
  thermalized level populations of fine-structure states and H2 rotational states
  (J=2 and J=3). Primordial clouds of 108 Msolar at 200 K are detectable in redshifted
  fine-structure lines, with far-infrared fluxes between 10-22 and 10-21 W m-2. For
  metallicities ZO~10-3 and molecular fractions fH2~10-3, the fine-structure emission
  lines of [O I], [Si II], and [Fe II] could be 102-103 times stronger than the H2
  rotational lines at 28.22 mum (J=2-->0) and 17.03 mum (J=3-->1).'
