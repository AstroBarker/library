abstract: Results of 2D numerical simulations of thermonuclear burning propagation
  in a helium layer on a neutron star surface using the Euler-Lagrange TIGR-3T code
  are presented. This process is crucial for the development of type I X-ray bursts.
  Ignition and thermonuclear burning propagation are fairly easy to obtain when simulating
  a layer with a density at the bottom of 1.75 \texttimes{} 108 g cm-3. Such a simulation
  allows it to be compared with previous simulations based on other codes, including
  the simulation based on the MPM code described previously. However, this density
  is two orders of magnitude higher than can be obtained in observed bursters. The
  implementation of efficient numerical methods for the description of heat conduction
  and turbulence in the TIGR-3T code has allowed simulations to be performed for a
  layer with a density at the bottom of 1.8 \texttimes{} 107 g cm-3. The fulfilment
  of certain conditions on the size and shape of the initial temperature perturbation
  is required for the propagation of thermonuclear burning. Simulations reveal a peculiar
  burning propagation mechanism through compression of the layer ahead of the burning
  front by the matter transferred above the free surface.
