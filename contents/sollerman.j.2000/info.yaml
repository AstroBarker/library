abstract: We present observations of the peculiar supernova SN 1998bw, which was probably
  associated with GRB 980425. The photometric and spectroscopic evolution is monitored
  up to 500 days past explosion. We also present modeling based on spherically symmetric,
  massive progenitor models and very energetic explosions. The models allow line identification
  and clearly show the importance of mixing. From the late light curves, we estimate
  that ~0.3-0.9 Msolar of ejected 56Ni is required to power the supernova. Based on
  observations collected at the European Southern Observatory, La Silla and Paranal,
  Chile.
