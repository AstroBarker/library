abstract: 'We report on a method, PUSH, for triggering core-collapse supernova (CCSN)
  explosions of massive stars in spherical symmetry. This method provides a framework
  to study many important aspects of core collapse supernovae: the effects of the
  shock passage through the star, explosive supernova nucleosynthesis and the progenitor-remnant
  connection. Here we give an overview of the method, compare the results to multi-dimensional
  simulations and investigate the effects of the progenitor and the equation of state
  on black hole formation.'
