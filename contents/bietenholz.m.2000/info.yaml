abstract: The nucleus of the nearby spiral galaxy M81 was observed at 8.4 GHz with
  a global VLBI array at 20 epochs over 4.5 yr, with a linear resolution at the source
  of about 2000 AU, or 0.01 pc. Phase-referenced mapping with respect to the geometric
  center of SN 1993J in the same galaxy enabled us to find, with a standard error
  of about 600 AU, a stationary point in the source southeast of the brightness peak.
  We identify this point as the location of the core and the putative black hole at
  the gravitational center of the galaxy. The 2 sigma upper bound on the core's average
  velocity on the sky is <=40 muas yr-1, or <=730 km s-1 (relative to the center of
  SN 1993J, in excess of galactic rotation). A short, one-sided jet extends toward
  the northeast from the core, in projection approximately in line with the rotation
  axis of the galaxy, and toward the well-known extended emission 1 kpc farther out.
  The orientation of the jet varies smoothly, with timescales of about 1 yr and an
  rms of 6 deg around its mean position angle of 50 deg. Occasionally the jet appears
  to bend to the east. The length of the jet is only about 1 mas (3600 AU) and varies
  with an rms of about 20\% from epoch to epoch. The inferred speeds are below 0.08c.
  The total flux density of the core jet varies erratically, changing on occasion
  by a factor of 2 over a few weeks, without any significant changes in the source
  size and orientation. The inferred velocity of the plasma flow is greater than 0.25c.
  The results are consistent with a model in which plasma condensations with short
  lifetimes are ejected relativistically from the core on a timescale of less than
  a few weeks. The condensations travel along a tube whose pattern and geometry are
  also variable but only on a timescale of about 1 yr. The central engine of M81 has
  qualitative similarities to those of powerful active galactic nuclei of radio galaxies
  and quasars and may also represent in power and size a scaled-up version of the
  largely hidden nucleus in our own Galaxy.
