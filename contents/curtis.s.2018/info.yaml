abstract: In a previously presented proof-of-principle study, we established a parametrized
  spherically symmetric explosion method (PUSH) that can reproduce many features of
  core-collapse supernovae for a wide range of pre-explosion models. The method is
  based on the neutrino-driven mechanism and follows collapse, bounce and explosion.
  There are two crucial aspects of our model for nucleosynthesis predictions. First,
  the mass cut and explosion energy emerge simultaneously from the simulation (determining,
  for each stellar model, the amount of Fe-group ejecta). Second, the interactions
  between neutrinos and matter are included consistently (setting the electron fraction
  of the innermost ejecta). In the present paper, we use the successful explosion
  models from Ebinger et al. (2018) which include two sets of pre-explosion models
  at solar metallicity, with combined masses between 10.8 and 120 M$_{\odot}$. We
  perform systematic nucleosynthesis studies and predict detailed isotopic yields.
  The resulting \$^{56}\$Ni ejecta are in overall agreement with observationally derived
  values from normal core-collapse supernovae. The Fe-group yields are also in agreement
  with derived abundances for metal-poor star HD84937. We also present a comparison
  of our results with observational trends in alpha element to iron ratios.
