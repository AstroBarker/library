abstract: We have measured radiative lifetimes for selenium and tellurium resonance
  levels by using short pulse laser excitation in differentially heated resonance
  cells. We obtained tau(3 S 1 Se I)=2.9(5) ns and tau(3 S 1 Te I)=3.1(5) ns, which
  together with branching ratio values given by Ubelis and Berzinsh yield the absorption
  oscillator strength f abs(Se I, 196.0 nm)=0.074(16) and f abs(Te I, 214.3 nm)=0.098(17).
