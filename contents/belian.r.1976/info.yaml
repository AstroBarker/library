abstract: The letter reports the discovery by the two Vela 5 satellites of 10 intense
  X-ray flares from the same region of the sky centered in the constellation Norma.
  The results were obtained from data records covering a 15-month period and which
  showed 20 count-rate enhancements at least 15 sigmas above the background level.
  It is noted that the observations are consistent with short X-ray bursts from a
  single object and that the most intense flare was 0.75 of the quiet-phase intensity
  of Sco X-1. The observed hardness ratios are found to vary considerably from event
  to event and to be significantly higher than the typical values observed for Sco
  X-1. It is suggested that if a single source is assumed and if the flares occur
  randomly in time, then flares of the type detected by the Vela satellites occur
  at least 30 times per year.
