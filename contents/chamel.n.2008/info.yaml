abstract: The physics of neutron star crusts is vast, involving many different research
  fields, from nuclear and condensed matter physics to general relativity. This review
  summarizes the progress, which has been achieved over the last few years, in modeling
  neutron star crusts, both at the microscopic and macroscopic levels. The confrontation
  of these theoretical models with observations is also briefly discussed.
