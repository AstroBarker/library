abstract: 'In this article we develop an improved version of the classical fifth-order
  weighted essentially non-oscillatory finite difference scheme of [G.S. Jiang, C.W.
  Shu, Efficient implementation of weighted ENO schemes, J. Comput. Phys. 126 (1996)
  202-228] (WENO-JS) for hyperbolic conservation laws. Through the novel use of a
  linear combination of the low order smoothness indicators already present in the
  framework of WENO-JS, a new smoothness indicator of higher order is devised and
  new non-oscillatory weights are built, providing a new WENO scheme (WENO-Z) with
  less dissipation and higher resolution than the classical WENO. This new scheme
  generates solutions that are sharp as the ones of the mapped WENO scheme (WENO-M)
  of Henrick et al. [A.K. Henrick, T.D. Aslam, J.M. Powers, Mapped weighted essentially
  non-oscillatory schemes: achieving optimal order near critical points, J. Comput.
  Phys. 207 (2005) 542-567], however with a 25\% reduction in CPU costs, since no
  mapping is necessary. We also provide a detailed analysis of the convergence of
  the WENO-Z scheme at critical points of smooth solutions and show that the solution
  enhancements of WENO-Z and WENO-M at problems with shocks comes from their ability
  to assign substantially larger weights to discontinuous stencils than the WENO-JS
  scheme, not from their superior order of convergence at critical points. Numerical
  solutions of the linear advection of discontinuous functions and nonlinear hyperbolic
  conservation laws as the one dimensional Euler equations with Riemann initial value
  problems, the Mach 3 shock-density wave interaction and the blastwave problems are
  compared with the ones generated by the WENO-JS and WENO-M schemes. The good performance
  of the WENO-Z scheme is also demonstrated in the simulation of two dimensional problems
  as the shock-vortex interaction and a Mach 4.46 Richtmyer-Meshkov Instability (RMI)
  modeled via the two dimensional Euler equations.'
