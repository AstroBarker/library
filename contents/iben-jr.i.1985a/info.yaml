abstract: The evolution of an isolated carbon-oxygen degenerate dwarf which has a
  surface layer initially containing hydrogen and helium and is of mass 0.6 M\_sun;
  is followed from the planetary nebula nucleus stage at a luminosity of 5\texttimes{}103L\_sun;
  until luminosity drops to 10-5L\_sun;. Wind mass loss and accretion from the interstellar
  medium are neglected. Shortly after the model reaches a maximum surface temperature
  of about 1.5\texttimes{}105K, CN cycle reactions cease abruptly to contribute dominantly
  to surface luminosity, which drops to below 100 L\_sun;. However, hydrogen-burning
  reactions continue to take place. The effect of diffusion induced by gravity forces
  and by composition gradients on the contribution of hydrogen burning to surface
  luminosity is studied. The total amount of hydrogen left in surface layers after
  1010yr of cooling is about 1.4\texttimes{}10-4M\_sun;, compared with a value of
  about 2.1\texttimes{}10-4M\_sun; obtaining at the point of maximum surface temperature.
  Thus, diffusion and nuclear burning cannot reduce the mass of hydrogen in surface
  layers to below 10-7M\_sun;, as demanded by a current interpretation of the light
  variations of ZZ Ceti stars.
