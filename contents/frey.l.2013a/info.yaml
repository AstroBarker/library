abstract: We have entered the era of explosive transient astronomy, in which current
  and upcoming real-time surveys such as the Large Synoptic Survey Telescope, the
  Palomar Transient Factory, and the Panoramic Survey Telescope and Rapid Response
  System will detect supernovae in unprecedented numbers. Future telescopes such as
  the James Webb Space Telescope may discover supernovae from the earliest stars in
  the universe and reveal their masses. The observational signatures of these astrophysical
  transients are the key to unveiling their central engines, the environments in which
  they occur, and to what precision they will pinpoint cosmic acceleration and the
  nature of dark energy. We present a new method for modeling supernova light curves
  and spectra with the radiation hydrodynamics code RAGE coupled with detailed monochromatic
  opacities in the SPECTRUM code. We include a suite of tests that demonstrate how
  the improved physics and opacities are indispensable to modeling shock breakout
  and light curves when radiation and matter are tightly coupled.
