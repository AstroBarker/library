abstract: The authors present UBVRI photometry of the Type II Supernova 1987A in the
  Large Magellanic Cloud for the first 177 days since outburst. This photometry is
  used to construct the bolometric luminosity and effective-temperature evolution
  of 1987A. The authors find that 1987A decreased in luminosity very rapidly over
  the first 8 days, slowly increased in luminosity up until day 90, and since day
  120 has been declining exponentially at 0.010 mag per day. The general shape of
  the bolometric light curve is close to the predicted curve based on radioactive
  decay of 56Co in the remnant. The authors compare 1987A with other Type II SNe,
  and find that although Type II's show a large range in intrinsic luminosity over
  the first 100 days, their subsequent luminosity evolution is much more uniform.
