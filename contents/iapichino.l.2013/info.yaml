abstract: The injection of turbulence in the circumgalactic medium at redshift z =
  2 is investigated using the mesh-based hydrodynamic code ENZO and a sub-grid-scale
  (SGS) model for unresolved turbulence. Radiative cooling and heating by a uniform
  Ultraviolet (UV) background are included in our runs and compared with the effect
  of turbulence modelling. Mechanisms of gas exchange between galaxies and the surrounding
  medium, as well as metal enrichment, are not taken into account, and turbulence
  is here driven solely by structure formation (mergers and shocks). We find that
  turbulence, both at resolved and SGS scales, impacts mostly the warm-hot intergalactic
  medium (WHIM), with temperature between 105 and 107 K, mainly located around collapsed
  and shock-heated structures, and in filaments. Typical values of the ratio of turbulent
  to thermal pressure is 0.1 in the WHIM, corresponding to a volume-weighted average
  of the SGS turbulent to thermal Doppler broadening bt/btherm = 0.26, on length scales
  below the grid resolution of 25 kpc h- 1. In the diffuse intergalactic medium, defined
  in a range of baryon overdensity delta between 1 and 50, the importance of turbulence
  is smaller, but grows as a function of gas density, and the Doppler broadening ratio
  is fitted by the function bt/btherm = 0.023 \texttimes{} delta0.58.
