abstract: 'We present 1210 Johnson/Cousins B, V, R, and I photometric observations
  of 22 recent Type Ia supernovae (SNe Ia): SNe 1993ac, 1993ae, 1994M, 1994S, 1994T,
  1994Q, 1994ae, 1995D, 1995E, 1995al, 1995ac, 1995ak, 1995bd, 1996C, 1996X, 1996Z,
  1996ab, 1996ai, 1996bk, 1996bl, 1996bo, and 1996bv. Most of the photometry was obtained
  at the Fred Lawrence Whipple Observatory of the Harvard-Smithsonian Center for Astrophysics
  in a cooperative observing plan aimed at improving the database for SNe Ia. The
  redshifts of the sample range from cz=1200 to 37,000 km s^-1 with a mean of cz=7000
  km s^-1.'
