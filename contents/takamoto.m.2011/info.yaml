abstract: We present a new numerical method of special relativistic resistive magnetohydrodynamics
  with scalar resistivity that can treat a range of phenomena, from non-relativistic
  to relativistic (shock, contact discontinuity, and Alfv{\'e}n wave). The present
  scheme calculates the numerical flux of fluid by using an approximate Riemann solver
  and electromagnetic field by using the method of characteristics. Since this scheme
  uses appropriate characteristic velocities, it is capable of accurately solving
  problems that cannot be approximated as ideal magnetohydrodynamics and whose characteristic
  velocity is much lower than the velocity of light. The numerical results show that
  our scheme can solve the above problems as well as nearly ideal MHD problems. Our
  new scheme is particularly well suited to systems with initially weak magnetic field
  and mixed phenomena of relativistic and non-relativistic velocity, for example magnetorotational
  instability in an accretion disk and super Alfv{\'e}nic turbulence.
