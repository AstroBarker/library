abstract: We present near-IR color-magnitude diagrams and physical parameters for
  a sample of 24 Galactic globular clusters toward the bulge. In this paper we discuss
  the properties of 12 new clusters (out of the 24) in addition to those previously
  studied and published by our group. The compilation includes measurements of the
  cluster reddening, distance, photometric metallicity, horizontal branch red clump,
  and red giant branch morphological (e.g., mean ridgelines) and evolutionary (e.g.,
  bump and tip) features. The compilation is available in electronic form on the World
  Wide Web, and it will be updated regularly.  Based on data taken at the ESO New
  Technology Telescope, within the observing programs 73.D-0313, 75.D-0372, and 77.D-0757.
