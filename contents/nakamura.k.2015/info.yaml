abstract: We present an overview of two-dimensional (2D) core-collapse supernova simulations
  employing a neutrino transport scheme by the isotropic diffusion source approximation.
  We study 101 solar-metallicity, 247 ultra metal-poor, and 30 zero-metal progenitors
  covering zero-age main sequence mass from 10.8 M\&sun; to 75.0 M\&sun;. Using the
  378 progenitors in total, we systematically investigate how the differences in the
  structures of these multiple progenitors impact the hydrodynamics evolution. By
  following a long-term evolution over 1.0 s after bounce, most of the computed models
  exhibit neutrino-driven revival of the stalled bounce shock at \texttildelow{}200-800
  ms postbounce, leading to the possibility of explosion. Pushing the boundaries of
  expectations in previous one-dimensional studies, our results confirm that the compactness
  parameter xi that characterizes the structure of the progenitors is also a key in
  2D to diagnosing the properties of neutrino-driven explosions. Models with high
  xi undergo high ram pressure from the accreting matter onto the stalled shock, which
  affects the subsequent evolution of the shock expansion and the mass of the protoneutron
  star under the influence of neutrino-driven convection and the standing accretion-shock
  instability. We show that the accretion luminosity becomes higher for models with
  high xi, which makes the growth rate of the diagnostic explosion energy higher and
  the synthesized nickel mass bigger. We find that these explosion characteristics
  tend to show a monotonic increase as a function of the compactness parameter xi.
