abstract: Ultraviolet, optical, and near-infrared photometry and optical spectroscopy
  of the broad-lined Type Ic supernova (SN) 2009bb are presented, following the flux
  evolution from -10 to +285 days past B-band maximum. Thanks to the very early discovery,
  it is possible to place tight constraints on the SN explosion epoch. The expansion
  velocities measured from near maximum spectra are found to be only slightly smaller
  than those measured from spectra of the prototype broad-lined SN 1998bw associated
  with GRB 980425. Fitting an analytical model to the pseudobolometric light curve
  of SN 2009bb suggests that 4.1 $\pm$ 1.9 M sun of material was ejected with 0.22
  \$\pm\$ 0.06 M sun of it being 56Ni. The resulting kinetic energy is 1.8 \$\pm\$
  0.7 \texttimes{} 1052 erg. This, together with an absolute peak magnitude of M  B  =
  -18.36 \$\pm\$ 0.44, places SN 2009bb on the energetic and luminous end of the broad-lined
  Type Ic (SN Ic) sequence. Detection of helium in the early time optical spectra
  accompanied with strong radio emission and high metallicity of its environment makes
  SN 2009bb a peculiar object. Similar to the case for gamma-ray bursts (GRBs), we
  find that the bulk explosion parameters of SN 2009bb cannot account for the copious
  energy coupled to relativistic ejecta, and conclude that another energy reservoir
  (a central engine) is required to power the radio emission. Nevertheless, the analysis
  of the SN 2009bb nebular spectrum suggests that the failed GRB detection is not
  imputable to a large angle between the line-of-sight and the GRB beamed radiation.
  Therefore, if a GRB was produced during the SN 2009bb explosion, it was below the
  threshold of the current generation of gamma-ray instruments.  This paper includes
  data gathered with the 6.5-m Magellan Telescopes located at Las Campanas Observatory,
  Chile.  Based on observations obtained at the Gemini Observatory, Cerro Pachon,
  Chile (Gemini Programs GS-2009A-Q-17 and GS-2009A-Q-43).
