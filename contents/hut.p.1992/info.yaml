abstract: Recent observations have shown that globular clusters contain a substantial
  number of binaries most of which are believed to be primordial. We discuss different
  successful optical search techniques, based on radial-velocity variables, photometric
  variables, and the positions of stars in the color-magnitude diagram. In addition,
  we review searches in other wavelengths, which have turned up low-mass X-ray binaries
  and more recently a variety of radio pulsars. On the theoretical side, we give an
  overview of the different physical mechanisms through which individual binaries
  evolve. We discuss the various simulation techniques which recently have been employed
  to study the effects of a primordial binary population, and the fascinating interplay
  between stellar evolution and stellar dynamics which drives globular-cluster evolution.
