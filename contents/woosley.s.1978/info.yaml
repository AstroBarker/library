abstract: The nucleosynthetic origin of the rare proton-rich isotopes, usually called
  'p-process' isotopes, is examined. A particularly interesting context for this synthesis
  is found to be explosive events characterized by peak temperatures in the range
  from 2 to 3 billion K. At these temperatures a series of photodisintegration reactions
  operating upon a distribution of r- and s-process seeds produces an abundance pattern
  that displays striking similarities to that of the p-process nuclei in the solar
  system. The large proton densities usually required for such synthesis are not needed.
  Requisite conditions for this model are expected to occur naturally in those zones
  of supernovae that have experienced helium and perhaps carbon burning prior to explosion.
  Implications for supernova structure, presupernova evolution, and cosmochronology
  are discussed, and a critical discussion of other current p-process models is presented.
