abstract: Recent work published by Antonucci and Miller in 1985 has demonstrated the
  existence of a type 1 Seyfert nucleus inside the archetypical type 2 Seyfert galaxy
  NGC 1068. This nucleus is surrounded by an obscuring torus and is visible only by
  reflection from a warm electron scattering region on the torus's axis. Here it is
  shown that the warm region must be in a dynamic state and out of radiative equilibrium
  with the nuclear continuum. It is suggested that the source of this moving gas is
  the cold obscuring torus itself, and that the warm region is part of a wind driven
  by heating due to the central continuum. The obscuring torus may be an inner extension
  of the starburst region already known in NGC 1068. This model gives estimates of
  the temperature and optical depth of the electron scattering region consistent with
  the observed values. Variations in viewing angle and optical thickness in the torus
  may account for the range of observed properties in active galactic nuclei.
