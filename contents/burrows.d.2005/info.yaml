abstract: he Swift Gamma-Ray Explorer is designed to make prompt multiwavelength observations
  of gamma-ray bursts (GRBs) and GRB afterglows. The X-ray telescope (XRT) enables
  Swift to determine GRB positions with a few arcseconds accuracy within 100 s of
  the burst onset.
