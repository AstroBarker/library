abstract: We calculate the expected number of Type Ia supernovae (SN Ia) in the core-degenerate
  (CD) scenario and find it to match observations within the uncertainties of the
  code. In the CD scenario, the super-Chandrasekhar mass white dwarf (WD) is formed
  at the termination of the common envelope phase from a merger of a WD companion
  with the hot core of a massive asymptotic giant branch (AGB) star. We use a simple
  population synthesis code that avoids the large uncertainties involved in estimating
  the final orbital separation of the common envelope evolution. Instead, we assume
  that systems where the core of the secondary AGB star is more massive than the WD
  remnant of the primary star merge at the termination of the common envelope phase.
  We also use a simple prescription to count systems that have strong interaction
  during the AGB phase, but not during the earlier red giant branch (RGB) phase. The
  fact that a very simple population synthesis code that uses the basics of stellar
  evolution ingredients can match the observed rate of SN Ia might suggest that the
  CD-scenario plays a major role in forming SN Ia.
