abstract: We investigate the effect of progenitor rotation on the standing accretion
  shock instability (SASI) using two- and three-dimensional hydrodynamic simulations.
  We find that the growth rate of the SASI is a near-linearly increasing function
  of the specific angular momentum in the accreting gas. Both the growth rate and
  the angular frequency in the two-dimensional model with cylindrical geometry agree
  well with previous linear stability analyses. When excited by very small random
  perturbations, a one-armed spiral mode dominates the small rotation rates predicted
  by current stellar evolution models, while progressively higher-order modes are
  seen as the specific angular momentum increases.
