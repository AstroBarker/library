abstract: This paper introduces a series of papers aiming to study the dozens of low-mass
  eclipsing binaries (EBLM), with F, G, K primaries, that have been discovered in
  the course of the WASP survey. Our objects are mostly single-line binaries whose
  eclipses have been detected by WASP and were initially followed up as potential
  planetary transit candidates. These have bright primaries, which facilitates spectroscopic
  observations during transit and allows the study of the spin-orbit distribution
  of F, G, K+M eclipsing binaries through the Rossiter-McLaughlin effect. Here we
  report on the spin-orbit angle of WASP-30b, a transiting brown dwarf, and improve
  its orbital parameters. We also present the mass, radius, spin-orbit angle and orbital
  parameters of a new eclipsing binary, J1219-39b (1SWAPJ121921.03-395125.6, TYC 7760-484-1),
  which, with a mass of 95 $\pm$ 2 Mjup, is close to the limit between brown dwarfs
  and stars. We find that both objects have projected spin-orbit angles aligned with
  their primaries' rotation. Neither primaries are synchronous. J1219-39b has a modestly
  eccentric orbit and is in agreement with the theoretical mass-radius relationship,
  whereas WASP-30b lies above it.  Using WASP-South photometric observations (Sutherland,
  South Africa) confirmed with radial velocity measurement from the CORALIE spectrograph,
  photometry from the EulerCam camera (both mounted on the Swiss 1.2 m Euler Telescope),
  radial velocities from the HARPS spectrograph on the ESO's 3.6 m Telescope (prog
  ID 085.C-0393), and photometry from the robotic 60 cm TRAPPIST telescope, all located
  at ESO, La Silla, Chile. The data is publicly available at the CDS Strasbourg and
  on demand to the main author.Tables A.1-A.3 are available in electronic form at
  http://www.aanda.orgPhotometry tables are only available at the CDS via anonymous
  ftp to cdsarc.u-strasbg.fr (130.79.128.5) or via http://cdsarc.u-strasbg.fr/viz-bin/qcat?J/A+A/549/A18
