abstract: The study suggests that the requisite thermodynamic conditions may occur
  when carbon-oxygen white dwarfs explode by deflagration or detonation. When these
  stars undergo such explosive disruption, there will be a region near the surface
  where the burning temperature lies in the 2.4-3.2 range. To examine this astrophysical
  site, calculations are performed for an s-process nucleosynthesis during helium
  shell flashes and the nuclear transmission taking place when such mass zones are
  heated by the deflagration or detonation wave, and the results are compared with
  the solar-system distribution of the p-isotopes. It is demonstrated that Type Ia
  supernovas provide a viable site for the gamma process, and that the same thermodynamic
  conditions would also exist in Type II-p powered supernovas, provided that they
  are powered by detonation.
