abstract: Analysis of 10 years of high-precision timing data on the millisecond pulsar
  PSR J0437-4715 has resulted in a model-independent kinematic distance based on an
  apparent orbital period derivative,  dot Pb , determined at the 1.5\% level of precision
  (Dk = 157.0 +/- 2.4 pc), making it one of the most accurate stellar distance estimates
  published to date. The discrepancy between this measurement and a previously published
  parallax distance estimate is attributed to errors in the DE200 solar system ephemerides.
  The precise measurement of  dot Pb allows a limit on the variation of Newton's gravitational
  constant,  \vert{}G/G\vert{} <= 23 \texttimes{} 10-12 yr-1. We also constrain any
  anomalous acceleration along the line of sight to the pulsar to \vert{}a\&sun;/c\vert{}
  <= 1.5 \texttimes{} 10-18 s-1 at 95\% confidence, and derive a pulsar mass, mpsr
  = 1.76 +/- 0.20 M\&sun;, one of the highest estimates so far obtained.
