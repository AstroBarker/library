abstract: We perform a general-relativistic magnetohydrodynamics simulation for \approx{}30
  ms from the merger of a binary neutron star throughout the formation of a remnant
  massive neutron star (RMNS) with a high spatial resolution of the finest grid resolution
  12.5 m. First, we show that the Kelvin-Helmholtz instability at the merger could
  amplify the magnetic-field energy at least up to \texttildelow{}1 \% of the thermal
  energy. Then, we show that the magnetorotational instability in the RMNS envelope
  and torus with rho <1013 g cm-3 sustains the magnetoturbulent state, and the effective
  viscous parameter in these regions is likely to converge to \approx{}0.01 - 0.02
  with respect to the grid resolution. We also point out that the current grid resolution
  is not still fine enough to sustain a magnetoturbulent state in the RMNS with rho
  >=1013 g cm-3 .
