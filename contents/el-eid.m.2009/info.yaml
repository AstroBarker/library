abstract: We present a general overview of the structure and evolution of massive
  stars of masses >=12 M \&sun; during their pre-supernova stages. We think it is
  worth reviewing this topic owing to the crucial role of massive stars in astrophysics,
  especially in the evolution of galaxies and the universe. We have performed several
  test computations with the aim to analyze and discuss many physical uncertainties
  still encountered in massive-star evolution. In particular, we explore the effects
  of mass loss, convection, rotation, 12C( alpha, gamma)16O reaction and initial metallicity.
  We also compare and analyze the similarities and differences among various works
  and ours. Finally, we present useful comments on the nucleosynthesis from massive
  stars concerning the s-process and the yields for 26Al and 60Fe.
