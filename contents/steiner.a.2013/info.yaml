abstract: Many of the currently available equations of state for core-collapse supernova
  simulations give large neutron star radii and do not provide large enough neutron
  star masses, both of which are inconsistent with some recent neutron star observations.
  In addition, one of the critical uncertainties in the nucleon-nucleon interaction,
  the nuclear symmetry energy, is not fully explored by the currently available equations
  of state. In this article, we construct two new equations of state which match recent
  neutron star observations and provide more flexibility in studying the dependence
  on nuclear matter properties. The equations of state are also provided in tabular
  form, covering a wide range in density, temperature, and asymmetry, suitable for
  astrophysical simulations. These new equations of state are implemented into our
  spherically symmetric core-collapse supernova model, which is based on general relativistic
  radiation hydrodynamics with three-flavor Boltzmann neutrino transport. The results
  are compared with commonly used equations of state in supernova simulations of 11.2
  and 40 M \&sun; progenitors. We consider only equations of state which are fitted
  to nuclear binding energies and other experimental and observational constraints.
  We find that central densities at bounce are weakly correlated with L and that there
  is a moderate influence of the symmetry energy on the evolution of the electron
  fraction. The new models also obey the previously observed correlation between the
  time to black hole formation and the maximum mass of an s = 4 neutron star.
