abstract: The published line strengths of Ni II 7378 and Fe II 8617 are used at 12
  positions in the Crab nebula in order to determine the Ni/Fe abundance ratio at
  each location. The Ni/Fe ratio is found to exceed the solar value by one order of
  magnitude in each location. An analysis of the data for one position in the Orion
  nebula showed similar results. Explanations for the data are discussed, specifically
  the possibility that both objects contain material which has been processed nucleosynthetically
  under neutron-rich conditions; that Fe is preferentially depleted through grain
  formation in both objects; that large errors exist in the atomic data; and that
  certain physical processes such as charge exchange or dielectronic or radiative
  recombination affect the ionization balance or the populations of the upper levels
  of the relevant transitions in a manner not accounted for in the analysis.
