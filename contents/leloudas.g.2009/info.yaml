abstract: 'Aims: We study a thermonuclear supernova (SN), emphasizing very late phases.  Methods:
  An extensive dataset for SN 2003hv that covers the flux evolution from maximum light
  to day +786 is presented. This includes 82 epochs of optical imaging, 24 epochs
  of near-infrared (NIR) imaging, and 10 epochs of optical spectroscopy. These data
  are combined with published nebular-phase IR spectra, and the observations are compared
  to model light curves and synthetic nebular spectra.  Results: SN 2003hv is a normal
  Type Ia supernova (SN Ia) with photometric and spectroscopic properties consistent
  with its rarely observed B-band decline-rate parameter, Delta m15(B) = 1.61 $\pm$
  0.02. The blueshift of the most isolated [Fe ii] lines in the nebular-phase optical
  spectrum appears consistent with those observed in the IR at similar epochs. At
  late times there is a prevalent color evolution from the optical toward the NIR
  bands. We present the latest-ever detection of a SN Ia in the NIR in Hubble Space
  Telescope images. The study of the ultraviolet/optical/infrared (UVOIR) light curve
  reveals that a substantial fraction of the flux is ``missing'''' at late times.
  Between 300 and 700 days past maximum brightness, the UVOIR light curve declines
  linearly following the decay of radioactive 56Co, assuming full and instantaneous
  positron trapping. At 700 days we detect a possible slowdown of the decline in optical-bands,
  mainly in the V-band.  Conclusions: The data are incompatible with a dramatic infrared
  catastrophe (IRC). However, the idea that an IRC occurred in the densest regions
  before 350 days can explain the missing flux from the UVOIR wavelengths and the
  flat-topped profiles in the NIR. We argue that such a scenario is possible if the
  ejecta are clumpy. The observations suggest that positrons are most likely trapped
  in the ejecta.  Based on observations collected at the European Southern Observatory,
  Paranal, Chile (ESO Programmes 073.D-0294(AB), 074.D-0259(BC) and 075.D-0116(AB)),
  Cerro Tololo Inter-American Observatory, Lick Observatory, Las Campanas Observatory,
  Siding Spring Observatory, and the Hubble Space Telescope. Tables 3, 4, and Appendix
  A are only available in electronic form at http://www.aanda.org'
