abstract: We present 7954 equivalent widths for lines derived from echelle spectra
  of 33 extremely metal-poor stars. One of them, CS 22892-052, has extraordinarily
  strong heavy element lines. Measurements for lines which appear in adjacent echelle
  orders confirm our computed equivalent width uncertainties. Comparison of our equivalent
  widths with published values shows that our equivalent widths (Wlambda) fall in
  the range of measurements found from other studies. We present a table of regression
  relations which can be used to place our equivalent widths onto other systems. We
  also outline the techniques used in a semiautomated approach to Wlambda measurement.
