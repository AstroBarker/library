abstract: We have calculated a series of models of outflows from the obscuring torus
  in active galactic nuclei (AGNs). Our modeling assumes that the inner face of a
  rotationally supported torus is illuminated and heated by the intense X-rays from
  the inner accretion disk and black hole. As a result of such heating, a strong biconical
  outflow is observed in our simulations. We calculate three-dimensional hydrodynamical
  models, assuming axial symmetry and including the effects of X-ray heating, ionization,
  and radiation pressure. We discuss the behavior of a large family of these models,
  their velocity fields, mass fluxes, and temperature, as functions of the torus properties
  and X-ray flux. Synthetic warm- absorber spectra are calculated, assuming pure absorption,
  for sample models at various inclination angles and observing times. We show that
  these models have mass fluxes and flow speeds comparable to those inferred from
  observations of Seyfert 1 warm absorbers, and that they can produce rich absorption-line
  spectra.
