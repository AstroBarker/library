abstract: The thick disk model is reviewed with an angular momentum distribution chosen
  to have a power law relation with the von Zeipel parameter lambda = (l/Omega)1/2,
  where l denotes the specific angular momentum and Omega denotes the angular velocity.
  This choice enables the author to integrate the relativistic Euler equation independent
  of the background geometry. The consequences with regard to the Schwarzschild and
  Kerr black hole geometries are briefly investigated.
