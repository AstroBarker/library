abstract: The distance to NGC 1425 has been derived from Cepheid variables, as part
  of the Hubble Space Telescope Key Project on the Extragalactic Distance Scale. Thirteen
  F555W (V) and eight F814W (I) epochs of cosmic-ray-split Wide Field Planetary Camera
  2 observations were obtained. Twenty-nine Cepheids were discovered, with periods
  ranging from 16 to 63 days. Adopting a Large Magellanic Cloud distance modulus and
  extinction of 18.50+/-0.10 mag and E(V-I)=0.13 mag, respectively, a true reddening-corrected
  distance modulus (based on an analysis employing the ALLFRAME software package)
  of 31.73+/-0.16 (random)+/-0.17 (systematic) mag was determined for NGC 1425. The
  corresponding distance of 22.2+/-1.0 (random)+/-1.0 (systematic) Mpc is in satisfactory
  agreement with that found with an independent analysis based on the DoPHOT photometry
  package.  Based on observations with the NASA/ESA Hubble Space Telescope, obtained
  at the Space Telescope Science Institute, which is operated by AURA, Inc., under
  NASA Contract NAS5-26555.
