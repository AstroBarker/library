abstract: A model for the explosion that has been successful in predicting and explaining
  the evolution of SN 1987A during its first one and one-half years is used to calculate
  the future photometric evolution of the supernova in the UV-optical-IR, X-ray, and
  gamma-ray bands using Monte Carlo techniques. Special attention is given to the
  contribution from radioactive isotopes other than Co-56, notably Co-57, Ti-44, and
  Na-22, and to the possible appearance, probably within the next year, of X-rays
  from an accreting magnetic neutron star at the center of the supernova. The signature
  of a radio pulsar like the Crab is also considered. In both cases the time history
  of the bolometric light curve may be a more sensitive diagnostic than the existence
  of either pulses or hard emission, but will become confused in the near future by
  contributions from the rare radioactivities. A source as faint as the pulsed emission
  of the Crab pulsar will never be discernable in the bolometric light curve. Pulsed
  hard emission is best sought near 30 keV near the end of 1989 (and thereafter),
  although more sensitive instrumentation than hitherto employed may be necessary.
