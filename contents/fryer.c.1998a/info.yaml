abstract: We use a Monte Carlo binary synthesis code to model the formation and evolution
  of neutron star systems including high-mass X-ray binaries, low-mass X-ray binaries,
  double neutron star systems, and radio pulsars. Our focus is on the signature imprinted
  on such systems due to natal kicks to neutron stars over and above that imparted
  by orbital motions. The code incorporates the effect of the galactic potential (including
  rotation) on the velocities of these systems. A comparison between our models and
  the observations leads us to infer mean natal kicks >~400-500 km s-1. Moreover,
  to be consistent with all the data, we require a bimodal kick distribution with
  one peak in the distribution near 0 km s-1 and the other above 600 km s-1.
