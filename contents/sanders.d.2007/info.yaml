abstract: The COSMOS Spitzer survey (S-COSMOS) is a Legacy program (Cycles 2+3) designed
  to carry out a uniform deep survey of the full 2 deg2 COSMOS field in all seven
  Spitzer bands (3.6, 4.5, 5.6, 8.0, 24.0, 70.0, and 160.0 mum). This paper describes
  the survey parameters, mapping strategy, data reduction procedures, achieved sensitivities
  to date, and the complete data set for future reference. We show that the observed
  infrared backgrounds in the S-COSMOS field are within 10\% of the predicted background
  levels. The fluctuations in the background at 24 mum have been measured and do not
  show any significant contribution from cirrus, as expected. In addition, we report
  on the number of asteroid detections in the low Galactic latitude COSMOS field.
  We use the Cycle 2 S-COSMOS data to determine preliminary number counts, and compare
  our results with those from previous Spitzer Legacy surveys (e.g., SWIRE, GOODS).
  The results from this ``first analysis'' confirm that the S-COSMOS survey will have
  sufficient sensitivity with IRAC to detect ~L\textasteriskcentered disks and spheroids
  out to z>~3, and with MIPS to detect ultraluminous starbursts and AGNs out to z~3
  at 24 mum and out to z~1.5-2 at 70 and 160 mum.  Based on observations with the
  NASA/ESA Hubble Space Telescope obtained at the Space Telescope Science Institute,
  which is operated by the Association of Universities for Research in Astronomy (AURA),
  Inc., under NASA contract NAS 5-26555 also based on data collected at the Subaru
  Telescope, which is operated by the National Astronomical Observatory of Japan;
  the XMM-Newton, an ESA science mission with instruments and contributions directly
  funded by ESA Member States and NASA; the European Southern Observatory under Large
  Program 175.A-0839, Chile; Kitt Peak National Observatory, Cerro Tololo Inter-American
  Observatory, and the National Optical Astronomy Observatory, which are operated
  by AURA under cooperative agreement with the National Science Foundation; the National
  Radio Astronomy Observatory, which is a facility of the National Science Foundation
  operated under cooperative agreement by Associated Universities, Inc.; and the Canada-France-Hawaii
  Telescope (CFHT) with MegaPrime/MegaCam operated as a joint project by the CFHT
  Corporation, CEA/DAPNIA, the National Research Council of Canada, the Canadian Astronomy
  Data Centre, the Centre National de la Recherche Scientifique de France, TERAPIX,
  and the University of Hawaii.
