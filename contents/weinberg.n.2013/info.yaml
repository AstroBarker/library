abstract: A weakly nonlinear fluid wave propagating within a star can be unstable
  to three-wave interactions. The resonant parametric instability is a well-known
  form of three-wave interaction in which a primary wave of frequency omega a  excites
  a pair of secondary waves of frequency omega b  + omega c  ~= omega a . Here we
  consider a nonresonant form of three-wave interaction in which a low-frequency primary
  wave excites a high-frequency p-mode and a low-frequency g-mode such that omega
  b  + omega c  Gt omega a . We show that a p-mode can couple so strongly to a g-mode
  of similar radial wavelength that this type of nonresonant interaction is unstable
  even if the primary wave amplitude is small. As an application, we analyze the stability
  of the tide in coalescing neutron star binaries to p-g mode coupling. We find that
  the equilibrium tide and dynamical tide are both p-g unstable at gravitational wave
  frequencies f gw >~ 20 Hz and drive short wavelength p-g mode pairs to significant
  energies on very short timescales (much less than the orbital decay time due to
  gravitational radiation). Resonant parametric coupling to the tide is, by contrast,
  either stable or drives modes at a much smaller rate. We do not solve for the saturation
  of the p-g instability and therefore we cannot say precisely how it influences the
  evolution of neutron star binaries. However, we show that if even a single daughter
  mode saturates near its wave breaking amplitude, the p-g instability of the equilibrium
  tide will (1) induce significant orbital phase errors (Deltaphi >~ 1 radian) that
  accumulate primarily at low frequencies (f gw <~ 50 Hz) and (2) heat the neutron
  star core to a temperature of T ~ 1010 K. Since there are at least ~100 unstable
  p-g daughter pairs, Deltaphi and T are potentially much larger than these values.
  Tides might therefore significantly influence the gravitational wave signal and
  electromagnetic emission from coalescing neutron star binaries at much larger orbital
  separations than previously thought.
