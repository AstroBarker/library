abstract: Recent efforts to model the processes occurring in Type I and II supernovae,
  and the diagnostics used to model the events, are described. Both types of events
  release about the same amount of energy and produce heavy elements. Features which
  distinguish the two types of supernovae are summarized. Prominent stages in Type
  II events are reviewed, including the presupernova evolution of massive stars, core
  collapse and bounce. Processes occurring in a delayed explosion, e.g., failure of
  the shock and possible formation of a 'neutrinosphere', are discussed, along with
  nucleosynthesis during Type II explosions and features of peculiar Type II events.
