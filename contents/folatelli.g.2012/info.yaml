abstract: The presence of unburned material in the ejecta of normal Type Ia supernovae
  (SNe Ia) is investigated using early-time spectroscopy obtained by the Carnegie
  Supernova Project. The tell-tale signature of pristine material from a C+O white
  dwarf progenitor star is the presence of carbon, as oxygen is also a product of
  carbon burning. The most prominent carbon lines in optical spectra of SNe Ia are
  expected to arise from C II. We find that at least 30\% of the objects in the sample
  show an absorption at \approx{}6300 {\AA} which is attributed to C II lambda6580.
  An alternative identification of this absorption as Halpha is considered to be unlikely.
  These findings imply a larger incidence of carbon in SNe Ia ejecta than previously
  noted. We show how observational biases and physical conditions may hide the presence
  of weak C II lines, and account for the scarcity of previous carbon detections in
  the literature. This relatively large frequency of carbon detections has crucial
  implications on our understanding of the explosive process. Furthermore, the identification
  of the 6300 {\AA} absorptions as carbon would imply that unburned material is present
  at very low expansion velocities, merely \approx{}1000 km s-1 above the bulk of
  Si II. Based on spectral modeling, it is found that the detections are consistent
  with a mass of carbon of 10-3 to 10-2 M \&sun;. The presence of this material so
  deep in the ejecta would imply substantial mixing, which may be related to asymmetries
  of the flame propagation. Another possible explanation for the carbon absorptions
  may be the existence of clumps of unburned material along the line of sight. However,
  the uniformity of the relation between C II and Si II velocities is not consistent
  with such small-scale asymmetries. The spectroscopic and photometric properties
  of SNe Ia with and without carbon signatures are compared. A trend toward bluer
  color and lower luminosity at maximum light is found for objects which show carbon.  This
  paper includes data gathered with the 6.5 m Magellan Telescopes located at Las Campanas
  Observatory, Chile, and the Gemini Observatory, Cerro Pachon, Chile (Gemini Program
  GS-2008B-Q-56). This work is based on observations collected at the European Organisation
  for Astronomical Research in the Southern Hemisphere, Chile (ESO Programmes 076.A-0156,
  078.D-0048, 080.A-0516, and 082.A-0526).
