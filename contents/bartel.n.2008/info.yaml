abstract: VLBI observations at 5 GHz have revealed that supernova 1979C, in the galaxy
  M100 in the Virgo Cluster, has shell structure. The shell is approximately circular,
  with the 50\% contour deviating from a circle by an rms of no more than 8\% of the
  radius. The brightness distribution along the ridge may vary. The position of the
  center of the shell is at R.A. = 12h22m 58.66758s and decl . = 15'51.9695'' (J2000.0),
  with a standard error of 0.8 mas in each of the coordinates. No isolated central
  component is visible above a flux density limit of ~150 muJy, which corresponds
  to an upper limit of ~15 times the corresponding spectral luminosity of the Crab
  Nebula. The radio light curve is clearly falling again, and the radio spectrum is
  now flatter than at earlier times. SN 1979C is only the fourth, and oldest (optically
  identified) supernova of which a detailed image could be obtained.
