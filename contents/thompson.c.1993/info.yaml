abstract: Neutron star convection is a transient phenomenon and has an extremely high
  magnetic Reynolds number. In this sense, a neutron star dynamo is the quintessential
  fast dynamo. The convective motions are only mildly turbulent on scales larger than
  the approximately 100 cm neutrino mean free path, but the turbulence is well developed
  on smaller scales. Several fundamental issues in the theory of fast dynamos are
  raised in the study of a neutron star dynamo, in particular the possibility of dynamo
  action in mirror-symmetric turbulence. It is argued that in any high magnetic Reynolds
  number dynamo, most of the magnetic energy becomes concentrated in thin flux ropes
  when the field pressure exceeds the turbulent pressure at the smallest scale of
  turbulence. In addition, the possibilities for dynamo action during the various
  (pre-collapse) stages of convective motion that occur in the evolution of a massive
  star are examined, and the properties of white dwarf and neutron star progenitors
  are contrasted.
