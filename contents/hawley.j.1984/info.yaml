abstract: The authors have developed a 2D axisymmetric, general relativistic code
  to study inviscid hydrodynamic accretion flows in a fixed Kerr black hole gravitational
  field. In this first of several papers documenting the methods and results, they
  describe and discuss the hydrodynamic equations in the form used in the code. Certain
  analytic solutions for shock tubes and special accretion flows are derived; these
  solutions will form the basis for code testing and calibration.
