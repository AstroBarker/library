abstract: A database of parameters for globular star clusters in the Milky Way is
  described which is available in electronic form through the WorldWideWeb. The information
  in the catalog includes up-to-date measurements for cluster distance, reddening,
  luminosity, colors and spectral types, velocity, structural and dynamical parameters,
  horizontal branch morphology, metallicity, and other quantities. This catalog will
  be updated regularly and maintained in electronic form for widest possible accessibility.
