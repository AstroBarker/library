abstract: The dynamics of stars in the inner regions of nearby globular clusters (GCs)
  such as G1 indicate the presence of central concentrated dark masses, and one would
  like to know whether these are indeed intermediate-mass black holes (IMBHs). As
  the number of surrounding stars and their motions are roughly known, the capture
  rate can be estimated; the question then arises of whether the apparent quiescence
  of the nuclei of these GCs is compatible with the IMBH's presence. The role of debris
  from disrupted stars in activating quiescent nuclei of GCs is studied here employing
  three-dimensional hydrodynamics simulations. It is argued that when individual stars
  are disrupted, the bulk of the debris would be swallowed or expelled rapidly compared
  with the interval between successive disruptions. A transient signal (predominantly
  of soft X-ray emission) could persist steadily with L ~ L Edd = 1041(M h/103 M sun)
  erg s-1 for at most tens of years; thereafter the flare would rapidly fade. While
  the infall rate declines as t -5/3, some material may be stored for a longer time
  in an accretion disk. The IMBH luminosity could then remain as high as LX >= 1039
  erg s-1 for several hundreds of years after disruption. In a given object, this
  ultraluminous X-ray activity would have a duty cycle of the order of 10-4. Quiescent
  GCs, those with IMBHs now starved of fuel, should greatly outnumber active ones;
  observational constraints would not then be stringent until we had observed enough
  candidates to constitute a proper ensemble average.
