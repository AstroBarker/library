abstract: We present a simple dimensional argument to illustrate the impact of nonthermal
  support from turbulent velocity dispersion on the shape of the prestellar core mass
  function (CMF), precursor of the stellar initial mass function (IMF). The argument
  demonstrates the need to invoke such support to recover the Salpeter slope in the
  high-mass part of the CMF/IMF, whereas pure thermal support leads to a much steeper
  slope. This simple dimensional argument clearly highlights the results obtained
  in the complete Hennebelle-Chabrier theory of the IMF.
