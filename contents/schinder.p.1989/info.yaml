abstract: Techniques and some simple analytic and numerical test problems for radiative
  transfer in spherically symmetric spacetime are presented. It is demonstrated that,
  by choosing momentum variables that are constant along null geodesics, derivatives
  of these momenta do not appear in the differential operator on the left-hand side
  of the transport equation. It is shown that in dynamic, spherically symmetric spacetime,
  the angular momentum and its component along the polar axis are two such momentum
  variables. In the time-dependent transport equation, only the momentum space derivative
  remains. If spacetime is static, an additional conserved quantity is found which,
  together with another conserved quantity, can be used to find the generally relativistic
  tangent-ray equations. An analytic solution to these equations is found for certain
  simple choices of opacity in the nonrelativistic limit.
