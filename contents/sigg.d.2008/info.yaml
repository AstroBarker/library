abstract: All three LIGO gravitational wave detectors have reached their design sensitivities.
  A sky-averaged detection range (SNR > 8) of more than 15 Mpc for gravitational waves
  emitted from inspiral binary neutron stars with masses of 1.4 Modot has been achieved
  with the two 4 km instruments. The fifth LIGO science run started in November 2005
  and ended in September 2007. A full year of triple coincidence data has been acquired.
  The duty cycle of a single instrument was between 66\% and 79\%. Results from previous
  science runs are presented.
