abstract: The neutrino-nucleus reaction cross sections of 4He and 12C are evaluated
  using new shell model Hamiltonians. Branching ratios of various decay channels are
  calculated to evaluate the yields of Li, Be, and B produced through the nu-process
  in supernova explosions. The new cross sections enhance the yields of 7Li and 11B
  produced during the supernova explosion of a 16.2 M\&sun; star model compared to
  the case using the conventional cross sections by about 10\%. On the other hand,
  the yield of 10B decreases by a factor of 2. The yields of 6Li,9Be, and the radioactive
  nucleus 10Be are found at a level of ~10-11 M\&sun;. The temperature of numu ,tau-
  and \overline{nu }mu ,tau -neutrinos inferred from the supernova contribution of
  11B in Galactic chemical evolution models is constrained to the 4.3-6.5 MeV range.
  The increase in the 7Li and 11B yields due to neutrino oscillations is demonstrated
  with the new cross sections.
