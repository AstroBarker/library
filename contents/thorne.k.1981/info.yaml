abstract: Two moment formalisms are developed for radiative transfer in a         relativistic,
  differentially moving medium in flat or curved         space. One formalism applies
  to systems with no special         symmetries, while the other formalism applies
  to systems with         spherical, planar, or pseudospherical symmetry.
