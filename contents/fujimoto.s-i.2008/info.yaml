abstract: We have made detailed calculations of the composition of magnetically driven
  jets ejected from collapsars, or rapidly rotating massive stars, based on long-term
  magnetohydrodynamic simulations of their core collapse with various distributions
  of magnetic field and angular momentum before collapse. We follow the evolution
  of the abundances of about 4000 nuclides from the collapse phase to the ejection
  phase and through the jet generation phase using a large nuclear reaction network.
  We find that the r-process successfully operates only in energetic jets (>1051 ergs),
  such that U and Th are synthesized abundantly, even when the collapsar has a relatively
  weak magnetic field (1010 G) and a moderately rotating core before the collapse.
  The abundance patterns inside the jets are similar to those of the r-elements in
  the solar system. About 0.01-0.06 M\&sun; of neutron-rich, heavy nuclei are ejected
  from a collapsar with energetic jets. The higher energy jets have larger amounts
  of 56Ni, varying from 3.7 \texttimes{} 10-4 to 0.06 M\&sun;. Less energetic jets,
  which eject small amounts of 56Ni, could induce a gamma-ray burst (GRB) without
  a supernova, such as GRB 060505 or GRB 060614. Considerable amounts of r-elements
  are likely to be ejected from GRBs with hypernovae, if both the GRB and hypernova
  are induced by jets that are driven near the black hole.
