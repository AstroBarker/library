abstract: Extensive high-resolution, high SNR polarization spectra of the nucleus
  of NGC 1068 are presented. The polarized flux plot reveals the presence of very
  highly polarized, very broad symmetric Balmer lines and also permitted Fe II. This
  plot closely resembles the flux spectra of Seyfert type I nuclei. The broad lines
  are redshifted about 600 km/s relative to the narrow lines. This line emission indicates
  that both polarizations are due to scattering, probably by free electrons which
  must be cooler than a million K. A model is suggested in which the continuum source
  and broad line clouds are located inside a thick disk, with electrons above and
  below the disk scattering continuum and broad-line photons into the line of sight.
  All of the narrow lines, including the narrow Balmer lines, have similar low polarizations,
  unrelated to that of the continuum.
