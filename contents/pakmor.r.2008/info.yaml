abstract: 'Context: The nature of type Ia supernova progenitors is still unclear.
  The outstanding characteristic of the single-degenerate scenario is that it contains
  hydrogen in the binary companion of the exploding white dwarf star, which, if mixed
  into the ejecta of the supernova in large amounts may lead to conflicts with the
  observations thus ruling out the scenario.  Aims: We investigate the effect of the
  impact of type Ia supernova ejecta on a main sequence companion star of the progenitor
  system. With a series of simulations we investigate how different parameters of
  this system affect the amount of hydrogen stripped from the companion by the impact.  Methods:
  The stellar evolution code GARSTEC is used to set up the structure of the companion
  stars mimicking the effect of a binary evolution phase. The impact itself is simulated
  with the smoothed particle hydrodynamics code GADGET2.  Results: We reproduce and
  confirm the results of earlier grid-based hydrodynamical simulation. Parameter studies
  of the progenitor system are extended to include the results of recent binary evolution
  studies. The more compact structure of the companion star found here significantly
  reduces the stripped hydrogen mass.  Conclusions: The low hydrogen masses resulting
  from a more realistic companion structure are consistent with current observational
  constraints. Therefore, the single-degenerate scenario remains a valid possibility
  for type Ia supernova progenitors. These new results are not a numerical effect,
  but the outcome of different initial conditions.'
