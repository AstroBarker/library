abstract: The effects of the initial models on the outcome of stellar collapse calculations
  are studied. Constructing initial models which satisfy constraints taken from the
  results of presupernova evolution calculations, the basic criterion that any initial
  model must satisfy is discussed. Nonequilibrium transport of all flavors of neutrinos
  and antineutrinos are included as well as the effects of neutrino electron scattering.
  Conservative choices are made for the equation of state at high density. Cold initial
  cores significantly reduce the amount of electron capture on infall, leading to
  strong shock waves. There appears to be an optimum iron core mass, and reducing
  the mass below this optimum leads to increased lepton loss on infall and subsequent
  deleterious effects on the shock wave. Successful explosions are obtained with iron
  cores of 1.12 solar mass when they have the proper characteristics.
