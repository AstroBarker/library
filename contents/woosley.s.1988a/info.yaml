abstract: 'The explanation of the behavior of the SN 1987A explosion, offered upon
  its discovery on February 23.316 UT, and predictions on the possible course of its
  continued evolution, made by Woosley et al. (1987) are discussed in the light of
  new, definite calculations and reevaluation of the earlier contentions. A number
  of properties of the SN 1987A strongly constrain the progenitor to be a blue supergiant
  in the mass range 12-30 solar masses. Two possible reasons for a blue presupernova
  star are discussed in detail: mass loss and low metallicity. Optical, hard X-ray,
  and gamma-ray curves were considered for several models consistent with observations.
  The best fit to the optical data was obtained using a 15-20 solar mass model that
  has lost about half of its mass prior to expoloding. The recent brightening indicates
  that the supernova has entered a state where radioactivity is the dominant source
  of power for the optical display.'
