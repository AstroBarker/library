abstract: The evolution of two low-mass white dwarfs, accreting hydrogen-rich matter
  at a rate of 10 exp -9 solar mass/yr was calculated by means of a hydrodynamic code.
  A 0.6 solar mass white dwarf, composed of carbon and oxygen, and a 0.4 solar mass
  helium white dwarf are considered, both of low intrinsic luminosity. They are found
  to undergo periodic eruptions, which, for the CO white dwarf become regular only
  after about five cycles. The outbursts are similar in appearance to those of classical
  novae, although on a largely stretched time scale. The high-luminosity phase lasts
  for about 200 yr for both stars. The accretion continues for 4 x 10 exp 5 yr and
  9 x 10 exp 5 yr, for the 0.6 and 0.4 solar mass WDs, respectively. Both stars lose
  mass following the outburst. While the more massive white dwarf ejects the entire
  accreted mass, the smaller, He WD retains some of the accreted material which is
  added to the core after being burnt into helium.
