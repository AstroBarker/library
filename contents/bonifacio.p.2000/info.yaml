abstract: We report photoelectric UBV data for 268 metal-poor candidates chosen from
  the northern HK objective-prism/interference-filter survey of Beers and colleagues.
  Over 40\% of the stars have been observed on more than one night, and most have
  at least several sets of photometric measurements. Reddening estimates, preliminary
  spectroscopic measurements of abundance, and type classifications are reported.
