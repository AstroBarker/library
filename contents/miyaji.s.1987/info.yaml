abstract: The density at which electron capture can ignite oxygen burning in 8-10
  solar mass stars is investigated within the uncertainties of the semiconvection
  theory. The Ledoux criterion for convection is adopted in order to take into account
  the maximum effect of heating due to electron capture. It is found that oxygen burning
  is not ignited by electron captures on Mg-24 and Na-24 at the central density of
  about 4 x 10 to the 9th g/cu cm, but by capture on Ne-20 at about 1 x 10 to the
  10th g/cu cm. This ignition density is 2.5 times lower than in the case with the
  Schwarzschild criterion, but is still high enough to induce a collapse by electron
  capture rather than a total explosion of the core. When the oxygen-burning front
  arrives at M(r) of roughly 0.3 solar mass, the contraction reaches a quasi-dynamic
  collapse.
