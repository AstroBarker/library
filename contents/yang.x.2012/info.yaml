abstract: Time-series photometric observations were made for the SX Phoenicis star
  XX Cyg between 2007 and 2011 at the Xinglong Station of National Astronomical Observatories
  of China. With the light curves derived from the new observations, we do not detect
  any secondary maximum in the descending portion of the light curves of XX Cyg, as
  reported in some previous work. Frequency analysis of the light curves confirms
  a fundamental frequency f 0 = 7.4148 cycles day-1 and up to 19 harmonics, 11 of
  which are newly detected. However, no secondary mode of pulsation is detected from
  the light curves. The O-C diagram, produced from 46 newly determined times of maximum
  light combined with those derived from the literature, reveals a continuous period
  increase with the rate of (1/P)(dP/dt) = 1.19(13) \texttimes{} 10-8 yr-1. Theoretical
  rates of period change due to the stellar evolution were calculated with a modeling
  code. The result shows that the observed rate of period change is fully consistent
  with period change caused by evolutionary behavior predicted by standard theoretical
  models.
