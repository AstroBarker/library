abstract: '{We present spectroscopic and photometric observations of SN 1987a in the
  Large Magellanic Cloud, made at the Sutherland field station of SAAO and in Cape
  Town for days 51--134 after the Kamiokande-II neutrino event. During this period,
  both the bolometric flux from the supernova and the apparent angular radius of the
  photosphere reached a maximum and subsequently declined. Some discussion is included
  based on a comparison between the derived fluxes and those predicted by selected
  theoretical models.}'
