abstract: 'The authors investigate systematically how the explosion energy of supernovae,
  Eex, depends on the softness of the equation of state (EOS). They obtained the following
  results: (1) As the EOS becomes softer, Eex increases significantly until a critical
  point, after which it decreases rapidly to zero. (2) However, the extremely soft
  EOS which induces the strongest explosion is excluded by the constraint that the
  critical mass of "neutron stars" Mcr derived from the EOS must be greater than the
  observed mass (1.4 M\_sun;). (3) The amount of Eex also depends on the shape of
  an EOS.'
