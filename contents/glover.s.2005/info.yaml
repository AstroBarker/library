abstract: 'In this review, I survey our current understanding of how the very first
  stars in the universe formed, with a focus on three main areas of interest: the
  formation of the first protogalaxies and the cooling of gas within them, the nature
  and extent of fragmentation within the cool gas, and the physics   in particular
  the interplay between protostellar accretion and protostellar feedback   that serves
  to determine the final stellar mass.'
