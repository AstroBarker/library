abstract: A collection is presented of MHD problems that will provide researchers
  who have interests in modeling MHD phenomena with a battery of tests (a 'test suite')
  for calibrating their numerical algorithms. Use of these tests will provide a common
  reference for comparison of different numerical MHD algorithms. The test suite includes
  both 1D and 2D problems. Taken together, these problems test the abilities of a
  numerical method to propagate accurately all of the MHD wave families in moving
  and stationary media, to capture MHD shocks and contact discontinuities, and to
  model accurately Lorentz force terms in multiple dimensions. An example solution
  of each test problem is presented. Diagnostic convergence-testing procedures that
  provide a quantitative evaluation of MHD algorithms are demonstrated.
