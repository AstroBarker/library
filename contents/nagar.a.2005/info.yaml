abstract: The theory of gauge-invariant non-spherical metric perturbations of Schwarzschild
  black-hole spacetimes is now well established. Yet, as different notations and conventions
  have been used throughout the years, the literature on the subject is often confusing
  and sometimes confused. The purpose of this review is to review and collect the
  relevant expressions related to the Regge Wheeler and Zerilli equations for the
  odd and even-parity perturbations of a Schwarzschild spacetime. Special attention
  is paid to the form they assume in the presence of matter-sources and, for the two
  most popular conventions in the literature, to the asymptotic expressions and gravitational-wave
  amplitudes. Besides pointing out some inconsistencies in the literature, the expressions
  collected here could serve as a quick reference for the calculation of the perturbations
  of a Schwarzschild black-hole spacetime driven by generic sources and for those
  approaches in which gravitational waves are extracted from numerically generated
  spacetimes.
