abstract: In view of its possible role in a core-collapse supernova and in the subsequent
  nucleosynthesis, inelastic neutrino scattering with A = 3,4 nuclei is calculated.
  The predicted cross-sections result from an ab-initio calculation using microscopic
  two- and three-nucleon interaction and meson-exchange currents.
