abstract: The observed chemical abundances of the Magellanic Clouds are interpreted
  in terms of the star formation histories of the Clouds and the relationships between
  the chemical evolutionary histories of each of the Clouds and with the solar evolution
  in the Galaxy. It is found that the interstellar medium (ISM) of the LMC has a mean
  metallicity 0.2 dex lower than the local ISM, and the metallicity of the SMC is
  0.6 dex lower. However, the interstellar media of both the Magellanic Clouds and
  the Galaxy have significantly nonsolar elemental ratios. It is also shown that the
  stellar carbon abundances in the clouds appear normal, and therefore it is the H
  II regions that must be overdefficient in this element.
