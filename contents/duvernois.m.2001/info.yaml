abstract: Measurements of the energy spectra of negative electrons and positrons have
  been performed with the High-Energy Antimatter Telescope (HEAT) in two balloon flights-1994
  May from Fort Sumner, NM, and 1995 August from Lynn Lake, Manitoba. We present the
  combined data set from these two flights, covering the energy range 1-100 GeV. We
  compare our data with results from other groups and discuss the data in the context
  of diffusive propagation models. There is some evidence that primary electrons above
  10 GeV and cosmic-ray nuclei exhibit the same energy spectrum at the source, but
  that the source spectrum becomes harder at lower energy. Within the experimental
  uncertainties, the intensity of positrons is consistent with a purely secondary
  origin, due to nuclear interactions in interstellar space.
