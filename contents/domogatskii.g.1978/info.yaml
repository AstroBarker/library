abstract: The interaction cross sections of neutrinos emitted by collapsing stellar
  cores with matter from the expelled envelope are estimated. The neutrinos are shown
  to be able to produce isotopes of light elements (lithium, beryllium, and boron)
  effectively in the stellar envelope and also, possibly, to create some deuterium.
  The neutrino-induced production of light elements accounts quite naturally for the
  observed enhanced abundances of odd isotopes of lithium and boron, as compared with
  even ones. It is emphasized that a reliable quantitative evaluation of the light-element
  yields has to be based on thoroughly elaborated hydrodynamical models of envelope
  ejection. Slow expulsion of the envelope due to nonthermal forces seems to be the
  most favorable case for neutrino-induced production of light elements. The proposed
  mechanism for the production of light elements can be verified observationally.
  The enhanced abundances of lithium and boron with respect to their cosmic values
  are expected to be characteristic of Crab Nebula filaments. Also, it is of interest
  to search for the lines of light elements in supernova spectra.
