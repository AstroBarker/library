abstract: 'Context: Spectropolarimetry has been used to directly measure the asymmetries
  of Supernovae (SNe), Gamma-Ray Bursts (GRBs) and X-Ray Flashes (XRFs).  Aims: We
  determine whether non-axial asymmetries are present in SNe that are associated with
  GRBs and XRFs, given the particular alignment of the jet axis and axis of symmetry
  with the line of sight in these cases.  Methods: We performed spectropolarimetry
  with the Very Large Telescope (VLT) FORS1 instrument of the type Ic SN 2006aj, associated
  with the XRF 060218, at V-band maximum at 9.6 rest frame days after the detection
  of the XRF. Due to observations at only 3 retarder plate angles, the data were reduced
  assuming that the instrumental signature correction for the U Stokes parameter was
  identical to the correction measured for Q.  Results: We find SN 2006aj to be highly
  polarized at wavelengths corresponding to the absorption minima of certain spectral
  lines, which are particularly strong for O I 7774 {\AA} and Fe II, observed at 4200
  {\AA} with a polarization of 3\%. The value of the Interstellar Polarization is
  not well constrained by these observations and, considering the low polarization
  observed between 6000-6500 {\AA}, the global asymmetry of the SN is \lessapprox{}15\%.
  O I and Fe II lines share the same location in the Q-U plane, that differs from
  Ca II.  Conclusions: SN 2006aj exhibits a higher degree of line polarization than
  other SNe associated with GRBs and XRFs. The polarization associated with spectral
  lines implies significant asymmetries of these elements with respect to each other
  and to the line of sight. This is contrary to the standard picture of SNe associated
  with GRBs/XRFs, where the axis of symmetry of the SN is aligned with the GRB jet
  axis and the line of sight.  Based on observations made with ESO Telescopes at the
  Paranal Observatory, under programme 76.D-0177(A).'
