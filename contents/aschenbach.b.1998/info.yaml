abstract: About 200 supernova remnants have been found in the galaxy, six of which
  are younger than about 1,000 years (ref. 2). Observations of these young remnants
  are important for understanding of the late phases of supernova evolution, and each
  new object should add substantially to our knowledge of the processes involved.
  Here I report the discovery of a supernova remnant (RXJ0852.0 - 4622), identified
  by its X-ray emission, at the southeast corner of the known Vela supernova remnant.
  The high temperature (>3 \texttimes{} 107K) indicates an age of less than ~1,500yr.
  The observed diameter of the remnant is about 2$\,^{\circ}$, which suggests a distance
  of less than 1kpc, based on a comparison with the remnant of the supernova of AD1006.
  RXJ0852.0 - 4622 may therefore be the nearest supernova to have occurred during
  recent human history.
