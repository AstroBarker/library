abstract: The use of Type Ia supernovae as distance indicators relies on the determination
  of their brightness. This is not constant, but it can be calibrated using an observed
  relation between the brightness and the properties of the optical light curve (decline
  rate, width, shape), which indicates that brighter SNe have broader, slower light
  curves. However, the physical basis for this relation is not yet fully understood.
  Among possible causes are different masses of the progenitor white dwarfs or different
  opacities in Chandrasekhar-mass explosions. We parameterize Chandrasekhar-mass models,
  which synthesize different amounts of 56Ni, and compute bolometric light curves
  and spectra at various epochs. Since opacity in SNe Ia is mostly a result of spectral
  lines, it should depend on the mass of Fe-peak elements synthesized in the explosion,
  and on the temperature in the ejecta. Bolometric light curves computed using these
  prescriptions for the optical opacity reproduce the relation between brightness
  and decline rate. Furthermore, when spectra are calculated, the change in color
  between maximum and 2 weeks later allows the observed relation between MB(max) and
  Deltam15(B) to be reproduced quite nicely. Spectra computed at various epochs compare
  well with corresponding spectra of spectroscopically normal SNe Ia selected to cover
  a similar range of Deltam15(B) values.
