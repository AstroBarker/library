abstract: Neutrinos observed from SN 1987A are interpreted in terms of thermal emission
  from a cooling protoneutron star. Using both moment and maximum-likelihood methods,
  the average temperature of the emitted antineutrinos is inferred to be 3-5 MeV,
  and the total energy emitted in electron antineutrinos is estimated to be 5 + or
  - 2 x 10 to the 52nd ergs. Care has been taken to include the detector response
  function, which improves, marginally, the agreement between the two detections analyzed.
  Also investigated was the statistical significance of the so-called gaps in the
  arrival times of the neutrinos. It is argued that these gaps are due to low counting
  statistics and not to any pulsing or bursting behavior of the source.
