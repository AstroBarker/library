abstract: An approximation for the moment of inertia of a neutron star in terms of
  only its mass and radius is presented, and insight into it is obtained by examining
  the behavior of the relativistic structural equations. The approximation is accurate
  to approximately 10\% for a variety of nuclear equations of state, for all except
  very low mass stars. It is combined with information about the neutron-star crust
  to obtain a simple expression (again in terms only of mass and radius) for the fractional
  moment of inertia of the crust.
