abstract: We present a case study of validating an astrophysical simulation code.
  Our study focuses on validating FLASH, a parallel, adaptive-mesh hydrodynamics code
  for studying the compressible, reactive flows found in many astrophysical environments.
  We describe the astrophysics problems of interest and the challenges associated
  with simulating these problems. We describe methodology and discuss solutions to
  difficulties encountered in verification and validation. We describe verification
  tests regularly administered to the code, present the results of new verification
  tests, and outline a method for testing general equations of state. We present the
  results of two validation tests in which we compared simulations to experimental
  data. The first is of a laser-driven shock propagating through a multilayer target,
  a configuration subject to both Rayleigh-Taylor and Richtmyer-Meshkov instabilities.
  The second test is a classic Rayleigh-Taylor instability, where a heavy fluid is
  supported against the force of gravity by a light fluid. Our simulations of the
  multilayer target experiments showed good agreement with the experimental results,
  but our simulations of the Rayleigh-Taylor instability did not agree well with the
  experimental results. We discuss our findings and present results of additional
  simulations undertaken to further investigate the Rayleigh-Taylor instability.
