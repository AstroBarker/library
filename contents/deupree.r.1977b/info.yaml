abstract: The theoretical location of the red edge of the RR Lyrae gap is found for
  models pulsating in the first overtone mode. Convection causes a return to pulsational
  stability for these models. The location of the red edge for the overtone models
  is to the blue of the red edge for fundamental mode pulsators.
