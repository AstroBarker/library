abstract: As Voyager 1 and Voyager 2 are approaching the heliopause (HP)---the boundary
  between the solar wind (SW) and the local interstellar medium (LISM)---we expect
  new, unknown features of the heliospheric interface to be revealed. A seeming puzzle
  reported recently by Krimigis et al. concerns the unusually low, even negative,
  radial velocity components derived from the energetic ion distribution. Steady-state
  plasma models of the inner heliosheath (IHS) show that the radial velocity should
  not be equal to zero even at the surface of the HP. Here we demonstrate that the
  velocity distributions observed by Voyager 1 are consistent with time-dependent
  simulations of the SW-LISM interaction. In this Letter, we analyze the results from
  a numerical model of the large-scale heliosphere that includes solar cycle effects.
  Our simulations show that prolonged periods of low to negative radial velocity can
  exist in the IHS at substantial distances from the HP. It is also shown that Voyager
  1 was more likely to observe such regions than Voyager 2.
