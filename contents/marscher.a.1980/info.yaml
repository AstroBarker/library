abstract: Neutrino, gamma-ray, electron and positron production resulting from inelastic
  proton-proton collisions in a highly relativistic plasma such as may exist in extragalactic
  radio or gamma-ray burst sources is examined. The source functions of primary (pions,
  kaons, and neutrons) and secondary (photons, electrons, positrons and neutrinos)
  products of relativistic nuclear collisions are computed for the cases of power
  law and Maxwellian relativistic proton distributions. It is shown that in plasma
  which is optically thin to interactions between the plasma and secondary gamma-rays,
  electrons and positrons, only a small fraction of the initial energy is emitted
  in the observable form of neutrinos and gamma rays. In an optically thick plasma
  on the other hand, most of the energy of the relativistic protons is found to be
  equally divided between gamma rays and neutrinos, although only the neutrinos may
  escape freely to be observed.
