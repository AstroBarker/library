abstract: We present a theoretical model for supernova SN 2008D associated with the
  luminous X-ray transient 080109. The bolometric light curve and optical spectra
  of the SN are modeled based on the progenitor models and the explosion models obtained
  from hydrodynamic/nucleosynthetic calculations. We find that SN 2008D is a more
  energetic explosion than normal core-collapse supernovae, with an ejecta mass of
  M ej = 5.3 $\pm$ 1.0 M sun and a kinetic energy of E K = 6.0 \$\pm\$ 2.5 \texttimes{}
  1051 erg. The progenitor star of the SN has a 6-8 M sun He core with essentially
  no H envelope (<5 \texttimes{} 10-4 M sun) prior to the explosion. The main-sequence
  mass of the progenitor is estimated to be M MS = 20-25 M sun, with additional systematic
  uncertainties due to convection, mass loss, rotation, and binary effects. These
  properties are intermediate between those of normal SNe and hypernovae associated
  with gamma-ray bursts. The mass of the central remnant is estimated as 1.6-1.8 M
  sun, which is near the boundary between neutron star and black hole formation.
