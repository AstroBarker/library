abstract: We present BVRI light curves of 165 Type Ia supernovae (SNe Ia) from the
  Lick Observatory Supernova Search follow-up photometry program from 1998 through
  2008. Our light curves are typically well sampled (cadence of 3-4 days) with an
  average of 21 photometry epochs. We describe our monitoring campaign and the photometry
  reduction pipeline that we have developed. Comparing our data set to that of Hicken
  et al., with which we have 69 overlapping supernovae (SNe), we find that as an ensemble
  the photometry is consistent, with only small overall systematic differences, although
  individual SNe may differ by as much as 0.1 mag, and occasionally even more. Such
  disagreement in specific cases can have significant implications for combining future
  large data sets. We present an analysis of our light curves which includes template
  fits of light-curve shape parameters useful for calibrating SNe Ia as distance indicators.
  Assuming the B - V color of SNe Ia at 35 days past maximum light can be presented
  as the convolution of an intrinsic Gaussian component and a decaying exponential
  attributed to host-galaxy reddening, we derive an intrinsic scatter of sigma = 0.076
  $\pm$ 0.019 mag, consistent with the Lira-Phillips law. This is the first of two
  papers, the second of which will present a cosmological analysis of the data presented
  herein.
