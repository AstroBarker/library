abstract: The present study of hypercritical accretion flows onto neutron stars considers
  steady-state, spherically symmetric flows whose accretion rate range is characterized
  by the carrying away of gravitational-accretion energy by neutrinos. The models
  used encompass pair production, radiation diffusion, and general relativistic effects.
  While pair pressure dominates throughout the accretion envelope when accretion rates
  above about 100 solar masses/yr, radiation diffusion becomes important when the
  accretion rate falls below about 0.001 solar masses/yr. At the lower accretion rates,
  free fall toward the neutron-star surface stops and an extended, quasi-static, radiation
  pressure-supported envelope emerges which is probably dynamically unstable.
