abstract: Stars in galactic nuclei can be captured or tidally disrupted by a central
  black hole. Some debris would be ejected at high speed; the remainder would be swallowed
  by the hole, causing a bright flare lasting at most a few years. Such phenomena
  are compatible with the presence of 10 to the 6th-10 to the 8th solar mass holes
  in the nuclei of many nearby galaxies. Stellar disruption may have interesting consequences
  in our own Galactic Center if an approximately 10 to the 6th solar mass hole lurks
  there.
