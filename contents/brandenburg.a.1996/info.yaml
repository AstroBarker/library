abstract: We use three-dimensional simulations to study compressible convection in
  a rotating frame with magnetic fields and overshoot into surrounding stable layers.
  The, initially weak, magnetic field is amplified and maintained by dynamo action
  and becomes organized into flux tubes that are wrapped around vortex tubes. We also
  observe vortex buoyancy which causes upward flows in the cores of extended downdraughts.
  An analysis of the angles between various vector fields shows that there is a tendency
  for the magnetic field to be parallel or antiparallel to the vorticity vector, especially
  when the magnetic field is strong. The magnetic energy spectrum has a short inertial
  range with a slope compatible with k(+1/3) during the early growth phase of the
  dynamo. During the saturated state the slope is compatible with k(-1). A simple
  analysis based on various characteristic timescales and energy transfer rates highlights
  important qualitative ideas regarding the energy budget of hydromagnetic dynamos.
