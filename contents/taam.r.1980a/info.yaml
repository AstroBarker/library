abstract: The long-term evolution of an accreting carbon white dwarf of 1.2 solar
  masses is investigated. It is found that for a mass accretion rate of 10 to the
  -9th solar masses/yr a degenerate-helium-shell flash develops, whereas for an accretion
  rate of 5 x 10 to the -10th solar masses/yr a central carbon flash develops. An
  upper bound to the mass accretion rate for which a strong helium-shell flash occurs
  is estimated to be 3 x 10 to the -8th solar masses/yr, a value which is nearly independent
  of the initial mass of the carbon white dwarf. A weak helium-shell flash is indicated
  for mass accretion rates in excess of about 3 x 10 to the -8th solar masses/yr,
  while carbon ignition at high density (approximately 10 to the 10th g/cu cm), perhaps,
  leading to a strong helium-shell flash is indicated for high-mass white dwarfs accreting
  at rates below about 5 x 10 to the -10th solar masses/yr. The results are discussed
  in the context of the nova and Type I supernova phenomena.
