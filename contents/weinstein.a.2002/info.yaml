abstract: The current plan for the Advanced LIGO dual-recycled optical configuration
  and control scheme is described, with emphasis on those elements which differ from
  Initial LIGO. Plans for prototyping this system are discussed, and the prototyping
  effort at the LIGO Caltech 40 Meter Interferometer Laboratory is described in some
  detail. Finally, some of the modelling efforts at Caltech are reviewed.
