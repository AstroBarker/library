abstract: The major uncertainties involved in the Chandrasekhar mass models for Type
  Ia supernovae (SNe Ia) are related to the companion star of their accreting white
  dwarf progenitor (which determines the accretion rate and consequently the carbon
  ignition density) and the flame speed after the carbon ignition. We calculate explosive
  nucleosynthesis in relatively slow deflagrations with a variety of deflagration
  speeds and ignition densities to put new constraints on the above key quantities.
  The abundance of the Fe group, in particular of neutron-rich species like 48Ca,
  50Ti, 54Cr, 54,58Fe, and 58Ni, is highly sensitive to the electron captures taking
  place in the central layers. The yields obtained from such a slow central deflagration,
  and from a fast deflagration or delayed detonation in the outer layers, are combined
  and put to comparison with solar isotopic abundances. To avoid excessively large
  ratios of 54Cr/56Fe and 50Ti/56Fe, the central density of the ''average'' white
  dwarf progenitor at ignition should be as low as <~2\texttimes{}109 g cm-3. To avoid
  the overproduction of 58Ni and 54Fe, either the flame speed should not exceed a
  few percent of the sound speed in the central low Ye layers or the metallicity of
  the average progenitors has to be lower than solar. Such low central densities can
  be realized by a rapid accretion as fast as M>~1\texttimes{}10-7 Msolar yr-1. In
  order to reproduce the solar abundance of 48Ca, one also needs progenitor systems
  that undergo ignition at higher densities. Even the smallest laminar flame speeds
  after the low-density ignitions would not produce sufficient amount of this isotope.
  We also found that the total amount of 56Ni, the Si-Ca/Fe ratio, and the abundance
  of some elements like Mn and Cr (originating from incomplete Si burning), depend
  on the density of the deflagration-detonation transition in delayed detonations.
  Our nucleosynthesis results favor transition densities slightly below 2.2\texttimes{}107
  g cm-3.
