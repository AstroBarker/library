abstract: High-energy particle acceleration is observed to proceed in a diverse variety
  of astrophysical sites ranging from the terrestrial aurorae to the most distant
  quasars. Particle acceleration is a fairly common channel for the release of large-scale
  kinetic, rotational, and magnetic energy. Physical mechanisms include electrostatic
  acceleration, stochastic processes, and diffusive shock energization. Cosmic-ray
  energy spectra have shapes which reflect escape, collisional, and radiative losses.
  The overall acceleration efficiency is controlled by the low-energy particle injection
  which may, in turn, feed back into the energization. Recent observational developments,
  which illustrate these general principles and raise fresh questions, are briefly
  summarized.
