abstract: We have developed phenomenological turbulent effects with one-dimensional
  (1D) simulation based on Reynolds decomposition. Using the method, we have conducted
  a systematic study of 320 models changing progenitor mass, mixing-length parameter,
  and diffusion coefficients for internal energy, turbulent energy, and electron fraction.
  With employed turbulent effects, supernova explosion can be achieved even in 1D
  geometry. We find that smaller diffusive transport on the internal energy makes
  the shock revival faster and explosion energy larger in contrast to the prediction
  of the previous study. The smaller diffusion keeps the negative entropy gradients
  and enhances the turbulent pressure, hindering mass accretion in the gain region.
  The progenitor dependence of explodability is also investigated in the mixing-length
  parameter plane and diffusion coefficients plane. These simulations would help understand
  the role of turbulence in core-collapse supernovae.
