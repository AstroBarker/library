abstract: We present a new series of supernova neutrino light curves and spectra calculated
  by numerical simulations for a variety of progenitor stellar masses (13-50 M \&sun;)
  and metallicities (Z = 0.02 and 0.004), which would be useful for a broad range
  of supernova neutrino studies, e.g., simulations of future neutrino burst detection
  by underground detectors or theoretical predictions for the relic supernova neutrino
  background. To follow the evolution from the onset of collapse to 20 s after the
  core bounce, we combine the results of neutrino-radiation hydrodynamic simulations
  for the early phase and quasi-static evolutionary calculations of neutrino diffusion
  for the late phase, with different values of shock revival time as a parameter that
  should depend on the still unknown explosion mechanism. We describe the calculation
  methods and basic results, including the dependence on progenitor models and the
  shock revival time. The neutrino data are publicly available electronically.
