abstract: Nonlinear growth of 2D Rayleigh-Taylor (R-T) instabilities are numerically
  studied to apply to the mixing in the supernova ejecta. Highly refined calculations
  of mixing in the realistic model of SN 1987A with a better code and various mesh
  resolutions are presented. It is shown that mixing width (or the extent of mixing)
  due to Rayleigh-Taylor instabilities is still too small to account for the observations
  even with relatively large initial perturbation. The mixing width is found to depend
  only slightly on the mesh resolution when the initial amplitude is larger than about
  5 percent of the expansion speed. To clarify the basic properties of the R-T instabilities
  and the dependence of the mixing width on the initial density structure, initial
  perturbation, and numerical resolution, highly simplified ideal models of R-T instabilities
  of compressible gas with an adiabatic constant of 4/3 are considered. It is found
  that, when the initial amplitude of the velocity perturbation is larger than 1 percent
  of the sound speed, the mixing width in time depends mainly on the initial amplitudes
  and the density ratio.
