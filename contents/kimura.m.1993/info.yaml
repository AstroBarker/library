abstract: Rate coefficients for nonradiative charge transfer in collisions of He+
  with C are calculated for temperatures up to 10,000 K. The rate coefficients increase
  from 2.8 \texttimes{} 10-15 cm-3 s-1 at 100 K to 6.8 \texttimes{} 10-13 cm-2 s-1
  at 10,000 K.
