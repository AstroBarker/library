abstract: The magnetic hyperfine structure factor A of the quasi-totality of the levels
  of the low 4 p 3 and 4 p 25 s configurations of As I has been measured by Fabry-Perot
  interferometry in the far UV range. A good agreement is observed between experimental
  results and theoretical evaluations, which allows us to confirm that the 4 p 25s
  configuration only mixes very weakly (less than 1\%) with 4 s4 p 4.
