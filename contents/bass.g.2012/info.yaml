abstract: KIC 6131659 is a long-period (17.5 days) eclipsing binary discovered by
  the Kepler mission. We analyzed six quarters of Kepler data along with supporting
  ground-based photometric and spectroscopic data to obtain accurate values for the
  mass and radius of both stars, namely, M 1 = 0.922 $\pm$ 0.007 M \&sun;, R 1 = 0.8800
  \$\pm\$ 0.0028 R \&sun;, and M 2 = 0.685 \$\pm\$ 0.005 M \&sun;, R 2 = 0.6395 \$\pm\$
  0.0061 R \&sun;. There is a well-known issue with low-mass (M <~ 0.8 M \&sun;) stars
  (in cases where the mass and radius measurement uncertainties are smaller than 2\%
  or 3\%) where the measured radii are almost always 5\% to 15\% larger than expected
  from evolutionary models, i.e., the measured radii are all above the model isochrones
  in a mass-radius plane. In contrast, the two stars in KIC 6131659 were found to
  sit on the same theoretical isochrone in the mass-radius plane. Until recently,
  all of the well-studied eclipsing binaries with low-mass stars had periods of less
  than about three days. The stars in such systems may have been inflated by high
  levels of stellar activity induced by tidal effects in these close binaries. KIC
  6131659 shows essentially no evidence of enhanced stellar activity, and our measurements
  support the hypothesis that the unusual mass-radius relationship observed in most
  low-mass stars is influenced by strong magnetic activity created by the rapid rotation
  of the stars in tidally locked, short-period systems. Finally, using short cadence
  data, we show that KIC 6131657 has one of the smallest measured non-zero eccentricities
  of a binary with two main-sequence stars, where ecos omega = (4.57 \$\pm\$ 0.02)
  \texttimes{} 10-5.  Based on observations obtained with the Hobby-Eberly Telescope,
  which is a joint project of the University of Texas at Austin, the Pennsylvania
  State University, Stanford University, Ludwig-Maximilians-Universit{\"a}t M{\"u}nchen,
  and Georg-August-Universit{\"a}t G{\"o}ttingen.
