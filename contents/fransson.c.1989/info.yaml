abstract: Monte Carlo techniques are used to study the energy deposition of gamma
  rays from the radioactive decay of Co-56 in Type Ib and Type II SN. It is found
  that above an electron fraction of about 0.1, direct excitations are negligible,
  and the line emission arises from thermal processes. The results indicate that the
  emission is dominated by neutral and singly ionized lines, including forbiden O
  I, forbidden Ca II, forbidden C I, and forbidden Si I. The late spectrum is shown
  to be useful as a diagnostic of the nucleosynthetic structure of the ejecta. The
  present model has been applied to observations of the Type Ib SN 1985F, and it is
  suggested that Type Ib SN come from stars of greater than 25 solar masses.
