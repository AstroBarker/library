abstract: A catalog of SN 1987A polarimetry is given that covers the period from day
  2 to day 262. The catalog includes broad-band and narrow-band polarimetry and spectropolarimetry.
  The polarimetry has been corrected for the interstellar polarization along the line
  of sight to SN 1987A. Since the interstellar polarization is of the same order as
  the SN 1987A polarization, a correction for the interstellar polarization is essential
  for observing the intrinsic behavior of the SN 1987A polarization. It is hoped that
  the catalog will aid and encourage further analyses of the SN 1987A polarimetric
  data.
