abstract: Optical spectra of the Type II supernova in NGC 3169 were obtained near
  maximum light using the 3.9-m Anglo-Australian Telescope. A grating of 250 lines
  per mm in blue was used to give continuous wavelength coverage from 3400 to 7600
  A. The spectra show a P Cygni structure in the Balmer lines. The high velocity component
  suggests a velocity of expansion of the photosphere of about 15,500 km/s while the
  helium lines give a velocity of 13,500 km/s. From the size of the Balmer discontinuity
  and the ratio of continuum fluxes at 4861 and 6563 A, a photospheric temperature
  of 15,500 (+ or - 1800) K is derived. The photospheric radius was at least 3 x 10
  to the 14th cm. The narrow P Cygni profiles observed in H-alpha to H-delta indicate
  that the precursor star underwent a strong episode of mass loss just prior to the
  supernova event, and that the wind was outflowing at a velocity close to 3000 km/s
  at the time of observation.
