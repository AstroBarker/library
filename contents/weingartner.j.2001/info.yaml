abstract: We construct size distributions for carbonaceous and silicate grain populations
  in different regions of the Milky Way, LMC, and SMC. The size distributions include
  sufficient very small carbonaceous grains (including polycyclic aromatic hydrocarbon
  molecules) to account for the observed infrared and microwave emission from the
  diffuse interstellar medium. Our distributions reproduce the observed extinction
  of starlight, which varies depending on the interstellar environment through which
  the light travels. As shown by Cardelli, Clayton, and Mathis in 1989, these variations
  can be roughly parameterized by the ratio of visual extinction to reddening, RV.
  We adopt a fairly simple functional form for the size distribution, characterized
  by several parameters. We tabulate these parameters for various combinations of
  values for RV and bC, the C abundance in very small grains. We also find size distributions
  for the line of sight to HD 210121 and for sight lines in the LMC and SMC. For several
  size distributions, we evaluate the albedo and scattering asymmetry parameter and
  present model extinction curves extending beyond the Lyman limit.
