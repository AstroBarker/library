abstract: We present optical photometry and spectra of the superluminous Type II/IIn
  supernova (SN) CSS121015:004244+132827 (z = 0.2868) spanning epochs from -30 d (rest
  frame) to more than 200 d after maximum. CSS121015 is one of the more luminous SNe
  ever found and one of the best observed. The photometric evolution is characterized
  by a relatively fast rise to maximum (\texttildelow{}40 d in the SN rest frame),
  and by a linear post-maximum decline. The light curve shows no sign of a break to
  an exponential tail. A broad Halpha is first detected at \texttildelow{}+40 d (rest
  frame). Narrow, barely resolved Balmer and [O III] 5007 {\AA} lines, with decreasing
  strength, are visible along the entire spectral evolution. The spectra are very
  similar to other superluminous supernovae (SLSNe) with hydrogen in their spectrum,
  and also to SN 2005gj, sometimes considered Type Ia interacting with H-rich circumstellar
  medium. The spectra are also similar to a subsample of H-deficient SLSNe. We propose
  that the properties of CSS121015 are consistent with the interaction of the ejecta
  with a massive, extended, opaque shell, lost by the progenitor decades before the
  final explosion, although a magnetar-powered model cannot be excluded. Based on
  the similarity of CSS121015 with other SLSNe (with and without H), we suggest that
  the shocked-shell scenario should be seriously considered as a plausible model for
  both types of SLSN.
