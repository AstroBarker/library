abstract: New observations of the binary pulsar B1913+16 are presented. Since 1978
  the leading component of the pulse profile has weakened dramatically by about 40\%.
  For the first time, a decrease in component separation is observed, consistent with
  expectations of geodetic precession. Assuming the correctness of general relativity
  and a circular hollow-cone-like beam, a fully consistent model for the system geometry
  is developed. The misalignment angle between pulsar spin and orbital momentum is
  determined, giving direct evidence for an asymmetric kick during the second supernova
  explosion. It is argued that the orbital inclination angle is 132.8d (rather than
  47.2d). A prediction of this model is that PSR B1913+16 will no longer be observable
  after the year 2025.
