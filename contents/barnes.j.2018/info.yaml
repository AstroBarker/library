abstract: Unusually high velocities (\greaterequivlnt{}0.1c) and correspondingly high
  kinetic energies have been observed in a subset of Type Ic supernovae (so-called
  ``broad-lined Ic'' supernovae; SNe Ic-BL), prompting a search for a central engine
  model capable of generating such energetic explosions. A clue to the explosion mechanism
  may lie in the fact that all supernovae that accompany long-duration gamma-ray bursts
  (GRBs) belong to the SN Ic-BL class. Using a combination of two-dimensional relativistic
  hydrodynamics and radiation transport calculations, we demonstrate that the central
  engine responsible for long GRBs can also trigger an SN Ic-BL. We find that a reasonable
  GRB engine injected into a stripped Wolf-Rayet progenitor produces a relativistic
  jet with energy \texttildelow{}1051 erg, as well as an SN whose synthetic light
  curves and spectra are fully consistent with observed SNe Ic-BL during the photospheric
  phase. As a result of the jet's asymmetric energy injection, the SN spectra and
  light curves depend on viewing angle. The impact of viewing angle on the spectrum
  is particularly pronounced at early times, while the viewing-angle dependence for
  the light curves (\texttildelow{}10\% variation in bolometric luminosity) persists
  throughout the photospheric phase.
