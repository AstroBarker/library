abstract: 'We discuss a recent controversy about the Planck-Larkin partition function,
  and present optical simulations of high-quality spectra from laboratory hydrogen
  plasmas (Wiese, Kelleher, and Paquette) using several partition function formalisms.
  We point out that the controversy has arisen from a misunderstanding about the use
  of the Planck-Larkin partition function. A Planck-Larkin cancellation may still
  have its place in equations of state that are based on quantum-statistical many-body
  theory (i.e., the "physical picture"). However, experimental evidence shows that
  it is inconsistent to use the Planck-Larkin partition function as the internal partition
  function in simple models of reacting gases (i.e., the "chemical picture"). Moreover,
  the more sophisticated equations of state of the physical picture will have to be
  subjected to the same comparison with experimental data. We also address the question
  of plasma polarization shifts of bound-state energies. We discuss the static-screened
  Coulomb potential (SSCP) as an atomic potential: from theoretical considerations
  and observational constraints we conclude that it should not be used. The only useful
  result of the SSCP potential its prediction of the number of excited be obtained
  by alternative means, e.g., by an occupation probability formalism.'
