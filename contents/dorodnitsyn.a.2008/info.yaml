abstract: We report on time-dependent axisymmetric simulations of an X-ray-excited
  flow from a parsec-scale, rotating, cold torus around an active galactic nucleus.
  Our simulations account for radiative heating and cooling and radiation pressure
  force. The simulations follow the development of a broad biconical outflow induced
  mainly by X-ray heating. We compute synthetic spectra predicted by our simulations.
  The wind characteristics and the spectra support the hypothesis that a rotationally
  supported torus can serve as the source of a wind which is responsible for the warm
  absorber gas observed in the X-ray spectra of many Seyfert galaxies.
