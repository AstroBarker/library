abstract: The Hubble Space Telescope (HST) has capabilities for direct imaging, photometry,
  spectrophotometry, polarimetry, and astrometry. The combined scientific instruments
  cover the wavelength range from about 1150 to 11,000 {\AA}. This paper presents
  an overview of the standard astronomical sources, referred to here as calibration
  targets, which will be used to calibrate HST images, photometry, spectrophotometry,
  and polarimetry in the UV and optical wavelength regions. Finding charts, accurate
  coordinates, and other details are presented. References to documents with more
  detail on HST calibration requirements, calibration targets, and calibration plans
  are included.
