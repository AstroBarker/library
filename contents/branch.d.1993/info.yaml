abstract: 'After defining what we mean by spectroscopically ''normal'' and ''peculiar''
  Type Ia supernova, we report the results of an attempt to sub-classify 84 SNe Ia
  either as normal or as like one of the recent, peculiar SNe Ia: 1991T, 1991bg, or
  1986G. Only SNe 1957A and 1960H are found to have been certifiably abnormal, with
  SN 1957A; appearing to have been like SN 1991bg, and SN 1960H having been like SN
  1991bg or SN 1988G; SNe 1971I and 1980I are under suspicion of having been like
  SN 1986G, and SN 1988G of having been like SN 1991T. Of the SNe Ia we have been
  able to classify either as normal or as peculiar, 89\% (or 83\%, counting those
  under suspicion as peculiar) are normal. Our main conclusion is that the observational
  sample of SNe Ia is strongly peaked at ''spectroscopically normal.'' We further
  conclude that when arranged in the photometric sequence of Phillips (1993) SNe Ia
  also form a spectroscopic sequence, and that peculiar SNe Ia are over-represented
  in the Phillips sample.'
