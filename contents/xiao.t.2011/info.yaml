abstract: We present new measurements of stellar velocity dispersions, using spectra
  obtained with the Keck Echellette Spectrograph and Imager (ESI) and the Magellan
  Echellette (MagE), for 76 Seyfert 1 galaxies from the recent catalog of Greene \&
  Ho. These objects were selected from the Sloan Digital Sky Survey (SDSS) to have
  estimated black hole (BH) masses below 2 \texttimes{} 106 M sun. Combining our results
  with previous ESI observations of similar objects, we obtain an expanded sample
  of 93 galaxies and examine the relation between BH mass and velocity dispersion
  (the M BH-sigma\textasteriskcentered relation) for active galaxies with low BH masses.
  The low-mass active galaxies tend to follow the extrapolation of the M BH-sigma\textasteriskcentered
  relation of inactive galaxies. Including results for active galaxies of higher BH
  mass from the literature, we find a zero point alpha = 7.68 $\pm$ 0.08 and slope
  of beta = 3.32 \$\pm\$ 0.22 for the M BH-sigma\textasteriskcentered relation (in
  the form log M BH = alpha + betalog (sigma\textasteriskcentered/200 km s-1)), with
  intrinsic scatter of 0.46 \$\pm\$ 0.03 dex. This result is consistent, within the
  uncertainties, with the slope of the M BH-sigma\textasteriskcentered relation for
  reverberation-mapped active galaxies with BH masses from 106 to 109 M sun. For the
  subset of our sample having morphological information from Hubble Space Telescope
  images, we examine the slope of the M BH-sigma\textasteriskcentered relation separately
  for subsamples of barred and unbarred host galaxies, and find no significant evidence
  for a difference in slope. We do find a mild offset between low-inclination and
  high-inclination disk galaxies, such that more highly inclined galaxies tend to
  have larger sigma\textasteriskcentered at a given value of BH mass, presumably due
  to the contribution of disk rotation within the spectroscopic aperture. We also
  find that the velocity dispersion of the ionized gas, measured from narrow emission
  lines including [N II] lambda6583, [S II] lambdalambda6716, 6731, and the core of
  [O III] lambda5007 (with the blueshifted wing removed), trace the stellar velocity
  dispersion well for this large sample of low-mass Seyfert 1 galaxies.
