abstract: The first few seconds of the explosion of SN 1987A are modeled here using
  a 2D cylindrical geometry smooth particle hydrodynamics code. The success of the
  explosion is determined to be sensitive to the duration of the infall, the timing
  of the bounce, and the subsequent neutrino heating. A semianalytical model for the
  initial structure of the collapsed object is used to present two simulations that
  differ by the mass that has been allowed to collapse into a neutron star prior to
  the bounce. In the case of a short initial infall, the explosion fails due to excessive
  cooling. For a longer initial infall, the cooling is less and the explosion is successful
  although relatively weak. It is shown that in this case, a successful explosion
  is brought about by the presence of an entropy gradient which, combined with the
  gravitational pull of the neutron star, leads to extremely strong instabilities.
  The critical importance of the global circulation for the success of the explosion
  is demonstrated.
