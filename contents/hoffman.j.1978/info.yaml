abstract: SAS 3 has observed two unusual fast transient X-ray events from different
  sources, one lasting about 150 s and one, approximately 1500 s. Both events were
  preceded by precursor pulses which lasted a few seconds and which rose and fell
  in less than 0.4 s. The precursors were separated from the 'main' events by several
  seconds, during which no X-rays were detected. There are similarities between the
  two main events and X-ray bursts in both their temporal and spectral evolution.
  The spectra of the main events started out much softer than the spectra of the precursors,
  became harder as they approached maximum intensity, and softened as they decayed.
  In the 1500-s event, X-rays with energies greater than 10 keV were delayed by about
  80 s compared with 1.5-6-keV X-rays. A blackbody fit to the spectral data of the
  main event of approximately 1500-s duration gives a maximum temperature of 29 million
  K and a radius for the emitting region of at least about 9 km (at a distance of
  10 kpc); this is similar to the temperature and sizes found for several X-ray burst
  sources.
