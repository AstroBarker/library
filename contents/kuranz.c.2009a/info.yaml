abstract: This paper shows results from experiments diagnosing the development of
  the Rayleigh-Taylor instability with two-dimensional initial conditions at an embedded,
  decelerating interface. Experiments are performed at the Omega Laser and use ~5
  kJ of energy to create a planar blast wave in a dense, plastic layer that is followed
  by a lower density foam layer. The single-mode interface has a wavelength of 50
  mum and amplitude of 2.5 mum. Some targets are supplemented with additional modes.
  The interface is shocked then decelerated by the foam layer. This initially produces
  the Richtmyer-Meshkov instability followed and then dominated by Rayleigh-Taylor
  growth that quickly evolves into the nonlinear regime. The experimental conditions
  are scaled to be hydrodynamically similar to SN1987A in order to study the instabilities
  that are believed to occur at the He/H interface during the blast-wave-driven explosion
  phase of the star. Simulations of the experiment were performed using the FLASH
  hydrodynamics code.
