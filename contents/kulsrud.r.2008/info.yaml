abstract: We review the extensive and controversial literature concerning how the
  cosmic magnetic fields pervading nearly all galaxies and clusters of galaxies actually
  got started. Some observational evidence supports a hypothesis that the field is
  already moderately strong at the beginning of the life of a galaxy and its disc.
  One argument involves the chemical abundance of the light elements Be and B, while
  a second one is based on the detection of strong magnetic fields in very young high
  red shift galaxies.  Since this problem of initial amplification of cosmic magnetic
  fields involves important plasma problems it is obvious that one must know the plasma
  in which the amplification occurs. Most of this review is devoted to this basic
  problem and for this it is necessary to devote ourselves to reviewing studies that
  take place in environments in which the plasma properties are most clearly understood.
  For this reason the authors have chosen to restrict themselves almost completely
  to studies of dynamos in our Galaxy. It is true that one can get a much better idea
  of the grand scope of galactic fields in extragalactic systems. However, most mature
  galaxies share the same dilemma as ours of overcoming important plasma problems.
  Since the authors are both trained in plasma physics we may be biased in pursuing
  this approach, but we feel it is justified by the above argument. In addition we
  feel we can produce a better review by staying close to that which we know best.  In
  addition we have chosen not to consider the saturation problem of the galactic magnetic
  field since if the original dynamo amplification fails the saturation question does
  not arise.  It is generally accepted that seed fields, whose strength is of order
  10-20 G, easily spring up in the era preceding galaxy formation. Several mechanisms
  have been proposed to amplify these seed magnetic fields to a coherent structure
  with the microgauss strengths of the currently observed galactic magnetic fields.  The
  standard and most popular mechanism is the alpha-Omega mean field dynamo theory
  developed by a number of people in the late sixties. This theory and its application
  to galactic magnetic fields is discussed in considerable detail in this review.
  We point out certain difficulties with this theory that make it seem unlikely that
  this is the whole story. The main difficulty with this as the only such amplification
  mechanism is rooted in the fact that, on galactic scales, flux is constant and is
  frozen in the interstellar medium. This implies that flux must be removed from the
  galactic discs, as is well recognized by the standard theory.  For our Galaxy this
  turns out to be a major problem, since unless the flux and the interstellar mass
  are somehow separated, some interstellar mass must also be removed from the deep
  galactic gravitational well. This is very difficult. It is pointed out that unless
  the field has a substantial field strength, much larger than that of the seed fields,
  this separation can hardly happen. And of course, it must if the alpha-Omega dynamo
  is to start from the ultra weak seed field. (It is our philosophy, expressed in
  this review, that if an origin theory is unable to create the magnetic field in
  our Galaxy it is essentially incomplete.)  Thus, it is more reasonable for the first
  and largest amplification to occur before the Galaxy forms, and the matter embedded
  in the field is gravitationally trapped. Two such mechanisms are discussed for such
  a pregalactic origin; (1) they are generated in the turbulence of the protogalaxy
  and (2) the fields come from giant radio jets. Several arguments against a primordial
  origin are also discussed, as are ways around them.  Our conclusion as to the most
  likely origin of cosmic magnetic fields is that they are first produced at moderate
  field strengths by primordial mechanisms and then changed and their strength increased
  to their present value and structure by a galactic disc dynamo. The primordial mechanisms
  have not yet been seriously developed, and this preliminary amplification of the
  magnetic fields is still very open. If a convincing case can be made that these
  primordial mechanisms are necessary, more effort will of course be devoted to their
  study.
