abstract: We have constructed the bolometric light curve of SN1993J based on UBVRI(JHK)
  photometric data obtained from various sources and assuming A(V) = 0 and a distance
  modulus of 27.6. Effective temperatures and photosphere radius at various times
  have been obtained from detailed blackbody fits. The bolometric light curve shows
  two maxima. The short rise time to the second maximum, and the luminosities at the
  minimum and the second maximum are used to constrain the properties of the progenitor
  star. The total mass of the hydrogen envelope MH, in the star is found to be less
  than about 0.2 solar mass at the time of explosion, and the explosion ejected about
  0.05 solar mass of Ni-56. Thin hydrogen envelope combined with a sufficient presupernova
  luminosity suggest that the exploding star was in a binary with a probable period
  range of 5-11 yr.
