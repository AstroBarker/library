abstract: The collapse and supernova explosion, via the core-bounce-reflection-shock
  mechanism, of a spherically symmetric iron core of a massive star is studied using
  the full general theory of relativity (GR). The neglect of GR in some recent collapse
  calculations is not justified, even though the GR 'corrections' appear small. Bounces
  at low density (central density approximately 10 to the 13 g/cu cm), which are found
  in these Newtonian models, are close to critical in GR, and may not occur. With
  the new equation of state of Lamb, Lattimer, Pethick, and Ravenhall (1978) collapse
  simulations will not show a bounce until nuclear density is exceeded. The results
  of collapse models which bounce at neutron star densities are presented. Large explosion
  energies - up to 6 x 10 to the 51st ergs - are found if the bounce is near critical;
  the GR 'effective softening' of the equation of state then leads to the large rebound
  amplitude necessary for energetic explosions by the hydrodynamic mechanism. The
  mass division between neutron-star and black-hole formation is considered. The difference
  equations used for the GR hydrodynamics are presented.
