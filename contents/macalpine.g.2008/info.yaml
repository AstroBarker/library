abstract: We present new photoionization calculations for investigating gaseous regions
  that represent potentially expected stages of nuclear processing in the Crab Nebula
  supernova remnant. From comparison of the theoretical models with recent, extensive
  emission-line measurements, most of the emitting gas appears to be nitrogen-poor
  and carbon-rich. These results suggest that the precursor star had an initial mass
  gsim 9.5 M sun.
