abstract: We present a series of high-resolution echelle spectra of         SN\raisebox{-0.5ex}\textasciitilde2023ixf
  in M101, obtained         nightly during the first week or so after discovery using
  PEPSI         on the LBT. NaID absorption in these spectra indicates a         reddening
  of $E(B-V)$=0.031\raisebox{-0.5ex}\textasciitildemag         and a systemic velocity
  of \\raisebox{-0.5ex}\textasciitildek         m\raisebox{-0.5ex}\textasciitildes\$^{-1}\$
  relative to the         average redshift of M101. Dramatic changes are seen in in
  the         strength and shape of strong emission lines emitted by CSM,         including
  HeII4686, CIV5801,5811, H\$\alpha\$, and NIV7109,7123.         In general, these
  narrow lines broaden to become intermediate-         width lines before disappearing
  from the spectrum within a few         days, indicating a limited extent to the
  dense CSM of around         20-30 AU (or \\$^{14.7}\$ cm). H\$\alpha\$ persists
  in the         spectrum for about a week as an intermediate-width emission line         with
  P\raisebox{-0.5ex}\textasciitildeCyg absorption at 700-1300         km s\$^{-1}\$
  arising in the post-shock shell of swept-up CSM.         Early narrow emission lines
  are blueshifted and indicate an         expansion speed in the pre-shock CSM of
  about 115 km s\$^{-1}\$,         but with even broader emission in higher ionization
  lines. This         is faster than the normal winds of red supergiants, suggesting         some
  mode of eruptive mass loss from the progenitor or radiative         acceleration
  of the CSM. A lack of narrow blueshifted absorption         suggests that most of
  the CSM is not along our line of sight.         This and several other clues indicate
  that the CSM of         SN\raisebox{-0.5ex}\textasciitilde2023ixf is significantly         aspherical.
  We find that CSM lines disappear after a few days         because the asymmetric
  CSM is engulfed by the SN photosphere.
