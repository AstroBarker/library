abstract: We present the first observations from a large-scale survey of nearby (z
  < 1) long-duration gamma-ray burst (LGRB) host galaxies, which consist of eight
  rest-frame optical spectra obtained at Keck and Magellan. Along with two host galaxy
  observations from the literature, we use optical emission-line diagnostics to determine
  metallicities, ionization parameters, young stellar population ages, and star formation
  rates. We compare the LGRB host environments to a variety of local and intermediate-redshift
  galaxy populations, as well as the newest grid of stellar population synthesis and
  photoionization models generated with the Starburst99/Mappings codes. With these
  comparisons, we investigate whether the GRB host galaxies are consistent with the
  properties of the general galaxy population, and therefore whether they may be used
  as reliable tracers of star formation. Despite the limitations inherent in our small
  sample, we find strong evidence that LGRB host galaxies generally have low-metallicity
  interstellar medium (ISM) environments out to z ~ 1. The ISM properties of our GRB
  hosts, including metallicity and ionization parameter, are significantly different
  from the general galaxy population and host galaxies of nearby broad-lined Type
  Ic supernovae. However, these properties show better agreement with a sample of
  nearby metal-poor galaxies.
