abstract: A description is presented of a model concerning the production of X-ray
  bursts by thermonuclear flashes in the freshly accreted matter near the surface
  of an accreting neutron star. An investigation is conducted regarding the physical
  processes relevant to such thermonuclear flashes. It is concluded that thermonuclear
  flashes may account for some, but not all, of the observed X-ray burst sources.
  Attention is given to a neutron star undergoing accretion of mass from a binary
  stellar companion, aspects of energetics, nuclear reactions, and heat transport
  mechanisms.
