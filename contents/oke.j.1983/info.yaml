abstract: Based on an adopted absolute spectral energy distribution for the primary
  standard star Alpha Lyrae, absolute fluxes are given for the four very metal-deficient
  F type subdwarfs HD 19445, HD 84937, BD + 26.2606 deg, and BD + 17.4703 deg. Somewhat
  inferior data are also given for HD 140283. The data are given for 40-A bands and
  cover the wavelength range from 3080 A to 12,000 A. The four stars, all near magnitude
  9 and distributed around the sky, are intended as secondary standards for absolute
  spectrophotometry.
