abstract: Development of the Aarhus adiabatic pulsation code started around 1978.
  Although the main features have been stable for more than a decade, development
  of the code is continuing, concerning numerical properties and output. The code
  has been provided as a generally available package and has seen substantial use
  at a number of installations. Further development of the package, including bringing
  the documentation closer to being up to date, is planned as part of the HELAS Coordination
  Action.
