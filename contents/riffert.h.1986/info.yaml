abstract: For a wide range of problems in radiation hydrodynamics the motion of the
  matter is best described in an Eulerian coordinate system, and here a comoving-frame
  equation of radiation transfer in such fixed coordinates is derived, using the radiation
  quantities measured in the comoving frame. The choice of coordinates is arbitrary,
  and the equation is given explicitly for an arbitrary diagonal metric, correct to
  all orders in v/c. All comoving frame equations derived earlier are included as
  special cases. An example is given for the case of a spherically symmetric flow
  in a Schwarzschild metric.
