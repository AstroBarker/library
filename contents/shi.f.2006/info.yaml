abstract: Aims. To assess the possible systematic differences among different oxygen
  abundance indicators and understand the origin of nitrogen and the stars responsible
  for nitrogen production, we present two samples of H II galaxies from the Sloan
  Digital Sky Survey (SDSS) spectroscopic observations, data release 3. Methods. The
  electron temperatures (T\_e) of 225 galaxies are calculated with the photoionized
  H II model and Te of 3997 galaxies are calculated with an empirical method. The
  oxygen abundances from the Te methods of the two samples are determined reliably.
  The oxygen abundances from a strong line metallicity indicator, such as R23, P,
  N2, and O3N2, are also calculated. We compared oxygen abundances of H II galaxies
  obtained with the Te method, R23 method, P method , N2 method, and O3N2 method.Results.The
  oxygen abundances derived with the Te method are systematically lower by ~0.2 dex
  than those derived with the R23 method, consistent with previous studies based on
  H II region samples. No clear offset for oxygen abundance was found between Te metallicity
  and P, N2 and O3N2 metallicity. When we studied the relation between N/O and O/H,
  we found that in the metallicity regime of 12 + log(O/H) > 7.95, the large scatter
  of the relation can be explained by the contribution of small mass stars to the
  production of nitrogen. In the high metallicity regime, 12 + log(O/H) > 8.2, nitrogen
  is primarily a secondary element produced by stars of all masses.
