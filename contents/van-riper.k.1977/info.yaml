abstract: The composition and equation of state of a perfect gas of photons, electrons-photons,
  neutrinos, and nucleons is calculated under the assumption of either perfect neutrino
  transparency or some buildup of neutrino concentration in dense matter. The calculations
  are applicable to collapsing stars after thermal dissociation (temperatures above
  10 billion K) and before nuclear forces are important (densities below 10 to the
  14th power g/cu cm).
