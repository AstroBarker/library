abstract: Most theoretical discussions of active galactic nuclei attribute their energy
  production either to an accreting black hole or to a precursor stage whose inevitable
  end point is a massive black hole. The possibility is explored that some active
  nuclei may contain two massive black holes in orbit about each other. This hypothesis
  suggests a new interpretation for the observed bending and apparent precession of
  radio jets emerging from these objects and may indeed be verified through detection
  of the direct consequences of orbital motion.
