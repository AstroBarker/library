abstract: We present non-local thermodynamic equilibrium (non-LTE) synthetic spectra
  for the Type Ia supernovae SN 1992A and SN 1981B, near maximum light. At this epoch
  both supernovae were observed from the UV through the optical. This wide spectral
  coverage is essential for determining the density structure of a SN Ia. Our fits
  are in good agreement with observation and provide some insight as to the differences
  between these supernovae. We also discuss the application of the expanding photosphere
  method to SNe Ia which gives a distance that is independent of those based on the
  decay of Ni-56 and Cepheid variable stars.
