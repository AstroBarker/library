abstract: The results of the calculations of the neutrino energy-loss rates resulting
  from pair, photo-, plasma, bremsstrahlung, and recombination neutrino processes
  are summarized in the form of analytic fitting formulae and tables. Care has been
  taken in order to serve the convenience of the users of these results. We have tried
  to make the present paper as as possible. The contents of the present paper are
  intended to serve as useful physical input data for stellar evolution computations.
  We intend to publish the numerical data and the FORTRAN codes for the results of
  the neutrino energy-loss rates in the CD-ROM series of the American Astronomical
  Society. in the CD-ROM, we intend to give three options for the FORTRAN codes. The
  first option comprises the results with analytic fitting formulae only. The second
  option comprises the results with analytic fitting formulae for the bremsstrahlung
  and recombination neutrino processes, and the numerical tables for the pair, photo-,
  and plasma neutrino processes with a standard quadratic interpolation procedure.
  In this option, the grid of log T for the pair neutrino energy-loss rate is 0.2.
  The third option is a variant of the second option, with the replacement of the
  grid of log T for the pair neutrino energy-loss rate to be 0.05.
