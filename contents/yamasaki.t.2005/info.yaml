abstract: In order to infer the effects of rotation on the revival of a stalled shock
  in supernova explosions, we investigate steady accretion flows with a standing shock.
  We first obtain a series of solutions for equations describing nonrotating, spherically
  symmetric flows and confirm the results of preceding papers, that for a given mass
  accretion rate, there is a critical luminosity of irradiating neutrinos above which
  there exists no steady solution. Below the critical value, we find two branches
  of solutions; one is stable and the other is unstable against radial perturbations.
  With a simple argument based on the Riemann problem, we can identify the critical
  luminosity as that at which the stalled shock revives. We also obtain a condition
  satisfied by the flow velocity for the critical luminosity, which can easily be
  applied to the rotational case. If a collapsing star rotates, the accretion flow
  is nonspherical as a consequence of centrifugal forces. Flows are accelerated near
  the rotation axis, whereas they are decelerated near the equatorial plane. As a
  result, the critical luminosity is lowered; that is, rotation assists the revival
  of a stalled shock. According to our calculations, the critical luminosity is ~25\%
  lower for a mass accretion rate of 1 Msolar s-1 and a rotational frequency of 0.1
  Hz at a radius of 1000 km than that for a spherically symmetric flow with the same
  mass accretion rate. We find that the condition on the flow velocity at the critical
  luminosity is first satisfied at the rotation axis. This suggests that shock revival
  is triggered on the rotation axis and a jetlike explosion ensues.
