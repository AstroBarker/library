abstract: A 2380-MHz survey of bright galaxies in the declination range from zero
  to +37 deg has been made at Arecibo. It is complete to a photographic magnitude
  of +14.5 in all right ascensions except between 11 h 30 m and 13 h 00 m, where the
  limit is +14.0. Four hundred fifty-six of the 2095 galaxies observed were detected
  above 15 mJy, a cutoff which is the quadratic sum of 5 times the 2-mJy rms confusion
  and 3 times the 3-mJy receiver noise on a single scan.
