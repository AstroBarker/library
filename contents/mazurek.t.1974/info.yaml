abstract: A neutrino mechanism is discussed in order to explain supernovae in massive
  stars. An argument is presented for supernova mass ejection through leptonic neutrino
  transport characteristics suppressed by the arbitrary zero chemical potential condition.
  Results show that lepton conservation effects may be important in supernova neutrino
  transport. At low temperature and density the diffusion approximation becomes less
  precise because of the long mean free paths of low energy neutrinos. The amount
  of equilibrium neutrino spectrum affected here is small over most of the collapsing
  supernova structure.
