abstract: 'In the wake of news of gamma rays detected by the SMM satellite from SN
  1987A, and continued reports of X-rays detected by Ginga, we investigate the problem
  of computing the luminosities in gamma-ray lines and in X-rays from the supernova,
  employing results of (1) radiation hydrodynamic models for the bolometric light
  curve (Arnett 1987), and (2) analytic light curve models (Arnett and Fu 1989), in
  order to constrain several parameters which are crucial for calculation of the radiative
  transfer. In addition, these results point to two important uncertainties: (1) the
  extent of mixing of NiCo-rich matter in the ejecta, and (2) the mass density profile
  during the coasting phase of the expansion. By exploring a range of both the radioactive
  mass distribution and density profile, we find that the high-energy observations
  strongly suggest the development of large- scale clumping and "bubbling" of radioactive
  material in the ejecta. The favored models have a hydrogen envelope mass of \texttildelow{}7
  Msun, homologous scale expansion velocities of \texttildelow{}3000 km s-1, and an
  approximately uniform mass distribution. As we show, these features are consistent
  with three important constraints: (1) the presupernova mass had a helium core of
  6 Msun; (2) the edge of the helium core is moving at \texttildelow{}2100 km s-1;
  (3) values of ESN/M are constrained by the early optical observations and models
  to be 0.7($\pm$.3) \texttimes{} 1017 ergs g-1.'
