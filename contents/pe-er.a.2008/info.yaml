abstract: Propagation of photons in relativistically expanding plasma outflows characterized
  by steady Lorentz factor Gamma is considered. Photons that are injected in regions
  of high optical depth are advected with the flow until they escape at the photosphere.
  Below the photosphere, the photons are coupled to the plasma via Compton scattering.
  I show here that as a result of the slight misalignment of the scattering electrons'
  velocity vectors, the (local) comoving photon energy decreases with radius as epsilon'(r)
  propto r-2/3. This mechanism dominates the photon cooling in scenarios of faster
  adiabatic cooling of the electrons. I then show that the photospheric radius of
  a relativistically expanding plasma wind strongly depends on the angle to the line
  of sight, theta. For theta lesssim Gamma-1, the photospheric radius is theta-independent,
  while for theta gtrsim Gamma-1, rph(theta) propto theta2. I show that the theta-dependence
  of the photosphere implies that for flow parameters characterizing gamma-ray bursts
  (GRBs), thermal photons originating from below the photosphere can be observed up
  to tens of seconds following the inner engine activity decay. I calculate the probability
  density function P(r,theta) of a thermal photon to escape the plasma at radius r
  and angle theta. Using this function, I show that following the termination of the
  internal photon injection mechanism, the thermal flux decreases as FobBB(t) propto
  t-2, and that the decay of the photon energy with radius results in a power-law
  decay of the observed temperature, Tob(t) propto t-2/3 at early times, which changes
  to t-1/2 later. Detailed numerical results are in very good agreement with the analytical
  predictions. I discuss the consequences of this temporal behavior in view of the
  recent evidence for a thermal emission component observed during the prompt emission
  of GRBs.
