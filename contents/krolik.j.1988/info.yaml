abstract: Much evidence exists that the majority of Seyfert nuclei are surrounded
  by a geometrically and optically thick torus of dusty, obscuring gas a few parsecs
  from the center. The authors discuss the principal properties of the gas in the
  torus. It is almost certainly not smoothly distributed; most of its mass is gathered
  into clouds. The balance between cloud merger and tidal shearing ensures that the
  covering factor of these clouds in the axial direction is of order unity and determines
  the shape of the cloud-size distribution function. It is shown that the same viscous
  heating responsible for the large geometrical thickness of the obscuring region
  removes the angular momentum from enough clouds to permit them to be captured by
  the central black hole, fueling its activity and stabilizing the balance between
  evaporation and dissipative inflow.
