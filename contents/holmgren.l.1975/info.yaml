abstract: Transition probabilities and lifetimes were calculated using two different
  local exchange approximations, the Hartree-Slater and the Optimized Hartree-Fock-Slater
  methods. Relativistic self-consistent-field wavefunctions were used to evaluate
  the radial integrals, and a comparison is made between the results obtained with
  the transition probability operator on the dipole velocity and dipole length forms.
  The agreement with available experimental lifetime data is discussed and predicted
  lifetimes are presented for the remaining levels. Intermediate wavefunctions were
  obtained with the aid of intermediate coupling coefficients evaluated from a fit
  to experimental energy levels.
