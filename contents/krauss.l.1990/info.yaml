abstract: A detailed reexamination is made of primordial big-bang nucleosynthesis
  (BBN), concentrating on the data for the main nuclear reactions leading to the production
  of Li-7, He-3 and D, and on the neutron half-life, relevant for He-4 production.
  The new values for reaction rates and uncertainties are then used as input in a
  Monte Carlo analysis of big bang nucleosynthesis of light elements. This allows
  confidence levels for the predictions of the standard BBN model to be high.
