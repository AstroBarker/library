abstract: We examine the case where a circumstellar medium around a supernova is sufficiently
  opaque that a radiation-dominated shock propagates in the circumstellar region.
  The initial propagation of the shock front into the circumstellar region can be
  approximated by a self-similar solution that determines the radiative energy in
  a shocked shell; the eventual escape of this energy gives the maximum luminosity
  of the supernova. If the circumstellar density is described by rho = Dr -2 out to
  a radius Rw , where D is a constant, the properties of the shock breakout radiation
  depend on Rw and Rd \equiv{} kappaDv sh/c, where kappa is the opacity and v sh is
  the shock velocity. If Rw >Rd , the rise to maximum light begins at ~Rd /v sh; the
  duration of the rise is also ~Rd /v sh; the outer parts of the opaque medium are
  extended and at low velocity at the time of peak luminosity; and a dense shell forms
  whose continued interaction with the dense mass loss gives a characteristic flatter
  portion of the declining light curve. If Rw < Rd , the rise to maximum light begins
  at Rw /v sh; the duration of the rise is R 2  w /v sh Rd ; the outer parts of the
  opaque medium are not extended and are accelerated to high velocity by radiation
  pressure at the time of maximum luminosity; and a dense shell forms but does not
  affect the light curve near maximum. We argue that SN 2006gy is an example of the
  first kind of event, while SN 2010gx and related supernovae are examples of the
  second.
