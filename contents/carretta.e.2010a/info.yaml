abstract: 'Homogeneous abundances of light elements, alpha-elements, and Fe-group
  elements from high-resolution FLAMES spectra are presented for 76 red giant stars
  in NGC 6715 (M 54), a massive globular cluster (GC) lying in the nucleus of the
  Sagittarius dwarf galaxy. We also derived detailed abundances for 27 red giants
  belonging to the Sgr nucleus. Our abundances measure the intrinsic metallicity dispersion
  (~0.19 dex, rms scatter) of M 54, with the bulk of stars peaking at [Fe/H] ~ -1.6
  and a long tail extending to higher metallicities, similar to omega Cen. The spread
  in these probable nuclear star clusters exceeds those of most GCs: these massive
  clusters are located in a region intermediate between normal GCs and dwarf galaxies.
  The GC M 54 exibits a Na-O anticorrelation, a typical signature of GCs, which is
  instead absent for the Sgr nucleus. The light elements (Mg, Al, Si) participating
  in the high temperature Mg-Al cycle show that the entire pattern of (anti)correlations
  produced by proton-capture reactions in H-burning is clearly different between the
  most metal-rich and most metal-poor components in the two most massive GCs in the
  Galaxy, confirming early results based on the Na-O anticorrelation. As in omega
  Cen, stars affected by most extreme processing, i.e. showing the signature of more
  massive polluters, are those of the metal-rich component. These observations can
  be understood if the burst of star formation giving birth to the metal-rich component
  was delayed by as much as 10-30 Myr with respect to the metal-poor one. The evolution
  of these massive GCs can be easily reconciled in the general scenario for the formation
  of GCs sketched previously by ourselves, taking into account that omega Cen may
  have already incorporated the surrounding nucleus of its progenitor and lost the
  remainder of the hosting galaxy while the two are still observable as distinct components
  in M 54 and the surrounding field.  Based on observations collected at ESO telescopes
  under programme 081.D-286.Appendix is only available in electronic form at http://www.aanda.orgTables
  2, 3, and 5-7 are only available in electronic form at the CDS via anonymous ftp
  to cdsarc.u-strasbg.fr (130.79.128.5) or via http://cdsweb.u-strasbg.fr/viz-bin/qcat?J/A+A/520/A95'
