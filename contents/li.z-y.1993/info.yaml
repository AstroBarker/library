abstract: We explore the generalized Grad-Shafranov (GS) equation (Lovelace et al.
  1986), which describes the cross-field balance of the magnetic flux surfaces in
  a stationary, axisymmetric, cold relativistic MHD wind. We construct a family of
  self-consistent, jet-type, non-self-similar solutions in which flux surfaces thread
  the equatorial plane vertically and are eventually collimated into nested cylinders.
  These solutions conserve the total energy and angular momentum along each flux surface
  and satisfy the relativistic GS equation in the cross-field direction. We find that
  the total specific energy in the flow depends primarily on a dimensionless combination
  of the poloidal magnetic flux, the rotation, and the mass loading rate, which reduces
  to Michel's (1969) magnetization parameter for radial winds. The final width of
  the flow and its ratio of kinetic energy flux to Poynting flux depend sensitively
  on the pressure distribution of the ambient medium, which is required to contain
  the jet at its outer edge when no jet-confirming external toroidal magnetic field
  is present. Furthermore, we show that the magnetic pressure in the flow can be much
  higher near the axis than close to the edge, reflecting the 'pinching' effect of
  the toroidal magnetic field.
