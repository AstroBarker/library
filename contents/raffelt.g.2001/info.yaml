abstract: The mu- and tau-neutrinos emitted from a proto-neutron star are produced
  by nucleonic bremsstrahlung NN-->NNnunu and pair annihilation e+e--->nunu, reactions
  that freeze out at the ``energy sphere.'' Before escaping from there to infinity,
  the neutrinos diffuse through the ``scattering atmosphere,'' a layer in which their
  main interaction is elastic scattering on nucleons nuN-->Nnu. If these collisions
  are taken to be isoenergetic, as in all numerical supernova simulations, the neutrino
  flux spectrum escaping to infinity depends only on the medium temperature TES and
  the thermally averaged optical depth tauES at the energy sphere. For tauES=10-50,
  one finds for the spectral flux temperature of the escaping neutrinos Tflux=0.5-0.6TES.
  Including energy exchange (nucleon recoil) in nuN-->Nnu can shift Tflux both up
  and down. DeltaTflux depends on tauES, on the scattering atmosphere's temperature
  profile, and on TES. Based on a numerical study, we find that for typical conditions,
  DeltaTflux/Tflux is between -10\% and -20\% and even for extreme parameter choices
  does not exceed -30\%. The exact value of DeltaTflux/Tflux is surprisingly insensitive
  to the assumed value of the nucleon mass; i.e., the exact efficiency of energy transfer
  between neutrinos and nucleons is not important as long as it can occur at all.
  Therefore, calculating the numu and nutau spectra does not seem to require a precise
  knowledge of the nuclear medium's dynamical structure functions.
