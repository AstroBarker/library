abstract: We present mid-infrared spectra of 32 high-redshift ultraluminous infrared
  galaxies, selected via the stellar photospheric feature at rest-frame 1.6 mum, and
  an observed-frame 24 mum flux of >500 muJy. Nearly all the sample reside in a redshift
  range of langle zrangle = 1.71 +/- 0.15 and have rest-frame 1-1000 mum luminosities
  of 1012.9-1013.8 L\&sun;. Most of the spectra exhibit prominent polycyclic aromatic
  hydrocarbon emission features and weak silicate absorption, consistent with a starburst
  origin for the IR emission. Our selection method appears to be a straightforward
  and efficient way of finding distant, IR-luminous, star-forming galaxies in narrow
  redshift ranges. There is, however, evidence that the mid-IR spectra of our sample
  differ systematically from those of local ULIRGs; our sample have comparable PAH
  equivalent widths but weaker apparent silicate absorption, and (possibly) enhanced
  PAH 6.2 mum/7.7 mum and 6.2 mum/11.2 mum flux ratios. Furthermore, the composite
  mid-IR spectrum of our sample is almost identical to that of local starbursts with
  IR luminosities of 1010-1011 L\&sun;, rather than that of local ULIRGs. These differences
  are consistent with a reduced dust column, which can plausibly be obtained via some
  combination of (1) star formation that is extended over spatial scales of 1-4 kpc
  and (2) star formation in unusually gas-rich regions.
