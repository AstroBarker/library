abstract: The nonlinear evolution of the recently identified accretion disk magnetic
  shear instability is investigated through a series of numerical simulations. Finite-difference
  computations of the equations of compressible MHD are carried out on an axisymmetric
  shearing sheet system with periodic boundary conditions designed to approximate
  a local region within an accretion disk. Initial field configurations that include
  some net vertical component evolve into a nonlinear, exponentially growing solution
  with large poloidal velocities and magnetic fields with energies comparable to the
  thermal energy density. The stability of a purely azimuthal field configuration
  is examined, and it is found that nonaxisymmetric instability is present, but with
  a growth time measured in tens of orbital periods. In general, the most rapid growth
  occurs for very small radial and azimuthal wavenumbers, leading to coherent magnetic
  field structure in planes parallel to the disk. It is suggested that this instability
  is a key ingredient for the generation of magnetic fields in disks.
