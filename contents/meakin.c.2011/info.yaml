abstract: Issues concerning the structure and evolution of core collapse progenitor
  stars, and stellar evolution in general, are discussed with an emphasis on interior
  evolution. We discuss some recent results that address quantifying the uncertainties
  inherent in modern stellar evolution calculations, and we describe a research effort
  aimed at investigating the transport and mixing processes associated with stellar
  turbulence, which is arguably the greatest source of uncertainty in supernova progenitor
  structure, besides mass loss, at the time of core collapse. We highlight the important
  role played by precision observations of stellar parameters in constraining theoretical
  models, as well as the physical insight that can be garnered from three-dimensional
  hydrodynamic simulation.
