abstract: Analytic methods for studying the formation of galaxies by gas condensation
  within massive dark halos are presented. The present scheme applies to cosmogonies
  where structure grows through hierarchical clustering of a mixture of gas and dissipationless
  dark matter. The simplest models consistent with the current understanding of N-body
  work on dissipationless clustering, and that of numerical and analytic work on gas
  evolution and cooling are adopted. Standard models for the evolution of the stellar
  population are also employed, and new models for the way star formation heats and
  enriches the surrounding gas are constructed. Detailed results are presented for
  a cold dark matter universe with Omega = 1 and H(0) = 50 km/s/Mpc, but the present
  methods are applicable to other models. The present luminosity functions contain
  significantly more faint galaxies than are observed.
