abstract: A multigroup flux-limited diffusion approximation to neutrino transport,
  correct to first order in material velocities, is described. The role of neutrino-electron
  scattering in determining core deleptonization is studied using a modified Fokker-Planck
  approximation in which adjacent neutrino energy groups are coupled. The moderate
  deleptonizaton obtained during infall restricts homologous core masses to less than
  0.8 solar mass. With 0.6-0.8 solar mass of outer core to traverse, nuclear dissociation
  alone stalls the shock waves produced at core bounce. In addition, neutrino energy
  losses remove at least another 4 x 10 to the 51st ergs. In no case is matter ejected
  promptly as a direct result of the initial shock wave.
