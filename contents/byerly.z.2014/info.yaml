abstract: We test a new "hybrid" scheme for simulating dynamical fluid flows in which
  cylindrical components of the momentum are advected across a rotating Cartesian
  coordinate mesh. This hybrid scheme allows us to conserve angular momentum to machine
  precision while capitalizing on the advantages offered by a Cartesian mesh, such
  as a straightforward implementation of mesh refinement. Our test focuses on measuring
  the real and imaginary parts of the eigenfrequency of unstable nonaxisymmetric modes
  that naturally arise in massless polytropic tori having a range of different aspect
  ratios and on quantifying the uncertainty in these measurements. Our measured eigenfrequencies
  show good agreement with the results obtained from the linear stability analysis
  of Kojima and from nonlinear hydrodynamic simulations performed on a cylindrical
  coordinate mesh by Woodward et al. When compared against results conducted with
  a traditional Cartesian advection scheme, the hybrid scheme achieves qualitative
  convergence at the same or, in some cases, much lower grid resolutions and conserves
  angular momentum to a much higher degree of precision. As a result, this hybrid
  scheme is much better suited for simulating astrophysical fluid flows such as accretion
  disks and mass-transferring binary systems.
