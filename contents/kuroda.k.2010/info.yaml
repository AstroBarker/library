abstract: LCGT shall be planned to be the first-generation detector with an advanced
  technique for employing a cryogenic mirror in order to firstly detect a gravitational
  wave, and after detection, the detector will serve as an astronomical tool to observe
  the Universe through gravitational wave radiation. In collaborative observation
  with the LIGO, GEO and Virgo projects, LCGT desires to contribute to the enterprise
  of detecting gravitational wave events by earlier funding. This paper summarizes
  the LCGT project.
