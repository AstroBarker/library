abstract: Following up on earlier work on this topic (Reinecke et al. \cite{reinecke-etal-99a},a),
  we present an improved set of numerical models for simulations of white dwarfs exploding
  as type Ia supernovae (SNe Ia). Two-dimensional simulations were used to test the
  reliability and numerical robustness of these algorithms; the results indicate that
  integral quantities like the total energy release are insensitive to changes of
  the grid resolution (above a certain threshold), which was not the case for our
  former code. The models were further enhanced to allow fully three-dimensional simulations
  of SNe Ia. A direct comparison of a 2D and a 3D calculation with identical initial
  conditions shows that the explosion is considerably more energetic in three dimensions;
  this is most likely caused by the assumption of axisymmetry in 2D, which inhibits
  the growth of flame instabilities in the azimuthal direction and thereby decreases
  the flame surface.
