abstract: LYNDEN-BELL has suggested1 that a massive collapsed object may lie at the
  centre of many galaxies, including our own, and that a continuing flux of matter
  into such a collapsed object, or ``black hole'', may be the source of energy for
  the non-thermal radiation observed to come from some galactic nuclei. The metric
  used to describe the geometry of space-time in the vicinity of the collapsed object
  in this and other papers2 on collapsed objects in astrophysics has been the spherically
  symmetric Schwarz-schild metric, which is valid only if the collapsed object has
  zero angular momentum. In fact, one would expect any such collapsed object to possess
  considerable angular momentum, because a great deal of angular momentum must be
  lost from a typical galactic nucleus to permit collapse inside the gravitational
  radius in the first place.
