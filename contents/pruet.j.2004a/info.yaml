abstract: Light curves from a growing number of gamma-ray bursts (GRBs) indicate that
  GRBs copiously produce radioactive Ni moving outward at fractions of the speed of
  light. We calculate nuclear abundances of elements accompanying the outflowing Ni
  under the assumption that this Ni originates from a wind blown off of a viscous
  accretion disk. We also show that GRBs likely contribute appreciably to the Galactic
  inventory of 42Ca, 45Sc, 46Ti, 49Ti, and 63Cu, and may be an important site for
  the production of 64Zn.
