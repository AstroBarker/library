abstract: The association of an electromagnetic signal with the merger of a pair of
  supermassive black holes would have many important implications. For example, it
  would provide new information about gas and magnetic field interactions in dynamical
  spacetimes as well as a combination of redshift and luminosity distance that would
  enable precise cosmological tests. A proposal first made by Bode \& Phinney is that
  because radiation of gravitational waves during the final inspiral and merger of
  the holes is abrupt and decreases the mass of the central object by a few percent,
  there will be waves in the disk that can steepen into shocks and thus increase the
  disk luminosity in a characteristic way. We evaluate this process analytically and
  numerically. We find that shocks only occur when the fractional mass loss exceeds
  the half-thickness of the disk, hence significant energy release only occurs for
  geometrically thin disks which are thus at low Eddington ratios. This strongly limits
  the effective energy release, and in fact our simulations show that the natural
  variations in disk luminosity are likely to obscure this effect entirely. However,
  we demonstrate that the reduction of luminosity caused by the retreat of the inner
  edge of the disk following mass loss is potentially detectable. This decrease occurs
  even if the disk is geometrically thick, and lasts for a duration on the order of
  the viscous time of the modified disk. Observationally, the best prospect for detection
  would be a sensitive future X-ray instrument with a field of view of the order of
  a square degree, or possibly a wide-field radio array such as the Square Kilometer
  Array, if the disk changes produce or interrupt radio emission from a jet.
