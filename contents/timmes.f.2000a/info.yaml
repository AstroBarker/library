abstract: We present the results of a numerical study on two-dimensional carbon detonations.
  For an upstream density of 107 g cm-3 the length-to-width ratio of the detonation
  cells is about 1.6 and is not strongly dependent on the spatial resolution of the
  simulation. However, the curvature of the weak incident shocks, strength of the
  triple points and transverse waves, and sizes of the underreacted and overreacted
  regions all depend strongly on the spatial resolution of the calculation. These
  resolution studies help define the minimum resolution required by multidimensional
  Type Ia supernovae models where the cellular structure of a detonation front is
  a key feature of the model.
