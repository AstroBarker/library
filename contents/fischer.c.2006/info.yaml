abstract: I review recent results on the infrared properties of QCD from Dyson-Schwinger
  equations. The topics include infrared exponents of one-particle irreducible Green's
  functions, the fixed point behaviour of the running coupling at zero momentum, the
  pattern of dynamical quark mass generation and properties of light mesons.
