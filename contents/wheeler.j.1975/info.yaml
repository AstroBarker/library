abstract: 'The general problem of a supernova explosion in a binary star system is
  studied. We show that to a good approximation the effect of the impinging blast
  wave which strips and ablates mass from the companion can be expressed in terms
  of a single parameter. The eccentricity imparted to the system and the ratio of
  final to initial semi-major axes depend on two to six parameters, depending on the
  level of approximation. Results for calculation of the eccentricity imparted to
  an initially circular system are presented by means of graphs, tables, and sample
  fitting formulae for two basic types of models: one in which the companion is a
  ''normal'' star and one in which the companion is in a ''red-giant'' phase. We conclude
  that neutron stars can be formed in close binary systems but that the resulting
  orbit must have a finite eccentricity.'
