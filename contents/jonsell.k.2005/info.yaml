abstract: We have derived abundances of O, Na, Mg, Al, Si, Ca, Sc, Ti, V, Cr, Fe,
  Ni, and Ba for 43 metal-poor field stars in the solar neighbourhood, most of them
  subgiants or turn-off-point stars with iron abundances [Fe/H] ranging from -0.4
  to -3.0. About half of this sample has not been spectroscopically analysed in detail
  before. Effective temperatures were estimated from uvby photometry, and surface
  gravities primarily from Hipparcos parallaxes. The analysis is differential relative
  to the Sun, and was carried out with plane-parallel MARCS models. Various sources
  of error are discussed and found to contribute a total error of about 0.1-0.2 dex
  for most elements, while relative abundances, such as [Ca/Fe], are most probably
  more accurate. For the oxygen abundances, determined in an NLTE analysis of the
  7774 {\AA} triplet lines, the errors may be somewhat larger. We made a detailed
  comparison with similar studies and traced the reasons for the, in most cases, relatively
  small differences. Among the results we find that [O/Fe] possibly increases beyond
  [Fe/H] = -1.0, though considerably less so than in results obtained by others from
  abundances based on OH lines. We did not trace any tendency toward strong overionization
  of iron, and find the excesses, relative to Fe and the Sun, of the alpha elements
  Mg, Si, and Ca to be smaller than those of O. We discuss some indications that also
  the abundances of different alpha elements relative to Fe vary and the possibility
  that some of the scatter around the trends in abundances relative to iron may be
  real. This may support the idea that the formation of Halo stars occurred in smaller
  systems with different star formation rates. We verify the finding by Gratton et
  al. (2003b, A\&A, 406, 131) that stars that do not participate in the rotation of
  the galactic disk show a lower mean and larger spread in [ alpha/Fe] than stars
  participating in the general rotation. The latter stars also seem to show some correlation
  between [ alpha/Fe] and rotation speed. We trace some stars with peculiar abundances,
  among these two Ba stars, HD 17072 and HD 196944, the second already known to be
  rich in s elements. Finally we advocate that a spectroscopic study of a larger sample
  of halo stars with well-defined selection criteria is very important, in order to
  add to the very considerable efforts that various groups have already made.
