abstract: I show that the characteristic diffusion timescale and the gamma-ray escape
  timescale, of Type-Ia supernova ejecta, are related with each other through the
  time when the bolometric luminosity, $L_{\rm bol}$, intersects with instantaneous
  radioacitve decay luminsoty, \$L\_\gamma\$, for the second time after the light
  curve peak. Analytical arguments, numerical radiation-transport calculations, and
  observational tests show that, \$L\_{\rm bol}\$ generally intersects \$L\_\gamma\$
  at roughly \$1.7\$ times the characteristic diffusion timescale of the ejecta. This
  relation implies that the gamma-ray escape timescale is typically 2.7 times the
  diffusion timescale, and also implies that the bolometric luminosity 15 days after
  the peak, \$L\_{\rm bol}(t\_{15})\$, must be close to the instantaneous decay luminosity
  at that time, \$L\_\gamma (t\_{15})\$. With the employed calculations and observations,
  the accuracy of \$L\_{\rm bol}=L\_\gamma\$ at \$t=t\_{15}\$ is found to be comparable
  to the simple version of `Arnett's rule' (\$L\_{\rm bol}=L\_\gamma\$ at \$t=t\_{\rm
  peak}\$). This relation aids the interpretation of Type-Ia supernova light curves
  and may also be applicable to general hydrogen-free explosion scenarios powered
  by other central engines.
