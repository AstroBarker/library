abstract: In this work we carry out a theoretical investigation of a new type of astrophysical
  gaseous nebula, viz., ionized regions surrounding supersoft X-ray sources. Supersoft
  X-ray sources, many of which have characteristic luminosities of approximately 1037-(1038
  ergs/s and effective temperatures of approximately 4 x 105 K, were first discovered
  with the Einstein Observatory. These sources have now been shown to constitute a
  distinct class of X-ray source and are being found in substantial numbers with ROSAT.
  We predict that these sources should be surrounded by regions of ionized hydrogen
  and helium with properties that are distinct from other astrophysical gaseous nebulae.
  We present caluations of the ionization and temperature structure of these ionization
  nebulae, as well as the expected optical line fluxes. The ionization profiles for
  both hydrogen and helium exhibit substantially more gradual transitions from the
  ionized to the unionized state than is the case for conventional H II regions. The
  calculated optical line intensitites are presented as absolute fluxes from sources
  in the Large Magellanic Cloud and as fractions of the central source luminosity.
  We find, in particular, that (O III) lambda 5008 and He II lambda 4686 are especially
  prominent in these ionization nebulae as compared to other astrophysical nebulae.
  We propose that searches for supersoft X-rays via their characteristic optical lines
  may reveal sources in regions where the soft X-rays are nearly completely absorbed
  by the interstellar medium.
