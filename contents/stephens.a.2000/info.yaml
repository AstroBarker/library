abstract: This paper presents color transformations for Hubble Space Telescope Near
  Infrared Camera and Multi-Object Spectrometer (NICMOS) camera 2 observations to
  the ground-based Carnegie image tube photometric system at Cerro Tololo Inter-American
  Observatory (CIT/CTIO), using observations of 19 moderately bright, red stars in
  Baade's window in the color range 0.7<(J-K)<1.6. We emphasize that these transformations
  will be accurate only for cool giants of near-solar metallicity. We simulate both
  NICMOS and ground-based photometry by convolving near-IR spectra taken above the
  atmosphere with different filter transmission profiles. The results are consistent
  with our transformation.
