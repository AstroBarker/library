abstract: Calculations of the properties of rotating strange stars with crusts are
  performed within the framework of general relativity. We employ an equation of state
  (EOS) of strange quark matter based on the MIT Bag Model with massive strange quarks
  and lowest order QCD interactions. The crust is described by the BPS equation of
  state. A significant increase of the stellar radius is found close to the Keplerian
  (mass-shedding limit) configuration. This leads to the disappearance of the gap
  between the stellar surface and the innermost stable circular orbit (ISCO) at very
  high rotation rates, for a rather broad range of stellar masses. The Keplerian configuration
  for the strange star with crust corresponds to values of J, T/W, PISCO=1/nuISCO
  which are about 20\% smaller than in the case of bare strange stars. Because the
  Keplerian configuration is achieved due to the increase of the stellar oblateness,
  the Keplerian frequency (of the rotation) remains almost unaltered. The lack of
  the gap close to the Keplerian rotation could imply a more stringent limit on nuISCO,
  if the existence of such a gap is supported by observations, as in the source 4U
  1820-30 with the upper QPO frequency 1.07 kHz. If such a constraint is taken into
  account (mandatory existence of a gap) the minimum nuISCO is about 1 kHz even with
  the extreme fine tuning of strange quark matter parameters. The minimum nuISCO is
  then obtained for the non-rotating configuration with maximum allowable mass. The
  maximum frequency in the stable circular orbit around the strange star with a crust
  is smaller by about 100 Hz than in the case of a bare strange star. During the spin-down
  of a magnetized strange quark star with crust, the crust matter is absorbed in the
  equatorial region by the strange matter core. The deconfinement of absorbed crust
  matter is a strongly exothermic process, which would influence the cooling curve
  of this compact object.
