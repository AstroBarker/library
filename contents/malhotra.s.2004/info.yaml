abstract: The visibility of Lyalpha emission from galaxies should be suppressed substantially
  by a neutral intergalactic medium before reionization. Even after taking into account
  a local H II region produced by the galaxy and a velocity offset of Lyalpha, a factor
  of 3 attenuation in the line is unavoidable. We rule out such a suppression by comparing
  line luminosity functions of Lyalpha emitters at z=6.5 and 5.7. The luminosity functions
  at z=5.7 and z=6.5 were constructed using published surveys over a range of depths
  and volumes. They constrain both characteristic luminosity L\textasteriskcentered
  and density phi\textasteriskcentered. The luminosity functions at the two redshifts
  are statistically consistent with one another, and only one survey lies substantially
  off the luminosity function. We conclude that reionization was largely complete
  at z~6.5.
