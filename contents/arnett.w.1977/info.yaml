abstract: Silicon burning occurs during the last stage prior to the exhaustion of
  nuclear fuel. A study of silicon burning is, therefore, of considerable importance
  for the problem of gravitational collapse as well as stellar evolution. Attention
  is given to the thermonuclear problem, silicon ignition, the hydrodynamic problem,
  the results of hydrostatic evolutionary calculations related to the silicon flash
  and the stage of silicon comsumption, preflash hydrodynamics, and postflash hydrodynamics.
