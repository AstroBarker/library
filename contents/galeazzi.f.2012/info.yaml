abstract: We analyze the impact of the rotation law on equilibrium sequences of relativistic
  differentially-rotating neutron stars in axisymmetry. The maximum allowed mass for
  each model is strongly affected by the distribution of the angular velocity in the
  radial direction and by the consequent degree of differential rotation. To study
  the wide parameter space implied by the choice of the rotation law, we introduce
  a functional form that generalizes the so-called "j-const. law" adopted in all previous
  work. We compute equilibrium sequences of differentially rotating stars with a polytropic
  equation of state starting from the spherically symmetric static case. By analyzing
  the sequences with decreasing degrees of differential rotation, we find that the
  maximum value of the ratio T/\vert{}W\vert{} of rotational kinetic energy to gravitational
  binding energy, is substantially limited in these cases to a value of 0.128.
