abstract: The hard X-ray source 1E1740.7-2942 has been observed using the VLA, and
  its radio structure is found to be that of a double-sided jet emanating from a compact
  and variable core. Changes in the flux density and spectral index of the core are
  correlated with variations in the hard X-ray output. The jets are symmetrical about
  the core and end in edge-brightened radio lobes which are probably a result of synchrotron
  emission of electrons and positrons from the compact core. The observation suggest
  that 1E1740.7-2942 is a 'microquasar' stellar remnant near the Galactic Center which
  ejects positrons that travel more than a parsec before slowing and annihilating
  in the interstellar gas.
