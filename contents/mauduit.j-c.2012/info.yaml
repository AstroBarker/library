abstract: We present the Spitzer Extragalactic Representative Volume Survey (SERVS),
  an 18 deg2 medium-deep survey at 3.6 and 4.5 mum with the postcryogenic Spitzer
  Space Telescope to \approx{}2 muJy (AB = 23.1) depth of five highly observed astronomical
  fields (ELAIS-N1, ELAIS-S1, Lockman Hole, Chandra Deep Field South, and XMM-LSS).
  SERVS is designed to enable the study of galaxy evolution as a function of environment
  from z \texttildelow{} 5 to the present day and is the first extragalactic survey
  that is both large enough and deep enough to put rare objects such as luminous quasars
  and galaxy clusters at z \greaterequivlnt{} 1 into their cosmological context. SERVS
  is designed to overlap with several key surveys at optical, near- through far-infrared,
  submillimeter, and radio wavelengths to provide an unprecedented view of the formation
  and evolution of massive galaxies. In this article, we discuss the SERVS survey
  design, the data processing flow from image reduction and mosaicking to catalogs,
  and coverage of ancillary data from other surveys in the SERVS fields. We also highlight
  a variety of early science results from the survey.  Since this article was published
  online on 4 August 2012, corrections have been made. An erratum appears in the October
  2012 issue of the journal. The current online version was corrected on 10 October
  2012.
