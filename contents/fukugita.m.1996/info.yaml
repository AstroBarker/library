abstract: This paper describes the Sloan Digital Sky Survey photometric system, a
  new five-color (u' g' r' i' z') wide-band CCD system with wavelength coverage from
  3000 to 11 000 {\AA}. The zero points will be based on an updated version of the
  spectrophotometric ABv system. This updated calibration, designated as AB95, is
  presented in this paper.
