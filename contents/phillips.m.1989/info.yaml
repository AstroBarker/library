abstract: Approximately three weeks after the outburst of SN 1987A, satellite emission
  'bumps' suddenly appeared in the blue and red wings of H-alpha. Optical and infrared
  spectroscopic observations are analyzed in an attempt to better understand this
  event. These data show that comparable structure appeared in the profiles of several
  emission lines besides H-alpha, ruling out the possibility that the bumps were due
  to blends with lines of other elements. The velocities of the bumps in the rest
  frame of the supernova closely followed the velocity of the receding photosphere,
  which strongly suggests that the bump emission originated just above the photosphere.
  It seems likely that the appearance of the bumps was the first observable consequence
  of the arrival at the photosphere of energy associated with the radioactive decay
  of Ni-56 and Co-56. For this to have occurred less than a month after outburst implies
  that significant amounts of radioactive material had been mixed outward into the
  hydrogen envelope.
