abstract: 'The effect of a stellar wind on the evolution of stars in the mass range
  from 15 to 120 solar masses is investigated. All the stellar models are constructed
  with the use of Cox-Stewart opacities. Four possible cases of mass loss are considered:
  (1) no mass loss at all; (2) substantial mass loss from stars in all stages of evolution;
  (3) heavy mass loss from red supergiants only; and (4) sudden and very heavy mass
  loss from luminous yellow supergiants. The assumption of mass loss during the main-sequence
  phase of evolution is found to lead to a lowering of the luminosity and, unless
  the mass loss is extremely heavy, of the effective temperature as well. A comparison
  of the adopted mass-loss rates with observed rates suggests that stellar winds are
  probably not an important factor in the evolution of main-sequence stars and supergiants
  unless the initial masses are greater than about 30 solar masses.'
