abstract: 'We present new observations of the early X-ray afterglows of the first
  27 gamma-ray bursts (GRBs) well observed by the Swift X-Ray Telescope (XRT). The
  early X-ray afterglows show a canonical behavior, where the light curve broadly
  consists of three distinct power-law segments: (1) an initial very steep decay (~t-alpha
  with 3<~alpha1<~5), followed by (2) a very shallow decay (0.5<~alpha2<~1.0), and
  finally (3) a somewhat steeper decay (1<~alpha3<~1.5). These power-law segments
  are separated by two corresponding break times, tbreak,1<~500 s and 103 s<~tbreak,2<~104
  s. On top of this canonical behavior, many events have superimposed X-ray flares,
  which are most likely caused by internal shocks due to long-lasting sporadic activity
  of the central engine, up to several hours after the GRB. We find that the initial
  steep decay is consistent with it being the tail of the prompt emission, from photons
  that are radiated at large angles relative to our line of sight. The first break
  in the light curve (tbreak,1) takes place when the forward shock emission becomes
  dominant, with the intermediate shallow flux decay (alpha2) likely caused by the
  continuous energy injection into the external shock. When this energy injection
  stops, a second break is then observed in the light curve (tbreak,2). This energy
  injection increases the energy of the afterglow shock by at least a factor of f>~4
  and augments the already severe requirements for the efficiency of the prompt gamma-ray
  emission.'
