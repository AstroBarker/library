abstract: The wind models discussed by Mestel (1984) are used here to formulate a
  general expression for the rate of angular momentum loss by magnetic stellar winds
  as a function of magnetic field configuration, rotation rate, and stellar model
  properties. The sensitivity of the rotation velocity to the various wind model parameters,
  the initial angular momenta, and the time dependence of the angular velocity for
  each mass is shown. The theoretical results are compared with observational ones,
  and it is found that the existence of very rapidly rotating stars in young clusters
  implies that low-mass stars are formed with a large spread of angular momentum.
  The high efficiency of angular momentum loss through magnetic stellar winds causes
  the rotation velocity to become less dependent on initial angular momentum J0 with
  time; by 300 million yur, the rotation velocity becomes independent of J0. This
  results in a decrease with time in the spread of rotation velocities as a function
  of stellar mass in young clusters.
