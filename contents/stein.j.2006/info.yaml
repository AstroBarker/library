abstract: Consideration of the role of the convective flux in the thermodymics of
  the convective Urca neutrino loss process in degenerate, convective, quasi-static,
  carbon-burning cores shows that the convective Urca process slows down the convective
  current around the Urca-shell but, unlike the ``thermal'' Urca process, does not
  reduce the entropy or temperature for a given convective volume. Here we demonstrate
  these effects with two-dimensional numerical hydrodynamical calculations. These
  two-dimensional implicit hydrodynamics calculations invoke an artificial speeding
  up of the nuclear and weak rates. They should thus be regarded as indicative but
  still qualitative. We find that, compared to a case with no Urca-active nuclei,
  the case with Urca effects leads to a higher entropy in the convective core because
  the energy released by nuclear burning is confined to a smaller volume by the effective
  boundary at the Urca shell. All else being equal, this will tend to accelerate the
  progression to dynamical runaway. We discuss the open issues regarding the impact
  of the convective Urca process on the evolution to the ``smoldering phase'' and
  then to dynamical runaway.
