abstract: We consider in detail the effects of the 13-mixing (sin2theta13) and of
  the type of mass hierarchy/ordering (sign[Deltam213]) on neutrino signals from the
  gravitational collapses of stars. The observables (characteristics of the energy
  spectra of nue and bar nue events) sensitive to sin2theta13 and sign[Deltam213]
  have been calculated. They include the ratio of average energies of the spectra,
  rEequivlangleErangle/langlebar Erangle, the ratio of widths of the energy distributions,
  rGammaequivGamma/barGamma, the ratios of total numbers of nue and bar nue events
  at low energies, S, and in the high energy tails, Rtail. We construct and analyse
  scatter plots which show the predictions for the observables for different intervals
  of sin2theta13 and signs of Deltam213, taking into account uncertainties in the
  original neutrino spectra, the star density profile, etc. Regions in the space of
  observables rE, rGamma, S, Rtail exist in which certain mass hierarchy and intervals
  of sin2theta13 can be identified or discriminated. We elaborate on the method of
  the high energy tails in the spectra of events. The conditions are formulated for
  which sin2theta13 can be (i) measured, (ii) restricted from below, (iii) restricted
  from above. We comment on the possibility to determine sin2theta13 using the time
  dependence of the signals due to the propagation of the shock wave through the resonance
  layers of the star. We show that the appearance of the delayed Earth matter effect
  in one of the channels (nue or bar nue) in combination with the undelayed effect
  in the other channel will allow us to identify the shock wave appeareance and determine
  the mass hierarchy.
