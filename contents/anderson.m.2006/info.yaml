abstract: This paper presents a new computer code to solve the general relativistic
  magnetohydrodynamics (GRMHD) equations using distributed parallel adaptive mesh
  refinement (AMR). The fluid equations are solved using a finite difference convex
  ENO method (CENO) in 3 + 1 dimensions, and the AMR is Berger Oliger. Hyperbolic
  divergence cleaning is used to control the \nabla{} sdot B = 0 constraint. We present
  results from three flat space tests, and examine the accretion of a fluid onto a
  Schwarzschild black hole, reproducing the Michel solution. The AMR simulations substantially
  improve performance while reproducing the resolution equivalent unigrid simulation
  results. Finally, we discuss strong scaling results for parallel unigrid and AMR
  runs.
