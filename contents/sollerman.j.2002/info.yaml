abstract: The probable association with GRB 980425 immediately put SN 1998bw at the
  forefront of supernova research. Here, we present revised late-time BVRI light curves
  of the supernova, based on template images taken at the VLT. To follow the supernova
  to the very last observable phases we have used HST/STIS. Deep images taken in June
  and November 2000 are compared to images taken in August 2001. The identification
  of the supernova is firmly established. This allows us to measure the light curve
  to ~ 1000 days past explosion. The main features are a rapid decline up to more
  than 500 days after explosion, with no sign of complete positron trapping from the
  \element[][56]{Co} decay. Thereafter, the light curve flattens out significantly.
  One possible explanation is powering by more long lived radioactive isotopes, if
  they are abundantly formed in this energetic supernova. Based on observations collected
  at the European Southern Observatory, La Silla and Paranal, Chile and on observations
  made with the NASA/ESA Hubble Space Telescope, obtained at the Space Telescope Science
  Institute, which is operated by the Association of Universities for Research in
  Astronomy, Inc., under NASA contract NAS 5-26555.
