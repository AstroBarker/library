abstract: We developed a hydrostatic and stationary white dwarf envelope model for
  the study of the post-outburst phases of classical novae and their soft X-ray emission.
  We considered several white dwarf masses and chemical compositions typical of classical
  novae. Our results show that the luminosity, maximum effective temperature, and
  envelope masses depend on the white dwarf mass and on the chemical composition.
  Envelope masses for which equilibrium solutions exist are pretty small ( 10-7{-}10-6  M\&sun;),
  thus leading to a short duration of the soft X-ray emitting phase of classical novae,
  in agreement with most observations. The models we present provide a useful tool
  for the determination of the white dwarf properties from observable parameters in
  the X-ray range.
