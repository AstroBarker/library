abstract: 'The recent interferometric study of Achernar, leading to the conclusion
  that its geometrical oblateness cannot be explained by the Roche approximation,
  has stirred substantial interest in the community, in view of its potential impact
  on many fields of stellar astrophysics. It is the purpose of this Letter to reinterpret
  the interferometric observations with a fast-rotating, gravity-darkened central
  star surrounded by a small equatorial disk, whose presence is consistent with contemporaneous
  spectroscopic data. We find that we can fit the available data only assuming a critically
  rotating central star. We identified two different disk models that simultaneously
  fit the spectroscopic, polarimetric, and interferometric observational constraints:
  a tenuous disk in hydrostatic equilibrium (i.e., with small scale height) and a
  smaller, scale height enhanced disk. We believe that these relatively small disks
  correspond to the transition region between the photosphere and the circumstellar
  environment and that they are probably perturbed by some photospheric mechanism.
  The study of this interface between photosphere and circumstellar disk for near-critical
  rotators is crucial to our understanding of the Be phenomenon and the mass and angular
  momentum loss of stars in general. This work shows that it is nowadays possible
  to directly study this transition region from simultaneous multitechnique observations.'
