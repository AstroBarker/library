abstract: 'In this work we develop a class of high-order finite difference weighted
  essentially non-oscillatory (FD-WENO) schemes for solving the ideal magnetohydrodynamic
  (MHD) equations in 2D and 3D. The philosophy of this work is to use efficient high-order
  WENO spatial discretizations with high-order strong stability-preserving Runge-Kutta
  (SSP-RK) time-stepping schemes. Numerical results have shown that with such methods
  we are able to resolve solution structures that are only visible at much higher
  grid resolutions with lower-order schemes. The key challenge in applying such methods
  to ideal MHD is to control divergence errors in the magnetic field. We achieve this
  by augmenting the base scheme with a novel high-order constrained transport approach
  that updates the magnetic vector potential. The predicted magnetic field from the
  base scheme is replaced by a divergence-free magnetic field that is obtained from
  the curl of this magnetic potential. The non-conservative weakly hyperbolic system
  that the magnetic vector potential satisfies is solved using a version of FD-WENO
  developed for Hamilton-Jacobi equations. The resulting numerical method is endowed
  with several important properties: (1) all quantities, including all components
  of the magnetic field and magnetic potential, are treated as point values on the
  same mesh (i.e., there is no mesh staggering); (2) both the spatial and temporal
  orders of accuracy are fourth-order; (3) no spatial integration or multidimensional
  reconstructions are needed in any step; and (4) special limiters in the magnetic
  vector potential update are used to control unphysical oscillations in the magnetic
  field. Several 2D and 3D numerical examples are presented to verify the order of
  accuracy on smooth test problems and to show high-resolution on test problems that
  involve shocks.'
