abstract: The gamma-ray spectrometer on the Solar Maximum Mission satellite has observed
  a significant net line flux at \equiv{}847 keV in the background-subtracted spectrum
  of SN 1987A. This is the energy of the strong gamma-ray line from decay of 56Co.
  The inferred average line flux during this period is \equiv{}(1.0$\pm$.25)\texttimes{}10-3
  photons cm-2s-1 at an energy of 843\ keV. There is also evidence for the 1,238-keV
  line from 56Co decay, with an average flux of \equiv{}(6\)\texttimes{}10-4 photons
  cm-2s-1. The observation confirms that 56Co is present in the supernova ejecta and
  that nucleosynthesis took place during the explosion.
