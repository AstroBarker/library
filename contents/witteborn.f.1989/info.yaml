abstract: Spectra of SN 1987A showing the Ni II 6.634-micron and Ar II 6.983-micron
  fine-structure lines were obtained from the Kuiper Airborne Observatory in April
  1988. The signal-to-noise ratio of 100 near the peaks and resolving power of 200
  are sufficient to show the average velocity of expansion from the core of about
  1400 km/s and to indicate the range of velocities. An asymmetry in the profiles
  of both lines and a redshift of the line centroids of about 440 km/s above the 280-km/s
  recessional velocity of the LMC can be explained in terms of scattering of the photons
  by electrons in the expanding hydrogen envelope of the supernova. A mass of 0.0030
  solar masses of Ni II can be deduced from the line strength of the Ni II line and
  a mass of 0.0009 solar masses of Ar II from the Ar II line strength.
