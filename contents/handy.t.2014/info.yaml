abstract: We study the evolution of the collapsing core of a 15 M \&sun; blue supergiant
  supernova progenitor from the core bounce until 1.5 s later. We present a sample
  of hydrodynamic models parameterized to match the explosion energetics of SN 1987A.
  We find the spatial model dimensionality to be an important contributing factor
  in the explosion process. Compared to two-dimensional (2D) simulations, our three-dimensional
  (3D) models require lower neutrino luminosities to produce equally energetic explosions.
  We estimate that the convective engine in our models is 4\% more efficient in 3D
  than in 2D. We propose that the greater efficiency of the convective engine found
  in 3D simulations might be due to the larger surface-to-volume ratio of convective
  plumes, which aids in distributing energy deposited by neutrinos. We do not find
  evidence of the standing accretion shock instability or turbulence being a key factor
  in powering the explosion in our models. Instead, the analysis of the energy transport
  in the post-shock region reveals characteristics of penetrative convection. The
  explosion energy decreases dramatically once the resolution is inadequate to capture
  the morphology of convection on large scales. This shows that the role of dimensionality
  is secondary to correctly accounting for the basic physics of the explosion. We
  also analyze information provided by particle tracers embedded in the flow and find
  that the unbound material has relatively long residency times in 2D models, while
  in 3D a significant fraction of the explosion energy is carried by particles with
  relatively short residency times.
