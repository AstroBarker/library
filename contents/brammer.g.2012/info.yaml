abstract: We present 3D-HST, a near-infrared spectroscopic Treasury program with the
  Hubble Space Telescope for studying the physical processes that shape galaxies in
  the distant universe. 3D-HST provides rest-frame optical spectra for a sample of
  ~7000 galaxies at 1 < z < 3.5, the epoch when ~60\% of all star formation took place,
  the number density of quasars peaked, the first galaxies stopped forming stars,
  and the structural regularity that we see in galaxies today must have emerged. 3D-HST
  will cover three quarters (625 arcmin2) of the CANDELS Treasury survey area with
  two orbits of primary WFC3/G141 grism coverage and two to four orbits with the ACS/G800L
  grism in parallel. In the IR, these exposure times yield a continuum signal-to-noise
  ratio of ~5 per resolution element at H 140 ~ 23.1 and a 5sigma emission-line sensitivity
  of ~5 \texttimes{} 10-17 erg s-1 cm-2 for typical objects, improving by a factor
  of ~2 for compact sources in images with low sky background levels. The WFC3/G141
  spectra provide continuous wavelength coverage from 1.1 to 1.6 mum at a spatial
  resolution of ~0farcs13, which, combined with their depth, makes them a unique resource
  for studying galaxy evolution. We present an overview of the preliminary reduction
  and analysis of the grism observations, including emission-line and redshift measurements
  from combined fits to the extracted grism spectra and photometry from ancillary
  multi-wavelength catalogs. The present analysis yields redshift estimates with a
  precision of sigma(z) = 0.0034(1 + z), or sigma(v) \approx{} 1000 km s-1. We illustrate
  how the generalized nature of the survey yields near-infrared spectra of remarkable
  quality for many different types of objects, including a quasar at z = 4.7, quiescent
  galaxies at z ~ 2, and the most distant T-type brown dwarf star known. The combination
  of the CANDELS and 3D-HST surveys will provide the definitive imaging and spectroscopic
  data set for studies of the 1 < z < 3.5 universe until the launch of the James Webb
  Space Telescope.  Based on observations made with the NASA/ESA Hubble Space Telescope,
  obtained at the Space Telescope Science Institute, which is operated by the Association
  of Universities for Research in Astronomy, Inc., under NASA contract NAS 5-26555.
  These observations are associated with programs 12177 and 12328.
