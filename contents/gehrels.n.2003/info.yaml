abstract: Estimates made in the 1970s indicated that a supernova occurring within
  tens of parsecs of Earth could have significant effects on the ozone layer. Since
  that time, improved tools for detailed modeling of atmospheric chemistry have been
  developed to calculate ozone depletion, and advances have been made also in theoretical
  modeling of supernovae and of the resultant gamma-ray spectra. In addition, we now
  have better knowledge of the occurrence rate of supernovae in the Galaxy and of
  the spatial distribution of progenitors to core-collapse supernovae. We report here
  the results of two-dimensional atmospheric model calculations that take as input
  the spectral energy distribution of a supernova, adopting various distances from
  Earth and various latitude impact angles. In separate simulations we calculate the
  ozone depletion due to both gamma rays and cosmic rays. We find that for the combined
  ozone depletion from these effects roughly to double the ``biologically active''
  UV flux received at the surface of the Earth, the supernova must occur at <~8 pc.
  Based on the latest data, the time-averaged Galactic rate of core-collapse supernovae
  occurring within 8 pc is ~1.5 Gyr-1. In comparing our calculated ozone depletions
  with those of previous studies, we find them to be significantly less severe than
  found by Ruderman and consistent with Whitten et al. In summary, given the amplitude
  of the effect, the rate of nearby supernovae, and the ~0.5 Gyr timescale for multicellular
  organisms on Earth, this particular pathway for mass extinctions may be less important
  than previously thought.
