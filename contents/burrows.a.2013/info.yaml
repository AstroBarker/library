abstract: 'Core-collapse theory brings together many facets of high-energy and nuclear
  astrophysics and the numerical arts to present theorists with one of the most important,
  yet frustrating, astronomical questions: ``What is the mechanism of core-collapse
  supernova explosions?'''' A review of all the physics and the 50-year history involved
  would soon bury the reader in minutiae that could easily obscure the essential elements
  of the phenomenon, as we understand it today. Moreover, much remains to be discovered
  and explained, and a complicated review of an unresolved subject in flux could grow
  stale fast. Therefore, this paper describes various important facts and perspectives
  that may have escaped the attention of those interested in this puzzle. Furthermore,
  an attempt to describe the modern theory''s physical underpinnings and a brief summary
  of the current state of play are given. In the process, a few myths that have crept
  into modern discourse are identified. However, there is much more to do and humility
  in the face of this age-old challenge is clearly the most prudent stance as its
  eventual resolution is sought.'
