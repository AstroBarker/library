abstract: A detailed analysis of speckle interferometry data from supernova 1987A
  is presented which shows that the expanding supernova envelope is asymmetric. This
  asymmetry has been observable since June 1987. The ratio between the minor and major
  axes of the envelope profile is about 2-3, and the position angle of the major axis
  is 20 deg + or - 5 deg, consistent with results reported from polarization measurements.
  The major axis is aligned with the position angle of the companion to the supernova.
