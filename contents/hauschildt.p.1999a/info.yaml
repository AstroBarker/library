abstract: We present the extension of our NextGen model atmosphere grid to the regime
  of giant stars. The input physics of the models presented here is nearly identical
  to that of the NextGen dwarf atmosphere models; however, spherical geometry is used
  self-consistently in the model calculations (including the radiative transfer).
  We revisit the discussion of the effects of spherical geometry on the structure
  of the atmospheres and the emitted spectra and discuss the results of non-LTE calculations
  for a few selected models.
