abstract: The paper determines the physical properties - speed, width, and density
  structure - of conductive burning fronts in degenerate carbon-oxygen (C + O) and
  oxygen-neon-magnesium (O + Ne + Mg) compositions for a grid of initial densities
  and compositions. The dependence of the physical properties of the flame on the
  assumed values of nuclear reaction rates, the nuclear reaction network employed,
  the thermal conductivity, and the choice of coordinate system are investigated.
  The occurrence of accretion-induced collapse of a white dwarf is found to be critically
  dependent on the velocity of the nuclear conductive burning front and the growth
  rate of hydrodynamic instabilities. Treating the expanding area of the turbulent
  burning region as a fractal whose tile size is identical to the minimum unstable
  Rayleigh-Taylor wavelength, it is found, for all reasonable values of the fractal
  dimension, that for initial C + O or O + Ne + Mg densities above about 9 x 10 exp
  9 g/cu cm the white dwarf should collapse to a neutron star.
