abstract: The modal stability of a survey of RR Lyrae models has been investigated
  using linear nonadiabatic analysis and relaxation to the exact periodic nonlinear
  limit cycles. With these techniques both the growth rates of the small-amplitude
  solutions and the mode switching rates of the large-amplitude solutions are obtained,
  resulting in a complete description of the long-term modal behavior of the model.
  The systematics of the nonlinear models are described, and an accurate fitting formula
  for the periods is derived. The nonlinear stability results show a narrow region
  of 'fundamental or first harmonic' behavior whose blue edge is nearly the same as
  the linear fundamental blue edge. This situation suggests that the Oosterhoff dichotomy
  of globular clusters is caused by an evolutionary hysteresis effect. In a large
  region toward the red these models show aperiodic mixed-mode behavior similar to
  that observed for several stars.
