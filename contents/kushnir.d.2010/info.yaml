abstract: Shock waves driven by the release of energy at the center of a cold ideal
  gas sphere of initial density rho vprop r -omega approach a self-similar behavior,
  with velocity \dot{R}\propto{} R^delta, as R --> \infty{}. For omega>3 the solutions
  are second-type solutions, i.e., delta is determined by the requirement that the
  flow should include a sonic point. No solution satisfying this requirement exists,
  however, in the 3 <= omega <= omega g (gamma) "gap" (omega g  = 3.26 for adiabatic
  index gamma = 5/3). We argue that in general second-type solutions should not be
  required to include a sonic point. Rather, it is sufficient to require the existence
  of a characteristic line rc (t), such that the energy in the region rc (t) < r <
  R approaches a constant as R --> \infty{}, and an asymptotic solution given by the
  self-similar solution at rc (t) < r < R and deviating from it at r < rc may be constructed.
  The two requirements coincide for omega>omega g  and the latter identifies delta
  = 0 solutions as the asymptotic solutions for 3 <= omega <= omega g  (as suggested
  by Gruzinov). In these solutions, rc is a C 0 characteristic. Using numerical solutions
  of the hydrodynamic equations, it is difficult to check whether the flow indeed
  approaches a delta = 0 self-similar behavior as R --> \infty{}, due to the slow
  convergence to self-similarity for omega ~ 3. We show that in this case the flow
  may be described by a modified self-similar solution, d ln \dot{R}/d ln R=delta
  with slowly varying delta(R), eta \equiv{} ddelta/dln R Lt 1, and spatial profiles
  given by a sum of the self-similar solution corresponding to the instantaneous value
  of delta and a self-similar correction linear in eta. The modified self-similar
  solutions provide an excellent approximation to numerical solutions obtained for
  omega ~ 3 at large R, with delta --> 0 (and eta != 0) for 3 <= omega <= omega g
  .
