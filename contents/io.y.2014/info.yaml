abstract: We investigate the formation of hot coronae and vertical outflows in accretion
  disks by magnetorotational turbulence. We perform local three-dimensional magnetohydrodynamical
  (MHD) simulations with the vertical stratification by explicitly solving an energy
  equation with various effective ratios of specific heats, gamma. Initially imposed
  weak vertical magnetic fields are effectively amplified by magnetorotational instability
  and winding caused by the differential rotation. In the isothermal case (gamma =
  1), the disk winds are driven mainly by the Poynting flux associated with the MHD
  turbulence and show quasi-periodic intermittency. In contrast, in the non-isothermal
  cases with gamma >= 1.1, the regions above 1-2 scale heights from the midplane are
  effectively heated to form coronae with temperature ~50 times the initial value,
  which are connected to the cooler midplane region through the pressure-balanced
  transition regions. As a result, the disk winds are driven mainly by the gas pressure,
  exhibiting more time-steady nature, although the nondimensional time-averaged mass
  loss rates are similar to that of the isothermal case. Sound-like waves are confined
  in the cool midplane region in these cases, and the amplitude of the density fluctuations
  is larger than that of the isothermal case.
