abstract: A refined model for the unusual Type Ic supernova 1998bw, discovered as
  the optical counterpart to GRB 980425, is presented, and synthetic light curves
  and spectra are compared with the observations. The first 30 days of the light curve
  and the broad-line features of the spectra can be reproduced with the hydrodynamic
  model of the explosion of a 14 Msolar C+O star, the core of a star with initial
  mass 40 Msolar, assuming that the explosion was very energetic (kinetic energy EK=5\texttimes{}1052
  ergs) and that 0.4 Msolar of 56Ni were synthesized. At late times, however, the
  observed light-curve tail declines more slowly than this energetic model and is
  in better agreement with a less energetic (EK=7\texttimes{}1051 ergs) one. This
  shift to a less energetic model may imply that the inner part of the ejecta has
  higher density and lower velocities than the model with EK=5\texttimes{}1052 ergs,
  so that gamma-rays deposit more efficiently. An aspherical explosion can produce
  such a structure of the ejecta. We also study detailed nucleosynthesis calculations
  for hyperenergetic supernova explosions and compare the yields with those of normal
  supernovae.
