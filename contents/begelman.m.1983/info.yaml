abstract: 'X rays emitted in the inner part of an accretion disk system can heat the
  surface of the disk farther out, producing a corona and possibly driving off a strong
  wind. The dynamics of Compton-heated coronae and winds are analyzed using an approximate
  two-dimensional technique to estimate the mass loss rate as a function of distance
  from the source of X rays. The findings have important dynamical implications for
  accretion disks in quasars, active galactic nuclei, X ray binaries, and cataclysmic
  variables. These include: mass loss from the disk possibly comparable with or exceeding
  the net accretion rate onto the central compact object, which may lead to unstable
  accretion; sufficient angular momentum loss in some cases to truncate the disk in
  a semidetached binary at a smaller radius than that predicted by tidal truncation
  theories; and combined static plus ram pressure in the wind adequate to confine
  line-emitting clouds in quasars and Seyfert galaxies.'
