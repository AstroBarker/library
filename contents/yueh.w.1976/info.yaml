abstract: Expressions for the source and collision terms of the neutrino transport
  equation relevant to the neutrino-transport supernova model are derived in the framework
  of the theory of neutral currents. In particular, the study is devoted to the capture
  and emission of neutrinos (and antineutrinos) by free nucleons, inelastic scattering
  by free nucleons, coherent scattering by nuclei, and the corresponding muonic processes.
  An analytical formula is derived for the neutrino scattering rate on electrons,
  valid for large electron degeneracy.
