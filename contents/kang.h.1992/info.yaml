abstract: Previous calculations of radiative shocks in pregalactic gas are generalized
  and substantially improved. The hydrodynamical conservations are solved, along with
  the rate equations for nonequilibrium ionization, recombination, and molecule formation,
  and the equation of radiative transfer, for steady-state shocks in a gas of primordial
  compositions. This calculation self-consistently includes the effects of the diffuse
  postshock emission as well as a possible external radiation flux on the postshock
  flow and the preshock ionization levels. A previous result is confirmed that the
  shocked gas cools faster than it can recombine and, as a result, is able to form
  an H2 concentration as high as 0.003 via the formation of H(-) and H2(+) intermediaries
  due to the enhanced nonequilibrium ionization fraction at 10,000 K. It is shown
  that, as the level of the external radiation flux is increased, the formation of
  and cooling by H2 molecules can be inhibited and delayed. The detailed radiation
  spectra and ionizing photon number fluxes emergent from these shocks are presented.
