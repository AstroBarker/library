abstract: In the study of nucleosynthesis in type II SN, shock waves are initiated
  artificially, since collapse calculations do not, as yet, give self-consistent shock
  waves strong enough to produce the SN explosion. The two initiation methods currently
  used by light-curve modelers are studied, with a focus on the peak temperatures
  and the nucleosynthetic yields in each method. The various parameters involved in
  artificially initiating a shock wave and the effects of varying these parameters
  are discussed.
