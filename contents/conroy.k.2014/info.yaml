abstract: We present a catalog of precise eclipse times and analysis of third-body
  signals among 1279 close binaries in the latest Kepler Eclipsing Binary Catalog.
  For these short-period binaries, Kepler's 30 minute exposure time causes significant
  smearing of light curves. In addition, common astrophysical phenomena such as chromospheric
  activity, as well as imperfections in the light curve detrending process, can create
  systematic artifacts that may produce fictitious signals in the eclipse timings.
  We present a method to measure precise eclipse times in the presence of distorted
  light curves, such as in contact and near-contact binaries which exhibit continuously
  changing light levels in and out of eclipse. We identify 236 systems for which we
  find a timing variation signal compatible with the presence of a third body. These
  are modeled for the light travel time effect and the basic properties of the third
  body are derived. This study complements J. A. Orosz et al. (in preparation), which
  focuses on eclipse timing variations of longer period binaries with flat out-of-eclipse
  regions. Together, these two papers provide comprehensive eclipse timings for all
  binaries in the Kepler Eclipsing Binary Catalog, as an ongoing resource freely accessible
  online to the community.
