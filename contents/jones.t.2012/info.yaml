abstract: We present and discuss the mean rest-frame ultraviolet spectrum for a sample
  of 81 Lyman break galaxies (LBGs) selected to be B-band dropouts at z ~= 4. The
  sample is mostly drawn from our ongoing Keck/DEIMOS survey in the GOODS fields and
  augmented with archival Very Large Telescope data. In general, we find similar spectroscopic
  trends to those found in earlier surveys of LBGs at z = 3. Specifically, low-ionization
  absorption lines which trace neutral outflowing gas are weaker in galaxies with
  stronger Lyalpha emission, bluer UV spectral slopes, lower stellar masses, lower
  UV luminosities, and smaller half-light radii. This is consistent with a physical
  picture whereby star formation drives outflows of neutral gas which scatter Lyalpha
  and produce strong low-ionization absorption lines, while increasing galaxy stellar
  mass, size, metallicity, and dust content. Typical galaxies are thus expected to
  have stronger Lyalpha emission and weaker low-ionization absorption at earlier times,
  and we indeed find somewhat weaker low-ionization absorption at higher redshifts.
  In conjunction with earlier results from our survey, we argue that the reduced low-ionization
  absorption is likely caused by lower covering fraction and/or velocity range of
  outflowing neutral gas at earlier epochs. Although low-ionization absorption decreases
  at higher redshift, fine-structure emission lines are stronger, suggesting a greater
  concentration of neutral gas at small galactocentric radius (lsim 5 kpc). Our continuing
  survey will enable us to extend these diagnostics more reliably to higher redshift
  and determine the implications for the escape fraction of ionizing photons which
  governs the role of early galaxies in cosmic reionization.
