abstract: SN 1987A spectra at 16-30 microns taken on days 1152 and 1154 after core
  collapse are presented. The observations are used to derive the mass of radiating
  Fe II in the ejecta, the mass and temperature of the dust that gives rise to the
  continuum emission, and the bolometric luminosity of the SN. The observed luminosity
  requires that the Co-57/Co-56 mass production rate be enhanced by a factor of (4.5
  +/- 1.6) compared to its solar value, if 0.0001 solar mass of Ti-44 were produced
  in the ejecta.
