abstract: We present preliminary results on 24 mum detections of luminous infrared
  galaxies at z>~1 with the Multiband Imaging Photometer for Spitzer (MIPS). Observations
  were performed in the Lockman Hole and the Extended Groth Strip (EGS) and were supplemented
  by data obtained with the Infrared Array Camera (IRAC) between 3 and 9 mum. The
  positional accuracy of <~2" for most MIPS/IRAC detections provides unambiguous identifications
  of their optical counterparts. Using spectroscopic redshifts from the Deep Extragalactic
  Evolutionary Probe survey, we identify 24 mum sources at z>~1 in the EGS, while
  the combination of the MIPS/IRAC observations with BVRIJHK ancillary data in the
  Lockman Hole also shows very clear cases of galaxies with photometric redshifts
  at 1<~z<~2.5. The observed 24 mum fluxes indicate infrared luminosities greater
  than 1011 Lsolar, while the data at shorter wavelengths reveal rather red and probably
  massive (M>~M\textasteriskcentered) galaxy counterparts. It is the first time that
  this population of luminous objects is detected up to z~2.5 in the infrared. Our
  work demonstrates the ability of the MIPS instrument to probe the dusty universe
  at very high redshift and illustrates how the forthcoming Spitzer deep surveys will
  offer a unique opportunity to illuminate a dark side of cosmic history not explored
  by previous infrared experiments.  Based on observations collected at the German-Spanish
  Astronomical Center, Calar Alto, operated jointly by Max-Planck-Institut f{\"u}r
  Astronomie and Instituto de Astrof{\'\i}sica de Andalucia (CSIC).  Based on observations
  made with the Isaac Newton Telescope, operated on the island of La Palma by the
  Isaac Newton Group in the Spanish Observatorio del Roque de los Muchachos of the
  Instituto de Astrof{\'\i}sica de Canarias.
