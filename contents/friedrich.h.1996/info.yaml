abstract: We consider the problem of reducing initial value problems for Einstein's
  field equations to initial value problems for hyperbolic systems, a problem of importance
  for numerical as well as analytical investigations of gravitational fields. The
  main steps and the most important objectives in designing hyperbolic reductions
  are discussed. Various reductions which have already been studied in the literature
  or which can easily be derived from previous discussions of the field equations
  are pointed out and some of their specific features are indicated. We propose new
  reductions based on the use of the Bianchi equation for the conformal Weyl tensor.
  These reductions involve symmetric hyperbolic systems of propagation equations and
  allow a number of different gauge conditions. They use unknowns in a most economic
  way, supplying direct and non-redundant information about the geometry of the time
  slicing and the four-dimensional spacetime. Some of this information is directly
  related to concepts of gravitational radiation. All these reductions can be extended
  to include the conformal field equations. Those which are based on the ADM representation
  of the metric can be rewritten in flux conserving form.
