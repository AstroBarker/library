abstract: Isotopic heterogeneities of 48Ca have been found in numerous bulk meteorites
  that are correlated with 50Ti and 54Cr anomalies among differentiated planetary
  bodies, and the results suggest that a rare subset of neutron-rich Type Ia supernova
  (nSN Ia) was responsible for contributing these neutron-rich iron-group isotopes
  into the solar system (SS). The heterogeneity of these isotopes found in differentiated
  meteorites indicates that the isotopic compositions of the bulk SS are not uniform,
  and there are significant amounts of nSNe Ia dust incompletely mixed with the rest
  of SS materials during planetary formation. Combined with the data of now-extinct
  short-lived nuclide 60Fe, which can be produced more efficiently from an nSN Ia
  than a Type II supernova ejecta, the observed planetary-scale isotopic heterogeneity
  probably reflects a late input of stellar dust grains with neutron-rich nuclear
  statistical equilibrium nuclides into the early SS.
