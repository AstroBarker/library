abstract: The available information on isotopic abundances in the atmospheres of low-mass
  red giant branch (RGB) and asymptotic giant branch (AGB) stars requires that episodes
  of extensive mixing occur below the convective envelope, reaching down to layers
  close to the hydrogen burning shell (cool bottom processing). Recently, it was suggested
  that dynamo-produced buoyant magnetic flux tubes could provide the necessary physical
  mechanisms and also supply sufficient transport rates. Here, we present an alpha-Omega
  dynamo in the envelope of an RGB/AGB star in which shear and rotation drain via
  turbulent dissipation and Poynting flux. In this context, if the dynamo is to be
  sustained throughout either phase, convection must resupply shear. Under this condition,
  volume-averaged peak toroidal field strengths of langle Bphirangle simeq 3 \texttimes{}
  103 G (RGB) and langle Bphirangle simeq 5 \texttimes{} 103 G (AGB) are possible
  at the base of the convection zone. If the magnetic fields are concentrated in flux
  tubes, the corresponding field strengths are comparable to those required by cool
  bottom processing.
