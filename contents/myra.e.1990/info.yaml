abstract: The collapse of a 1.17 solar mass iron core is numerically followed through
  infall to 100 ms past core bounce, and the emergent neutrino spectra during each
  phase are highlighted. It is found that, even with fairly optimistic conditions
  for producing a strong, sustained core-bounce shock wave, the prompt shock stalls
  within 9 ms of core bounce at a radius of less than 250 km. It appears that a radical
  change in the character of the progenitor core or in our understanding of the relevant
  physics of stellar collapse is needed before the direct mechanism for type II supernovae
  can become viable. Expanding the number of neutrino types from one to six magnifies
  the debilitating effect of neutrino loss on shock propagation. At shock breakout,
  prompt bursts of all neutrino types are observed. The luminosities of the nonelectron
  types show a sudden turn-on in luminosity while that of the electron neutrinos steadily
  increases throughout infall as a result of accelerating electron capture.
