abstract: The paper analyzes the structure of fast shocks incident upon interstellar
  gas of ambient density from 10 to the 7th per cu cm, while focusing on the problems
  of formation and destruction of molecules and infrared emission in the cooling,
  neutral post shock gas. It is noted that such fast shocks initially dissociate almost
  all preexisting molecules. Discussion covers the physical processes which determine
  the post shock structure between 10 to the 4 and 10 to the 2 K. It is shown that
  the chemistry of important molecular coolants H2, CO, OH, and H2O, as well as HD
  and CH, is reduced to a relatively small set of gas phase and grain surface reactions.
  Also, the chemistry follows the slow conversion of atomic hydrogen into H2, which
  primarily occurs on grain surfaces. The dependence of this H2 formation rate on
  grain and gas temperatures is examined and the survival of grains behind fast shocks
  is discussed. Post shock heating and cooling rates are calculated and an appropriate,
  analytic, universal cooling function is developed for molecules other than hydrogen
  which includes opacities from both the dust and the lines.
