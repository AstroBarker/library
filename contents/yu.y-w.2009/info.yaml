abstract: In a second-order r-mode theory, S{\'a} and Tom{\'e} found that the r-mode
  oscillation in neutron stars (NSs) could induce stellar differential rotation, which
  naturally leads to a saturated state of the oscillation. Based on a consideration
  of the coupling of the r-modes and the stellar spin and thermal evolution, we carefully
  investigate the influences of the differential rotation on the long-term evolution
  of isolated NSs and NSs in low-mass X-ray binaries, where the viscous damping of
  the r-modes and its resultant effects are taken into account. The numerical results
  show that, for both kinds of NSs, the differential rotation can significantly prolong
  the duration of the r-modes. As a result, the stars can keep nearly a constant temperature
  and constant angular velocity for over a thousand years. Moreover, the persistent
  radiation of a quasi-monochromatic gravitational wave would also be predicted due
  to the long-term steady r-mode oscillation and stellar rotation. This increases
  the detectability of gravitational waves from both young isolated and old accreting
  NSs.
