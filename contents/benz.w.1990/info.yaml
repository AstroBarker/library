abstract: Following Bandiera (1984), it is shown that the relevant criterion to determine
  the stability of a blast wave, propagating through the layers of a massive star
  in a supernova explosion, is the Schwarzschild (or Ledoux) criterion rather than
  the Rayleigh-Taylor criterion. Both criteria coincide only in the incompressible
  limit. Results of a linear stability analysis are presented for a one-dimensional
  (spherical) explosion in a realistic model for the progenitor of SN 1987A. When
  applying the Schwarzschild criterion, unstable regions get extended considerably.
  Convection is found to develop behind the shock, with a characteristic growth rate
  corresponding to a time scale much smaller than the shock traversal time. This ensures
  that efficient mixing will take place. Since the entire ejected mass is found to
  be convectively unstable, Ni can be transported outward, even into the hydrogen
  envelope, while hydrogen can be mixed deep into the helium core.
