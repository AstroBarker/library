abstract: We present the global distribution of fine-structure infrared line emission
  in the Cassiopeia A supernova remnant using data from the Spitzer Space Telescope's
  infrared spectrograph. We identify emission from ejecta materials in the interior,
  prior to their encounter with the reverse shock, as well as from the postshock bright
  ring. The global electron density increases by gsim 100 at the shock to ~104 cm-3,
  providing evidence for strong radiative cooling. There is also a dramatic change
  in ionization state at the shock, with the fading of emission from low-ionization
  interior species like [Si II] giving way to [S IV] and, at even further distances,
  high-energy X-rays from hydrogenic silicon. Two compact, crescent-shaped clumps
  with highly enhanced neon abundance are arranged symmetrically around the central
  neutron star. These neon crescents are very closely aligned with the "kick" direction
  of the compact object from the remnant's expansion center, tracing a new axis of
  explosion asymmetry. They indicate that much of the apparent macroscopic elemental
  mixing may arise from different compositional layers of ejecta now passing through
  the reverse shock along different directions.
