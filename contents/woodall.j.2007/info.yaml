abstract: 'Aims:We present a new version of the UMIST Database for Astrochemistry,
  the fourth such version to be released to the public. The current version contains
  some 4573 binary gas-phase reactions, an increase of 10\% from the previous (1999)
  version, among 420 species, of which 23 are new to the database.  Methods: Major
  updates have been made to ion-neutral reactions, neutral-neutral reactions, particularly
  at low temperature, and dissociative recombination reactions. We have included for
  the first time the interstellar chemistry of fluorine. In addition to the usual
  database, we have also released a reaction set in which the effects of dipole-enhanced
  ion-neutral rate coefficients are included. Results: These two reactions sets have
  been used in a dark cloud model and the results of these models are presented and
  discussed briefly. The database and associated software are available on the World
  Wide Web at www.udfa.net.  Tables 1, 2, 4 and 9 are only available in electronic
  form at http://www.aanda.org'
