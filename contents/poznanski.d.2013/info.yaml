abstract: Three lines of evidence indicate that in the most common type of core-collapse
  supernovae, the energy deposited in the ejecta by the exploding core is approximately
  proportional to the progenitor mass cubed. This result stems from an observed uniformity
  of light-curve plateau duration, a correlation between mass and ejecta velocity,
  and the known correlation between luminosity and velocity. This result ties in analytical
  and numerical models together with observations, providing us with clues as to the
  mechanism via which the explosion of the core deposits a small fraction of its energy
  into the hurled envelope.
