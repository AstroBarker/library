abstract: Attention is given to the oscillatory instability of optically thin radiative
  shocks in time-dependent numerical calculations of accretion flows onto degenerate
  dwarfs. The present nonlinear calculations yield good quantitative agreement with
  the linear results obtained for oscillation frequencies, damping rates, and critical
  alpha-values. The fundamental mode and the first overtone in the shock radius and
  luminosity variations can be clearly identified, and evidence is sometimes seen
  for the second overtone. Time-dependent calculations are also performed which include
  additional physics relevant to degenerate dwarf accretion, such as electron thermal
  conduction, unequal electron and ion temperatures, Compton cooling, and relativistic
  corrections to the bremsstrahlung cooling law. All oscillatory modes are found to
  be damped, and hence stable, in the case of a 1-solar mass white dwarf accreting
  in spherical symmetry.
