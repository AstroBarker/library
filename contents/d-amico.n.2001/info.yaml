abstract: We report the discovery, using the Parkes radio telescope, of binary millisecond
  pulsars in four clusters for which no associated pulsars were previously known.
  The four pulsars have pulse periods lying between 3 and 6 ms. All are in circular
  orbits with low-mass companions and have orbital periods of a few days or less.
  One is in a 1.7 hr orbit with a companion of planetary mass. Another is eclipsed
  by a wind from its companion for 40\% of the binary period despite being in a relatively
  wide orbit. These discoveries result from the use of improved technologies and prove
  that many millisecond pulsars remain to be found in globular clusters.
