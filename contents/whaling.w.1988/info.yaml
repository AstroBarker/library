abstract: Transition probabilities for 2835 lines in Mo I between 2548 and 10,565
  A were obtained by combining radiative level lifetimes, excited level populations
  measured in an inductively coupled plasma (ICP) source, and emission branching ratios
  measured with the ICP source and a hollow cathode discharge source. It is shown
  that the level populations in the ICP source approximate a thermal distribution.
  It is also shown that modern computer techniques convert a large amount of spectral
  information generated by FTS into useful atomic data with a minimum of human intervention.
