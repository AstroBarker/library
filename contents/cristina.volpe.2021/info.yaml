abstract: Neutrinos from dense environments are connected to the longstanding open
  questions of how massive stars explode and what are the sites where $r$-process
  elements are made. Flavor evolution and neutrino properties can influence nucleosynthetic
  abundances. GW170817 has given indirect evidence for r-process elements in binary
  neutron star mergers. We discuss the impact of non-standard interactions in such
  sites. Nearby compact objects, strong gravitational fields are present. We discuss
  their influence upon neutrino decoherence in a wave packet treatment of neutrino
  propagation. We conclude by mentioning the upcoming measurement of the diffuse supernova
  neutrino background.
