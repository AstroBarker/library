abstract: The Lyalpha forest at z>~5.5 shows strong scatter in the mean transmission
  even when smoothed over extremely large spatial scales, >~50 Mpc h-1. This has been
  interpreted as a signature of strongly fluctuating radiation fields or patchy reionization.
  To test this claim, we calculate the scatter arising solely from density fluctuations,
  assuming a uniform ionizing background, via analytic arguments and simulations.
  This scatter alone is comparable to that observed. It rises steeply with redshift
  and is of order unity by z~6, even on ~50 Mpc h-1 scales. This arises because (1)
  at z~6, transmission spectra, which are sensitive mainly to rare voids, are highly
  biased (with a linear bias factor b>=4) tracers of underlying density fluctuations
  and (2) small-scale transverse modes are aliased to long-wavelength line-of-sight
  modes. Inferring patchy reionization from quasar spectra is therefore subtle and
  requires much more detailed modeling. Similarly, we expect density fluctuations
  alone to produce order unity transmission fluctuations in the z~3 He II Lyalpha
  forest on the scales over which these measurements are typically made.
