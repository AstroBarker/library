abstract: Published observational data on the Leo, Dorado, NGC 1400, NGC 5044, Antlia,
  Fornax, and Virgo groups of galaxies are analyzed in terms of the luminosity functions
  and morphological types of their members. The data sets employed are characterized,
  and the results are presented in extensive tables and graphs and discussed in detail.
  While the fractions of early and late galaxies in the groups are similar, the ratio
  of dwarfs to giants (D/G) in the early galaxies varies monotonically with the richness
  of the cluster, leading to artificial flattening at the faint end of the total luminosity
  function in environments with low D/G. The luminosity function for dwarfs in all
  environments is found to have a slope of about -1.3.
