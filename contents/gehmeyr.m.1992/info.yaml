abstract: Attention is given to a set of equations for the computation of nonlinear
  radial oscillations in convective variable stars. It consists of the radiation hydrodynamical
  equations coupled with a time-dependent phenomenological model for the turbulent-convective
  energy transport. Some elementary properties of the latter are discussed. The set
  of the finite difference equations are written in an arbitrary coordinate system
  for each node. They are coupled to an adaptive-grid algorithm designed to resolve
  the ionization regions properly. An adaptive-grid algorithm is employed to obtain
  full-amplitude oscillations of a radiative and a convective RR Lyrae model that
  sits near the red edge. It is shown that this numerical technique is superior to
  the traditional one in that it is capable of computing smooth radial velocity and
  light curves. The adaptive grid is able to detect the ionization zones and to track
  them during the pulsation cycles.
