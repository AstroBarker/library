abstract: We present the results of a spectroscopic monitoring campaign of the OB-star
  companions to the eclipsing X-ray pulsars SMC X-1, LMC X-4 and Cen X-3. High-resolution
  optical spectra obtained with UVES on the ESO Very Large Telescope are used to determine
  the radial-velocity orbit of the OB (super)giants with high precision. The excellent
  quality of the spectra provides the opportunity to measure the radial-velocity curve
  based on individual lines, and to study the effect of possible distortions of the
  line profiles due to e.g. X-ray heating on the derived radial-velocity amplitude.
  Several spectral lines show intrinsic variations with orbital phase. The magnitude
  of these variations depends on line strength, and thus provides a criterion to select
  lines that do not suffer from distortions. The undistorted lines show a larger radial-velocity
  amplitude than the distorted lines, consistent with model predictions. Application
  of our line-selection criteria results in a mean radial-velocity amplitude K\_opt
  of 20.2 $\pm$ 1.1, 35.1 \$\pm\$ 1.5, and 27.5 \$\pm\$ 2.3 km s-1 (1 sigma errors),
  for the OB companion to SMC X-1, LMC X-4 and Cen X-3, respectively. Adding information
  on the projected rotational velocity of the OB companion (derived from our spectra),
  the duration of X-ray eclipse and orbital parameters of the X-ray pulsar (obtained
  from literature), we arrive at a neutron star mass of 1.06^+0.11-0.10, 1.25^+0.11-0.10
  and 1.34^+0.16-0.14 M\&sun; for SMC X-1, LMC X-4 and Cen X-3, respectively. The
  mass of SMC X-1 is near the minimum mass (~1 M\&sun;) expected for a neutron star
  produced in a supernova. We discuss the implications of the measured mass distribution
  on the neutron-star formation mechanism, in relation to the evolutionary history
  of the massive binaries.  Based on observations obtained at the European Southern
  Observatory at Paranal, Chile (ESO program 68.D-0568). Tables 2, 5 and Figs. 2,
  3 are only available in electronic form at http://www.aanda.org Fits data to Table
  3 are only available in electronic form at the CDS via anonymous ftp to cdsarc.u-strasbg.fr
  (130.79.128.5) or via http://cdsweb.u-strasbg.fr/cgi-bin/qcat?J/A+A/473/523
