abstract: We present analysis of high-resolution spectra of a sample of stars in the
  globular cluster M5 (NGC 5904). The sample includes stars from the red giant branch
  (RGB; seven stars), the red horizontal branch (two stars), and the asymptotic giant
  branch (AGB; eight stars), with effective temperatures ranging from 4000 K to 6100
  K. Spectra were obtained with the HIRES spectrometer on the Keck I telescope, with
  a wavelength coverage from 3700 {\AA} to 7950 {\AA} for the HB and AGB sample, and
  5300 {\AA} to 7600 {\AA} for the majority of the RGB sample. We find offsets of
  some abundance ratios between the AGB and the RGB branches. However, these discrepancies
  appear to be due to analysis effects, and indicate that caution must be exerted
  when directly comparing abundance ratios between different evolutionary branches.
  We find the expected signatures of pollution from material enriched in the products
  of the hot hydrogen burning cycles such as the CNO, Ne-Na, and Mg-Al cycles, but
  no significant differences within these signatures among the three stellar evolutionary
  branches especially when considering the analysis offsets. We are also able to measure
  an assortment of neutron-capture element abundances, from Sr to Th, in the cluster.
  We find that the neutron-capture signature for all stars is the same, and shows
  a predominately r-process origin. However, we also see evidence of a small but consistent
  extra s-process signature that is not tied to the light-element variations, pointing
  to a pre-enrichment of this material in the protocluster gas.  The data presented
  herein were obtained at the W. M. Keck Observatory, which is operated as a scientific
  partnership among the California Institute of Technology, the University of California,
  and the National Aeronautics and Space Administration. The Observatory was made
  possible by the generous financial support of the W. M. Keck Foundation.
