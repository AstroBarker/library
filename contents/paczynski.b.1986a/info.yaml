abstract: Models of static, extended, neutron star envelopes are calculated numerically,
  and a simple analytical approximation of their structure is given. Such envelopes
  may exist over a range of neutron star luminosities with (L-infinity/L-E) in the
  range from 0.7 to 1 if the effects of general relativity and temperature dependence
  of electron scattering are taken into account. Both effects are shown to be essential
  for the structure of extended envelopes. Most of the envelope mass is confined to
  a layer only a few meters thick, while there is very little mass in the extended
  part, which may be over 100 km thick. The whole envelope is in a radiative equilibrium.
  In the extended part the luminosity is smaller than the local critical luminosity
  by only one part in 10,000, and the ratio of gas pressure to the total pressure
  is only 0.0001. These models may be applicable to some X-ray bursts which show evidence
  for radius expansion. Observations of such bursts may be used, in principle to estimate
  masses and radii of neutron stars independent of their distances.
