abstract: Non-thermal components are key ingredients for understanding clusters of
  galaxies. In the hierarchical model of structure formation, shocks and large-scale
  turbulence are unavoidable in the cluster formation processes. Understanding the
  amplification and evolution of the magnetic field in galaxy clusters is necessary
  for modelling both the heat transport and the dissipative processes in the hot intra-cluster
  plasma. The acceleration, transport and interactions of non-thermal energetic particles
  are essential for modelling the observed emissions. Therefore, the inclusion of
  the non-thermal components will be mandatory for simulating accurately the global
  dynamical processes in clusters. In this review, we summarise the results obtained
  with the simulations of the formation of galaxy clusters which address the issues
  of shocks, magnetic field, cosmic ray particles and turbulence.
