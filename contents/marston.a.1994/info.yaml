abstract: Images are presented from the first half of a survey of all Galactic Wolf-Rayet
  stars in the catalog of van der Hucht et al. (1981) residing in the southern skies.
  Previous surveys used only existing broad-band photographic plates. Encouraged by
  successes using CCD imaging with interference filters of the LMC and northern Galaxy
  (Miller \& Chu 1993), we have expanded the survey to the southern hemisphere. In
  the first half of our southern survey, H alpha and (O III) narrow-band CCD images
  of fields centered on known Wolf-Rayet stars have indicated the existence of six
  new ring nebulae as well as revealing previously unobserved morphological features
  in the known ring nebulae. An example of this is an almost perfect ring of (O III)
  emission residing interior to the previously observed H alpha filaments of the Wolf-Rayet
  ring nebulae RCW 104. Our surveys to date indicate that 21\% of all Wolf-Rayet stars
  have ring nebulae, with WN-type Wolf-Rayet stars having a greater likelihood for
  an associated ring.
