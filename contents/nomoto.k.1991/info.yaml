abstract: Recent discovery of an unexpectedly large number of low-mass binary pulsars
  (LMBPs) in globular clusters has instigated active discussions on the evolutionary
  origin of binary pulsars. Prompted by the possibility that at least some of LMBPs
  originate from accretion-induced collapse (AIC) of white dwarfs, a reexamination
  is conducted as to whether or not AIC occurs for the new models of O + Ne + Mg white
  dwarfs and solid C + O white dwarfs that can ignite explosive nuclear burning at
  significantly lower central densities than in the previous models. Even with low
  critical densities, AIC is still much more likely than explosion for both types
  of white dwarfs. Possible regions for AIC are presented in a diagram of mass accretion
  rate vs initial mass of the white dwarfs.
