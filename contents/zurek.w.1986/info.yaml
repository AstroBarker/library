abstract: The three-dimensional evolution of thick accretion tori is investigated
  theoretically by means of numerical simulations based on the smooth-particle hydrodynamics
  code of Lucy (1977) and Gingold and Monaghan (1977). The implications of the results
  for AGN and other astrophysical sources with jets are considered. Isentropic pressure-supported
  tori at constant specific angular momentum are shown to undergo nonaxisymmetric
  instabilities, with shifts in specific angular momentum on short dynamic time scales.
