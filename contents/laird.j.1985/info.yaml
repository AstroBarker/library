abstract: Intermediate-dispersion spectra of 116 field dwarf stars, plus 10 faint
  field giants and 3 Hyades dwarfs, have been used to derive carbon and nitrogen abundances
  relative to iron. The program sample includes both disk and halo stars, spanning
  a range in [Fe/H] of +0.50 to -2.45. Synthetic spectra of CH and NH bands have been
  used to determine carbon and nitrogen abundances. The C/Fe ratio is solar over the
  range of metallicity studied, with an estimated intrinsic scatter of 0.10 dex. Down
  to [Fe/H] \approx{} -1.8, below which the nitrogen abundance could not be measured,
  the N/Fe ratio is also constant for the majority of stars, indicating that nitrogen
  production is largely primary. Four halo stars are found to be enhanced in nitrogen
  relative to iron, by factors between 5 and 50, although their carbon abundances
  appear to be normal. These results are discussed in connection with the chemical
  evolution of the Galaxy and the sites of C, N, and Fe nucleosynthesis. The results
  require that C, N, and Fe be produced in stars of similar mass. Our current understanding
  of N production, then, implies that most Type I supernovae have intermediate-mass
  progenitors. The nitrogen in the N-enhanced halo stars is very probably primordial,
  indicating that the interstellar medium at early epochs contained substantial inhomogeneities.
