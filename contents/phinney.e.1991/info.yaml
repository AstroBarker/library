abstract: 'Of the many sources which gravitational wave observatories might see, merging
  neutron star binaries are the most predictable. Their waveforms at the observable
  frequencies are easy to calculate. And three systems which will merge in less than
  a Hubble time have already been observed as binary pulsars: two in the disk of the
  Galaxy, and one in a globular cluster. From the lifetimes and positions of these,
  a lower limit to the merger rate in the Galaxy and globular cluster system are inferred
  with confidence. Taking the merger rate in other galaxies to scale with the star
  formation rate, the merger rate expected in the local universe is computed. An ultraconservative
  lower limit to the rate gives three per year within 1 Gpc. The best estimate, still
  conservative in that it considers only systems like those already observed, gives
  three per year within 200 Mpc. An upper limit of three mergers per year within 23/h
  Mpc is set by the rate of Type Ib supernovae. The rates of black hole binary mergers
  and black hole-neutron star binary mergers are model-dependent, but could be comparable
  to the given rate of neutron-star binary mergers.'
