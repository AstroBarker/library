abstract: We improve estimates of the stellar mass and mass-weighted average age of
  Type Ia supernova (SN Ia) host galaxies by combining UV and near-IR photometry with
  optical photometry in our analysis. Using 206 SNe Ia drawn from the full three-year
  Sloan Digital Sky Survey (SDSS-II) Supernova Survey (median redshift of z \approx{}
  0.2) and multi-wavelength host-galaxy photometry from SDSS, the Galaxy Evolution
  Explorer, and the United Kingdom Infrared Telescope Infrared Deep Sky Survey, we
  present evidence of a correlation (1.9sigma confidence level) between the residuals
  of SNe Ia about the best-fit Hubble relation and the mass-weighted average age of
  their host galaxies. The trend is such that older galaxies host SNe Ia that are
  brighter than average after standard light-curve corrections are made. We also confirm,
  at the 3.0sigma level, the trend seen by previous studies that more massive galaxies
  often host brighter SNe Ia after light-curve correction.
