abstract: "We present 888 visual-wavelength spectra of 122 nearby type II supernovae
  (SNe II) obtained between 1986 and 2009, and ranging between 3 and 363 days post-explosion.
  In this first paper, we outline our observations and data reduction techniques,
  together with a characterization based on the spectral diversity of SNe{\\^A} II.
  A statistical analysis of the spectral matching technique is discussed as an alternative
  to nondetection constraints for estimating SN explosion epochs. The time evolution
  of spectral lines is presented and analyzed in terms of how this differs for SNe
  of different photometric, spectral, and environmental properties: velocities, pseudo-equivalent
  widths, decline rates, magnitudes, time durations, and environment metallicity.
  Our sample displays a large range in ejecta expansion velocities, from {\\^a}\x88{\\OE}9600
  to {\\^a}\x88{\\OE}1500 km s{\\^a}\x88\x921 at 50 days post-explosion with a median
  \ value of 7300 km s{\\^a}\x88\x921. This is most likely explained through differing
  explosion energies. Significant diversity is also observed in the absolute strength
  of spectral lines, characterized through their pseudo-equivalent widths. This implies
  significant diversity in both temperature evolution (linked to progenitor radius)
  and progenitor metallicity between different SNe{\\^A} II. Around 60\\% of our sample
  shows an extra absorption component on the blue side of the  P-Cygni profile ({\\^a}\x80\x9CCachito{\\^a}\x80\x9D
  feature) between 7 and 120 days since explosion. Studying the nature of Cachito,
  we conclude that these features at early times (before {\\^a}\x88{\\OE}35 days)
  are associated with Si ii , while past the middle of the plateau phase they are
  related to high velocity (HV) features of hydrogen lines."
