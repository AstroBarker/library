abstract: A kinematic model for the bizarre emission-line object SS433 is proposed
  in which the radiation with variable Doppler shift is emitted by hot matter ejected
  from the central object at high but nearly constant velocity in oppositely directed
  narrow streams, possibly along a magnetic axis. According to this model, rotation
  of the beam axis provides the observed radial-velocity variations, and the observed
  emission is produced when matter reaches a critical distance from the central object
  and cools sufficiently to recombine. Specific predictions are made regarding the
  behavior of the variable velocity components during the as-yet unobserved portions
  of the 164-day period.
