abstract: A detailed description of ZEUS-2D, a numerical code for the simulation of
  fluid dynamical flows including a self-consistent treatment of the effects of magnetic
  fields and radiation transfer is presented. Attention is given to the hydrodynamic
  (HD) algorithms which form the foundation for the more complex MHD and radiation
  HD algorithms. The effect of self-gravity on the flow dynamics is accounted for
  by an iterative solution of the sparse-banded matrix resulting from discretizing
  the Poisson equation in multidimensions. The results of an extensive series of HD
  test problems are presented. A detailed description of the MHD algorithms in ZEUS-2D
  is presented. A new method of computing the electromotive force is developed using
  the method of characteristics (MOC). It is demonstrated through the results of an
  extensive series of MHD test problems that the resulting hybrid MOC-constrained
  transport method provides for the accurate evolution of all modes of MHD wave families.
