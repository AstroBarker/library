abstract: The nature of carbon burning flames in Type Ia supernovae is explored as
  they interact with Kolmogorov turbulence. One-dimensional calculations using the
  Linear Eddy Model of Kerstein elucidate three regimes of turbulent burning. In the
  simplest case, large-scale turbulence folds and deforms thin laminar flamelets to
  produce a flame brush with a total burning rate given approximately by the speed
  of turbulent fluctuations on the integral scale, UL , This is the regime where the
  supernova explosion begins and where most of its pre-detonation burning occurs.
  As the density declines, turbulence starts to tear the individual flamelets, making
  broader structures that move faster. For a brief time, these turbulent flamelets
  are still narrow compared to their spacing and the concept of a flame brush moving
  with an overall speed of UL remains valid. However, the typical width of the individual
  flamelets, which is given by the condition that their turnover time equals their
  burning time, continues to increase as the density declines. Eventually, mixed regions
  almost as large as the integral scale itself are transiently formed. At that point,
  a transition to detonation can occur. The conditions for such a transition are explored
  numerically and it is estimated that the transition will occur for densities near
  1 \texttimes{} 107 g cm-3, provided the turbulent speed on the integral scale exceeds
  about 20\% sonic. An example calculation shows the details of a detonation actually
  developing.
