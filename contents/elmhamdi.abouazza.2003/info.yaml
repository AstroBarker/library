abstract: '{We present photometry and spectra of the Type IIP supernova 1999em in
  NGC 1637 from several days after the outburst till day 642. The radioactive tail
  of the recovered bolometric light curve of SN 1999em indicates that the amount of
  the ejected 56Ni is . The H\ensuremath{\alpha} and He i 10 830-{\AA} lines at the
  nebular epoch show that the distribution of the bulk of 56Ni can be represented
  approximately by a sphere of 56Ni with a velocity of 1500 km s-1, which is shifted
  towards the far hemisphere by about 400 km s-1. The fine structure of the H\ensuremath{\alpha}
  at the photospheric epoch reminiscent of the `Bochum event'' in SN 1987A is analysed
  in terms of two plausible models: bipolar 56Ni jets and non-monotonic behaviour
  of the H\ensuremath{\alpha} optical depth combined with the one-sided 56Ni ejection.
  The late-time spectra show a dramatic transformation of the [O i] 6300-{\AA} line
  profile between days 465 and 510, which we interpret as an effect of dust condensation
  during this period. Late-time photometry supports the dust formation scenario after
  day 465. The [O i] line profile suggests that the dust occupies a sphere with velocity
  \approx{}800 km s-1 and optical depth \gg{}10. The latter exceeds the optical depth
  of the dusty zone in SN 1987A by more than 10 times. Use is made of the Expanding
  Photosphere Method to estimate the distance and the explosion time, D\approx{} 7.83
  Mpc and t0\simeq{} 1999 October 24.5 ut, in accord with observational constraints
  on the explosion time and with other results of detailed studies of the method.
  The plateau brightness and duration combined with the expansion velocity suggest
  a pre-supernova radius of 120--150 R\odot{}, ejecta mass of 10--11 M\odot{} and
  explosion energy of (0.5--1) \texttimes{} 1051 erg. The ejecta mass combined with
  the neutron star and a conservative assumption about mass loss implies the main
  sequence progenitor of Mms\approx{} 12--14 M\odot{}. The derived mass range is in
  agreement with the upper limit to the mass found using pre-supernova field images
  by Smartt et al. From the [O i] 6300, 6364 {\AA} doublet luminosity we infer the
  oxygen mass to be a factor four lower than in SN 1987A which is consistent with
  the estimated SN 1999em progenitor mass according to nucleosynthesis and stellar
  evolution theory. We note a `second-plateau'' behaviour of the light curve after
  the main plateau at the beginning of the radioactive tail. This feature seems to
  be common to SNe IIP with low 56Ni mass.}'
