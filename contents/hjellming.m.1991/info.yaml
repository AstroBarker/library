abstract: The response of a 1.25 solar mass secondary ZAMS star to the low-density,
  high-entropy conditions within the common envelope of a red giantlike configuration
  is numerically investigated in order to examine the state of the star on its emergence
  from the common-envelope stage. The results demonstrate that such a star accumulates
  little matter, typically less than 0.01 solar mass, after a long adiabatic accretion
  phase followed by a brief, nearly adiabatic Roche-lobe overflow phase. The evolution
  time scale for the common-envelope phase is rapid, and the duration of the common-envelope
  phase is 400-4000 yr. It is expected that the envelope of the secondary would significantly
  depart from a thermal equilibrium state on its emergence from the common-envelope
  phase. Once the common envelope is ejected, the thermal relaxation time scale of
  the disturbed outer envelope layer of the secondary is found to be about 10,000
  yr.
