abstract: We present a detailed spectral analysis of the prompt and afterglow emission
  of four nearby long-soft gamma-ray bursts (GRBs 980425, 030329, 031203, and 060218)
  that were spectroscopically found to be associated with Type Ic supernovae and compare
  them to the general GRB population. For each event, we investigate the spectral
  and luminosity evolution and estimate the total energy budget based on broadband
  observations. The observational inventory for these events has become rich enough
  to allow estimates of their energy content in relativistic and subrelativistic form.
  The result is a global portrait of the effects of the physical processes responsible
  for producing long-soft GRBs. In particular, we find that the values of the energy
  released in mildly relativistic outflows appears to have a significantly smaller
  scatter than those found in highly relativistic ejecta. This is consistent with
  a picture in which the energy released inside the progenitor star is roughly standard,
  while the fraction of that energy that ends up in highly relativistic ejecta outside
  the star can vary dramatically between different events.
