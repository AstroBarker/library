abstract: We present analytic fits to charge exchange rate coefficients over the full
  range of temperatures which occurs in photoionized or shock-heated plasmas. We consider
  reactions between neutral hydrogen and all elements with parent ion charge q = 1-4
  up to Z = 30. Many rates were obtained from various sources in the literature. For
  reactions for which no data were available, we calculated rates using the Landau-Zener
  formalism. For these new reactions, we tabulate both total and state-specific rate
  coefficients. Ml are fitted with a consistent, accurate formula. These fits may
  be incorporated easily into spectral synthesis codes, and we make available an electronic
  form of our results. We draw attention to the most important reactions without high-quality
  rate coefficients to encourage further work.
