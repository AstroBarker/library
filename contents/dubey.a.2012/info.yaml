abstract: In many astrophysical simulations, both Eulerian and Lagrangian quantities
  are of interest. For example, in a galaxy cluster merger simulation, the intracluster
  gas can have Eulerian discretization, while dark matter can be modeled using particles.
  FLASH, a component-based scientific simulation code, superimposes a Lagrangian framework
  atop an adaptive mesh refinement Eulerian framework to enable such simulations.
  The discretization of the field variables is Eulerian, while the Lagrangian entities
  occur in many different forms including tracer particles, massive particles, charged
  particles in particle-in-cell mode, and Lagrangian markers to model fluid-structure
  interactions. These widely varying roles for Lagrangian entities are possible because
  of the highly modular, flexible, and extensible architecture of the Lagrangian framework.
  In this paper, we describe the Lagrangian framework in FLASH in the context of two
  very different applications, Type Ia supernovae and galaxy cluster mergers, which
  use the Lagrangian entities in fundamentally different ways.
