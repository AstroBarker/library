abstract: It has been recognized that the magnetic reconnection process is of great
  importance in high-energy astrophysics. We develop a new two-dimensional relativistic
  resistive magnetohydrodynamic (R2MHD) code and carry out numerical simulations of
  magnetic reconnection. We find that the outflow velocity reaches the Alfv{\'e}n
  velocity in the inflow region and that a higher Alfv{\'e}n velocity provides a higher
  reconnection rate. We also find that Lorentz contraction plays an important role
  in enhancement of the reconnection rate.
