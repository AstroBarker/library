abstract: Detailed numerical calculations of relatively high resolution are reported
  which show that shock propagation through realistic presupernova structrue results
  in a pronounced Rayleigh-Taylor instability. Processed matter is found to penetrate
  near to the H-He interface after only 10,000 seconds, well before significant decay
  of Ni-56. Pronounced fingers forming in density, though not in temperature, are
  also found. Such behavior has profound implications for line formation, polarimetry,
  and X-ray and gamma-ray emission from SN 1987A and for subsequent development of
  the Ni-Co 'bubble'.
