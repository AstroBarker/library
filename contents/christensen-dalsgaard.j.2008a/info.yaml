abstract: The Aarhus code is the result of a long development, starting in 1974, and
  still ongoing. A novel feature is the integration of the computation of adiabatic
  oscillations for specified models as part of the code. It offers substantial flexibility
  in terms of microphysics and has been carefully tested for the computation of solar
  models. However, considerable development is still required in the treatment of
  nuclear reactions, diffusion and convective mixing.
