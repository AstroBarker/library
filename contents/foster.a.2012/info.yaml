abstract: We describe the latest release of AtomDB, version 2.0.2, a database of atomic
  data and a plasma modeling code with a focus on X-ray astronomy. This release includes
  several major updates to the fundamental atomic structure and process data held
  within AtomDB, incorporating new ionization balance data, state-selective recombination
  data, and updated collisional excitation data for many ions, including the iron
  L-shell ions from Fe+16 to Fe+23 and all of the hydrogen- and helium-like sequences.
  We also describe some of the effects that these changes have on calculated emission
  and diagnostic line ratios, such as changes in the temperature implied by the He-like
  G-ratios of up to a factor of two.
