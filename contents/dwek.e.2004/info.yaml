abstract: Ejecta from core-collapse supernovae contain a few solar masses of refractory
  elements and therefore can be the most important source of interstellar dust if
  these elements condense efficiently into solids. However, infrared observations
  of young supernova remnants, such as Cas A or Kepler, and observations of SN 1987A
  have detected only ~10-3 Msolar of hot dust in these objects. Recently, Dunne et
  al. obtained 450 and 850 mum SCUBA images of Cas A and reported the detection of
  2-4 Msolar of cold (18 K) dust in the remnant. Here we show that their interpretation
  of the observations faces serious difficulties. Their inferred dust mass ignores
  the effect of grain destruction by sputtering and is larger than the mass of refractory
  material in the ejecta of a 10-30 Msolar star. The cold dust model faces even more
  difficulties if the 170 mum observations of the remnant are included in the analysis,
  which decreases the cold dust temperature to ~ 8 K and increases its mass to >~
  20 Msolar. We offer here a more plausible interpretation of their observation, in
  which the cold dust emission is generated by conducting needles in the ejecta. The
  needle properties are completely determined by the combined submillimeter and X-ray
  observations of the remnant. The needles are collisionally heated by the shocked
  gas. They are very efficient emitters at submillimeter wavelengths and, with a resistivity
  of a few muOmega cm, can readily attain a temperature of 8 K. Taking the destruction
  of needles into account, a dust mass of only 10-4 to 10-3 Msolar is needed to account
  for the observed SCUBA emission. The needles consist of metallic whiskers with <~1\%
  of embedded impurities, which may have condensed out of blobs of material that were
  expelled at high velocities from the inner metal-rich layers of the star in an asymmetric
  explosion. Conductive needles may also be the source of the cold dust emission detected
  by Morgan et al. in Kepler. When aligned in the magnetic field, needles may give
  rise to observable polarized emission. The detection of submillimeter polarization
  will therefore offer definitive proof for a needle origin for the cold dust emission.
  Supernovae may yet be proven to be important sources of interstellar dust, but the
  evidence is still inconclusive.
