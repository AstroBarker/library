abstract: Fully resolved gamma-ray line observations from the decay of Co-56 in SN
  1987A are presented. Data are from the first two balloon flights of the Gamma-Ray
  Imaging Spectrometer. On day 433 (after the initial optical sighting) the 847 and
  1238 keV lines from Co-56 were observed at 2.3 and 4.3 sigma significance. On day
  613, the lines at 847, 1238, and 2599 keV were observed at 4.6, 3.4, and 1.9 sigma,
  respectively. The combined significance for the three-line complex in both flights
  is 7.8 sigma. Gaussian profiles yield acceptable least-squares fits to the lines.
  The line profiles are centered on the red side of the rest energy with typical velocity
  dispersions of about 3500 km/s FWHM, consistent with an optically thin source, but
  the line intensities are less than about 30 percent of those produced by the 0.075
  solar mass of Co-56 determined from the bolometric light curve.
