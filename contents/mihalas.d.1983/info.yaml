abstract: The linearized Lagrangian radiation equations of Castor (1972) are used
  in order to obtain a virtually complete and physically satisfying view of acoustic
  wave dynamics in a radiating fluid. It is assumed that the radiation field is quasi-static,
  all dynamical radiation terms are ignored, and the Eddington approximation is applied.
  It is noted that it would be useful to proceed with the complementary study of the
  time evolution of initial disturbances.
