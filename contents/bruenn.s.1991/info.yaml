abstract: Differential cross sections for charged-current and inelastic neutral-current
  neutrino-nucleus interactions have been computed. These are incorporated into a
  radiation hydrodynamics code, and a number of models have been evolved with the
  aim of determining the role of these rates in the evolution of the collapsing core
  and in the supernova mechanism. In particular, attention is given to the effect
  of these rates on the infall epoch, the prompt shock propagation phase, and the
  delayed-shock phase in the evolution of the core.
