abstract: There is a warm tenuous partially ionized cloud (T\texttildelow{}104 K,n(H
  I)\texttildelow{}0.1 cm-3,n(H ii\texttildelow{} 0.22 0.44 cm-3) surrounding the
  solar system which regulates the environment of the solar system, determines the
  structure of the heliopause region, and feeds neutral interstellar gas into the
  inner solar system. The velocity (V\texttildelow{}-20 km s-1 froml\texttildelow{}335$\,^{\circ}$,b\texttildelow{}0\$\,^{\circ}\$
  in the local standard of rest) and enhanced Ca ii and Fe ii abundances of this cloud
  suggest an origin as evaporated gas from cloud surfaces in the Scorpius-Centaurus
  Association. Although the soft X-ray emission attributed to the `Local Bubble' is
  enigmatic, optical and ultraviolet data are consistent with bubble formation caused
  by star formation epochs in the Scorpius-Centaurus Association as regulated by the
  nearby spiral arm configuration. The cloud surrounding the solar system (the `local
  fluff') appears to be the leading region of an expanding interstellar structure
  (the `squall line') which contains a magnetic field causing polarization of the
  light of nearby stars, and also absorption features in nearby upwind stars. The
  velocity vectors of the solar system and local fluff are perpendicular in the local
  standard of rest. Combining this information with the low column densities seen
  towards Sirius in the anti-apex direction, and the assumption that the cloud velocity
  vector is parallel to the surface normal, suggests that the Sun entered the local
  fluff within the historical past (less than 10 000 years ago) and is skimming the
  surface of the cloud. Comparison of magnesium absorption lines towards Sirius and
  anomalous cosmic-ray data suggest the local fluff is in ionization equilibrium.
