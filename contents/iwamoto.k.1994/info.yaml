abstract: SN 1994I in M51 has provided light curves in various wavelength bands allowing
  a distinction between models of Type Ic supernovae. We present bolometric and monochromatic
  light curves of exploding C+O stars that form from approximately 13-15 solar mass
  stars through the losses of the H-rich and He envelopes in close binary systems.
  The slopes of the calculated light curves are sensitive to the models and found
  to be in excellent agreement with the observed light curves for the 0.9 solar mass
  ejecta model. A high interstellar reddening AV is approximately equal to 1.4 mag)
  is required. From the light curve fits, a distance modulus of 29.2 +/- 0.3 mag is
  derived for M51. The ejected Ni-56 mass is found to be 0.07(plus 0.035 or minus
  0.025) solar mass. Possibilities to observe gamma rays from SN 1994I with Compton
  Gamma Ray Observatory (CGRO) are discussed.
