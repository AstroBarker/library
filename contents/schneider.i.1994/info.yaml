abstract: The dissociative recombination rate coefficients of H2(+) molecular ions
  are calculated for temperatures up to 4000 K. Specific account has been taken of
  rotational effects and contribution of high dissociative molecular states within
  the multichannel quantum defect theory (MQDT). A large range of electronic and nuclear
  temperatures is considered, which allows the use of these data in a variety of astrophysical
  and laboratory hydrogen plasmas.
