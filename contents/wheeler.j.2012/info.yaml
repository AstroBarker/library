abstract: 'Limits on the companions of white dwarfs in the single-degenerate scenario
  for the origin of Type Ia supernovae (SNe Ia) have gotten increasingly tight, yet
  igniting a nearly Chandrasekhar mass C/O white dwarf from a condition of near hydrostatic
  equilibrium provides compelling agreement with observed spectral evolution. The
  only type of non-degenerate stars that survive the tight limits, MV >~ 8.4 on the
  SN Ia in SNR 0509-67.5 and MV >~ 9.5 in the remnant of SN 1572, are M dwarfs. While
  M dwarfs are observed in cataclysmic variables, they have special properties that
  have not been considered in most work on the progenitors of SNe Ia: they have small
  but finite magnetic fields and they flare frequently. These properties are explored
  in the context of SN Ia progenitors. White dwarf/M dwarf pairs may be sufficiently
  plentiful to provide, in principle, an adequate rate of explosions even with slow
  orbital evolution due to magnetic braking or gravitational radiation. Even modest
  magnetic fields on the white dwarf and M dwarf will yield adequate torques to lock
  the two stars together, resulting in a slowly rotating white dwarf, with the magnetic
  poles pointing at one another in the orbital plane. The mass loss will be channeled
  by a "magnetic bottle" connecting the two stars, landing on a concentrated polar
  area on the white dwarf. This enhances the effective rate of accretion compared
  to spherical accretion. Luminosity from accretion and hydrogen burning on the surface
  of the white dwarf may induce self-excited mass transfer. The combined effects of
  self-excited mass loss, polar accretion, and magnetic inhibition of mixing of accretion
  layers give possible means to beat the "nova limit" and grow the white dwarf to
  the Chandrasekhar mass even at rather moderate mass accretion rates.'
