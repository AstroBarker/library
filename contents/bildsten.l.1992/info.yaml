abstract: The fate of incident C-12, N-14, and O-16 in accreting neutron star atmospheres
  is described. When the accreting material is stopped by Coulomb collisions with
  atmospheric electrons, all incoming elements heavier than helium thermalize at higher
  altitudes in the atmosphere than the accreting protons. The incoming protons and
  helium then destroy the elements via nuclear spallation reactions. A small fraction
  of the nuclear reactions cause nuclear excitation and subsequent gamma-ray emission.
  The probability for a nucleus to survive this bombardment depends on how long it
  spends in the hazardous region of the atmosphere. The fractions of incident C-12,
  N-14, and O-16 that survive proton bombardment are calculated as a function of the
  accretion rate, and the mass and radius of the neutron star. The subsequent paucity
  of CNO nuclei decreases hydrogen-burning rates in the deep regions of the atmosphere,
  thereby reducing the amount of helium available for the unstable nuclear flashes
  that cause type I X-ray bursts. The gamma-ray line emission from this collisional
  deceleration scenario is determined.
