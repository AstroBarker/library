abstract: 'An application of Monte Carlo techniques to the problem of neutrino transport
  in energy space is presented. A Monte Carlo treatment of the neutrino distribution
  function is outlined, an idealized infinite-medium model is adopted, and the general
  nature of neutrino-electron scattering is indicated. A simple neutrino-confinement
  model is introduced, and the sensitivity of the Monte Carlo code to variations in
  numerical parameters is tested. Results are obtained which suggest that: (1) neutrino-electron
  scattering may play a negligible role in neutrino equilibration; (2) neutrino-matter
  equilibration is likely for densities of at least about 1 trillion g/cu cm; and
  (3) it may not be possible to maintain even a nonequilibrium steady-state neutrino
  distribution over dynamical time scales for densities less than about 100 billion
  g/cu cm. Uncertainties and implications of the results which may affect the treatment
  of neutrino transport in stellar cores are considered.'
