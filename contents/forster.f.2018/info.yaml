abstract: Type II supernovae (SNe II) originate from the explosion of hydrogen-rich
  supergiant massive stars. Their first electromagnetic signature is the shock breakout
  (SBO), a short-lived phenomenon that can last for hours to days depending on the
  density at shock emergence. We present 26 rising optical light curves of SN II candidates
  discovered shortly after explosion by the High Cadence Transient Survey and derive
  physical parameters based on hydrodynamical models using a Bayesian approach. We
  observe a steep rise of a few days in 24 out of 26 SN II candidates, indicating
  the systematic detection of SBOs in a dense circumstellar matter consistent with
  a mass loss rate of M \textperiodcentered{} > 10-4M\&sun; yr-1 or a dense atmosphere.
  This implies that the characteristic hour-timescale signature of stellar envelope
  SBOs may be rare in nature and could be delayed into longer-lived circumstellar
  material SBOs in most SNe II.
