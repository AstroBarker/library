abstract: 'It has been suggested by radio observations of polarized synchrotron emissions
  that downstream magnetic fields in some young supernova remnants (SNRs) are oriented
  radially. We study the magnetic field distribution of turbulent SNRs driven by the
  Richtmyer-Meshkov instability (RMI)---in other words, the effect of rippled shock---by
  using three-dimensional magnetohydrodynamics simulations. We find that the induced
  turbulence has radially biased anisotropic velocity dispersion that leads to a selective
  amplification of the radial component of the magnetic field. The RMI is induced
  by the interaction between the shock and upstream density fluctuations. Future high-resolution
  polarization observations can distinguish the following candidates responsible for
  the upstream density fluctuations: (1) inhomogeneity caused by the cascade of large-scale
  turbulence in the interstellar medium, the so-called big power-law in the sky; (2)
  structures generated by the Drury instability in the cosmic-ray modified shock;
  and (3) fluctuations induced by the nonlinear feedback of the cosmic-ray streaming
  instability.'
