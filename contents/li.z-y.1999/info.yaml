abstract: SN 1998bw is an unusual Type Ic supernova that may be associated with the
  gamma-ray burst GRB 980425. We use a synchrotron self-absorption model for its radio
  emission to deduce that the synchrotron-emitting gas is expanding into a circumstellar
  medium of approximately r-2 density profile at a speed comparable to the speed of
  light. We assume that the efficiencies of production of relativistic electrons and
  magnetic field are constant through the evolution. The circumstellar density is
  consistent with that expected around the massive star core thought to be the progenitor
  of SN 1998bw. The explosion energy in material moving with velocity greater than
  0.5c is ~1049-(3\texttimes{}1050) ergs, with some preference for the high values.
  The rise in the radio light curves observed at days 20-40 is inferred to be the
  result of a rise in the energy of the blast wave by a factor of ~2.5. Interaction
  with a jump in the ambient density is not consistent with the observed evolution.
  We infer that the boost in energy is from a shell of matter from the explosion that
  catches up with the decelerating shock front. Both the high explosion energy and
  the nature of the energy input to the blast wave are difficult to reconcile with
  energy input from the shock-accelerated high-velocity ejecta from a supernova. The
  implication is that there is irregular energy input from a central engine, which
  is the type of model invoked for normal gamma-ray bursts. The link between SN 1998bw
  and GRB 980425 is thus strengthened.
