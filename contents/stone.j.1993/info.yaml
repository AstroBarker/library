abstract: A description is presented of the numerical algorithms needed to solve the
  coupled time-dependent hydrodynamics and nonequilibrium rate equation. A test problem
  based on the overstability of radiative shocks is detailed, and 2D models of protostellar
  jets that were computed with both time-dependent nonequilibrium cooling and time-independent
  cooling (using the assumption of complete ionization) are compared. Substantial
  differences in the morphology of the jets in these two cases are noted to be due
  to differences in the effective cooling rates between the two formalisms for the
  same model parameters. The second part of this work presents multidimensional time-dependent
  numerical simulations protostellar jets into a uniform ambient medium; these employ
  a nonequilibrium treatment of optically thin radiative cooling. Attention is given
  to 2D and 3D models of pulsed jets in which the jet velocity is assumed to be intrinsically
  variable.
