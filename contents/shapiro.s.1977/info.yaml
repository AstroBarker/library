abstract: The burst of gravitational radiation emitted during the initial collapse
  and rebound of a homogeneous uniformly rotating spheroid with internal pressure
  is analyzed numerically. The surface of the collapsing spheroid is assumed to start
  at rest from infinity with negligible eccentricity ('zero-energy collapse'). The
  adopted internal pressure function is constant on self-similar spheroidal surfaces,
  and its central value is described by a polytropic law with index not exceeding
  3. The Newtonian equations of motion are integrated numerically to follow the initial
  collapse and rebound of the configuration for the special case in which the collapse
  is time-reversal invariant about the moment of maximum compression, and the total
  energy and frequency spectra of the emitted quadrupole radiation are computed. The
  results are employed to estimate the (approximately minimum) total energy and frequency
  distribution of the initial burst of gravitational radiation emitted during the
  formation of low-mass (not larger than the sun) neutron stars and during the collapse
  of supermassive gas clouds (about 1 million solar masses).
