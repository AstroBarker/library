abstract: We study the evolution of the ultrarelativistic shock wave in a plane-parallel
  atmosphere adjacent to a vacuum and the subsequent breakout phenomenon. When the
  density distribution is a power law in distance from the surface, there is a self-similar
  motion of the fluid before and after the shock emergence. The time evolution of
  the Lorentz factor of the shock front is assumed to follow a power law when the
  time is measured from the moment at which the shock front reaches the surface. The
  power index is found to be determined by the condition for the flow to extend through
  a critical point. The energy spectrum of the ejected matter as a result of the shock
  breakout is derived, and its dependence on the strength of the explosion is also
  deduced. The results are compared with the self-similar solution for the same problem
  with nonrelativistic treatment.
