abstract: The sun's internal solar velocity Omega is studied as a function of latitude
  and radius using the solar oscillation data of Brown and Morrow (1987). An attempt
  is made to separate robust inferences about the sun from artifacts of the analysis.
  It is found that a latitudinal variation of Omega similar to that observed at the
  solar surface exists throughout the sun's convection zone and that the variation
  of Omega with latitude persists to some extent even beneath the convection zone.
