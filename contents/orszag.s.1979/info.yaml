abstract: The formation of singularities in two-dimensional magnetohydrodynamic flow
  is investigated by direct numerical simulation. It is shown that two-dimensional
  magnetohydrodynamic turbulence is not as singular as three-dimensional hydrodynamic
  turbulence (in the sense that it has a less highly excited small-scale structure)
  but that it is more singular than two-dimensional hydrodynamic turbulence.
