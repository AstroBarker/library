abstract: A homological model is employed to follow the dynamical evolution of a globular
  cluster core containing a massive black hole at its center. Energy is supplied to
  the core via the inward drift and tidal disruption of stars in the cusp. This outward
  flow of energy inevitably halts and reverses core collapse. Re-expansion and complete
  dissolution is the ultimate fate of star clusters in the Galaxy whether they form
  tight binaries or massive black holes at their centers following catastrophic core
  collapse. Possible observational consequences of these results are briefly explored.
