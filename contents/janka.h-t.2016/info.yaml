abstract: Nonspherical mass motions are a generic feature of core-collapse supernovae,
  and hydrodynamic instabilities play a crucial role in the explosion mechanism. The
  first successful neutrino-driven explosions could be obtained with self-consistent,
  first-principles simulations in three spatial dimensions. But three-dimensional
  (3D) models tend to be less prone to explosion than the corresponding axisymmetric
  two-dimensional (2D) ones. The reason is that 3D turbulence leads to energy cascading
  from large to small spatial scales, the inverse of the 2D case, thus disfavoring
  the growth of buoyant plumes on the largest scales. Unless the inertia to explode
  simply reflects a lack of sufficient resolution in relevant regions, some important
  component of robust and sufficiently energetic neutrino-powered explosions may still
  be missing. Such a deficit could be associated with progenitor properties such as
  rotation, magnetic fields, or precollapse perturbations, or with microphysics that
  could cause enhancement of neutrino heating behind the shock. 3D simulations have
  also revealed new phenomena that are not present in 2D ones, such as spiral modes
  of the standing accretion shock instability (SASI) and a stunning dipolar lepton-number
  emission self-sustained asymmetry (LESA). Both impose time- and direction-dependent
  variations on the detectable neutrino signal. The understanding of these effects
  and of their consequences is still in its infancy.
