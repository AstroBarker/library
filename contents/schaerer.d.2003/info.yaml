abstract: 'Using new sets of stellar evolution models at very low metallicities (Z
  = 10-7, 10-5) and previously published grids we examine spectral properties of the
  ionising continua, the Lyman-break, and the Lyalpha and He I lambda 4471iuv recombination
  lines in starbursts. The metallicity dependence of these properties, especially
  the transition from primordial galaxies (Population III) to currently observed metallicities,
  is examined for various IMFs and star formation histories. For the average properties
  of starbursts, approximated by a model with constant star formation, the main findings
  are: - The Lyman continuum flux Q(H) increases with decreasing metallicity. For
  a universal Salpeter IMF from 1-100 Msun the enhancement reaches typically a factor
  of ~ 3 between solar metallicity and Pop III objects. - While for metallicities
  Z >~ 1/50 Zsun the amplitude of the Lyman-break depends little on Z, a reduction
  by a factor ~ 2 is found at lower metallicities, due to the strong increase of the
  average stellar temperature. - Using theoretical models and empirical constraints
  we discuss the expected evolution of the hardness of He+ to H ionising photons,
  Q(He+)/Q(H), with metallicity and possible uncertainties. Over the metallicity range
  Z=0 to ~ 10-4 the hardness decreases from log (Q(He+)/Q(H)) ~ -1.4 ... -2.3 by ~
  1.5-2 or more orders of magnitude, depending strongly on the upper mass cut-off
  of the IMF. From empirical constraints we derive a hardness log (Q(He+)/Q(H)) ~
  -3.2 to -2.6 for metal-poor starbursts (1/25 <~ Z/Zsun <~ 1/4) and softer spectra
  for higher metallicities. We also provide a simple estimate of the possible impact
  of hot WR like stars on Q(He+)/Q(H) at very low metallicities (Z <~ 10-4). - Calibrations
  for star formation rate determinations from various recombination lines at all metallicities
  and for various IMFs are derived. For young bursts the maximum Lyalpha equivalent
  width is shown to increase strongly with decreasing metallicity from W(Lyalpha )
  ~ 250-350 {\AA} at Z >~ 1/50 Zsun to 400-850 {\AA} or higher at Z between 10-5 and
  0 (Pop III) for the same Salpeter IMF. However, for well known reasons, the Lyalpha
  emission predicted likely represents an upper limit. Non-negligible He I lambda
  4471iuv emission due to stellar photoionisation appears to be limited to very small
  metallicities (log (Z/Zsun) <~ -5.3) and Population III objects. The predictions,
  available on the Web through the CDS and at http://webast.ast.obs-mip.fr/sfr/, should
  be useful for a variety of studies regarding high redshift galaxies, cosmological
  reionisation, and others. The catalog is only available in electronic form at the
  CDS via anonymous ftp to cdsarc.u-strasbg.fr (130.79.128.5) or via http:/ /cdsweb.u-strasbg.fr/
  cgi-bin/qcat?J/ A+A/397/527'
