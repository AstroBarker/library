abstract: An attempt is made to estimate the sizes of the convective elements which
  dominate the brightness variations on the photospheres of red giants and supergiants.
  The data assembled permit the extreme hypothesis that these dominant convective
  elements are so large that only a modest number of them exists at any one time on
  the entire surface of such a star - in contrast with two million granules on the
  sun.
