abstract: In typical astrophysical environments, the abundance of heavy elements ranges
  from 0.001 to 2 times the solar value. Lower abundances have been seen in selected
  stars in the Milky Way's halo and in two quasar absorption systems at redshift z
  = 3 (ref. 4). These are widely interpreted as relics from the early Universe, when
  all gas possessed a primordial chemistry. Before now there have been no direct abundance
  measurements from the first billion years after the Big Bang, when the earliest
  stars began synthesizing elements. Here we report observations of hydrogen and heavy-element
  absorption in a spectrum of a quasar at z = 7.04, when the Universe was just 772million
  years old (5.6 per cent of its present age). We detect a large column of neutral
  hydrogen but no corresponding metals (defined as elements heavier than helium),
  limiting the chemical abundance to less than 1/10,000 times the solar level if the
  gas is in a gravitationally bound proto-galaxy, or to less than 1/1,000 times the
  solar value if it is diffuse and unbound. If the absorption is truly intergalactic,
  it would imply that the Universe was neither ionized by starlight nor chemically
  enriched in this neighbourhood at z~7. If it is gravitationally bound, the inferred
  abundance is too low to promote efficient cooling, and the system would be a viable
  site to form the predicted but as yet unobserved massive population III stars.
