abstract: 'Star-forming galaxies trace cosmic history. Recent observational progress
  with the NASA Hubble Space Telescope has led to the discovery and study of the earliest
  known galaxies, which correspond to a period when the Universe was only ~800 million
  years old. Intense ultraviolet radiation from these early galaxies probably induced
  a major event in cosmic history: the reionization of intergalactic hydrogen.'
