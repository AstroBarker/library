abstract: We present the discovery of seven quasars at z>5.7, selected from ~2000
  deg2 of multicolor imaging data of the Sloan Digital Sky Survey. The new quasars
  have redshifts z from 5.79 to 6.13. Five are selected as part of a complete flux-limited
  sample in the SDSS northern Galactic cap; two have larger photometric errors and
  are not part of the complete sample. One of the new quasars, SDSS J1335+3533 (z=5.93),
  exhibits no emission lines; the 3 sigma limit on the rest-frame equivalent width
  of the Lyalpha+N V line is 5 {\AA}. It is the highest redshift lineless quasar known
  and could be a gravitational lensed galaxy, a BL Lac object, or a new type of quasar.
  Two new z>6 quasars, SDSS 1250+3130 (z=6.13) and SDSS J1137+3549 (z=6.01), show
  deep Gunn-Peterson absorption gaps in Lyalpha. These gaps are narrower than the
  complete Gunn-Peterson absorption troughs observed among quasars at z>6.2 and do
  not have complete Lybeta absorption.  Based on observations obtained with the Sloan
  Digital Sky Survey; the Apache Point Observatory's 3.5 m telescope, which is owned
  and operated by the Astrophysical Research Consortium; the MMT Observatory, a joint
  facility of the University of Arizona and the Smithsonian Institution; the University
  of Arizona's 2.3 m Bok Telescope; the Kitt Peak National Observatory's 4 m Mayall
  Telescope; the 6.5 m Walter Baade Telescope at the Las Campanas Observatory, a collaboration
  between the Observatories of the Carnegie Institution of Washington, the University
  of Arizona, Harvard University, the University of Michigan, and the Massachusetts
  Institute of Technology; and the W. M. Keck Observatory, which is operated as a
  scientific partnership among the California Institute of Technology, the University
  of California, and the National Aeronautics and Space Administration, and made possible
  by the generous financial support of the W. M. Keck Foundation.  This paper is dedicated
  to the memory of John N. Bahcall.
