abstract: We report on the results of a deep XMM-Newton observation of RBS 1774, the
  most recent dim isolated neutron star candidate found in the ROSAT archive data.
  Spectral and timing analysis of the high-quality pn and MOS data confirm the association
  of this source with an isolated neutron star. The spectrum is thermal and blackbody-like,
  and there is evidence at a significance level >4 sigma that the source is an X-ray
  pulsar with a spin period of 9.437 s. Spectral fitting reveals the presence of an
  absorption feature at ~0.7 keV, but at this level data do not have enough resolution
  to allow us to discriminate between an absorption line or an edge. We compare the
  newly measured properties of RBS 1774 with those of other known dim isolated neutron
  stars and discuss possible interpretations for the absorption feature.
