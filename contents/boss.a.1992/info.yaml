abstract: Two related numerical schemes for calculating the 3D collapse of protostellar
  clouds are defined, developed, and checked on a wide variety of test problems in
  spherical symmetry and multiple dimensions. One scheme is first-order accurate in
  time (code S), and the other second-order accurate in time (code ST). Through convergence
  testing, the codes are shown to be second-order accurate in spatial differences.
  Compared with the previous 3D code, the combination of reduced numerical dissipation
  through second-order accuracy and of removing the systematic bias toward central
  concentrations implies that the tendency for fragmentation into binary or multiple
  protostars should increase. A reinvestigation of fragmentation as a mechanism for
  forming binary stars is expected to yield an even more favorable evaluation.
