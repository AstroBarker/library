abstract: Multimessenger astronomy is arguably the branch of the astroparticle physics
  field that has seen the most significant developments in recent years. In this manuscript,
  we will review the state-of-the-art, the recent observations, and the prospects
  and challenges for the near future. We will give special emphasis to the observation
  carried out with neutrino telescopes.
