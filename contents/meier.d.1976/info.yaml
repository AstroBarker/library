abstract: The article describes the collapse and explosion of a rotating, magnetized,
  Fe-Ni stellar core as an essential process in the formation of supernovae and pulsars,
  and in nucleosynthesis. The sequence of events comprising the core collapse, MHD
  disruption of the core, and mass ejection is visualized. Conversion of gravitational
  energy to other forms (radial KE, rotational KE, magnetic energy) by the infall
  of the stellar core, poloidal circulation and differential rotation of the core
  material, amplification of the seed magnetic field, and violent expulsion of the
  ejecta when magnetic stresses become unmanageable are analyzed. MHD buoyancy instabilities
  and other MHD phenomena are related to data on the dynamics of supernovae, the chemical
  composition of the interstellar gas, and cosmic rays.
