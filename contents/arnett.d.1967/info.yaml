abstract: The mass dependence of the behavior of a stellar core undergoing gravitational  collapse
  is examined, 11si11gan improved equation of state and-improved  mean-free-path for
  energy transfer by neutrinos and anti-neutrinos. Energy  loss due to the escape
  of muon-type neutrinos is included. For a core mass of  2 solar masses, there is
  explosive mass ejection. A neutron-star remnant of  0.56 is left in the 2 solar
  mass case, while in the 4 solar mass case the  remnant mass is 2.46. Upon cooling,
  the latter remnant may not be able to  remain stable because of general relativistic
  effects. For core masses of 8  and 32, the models were too opaque to electron-type
  neutrinos to eject matter.  In both cases they cooled by copious muon-type neutrino
  emission (to which  they were transparent) and developed dense (> 1e15 g/cc)     central
  regions  in     which   general relativistic    effects became important. It appears
  that  highly evolved stars with core mass above 4 solar masses may not be able to  avoid
  the Schwarzschild singularity of general relativity.
