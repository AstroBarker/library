abstract: We performed a detailed analysis of the detectability of a wide range of         gravitational
  waves derived from core-collapse supernova         simulations using gravitational-wave
  detector noise scaled to         the sensitivity of the upcoming fourth and fifth
  observing runs         of the Advanced LIGO, Advanced Virgo, and KAGRA. We use the         coherent
  WaveBurst algorithm, which was used in the previous         observing runs to search
  for gravitational waves from core-         collapse supernovae. As coherent WaveBurst
  makes minimal         assumptions on the morphology of a gravitational-wave signal,
  it         can play an important role in the first detection of         gravitational
  waves from an event in the Milky Way. We predict         that signals from neutrino-driven
  explosions could be detected         up to an average distance of 10 kpc, and distances
  of over 100         kpc can be reached for explosions of rapidly-rotating progenitor         stars.
  An estimated minimum signal-to-noise ratio of 10-25 is         needed for the signals
  to be detected. We quantify the accuracy         of the waveforms reconstructed
  with coherent WaveBurst and we         determine that the most challenging signals
  to reconstruct are         those produced in long-duration neutrino-driven explosions,
  and         models that form black holes a few seconds after the core         bounce.
