abstract: We numerically studied the explosion of a supernova caused by supersonic
  jets present in its center. The jets are assumed to be generated by a magnetorotational
  mechanism when a stellar core collapses into a neutron star. We simulated the process
  of the jet propagation through the star, jet breakthrough, and the ejection of the
  supernova envelope by the lateral shocks generated during jet propagation. The end
  result of the interaction is a highly nonspherical supernova explosion with two
  high-velocity jets of material moving in polar directions and slower moving, oblate,
  highly distorted ejecta containing most of the supernova material. The jet-induced
  explosion is entirely due to the action of the jets on the surrounding star and
  does not depend on neutrino transport or reacceleration of a stalled shock. The
  jet mechanism can explain the observed high polarization of Types Ib, Ic, and IIsupernovae,
  pulsar kicks, very high velocity material observed in supernova remnants, indications
  that radioactive material was carried to the hydrogen-rich layers in SN 1987A, and
  other observations that are very difficult or impossible to explain by the neutrino
  energy deposition mechanism. The breakout of the jet from a compact, hydrogen-deficient
  core may account for the gamma-ray burst and radio outburst associated with SN 1998bw/GRB
  980425.
