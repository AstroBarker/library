abstract: 'We present numerical studies of three-dimensional magnetohydrodynamic (MHD)
  turbulence in a strongly magnetized medium in the extremely relativistic limit,
  in which the inertia of the charge carriers can be neglected. We have focused on
  strong Alfv{\''e}nic turbulence in the limit. We have found the following results.
  First, the energy spectrum is consistent with a Kolmogorov spectrum: E(k)~k-5/3,
  where k is the wavenumber. Second, turbulence shows a Goldreich-Sridhar type anisotropy:
  k\vert{}\vert{}~k2/3\perp{}, where k\vert{}\vert{} and k\perp{} are wavenumbers
  along and perpendicular to the local mean magnetic field directions, respectively.
  These scalings are in agreement with earlier theoretical predictions by Thompson
  \& Blaes.'
