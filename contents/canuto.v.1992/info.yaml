abstract: The Reynolds stress formalism is adopted to treat turbulent convection.
  This methodology is reviewed, and it is suggested that it may prove very useful
  to treat stellar and accretion disk turbulent convection, as well as in the construction
  of the subgrid models needed in large eddy simulations. A set of differential equations
  that yield the mean and turbulent quantities such as convective fluxes, turbulent
  viscosity, and turbulent conductivity is presented.
