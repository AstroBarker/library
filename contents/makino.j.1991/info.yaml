abstract: How the selection of the time-step criterion and the order of the integrator
  change the efficiency of Aarseth-type N-body integrators is discussed. An alternative
  to Aarseth's scheme based on the direct calculation of the time derivative of the
  force using the Hermite interpolation is compared to Aarseth's scheme, which uses
  the Newton interpolation to construct the predictor and corrector. How the number
  of particles in the system changes the behavior of integrators is examined. The
  Hermite scheme allows a time step twice as large as that for the standard Aarseth
  scheme for the same accuracy. The calculation cost of the Hermite scheme per time
  step is roughly twice as much as that of the standard Aarseth scheme. The optimal
  order of the integrators depends on both the particle number and the accuracy required.
  The time-step criterion of the standard Aarseth scheme is found to be inapplicable
  to higher-order integrators, and a more uniformly reliable criterion is proposed.
