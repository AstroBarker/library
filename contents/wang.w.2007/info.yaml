abstract: 'Aims:Gamma-ray line emission from radioactive decay of 60Fe provides constraints
  on nucleosynthesis in massive stars and supernovae. Methods: spectrometer SPI on
  board INTEGRAL has accumulated nearly three years of data on gamma-ray emission
  from the Galactic plane. We have analyzed these data with suitable instrumental-background
  models and sky distributions to produce high-resolution spectra of Galactic emission.
  Results: We detect the gamma-ray lines from 60Fe decay at 1173 and 1333 keV, obtaining
  an improvement over our earlier measurement of both lines with now 4.9sigma significance
  for the combination of the two lines. The average flux per line is (4.4 $\pm$ 0.9)
  \texttimes{} 10-5 ph cm-2 s-1 rad-1 for the inner Galaxy region. Deriving the Galactic
  26Al gamma-ray line flux with using the same set of observations and analysis method,
  we determine the flux ratio of 60Fe/26Al gamma-rays as 0.148 \$\pm\$ 0.06. Conclusions:
  The current theoretical predictions are consistent with our result. We discuss the
  implications of these results for the widely-held hypothesis that 60Fe is synthesized
  in core-collapse supernovae, and also for the closely-related question of the precise
  origin of 26Al in massive stars.'
