abstract: Neutrons induced by cosmic-ray muons are an important source of background
  for the new, huge underground detectors. Their characteristics (multiplicity and
  time distribution) are investigated by using the data recorded from December 1985
  to February 1988 using the 90-ton liquid scintillator detector of the Mont Blanc
  Laboratory. The experimental results on the mean number of neutrons produced by
  a muon per g/sq cm, being 385 GeV, are found to be in good agreement with an expected
  distribution given by the theoretical power law (mean Nn = mean Emu exp 0.75.
