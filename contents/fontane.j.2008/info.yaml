abstract: We perform a three-dimensional stability analysis of the KelvinHelmholtz
  mechanism are promoted by the underlying strain field and develop rapidly in the
  compression part of the braid. Originally analysed by Reinoud et al. (Phys. Fluids,
  vol. 12, 2000, p. 2489) from two-dimensional non-viscous numerical simulations,
  this instability is shown to substantially increase the mixing.
