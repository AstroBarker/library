abstract: The evolution of intermediate-mass stars at very low metallicity during
  their final thermal pulse asymptotic giant branch (AGB) phase is studied in detail.
  As representative examples, models with initial masses of 4 and 5Msolar and with
  a metallicity of Z=0.0001 ([Fe/H]~-2.3) are discussed. The one-dimensional stellar
  structure and evolution model includes time- and depth-dependent overshooting motivated
  by hydrodynamic simulations, as well as a full nuclear network and time-dependent
  mixing. Particular attention is given to high time and space resolution to avoid
  numerical artifacts related to third dredge-up and hot bottom burning predictions.
  The model calculations predict very efficient third dredge-up that mixes the envelope
  with the entire intershell layer or a large fraction thereof and in some cases penetrates
  into the C/O core below the He shell. In all cases primary oxygen is mixed into
  the envelope. The models predict efficient envelope burning during the interpulse
  phase. Depending on the envelope-burning temperature, oxygen is destroyed to varying
  degrees. The combined effect of dredge-up and envelope burning does not lead to
  any significant oxygen depletion in any of the cases considered in this study. The
  large dredge-up efficiency in our model is closely related to the particular properties
  of the H shell during the dredge-up phase in low-metallicity very metal-poor stars,
  which is followed here over many thermal pulses. During the dredge-up phase, the
  temperature just below the convective boundary is large enough for protons to burn
  vigorously when they are brought into the C-rich environment below the convection
  boundary by the time- and depth-dependent overshooting. H-burning luminosities of
  105 to ~2\texttimes{}106Lsolar are generated. C, and to lesser degree O, is transformed
  into N in this dredge-up overshooting layer and enters the envelope. The global
  effect on the CNO abundance is similar to that of hot bottom burning. If the overshoot
  efficiency is larger, then dredge-up H burning causes a further increase in the
  dredge-up efficiency. After some thermal pulses, the dredge-up proceeds through
  the He shell and into the CO core beneath. Then neutrons may not be released from
  13C in radiative conditions during the interpulse phase because of the scarcity
  of alpha-particles for the 13C(alpha,n)16O reactions. Conditions for the s-process
  are discussed qualitatively. The abundance evolution of H, He, C, N, O, and Na is
  described. Finally, the model predictions for sodium and oxygen are compared with
  observed abundances. The notion that massive AGB stars are the origin of the O-Na
  abundance anticorrelation in globular cluster giants is not consistent with the
  model predictions of this study. The abundance of the C-rich extremely metal-poor
  binaries LP 625-44, CS 29497-030, and HE 0024-2523 is discussed.
