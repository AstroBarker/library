abstract: The author presents the results of a new series of general relativistic
  stellar evolution calculations of the first 20 s in the lives of young neutron stars
  born in Type II supernovae. The model grid covers a wide range of masses and accretion
  rates. The focus of this study is on the brief, but impressive neutrino emissions
  from these protoneutron stars as they neutronize and cool. For each of these models,
  the theoretical neutrino burst signatures of SN 1987A in both the Kamiokande II
  and IMB water Cerenkov detectors are calculated and compared with observed data.
  It is concluded that the new neutron star in LMC has a baryon mass between 1.2 and
  1.7 M\_sun; and a best-fit gravitational mass between 1.3 and 1.5 M\_sun;. Simulations
  of stellar mass black hole formation by accretion onto protoneutron star intermediaries
  are also presented. The distinctive neutrino signature of such events is discussed.
