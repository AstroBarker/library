abstract: Numerical calculations are used to study the hydrodynamic evolution of a
  hot white dwarf with 1 solar mass accreting hydrogen-rich matter at rates between
  10 to the -8th and 10 to the -6th solar masses/yr. It is found that for accretion
  at a rate of about 10 to the -8th solar masses/yr, nova-type outbursts of long duration
  occur at intervals of about 1500 yr. About half of the accreted envelope is ejected
  during these outbursts. At a rate of about 10 to the -7th solar masses/yr, the star
  alternates between comparable periods at a high plateau luminosity and giant dimensions
  and periods at a low luminosity and white dwarf dimension. At 10 to the -6th solar
  masses/yr, equilibrium is achieved with a typical red giant luminosity supported
  by steady hydrogen burning. It is concluded that symbiotic novae are more likely
  to occur in detached systems involving wind accretors. Thus, the contribution of
  symbiotic stars to the frequency of type I supernovae is severely constrained.
