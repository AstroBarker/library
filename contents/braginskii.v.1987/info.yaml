abstract: 'Experimenters usually divide the gravitational waves which they hope to
  detect into three classes: "bursts" in which the wave field rises from zero, oscillates
  for only a few cycles and then returns to zero; "periodic waves", and "stochastic
  waves". There is, however, a fourth class, "bursts with memory" (BWM), in which
  the field rises from zero, oscillates for a few cycles, and then after a burst of
  duration Deltat settles down into a non-zero final value. Here the authors show
  that for any kind of detector the best way to search for a BWM is to integrate up
  the signal for an integration time tau \cong{} 1/fopt, where fopt is the frequency
  at which the detector has optimal amplitude sensitivity to ordinary bursts. It is
  possible, though not highly probable, that BWM will be among the earliest kinds
  of gravitational waves detected.'
