abstract: We present results from a 900 ks exposure of NGC 3783 with the High-Energy
  Transmission Grating Spectrometer on board the Chandra X-Ray Observatory. The resulting
  X-ray spectrum, which covers the 0.5-10 keV energy range, has the best combination
  of signal-to-noise ratio and resolution ever obtained for an AGN. This spectrum
  reveals absorption lines from H-like and He-like ions of N, O, Ne, Mg, Al, Si, and
  S. There are also possible absorption lines from H-like and He-like Ar and Ca as
  well as H-like C. We also identify inner-shell absorption from lower ionization
  ions such as Si VII-Si XII and S XII-S XIV. The iron absorption spectrum is very
  rich; L-shell lines of Fe XVII-Fe XXIV are detected, as well as probable resonance
  lines from Fe XXV. A strong complex of M-shell lines from iron ions is also detected
  in the spectrum. The absorption lines are blueshifted relative to the systemic velocity
  by a mean velocity of -590+/-150 km s-1. We resolve many of the absorption lines,
  and their mean FWHM is 820+/-280 km s-1. We do not find correlations between the
  velocity shifts or the FWHMs with the ionization potentials of the ions. Most absorption
  lines show asymmetry, having more extended blue wings than red wings. In O VII we
  have resolved this asymmetry to be from an additional absorption system at approximately
  -1300 km s-1. The two X-ray absorption systems are consistent in velocity shift
  and FWHM with the ones identified in the UV lines of C IV, N V, and H I. Equivalent
  width measurements for all absorption and emission lines are given and column densities
  are calculated for several ions. We resolve the narrow Fe Kalpha line at 6398.2+/-3.3
  eV to have an FWHM of 1720+/-360 km s-1, which suggests that this narrow line may
  be emitted from the outer part of the broad-line region or the inner part of the
  torus. We also detect a ``Compton shoulder'' redward of the narrow Fe Kalpha line,
  which indicates that it arises in cold, Compton-thick gas.
