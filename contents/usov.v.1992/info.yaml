abstract: A new model for gamma-ray bursts at cosmological distances is presented
  which is based on the formation of rapidly rotating neutron stars with surface magnetic
  fields of the order of 10 exp 15 G. Such objects could form by the gravitational
  collapse of accreting white dwarfs with anomalously high magnetic fields in binaries,
  as in magnetic cataclysmic binaries. Once formed, such rapidly rotating and strongly
  magnetized neutron stars would lose their rotational kinetic energy catastrophically,
  on a timescale of seconds or less. Rotation of the magnetic field creates a strong
  electric field and hence an electron-positron plasma which is shown here to be optically
  thick and in quasi-thermodynamic equilibrium. This plasma flows away from the neutron
  star at relativistic speeds, and X-ray and gamma-ray emission at the photosphere
  of this relativistic wind may then reproduce the observational characteristics of
  a gamma-ray burst.
