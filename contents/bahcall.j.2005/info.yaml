abstract: We show that standard solar models are in good agreement with the helioseismologically
  determined sound speed and density as a function of solar radius, the depth of the
  convective zone, and the surface helium abundance, as long as those models do not
  incorporate the most recent heavy-element abundance determinations. However, sophisticated
  new analyses of the solar atmosphere infer lower abundances of the lighter metals
  (like C, N, O, Ne, and Ar) than the previously widely used surface abundances. We
  show that solar models that include the lower heavy-element abundances disagree
  with the solar profiles of sound speed and density as well as the depth of the convective
  zone and the helium abundance. The disagreements for models with the new abundances
  range from factors of several to many times the quoted uncertainties in the helioseismological
  measurements. The disagreements are at temperatures that are too low to affect significantly
  solar neutrino emission. If errors in the calculated OPAL opacities are solely responsible
  for the disagreements, then the corrections in the opacity must extend from 2\texttimes{}106
  K (R=0.7 Rsolar) to 5\texttimes{}106 K (R=0.4 Rsolar), with opacity increases of
  the order of 10\%.
