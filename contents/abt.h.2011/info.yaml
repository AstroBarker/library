abstract: The Local Interstellar Bubble is an irregular region from 50 to 150 pc from
  the Sun in which the interstellar gas density is 10-2-10-3 of that outside the bubble
  and the interstellar temperature is 106 K. Evidently most of the gas was swept out
  by one or more supernovae. I explored the stellar contents and ages of the region
  from visual double stars, spectroscopic doubles, single stars, open clusters, emission
  regions, X-ray stars, planetary nebulae, and pulsars. The bubble has three sub-regions.
  The region toward the galactic center has stars as early as O9.5 V and with ages
  of 2-4 M yr. It also has a pulsar (PSRJ1856-3754) with a spin-down age of 3.76 Myr.
  That pulsar is likely to be the remnant of the supernova that drove away most of
  the gas. The central lobe has stars as early as B7 V and therefore an age of about
  160 Myr or less. The Pleiades lobe has stars as early as B3 and therefore an age
  of about 50 Myr. There are no obvious pulsars that resulted from the supernovae
  that cleared out those areas. As found previously by Welsh \& Lallement, the bubble
  has five B stars along its perimeter that show high-temperature ions of O VI and
  C II along their lines of sight, confirming its high interstellar temperature.
