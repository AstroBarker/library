abstract: We review the current status of general relativistic studies for the coalescence
  of black hole-neutron star (BH-NS) binaries. First, procedures for a solution of
  BH-NS binaries in quasi-equilibrium circular orbits and the numerical results, such
  as quasi-equilibrium sequence and mass-shedding limit, of the high-precision computation,
  are summarized. Then, the current status of numerical-relativity simulations for
  the merger of BH-NS binaries is described. We summarize our understanding for the
  merger and/or tidal disruption processes, the criterion for tidal disruption, the
  properties of the remnant formed after the tidal disruption, gravitational waveform,
  and gravitational-wave spectrum.
