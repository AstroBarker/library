abstract: We describe and discuss the properties of three numerical methods for solving
  the diffusion equation for the transport of the chemical species and of the angular
  momentum in stellar interiors. We study through numerical experiments both their
  accuracy and their ability to provide physical solutions. On the basis of new tests
  and analyses applied to the stellar astrophysical context, we show that the most
  robust method to follow the secular evolution is the implicit finite differences
  method. The importance of correctly estimating the diffusion coefficient between
  mesh points is emphasized and a procedure for estimating the average diffusion coefficient
  between a convective and a radiative zone is described.
