abstract: We present optical photometry for the type Ic SN 1994I in M51 (NGC 5194)
  from 1994 March 31 to August 6, UT starting eight days before B-band maximum and
  ending three months later. We estimate the extinction to SN 1994I was considerable
  and quite uncertain, A\_v\_= 1.4+/-0.5 mag, making a detailed comparison to other
  supernovae difficult. Using a distance modulus mu = 29.6+/-0.3 mag to M51, we calculate
  absolute magnitudes and a quasibolometric light curve for the supernova. It appears
  that SN 1994I was less luminous than "normal" type Ia SNe. There is strong evidence
  that the ejecta of SN 1994I were much less massive than those of other SNe.
