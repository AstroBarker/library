abstract: Photometric and spectroscopic observations of SN 1991bg, a very peculiar
  Type Ia supernova in the outskirts or the E1 galaxy NGC 4374 in the Virgo cluster,
  are reported. The spectra and light curves demonstrate that SN 1991bg is an intrinsically
  subluminous, photometrically and spectroscopically discrepant object. In some respects
  it is similar to the peculiar SNe Ia 1986G in Cen A and 1971I in NGC 5055. It is
  suggested that the observed properties of these mavericks are associated with a
  low mass in the ejecta.
