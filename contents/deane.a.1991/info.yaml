abstract: Chaotic Rayleigh-Benard convection over moderate Rayleigh numbers Ra is
  parametrically studied under highly idealized conditions. A detailed analysis of
  the weakly turbulent flow found at relatively low Re is performed, and the gross
  features such as Nusselt number and Reynolds number are found to possess scalings.
  The Karhunen-Loeve (K-L) decomposition is used to elucidate the physics of these
  complex flows in a quantitative manner. The structure of the empirical eigenfunctions
  is examined, revealing important apparent scaling with Ra. The number of parameters
  or dimensions needed to describe turbulent thermal convection is studied. It is
  shown that a fixed relation appears to hold between the K-L dimension and the Lyapunov
  dimension at low values of Ra. Numerical evidence is given that the Lyapunov exponents
  have a uniform density on average. Extensive numerical calculations for the flows
  and for their Lyapunov exponents over a range of Ra are presented.
