abstract: In this paper we present a full general relativistic one-dimensional hydrocode
  which incorporates a modern high-resolution shock-capturing algorithm, with an approximate
  Riemann solver, for the correct modeling of formation and propagation of strong
  shocks. The efficiency of this code in treating strong shocks is demonstrated by
  some numerical experiments. The use of this technique in several astrophysical scenarios
  is discussed.
