abstract: Neutron-induced reaction rates, including fission and neutron capture, are
  calculated in the temperature range 108 <= T(K) <= 1010 within the framework of
  the statistical model for targets with the atomic number 84 <= Z <= 118 (from Po
  to Uuo) from the neutron to the proton drip-line. Four sets of rates have been calculated,
  utilizing - where possible - consistent nuclear data for neutron separation energies
  and fission barriers from Thomas-Fermi (TF), Extended Thomas-Fermi plus Strutinsky
  Integral (ETFSI), Finite-Range Droplet Model (FRDM) and Hartree-Fock-Bogolyubov
  (HFB) predictions. Tables of calculated values as well as analytic seven parameter
  fits in the standard REACLIB format are supplied. We also discuss the sensitivity
  of the rates to the input, aiming at a better understanding of the variations introduced
  by the nuclear input.  Tables 3-18 with these data are only available in electronic
  form at the CDS via anonymous ftp to cdsarc.u-strasbg.fr (130.79.128.5) or via http://cdsweb.u-strasbg.fr/cgi-bin/qcat?J/A+A/513/A61
