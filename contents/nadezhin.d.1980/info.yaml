abstract: A stellar core becomes somewhat less massive due to neutrinos radiated away
  during its collapse in a neutron star or a black hole. The paper deals with the
  hydrodynamic motion of stellar envelope induced by such a mass loss. Depending on
  the structure of the outer stellar layers, the motion results either in ejection
  of an envelope with mass and energy proper for Nova outbursts; or nearly instantaneous
  excitation of strong pulsations of the star; or lastly in a slow slipping away of
  the whole stellar envelope. These phenomena are of importance when more powerful
  events, like supernova outbursts presumably associated with gravitational collapse,
  are absent. Such secondary indications of gravitational collapse are of special
  interest, since they may be a single observable manifestation (besides neutrinos
  and gravitational waves) of massive black hole formation.
