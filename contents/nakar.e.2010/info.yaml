abstract: The first light from a supernova (SN) emerges once the SN shock breaks out
  of the stellar surface. The first light, typically a UV or X-ray flash, is followed
  by a broken power-law decay of the luminosity generated by radiation that leaks
  out of the expanding gas sphere. Motivated by recent detection of emission from
  very early stages of several SNe, we revisit the theory of shock breakout and the
  following emission, paying special attention to the photon-gas coupling and deviations
  from thermal equilibrium. We derive simple analytic light curves of SNe from various
  progenitors at early times. We find that for more compact progenitors, white dwarfs,
  Wolf-Rayet stars (WRs), and possibly more energetic blue-supergiant explosions,
  the observed radiation is out of thermal equilibrium at the breakout, during the
  planar phase (i.e., before the expanding gas doubles its radius), and during the
  early spherical phase. Therefore, during these phases we predict significantly higher
  temperatures than previous analysis that assumed equilibrium. When thermal equilibrium
  prevails, we find the location of the thermalization depth and its temporal evolution.
  Our results are useful for interpretation of early SN light curves. Some examples
  are (1) red supergiant SNe have an early bright peak in optical and UV flux, less
  than an hour after breakout. It is followed by a minimum at the end of the planar
  phase (about 10 hr), before it peaks again once the temperature drops to the observed
  frequency range. In contrast, WRs show only the latter peak in optical and UV. (2)
  Bright X-ray flares are expected from all core-collapse SNe types. (3) The light
  curve and spectrum of the initial breakout pulse hold information on the explosion
  geometry and progenitor wind opacity. Its spectrum in more compact progenitors shows
  a (nonthermal) power law and its light curve may reveal both the breakout diffusion
  time and the progenitor radius.
