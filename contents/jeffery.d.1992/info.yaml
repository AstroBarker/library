abstract: This paper presents an LTE analysis of the photospheric epoch optical and
  IUE UV spectra of the recent Type Ia supernovae SN 1990N and SN 1991T. It is found
  that SN 1990N has matter moving as fast as 40,000 km/s, while SN 1991T has matter
  moving as fast as 20,000 km/s. The exponential density profile with e-folding velocity
  of 3160 km/s suggested by deflation and delayed/late-detonation explosion models
  is adequate for calculating fits to the observed spectra. Findings on the iron peak
  elements suggest that in both SNe some nuclear burning continues into the outer
  ejecta or the newly synthesized elements are mixed into the outer ejecta. The observed
  spectra of SN 1990N are consistent with a composition of the inner envelope like
  that of model W7. Intermediate-mass elements with abundances higher than solar are
  probably in the outer ejecta of both SNe, while silicon, sulfur, and calcium are
  underabundance in SN 1991T relative to SN 1990N by factors of order 3, 3, and 120,
  respectively.
