abstract: The spontaneous-emission branching fractions of 32 levels of Pr II were
  measured by the fast-ion-beam laser-induced-fluorescence technique. The levels studied
  had energies from ~21 500 to ~29 000 cm-1, and the decay branches detected were
  in the range from 250 to 850 nm. The experimental uncertainties are within 10\%.
  Using our previously measured radiative lifetimes, we determined the Einstein A
  coefficients and oscillator strengths for 260 transitions. The results are important
  for stellar elemental abundance determinations.
