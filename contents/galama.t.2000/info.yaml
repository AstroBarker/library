abstract: We present B-, V-, RC-, IC-, J-, H-, K-, and K'-band observations of the
  optical transient (OT) associated with GRB 970228, based on a reanalysis of previously
  used images and unpublished data. In order to minimize calibration differences,
  we have collected and analyzed most of the photometry and consistently determined
  the magnitude of the OT relative to a set of secondary field stars. We confirm our
  earlier finding that the early decay of the light curves (before 1997 March 6) was
  faster than that at intermediate times (between 1997 March 6 and April 7). At late
  times the light curves resume a fast decay (after 1997 April 7). The early-time
  observations of GRB 970228 are consistent with relativistic blast-wave models, but
  the intermediate- and late-time observations are hard to understand in this framework.
  The observations are well explained by an initial power-law decay with alpha=-1.51+/-0.06
  modified at later times by a Type Ic supernova light curve. Together with the evidence
  for GRB 980326 and GRB 980425, this gives further support for the idea that at least
  some gamma-ray bursts are associated with a possibly rare type of supernova.
