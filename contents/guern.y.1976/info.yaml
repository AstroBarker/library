abstract: The hyperfine structure of the 194.2 nm line of Hg II has been studied by
  Fabry-P{\'e}rot interferometry. The A-factors for the odd isotopes have been determined
  for the levels 2S1/2 and 2P1/2 and the shifts for the different isotopes in the
  natural mercury line have been measured.
