abstract: We present the spectral evolution, light curve, and corresponding interpretation
  for the ``normal-bright'' Type Ia supernova 2005cg discovered by ROTSE-IIIc. The
  host is a low-luminosity (Mr=-16.75) blue galaxy with strong indications of active
  star formation and an environment similar to that expected for SNe Ia at high redshifts.
  Early-time (t~-10 days) optical spectra obtained with the HET reveal an asymmetric,
  triangular-shaped Si II absorption feature at about 6100 {\AA} with a sharp transition
  to the continuum at a blueshift of about 24,000 km s-1. By 4 days before maximum,
  the Si II absorption feature becomes symmetric with smoothly curved sides. Similar
  Si II profile evolution has previously been observed in other supernovae and is
  predicted by some explosion models, but its significance has not been fully recognized.
  Although the spectra predicted by pure deflagration and delayed detonation models
  are similar near maximum light, they predict qualitatively different chemical abundances
  in the outer layers and thus give qualitatively different spectra at the earliest
  phases. The Si line observed in SN 2005cg at early times requires the presence of
  burning products at high velocities, and the triangular shape is likely to be formed
  in an extended region of slowly declining Si abundance that characterizes delayed
  detonation models. The spectra show a high-velocity Ca II IR feature that coincides
  in velocity space with the Si II cutoff. This supports the interpretation that the
  Ca II is formed when the outer layers of the SN ejecta sweep up about 5\texttimes{}10-3
  Msolar of material within the progenitor system. We compare our results with other
  ``Branch-normal'' SNe Ia with early-time spectra, namely, SN 2003du, 1999ee, and
  1994D. Although the expansion velocities based on their Si II absorption minima
  differ, all show triangular-shaped profiles and velocity cutoffs between 23,000
  and 25,000 km s-1, which are consistent with the Doppler shifts of their respective
  high-velocity Ca II IR features. SN 1990N-like objects, however, showed distinctly
  different behavior, which may suggest separate progenitor subclasses.  Based on
  observations obtained with the Hobby-Eberly Telescope, which is a joint project
  of the University of Texas at Austin, Pennsylvania State University, Stanford University,
  Ludwig-Maximilians-Universit{\"a}t M{\"u}nchen, and Georg-August-Universit{\"a}t
  G{\"o}ttingen.
