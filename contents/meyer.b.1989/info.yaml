abstract: The decompression of initially cold neutron star matter is studied with
  network calculations which mimic usual dynamical equilibrium r-process calculations
  and actually become dynamical r-process calculations at densities below neutron
  drip densities. The calculations are performed for decompression from an initial
  temperature of 0 K to densities below 4 X 10 to the 11th g/cu cm and temperatures
  of 10 to the 9th K. It is found that the decompressing material heats up in all
  cases to r-process-like temperatures by beta-decays of the neutron-rich nuclei.
  The use of the calculation results as input for continuation dynamical (n-lambda)
  equilibrium r-process calculations is discussed.
