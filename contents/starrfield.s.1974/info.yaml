abstract: Results of a computation of a variety of evolutionary sequences involving
  thermonuclear runaways in the hydrogen-rich envelopes of 1.00-solar-mass carbon-oxygen
  white dwarfs. The evidence concerning the location of the outburst in the nova system
  is reexamined, and it is concluded that the white dwarf is the seat of the outburst.
  An order-of-magnitude argument is presented which indicates that for a 1.00-solar-mass
  white dwarf it is impossible to achieve mass ejection without an energy generation
  of approximately 10 to the 16th ergs/g/sec. A description is given of models with
  low nuclear enhancements that do not produce an outburst, although their evolution
  has certain implications for the cause of the dwarf-nova outburst. The results for
  models that produced a nova outburst are then presented, and on the basis of these
  results it is found possible to explain continuous ejection, Kukarkin and Parenago's
  (1934) relationship, and other gross features of the nova phenomena.
