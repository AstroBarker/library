abstract: The Virgo detector has now finished its first science run; a science mode
  duty cycle of more than 80\% and a 4.5 Mpc horizon distance for binary neutron star
  inspiral sources were achieved. Commissioning breaks were organized during the run
  which permitted improvement of the sensitivity and the robustness of the interferometer
  against environmental perturbations like bad weather and earthquakes. The post-run
  commissioning phase has now started, with the goal of preparing the next upgrade
  step of the detector, Virgo+.
adsnote: Provided by the SAO/NASA Astrophysics Data System
