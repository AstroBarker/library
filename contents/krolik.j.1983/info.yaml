abstract: The problem of time-steady accretion of gas irradiated by a self-consistently
  generated quasar-like continuum is investigated. A controversy in the literature
  is resolved by a careful distinction between the existence of solutions and their
  stability. Specific criteria are found for when thermal instabilities may disrupt
  single-phase steady flow. As a function of initial temperature (1,000,000-100,000,000
  K), the boundaries of stable flow in the luminosity are determined relative to the
  Eddington (L/LE)-efficiency plane. The thermal and dynamical history of these steady
  flows is analyzed. The observational data that define quasars and type I Seyfert
  galaxies are matched to find values of efficiency and L/LE required for consistent
  spherically symmetric steady-flow models. The efficiency is constrained to be less
  than 1/100, and L/LE resides between several times 1/1000-1/100.
