abstract: The convective flow in the moments preceding the explosion of a Type Ia
  supernova determines where the initial flames that subsequently burn through the
  star first ignite. We continue our exploration of the final hours of this convection
  using the low Mach number hydrodynamics code, MAESTRO. We present calculations exploring
  the effects of slow rotation and show diagnostics that examine the distribution
  of likely ignition points. In the current calculations, we see a well-defined convection
  region persist up to the point of ignition, and we see that even a little rotation
  is enough to break the coherence of the convective flow seen in the radial velocity
  field. Our results suggest that off-center ignition may be favored, with ignition
  ranging out to a radius of 100 km and a maximum likelihood of ignition at a radius
  around 50 km.
