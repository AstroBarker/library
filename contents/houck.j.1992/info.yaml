abstract: The steady state structure and linear stability of spherical accretion flows
  onto compact objects are investigated over a wide range of accretion rates (ARs)
  for a variety of cooling functions as a function of the ratio of specific heats
  (gamma). Both radial and nonradial shock perturbations are considered. The flows
  become more extended as AR decreases. The cooling function has a significant effect
  on the extended structure of settling solutions with gamma = 5/3. In contrast, the
  extended structure of settling solutions with gamma = 4/3 is nearly independent
  of the form of the cooling function. For both gamma = 4.3 and gamma = 5.3, radial
  shock oscillation in the fundamental and first overtone modes are destabilized in
  spherically extended accretion envelopes. The application of these results to postsupernova
  neutron star accretion flows and to luminosity oscillations in AM Her objects are
  discussed.
