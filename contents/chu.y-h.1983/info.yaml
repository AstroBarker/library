abstract: Photographs for ten galactic ring nebulae associated with WR stars are presented,
  and references are given to published photographs for other such nebulae. Every
  WR ring nebula suggested in the literature is discussed and reevaluated. Fabry-Perot
  data have been obtained for two new nebulae in order to diagnose their formation
  mechanisms. Seven stellar wind-blown bubble type (W type), two stellar ejecta type,
  four shell-structured H II region type (Rs type), and two amorphous region type
  nebulae are acknowledged. Most W-type nebulae are associated with early-type WN
  stars, while most Rs-type nebulae surround WC stars. The implications of statistical
  results for these ring nebulae are discussed.
