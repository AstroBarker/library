abstract: LISA, the Laser Interferometer Space Antenna, will be launched by NASA and
  ESA in the 2014 timeframe and will be the first gravitational wave observatory for
  the many fascinating sources at low frequencies (down to 10-5 Hz). One of the challenges
  is to perform precision laser interferometry over a distance of 5 million km. This
  paper describes recent developments in the interferometer design.
