abstract: The exact expressions needed in the neutrino transport equations for scattering
  of all three flavors of neutrinos and antineutrinos off free protons and neutrons,
  and for electron neutrino absorption on neutrons and electron antineutrino absorption
  on protons, are derived under the assumption that nucleons are noninteracting particles.
  The standard approximations even with corrections for degeneracy, are found to be
  poor fits to the exact results. Improved approximations are constructed which are
  adequate for nondegenerate nucleons for neutrino energies from 1 to 160 MeV and
  temperatures from 1 to 50 MeV.
