abstract: Core convection and dynamo activity deep within rotating A-type stars of
  2 Msolar are studied with three-dimensional nonlinear simulations. Our modeling
  considers the inner 30\% by radius of such stars, thus capturing within a spherical
  domain the convective core and a modest portion of the surrounding radiative envelope.
  The magnetohydrodynamic (MHD) equations are solved using the anelastic spherical
  harmonic (ASH) code to examine turbulent flows and magnetic fields, both of which
  exhibit intricate time dependence. By introducing small seed magnetic fields into
  our progenitor hydrodynamic models rotating at 1 and 4 times the solar rate, we
  assess here how the vigorous convection can amplify those fields and sustain them
  against ohmic decay. Dynamo action is indeed realized, ultimately yielding magnetic
  fields that possess energy densities comparable to that of the flows. Such magnetism
  reduces the differential rotation obtained in the progenitors, partly by Maxwell
  stresses that transport angular momentum poleward and oppose the Reynolds stresses
  in the latitudinal balance. In contrast, in the radial direction we find that the
  Maxwell and Reynolds stresses may act together to transport angular momentum. The
  central columns of slow rotation established in the progenitors are weakened, with
  the differential rotation waxing and waning in strength as the simulations evolve.
  We assess the morphology of the flows and magnetic fields, their complex temporal
  variations, and the manner in which dynamo action is sustained. Differential rotation
  and helical convection are both found to play roles in giving rise to the magnetic
  fields. The magnetism is dominated by strong fluctuating fields throughout the core,
  with the axisymmetric (mean) fields there relatively weak. The fluctuating magnetic
  fields decrease rapidly with radius in the region of overshooting, and the mean
  toroidal fields less so due to stretching by rotational shear.
