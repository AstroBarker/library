abstract: The last years have witnessed a rapid development of three-dimensional models
  of type Ia supernova explosions. The next step is to evaluate these models varying
  the initial parameters and to compare them with observations. To calculate synthetic
  lightcurves and spectra from numerical models, it is mandatory to follow the evolution
  up to homologous expansion. We report on methods to achieve this in our current
  implementation of multi-dimensional type Ia supernova explosion models. The novel
  scheme is thoroughly tested  in two dimensions and a simple example of a three-dimensional  simulation
  is presented. We discuss to what degree the  assumption of homologous expansion
  is justified in these models.
