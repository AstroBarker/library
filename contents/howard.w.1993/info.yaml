abstract: The high-entropy alpha-rich freeze-out of neutron-rich nuclei suggested
  by Woosley and Hoffman and the subsequent formation of r-nuclides are studied in
  the framework of a recent supernova model. The calculations are performed with the
  help of a single reaction network that is able to describe the establishment of
  the nuclear statistical equilibrium, the charged-particle reaction freeze-out, and
  the subsequent neutron captures and beta-decays that produce the r-nuclides. We
  analyze the effect of using various models for the nuclear binding energies, and
  in particular the new Extended Thomas-Fermi plus Strutinsky Integral method and
  the finite-range droplet model. These nuclear mass models are also used to calculate
  the beta-decay rates with the gross theory. We delineate the range of entropies
  necessary to produce a solar-system-like distribution of the r-nuclides. We also
  discuss in detail how the freeze-out affects the final r-process abundance distribution.
