abstract: A fully implicit two-dimensional hydrodynamic and hydrostatic code has been
  developed for studying stellar evolution with arbitrary rotation laws. The technique,
  a simultaneous linearization of the two-dimensional corservation laws and all the
  boundary conditions, is described in detail. Several evolutionary sequences with
  uniform and nonuniform rotation are evolved through core hydrogen burning. For uniform
  rotation, the main-sequence models are compared with those of another code obtained
  under nearly identical conditions. The method appears to be robust and shows promise
  of being able to deal with the determination of the evolution of the rotation law
  during the course of the stellar evolution.
