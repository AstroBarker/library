abstract: With the aim of improving our knowledge about the nature of the         progenitors
  of low-luminosity Type II plateau supernovae (LL SNe         IIP), we made radiation-hydrodynamical
  models of the well-         sampled LL SNe IIP 2003Z, 2008bk and 2009md. For these
  three         SNe, we infer explosion energies of 0.16-0.18 foe, radii at         explosion
  of 1.8-3.5 {\texttimes} {}10$^{13}$ cm and ejected         masses of 10-11.3 M\$\_{{\ensuremath{\odot}}}\$.
  The estimated         progenitor mass on the main sequence is in the range         {\ensuremath{\sim}}13.2-15.1
  M\$\_{{\ensuremath{\odot}}}\$ for SN         2003Z and {\ensuremath{\sim}}11.4-12.9         M\$\_{{\ensuremath{\odot}}}\$
  for SNe 2008bk and 2009md, in         agreement with estimates from observations
  of the progenitors.         These results together with those for other LL SNe IIP
  modelled         in the same way enable us also to conduct a comparative study on         this
  SN sub-group. The results suggest that (a) the progenitors         of faint SNe
  IIP are slightly less massive and have less         energetic explosions than those
  of intermediate-luminosity SNe         IIP; (b) both faint and intermediate-luminosity
  SNe IIP         originate from low-energy explosions of red (or yellow)         supergiant
  stars of low to intermediate mass; (c) some faint         objects may also be explained
  as electron-capture SNe from         massive super-asymptotic giant branch stars;
  and (d) LL SNe IIP         form the underluminous tail of the SNe IIP family, where
  the         main parameter `guiding' the distribution seems to be the ratio         of
  the total explosion energy to the ejected mass. Further         hydrodynamical studies
  should be performed and compared to a         more extended sample of LL SNe IIP
  before drawing any conclusion         on the relevance of fall-back to this class
  of events.
