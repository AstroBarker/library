abstract: In a companion paper we studied the detailed evolution of stellar collision
  products that occurred in an N-body simulation of the old open cluster M 67 and
  compared our detailed models to simple prescriptions. In this paper we extend this
  work by studying the evolution of the collision products in open clusters as a function
  of mass and age of the progenitor stars. We calculated a grid of head-on collisions
  covering the section of parameter space relevant for collisions in open clusters.
  We create detailed models of the merger remnants using an entropy-sorting algorithm
  and follow their subsequent evolution during the initial contraction phase, through
  the main sequence and up to the giant branch with our detailed stellar evolution
  code. We compare the location of our models in a colour-magnitude diagram to the
  observed blue straggler population of the old open clusters M 67 and NGC 188 and
  find that they cover the observed blue straggler region of both clusters. For M
  67, collisions need to have taken place recently. Differences between the evolution
  tracks of the collision products and normal main sequence stars can be understood
  quantitatively using a simple analytic model. We present an analytic recipe that
  can be used in an N-body code to transform a precomputed evolution track for a normal
  star into an evolution track for a collision product.  Tables 4 and 5 are only available
  in electronic form at http://www.aanda.org
