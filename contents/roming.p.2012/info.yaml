abstract: We present very early UV to optical photometric and spectroscopic observations
  of the peculiar Type IIn supernova (SN) 2011ht in UGC 5460. The UV observations
  of the rise to peak are only the second ever recorded for a Type IIn SN and are
  by far the most complete. The SN, first classified as an SN impostor, slowly rose
  to a peak of MV ~ -17 in ~55 days. In contrast to the ~2 mag increase in the v-band
  light curve from the first observation until peak, the UV flux increased by >7 mag.
  The optical spectra are dominated by strong, Balmer emission with narrow peaks (FWHM
  ~ 600 km s-1), very broad asymmetric wings (FWHM ~ 4200 km s-1), and blueshifted
  absorption (~300 km s-1) superposed on a strong blue continuum. The UV spectra are
  dominated by Fe II, Mg II, Si II, and Si III absorption lines broadened by ~1500
  km s-1. Merged X-ray observations reveal a L 0.2-10 = (1.0 $\pm$ 0.2) \texttimes{}
  1039 erg s-1. Some properties of SN 2011ht are similar to SN impostors, while others
  are comparable to Type IIn SNe. Early spectra showed features typical of luminous
  blue variables at maximum and during giant eruptions. However, the broad emission
  profiles coupled with the strong UV flux have not been observed in previous SN impostors.
  The absolute magnitude and energetics (~2.5 \texttimes{} 1049 erg in the first 112
  days) are reminiscent of normal Type IIn SN, but the spectra are of a dense wind.
  We suggest that the mechanism for creating this unusual profile could be a shock
  interacting with a shell of material that was ejected a year before the discovery
  of the SN.  This paper is dedicated to our colleague, Weidong Li, who died on 2011
  December 12. His contribution to the study of all types of SNe was tremendous.
