abstract: The recently discovered Type II supernova in the LMC is interpreted as the
  explosion of a massive star having a helium core mass about six solar masses. This
  corresponds to a main-sequence star of approximately 20 solar masses, although mass
  loss might have significantly reduced this value. Theoretical UBV light curves are
  presented, and the expected fluxes of gamma-ray lines from Co-56, Co-57, and Ti-44
  are estimated. The necessity of a compact progenitor is emphasized.
