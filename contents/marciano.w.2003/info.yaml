abstract: Standard model predictions for neutrino-electron scattering cross-sections,
  including effects of electroweak radiative corrections, are reviewed. The sensitivity
  of these quantities to neutrino dipole moments, Z' bosons and dynamical symmetry
  breaking is described. Neutrino indices of refraction in matter are also discussed.
  A perspective on future initiatives with intense neutrino sources, such as from
  stopped pion decays at a neutron spallation source, superbeams or neutrino factories,
  is given.  This manuscript has been authored under contract number DE-AC02-98CH10886
  with the US Department of Energy. Accordingly, the US Government retains a non-exclusive,
