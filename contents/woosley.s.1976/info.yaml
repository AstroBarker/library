abstract: It is proposed that gamma-ray bursts originate from carbon detonations initiated
  by the accretion of matter on to the surface of a neutron star. The observations
  are interpreted in terms of this theory. Possible implications for the nuclear-powered
  model if giant X-ray pulses are discussed briefly.
