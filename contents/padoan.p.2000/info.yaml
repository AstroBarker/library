abstract: We present calculations of frictional heating by ion-neutral drift in three-dimensional
  simulations of turbulent, magnetized molecular clouds. We show that ambipolar drift
  heating is a strong function of position in a turbulent cloud, and its average value
  can be significantly larger than the average cosmic-ray heating rate. The heating
  rate per unit volume due to ambipolar drift, HAD=\vert{}JXB\vert{}2/rhoinuin~ B4/(16pi2L2Brhoi
  nuin), is found to depend on the rms Alfv{\'e}nic Mach number, MA, and on the average
  field strength, as HAD~M2A<\vert{}B\vert{}>4. This implies that the typical scale
  of variation of the magnetic field, LB, is inversely proportional to MA, which we
  also demonstrate.
