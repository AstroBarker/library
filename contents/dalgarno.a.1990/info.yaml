abstract: The formation of CO(+) and CO in the expanding metal-rich ejecta of SN 1987A
  has been discussed by Lepp et al. (1988) and by Petuchowski et al. (1989), who concluded
  that it probably proceeded through the radiative association of C(+) and O to form
  CO(+) by the reactions (1) C(+) + O - CO(+) + hnu, followed by charge transfer of
  CO(+) with O, (2) CO(+) + O - CO + O(+), and by the radiative association of C and
  O to form CO, (3) C + O - CO + hnu. Petuchowski et al. estimated the rate coefficients
  of reactions (1) and (3) and concluded that the sequence of (1) and (2) constitutes
  the major source of CO. An alternative calculation of the rate coefficients is made
  here that indicates that reaction (3) is probably more important.
