abstract: Radiative lifetimes of three odd-parity levels of neutral gold (Au I) and
  one odd-parity level of singly ionized gold (Au II), measured using the time-resolved
  laser-induced fluorescence technique, have allowed the testing of the reliability
  of a relativistic Hartree-Fock model of the atomic structure taking configuration
  interaction and core-polarization effects into account. The importance of the inclusion
  of the latter effects in the calculations is emphasized. The laser-induced fluorescence
  lifetimes, combined with the theoretical branching fractions, have allowed us to
  deduce oscillator strengths for six 5d96s2-5d96s6p and 5d106s-5d96s6p transitions
  of Au I and for sixty-three 5d96s-5d96p, 5d96p-5d97s and 5d10-5d96p UV transitions
  of Au II.
