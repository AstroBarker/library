abstract: This book is the result of an attempt, over the past few years, to gather
  the basic tools required to do research on radiating flows in astrophysics. The
  microphysics of gases is discussed, taking into account the equation of state of
  a perfect gas, the first and second law of thermodynamics, the thermal properties
  of a perfect gas, the distribution function and Boltzmann's equation, the collision
  integral, the Maxwellian velocity distribution, Boltzmann's H-theorem, the time
  of relaxation, and aspects of classical statistical mechanics. Other subjects explored
  are related to the dynamics of ideal fluids, the dynamics of viscous and heat-conducting
  fluids, relativistic fluid flow, waves, shocks, winds, radiation and radiative transfer,
  the equations of radiation hydrodynamics, and radiating flows. Attention is given
  to small-amplitude disturbances, nonlinear flows, the interaction of radiation and
  matter, the solution of the transfer equation, acoustic waves, acoustic-gravity
  waves, basic concepts of special relativity, and equations of motion and energy.
