abstract: We present optical spectroscopy and optical/near-IR photometry of 31 host
  galaxies of hydrogen-poor superluminous supernovae (SLSNe), including 15 events
  from the Pan-STARRS1 Medium Deep Survey. Our sample spans the redshift range 0.1
  <~ z <~ 1.6, and is the first comprehensive host galaxy study of this specific subclass
  of cosmic explosions. Combining the multi-band photometry and emission-line measurements,
  we determine the luminosities, stellar masses, star formation rates, and metallicities.
  We find that, as a whole, the hosts of SLSNe are a low-luminosity (langMB rang \approx{}
  -17.3 mag), low stellar mass (langM \textasteriskcenteredrang \approx{} 2 \texttimes{}
  108 M \&sun;) population, with a high median specific star formation rate (langsSFRrang
  \approx{} 2 Gyr-1). The median metallicity of our spectroscopic sample is low, 12
  + log (O/H) \approx{} 8.35 \approx{} 0.45 Z \&sun;, although at least one host galaxy
  has solar metallicity. The host galaxies of H-poor SLSNe are statistically distinct
  from the hosts of GOODS core-collapse SNe (which cover a similar redshift range),
  but resemble the host galaxies of long-duration gamma-ray bursts (LGRBs) in terms
  of stellar mass, SFR, sSFR, and metallicity. This result indicates that the environmental
  causes leading to massive stars forming either SLSNe or LGRBs are similar, and in
  particular that SLSNe are more effectively formed in low metallicity environments.
  We speculate that the key ingredient is large core angular momentum, leading to
  a rapidly spinning magnetar in SLSNe and an accreting black hole in LGRBs.
