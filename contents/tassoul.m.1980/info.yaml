abstract: The problem of linear nonradial oscillations in stars is reconsidered using
  sound asymptotic expansions. High-order p- and g-modes are investigated. In the
  case of g-modes, the possibility of resonance occurs when the model possesses more
  than one zone in which spatial oscillations may occur.
