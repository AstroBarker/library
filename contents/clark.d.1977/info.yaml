abstract: Attention is given to a proposal made by McCrea (1975) that the encounter
  of the solar system with a dense cloud of interstellar material during its passage
  through a spiral arm of the Galaxy may produce such climatic catastrophes on earth
  as the ice epochs. Certain difficulties concerning McCrea's proposal in connection
  with the required cloud density are pointed out and an alternative hypothesis is
  presented. This hypothesis retains McCrea's association with the passage of the
  solar system through a spiral arm. However, the initiation of an ice epoch, plus
  biological catastrophes are related to an encounter of the solar system with a nearby
  supernova outburst rather than a superdense interstellar cloud.
