abstract: Lifetimes have been measured using time-resolved laser-induced fluorescence
  for 16 odd levels in the doublet, quartet and sextet systems of Mo II, with energies
  in the range 48 000-61 000 cm-1. Absolute transition probabilities and oscillator
  strengths are determined for 110 UV and visible transitions (208 < lambda < 485
  nm) from a combination of experimental lifetimes and theoretical branching fractions.
  The theoretical results are obtained using the HFR method including core polarization
  effects.
