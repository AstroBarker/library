abstract: 'There were several errors in Tables 1, and 3. The corrections are as follows:
  1. In Tables 2 and 3, the 10\% error in uncertainty of the calculated level lifetime
  of R. Kurucz was not included in the value for the uncertainty of A, the transition
  probability. The tables have been corrected adding this 10\% error in quadrature
  to the uncertainty in A. 2. The line identifications in this paper were taken from
  the work of Zapadlik et al. (2000). The authors made an error in taking these identifications
  from Zapadlik et al. for the level at 32767 cm-1, resulting in errors in calculation
  of branching fractions for this level. These have now been corrected in Table 1.
  3. The comparison values of Bizzarri et al. (1993) had been omitted in some cases
  in Tables 1, 2, and 3. These have now been included. Tables 1, 2, and 3 are published
  in their entirety in the electronic version of the Astrophysical Journal Supplement.'
