abstract: 'Interstellar gas may be in a variety of thermal phases, depending on how
  it is heated and ionized; here a unified picture of the equation of state of interstellar
  and quasar gas is presented for a variety of such mechanisms over a broad range
  of temperatures, densities, and column densities of absorbing matter. It is found
  that for select ranges of gas pressure, photoionizing flux, and heating, three thermally
  stable phases are allowed: coronal gas (T above 100,000 K); warm gas (T about 10,000
  K); and cold gas (T less than 100 K). With attenuation of ultraviolet and X-ray
  radiation, the cold phase may undergo a transition to molecules. In quasar broad-line
  clouds, this transition occurs at column density N(H) = about 10 to the 23rd/sq
  cm and could result in warm molecular cores and observable emission from H2 and
  OH. The underlying atomic physics behind each of these phase transitions and their
  relevance to interstellar matter and quasars are discussed.'
