abstract: We study the importance of baryonic physics on predictions of the matter
  power spectrum as it is relevant for forthcoming weak-lensing surveys. We quantify
  the impact of baryonic physics using a set of cosmological numerical simulations.
  Each simulation has the same initial density field, but models a different set of
  physical processes. We find that baryonic processes significantly alter predictions
  for the matter power spectrum relative to models that include only gravitational
  interactions. Our results imply that future weak-lensing experiments such as LSST
  and SNAP will likely be sensitive to the uncertain physics governing the nonlinear
  evolution of the baryonic component of the universe if these experiments are primarily
  limited by statistical uncertainties. In particular, this effect could be important
  for forecasts of the constraining power of future surveys if information from scales
  l >~ 1000 is included in the analysis. We find that deviations are caused primarily
  by the rearrangement of matter within individual dark matter halos relative to the
  gravity-only case, rather than a large-scale rearrangement of matter. Consequently,
  we propose a simple model, based on the phenomenological halo model of dark matter
  clustering, for baryonic effects that can be used to aid in the interpretation of
  forthcoming weak-lensing data.
