abstract: 'Aims:We present an empirical model of type Ia supernovae spectro-photometric
  evolution with time.  Methods: The model is built using a large data set including
  light-curves and spectra of both nearby and distant supernovae, the latter being
  observed by the SNLS collaboration. We derive the average spectral sequence of type
  Ia supernovae and their main variability components including a color variation
  law. The model allows us to measure distance moduli in the spectral range 2500-8000
  {\AA} with calculable uncertainties, including those arising from variability of
  spectral features.  Results: Thanks to the use of high-redshift SNe to model the
  rest-frame UV spectral energy distribution, we are able to derive improved distance
  estimates for SNe Ia in the redshift range 0.8<z<1.1. The model can also be used
  to improve spectroscopic identification algorithms, and derive photometric redshifts
  of distant type Ia supernovae.  Based on observations obtained with MegaPrime/MegaCam,
  a joint project of CFHT and CEA/DAPNIA, at the Canada-France-Hawaii Telescope (CFHT)
  which is operated by the National Research Council (NRC) of Canada, the Institut
  National des Sciences de l''Univers of the Centre National de la Recherche Scientifique
  (CNRS) of France, and the University of Hawaii. This work is based in part on data
  products produced at the Canadian Astronomy Data Centre as part of the Canada-France-Hawaii
  Telescope Legacy Survey, a collaborative project of NRC and CNRS. Based on observations
  obtained at the European Southern Observatory using the Very Large Telescope on
  the Cerro Paranal (ESO Large Programme 171.A-0486). Based on observations (programs
  GN-2004A-Q-19, GS-2004A-Q-11, GN-2003B-Q-9, and GS-2003B-Q-8) obtained at the Gemini
  Observatory, which is operated by the Association of Universities for Research in
  Astronomy, Inc., under a cooperative agreement with the NSF on behalf of the Gemini
  partnership: the National Science Foundation (United States), the Particle Physics
  and Astronomy Research Council (UK), the National Research Council (Canada), CONICYT
  (Chile), the Australian Research Council (Australia), CNPq (Brazil) and CONICET
  (Argentina). Table 2 is only available in electronic form at http://www.aanda.org'
