abstract: 'One-point statistics of velocity gradients and Eulerian and Lagrangian
  accelerations are studied by analysing the data from high-resolution direct numerical
  simulations (DNS) of turbulence in a periodic box, with up to 40963 grid points.
  The DNS consist of two series of runs; one is with kmax ~ 2 (Series 2), where kmax
  is the maximum wavenumber and  in Series 1 is about 1130, and it is about 675 in
  Series 2. Particular attention is paid to the possible Reynolds number (Re) dependence
  of the statistics. The visualization of the intense vorticity regions shows that
  the turbulence field at high Re consists of clusters of small intense vorticity
  regions, and their structure is to be distinguished from those of small eddies.
  The possible dependence on Re of the probability distribution functions of velocity
  gradients is analysed through the dependence on R dependence of S and F of the longitudinal
  velocity gradients fit well with a simple power law: S ~ 0.11 and F ~ 1.14R similarly
  to each other at R < 100. Regarding the statistics of time derivatives, the second-order
  time derivatives of turbulent velocities are more intermittent than the first-order
  ones for both the Eulerian and Lagrangian velocities, and the Lagrangian time derivatives
  of turbulent velocities are more intermittent than the Eulerian time derivatives,
  as would be expected. The flatness factor of the Lagrangian acceleration is as large
  as 90 at R 430. The flatness factors of the Eulerian and Lagrangian accelerations
  increase with RE L E L \approx{} 3.0.'
