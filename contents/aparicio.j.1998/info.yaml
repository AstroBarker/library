abstract: We present a simple method for the calculation of generalized Fermi functions.
  It is based on a straight integration using quadratures, with an adequate interval
  subdivision and variable choice. The result is a fast and accurate algorithm, which
  is compared with other existing methods in accuracy, versatility, and speed.
