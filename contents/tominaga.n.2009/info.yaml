abstract: Jet-induced supernovae (SNe) have been suggested to occur in gamma-ray bursts
  and highly-energetic SNe (hypernovae). I investigate hydrodynamical and nucleosynthetic
  properties of the jet-induced explosion of a population III 40 M sun star with a
  two-dimensional special relativistic hydrodynamical code. The abundance distribution
  after the explosion and the angular dependence of the yield are obtained for the
  models with high and low energy deposition rates \dot{E}\_dep=120\texttimes{}10^{51}
  erg s-1 and 1.5 \texttimes{} 1051 erg s-1, respectively. The ejection of Fe-peak
  products and the fallback of unprocessed materials in the jet-induced SNe account
  for the abundance patterns of the extremely metal-poor stars. It is also found that
  the peculiar abundance pattern of a Si-deficient metal-poor star HE 1424-0241 is
  reproduced by the angle-delimited yield for theta = 30$\,^{\circ}$-35\$\,^{\circ}\$
  of the model with \dot{E}\_dep = 120\texttimes{}10^{51} erg s-1. Furthermore, I
  compare the yield of the jet-induced explosion with that of the spherical explosion
  and confirm the ejection and fallback in the jet-induced explosion is almost equivalent
  to the "mixing-fallback" in spherical explosions. In contrast to the spherical models,
  however, the high-entropy environment is realized in the jet-induced explosion and
  thus [(Sc, Ti, V, Cr, Co, Zn)/Fe] are enhanced. The enhancements of [Sc/Fe] and
  [Ti/Fe] improve agreements with the abundance patterns of the extremely metal-poor
  stars.
