abstract: In the present paper, the neutrino opacity of neutron stars from the charged-current
  and the neutral-current processes is calculated. For temperatures of a few MeV,
  the mean free path of even zero-energy neutrinos is found to be smaller than the
  radius of a neutron star. The mean opacity appropriate to the diffusion limit of
  the Boltzmann equation is calculated, and the characteristic cooling time for a
  hot (10 MeV) neutron star is found to be about 1 min.
