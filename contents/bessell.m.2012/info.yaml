abstract: We have calculated improved photonic passbands for the UBVRI, Hipparcos
  Hp, and Tycho BT and VT standard systems using the extensive spectrophotometric
  libraries of NGSL and MILES. Using the Hp passband, we adjusted the absolute flux
  levels of stars in the spectrophotometric libraries so that their synthetic Hp magnitudes
  matched the precise Hipparcos Catalogue value. Synthetic photometry based on the
  renormalized fluxes was compared with the standard UBVRI, BT and VT magnitudes,
  and revised synthetic zero points were determined. The Hipparcos and Tycho photometry
  system zero points were also compared with the V-magnitude zero points of the SAAO
  UBVRI system, the homogenized UBV system, and the Walraven VB system. The confusion
  in the literature concerning broadband magnitudes, fluxes, passbands, and the choice
  of appropriate mean wavelengths is detailed and discussed in the Appendix.
