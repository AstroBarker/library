abstract: We propose magnetic proto-neutron star (PNS) winds driven by Alfv{\'e}n
  waves, as well as the neutrino heating, as an appropriate site for r-process nucleosynthesis.
  Alfv{\'e}n waves excited by surface motions of a PNS propagate outwardly, and they
  heat and accelerate the wind by dissipation. Compared with the wind purely driven
  by neutrino heating, a larger entropy per baryon and shorter dynamical timescale
  are achieved, which favors the r-process. We study reasonable cases in which the
  wave amplitude is 10\% of the Alfv{\'e}n speed at the surface to find that a PNS
  with surface field strength >~5\texttimes{}1014 G gives suitable wind properties
  for the r-process, provided that the dissipation length of the wave is at most ~10
  times the PNS radius. We also compare properties of transcritical and subcritical
  winds in light of the r-process. We finally discuss possibilities of detections
  of gamma-rays from radioactive nuclei and absorption lines due to Ba in supernova
  remnants that possess magnetars.
