abstract: The steady-state distribution of stars around a massive black hole in a
  globular cluster is determined by solving numerically the coupled time-dependent
  Boltzmann equations for a system containing stars of two different masses. Similar
  results are found for an arbitrary spectrum of masses with the aid of approximate
  analytic solutions of the time-independent equations. The effects of mass segregation
  are summarized by scaling laws that are derived both by analytic approximations
  and by numerical solutions. The detectability of a black hole in a globular cluster
  is discussed in terms of possible observations of the central star distributions.
