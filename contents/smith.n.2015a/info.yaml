abstract: The supernova (SN) PTF11iqb was initially classified as a Type IIn event
  caught very early after explosion. It showed narrow Wolf-Rayet (WR) spectral features
  on day 2 (as in SN 1998S and SN 2013cu), but the narrow emission weakened quickly
  and the spectrum morphed to resemble Types II-L and II-P. At late times, Halpha
  exhibited a complex, multipeaked profile reminiscent of SN 1998S. In terms of spectroscopic
  evolution, we find that PTF11iqb was a near twin of SN 1998S, although with somewhat
  weaker interaction with circumstellar material (CSM) at early times, and stronger
  interaction at late times. We interpret the spectral changes as caused by early
  interaction with asymmetric CSM that is quickly (by day 20) enveloped by the expanding
  SN ejecta photosphere, but then revealed again after the end of the plateau when
  the photosphere recedes. The light curve can be matched with a simple model for
  CSM interaction (with a mass-loss rate of roughly 10-4 M\&sun; yr-1) added to the
  light curve of a normal SN II-P. The underlying plateau requires a progenitor with
  an extended hydrogen envelope like a red supergiant at the moment of explosion,
  consistent with the slow wind speed (<80 km s-1) inferred from narrow Halpha emission.
  The cool supergiant progenitor is significant because PTF11iqb showed WR features
  in its early spectrum - meaning that the presence of such WR features does not necessarily
  indicate a WR-like progenitor. Overall, PTF11iqb bridges SNe IIn with weaker pre-SN
  mass-loss seen in SNe II-L and II-P, implying a continuum between these types.
