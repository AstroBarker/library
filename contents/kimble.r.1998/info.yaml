abstract: The Space Telescope Imaging Spectrograph (STIS) was successfully installed
  into the Hubble Space Telescope (HST) in 1997 February, during the second HST servicing
  mission, STS-82. STIS is a versatile spectrograph, covering the 115-1000 nm wavelength
  range in a variety of spectroscopic and imaging modes that take advantage of the
  angular resolution, unobstructed wavelength coverage, and dark sky offered by the
  HST. In the months since launch, a number of performance tests and calibrations
  have been carried out and are continuing. These tests demonstrate that the instrument
  is performing very well. We present here a synopsis of the results to date.
