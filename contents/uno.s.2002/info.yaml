abstract: 'ASCA observations of the supernova in M81, SN 1993J, 8-572 days after the
  explosion are presented. Utilizing a one-dimensional image-fitting to the Solid-State
  Imaging Spectrometer (SIS) data, energy spectra of the supernova in 0.5-8 keV are
  obtained. The spectrum showed drastic softening with a power-law photon index of
  0.3-4, while the X-ray intensity decreased from 0.03 to 0.008 counts s-1 SIS-1.
  The early phase of spectra requires two thermal emission components of different
  absorption columns if they are fitted with thermal models. The temperatures of two
  emission components cannot be well constrained with ASCA continuum spectra. However,
  the detection of an iron K emission line with ASCA and the hard X-ray spectra observed
  by OSSE on the Compton Gamma-Ray Observatory suggest that the two components have
  different temperatures: a few keV and about 100 keV. The properties of the two emission
  components are consistent with emissions from the front and reverse shocks of the
  supernova explosion. The drastic softening of the X-ray spectra is explained by
  the decrease of the absorption column density of the reverse shock component and
  the change of the major contributor to the soft X-ray band from the front to the
  reverse shocks.'
