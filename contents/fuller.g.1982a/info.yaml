abstract: Stellar electron and positron emission rates and continuum electron and
  positron capture rates, as well as the associated neutrino energy loss rates, are
  tabulated for the free nucleons and 226 nuclei with masses between A =21 and 60.
  These rates were calculated in accordance with the procedure described in Papers
  I and II of this series and are presented here in tabular form on an abbreviated
  temperature and density grid. Results of these calculations on a detailed temperature
  and density grid are available in computer readable form on magnetic tape upon request
  to MJN. The stellar weak rate calculation procedure is reviewed, and the results
  are discussed. Comparison of the stellar weak rates to terrestrial decay rates are
  made where possible.
