abstract: The investigation of the influence of the equation of state of matter (in
  the nuclear density regime) on the dynamical behavior of neutron stars is continued.
  The properties of the two lowest frequency radial oscillation modes of neutron stars,
  constructed from 13 equations of state, are presented. It is found that the frequencies
  of both radial oscillation modes studied here are generally higher than the frequency
  of the corresponding quadrupole f-mode.
