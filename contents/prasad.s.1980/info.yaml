abstract: A time-dependent gas phase chemical model of the chemistry in interstellar
  clouds is presented which uses a comprehensive library consisting of over 1400 reactions
  for 137 species. Specified constant density, temperature, and radiation field intensity
  are used to generate the evolution with time of these species for l07 years in four
  model clouds to simulate the outer and inner components of zeta Oph and of Orion.  No
  a priori assumptions are made concerning production and loss mechanisms, and the
  algorithm decides which are the major processes from an extensive list of potential
  production and loss mechanisms for each species. The C, N, and 0 families of chemical
  species are discussed in detail with particular emphasis on production and loss
  processes, and on the interrelationships among the chemistries of these families.
  A number of diagrams are used to illustrate the chemistry in interstellar clouds
  resulting from the models. The utility of the model is that it allows for easy testing
  of schemes for the chemistry and chemical evolution in interstellar clouds.
