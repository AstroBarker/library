abstract: A unified picture is presented of the appearance of a pulsar nebula that
  is interacting with surrounding supernova gas. A minimum amount of luminosity is
  produced by the shock front that is driven into the supernova gas; this is generally
  about 1.5 percent of the total supernova power. Additional luminosity can be produced
  by emission from within the pulsar bubble. Detailed results are presented for possible
  photoionization in a supernova at ages of 4 and 10 yrs. The upper limit on the total
  power of a pulsar in SN 1987A is about 5 x 10 exp 38 ergs/s or lower if the pulsar
  nebula has a high radiative efficiency. A general prediction of the pulsar model
  is broadening of the lines with time because of the acceleration by the pulsar bubble.
