abstract: We propose a unified picture of high magnetic field radio pulsars and magnetars
  by arguing that they are all rotating high-field neutron stars but that their magnetic
  axes have different orientations with respect to their rotation axes. In strong
  magnetic fields where photon splitting suppresses pair creation near the surface,
  the high-field pulsars can have active inner accelerators while the anomalous X-ray
  pulsars cannot. This can account for the very different observed emission characteristics
  of the anomalous X-ray pulsar 1E 2259+586 and the high-field radio pulsar PSR J1814-1744.
  A predicted consequence of this picture is that radio pulsars having surface magnetic
  fields greater than about 2\texttimes{}1014 G should not exist.
