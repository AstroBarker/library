abstract: Periodic variations of V404 Cyg having a period of 6.474 +/- 0.005 d with
  a full amplitude of 0.2 mag were discovered with CCD photometry, in the I band,
  of the compact star. The light curve consists of two maxima and two minima per cycle,
  and the shape suggests that it is due to ellipsoidal variations of the secondary
  star which is tidally distorted by the presence of the massive compact object. It
  is proposed that the secondary is a 1 solar mass K0 IV star with MV of about 2.5
  mag at a distance of about 3.5 kpc. It is suggested that if the secondary star is
  nearly filling its Roche lobe, then the orbital inclination must be about 60 deg.
  If the inclination is as high as 80 deg, then the secondary star fills about 90
  percent of the Roche lobe. These limits imply a compact star mass of 8-12 solar
  masses and thus strengthen the evidence that the compact star is extremely massive
  and possibly a black hole.
