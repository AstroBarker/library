abstract: We present the results of our ultra-deep Keck/DEIMOS spectroscopy of z-dropout
  galaxies in the Subaru Deep Field and Great Observatories Origins Deep Survey's
  northern field. For 3 out of 11 objects, we detect an emission line at ~1 mum with
  a signal-to-noise ratio of ~10. The lines show asymmetric profiles with high weighted
  skewness values, consistent with being Lyalpha, yielding redshifts of z = 7.213,
  6.965, and 6.844. Specifically, we confirm the z = 7.213 object in two independent
  DEIMOS runs with different spectroscopic configurations. The z = 6.965 object is
  a known Lyalpha emitter, IOK-1, for which our improved spectrum at a higher resolution
  yields a robust skewness measurement. The three z-dropouts have Lyalpha fluxes of
  3 \texttimes{} 10-17 erg s-1 cm-2 and rest-frame equivalent widths EWLyalpha 0 =
  33-43 {\AA}. Based on the largest spectroscopic sample of 43 z-dropouts, which is
  the combination of our and previous data, we find that the fraction of Lyalpha-emitting
  galaxies (EWLyalpha 0 > 25 {\AA}) is low at z ~ 7; 17\% $\pm$ 10\% and 24\% \$\pm\$
  12\% for bright (M UV ~= -21) and faint (M UV ~= -19.5) galaxies, respectively.
  The fractions of Lyalpha-emitting galaxies drop from z ~ 6 to 7 and the amplitude
  of the drop is larger for faint galaxies than for bright galaxies. These two pieces
  of evidence would indicate that the neutral hydrogen fraction of the intergalactic
  medium increases from z ~ 6 to 7 and that the reionization proceeds from high- to
  low-density environments, as suggested by an inside-out reionization model.  Based
  on data obtained with the Subaru Telescope and the W. M. Keck Observatory. The Subaru
  Telescope is operated by the National Astronomical Observatory of Japan. The W.
  M. Keck Observatory is operated as a scientific partnership among the California
  Institute of Technology, the University of California, and the National Aeronautics
  and Space Administration.
