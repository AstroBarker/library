abstract: Experiments aimed at searching for gravitational waves from astrophysical
  sources have been under development for the last 40 years, but only now are sensitivities
  reaching the level where there is a real possibility of detections being made within
  the next 5 years. In this paper, a history of detector development will be followed
  by a description of current detectors such as LIGO, VIRGO, GEO 600, TAMA 300, Nautilus
  and Auriga. Preliminary results from these detectors will be discussed and related
  to predicted detection rates for some types of sources. Experimental challenges
  for detector design are introduced and discussed in the context of detector developments
  for the future.
