abstract: The autors use spatial and spectroscopic information from IUE spectra in
  the range 1,150 - 1,950 {\AA} to demonstrate that Sk -69, the star coinciding positionally
  with the LMC supernova has disappeared from sight. Two weaker sources, named star
  2 and star 3 in the astrometric analysis of the image of Sk -69\ before the supernova
  outburst, are still present in the ultraviolet spectra. The authors isolate their
  spectra and give a spectral classification. They conclude that Sk -69\ is the progenitor
  of the LMC supernova.
