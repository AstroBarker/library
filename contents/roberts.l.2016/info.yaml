abstract: We report on a set of long-term general-relativistic three-dimensional (3D)
  multi-group (energy-dependent) neutrino radiation-hydrodynamics simulations of core-collapse
  supernovae. We employ a full 3D two-moment scheme with the local M1 closure, three
  neutrino species, and 12 energy groups per species. With this, we follow the post-core-bounce
  evolution of the core of a nonrotating 27 - {M}\&sun;  progenitor in full unconstrained
  3D and in octant symmetry for \greaterequivlnt{}380 ms. We find the development
  of an asymmetric runaway explosion in our unconstrained simulation. We test the
  resolution dependence of our results and, in agreement with previous work, find
  that low resolution artificially aids explosion and leads to an earlier runaway
  expansion of the shock. At low resolution, the octant and full 3D dynamics are qualitatively
  very similar, but at high resolution, only the full 3D simulation exhibits the onset
  of explosion.
