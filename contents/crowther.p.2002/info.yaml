abstract: We use ultraviolet space-based (FUSE, HST) and optical/IR ground-based (2.3
  m MSSSO, NTT) spectroscopy to determine the physical parameters of six WC4-type
  Wolf-Rayet stars in the Large Magellanic Cloud. Stellar parameters are revised significantly
  relative to Gr{\"a}fener et al. (\cite{Grafener1998}) based on improved observations
  and more sophisticated model atmosphere codes, which account for line blanketing
  and clumping. We find that stellar luminosities are revised upwards by up to 0.4
  dex, with surface abundances spanning a lower range of 0.1 le C/He le 0.35 (20-45\%
  carbon by mass) and O/He le 0.06 (<=10\% oxygen by mass). Relative to Galactic WC5-8
  stars at known distance, and analysed in a similar manner, LMC WC4 stars possess
  systematically higher stellar luminosities, ~ 0.2 dex lower wind densities, yet
  a similar range of surface chemistries. We illustrate how the classification C III
  lambda 5696 line is extremely sensitive to wind density, such that this is the principal
  difference between the subtype distribution of LMC and Galactic early-type WC stars.
  Temperature differences do play a role, but carbon abundance does not affect WC
  spectral types. We illustrate the effect of varying temperature and mass-loss rate
  on the WC spectral type for HD 32257 (WC4, LMC) and HD 156385 (WC7, Galaxy) which
  possess similar abundances and luminosities. Using the latest evolutionary models,
  pre-supernova stellar masses in the range 11-19 Msun are anticipated for LMC WC4
  stars, with 7-14 Msun for Galactic WC stars with known distances. These values are
  consistent with pre-cursors of bright type-Ic supernovae such as SN 1998bw (alias
  GRB 980425) for which a minimum total mass of C and O of 14 Msun has been independently
  derived. Based on observations made with the NASA-CNES-CSA Far Ultraviolet Spectroscopic
  Explorer, and NASA-ESA Hubble Space Telescope. Also based on observations collected
  at the European Southern Observatory in program 63.H-0683, and at the Australian
  National University Siding Spring Observatory.
