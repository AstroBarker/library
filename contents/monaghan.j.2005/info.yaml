abstract: In this review the theory and application of Smoothed particle hydrodynamics
  (SPH) since its inception in 1977 are discussed. Emphasis is placed on the strengths
  and weaknesses, the analogy with particle dynamics and the numerous areas where
  SPH has been successfully applied.
