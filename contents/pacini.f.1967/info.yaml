abstract: ALTHOUGH there are still many problems concerning the supernovae, there
  is little doubt that a very dense stellar core has to be left behind after the explosion
  (at least in some cases). During the contraction of this core, inverse beta reactions
  take place and transform most of the nuclei and electrons into neutrons. If the
  mass of the neutron star does not exceed a critical value of about one or two solar
  masses, a stable equilibrium situation can be reached with the gas pressure balancing
  the gravitational force.
