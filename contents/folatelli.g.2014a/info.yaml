abstract: 'We present extensive optical and near-infrared photometric and spectroscopic
  observations of the stripped-envelope supernova SN 2010as. Spectroscopic peculiarities
  such as initially weak helium features and low expansion velocities with a nearly
  flat evolution place this object in the small family of events previously identified
  as transitional Type Ib/c supernovae (SNe). There is ubiquitous evidence of hydrogen,
  albeit weak, in this family of SNe, indicating that they are in fact a peculiar
  kind of Type IIb SNe that we name "flat-velocity Type IIb. The flat-velocity evolution---which
  occurs at different levels between 6000 and 8000 km s-1 for different SNe---suggests
  the presence of a dense shell in the ejecta. Despite the spectroscopic similarities,
  these objects show surprisingly diverse luminosities. We discuss the possible physical
  or geometrical unification picture for such diversity. Using archival Hubble Space
  Telescope images, we associate SN 2010as with a massive cluster and derive a progenitor
  age of \approx{}6 Myr, assuming a single star-formation burst, which is compatible
  with a Wolf-Rayet progenitor. Our hydrodynamical modeling, on the contrary, indicates
  that the pre-explosion mass was relatively low, \approx{}4 M \&sun;. The seeming
  contradiction between a young age and low pre-SN mass may be solved by a massive
  interacting binary progenitor.  This paper includes data gathered with the following
  facilities in Chile: the 6.5 m Magellan Telescopes located at Las Campanas Observatory,
  the Gemini Observatory, Cerro Pach{\''o}n (Gemini Program GS-2008B-Q-56), and the
  European Organisation for Astronomical Research in the Southern Hemisphere (ESO
  Programmes 076.A-0156, 078.D-0048, 080.A-0516, and 082.A-0526). We have also used
  data from the ESO Science Archive Facility under request number gfolatelli74580
  and from the NASA/ESA Hubble Space Telescope, obtained from the Hubble Legacy Archive,
  which is a collaboration between the Space Telescope Science Institute (STScI/NASA),
  the Space Telescope European Coordinating Facility (ST-ECF/ESA), and the Canadian
  Astronomy Data Centre (CADC/NRC/CSA).'
