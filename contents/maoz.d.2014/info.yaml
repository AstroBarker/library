abstract: 'Type Ia supernovae (SNe Ia) are important distance indicators, element
  factories, cosmic-ray accelerators, kinetic-energy sources in galaxy evolution,
  and end points of stellar binary evolution. It has long been clear that a SN Ia
  must be the runaway thermonuclear explosion of a degenerate carbon-oxygen stellar
  core, most likely a white dwarf (WD). However, the specific progenitor systems of
  SNe Ia, and the processes that lead to their ignition, have not been identified.
  Two broad classes of progenitor binary systems have long been considered: single-degenerate
  (SD), in which a WD gains mass from a nondegenerate star; and double-degenerate
  (DD), involving the merger of two WDs. New theoretical work has enriched these possibilities
  with some interesting updates and variants. We review the significant recent observational
  progress in addressing the progenitor problem. We consider clues that have emerged
  from the observed properties of the various proposed progenitor populations, from
  studies of SN Ia sites---pre- and postexplosion---from analysis of the explosions
  themselves and from the measurement of event rates. The recent nearby and well-studied
  event, SN 2011fe, has been particularly revealing. The observational results are
  not yet conclusive and sometimes prone to competing theoretical interpretations.
  Nevertheless, it appears that DD progenitors, long considered the underdog option,
  could be behind some, if not all, SNe Ia. We point to some directions that may lead
  to future progress.'
