abstract: The 1984 Exosat observations of the fast-timing properties of 4U 1820-30
  which led to the discovery of 15-30 Hz quasi-periodic oscillations (QPOs) in the
  X-ray flux of 4U 1820-30 are discussed. The QPOs observed were found to vary in
  frequency between 15 and 30 Hz and in strength between 5 and 8 percent rms, without
  any clear correlation with the source intensity or spectral hardness. Substantial
  red noise was observed, detectable up to about 40 Hz, which did not correlate with
  the QPO strength. The observed behavioral features of the QPOs in the 4U 1820-30
  X-ray flux are discussed in the frameworks of several QPO models.
