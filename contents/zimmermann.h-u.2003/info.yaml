abstract: In April 2001 SN 1993J was observed with both the PN and MOS cameras of
  the XMM-Newton observatory, resulting in about 7x 104 s of acceptable observation
  time. Fit results with both the PN and MOS2 camera spectra studying different spectral
  models are presented. The spectra are best fitted in the energy range between 0.3
  and  ~ 10 keV by a 2-component thermal model with temperatures of kT1 = 0.34+/-
  0.04 keV and kT2 = 6.54+/- 4 keV, adopting ionization equilibrium. A fit with a
  shock model also provides acceptable results. Combining the XMM-Newton data with
  former X-ray observations of the supernova, we discuss the general trend of Lx~
  t-0.30 and the bump of the X-ray light curve as well as former and recent spectral
  results in the light of the standard SN model as first proposed by Chevalier in
  1982.
