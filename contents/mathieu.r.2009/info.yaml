abstract: Blue straggler stars lie on or near the main sequences of star clusters
  (all members of which formed around the same time), but typically are more luminous
  than the turn-off stars and therefore long ago should have evolved off the main
  sequence to become giants and white dwarfs. They are thought to derive from normal
  main-sequence stars that have undergone a recent increase in mass. Statistical evidence
  indicates that in globular star clusters the blue stragglers probably form from
  binary stars. The specific formation processes, such as mass transfer, mergers or
  stellar collisions during dynamical encounters of binary stars, remain unresolved.
  Here we report that 16 of the 21 blue stragglers (76 per cent) in the old (7-Gyr;
  ref. 2) open cluster NGC188 are currently in binary systems, a frequency three times
  that found among normal solar-type main-sequence stars. These blue straggler binaries
  have a remarkable period-eccentricity distribution, with all but three having orbital
  periods of ~1,000days. Moreover, these stars are rotating faster than normal main-sequence
  stars of the same surface temperatures. These data show that most, and possibly
  all, blue stragglers derive from multiple-star systems, and indicate that the several
  formation processes operate simultaneously. We suggest that rapid rotation of blue
  stragglers may place upper limits on their ages.
