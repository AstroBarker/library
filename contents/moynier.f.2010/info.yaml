abstract: Primitive meteorites contain small 40Ca excesses, in addition to rare anomalies
  in 48Ca. Refractory inclusions from Vigarano and Allende have larger 40Ca and resolvable
  48Ca anomalies. These results imply that Ca isotopic heterogeneities were still
  present in the early solar system at both the mineral and whole-rock scale. The
  absence of correlated Ca isotope anomalies in leachates from the CI1 chondrite Orgueil
  containing large 54Cr anomalies has implications on the origin of the Cr anomalies.
  54Cr has to be produced either in massive stars during s-process nucleosynthesis
  without accompanying 48Ca or in particular zones in the rare Type Ia supernovae.
  In the latter case, 54Cr has been produced in a zone predominantly enriched in Cr
  and 54Cr and not mixed with other zones, or 54Cr has been produced together with
  other neutron-rich nuclides and there has been subsequent decoupling of this material
  in the star, in the solar system, or in the laboratory.
