abstract: High-resolution spectra of 19 metal-deficient proper motion stars were examined
  for basic trends in the abundances for iron and other elements. Results indicate
  that there is a mild support for the claim by Tomkin et al. (1986) and Carbon et
  al. (1987) of an upturn in the C/Fe ratio at Fe/H of -2.0, which might reflect an
  overproduction of carbon in the supernovae of 200-solar-mass, zero-initial-metallicity
  stars. The abundance ratios of Mg, Si, Ca, Ti, Cr, Sc, and Mn relative to Fe are
  found to extend the uniform trends previously reported for stars with Fe/H ratio
  between -2.5 and -1.0, down to at least Fe/H of -3.5. The Ni element is not as overabundant
  as was reported by Luck and Bond (1983, 1985), and Al element is overabundant with
  respect to both Fe and Mg. It was found that halo dwarfs have an Mn/Fe underabundance
  of -0/33 dex, and that the spread in relative abundances of Sr in the most metal-deficient
  stars is greater than 1 decade.
