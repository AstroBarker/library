abstract: We present the densely sampled early light curve of the Type II         supernova
  (SN) 2023ixf, first observed within hours of explosion         in the nearby Pinwheel
  Galaxy (Messier 101; 6.7 Mpc). Comparing         these data to recently updated
  models of shock cooling emission,         we find that the progenitor likely had
  a radius of $420 \pm 10\         R_\odot$ (statistical uncertainty only), consistent
  with a red         supergiant. These models provide a good fit to the data starting         about
  1 day after the explosion, despite the fact that the         classification spectrum
  shows signatures of circumstellar         material around SN 2023ixf during that
  time. Photometry during         the first day after the explosion, provided almost
  entirely by         amateur astronomers, does not agree with the shock cooling         models
  or a simple power-law rise fit to data after 1 day. We         consider the possible
  causes of this discrepancy, including         precursor activity from the progenitor
  star, circumstellar         interaction, and emission from the shock before or after
  it         breaks out of the stellar surface. The very low luminosity         (\$-11\mathrm{\
  mag} > M > -14\mathrm{\ mag}\$) and short duration         of the initial excess
  leads us to prefer a scenario related to         prolonged emission from the SN
  shock traveling through the         progenitor system.
