abstract: The calculation of the enhancement factor for the rate of thermonuclear
  reactions in the strong-screening regime is extended to the cases involving plasmas
  with two different ion species. The calculation is based on the recent results of
  Monte Carlo computations for such two-component plasmas. With appropriate definition
  and combination of the plasma parameters it is found that the screening potentials
  in two-component plasmas exhibit a linear dependence at intermediate distances,
  quite similar to that found for one-component plasmas. Application to the calculation
  of carbon ignition in the carbon-oxygen core of a highly evolved star is discussed.
