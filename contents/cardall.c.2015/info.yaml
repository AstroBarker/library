abstract: Aside from numerical algorithms and problem setup, large-scale physics simulations
  on distributed-memory supercomputers require more basic utilitarian functionality,
  such as physical units and constants; display to the screen or standard output device;
  message passing; I/O to disk; and runtime parameter management and usage statistics.
  Here we describe and make available Fortran 2003 classes furnishing extensible object-oriented
  implementations of this sort of rudimentary functionality, along with individual
  'unit test' programs and larger example problems demonstrating their use. These
  classes compose the Basics division of our developing astrophysics simulation code
  GENASIS  (General Astrophysical Simulation System), but their fundamental nature
  makes them useful for physics simulations in many fields.
