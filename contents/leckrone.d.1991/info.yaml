abstract: The Goddard High-Resolution Spectrograph on the HST has been used to obtain
  high S/N observations of the sharp-lined, Hg- and Pt-rich B-type star, Chi Lupi,
  with a resolving power of 87,000. The observations reveal a level of spectroscopic
  detail never before observed at ultraviolet wavelengths for any star other than
  the sun. Concentrating on the region around the resonance line of Hg II at 1942
  A, the profile and central position of this line confirm beyond doubt that the Hg
  isotope anomaly in Chi Lupi is real and extreme, with Hg being heavily concentrated
  in the form of Hg-204. The problems in atomic physics which impair the accurate
  analysis of spectra of this quality are emphasized.
