abstract: The dynamic mass exchange process in doubly degenerate binaries was investigated
  using a three-dimensional numerical simulation of the evolution of a doubly degenerate
  binary system in which the primary is a 1.2-solar-mass white dwarf and the Roche
  lobe filling secondary is a 0.9-solar-mass dwarf. The results show that, in a little
  more than two orbital periods, the secondary is completely destroyed and transformed
  into a thick disk orbiting about the primary. Since only a very small fraction of
  the mass (0.0063 solar mass) escapes the system, the evolution of the binary results
  in the formation of a massive object. This object is composed of three parts, the
  initial white dwarf primary, a very hot pressure-supported spherical envelope, and
  a rotationally supported outer disk. The evolution of the system can be understood
  in terms of a simple analytical model where it is shown that the angular momentum
  carried by the mass during the transfer and stored in the disk determines the evolution
  of the system.
