abstract: Numerical modeling of supernova spectra, light curves, and hydrodynamics
  requires physical inputs, numerical techniques, approximations, and assumptions
  which must be thoroughly understood in order to study the details of supernova explosions.
  Here, we discuss some of these in the context of the early evolution of supernova
  1987A. Gray radiation-hydrodynamics is used to calculate the bolometric light curve
  and the hydrodynamic evolution of the supernova. Synthetic spectra are then obtained
  for the resulting density and velocity structure. The spectrum calculations are
  performed using a special-relativistic treatment of the radiative transfer equation
  in the comoving frame, line blanketing by about 105 spectral lines, and departures
  from local thermodynamic equilibrium (LTE) for H I, He I, Mg II, and Ca II. We find
  that we are able to simultaneously fit the early light curve and spectra reasonably
  well, using a progenitor model from Arnett (1991a), without fine-tuning the free
  parameters. Temperature structures and radiative equilibrium, non-LTE effects, homologous
  expansion, and mean opacities are discussed.
