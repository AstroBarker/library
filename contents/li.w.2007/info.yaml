abstract: 'Direct identification of the progenitors of supernovae (SNe) is rare because
  of the required spatial resolution and depth of the archival data prior to the SN
  explosions. Here we report on the identification of the progenitors of two nearby
  SNe in the Virgo Cluster: SN 2006my in NGC 4651 and SN 2006ov in M61. We obtained
  high-quality ground-based images of SN 2006my with the Canada-France-Hawaii Telescope,
  and are able to locate the site of the SN on pre-SN Hubble Space Telescope (HST)
  Wide Field Planetary Camera 2 images to a high precision (1 sigma uncertainty of
  +/-0.05"). We pinpoint the site of SN 2006ov to within 0.02" from HST Advanced Camera
  for Surveys images of the SN. We detected a red supergiant progenitor for each SN
  within the error circles, with an inferred zero-age main-sequence mass (Mzams) of
  10+5-3 and 15+5-3 Msolar for the progenitors of SNe 2006my and 2006ov, respectively.
  The mass estimates for the progenitors of both SNe confirm a suggested trend that
  the most common Type II-plateau SNe originate from low-mass supergiants with Mzams~8-20
  Msolar.  Based on observations made with the NASA/ESA  Hubble Space Telescope, obtained
  at the Space Telescope Science Institute, which is operated by the Association of
  Universities for Research in Astronomy, Inc., under NASA contract NAS 5-26555. These
  observations are associated with program GO-10877.  Based on observations obtained
  with MegaPrime/MegaCam, a joint project of CFHT and CEA/DAPNIA, at the Canada-France-Hawaii
  Telescope (CFHT), which is operated by the National Research Council (NRC) of Canada,
  the Institute National des Sciences de l''Univers of the Centre National de la Recherche
  Scientifique of France, and the University of Hawaii.'
