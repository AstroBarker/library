abstract: A model of a radiation-driven stellar wind is presented that includes a
  correction factor for the finite size of the star as well as the centrifugal force
  due to the star's rotation. The addition of the finite disk factor reduces the line
  force near the star and increases it far from the star, which lowers the mass-loss
  rate, increases the terminal velocity, and makes the velocity law more gradual.
  These changes bring the wind model into much closer agreement with observations
  of hot star winds. The decrease in the ratio of terminal velocity to escape velocity
  in the B supergiants can be explained as due to a change in the mixture of driving
  lines.
