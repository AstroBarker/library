abstract: Stars that explode as supernovae come in two main classes. A type Ia supernova
  is recognized by the absence of hydrogen and the presence of elements such as silicon
  and sulphur in its spectrum; this class of supernova is thought to produce the majority
  of iron-peak elements in the Universe. They are also used as precise `standard candles'
  to measure the distances to galaxies. While there is general agreement that a type
  Ia supernova is produced by an exploding white dwarf star, no progenitor system
  has ever been directly observed. Significant effort has gone into searching for
  circumstellar material to help discriminate between the possible kinds of progenitor
  systems, but no such material has hitherto been found associated with a type Ia
  supernova. Here we report the presence of strong hydrogen emission associated with
  the type Ia supernova SN2002ic, indicating the presence of large amounts of circumstellar
  material. We infer from this that the progenitor system contained a massive asymptotic-giant-branch
  star that lost several solar masses of hydrogen-rich gas before the supernova explosion.
