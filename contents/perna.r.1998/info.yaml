abstract: The degree of beaming in gamma-ray bursts (GRBs) is currently unknown. The
  uncertainty in the gamma-ray-beaming angle, thetab, leaves the total energy release
  (~theta2b) and the event rate per galaxy (~theta-2b) unknown to within orders of
  magnitude. Since the delayed radio emission of GRB sources originates from a mildly
  relativistic shock and receives only weak relativistic beaming, the rate of radio-selected
  transients with no GRB counterparts can be used to set an upper limit on theta-2b.
  We find that a VLA survey with a sensitivity of ~0.1 mJy at 10 GHz could identify
  >~2\texttimes{}104(thetab/10deg)-2 radio afterglows across the sky if each source
  is sampled at least twice over a period of 1 month or longer. From the total number
  of >~0.1 mJy sources observed at 8.44 GHz and the fraction of fading sources at
  1.44 GHz, we get the crude limit thetab>~6deg.
