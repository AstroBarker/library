abstract: Observations by the Swift gamma-ray-burst (GRB) mission located short GRBs
  in (or near) elliptical galaxies, that are no longer active in star formation. This
  suggested that short GRBs are produced when neutron stars (NSs) merge with other
  NSs or with black holes (BHs). However, the spatial offset of some short GRBs from
  their host galaxies is not consistent with double-neutron-star (DNS) systems formed
  from massive binary stars, which appear to remain in galactic disks. Instead, short
  GRBs may arise from NS mergers in compact binary systems that are naturally produced
  in globular clusters, in which extreme densities of very old stars can create and
  exchange compact binaries efficiently. Here we present a simple scaling from the
  DNS binary observed in the globular cluster M15 in our own Galaxy to the numbers
  expected for globular clusters around galaxies generally. We present numerical simulations
  that demonstrate that DNS production in globular clusters may account for ~10-30\%
  of the observed short GRBs. The much more numerous DNS merger rates predicted for
  galactic disks suggests their associated short GRBs are significantly more beamed,
  perhaps by the aligned spins and greater magnetic field of their secondary NSs.
