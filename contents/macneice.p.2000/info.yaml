abstract: In this paper we describe a community toolkit which is designed to provide
  parallel support with adaptive mesh capability for a large and important class of
  computational models, those using structured, logically Cartesian meshes. The package
  of Fortran 90 subroutines, called PARAMESH, is designed to provide an application
  developer with an easy route to extend an existing serial code which uses a logically
  Cartesian structured mesh into a parallel code with adaptive mesh refinement. Alternatively,
  in its simplest use, and with minimal effort, it can operate as a domain decomposition
  tool for users who want to parallelize their serial codes, but who do not wish to
  use adaptivity. The package can provide them with an incremental evolutionary path
  for their code, converting it first to uniformly refined parallel code, and then
  later if they so desire, adding adaptivity.
