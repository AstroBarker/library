abstract: New absolute atomic transition probability measurements are reported for
  12 transitions in Cr II and two transitions in Zn II. These transition probabilities
  are determined by combining branching ratios measured by classical techniques and
  radiative lifetimes measured by time-resolved laser-induced fluorescence. The measurements
  are compared with branching fractions, radiative lifetimes, and transition probabilities
  in the literature. The 206 nm resonance multiplets in Cr II and Zn II are included
  in this work. These multiplets are very useful in determining the distribution of
  the elements in the gas versus grain phases in the interstellar medium.
