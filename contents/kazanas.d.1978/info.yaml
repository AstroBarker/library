abstract: If, as current numerical models show, neutrinos get trapped and become degenerate
  in the central region of collapsing stellar cores, then they should significantly
  contribute to their shear viscosity. The magnitude of neutrino viscosity (of the
  order of 100 billion sq cm/s) is such that it would tend to make a fast rotating
  stellar core stable beyond the point of bifurcation. The bulk viscosity of such
  systems is also found to be big, and of the same order of magnitude. The above effects,
  along with thermal conduction, will tend to damp out acoustical waves generated
  in a collapsing stellar core after its hydrodynamic bounce.
