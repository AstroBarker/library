abstract: New Skyrme-like effective interactions are proposed suitable for neutron
  stars, supernovae and neutron-rich nuclei. The parameters of the force are adjusted
  to the properties of the symmetric infinite nuclear matter, with an additional constraint
  on the low and high density neutron matter equation of state. Preliminary Hartree-Fock
  plus BCS calculations along series of isotopes are shown. They seem to solve the
  problem of large discrepancies observed with other parametrizations.
