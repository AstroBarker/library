abstract: This is the fifth paper in a series in which we construct and study the
  so-called Runge-Kutta discontinuous Galerkin method for numerically solving hyperbolic
  conservation laws. In this paper, we extend the method to multidimensional nonlinear
  systems of conservation laws. The algorithms are described and discussed, including
  algorithm formulation and practical implementation issues such as the numerical
  fluxes, quadrature rules, degrees of freedom, and the slope limiters, both in the
  triangular and the rectangular element cases. Numerical experiments for two-dimensional
  Euler equations of compressible gas dynamics are presented that show the effect
  of the (formal) order of accuracy and the use of triangles or rectangles on the
  quality of the approximation.
