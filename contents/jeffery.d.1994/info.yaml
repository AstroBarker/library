abstract: We obtained a Hubble Space Telescope (HST) ultraviolet spectrum of the Type
  II supernova SN 1993J in M81 on 1993 April 15. The approximately 1650-2900 A region
  is smoother than observed for SN 1987A and SN 1992A and lacks strong P Cygni absorptions
  caused by iron peak element lines. Synthetic spectra calculated using a parameterized
  Local Thermodynamic Equilibrium (LTE) procedure and a simple model atmosphere do
  not fit the UV region. Radio observations suggest that SN 1993J is embedded in a
  thick circumstellar envelope. The UV spectra of other supernovae that are believed
  to have thick circumstellar envelopes also have approximately 1650-2900 A regions
  lacking in strong P Cygni absorptions. Interaction of supernova ejecta and circumstellar
  matter may cause the smooth UV spectrum. If so, UV observations of supernovae will
  provide insight into the circumstellar environment of the supernova progenitors.
