abstract: Experimental branching fractions (BFs) of Mo II, ranging in wavelength from
  1970 to 4370 {\AA}, have been measured from intensity calibrated spectra recorded
  with the Lund UV Fourier transform spectrometer (FTS). Radiative lifetimes for 10
  levels have been measured using the method of laser-induced fluorescence (LIF).
  Combining BFs with new as well as previously measured lifetimes, 16 in total, oscillator
  strengths of 91 lines were derived. Seven transitions are resonance lines involving
  the ground state. The BF results are compared with calculations made with the Cowan
  code and the f-values are compared with previously published data. Improved wavelengths
  from an ongoing term analysis are also reported.
