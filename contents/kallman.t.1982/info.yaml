abstract: Theoretical models are presented for the temperature and ionization structure
  of spherically symmetric, constant density, gaseous nebulae surrounding compact
  X-ray sources and for the optical, UV, and X-ray spectra emerging from the nebulae.
  The structure is determined by assuming a local balance between heating and cooling
  in the gas, and the radiation field is found by solving a simplified equation of
  transfer. The calculations include an accurate and comprehensive treatment of the
  atomic processes affecting the state of the gas and the radiation field. The destruction
  of line radiation during resonance scattering causes models to be significantly
  hotter and more highly ionized than previous models of the same type. Model results
  are presented for a wide variety of gas densities and X-ray source spectra, scaling
  laws which allow these results to be generalized to a wide variety of astrophysical
  solutions are discussed, and column densities of multiply charged species are tabulated.
