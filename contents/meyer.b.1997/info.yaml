abstract: We present a large survey of r-process nucleosynthesis models. The parameters
  varied are the initial electron-to-baryon ratio, Ye, the entropy per baryon, s,
  and the dynamical timescale, tau0. These quantities usefully characterize the abundances
  expected from any explosive event. The calculations were strictly adiabatic in the
  sense that s was held constant throughout, which is more realistic than the standard
  rho ~ T3 parameterization. We also assumed steady mass loss and a radial outflow
  at constant velocity. By focusing on production of the r-process isotopes with mass
  near A = 195, one of the peaks in the solar system's r-process distribution, we
  provide constraints on the conditions necessary for production of these isotopes.
  These constraints should prove useful to supernova modelers seeking the r-process
  site.
