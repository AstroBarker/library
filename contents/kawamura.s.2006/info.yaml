abstract: DECi-hertz Interferometer Gravitational wave Observatory (DECIGO) is the
  future Japanese space gravitational wave antenna. It aims at detecting various kinds
  of gravitational waves between 1 mHz and 100 Hz frequently enough to open a new
  window of observation for gravitational wave astronomy. The pre-conceptual design
  of DECIGO consists of three drag-free satellites, 1000 km apart from each other,
  whose relative displacements are measured by a Fabry-Perot Michelson interferometer.
  We plan to launch DECIGO in 2024 after a long and intense development phase, including
  two pathfinder missions for verification of required technologies.
