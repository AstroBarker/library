abstract: A critical point (E) is expected in QCD on the temperature (T) versus baryonic
  chemical potential (mu) plane. Using a recently proposed lattice method for mu\not=0
  we study dynamical QCD with nf=2+1 staggered quarks of physical masses on Lt = 4
  lattices. Our result for the critical point is TE = 162+/-2 MeV and muE = 360+/-40
  MeV. For the critical temperature at mu = 0 we obtained Tc = 164+/-2 MeV. This work
  extends our previous study [8] by two means. It decreases the light quark masses
  (mu,d) by a factor of three down to their physical values. Furthermore, in order
  to approach the thermodynamical limit we increase our largest volume by a factor
  of three. As expected, decreasing mu,d decreased muE. Note, that the continuum extrapolation
  is still missing.
