abstract: This paper attempts to present a coherent and detailed model of SN 1987A.
  Observations are consistent with the explosion of a star that, on the main sequence,
  had a mass of 19 M\_sun; and, at the time of explosion, a helium core mass of 6\
  M\_sun;. A neutron star of 1.40\$\pm\$.15 M\_sun; (gravitational mass) has been
  formed releasing 2 - 3\texttimes{}1053ergs of neutrinos. The kinetic energy of an
  explosion required to reproduce the light curve and other key data was Eexp \approx{}
  8\texttimes{}1050(Menv/5 M\_sun;) ergs, with Menv the hydrogen envelope mass at
  the time of the explosion (5 - 10 M\_sun;). Stellar models employing low metallicity
  are explored. Low-metallicity (Z\_sun;/4) models (with no mass loss) of 15 and 20
  M\_sun; stars are presented, both of which burn helium as red supergiants and move
  back to the blue shortly before exploding. A similarly evolved 25 M\_sun; star does
  not move back to the blue. The light curve of the supernova is now powered by the
  decay of 0.07 M\_sun; of radioactive 56Co, as has been the case since March 1988
  when the hydrogen envelope was traversed.
