abstract: RADIO astronomers1-3 have recently discovered pulsars in Vela and near the
  Crab nebula which seem to be associated with supernova remnants and have repetition
  periods (0.0892 s and 0.0331 s) considerably shorter than those previously found.
  The very wide range (60-fold) of periods at present observed is difficult to understand
  if pulsars are in fact pulsating objects of a single class, because in general (period)
  ~ (density)-1/2 and an extremely wide range of density would be required. Of the
  remaining clock mechanisms proposed, rotation4,5 seems most consistent with the
  observations. The extremely short periods exclude white dwarfs and make the suggestion
  of neutron stars more likely.
