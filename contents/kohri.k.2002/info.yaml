abstract: It is often proposed that a massive torus with approximately solar mass
  surrounding a stellar-mass black hole could be a central engine of gamma-ray bursts.
  We study the properties of such massive accretion tori (or disks) based on the alpha
  viscosity model. For surface density exceeding about 1020 g cm-2, which is realized
  when ~1 Msolar of material is contained within a disk of size ~5\texttimes{}106
  cm, we find that (1) the luminosity of photons is practically zero because of significant
  photon trapping, (2) neutrino cooling dominates over advective cooling, (3) the
  pressure of degenerate electrons dominates over the pressure of gas and photons,
  and (4) the magnetic field strength exceeds the critical value of about 4\texttimes{}1013
  G, even if we take 0.1\% of the equipartition value. The possible observable quantum
  electrodynamical (QED) effects arising from supercritical fields are discussed.
  Most interestingly, photon splitting may occur, producing a significant number of
  photons of energies below ~511 keV, thereby possibly suppressing e+/- pair creation.
