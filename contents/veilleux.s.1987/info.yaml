abstract: A revised method of classification of narrow-line active galaxies and H
  II region-like galaxies is proposed. It involves the line ratios which take full
  advantage of the physical distinction between the two types of objects and minimize
  the effects of reddening correction and errors in the flux calibration. Large sets
  of internally consistent data are used, including new, previously unpublished measurements.
  Predictions of recent photoionization models by power-law spectra and by hot stars
  are compared with the observations. The classification is based on the observational
  data interpreted on the basis of these models.
