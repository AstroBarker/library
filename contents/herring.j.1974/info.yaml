abstract: The decay of two-dimensional, homogeneous, isotropic, incompressible turbulence
  is investigated both by means of numerical simulation (in spectral as well as in
  grid-point form), and theoretically by use of the direct-interaction approximation
  and the test-field model. The calculations cover the range of Reynolds numbers from
  50 to 100. Comparison of spectral methods with finite-difference methods shows that
  one of the former with a given resolution is equivalent in accuracy to one of the
  latter with twice the resolution. The numerical simulations at the larger Reynolds
  numbers suggest that earlier reported simulations cannot be used in testing inertial-range
  theories. However, the large-scale features of the flow field appear to be remarkably
  independent of Reynolds number.
