abstract: A total of 334 Low Surface Brightness galaxies detected in the 2MASS all-sky
  near-infrared survey have been observed in the 21 cm H I line using the Nan{\c c}ay
  telescope. All have a Ks-band mean central surface brightness, measured within a
  5'' radius, fainter than 18 mag arcsec-2 and a Ks-band isophotal radius at the 20
  mag arcsec-2 level larger than 20''. We present global H I line parameters for the
  171 clearly detected objects and the 23 marginal detections, as well as upper limits
  for the undetected objects. The 171 clear detections comprise 50 previously uncatalogued
  objects and 41 objects with a PGC entry only.  Tables 3-5 are only available in
  electronic form at the CDS via anonymous ftp to cdsarc.u-strasbg.fr (130.79.128.5)
  or via http://cdsweb.u-strasbg.fr/cgi-bin/qcat?J/A+A/408/465  Figures 1 and 2 are
  only available in electronic form at http://www.edpsciences.org
