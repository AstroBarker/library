abstract: The bulk parameters characterizing the energy of symmetric nuclear matter
  and the symmetry energy defined at normal nuclear density rho 0 provide important
  information on the equation of state (EOS) of isospin asymmetric nuclear matter.
  While significant progress has been made in determining some lower order bulk characteristic
  parameters, such as the energy E 0( rho 0) and incompressibility K 0 of symmetric
  nuclear matter as well as the symmetry energy E sym( rho 0) and its slope parameter
  L, yet the higher order bulk characteristic parameters are still poorly known. Here,
  we analyze the correlations between the lower and higher order bulk characteristic
  parameters within the framework of Skyrme Hartree-Fock energy density functional
  and then estimate the values of some higher order bulk characteristic parameters.
  In particular, we obtain J 0 = (-355) MeV and I 0 = (1473\) MeV for the thirdorder
  and fourth-order derivative parameters of symmetric nuclear matter at rho 0 and
  K sym = (-100 \$\pm\$ 165) MeV, J sym = (224 \$\pm\$ 385) MeV, I sym = (-1309 \$\pm\$
  2025) MeV for the curvature parameter, third-order and fourth-order derivative parameters
  of the symmetry energy at rho 0, using the empirical constraints on E 0( rho 0),
  K 0, E sym( rho 0), L, and the isoscalar and isovector nucleon effective masses.
  Furthermore, our results indicate that the three parameters E 0( rho 0), K 0, and
  J 0 can reasonably characterize the EOS of symmetric nuclear matter up to 2 rho
  0 while the symmetry energy up to 2 rho 0 can be well described by E sym( rho 0),
  L, and K sym.
