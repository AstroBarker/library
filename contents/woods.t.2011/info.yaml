abstract: In interacting binaries, comparison of a donor star's radial response to
  mass loss (ML) with the response of its Roche radius determines whether ML persists
  and, if so, determines the timescale and stability of the ensuing evolutionary phase.
  For giants with deep convective envelopes, the canonical description holds that
  once mass transfer begins it typically proceeds catastrophically on the dynamical
  timescale, as the star cannot lose sufficient heat in order to avoid expansion.
  However, we demonstrate that the local thermal timescale of the envelope's superadiabatic
  outer surface layer remains comparable to that of ML in most cases of "dynamical"
  ML. We argue therefore that if ML proceeds on a timescale longer than this, then
  even a deep convective envelope will not dramatically expand, as the surface layer
  will have time to relax thermally and reconstitute itself. We demonstrate that in
  general the polytropic approximation gives much too strict a criterion for stability
  and discuss the dependence of the donor's response on its radius in addition to
  its core mass. In general, we find that the effective response of the donor on rapid
  timescales cannot be determined accurately without detailed evolutionary calculations.
