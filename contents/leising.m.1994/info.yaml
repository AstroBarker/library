abstract: The Oriented Scintillation Spectrometer Experiment (OSSE) on the Compton
  Observatory observed SN 1993J during three intervals centered approximately 12,
  30, and 108 days after its outburst. Hard X-ray emission was detected in the first
  two of these intervals. No emission was seen in the third observation or in two
  earlier observations in 1991 and 1992. The coincidence of the observed excess with
  the outburst of SN 1993J and the consistency of the spectra and time evolution with
  those seen at lower energies by ROSAT and ASCA (Astro-D) argue that the observed
  emission is indeed from SN 1993J. It is probably due to the interaction of the fast
  supernova ejecta with circumstellar material. The luminosity, 5 x 1040 ergs/sec
  (50-150 keV) in the first interval, is significantly larger than predicted. Extrapolating
  the spectrum to a few keV accounts for most or all of the observed emission at low
  energy. The observed high temperature, 109 K, is easily obtained in the shocked
  circumstellar matter, but a surprisingly high density is required there to give
  the observed luminosity, and little or no additional X-ray emission from denser
  shocked supernova ejecta is allowed. The hard emission might also be explained in
  terms of the shocked supernova ejecta itself with unexpectedly high temperature.
