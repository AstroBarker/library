abstract: The authors derive expressions for the spectral emissivity and absorptivity
  of acoustic radiation by low Mach number turbulent fluids. They consider three types
  of turbulence. The first is free turbulence, that is, turbulence which is not subject
  to external forces. The second and third examples are special cases of forced turbulence,
  turbulence maintained by stirring with spoons and turbulent pseudoconvection. The
  resulting formulae are used to estimate the equilibrium energies and quality factors
  of the acoustic modes in a box which contains turbulent fluid. The scattering of
  acoustic radiation by the turbulent velocity and pressure fluctuations is treated
  and the rate at which nonlinear interactions transfer energy among the acoustic
  modes is evaluated. This work is a first step in the attempt to relate the excitation
  of the Sun's acoustic modes to the turbulence in the solar convection zone.
