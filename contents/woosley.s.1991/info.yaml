abstract: A survey of parameterized explosive silicon burning is carried out in order
  to limit the range of allowed masses of Co-57 produced by SN 1987A. The most likely
  value is between 0.5 and 2.5 times that implied by a solar ratio for Fe-57/Fe-56.
  Values more than four and less than one-third times the solar ratio would pose very
  severe problems for the theory of stellar nucleosynthesis, implying, for example,
  that Fe-56 was not the dominant iron group isotope or that no electron capture occurred
  during oxygen burning. Though dependent somewhat on the neutron excess, the Fe-57
  yield is most sensitive to the occurrence of an alpha-rich freeze-out. An accurate
  measurement of the Fe-57 yield, as reflected observationally by the current abundance
  of radioactive Co-57, is thus an important constraint upon the supernova explosion
  mechanism. The abundance of Ti-44, another nucleus produced exclusively in the alpha-rich
  freeze-out, cannot be much greater than that implied by the solar ratio of Ca-44/Fe-56.
