abstract: The neutrino-p-process is thought to occur in the innermost proton-rich
  layers ejected in core-collapse supernovae. The importance of the vp-process lies
  in the fact that it may contribute to the abundances of elements above Nickel and
  possibly the light p-nuclei. The reaction path of the vp-process lies in a region
  where nuclear masses are partly unknown and all involved reaction rates are based
  on theoretical predictions. Detailed studies of the vp-process nucleosynthesis and
  its uncertainty due to the nuclear physics are presented, with a focus on the reaction
  path at and above 56Ni. The vp-process path is found to be mainly determined by
  nuclear structure and thus is trajectory independent. Critical nuclear physics input
  are identified and the impact of uncertainties on the resulting nucleosynthesis
  is discussed.
