abstract: Models of hydrodynamical, steady state, spherical accretion onto a compact
  object are discussed. The thermal balance of these models is dominated by radiative
  cooling in the optically thin region of the flow below the accretion radius, resulting
  in a cool, isothermal flow at large radii. At small radii the flow becomes optically
  thick and eventually passes through a trapping radius r(tr) below which photons
  are advected downstream faster than they can diffuse upstream. The solutions at
  radii below r(tr) include both adiabatic flow and radiation-dominated shocks. The
  luminosity of the adiabatic models is determined by the PdV work of converging fluid
  flow above r(tr) and corresponds to very small efficiencies. The luminosity of the
  shock models can, however, approach the Eddington limit as the shock radius approaches
  r(tr).
