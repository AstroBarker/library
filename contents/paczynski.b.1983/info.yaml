abstract: A simplified semianalytical one-zone model of nuclear burning on accreting
  degenerate dwarfs or neutron stars is presented which may be used in the construction
  of steady-state models, linear stability analysis, nonlinear nuclear flash calculations,
  and the evaluation of the interflash period. The model treats the entire hydrogen-rich
  layer as a single mass zone overlying a core of fixed size; time evolution of the
  accreting layer is described by two first-order ordinary differential equations.
  Solution of the equations for conditions of steady-state nuclear burning allows
  the study of the dependence of column density on accretion rate, and the derivation
  of thermal stability conditions. Model computations performed for a wide range of
  stellar parameters reveal interflash periods, which decrease with increasing surface
  gravity, accretion rate and core heat flux, of as short as 1 month for hydrogen-rich
  matter and 1 year for helium-rich matter accreting onto degenerate dwarfs, and 10
  seconds for a neutron star accreting helium.
