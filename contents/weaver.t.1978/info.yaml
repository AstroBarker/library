abstract: Results are reported for detailed calculations of the evolution of complete
  15- and 25-solar-mass Population I stars from the ZAMS to iron core collapse. The
  structure of entire stars is computed using an implicit hydrodynamics computer code,
  and careful consideration is given to the complex nuclear processes that characterize
  the final evolutionary stages. The configurations of the stars at the begining of
  core collapse are presented, salient features of the presupernova models are examined,
  and implications for nucleosynthesis and the supernova explosions believed to follow
  are discussed. It is found that both stars form substantially neutronized 'iron'
  cores during hydrostatic silicon burning and that the element abundances in the
  larger star have ratios that are remarkably close to their solar system values over
  the mass range from oxygen to calcium, while the smaller star is characterized by
  large enhancements of Ne, Mg, and Si.
