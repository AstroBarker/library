abstract: The UV, optical, and IR (UVOIR) bolometric luminosity curve of SN 1987A
  was derived from ESO, CTIO, and NASA Kuiper Airborne Observatory spectrophotometry
  for days 1-903 since outburst. It is found that the sum of this UVOIR flux and the
  high-energy flux predicted by models is consistent with the energy liberated by
  0.071 solar mass of Co-56, with no need for additional energy sources for days 126-903
  since outburst. By day 400, the flux at wavelegths larger than 5 microns was found
  to increase rapidly, and by day 650, the UVOIR flux shifted from the optical to
  a thermal IR source with a temperature of 200-300 K. The optical colors began to
  fade more rapidly at the time the FIR flux increased, consistent with dust formation
  local to the supernova.
