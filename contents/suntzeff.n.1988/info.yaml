abstract: Optical UBV (RI)KC photometry of SN 1987A in the Large Magellanic Cloud
  is presented for days 188-477 since core collapse. The luminosity evolution has
  been remarkably exponential over this time period. There are large systematic differences
  of up to 0.3 mag between the CTIO photometry and other published photometry due
  to the presence of strong emission lines during this exponential-decline phase.
  A bolometric light curve based on optical and infrared data has been constructed.
  The bolometric luminosity has declined with an e-folding time of 100.5 days, roughly
  consistent with the e-folding time of 111.3 days for the radioactive decay of Co-56.
  Discrepancies of up to 0.2 mag in the bolometric magnitude are due to differences
  in the various photometric datasets and interpolation schemes.
