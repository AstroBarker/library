abstract: We present infrared photometry of supernova (SN) 1999em, plus optical photometry,
  infrared photometry, and optical spectroscopy of SN 2003hn. Both objects were Type
  II-P SNe. The V - [RIJHK] color curves of these SNe evolved in a very similar fashion
  until the end of the plateau phase. This allows us to determine how much more extinction
  the light of SN 2003hn suffered compared to SN 1999em. Since we have an estimate
  of the total extinction suffered by SN 1999em from model fits of ground-based and
  space-based spectra as well as photometry of SN 1999em, we can estimate the total
  extinction and absolute magnitudes of SN 2003hn with reasonable accuracy. Since
  the host galaxy of SN 2003hn also produced the Type Ia SN 2001el, we can directly
  compare the absolute magnitudes of these two SNe of different types.  Based in part
  on observations taken at the Cerro Tololo Inter-American Observatory, National Optical
  Astronomy Observatory, which is operated by the Association of Universities for
  Research in Astronomy, Inc. (AURA) under cooperative agreement with the National
  Science Foundation. This paper also includes data gathered with the 6.5 m Magellan
  Telescopes located at Las Campanas Observatory, Chile.
