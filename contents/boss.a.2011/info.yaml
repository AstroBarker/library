abstract: Doppler surveys have shown that more massive stars have significantly higher
  frequencies of giant planets inside ~3 AU than lower mass stars, consistent with
  giant planet formation by core accretion. Direct imaging searches have begun to
  discover significant numbers of giant planet candidates around stars with masses
  of ~1 M sun to ~2 M sun at orbital distances of ~20 AU to ~120 AU. Given the inability
  of core accretion to form giant planets at such large distances, gravitational instabilities
  of the gas disk leading to clump formation have been suggested as the more likely
  formation mechanism. Here, we present five new models of the evolution of disks
  with inner radii of 20 AU and outer radii of 60 AU, for central protostars with
  masses of 0.1, 0.5, 1.0, 1.5, and 2.0 M sun, in order to assess the likelihood of
  planet formation on wide orbits around stars with varied masses. The disk masses
  range from 0.028 M sun to 0.21 M sun, with initial Toomre Q stability values ranging
  from 1.1 in the inner disks to ~1.6 in the outer disks. These five models show that
  disk instability is capable of forming clumps on timescales of ~103 yr that, if
  they survive for longer times, could form giant planets initially on orbits with
  semimajor axes of ~30 AU to ~70 AU and eccentricities of ~0 to ~0.35, with initial
  masses of ~1 M Jup to ~5 M Jup, around solar-type stars, with more protoplanets
  forming as the mass of the protostar (and protoplanetary disk) is increased. In
  particular, disk instability appears to be a likely formation mechanism for the
  HR 8799 gas giant planetary system.
