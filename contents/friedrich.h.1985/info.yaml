abstract: It is shown that Einstein's vacuum field equations (respectively the conformal
  vacuum field equations) in a frame formalism imply a symmetric hyperbolic system
  of ``reduced'' propagation equations for any choice of coordinate system and frame
  field (and conformal factor). Certain freely specifiable ``gauge source'' functions
  occurring in the reduced equations reflect the choice of gauge. Together with the
  initial data they determine the gauge uniquely. Their choice does not affect the
  isometry class (conformal class) of a solution of an initial value problem. By the
  same method symmetric hyperbolic propagation equations are obtained from other gauge
  field equations, irrespective of the gauge. Using the concept of source functions
  one finds that Einstein's field equation, considered as second order equations for
  the metric coefficients, are of wave equation type in any coordinate system.
