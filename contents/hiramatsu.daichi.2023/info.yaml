abstract: We present the discovery of Type II supernova (SN) 2023ixf in M101,         among
  the closest core-collapse SNe in the last several decades,         and follow-up
  photometric and spectroscopic observations in the         first month of its evolution.
  The light curve is characterized         by a rapid rise ($\approx5$ days) to a
  luminous peak         (\$M\_V\approx-18\$ mag) and plateau (\$M\_V\approx-17.6\$
  mag)         extending to \$30\$ days with a smooth decline rate of         \$\approx0.03\$
  mag day\$^{-1}\$. During the rising phase, \$U-V\$         color shows blueward
  evolution, followed by redward evolution in         the plateau phase. Prominent
  flash features of hydrogen, helium,         carbon, and nitrogen dominate the spectra
  up to \$\approx5\$ days         after first light, with a transition to a higher
  ionization         state in the first \$\approx2\$ days. Both the \$U-V\$ color
  and         flash ionization states suggest a rise in the temperature,         indicative
  of a delayed shock-breakout inside dense         circumstellar material (CSM). From
  the timescales of CSM         interaction, we estimate its compact radial extent
  of         \$\sim(3-7)\times10^{14}\$ cm. We then construct numerical light-         curve
  models based on both continuous and eruptive mass-loss         scenarios shortly
  before explosion. For the continuous mass-loss         scenario, we infer a range
  of mass-loss history with \$0.1-1.0\$         \$M\_\odot {\rm yr}^{-1}\$ in the
  final \$2-1\$ years before         explosion, with a potentially decreasing mass
  loss of \$0.01-0.1\$         \$M\_\odot {\rm yr}^{-1}\$ in \$\sim0.7-0.4\$ years
  towards the         explosion. For the eruptive mass-loss scenario, we favor         eruptions
  releasing \$0.3-1\$ \$M\_\odot\$ of the envelope at about a         year before
  explosion, which result in CSM with mass and extent         similar to the continuous
  scenario. We discuss the implications         of the available multi-wavelength
  constraints obtained thus far         on the progenitor candidate and SN 2023ixf
  to our variable CSM         models.
