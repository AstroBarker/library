abstract: We perform detailed calculations of cosmic microwave background (CMB) anisotropies
  in a cold dark matter (CDM)-dominated open universe with primordial adiabatic density
  perturbations for a variety of reionization histories. The CMB anisotropies depend
  primarily on the geometry of the universe, which in a matter-dominated universe
  is determined by Omega and the optical depth to the surface of last scattering.
  In particular, the location on the primary Doppler peak depends primarily on Omega
  and is fairly insensitive to the other unknown parameters, such as Omegab, h, Lambda,
  and the shape of the power spectrum. Therefore, if the primordial density perturbations
  are adiabatic, measurements of CMB anisotropies on small scales may be used to determine
  Omega.
