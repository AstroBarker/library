abstract: We have combined ground-based optical and near-infrared data with Spitzer
  Space Telescope mid-infrared data for five black hole (BH) soft X-ray transients
  (SXTs) in order to determine the levels of near- and mid-infrared emission from
  sources other than the secondary star. Mid-infrared emission from an accretion disk,
  circumbinary dust, and/or a jet could act as sources of near-infrared contamination,
  thereby diluting ellipsoidal variations of the secondary star and affecting determined
  BH mass estimates. Based on optical to mid-infrared spectral energy distribution
  modeling of the five SXTs along with the prototype, V616 Mon, we detected mid-infrared
  excesses in half of the systems, and suggest that the excesses detected from these
  systems arise from non-thermal synchrotron jets rather than circumbinary dust disks.
