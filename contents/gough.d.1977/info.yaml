abstract: The mixing length theory of convection is generalized for use in the envelopes
  of nonrotating, radially pulsating stars by the methods proposed by Gough (1965)
  and Unno (1967). The essential differences between the physical assumptions made
  in the two approaches are explained. The detailed formulas required for a linear
  pulsational-stability analysis of a static star are derived.
