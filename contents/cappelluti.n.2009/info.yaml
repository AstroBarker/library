abstract: 'Context: Tidal disruption events are possible sources of temporary nuclear
  activity in galactic nuclei and can be considered as good indicators of the existence
  of supermassive black holes in the centers of galaxies.  Aims: A new X-ray source
  has been detected serendipitously with ROSAT in a PSPC pointed observation of the
  galaxy cluster A3571. Given the strong flux decay of the object in subsequent detections,
  the tidal disruption scenario is investigated as a possible explanation of the event.  Methods:
  We followed the evolution of the X-ray transient with ROSAT, XMM-Newton and Chandra
  for a total period of ~13 years. We also obtained 7-band optical/NIR photometry
  with GROND at the ESO/MPI 2.2 m telescope.  Results: We report a very large decay
  of the X-ray flux of the ROSAT source identified with the galaxy LEDA 095953, a
  member of the cluster Abell 3571. We measured a maximum 0.3-2.4 keV luminosity Log
  (L\_X) = 42.8 erg s-1. The high state of the source lasted at least 150 ks; afterwards
  LX declined as ~t-2. The spectrum of the brightest epoch is consistent with a black
  body with temperature kT\texttildelow{} 0.12 keV.  Conclusions: The total energy
  released by this event in 10 yr was estimated to be Delta~E > 2 \texttimes{} 1050
  erg. We interpret this event as a tidal disruption of a solar type star by the central
  supermassive black hole (i.e. ~107~M\&sun;) of the galaxy.'
