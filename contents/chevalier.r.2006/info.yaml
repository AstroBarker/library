abstract: The presumed Wolf-Rayet star progenitors of Type Ib/c supernovae have fast,
  low-density winds, and the shock waves generated by the supernova interaction with
  the wind are not expected to be radiative at typical times of observation. The injected
  energy spectrum of radio-emitting electrons typically has an observed index p=3,
  which is suggestive of acceleration in cosmic-ray-dominated shocks. The early, absorbed
  part of the radio light curves can be attributed to synchrotron self-absorption,
  which leads to constraints on the magnetic field in the emitting region and on the
  circumstellar density. The range of circumstellar densities inferred from the radio
  emission is somewhat broader than that for Galactic Wolf-Rayet stars, if similar
  efficiencies of synchrotron emission are assumed in the extragalactic supernovae.
  For the observed and expected ranges of circumstellar densities to roughly overlap,
  a high efficiency of magnetic field production in the shocked region is required
  (\ensuremath{\epsilon}B~0.1). For the expected densities around a Wolf-Rayet star,
  a nonthermal mechanism is generally required to explain the observed X-ray luminosities
  of Type Ib/c supernovae. Inverse Compton emission is a candidate for the emission,
  if the observations are near optical maximum. In other cases we suggest that the
  mechanism is X-ray synchrotron emission in a situation in which the shock wave is
  cosmic-ray-dominated so that the electron energy spectrum flattens at high energy.
  More comprehensive X-ray observations of a Type Ib/c supernova are needed to determine
  whether this suggestion is correct.
