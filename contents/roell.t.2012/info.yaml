abstract: 'Aims: Analyzing exoplanets detected by radial velocity (RV) or transit
  observations, we determine the multiplicity of exoplanet host stars in order to
  study the influence of a stellar companion on the properties of planet candidates.  Methods:
  Matching the host stars of exoplanet candidates detected by radial velocity or transit
  observations with online multiplicity catalogs in addition to a literature search,
  57 exoplanet host stars are identified having a stellar companion.  Results: The
  resulting multiplicity rate of at least 12\% for exoplanet host stars is about four
  times smaller than the multiplicity of solar like stars in general. The mass and
  the number of planets in stellar multiple systems depend on the separation between
  their host star and its nearest stellar companion, e.g. the planetary mass decreases
  with an increasing stellar separation. We present an updated overview of exoplanet
  candidates in stellar multiple systems, including 15 new systems (compared to the
  latest summary from 2009).'
