abstract: 'Context. Classical novae (CNe) represent the main class of supersoft X-ray
  sources (SSSs) in the central region of our neighbouring galaxy M 31. Only three
  confirmed novae and three SSSs have been discovered in globular clusters (GCs) of
  any galaxy so far, of which one nova and two SSSs (including the nova) were found
  in M 31 GCs.  Aims: To study the SSS state of CNe we carried out a high-cadence
  X-ray monitoring of the M 31 central area with XMM-Newton and Chandra. This project
  is supplemented by regular optical monitoring programmes at various observatories.  Methods:
  We analysed X-ray and optical monitoring data of a new transient X-ray source in
  the M 31 GC Bol 126, discovered serendipitously in Swift observations. Our optical
  data set was based on regular M 31 monitoring programmes from five different small
  telescopes and was reduced using a homogeneous method. Additionally, we made use
  of Pan-STARRS 1 data obtained during the PAndromeda survey. We extracted light curves
  of the source in the optical and X-rays, as well as X-ray spectra.  Results: Our
  observations reveal that the X-ray source in Bol 126 is the third SSS in an M 31
  GC and can be confirmed as the second CN in the M 31 GC system. This nova is named
  M31N 2010-10f. Its properties in the X-ray (high black-body temperature, short SSS
  phase) and optical (relatively high maximum magnitude, fast decline) regimes agree
  with a massive white dwarf (MWD \greaterequivlnt{} 1.3 M\&sun;) in the binary system.
  Incorporating the data on previously found (suspected) novae in M 31 GCs we used
  our high-cadence X-ray monitoring observations to estimate a tentative nova rate
  in the M 31 GC system of 0.05 yr-1 GC-1. An optical estimate, based on the recent
  10.5-year WeCAPP survey, gives a lower nova rate, which is compatible with the X-ray
  rate on the 95\% confidence level.  Conclusions: Although still based on small-number
  statistics, there is growing evidence that the nova rate in GCs is higher than expected
  from primordial binary formation and under conditions as in the field. Dynamical
  binary formation and/or additional accretion from the intracluster medium are possible
  scenarios for an increased nova rate, but observational confirmation for this enhancement
  has been absent, so far. Regular X-ray monitoring observations of M 31 provide a
  promising strategy to find these novae.  Partly based on observations with XMM-Newton,
  an ESA Science Mission with instruments and contributions directly funded by ESA
  Member States and NASA.Tables 1-3 are available in electronic form at http://www.aanda.org'
