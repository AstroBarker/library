abstract: The equations governing the transport of neutrinos in a collapsing stellar
  core are solved numerically. Neutrino-matter coupling is treated within the framework
  of Weinberg's neutral current model, with various scalings of the rates to allow
  for the existing experimental uncertainties. Special care is devoted to neutrino-electron
  Compton scattering and to the numerical conservation of neutrinos. Previous investigations
  have indicated a marginal effectiveness of neutrinos in producing a supernova explosion,
  necessitating such a more accurate treatment of neutrino transport. Neutrino stresses,
  luminosities, and energy transfer rates to matter are computed in realistic collapsing
  stellar cores.
