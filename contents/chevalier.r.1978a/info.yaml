abstract: Previous observations of Cas A are discussed in the context of shock-wave
  emission models computed by Raymond (1976, 1977, 1978). The models for the brightest
  quasi-stationary flocculi indicate an overabundance of He and N relative to H by
  an order of magnitude. This implies that the gas was originally part of the H-burning
  core and that presupernova mass loss penetrated this region. The abundances of the
  fast-moving material support the hypothesis that this is uncontaminated material
  from the core of a massive star. Relative to O, abundance estimates for S, Ar, Ca,
  Fe, and Ne are obtained together with upper limits for H, He, N, Mg, and C. These
  results are compared with the stellar evolution calculations of Arnett and Schramm
  (1973), and there is an indication that the presupernova star was very massive.
  Future searches for lines of He, Mg, and C will be of interest because they are
  predicted to be near the present detection limit.
