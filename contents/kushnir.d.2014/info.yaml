abstract: The early phase of the hydrodynamic evolution following the collision of
  two stars is analyzed. Two strong shocks propagate from the contact surface and
  move toward the center of each star at a velocity that is a small fraction of the
  velocity of the approaching stars. The shocked region near the contact surface has
  a planar symmetry and a uniform pressure. The density vanishes at the (Lagrangian)
  surface of contact, and the speed of sound diverges there. The temperature, however,
  reaches a finite value, since as the density vanishes, the finite pressure is radiation
  dominated. For carbon-oxygen white dwarf (CO WD) collisions, this temperature is
  too low for any appreciable nuclear burning shortly after the collision, which allows
  for a significant fraction of the mass to be highly compressed to the density required
  for efficient 56Ni production in the detonation wave that follows. This property
  is crucial for the viability of collisions of typical CO WD as progenitors of type
  Ia supernovae, since otherwise only massive (>0.9 M \&sun;) CO WDs would have led
  to such explosions (as required by all other progenitor models). The divergence
  of the speed of sound limits numerical studies of stellar collisions, as it makes
  convergence tests exceedingly expensive unless dedicated schemes are used. We provide
  a new one-dimensional Lagrangian numerical scheme to achieve this. A self-similar
  planar solution is derived for zero-impact parameter collisions between two identical
  stars, under some simplifying assumptions (including a power-law density profile),
  which is the planar version of previous piston problems that were studied in cylindrical
  and spherical symmetries.
