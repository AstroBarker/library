abstract: The gravitational-wave (GW) asteroseismology is a powerful technique for
  extracting interior information of compact objects. In this work, we focus on spacetime
  modes, the so-called w modes, of GWs emitted from a proto-neutron star (PNS) in
  the postbounce phase of core-collapse supernovae. Using results from recent three-dimensional
  supernova models, we study how to infer the properties of the PNS based on a quasi-normal
  mode analysis in the context of the GW asteroseismology. We find that the w1-mode
  frequency multiplied by the PNS radius is expressed as a linear function with respect
  to the ratio of the PNS mass to the PNS radius. This relation is insensitive to
  the nuclear equation of state (EOS) employed in this work. Combining with another
  universal relation of the f -mode oscillations, we point out that the time dependent
  mass-radius relation of the PNS can be obtained by observing both the f - and w1-mode
  GWs simultaneously. Our results suggest that the simultaneous detection of the two
  modes could provide a new probe into finite-temperature nuclear EOS that predominantly
  determines the PNS evolution.
