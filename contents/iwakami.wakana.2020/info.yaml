abstract: We report on the core-collapse supernova simulation we conducted for a 11.2
  M progenitor model in three-dimensional space up to 20 ms after bounce, using a
  radiation hydrodynamics code with full Boltzmann neutrino transport. We solve the
  six-dimensional Boltzmann equations for three neutrino species and the three-dimensional
  compressible Euler equations with Furusawa and Togashi's nuclear equation of state.
  We focus on the prompt convection at 10 ms after bounce and investigate how neutrinos
  are transported in the convective matter. We apply a new analysis based on the eigenvalues
  and eigenvectors of the Eddington tensor and make a comparison between the Boltzmann
  transport results and the M1 closure approximation in the transition regime between
  the optically thick and thin limits. We visualize the eigenvalues and eigenvectors
  using an ellipsoid, in which each principal axis is parallel to one of the eigenvectors
  and has a length proportional to the corresponding eigenvalue. This approach enables
  us to understand the difference between the Eddington tensor derived directly from
  the Boltzmann simulation and the one given by the M1 prescription from a new perspective.
  We find that the longest principal axis of the ellipsoid is almost always nearly
  parallel to the energy flux in the M1 closure approximation whereas in the Boltzmann
  simulation it becomes perpendicular in some transition regions, where the mean free
  path is 0.1 times the radius. In three spatial dimensions, the convective motions
  make it difficult to predict where this happens and to possibly improve the closure
  relation there.
