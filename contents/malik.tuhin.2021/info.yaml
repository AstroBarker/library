abstract: We develop a new equation of state (EoS) table involving thermal (anti)kaons,
  Bose-Einstein condensate of $K^{-}$ mesons and \$\Lambda\$-hyperons for core-collapse
  supernova and neutron star merger simulations. This EoS table is based on a finite
  temperature density-dependent relativistic hadron field theory where baryon-baryon
  interaction is mediated by scalar \$\sigma\$, vector \$\omega\$ and \$\rho\$ mesons,
  using the parameter set DD2 for nucleons. The repulsive hyperon-hyperon interaction
  is mediated by an additional strange \$\phi\$ meson. The EoS for the \$K^-\$ condensed
  matter is also calculated within the framework of relativistic mean field model,
  whereas the low-density, inhomogeneous matter is calculated in the extended Nuclear
  Statistical Equilibrium model (NSE). The EoS table is generated for a wide range
  of values of three parameters - baryon density (\$10^{-12}\$ to \$\sim\$ 1 fm\$^{-3}\$),
  positive charge fraction(0.01 to 0.60) and temperature(0.1 to 158.48 MeV).
