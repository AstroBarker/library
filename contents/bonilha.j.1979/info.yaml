abstract: Monte Carlo calculations are carried out for resonance scattering inside
  a plane-parallel slab for a large range of values of optical half-thickness tau
  1/2. Analytical fitting formulae are presented for a number of quantities as functions
  of tau 1/2 and of the damping constant a, all for tau 1/2 much greater than unity
  but arbitrary values of tau 1/2a. These quantities include the number of scatterings,
  the total path length, and the line width of emerging photons. Separate calculations
  are carried out for slabs also containing true absorbers and for differentially
  expanding slabs. Fitting formulas are presented for these cases in terms of an additional
  dimensionless parameter, all for tau 1/2 much greater than unity.
