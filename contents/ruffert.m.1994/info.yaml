abstract: We investigate the hydrodynamics of three-dimensional classical Bondi-Hoyle
  accretion. Totally absorbing spheres of varying sizes (from 10 down to 0.01 accretion
  radii) move at Mach 3 relative to a homogeneous and slightly perturbed medium, which
  is taken to be an ideal gas (gamma = 5/3). To accommodate the long-range gravitational
  forces, the extent of the computational volume is 323 accretion radii. We examine
  the influence of numerical procedure on physical behavior. The hydrodynamics is
  modeled by the 'piecewise parabolic method.' No energy sources (nuclear burning)
  or sinks (radiation, conduction) are included. The resolution in the vicinity of
  the accretor is increased by multiply nesting several (5-10) grids around the sphere,
  each finer grid being a factor of 2 smaller in zone dimension that the next coarser
  grid. The largest dynamic range (ratio of size of the largest grid to size of the
  finest zone) is 16,384. This allows us to include a coarse model for the surface
  of the accretor (vacuum sphere) on the finest grid, while at the same time evolving
  the gas on the coarser grids. Initially (at time t = 0-10), a shock front is set
  up, a Mach cone develops, and the accretion column is observable. Eventually the
  flow becomes unstable, destroying axisymmetry. This happens approximately when the
  mass accretion rate reaches the values (+/- 10\%) predicted by the Bondi-Hoyle accretion
  formula (factor of 2 included). However, our three-dimensional models do not show
  the highly dynamic flip-flop flow so prominent in two-dimensional calculations performed
  by other authors. The flow, and thus the accretion rate of all quantities, shows
  quasi-periodic (P approximately equals 5) cycles between quiescent and active states.
  The interpolation formula proposed in an accompanying paper is found to follow the
  collected numerical data to within approximately 30\%. The specific angular momentum
  accreted is of the same order of magnitude as the values previously found for two-dimensional
  flows.
