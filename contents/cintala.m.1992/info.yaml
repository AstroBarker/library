abstract: Thermal effects of micrometeoroid impact into the regoliths of the moon
  and Mercury, and some comparisons between the regoliths of the two bodies are presented.
  The impact calculations used to estimate the volumes of melt and vapor produced
  in the regoliths of the two bodies are described. An overview of the process of
  impact metamorphism in a modeled regolith target is presented, in which the roles
  played by impact velocity and target temperature in determining the quantities of
  melt and vapor are evaluated. The model impact process and fluxes are combined to
  estimate the production rates for impact melt and vapor on the two bodies, and the
  results are compared with those of previous studies. It is concluded that the rates
  of impact melting and vaporization on Mercury are much greater than on the moon.
  In a given period of time, a factor of 14 times more melt and 20 times more vapor
  are produced on Mercury than on the moon. A 'typical' Mercurian microcratering event
  produces 2.6 times more melt than its lunar counterpart; the flux calculated for
  Mercury is 5.5 times higher than it is at the moon.
