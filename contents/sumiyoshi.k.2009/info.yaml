abstract: We investigate the emergence of strange baryons in the dynamical collapse
  of a nonrotating massive star to a black hole using neutrino-radiation hydrodynamical
  simulations in general relativity. By following the dynamical formation and collapse
  of a nascent proto-neutron star from the gravitational collapse of a 40 M sun star
  adopting a new hyperonic equation-of-state (EOS) table, we show that the hyperons
  do not appear at the core bounce but populate quickly ~0.5-0.7 s after the bounce
  to trigger the recollapse to a black hole. They start to show up off center owing
  to high temperatures and later prevail at center when the central density becomes
  high enough. The neutrino emission from the accreting proto-neutron star with the
  hyperonic EOS stops much earlier than the corresponding case with a nucleonic EOS,
  while the average energies and luminosities are quite similar in the two cases.
  These features of the neutrino signal are a potential probe of the emergence of
  new degrees of freedom inside the black hole forming collapse.
