abstract: Earlier light curve models for SN 1987A have been improved by adopting more
  realistic presupernova models and adopting a postexplosion elemental distribution
  consistent with X-ray and gamma-ray observations. The light curve shape is sensitive
  to the distributions of abundance and expansion velocity in the ejecta. It is found
  that the prepeak smooth rise and the broad peak of the light curve, respectively,
  are well modeled by assuming some mixing of Ni-56 into the hydrogen-rich envelope
  and of hydrogen into the core. The existence of the hydrogen recombination front
  is responsible for the formation of the plateaulike peak. For explosion energy,
  good agreement with the observed light curve is obtained for E/M(env) = (1.1 + or
  - 0./3) x 10 to the 50th ergs/solar mass. Further improvements on the early light
  curve, the dependence of the light curve on the distribution of Ni-56 and hydrogen,
  and the relation with other type II supernovae are discussed.
