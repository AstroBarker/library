abstract: 'We describe the Center for Radiative Shock Hydrodynamics (CRASH) code,
  a block-adaptive-mesh code for multi-material radiation hydrodynamics. The implementation
  solves the radiation diffusion model with a gray or multi-group method and uses
  a flux-limited diffusion approximation to recover the free-streaming limit. Electrons
  and ions are allowed to have different temperatures and we include flux-limited
  electron heat conduction. The radiation hydrodynamic equations are solved in the
  Eulerian frame by means of a conservative finite-volume discretization in either
  one-, two-, or three-dimensional slab geometry or in two-dimensional cylindrical
  symmetry. An operator-split method is used to solve these equations in three substeps:
  (1) an explicit step of a shock-capturing hydrodynamic solver; (2) a linear advection
  of the radiation in frequency-logarithm space; and (3) an implicit solution of the
  stiff radiation diffusion, heat conduction, and energy exchange. We present a suite
  of verification test problems to demonstrate the accuracy and performance of the
  algorithms. The applications are for astrophysics and laboratory astrophysics. The
  CRASH code is an extension of the Block-Adaptive Tree Solarwind Roe Upwind Scheme
  (BATS-R-US) code with a new radiation transfer and heat conduction library and equation-of-state
  and multi-group opacity solvers. Both CRASH and BATS-R-US are part of the publicly
  available Space Weather Modeling Framework.'
