abstract: In a previous paper, we presented an atlas containing 59 low-resolution
  spectra that correspond to 27 Type Ia supernovae, covering about 1 year of Type
  Ia supernova evolution. This paper is a continuation, with the aim of performing
  a standard spectral evolution for ``normal'' Type Ia supernovae from the homogeneous
  set of data compiled in the Canarias Type Ia Supernova Archive. This standard sequence
  could be useful in yielding clues leading to the detection of the ``peculiar'' Type
  Ia supernova events. Furthermore, it could help in assigning a more accurate phase
  to a given Type Ia supernova from its spectrum when no photometric evolution of
  the supernova is available. Based on observations made with the 2.5 m Isaac Newton
  and the 4.2 m William Herschel Telescopes operated on the island of La Palma by
  the Isaac Newton Group in the Spanish Observatorio del Roque de los Muchachos of
  the Instituto de Astrof{\'\i}sica de Canarias.
