abstract: Some inequalities and relations among entropies of reduced quantum mechanical
  density matrices are discussed and proved. While these are not as strong as those
  available for classical systems they are nonetheless powerful enough to establish
  the existence of the limiting mean entropy for translationally invariant states
  of quantum continuous systems.
