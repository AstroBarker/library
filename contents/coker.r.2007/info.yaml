abstract: We have conducted experiments on the Omega laser at the University of Rochester
  that have produced jets of supersonic Ti impacting and being deflected by a ball
  of high density plastic. These mm-sized jets of dense plasma are highly complex,
  have large Reynolds numbers, and, given sufficient time and shear, should produce
  a fully turbulent flow. The experiments are diagnosed with a point-projection backlighter,
  resulting in a single image per shot. Simulations of the 3D hydrodynamics capture
  the large-scale features of the experimental data fairly well while missing some
  of the smaller scale turbulent-like phenomena. This is to be expected given the
  limited characterization of the targets as well as the finite resolution of the
  3D simulations. If Euler scaling holds, these experiments should model larger astrophysical
  jets in objects such as HH 110 where an outflow can be seen colliding with a molecular
  cloud. However, Euler scaling demands that not only the isothermal internal Mach
  numbers of the two systems be similar but also that any dissipative mechanisms,
  such as radiative cooling or viscous dissipation, be of equal importance relative
  to each other. Similar equations of state are required as well. We discuss such
  issues in the context of these experiments and simulations.
