abstract: The temperature in the crust of an accreting neutron star, which comprises
  its outermost kilometre, is set by heating from nuclear reactions at large densities,
  neutrino cooling and heat transport from the interior. The heated crust has been
  thought to affect observable phenomena at shallower depths, such as thermonuclear
  bursts in the accreted envelope. Here we report that cycles of electron capture
  and its inverse, beta- decay, involving neutron-rich nuclei at a typical depth of
  about 150metres, cool the outer neutron star crust by emitting neutrinos while also
  thermally decoupling the surface layers from the deeper crust. This `Urca' mechanism
  has been studied in the context of white dwarfs and type Ia supernovae, but hitherto
  was not considered in neutron stars, because previous models computed the crust
  reactions using a zero-temperature approximation and assumed that only a single
  nuclear species was present at any given depth. The thermal decoupling means that
  X-ray bursts and other surface phenomena are largely independent of the strength
  of deep crustal heating. The unexpectedly short recurrence times, of the order of
  years, observed for very energetic thermonuclear superbursts are therefore not an
  indicator of a hot crust, but may point instead to an unknown local heating mechanism
  near the neutron star surface.
