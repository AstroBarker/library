abstract: We investigate the chemodynamic effects of multiple supernova (SN) explosions
  in the central region of primordial galaxies (e.g., M~108Msolar halo at z~10) using
  three-dimensional hydrodynamic simulations of the inhomogenous interstellar medium
  down to parsec scales. We find that the final protogalactic structure and metal
  distribution depend strongly on the number of SNe. Specifically, 1000 SNe after
  an instantaneous burst of star formation are sufficient to almost completely blow
  away the gas in these systems, whereas 100 SN explosions trigger the collapse of
  the protogalactic cloud, leading to the formation of a cold, dense clumpy disk (n>300
  cm-3) with metallicity Z=4\texttimes{}10-4Zsolar. These results imply that the metallicity
  of the ``second generation'' of stars could be Z~10-4Zsolar, and that the environment
  to form metal-free stars in protogalaxies may be lost relatively quickly (<~107
  yr) after the first burst of Z=0 star formation. The recently discovered ultra-metal-poor
  star (Christlieb et al.) may represent surviving members of such second-generation
  star formation.
