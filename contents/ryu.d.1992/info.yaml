abstract: A normal mode analysis for nonaxisymmetric perturbations in a thin, differentially
  rotating disk with a vertical structure that is isothermal and convectively unstable
  is performed. The vertical gravity is assumed to be external and constant. The perturbation
  scale is assumed to be much shorter than the radius of the disk but comparable to
  or less than the thickness. The initial value problem is formulated in shearing
  coordinates. Dispersion relations are obtained for the three limiting cases of zero
  shear, axisymmetric perturbations, and small radial wavelengths. The full effects
  of shear are studied by integrating numerically the initial value problem. Nonaxisymmetric
  local Fourier modes are found to have a radial wavenumber that increases linearly
  with time in proportion to the shear times the azimuthal wavenumber. While Coriolis
  forces exert stabilizing effects on the convective modes, reducing their growth
  rate and the range of unstable wavelengths, shear has destablizing effects inasmuch
  as it reduces the epicyclic frequency at a given angular velocity. In a Keplerian
  disk, perturbations with azimuthal wavelengths about 2 times smaller than vertical
  wavelengths grow exponentially.
