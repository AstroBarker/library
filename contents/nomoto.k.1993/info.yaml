abstract: The optical lightcurve of SN 1993J is atypical for type II SNs; the light
  curve around the second maximum resembles that of the type Ib SN 1983N, whose progenitor
  may have been a He star. The secondary brightening and decay of the light curve
  can be seen as due to the radioactive decay of Co-56; the progenitor may in view
  of this have been a red supergiant with thin, H-rich envelope. It follows that the
  spectrum will evolve from type II to type Ib, justifying SN 1993J's classification
  as type IIb.
