abstract: The role of ion-ion correlations in suppressing neutrino-nucleus elastic
  scattering during stellar core collapse is reinvestigated, using two different equations
  of state. We test the improved description by Itoh et al. against the treatment
  suggested by Horowitz and find that the stronger cross-section reduction for small
  momentum transfer in the former case does not lead to noticeable changes of the
  core deleptonization and entropy increase during collapse, because the improvements
  are relevant below neutrino trapping conditions only for very low neutrino energies,
  corresponding to a very small phase-space volume. Treating screening effects for
  ionic mixtures by the linear mixing rule applied to the collection of representative
  heavy nucleus, alpha particles, and free nucleons, which is assumed to characterize
  the composition in nuclear statistical equilibrium, we cannot determine mentionable
  differences during stellar collapse, because alpha particles are not sufficiently
  abundant, and their coherent scattering opacity is too small.
