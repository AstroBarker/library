abstract: The origin and development of the Rayleigh-Taylor (R-T) instability is studied
  using an axisymmetric two-dimensional hydrodynamic code. It is observed that mushroomlike
  structures appear 2000 s after the blast shock and the R-T instability starts to
  grow at the H/He interface. These results correlate well with the Arnett et al.
  (1989) data. The extent of mixing in the ejecta of SN 1987A and the relation between
  R-T instability and mixing are examined.
