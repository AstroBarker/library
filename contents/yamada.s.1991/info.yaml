abstract: 'Matter mixing by Rayleigh-Taylor instability in the jetlike supernova explosion
  is studied by numerical calculations of 2D hydrodynamics. It is found that: (1)
  the asymmetric explosion with 5 percent initial perturbation causes the same degree
  of matter mixing as the spherical one with 30 percent perturbation; and that (2)
  30 percent initial perturbation in the jetlike explosion is sufficient to explain
  the mixing in SN 1987 A suggested by many observations without any subsequent instability
  such as nickel bubble formation.'
