abstract: Three-dimensional (3D) simulations of core-collapse supernovae (CCSNe) are
  granting new insight into the as-yet-uncertain mechanism that drives successful
  explosions. While there is still debate about whether explosions are obtained more
  easily in 3D than in 2D, it is undeniable that there exist qualitative and quantitative
  differences between the results of 3D and 2D simulations. We present an extensive
  set of high-resolution 1D, 2D, and 3D CCSN simulations with multispecies neutrino
  leakage carried out in two different progenitors. Our simulations confirm the results
  of Couch indicating that 2D explodes more readily than 3D. We argue that this is
  due to the inadequacies of 2D to accurately capture important aspects of the 3D
  dynamics. We find that without artificially enhancing the neutrino heating rate,
  we do not obtain explosions in 3D. We examine the development of neutrino-driven
  convection and the standing accretion shock instability (SASI) and find that, in
  separate regimes, either instability can dominate. We find evidence for growth of
  the SASI for both 15 M \&sun; and 27 M \&sun; progenitors; however, it is weaker
  in 3D exploding models. The growth rate of both instabilities is artificially enhanced
  along the symmetry axis in 2D as compared with our axis-free 3D Cartesian simulations.
  Our work highlights the growing consensus that CCSNe must be studied in 3D if we
  hope to solve the mystery of how the explosions are powered.
