abstract: 'Context: The mass loss from Wolf-Rayet (WR) stars is of fundamental importance
  for the final fate of massive stars and their chemical yields. Its Z-dependence
  is discussed in relation to the formation of long-duration Gamma Ray Bursts (GRBs)
  and the yields from early stellar generations. However, the mechanism of formation
  of WR-type stellar winds is still under debate.  Aims: We present the first fully
  self-consistent atmosphere/wind models for late-type WN stars. We investigate the
  mechanisms leading to their strong mass loss, and examine the dependence on stellar
  parameters, in particular on the metallicity Z.  Methods: We perform a systematic
  parameter study of the mass loss from WNL stars, utilizing a new generation of hydrodynamic
  non-LTE model atmospheres. The models include a self-consistent treatment of the
  wind hydrodynamics, and take Fe-group line-blanketing and clumping into account.
  They thus allow a realistic modelling of the expanding atmospheres of WR stars.
  The results are verified by comparison with observed WNL spectra.  Results: We identify
  WNL stars as very massive stars close to the Eddington limit, potentially still
  in the phase of central H-burning. Due to their high L/M ratios, these stars develop
  optically thick, radiatively driven winds. These winds show qualitatively different
  properties than the thin winds of OB stars. The resultant mass loss depends strongly
  on Z, but also on the Eddington factor Gamma\_e, and the stellar temperature T\_star.
  We combine our results in a parametrized mass loss recipe for WNL stars.  Conclusions:
  According to our present model computations, stars close to the Eddington limit
  tend to form strong WR-type winds, even at very low Z. Our models thus predict an
  efficient mass loss mechanism for low metallicity stars. For extremely metal-poor
  stars, we find that the self-enrichment with primary nitrogen can drive WR-type
  mass loss. These first WN stars might play an important role in the enrichment of
  the early ISM with freshly produced nitrogen.'
