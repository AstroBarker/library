abstract: The discovery of GW170817 with gravitational waves (GWs) and electromagnetic
  (EM) radiation has provoked new questions in strong-gravity astrophysics. Importantly,
  it remains unknown whether the progenitor of the merger comprised two neutron stars
  (NSs), or a NS and a black hole (BH). Using new numerical-relativity simulations
  and incorporating modeling uncertainties we produce novel GW and EM observables
  for NS-BH mergers with similar masses. Distinguishing the progenitor nature from
  GW or EM measurements alone is challenging; however, a joint analysis reveals that
  if GW170817 is a NS-BH merger, > 60\% of the allowed parameters are incompatible
  with EM observations
