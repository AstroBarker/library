abstract: We numerically calculate equilibrium configurations of uniformly rotating
  and charged neutron stars, in the case of insulating material and neglecting the
  electromagnetic forces acting on the equilibrium of the fluid. This allows us to
  study the behaviour of the gyromagnetic ratio for those objects when varying rotation
  rate and equation of state for the matter. Under the assumption of low charge and
  incompressible fluid, we find that the gyromagnetic ratio is directly proportional
  to the compaction parameter M/R of the star, and very little dependent on its angular
  velocity. Nevertheless, it seems impossible to have g = 2 for these models with
  low charge-to-mass ratio, where matter consists of a perfect fluid and the collapse
  limit is never reached.
