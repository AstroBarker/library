abstract: Convective model envelopes of two RR Lyrae stars are constructed, one centrally
  located in the instability strip, and one just beyond the red edge of the strip.
  Steady state solutions and small amplitude oscillations are studied using a nonlinear
  pulsation code. We find that convection has only a small effect on the stability
  of the hotter model, primarily due to turbulent pressure work (net driving) in the
  hydrogen ionization zone. The cooler model, however, shows strong reduction in both
  hydrogen and helium ionization driving, which quenches the pulsation. This effect
  is not directly attributable to convective PdV work, but probably reflects changes
  in structure and phase relations in the envelope due to convection.
