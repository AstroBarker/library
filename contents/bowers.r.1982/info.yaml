abstract: A method for calculating stellar core collapse is discussed which emphasizes
  physical approximations and numerical methods. Collapse is modeled in terms of hydrodynamics
  coupled to radiation transport of all neutrino types. The latter are not assumed
  to be in thermal equilibrium. Analytic approximations used for the equations of
  state are discussed. The overall approach includes all of the physical processes
  which we believe are important for stellar core collapse.
