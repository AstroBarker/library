abstract: We combine Halpha emission-line and infrared (IR) continuum measurements
  of two samples of nearby galaxies to derive dust attenuation-corrected star formation
  rates (SFRs). We use a simple energy balance based method that has been applied
  previously to H II regions in the Spitzer Infrared Nearby Galaxies Survey, and extend
  the methodology to integrated measurements of galaxies. We find that our composite
  Halpha + IR based SFRs are in excellent agreement with attenuation-corrected SFRs
  derived from integrated spectrophotometry, over the full range of SFRs (0.01-80
  M sun yr-1) and attenuations (0-2.5 mag) studied. We find that the combination of
  Halpha and total IR luminosities provides the most robust SFR measurements, but
  combinations of Halpha measurements with monochromatic luminosities at 24 mum and
  8 mum perform nearly as well. The calibrations differ significantly from those obtained
  for H II regions, with the difference attributable to a more evolved population
  of stars heating the dust. Our results are consistent with a significant component
  of diffuse dust (the "IR cirrus" component) that is heated by a non-star-forming
  population. The same methodology can be applied to [O II]lambda3727 emission-line
  measurements, and the radio continuum fluxes of galaxies can be applied in place
  of IR fluxes when the latter are not available. We assess the precision and systematic
  reliability of all of these composite methods.
