abstract: 'Gamma-ray burst (GRB) research has undergone a revolution in the last two
  years. The launch of Swift, with its rapid slewing capability, has greatly increased
  the number and quality of GRB localizations and x-ray and optical afterglow lightcurves.
  Over 160 GRBs have been detected, and nearly all have been followed up with the
  on-board narrow field telescopes. Advances in our understanding of short GRBs have
  been spectacular. The detection of x-ray afterglows has led to accurate localizations
  from ground based observatories, which have given host identifications and redshifts.
  Theoretical models for short GRB progenitors have, for the first time, been placed
  on a sound foundation. The hosts for the short GRBs differ in a fundamental way
  from the long GRB hosts: short GRBs tend to occur in non-star forming galaxies or
  regions, whereas long GRBs are strongly concentrated within star forming regions.
  Observations are consistent with a binary neutron star merger model, but other models
  involving old stellar populations are also viable. Swift has greatly increased the
  redshift range of GRB detection. The highest redshift GRBs, at z~5 6, are approaching
  the era of reionization. Ground-based deep optical spectroscopy of high redshift
  bursts is giving metallicity measurements and other information on the source environment
  to much greater distance than other techniques. The localization of GRB 060218 to
  a nearby galaxy, and association with SN 2006aj, added a valuable member to the
  class of GRBs with a detected supernova. The prospects for future progress are excellent
  given the >10 year orbital lifetime of the Swift satellite.'
