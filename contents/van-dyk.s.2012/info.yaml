abstract: Reports of the death of the precursor of supernova (SN) 1961V in NGC 1058
  are exaggerated. Consideration of the best astrometric data shows that the star,
  known as "Object 7," lies at the greatest proximity to SN 1961V and is the likely
  survivor of the "SN impostor" super-outburst. SN 1961V does not coincide with a
  neighboring radio source and is therefore not a radio SN. Additionally, the current
  properties of Object 7, based on data obtained with the Hubble Space Telescope,
  are consistent with it being a quiescent luminous blue variable (LBV). Furthermore,
  post-explosion non-detections by the Spitzer Space Telescope do not necessarily
  and sufficiently rule out a surviving LBV. We therefore consider, based on the available
  evidence, that it is still a bit premature to reclassify SN 1961V as a bona fide
  SN. The inevitable demise of this star, though, may not be too far off.  Based on
  observations made with the NASA/ESA Hubble Space Telescope, obtained in part from
  the data archive of the Space Telescope Science Institute, which is operated by
  the Association of Universities for Research in Astronomy, Inc., under NASA contract
  NAS 5-26555.
