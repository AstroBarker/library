abstract: A new improved nuclear partition function is employed to calculate the nuclear
  statistical equilibrium (NSE) in core-collapse supernova environment. The results
  show that the change of nucleus abundance is slight even though the temperature
  is higher than 1011 K when shock propagates, which indicates that the effect of
  the nuclear partition function is not so important as shown in the previous calculations,
  but it can also be considered in detailed simulation if it is sensitive to weak
  interaction rates in core-collapse supernova.
