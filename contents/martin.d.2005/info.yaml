abstract: We give an overview of the Galaxy Evolution Explorer (GALEX), a NASA Explorer
  Mission launched on 2003 April 28. GALEX is performing the first space UV sky survey,
  including imaging and grism surveys in two bands (1350-1750 and 1750-2750 {\AA}).
  The surveys include an all-sky imaging survey (mAB~=20.5), a medium imaging survey
  of 1000 deg2 (mAB~=23), a deep imaging survey of 100 deg2 (mAB~=25), and a nearby
  galaxy survey. Spectroscopic (slitless) grism surveys (R=100-200) are underway with
  various depths and sky coverage. Many targets overlap existing or planned surveys
  in other bands. We will use the measured UV properties of local galaxies, along
  with corollary observations, to calibrate the relationship of the UV and global
  star formation rate in local galaxies. We will apply this calibration to distant
  galaxies discovered in the deep imaging and spectroscopic surveys to map the history
  of star formation in the universe over the redshift range 0<z<2 and probe the physical
  drivers of star formation in galaxies. The GALEX mission includes a guest investigator
  program, supporting the wide variety of programs made possible by the first UV sky
  survey.
