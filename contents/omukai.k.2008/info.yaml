abstract: Primordial gas in protogalactic DM halos with virial temperatures Tvirgtrsim
  104 K begins to cool and condense via atomic hydrogen. Provided that this gas is
  irradiated by a strong UV flux and remains free of H2 and other molecules, it has
  been proposed that the halo with Tvir ~ 104 K may avoid fragmentation and lead to
  the rapid formation of an SMBH as massive as M \approx{} 105-106 M\&sun;. This "head
  start" would help explain the presence of SMBHs with inferred masses of several
  times 109 M\&sun;, powering the bright quasars discovered in the SDSS at redshift
  zgtrsim 6. However, high-redshift DM halos with Tvir ~ 104 K are likely already
  enriched with at least trace amounts of metals and dust produced by prior star formation
  in their progenitors. Here we study the thermal and chemical evolution of low-metallicity
  gas exposed to extremely strong UV radiation fields. Our results, obtained in one-zone
  models, suggest that gas fragmentation is inevitable above a critical metallicity,
  whose value is between Zcr \approx{} 3 \texttimes{} 10-4 Z\&sun; (in the absence
  of dust) and as low as Zcr \approx{} 5 \texttimes{} 10-6 Z\&sun; (with a dust-to-gas
  mass ratio of about 0.01Z/Z\&sun;). We propose that when the metallicity exceeds
  these critical values, dense clusters of low-mass stars may form at the halo nucleus.
  Relatively massive stars in such a cluster can then rapidly coalesce into a single
  more massive object, which may produce an intermediate-mass BH remnant with a mass
  up to Mlesssim 102-103 M\&sun;.
