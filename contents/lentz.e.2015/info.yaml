abstract: We have performed ab initio neutrino radiation hydrodynamics simulations
  in three and two spatial dimensions (3D and 2D) of core-collapse supernovae from
  the same 15 M \&sun; progenitor through 440 ms after core bounce. Both 3D and 2D
  models achieve explosions; however, the onset of explosion (shock revival) is delayed
  by ~100 ms in 3D relative to the 2D counterpart and the growth of the diagnostic
  explosion energy is slower. This is consistent with previously reported 3D simulations
  utilizing iron-core progenitors with dense mantles. In the ~100 ms before the onset
  of explosion, diagnostics of neutrino heating and turbulent kinetic energy favor
  earlier explosion in 2D. During the delay, the angular scale of convective plumes
  reaching the shock surface grows and explosion in 3D is ultimately lead by a single,
  large-angle plume, giving the expanding shock a directional orientation not dissimilar
  from those imposed by axial symmetry in 2D simulations. We posit that shock revival
  and explosion in the 3D simulation may be delayed until sufficiently large plumes
  form, whereas such plumes form more rapidly in 2D, permitting earlier explosions.
