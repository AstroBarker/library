abstract: Gamma-ray bursts (GRBs) are produced by rare types of massive stellar explosion.
  Their rapidly fading afterglows are often bright enough at optical wavelengths that
  they are detectable at cosmological distances. Hitherto, the highest known redshift
  for a GRB was z = 6.7 (ref. 1), for GRB080913, and for a galaxy was z = 6.96 (ref.
  2). Here we report observations of GRB090423 and the near-infrared spectroscopic
  measurement of its redshift, z = . This burst happened when the Universe was only
  about 4 per cent of its current age. Its properties are similar to those of GRBs
  observed at low/intermediate redshifts, suggesting that the mechanisms and progenitors
  that gave rise to this burst about 600,000,000years after the Big Bang are not markedly
  different from those producing GRBs about 10,000,000,000years later.
