abstract: We study the evolution of a supernova core from the beginning of the gravitational
  collapse of a 15 Msolar star up to 1 s after core bounce. We present results of
  spherically symmetric simulations of core-collapse supernovae by solving general
  relativistic nu-radiation hydrodynamics in the implicit time differencing. We aim
  to explore the evolution of shock waves in the long term and investigate the formation
  of proto-neutron stars together with supernova neutrino signatures. These studies
  are done to examine the influence of the equation of state (EOS) on the postbounce
  evolution of shock waves in the late phase and the resulting thermal evolution of
  proto-neutron stars. We compare two sets of EOSs, namely, those by Lattimer and
  Swesty (LS-EOS) and by Shen et al. (SH-EOS). We found that, for both EOSs, the core
  does not explode and the shock wave stalls similarly in the first 100 ms after bounce.
  A revival of the shock wave does not occur even after a long period in either case.
  However, the recession of the shock wave appears different beyond 200 ms after bounce,
  having different thermal evolution of the central core. A more compact proto-neutron
  star is found for LS-EOS than SH-EOS with a difference in the central density by
  a factor of ~2 and a difference of ~10 MeV in the peak temperature. The resulting
  spectra of supernova neutrinos are different to an extent that may be detectable
  by terrestrial neutrino detectors.
