abstract: '{This book introduces the modern field of 3+1 numerical relativity. It
  has been written in a way as to be as self-contained as possible, and assumes a
  basic knowledge of special relativity. Starting from a brief introduction to general
  relativity, it discusses the different concepts and tools necessary for the fully
  consistent numerical simulation of relativistic astrophysical systems, with strong
  and dynamical gravitational fields. Among the topics discussed in detail are the
  following: the initial data problem, hyperbolic reductions of the field equations,
  gauge conditions, the evolution of black hole space-times, relativistic hydrodynamics,
  gravitational wave extraction, and numerical methods. There is also a final chapter
  with examples of some simple numerical space-times.}'
