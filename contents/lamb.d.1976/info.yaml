abstract: Transport relaxation times are calculated for elastic scattering of degenerate
  neutrinos from free nucleons and electrons as well as for coherent elastic scattering
  of degenerate neutrinos from nuclei during stellar collapse. An expression is obtained
  for the energy loss per collision suffered by neutrinos in such scattering, and
  the effect of neutrino degeneracy on the neutrino opacities is investigated. It
  is found that neutrino degeneracy reduces neutrino-electron scattering, but has
  little effect on scattering from free nucleons or coherent scattering from nuclei.
  This finding indicates that scattering from free nucleons and coherent scattering
  from nuclei are the dominant neutrino opacities in collapsing stellar cores at the
  highest neutrino energies, regardless of how degenerate the neutrinos are. The neutrino
  mean free path for such scattering is shown to be much less than the core radius
  if neutrino energies are greater than a few MeV, independent of the degree of core
  neutronization and the degree of neutrino degeneracy. These results suggest that
  neutrinos may flow out from the core very slowly, neutrino degeneracy cannot markedly
  increase the flow, and such degeneracy may do little to remove current difficulties
  encountered in the neutrino-transport model of supernovae.
