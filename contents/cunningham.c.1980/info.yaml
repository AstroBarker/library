abstract: We study the gravitational waves generated during the collapse of a slowly
  rotating, pressureless, constant density star. To first order in the rotation rate
  the perturbation is an odd-parity dipole and generates no gravitational waves. The
  first order perturbation, however, drives a quadrupole deformation which is second
  order in the rotation rate and which produces the radiation. Using a gauge invariant
  description, we derive the equations governing this second order perturbation. These
  equations are then applied to the case of the collapse of a slowly and uniformly
  rotating constant-density star following the sudden turnoff of pressure. Numerical
  results are given for the gravitational waveforms and energies generated.
