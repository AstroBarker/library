abstract: We have analyzed the magnetic effects that may occur in rapidly rotating
  core collapse supernovae. We consider effects from both magnetic turbulence and
  the formation of magnetic bubbles. For magnetic turbulence we have made a perturbative
  analysis for our spherically symmetric, core-collapse supernova model that incorporates
  the buildup of magnetic field energy in the matter accreting onto the proto-neutron
  star shortly after collapse and bounce. This significantly modifies the pressure
  profile and increases the heating of the material above the proto-neutron star resulting
  in an explosion even in rotating stars that would not explode otherwise. Regarding
  magnetic bubbles, we show that a model with an initial uniform magnetic field ~108
  G and uniform angular velocity of ~0.1 rad s-1 can form magnetic bubbles due to
  the very nonhomologous nature of the collapse. It is estimated that the buoyancy
  of the bubbles causes matter in the proto-neutron star to rise, carrying neutrino-rich
  material to the neutron star surface. This increases the neutrino luminosity sufficiently
  at early times to achieve a successful neutrino-driven explosion. Both magnetic
  mechanisms thus provide new means for initiating a Type II core-collapse supernova.
