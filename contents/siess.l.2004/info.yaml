abstract: We analyze the s-process nucleosynthesis in models of rotating AGB stars,
  using a complete nuclear network covering nuclei up to Polonium. During the stage
  of thermal pulses, the extreme shear field that develops at the base of the convective
  envelope leads to the injection of protons into the adjacent 12C-rich core. Subsequent
  proton captures lead to overlapping 14N-rich and 13C-rich layers.  While the 13C
  nuclei release neutrons due to alpha- captures during the interpulse phase, the
  persistence of mixing due to differential rotation produces a contamination of the
  whole 13C-rich layer with 14N. The result is a quenching of the s-process efficiency.
  Our study emphasizes the sensitivity of the s-process nucleosynthesis to the strength
  and duration of the shear mixing phase. Uncertainties in the rate of 13C(alpha,n)
  turn out to have small effects on the resultant distribution of s-elements. Finally,
  we show that in this framework, a deeper third dredge-up tends to further inhibit
  the production of s-elements.
