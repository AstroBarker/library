abstract: We have investigated the neutrino reactions via deuteron in the surface
  region of the supernova core. We evaluate the electron capture on deuterons and
  the neutrino emission from nucleon-nucleon scattering through the deuteron formation
  and found an important role of neutrino reactions with deuteron.
