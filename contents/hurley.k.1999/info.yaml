abstract: We present interplanetary network localization information for 218 gamma-ray
  bursts in the third BATSE catalog obtained by analyzing the arrival times of these
  bursts with the Ulysses and Compton Gamma Ray Observatory spacecraft. For any given
  burst observed by these two spacecraft, arrival time analysis (or ``triangulation'')
  results in an annulus of possible arrival directions whose half-width varies between
  7" and 32', depending on the intensity and time history of the burst and the distance
  of the Ulysses spacecraft from Earth. This annulus generally intersects the BATSE
  error circle, which results in an average reduction of a factor of 30 of the error
  box area.
