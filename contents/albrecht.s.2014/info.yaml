abstract: As part of the Binaries Are Not Always Neatly Aligned project (BANANA),
  we have found that the eclipsing binary CV Velorum has misaligned rotation axes.
  Based on our analysis of the Rossiter-McLaughlin effect, we find sky-projected spin-orbit
  angles of betap = -52$\,^{\circ}$ \$\pm\$ 6\$\,^{\circ}\$ and betas = 3\$\,^{\circ}\$
  \$\pm\$ 7\$\,^{\circ}\$ for the primary and secondary stars (B2.5V + B2.5V, P =
  6.9 days). We combine this information with several measurements of changing projected
  stellar rotation speeds (vsin i sstarf) over the last 30 yr, leading to a model
  in which the primary star's obliquity is \approx{}65\$\,^{\circ}\$, and its spin
  axis precesses around the total angular momentum vector with a period of about 140
  yr. The geometry of the secondary star is less clear, although a significant obliquity
  is also implicated by the observed time variations in the vsin i sstarf. By integrating
  the secular tidal evolution equations backward in time, we find that the system
  could have evolved from a state of even stronger misalignment similar to DI  Herculis,
  a younger but otherwise comparable binary.  Based on observations made with ESOs
  2.2 m Telescopes at the La Silla Paranal Observatory under programme ID 084.C-1008
  and under MPIA guaranteed time.
