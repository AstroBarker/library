abstract: Hydrodynamic calculations beginning from an 8-solar-mass helium-burning
  stellar evolutionary model are performed to investigate the initial stage of gravitational
  collapse of a stellar core through initial neutronization and up to core bounce.
  Weak-interaction processes are treated individually by reaction network techniques,
  neutrino transport is regarded as multigroup flux-limited diffusion, and scattering
  of neutrinos by electrons is considered to be 'nonconservative'. The physics of
  the problem is reviewed, emphasizing nuclear partition functions and important uncertainties.
  Some numerical results are presented which illustrate the temporal behavior of the
  radii of individual mass zones until core bounce, which give an overview of the
  collapse, and which indicate the structure of one model near core bounce. The dynamical
  and compositional structures of this model are discussed along with the neutrino
  opacity and scattering depth, the neutrino luminosity, thermalization of the neutrinos,
  neutrino degeneracy, and the neutronization region. It is suggested that the ultimate
  resolution of the question of how supernovae explode may be related to the behavior
  of the reflected shock at core bounce.
