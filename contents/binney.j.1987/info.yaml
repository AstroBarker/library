abstract: A comprehensive review of the theory of galactic dynamics is presented.
  Key empirical facts about stellar systems are briefly reviewed, and the ingredients
  needed to construct galaxy models are assembled, including potential theory, stellar
  orbits, and the theory of the equilibrium configurations of stellar systems. The
  stability of these configurations and the theory of spiral structures are discussed.
  Collisions and encounters between stellar systems are considered, and two-body realization
  and the approach to statistical equilibrium in star clusters are addressed. It is
  shown how the observable properties of galaxies such as their luminosities and colors
  are changed by the aging of their constituent stellar populations. Finally, it is
  shown that most of the mass in the universe is locked up in some still invisible
  form.
