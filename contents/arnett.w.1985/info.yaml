abstract: The immediate progenitor of a Type I supernova (SN I) is thought to be a
  mass-accreting carbon-oxygen (C-O) white dwarf in a binary system. In the supernova
  explosion the C-O fuel is partly incinerated to radioactive 56Ni. The optical luminosity
  results from the trapping and thermalization of the gamma rays and positrons emitted
  by the decay of 56Ni through 56Co to 56Fe. The authors estimate the amount of 56Ni
  synthesized and the corresponding peak luminosity of a SN I from the model. This
  estimate is combined with the observed Hubble diagram of SN I to derive the value
  of the Hubble constant H0. It is found that H0 is in the range 39 - 73 km s-1Mpc-1
  with a best estimate of 59 km s-1Mpc-1.
