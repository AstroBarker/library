abstract: We derive interpolation formulae for a third-order finite difference method
  in curvilinear, orthogonal coordinate systems. These formulae serve as a supplement
  to Colella and Woodward's PPM scheme for problems where the coordinate origin is
  included in the computational domain. Numerical examples of the improved accuracy
  of the advection scheme near coordinate singularities are shown.
