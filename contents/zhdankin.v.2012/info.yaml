abstract: 'The statistical properties of magnetic discontinuities in the solar wind
  are investigated by measuring fluctuations in the magnetic field direction, given
  by the rotation Deltatheta that the magnetic field vector undergoes during time
  interval Deltat. We show that the probability density function, P(Deltatheta), can
  be described by a simple model in which the magnetic field vector purely rotates
  with a relative increment DeltaB/B that is lognormally distributed. We find that
  the probability density function of increments, P(DeltaB/B), has a remarkable scaling
  property: the normalized variable x = (DeltaB/B) \cdot{} (Deltat/Deltat 0)-alpha
  has a universal lognormal distribution for all time intervals Deltat. We then compare
  measurements from the solar wind with those from direct numerical simulations of
  magnetohydrodynamic (MHD) turbulence. We find good agreement for P(Deltatheta) obtained
  in the two cases when the magnetic guide field to fluctuations ratio B 0/b rms is
  chosen accordingly. However, the scale invariance of P(DeltaB/B) is broken in the
  MHD simulations with relatively limited inertial interval, which causes P(Deltatheta)
  to scale with measurement interval differently than in the solar wind.'
