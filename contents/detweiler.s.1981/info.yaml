abstract: Homogeneous ellipsoids are used to model the gravitational collapse of a
  stellar core and the subsequent emission of gravitational radiation. The growth
  of asymmetry caused by the collapse is computed along with the flux and energy spectrum
  of the gravitational radiation produced as the ellipsoid evolves toward an axisymmetric
  state following the collapse. In the very low angular momentum limit it is found
  that a 1 solar mass core of radius equals 1,000,000 cm and angular velocity equals
  1,000/sec should emit gravitational radiation by this mechanism with a total energy
  of approximately 0.0000001 Mc-squared, at a frequency of 1600 Hz and a bandwidth
  of only about 1.6 Hz.
