abstract: Possibilities for the development of an r-process in the helium shell of
  a supernova under the action of free neutrons appearing as a result of inelastic
  neutrino scattering by 4He nuclei are investigated. The conditions in the outer
  part of the helium shell in metal-poor stars are shown to be favorable for the reproduction
  of a weak r-process component.
