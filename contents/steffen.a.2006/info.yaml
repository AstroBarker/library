abstract: We present partial-correlation analyses that examine the strengths of the
  relationships between l2500{\AA}, l2keV, alphaOX, and redshift for optically selected
  active galactic nuclei (AGNs). We extend the work of Strateva and coworkers, which
  analyzed optically selected AGNs from the Sloan Digital Sky Survey (SDSS), by including
  52 moderate-luminosity, optically selected AGNs from the COMBO-17 survey with corresponding
  deep (~250 ks to 1 Ms) X-ray observations from the Extended  Chandra Deep Field-South.
  The COMBO-17 survey extends ~3 mag deeper than the SDSS and probes the moderate-luminosity
  AGNs that numerically dominate the AGN population in the universe. We also include
  recently published observations of 19 high-redshift, optically selected AGNs and
  46 luminous, low-redshift AGNs from the Bright Quasar Survey. The full sample used
  in our analysis consists of 333 AGNs, extending out to z~6, with 293 (88\%) having
  X-ray detections. The sample spans five decades in UV luminosity and four decades
  in X-ray luminosity. We confirm that alphaOX is strongly anticorrelated with l2500{\AA}
  (13.6 sigma), the highest significance found for this relation to date, and find
  evidence suggesting that the slope of this relation may be dependent on l2500{\AA}.
  We find that no significant correlation exists between alphaOX and redshift (1.3
  sigma) and constrain the maximum evolution of AGN UV-to-X-ray flux ratios to be
  less than 30\% (1 sigma) out to z=5. Using our sample's high X-ray detection fraction,
  we also find a significant anticorrelation (3.0 sigma) between alphaOX and l2keV.
  We make comparisons to earlier studies on this topic and discuss implications for
  X-ray and optical AGN luminosity functions.
