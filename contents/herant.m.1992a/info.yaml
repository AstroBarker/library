abstract: A comprehensive study is presented of the postexplosion hydrodynamics of
  the ejecta of SN 1987A encompassing the Rayleigh-Taylor instabilities at the shell
  interfaces and the dynamical effects of the energy input due to the radioactive
  decay of Ni-56 and Co-56. The dependence of the hydrodynamical behavior on progenitor
  structure, initial perturbations, explosion energy, and dimensionality of the numerical
  simulation is investigated in order to explain the observed high-velocity wings
  of the iron line of SN 1987A. It is shown that none of these factors leads to the
  required high-velocity tail of iron. When nickel is artificially premixed in the
  initial model, it is found that this early mixing has to affect the inner 1.5 solar
  mass of the ejecta to reproduce the high-velocity wings at a time of 90 d. It is
  argued that the high-entropy bubble associated with the delayed mechanism is responsible
  for this premixing by driving convective motions early in the explosion.
