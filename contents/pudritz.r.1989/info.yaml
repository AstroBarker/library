abstract: A model for protogalactic star-forming regions is presented that assumes
  that self-gravitating isothermal clouds form by gravitational instability of cooling,
  shocked gas layers in the protogalaxy. This pregalactic environment is ideal for
  a dynamo mechanism to be operative. The dynamo requires a seed field whose origin
  is described. The results are applied to the problem of protogalactic star formation.
  The implications of the model for observations of protogalaxies and protogalactic
  magnetic fields are described.
