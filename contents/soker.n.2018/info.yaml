abstract: I find that an ingredient that was added in a recent study to facilitate
  the delayed neutrino explosion mechanism of core collapse supernovae, namely, large
  scale perturbations in the pre-collapse core, has a larger positive influence on
  the jittering jets explosion mechanism. By following the specific angular momentum
  of the accreted mass on to the newly born neutron star, I find that the accreted
  mass is likely to form intermittent accretion belts and disks, although they might
  lack axisymmetrical structure. These accretion belts and disks are likely to launch
  jets, but this can be simulated only if magnetic fields are included in the numerical
  code, as well as high numerical resolution that follows the rotation of the newly
  born neutron star and the shear in the accretion flow. I also discuss the possibility
  that the rotation of the pre-collapse core is important in increasing the shear
  in the accretion flow, hence the amplification of the magnetic fields. I repeat
  again my call for a paradigm shift from a neutrino-driven to a jet-driven explosion
  mechanism of massive stars. Such a paradigm shift will bring the recognition that
  to simulate core collapse supernovae one must use magneto-hydrodynamical numerical
  codes.
