abstract: We present a synthetic algorithm to rapidly calculate nucleosynthetic yields
  from populations of single and binary stars for use in population synthesis, globular
  cluster and Galactic chemical evolution simulations. Single star nucleosynthesis
  is fitted directly to full evolution models and our model includes first, second
  and third dredge-ups with s-process enhancements, an analytic calculation for hot-bottom
  burning of CNO, NeNa and MgAl isotopes, surface enhancements due to wind loss in
  massive stars and core-collapse supernova yields. Even though this algorithm operates
  about 107 times faster than full evolution and nucleosynthesis calculations, agreement
  with such models is good. We extend the single star model to include prescriptions
  of binary star interactions, notably mass loss and gain by stellar winds and Roche-lobe
  overflow, novae and type Ia supernovae. As examples of the application of our algorithm
  we present models of some interesting systems containing chemically peculiar stars
  that may occur in binaries.
