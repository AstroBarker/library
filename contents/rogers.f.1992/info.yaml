abstract: New radiative Rosseland mean opacity tables calculated with the OPAL code
  are presented. Extensive results are given for the recent mixture of Anders-Grevesse
  (1989) which allow accurate interpolation in temperature, density, hydrogen mass
  fraction, and metal mass fraction. The range of the constant R and temperature are
  such as to cover typical stellar conditions from the interior through the envelope
  and the hotter atmospheres. For comparison purposes, some opacity table for the
  Ross-Aller and Cox-Tabor metal abundances are presented. Although in many regions
  the OPAL opacities are similar to previous work, significant differences are reported.
  For example, factors of 2-3 opacity enhancements are found in stellar envelope conditions.
