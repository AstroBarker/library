abstract: It is pointed out here that neutron-star collisions should synthesize neutron-rich
  heavy elements, thought to be formed by rapid neutron capture (the r-process). Furthermore,
  these collisions should produce neutrino bursts and resultant bursts of gamma rays;
  the latter should comprise a subclass of observable gamma-ray bursts. It is argued
  that observed r-process abundances and gamma-ray burst rates predict rates for these
  collisions that are both significant and consistent with other estimates.
