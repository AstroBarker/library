abstract: 'We implement a code to find the gravitational news at future null infinity
  by using data from a Cauchy code as boundary data for a characteristic code. This
  technique of Cauchy characteristic extraction (CCE) allows for the unambiguous extraction
  of gravitational waves from numerical simulations. We first test the technique on
  non-radiative spacetimes: Minkowski spacetime, perturbations of Minkowski spacetime
  and static black hole spacetimes in various gauges. We show the convergence and
  limitations of the algorithm and illustrate its success in cases where other wave
  extraction methods fail. We further apply our techniques to a standard radiative
  test case for wave extraction, a linearized Teukolsky wave, presenting our results
  in comparison to the Zerilli technique, and we argue for the advantages of our method
  of extraction.'
