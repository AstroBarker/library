abstract: The authors present flux-calibrated spectra of the Halpha region for SN
  1987A at 3 {\AA} resolution, covering the period 1987 February 25 to June 14, the
  first 111 days of SN 1987A. They find that Halpha in SN 1987A shows an undisturbed
  P Cyg-type profile until March 15, superimposed by variable fine-structure after
  that date, developing within a few days into a blueshifted peak-like flux excess
  at -5000 km s-1 and a redshifted flux deficiency at +4400 km s-1. Both features
  move towards smaller radial velocity with time. The observed line profile structure
  is very likely to be caused by scattered Halpha photons. Similar fine-structure
  is also observed at Na I-D and at Paschen-alpha. The authors discuss their observations
  in terms of possible relations to speckle observations ("mystery spot") and of models
  involving a jet or interactions with surrounding pre-existing material.
