abstract: The author estimates the distances out to which various terrestrial neutrino
  detectors can see a stellar collapse. With these ranges, neutrino burst detection
  rates are obtained. The mean time between detections is expected to be rather long.
  A realistic estimate for this time is \equiv{}50 - 100 years. Whether this is indeed
  the case depends sensitively on the as yet unknown mean energy of the emitted neutrinos
  and the galactic collapse rate.
