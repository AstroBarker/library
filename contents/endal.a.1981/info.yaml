abstract: Models of rotating, 1 solar mass stars through the pre-main sequence and
  main sequence stages have been calculated. The calculations begin on the Hayashi
  track with rapid, rigid-body rotation, with angular momentum removed from the convective
  envelope to simulate the effect of the solar wind as the models evolve. Interior
  angular momentum redistribution by circulation flows and rotational instabilities
  is computed by a diffusion technique. It is found that at the present age of solar
  evolution, the models employed have internal rotation rates significantly larger
  than those allowed by measured solar oblateness, suggesting that the effects of
  circulation currents near the outer boundary of the radiative interior have been
  underestimated. An important result of this study is the implication that circulation
  currents produce deep mixing of such minor constituents as He-3 and C-13, perhaps
  also explaining the observed steady depletion of lithium during the main-sequence
  stage.
