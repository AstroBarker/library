abstract: We construct updated solar models with different sets of solar abundances,
  including the most recent determinations by Asplund et al. The latter work predicts
  a larger (~10\%) solar metallicity compared to previous measurements by the same
  authors but significantly lower (~25\%) than the recommended value from a decade
  ago by Grevesse \& Sauval. We compare the results of our models with determinations
  of the solar structure inferred through helioseismology measurements. The model
  that uses the most recent solar abundance determinations predicts the base of the
  solar convective envelope to be located at R CZ = 0.724 R sun and a surface helium
  mass fraction of Y surf = 0.231. These results are in conflict with helioseismology
  data (R CZ = 0.713 $\pm$ 0.001 R sun and Y surf = 0.2485 \$\pm\$ 0.0035) at 5sigma
  and 11sigma levels, respectively. Using the new solar abundances, we calculate the
  magnitude by which radiative opacities should be modified in order to restore agreement
  with helioseismology. We find that a maximum change of ~15\% at the base of the
  convective zone is required with a smooth decrease toward the core, where the change
  needed is ~5\%. The required change at the base of the convective envelope is about
  half the value estimated previously. We also present the solar neutrino fluxes predicted
  by the new models. The most important changes brought about by the new solar abundances
  are the increase by ~10\% in the predicted 13N and 15O fluxes that arise mostly
  due to the increase in the C and N abundances in the newly determined solar composition.
