abstract: The measurement of the cosmological parameters from Type Ia supernovae hinges
  on our ability to compare nearby and distant supernovae accurately. Here we present
  an advance on a method for performing generalized K-corrections for Type Ia supernovae
  that allows us to compare these objects from the UV to near-IR over the redshift
  range 0<z<2. We discuss the errors currently associated with this method and how
  future data can improve upon it significantly. We also examine the effects of reddening
  on the K-corrections and the light curves of Type Ia supernovae. Finally, we provide
  a few examples of how these techniques affect our current understanding of a sample
  of both nearby and distant supernovae.
