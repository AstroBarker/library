abstract: The effects of inhomogeneity on the emission of gravitational radiation
  from Jacobi configurations (uniformly rotating nonaxisymmetric configurations) are
  studied. If the equation of state is approximated by a polytropic relation, a neutron-star
  core with adiabatic index gamma lower than 3 can radiate up to a fraction about
  0.001 to 0.0001 of its mass-energy while passing through a Jacobi phase during its
  evolution. This maximum fraction drops to zero at gamma of above 9/4, where Jacobi
  configurations cease to exist in the polytropic approximation. While some of the
  results suggest that the fast pulsar PSR 1937 + 214 is hovering near the Jacobi
  bifurcation point, it appears more likely that the pulsar is not rotating sufficiently
  rapidly for this to be the case.
