abstract: The linear-eddy approach for modeling molecular mixing in turbulent flow
  involves stochastic simulation on a 1D domain with sufficient resolution to include
  all physically relevant lengthscales. In each realization, molecular diffusion is
  implemented deterministically, punctuated by a sequence of instantaneous, statistically
  independent 'rearrangement events' (measure-preserving maps) representing turbulent
  stirring. The model reproduces key features of scalar power spectra, including dependences
  of spectral amplitudes and transition wavenumbers on Reynolds and Schmidt numbers.
  Computed scaling exponents governing scalar powe spectra, higher-order fluctuation
  statistics such as structure functions, and the spatial distribution of scalar level
  crossings are close to measured exponents. It is inferred that the characterization
  of stirring as a sequence of independent events (the model analogue of eddies) leads
  to a useful representation of mixing-field microstructure.
