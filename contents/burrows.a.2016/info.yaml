abstract: We explore with self-consistent 2D Fornax simulations the dependence of
  the outcome of collapse on many-body corrections to neutrino-nucleon cross sections,
  pre-collapse seed perturbations, and inelastic neutrino-electron and neutrino-nucleon
  scattering. We show here for the first time that modest many-body corrections to
  neutrino-nucleon scattering, well-motivated by physics, make explosions easier in
  models of core-collapse supernovae. In this sense, realistic many-body corrections
  could be important missing pieces of physics needed to ensure robust supernova explosions.
  In addition, we find that imposed seed perturbations, while not necessarily determinative
  of explosion, can facilitate it and shorten its post-bounce emergence time. We now
  find that all our multi-D models with realistic physics explode by the neutrino
  heating mechanism. Proximity to criticality amplifies the role of even small changes
  in the neutrino-matter couplings, and such changes can together add to produce dramatic
  effects. When close to the critical condition the cumulative result of a few small
  effects (including seeds) that individually have only modest consequence can convert
  an anemic into a robust explosion, or even a dud into a blast. Such sensitivity
  is not seen in one dimension and may explain the apparent heterogeneity in the outcomes
  of detailed simulations performed internationally. A natural conclusion is that
  the different groups collectively are closer to a realistic understanding of the
  mechanism of core-collapse supernovae than might have seemed apparent.
