abstract: We present previously unpublished BVRI photometry of the Type Ia supernovae
  1999cc and 2000cf along with revised photometry of SN 1999cl. We confirm that SN
  1999cl is reddened by highly nonstandard dust, with RV=1.55+/-0.08. Excepting two
  quasar-lensing galaxies whose low values of RV are controversial, this is the only
  known object with a published value of RV less than 2.0. SNe 1999cl and 2000cf have
  near-infrared absolute magnitudes at maximum in good agreement with other Type Ia
  supernovae of midrange decline rates.  Based in part on observations at Apache Point
  Observatory, which is operated by the Astrophysical Research Consortium, and in
  part on observations with the Vatican Advanced Technology Telescope.
