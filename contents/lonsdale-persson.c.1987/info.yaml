abstract: The relationship between the integrated H-alpha flux and the far-IR flux
  of spiral disks is investigated. This relationship is found to have a similar dispersion
  to that between the far-IR and the blue flux, suggesting that the far-IR emission
  may be as closely linked to the interstellar radiation field from the old disk population
  as to very young OB associations. A large spread in the 60/100 micron color temperature
  and the IR excess (IRE) is found, and there is evidence that IRE decreases with
  increasing 60/100 micron color temperature. This supports the conclusion that nonionizing
  stars contribute to powering the far-IR emission. The far-IR spiral disk emission
  can be interpreted in terms of at least two thermal components with different temperatures.
  The low-IRE warm component comes from H II regions, while the high-IRE cool one
  is interpreted as 'cirruslike' emission. For the median spiral, cirruslike emission
  contributes 50-70 percent of the total far-IR flux of the disk.
