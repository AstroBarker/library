abstract: 'We analyze Swift gamma-ray bursts (GRBs) and X-ray afterglows for three
  GRBs with spectroscopic redshift determinations: GRB 050401, XRF 050416a, and GRB
  050525a. We find that the relation between spectral peak energy and isotropic energy
  of prompt emissions (the Amati relation) is consistent with that for the bursts
  observed in the pre-Swift  era. However, we find that the X-ray afterglow light
  curves, which extend up to 10-70 days, show no sign of the jet break that is expected
  in the standard framework of collimated outflows. We do so by showing that none
  of the X-ray afterglow light curves in our sample satisfy the relation between the
  spectral and temporal indices that is predicted for the phase after jet break. The
  jet break time can be predicted by inverting the tight empirical relation between
  the peak energy of the spectrum and the collimation-corrected energy of the prompt
  emission (the Ghirlanda relation). We find that there are no temporal breaks within
  the predicted time intervals in X-ray band. This requires either that the Ghirlanda
  relation has a larger scatter than previously thought, that the temporal break in
  X-rays is masked by some additional source of X-ray emission, or that it does not
  happen for some unknown reason.'
