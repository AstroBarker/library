abstract: Calculations of supernova explosion are made using the one-dimensional nonstationary
  equations of magnetic hydrodynamics for the case of cylindrical symmetry. The energy
  source is supposed to be the rotational energy of the system (the neutron star in
  the center and the surrounding envelope). The magnetic field plays the role of a
  mechanism of the transfer of rotational momentum. The calculations show that the
  envelope splits up during the dynamical evolution of the system, the main part of
  the envelope joins the neutron star and becomes uniformly rotating with it, and
  the outer part of the envelope expands with large velocity, carrying out a considerable
  part of rotational energy and rotational momentum. These results correspond qualitatively
  with the observational picture of supernova explosions.
