abstract: There are two principal scientific objectives in the study of Type Ia supernovae
  - first, a better understanding of these complex explosions from as near first principles
  as possible, and second, enabling the more accurate utilization of their emission
  to measure distances in cosmology. Both tasks lend themselves to large scale numerical
  simulation, yet take us beyond the current frontiers in astrophysics, combustion
  science, and radiation transport. Their study requires novel approaches and the
  creation of new, highly scalable codes.
