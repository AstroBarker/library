abstract: A method is developed which allows the evolution of rotating stars to be
  studied well beyond the main-sequence stage. Four different cases of redistribution
  of angular momentum in an evolving star are considered. Evolutionary sequences for
  a 7-solar-mass star, rotating according to these different cases, were computed
  from the zero-age main-sequence to the double-shell-source stage. Each sequence
  was begun with a (typical) equatorial rotational velocity of 210 km/s. On the main
  sequence, the effects of rotation are of minor importance. However, as the core
  contracts during later stages, important effects arise in all physically plausible
  cases. The outer regions of the cores approach critical velocities and develop unstable
  angular-velocity distributions. The effects of these instabilities should significantly
  alter the subsequent evolution.
