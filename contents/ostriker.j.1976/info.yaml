abstract: Preheating of infalling gas by emergent X-rays can suppress accretion on
  to a compact X-ray source. For spherically symmetric accretion, the effect results
  in a new luminosity limit, orders of magnitude less than the Eddington limit, above
  which steady flow is impossible. The model may apply to the globular-cluster X-ray
  sources.
