abstract: The history and theory of shock acceleration is reviewed, paying particular
  attention to theories of parallel shocks which include the backreaction of accelerated
  particles on the shock structure. The work that computer simulations, both plasma
  and Monte Carlo, are playing in revealing how thermal ions interact with shocks
  and how particle acceleration appears to be an inevitable and necessary part of
  the basic plasma physics that governs collisionless shocks is discussed. Some of
  the outstanding problems that still confront theorists and observers in this field
  are described.
