abstract: 'We report the first detection of elements at all three r-process peaks
  in the metal-poor halo star HD 160617. These elements include arsenic and selenium,
  which have not been detected previously in halo stars, and the elements tellurium,
  osmium, iridium, and platinum, which have been detected previously. Absorption lines
  of these elements are found in archive observations made with the Space Telescope
  Imaging Spectrograph on board the Hubble Space Telescope. We present up-to-date
  absolute atomic transition probabilities and complete line component patterns for
  these elements. Additional archival spectra of this star from several ground-based
  instruments allow us to derive abundances or upper limits of 45 elements in HD 160617,
  including 27 elements produced by neutron-capture reactions. The average abundances
  of the elements at the three r-process peaks are similar to the predicted solar
  system r-process residuals when scaled to the abundances in the rare earth element
  domain. This result for arsenic and selenium may be surprising in light of predictions
  that the production of the lightest r-process elements generally should be decoupled
  from the heavier r-process elements.  This research has made use of the Keck Observatory
  Archive (KOA), which is operated by the W.M. Keck Observatory and the NASA Exoplanet
  Science Institute (NExScI), under contract with the National Aeronautics and Space
  Administration. These data are associated with Program H6aH (PI: Boesgaard).'
