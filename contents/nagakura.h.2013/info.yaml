abstract: 'We develop a new semi-dynamical method to study shock revival by neutrino
  heating in core-collapse supernovae. Our new approach is an extension of the previous
  studies that employ spherically symmetric, steady, shocked accretion flows together
  with the light-bulb approximation. The latter has been widely used in the supernova
  community for the phenomenological investigation of the criteria for successful
  supernova explosions. In the present approach, we get rid of the steady-state condition
  and take into account shock wave motions instead. We have in mind a scenario in
  which it is not the critical luminosity but the critical fluctuation generated by
  hydrodynamical instabilities such as standing accretion shock instability and neutrino-driven
  convection in the post-shock region that determines the onset of shock revival.
  After confirming that the new approach indeed captures the dynamics of revived shock
  wave qualitatively, we then apply the method to various initial conditions and find
  that there is a critical fluctuation for shock revival, which can be well fit by
  the following formula: f crit ~ 0.8 \texttimes{} (M in/1.4 M \&sun;) \texttimes{}
  {1 - (r sh/108 cm)}, where f crit denotes the critical pressure fluctuation normalized
  by the unperturbed post-shock value. M in and r sh stand for the mass of the central
  compact object and the shock radius, respectively. The critical fluctuation decreases
  with the shock radius, whereas it increases with the mass of the central object.
  We discuss the possible implications of our results for three-dimensional effects
  on shock revival, which is currently controversial in the supernova community.'
