abstract: The character of a spherical blast wave propagating radially outward in
  a pressureless medium with density decreasing as tau -omega changes dramatically
  as omega and the adiabatic index gamma vary. Plots of the Sedov formulas for the
  density, velocity, and pressure profiles behind the shock front for a selection
  of different parameters illustrate this and suggest that some of the solutions satisfy
  the conditions for the Rayleigh-Taylor or convective instablity.
