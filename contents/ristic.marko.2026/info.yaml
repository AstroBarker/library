abstract: "<jats:title>Abstract</jats:title>\n                  <jats:p>\n                    Recent
  detections of kilonova-like emission following long-duration gamma-ray bursts GRB
  211211A and GRB 230307A have been interpreted as originating from the merger of
  two neutron stars. In this work, we demonstrate that these observations are also
  consistent with nucleosynthesis originating from a collapsar scenario. Our model
  is capable of reproducing the observed optical and infrared light curves using a
  single, weak\n                    <jats:italic>r</jats:italic>\n                    -process
  component. The absence of lanthanide-rich material in our model, consistent with
  the data, challenges the prevailing interpretation that a red evolution in such
  transients necessarily indicates the presence of heavy\n                    <jats:italic>r</jats:italic>\n
  \                   -process elements.\n                  </jats:p>"
author: Ristić, Marko and Barker, Brandon L. and Cupp, Samuel and Gross, Axel and
  Lloyd-Ronning, Nicole and Korobkin, Oleg and Miller, Jonah M. and Mumpower, Matthew
  R.
