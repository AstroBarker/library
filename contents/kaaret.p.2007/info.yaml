abstract: We report on millisecond variability from the X-ray transient XTE J1739-285.
  We detected six X-ray type I bursts and found evidence for oscillations at 1122+/-0.3
  Hz in the brightest X-ray burst. Taking into consideration the power in the oscillations
  and the number of trials in the search, the detection is significant at the 99.96\%
  confidence level. If the oscillations are confirmed, the oscillation frequency would
  suggest that XTE J1739-285 contains the fastest rotating neutron star yet found.
  We also found millisecond quasi-periodic oscillations in the persistent emission
  with frequencies ranging from 757 to 862 Hz. Using the brightest burst, we derive
  an upper limit on the source distance of about 10.6 kpc.
