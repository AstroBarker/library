abstract: We assess the suitability of a recent high-resolution central scheme developed
  by \cite{kurganov} for the solution of the relativistic hydrodynamic equations.
  The novelty of this approach relies on the absence of Riemann solvers in the solution
  procedure. The computations we present are performed in one and two spatial dimensions
  in Minkowski spacetime. Standard numerical experiments such as shock tubes and the
  relativistic flat-faced step test are performed. As an astrophysical application
  the article includes two-dimensional simulations of the propagation of relativistic
  jets using both Cartesian and cylindrical coordinates. The simulations reported
  clearly show the capabilities of the numerical scheme of yielding satisfactory results,
  with an accuracy comparable to that obtained by the so-called high-resolution shock-capturing
  schemes based upon Riemann solvers (Godunov-type schemes), even well inside the
  ultrarelativistic regime. Such a central scheme can be straightforwardly applied
  to hyperbolic systems of conservation laws for which the characteristic structure
  is not explicitly known, or in cases where a numerical computation of the exact
  solution of the Riemann problem is prohibitively expensive. Finally, we present
  comparisons with results obtained using various Godunov-type schemes as well as
  with those obtained using other high-resolution central schemes which have recently
  been reported in the literature.
