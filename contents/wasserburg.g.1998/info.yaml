abstract: It is shown that if the 26Al inventory of the early solar system, taken
  as (26Al/27Al)solar=5\texttimes{}10-5, is a result of injection of fresh debris
  from a Type II supernova (SNII), then 60Fe/56Fe would have to be between 3\texttimes{}10-7
  and 1\texttimes{}10-5. This inferred correlation of 26Al and 60Fe is based on the
  observation that both nuclei are produced dominantly in the O/Ne zone and that for
  SNII ejecta 26Al/60Fe is between 0.6 and 23. A similar correlation applies to 41Ca,
  36Cl, 16O, and 18O, which are also produced in the same zone or in nearby regions.
  The supernova trigger hypothesis may be tested by determination of 60Ni excesses
  correlated with Fe in samples where 26Al was demonstrated to be present. From available
  experimental data, it appears that the observed abundance of 60Fe is too low to
  be compatible with a supernova trigger that injected the 26Al into the protosolar
  nebula. The same is true for 53Mn, a short-lived nucleus produced in the outer edge
  of the Ni core.
