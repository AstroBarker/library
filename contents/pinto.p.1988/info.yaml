abstract: The expected light curve of Supernova 1987A is calculated for the next 10
  yr based solely upon energy input from radioactive decay of 56Co and 57Co. During
  the third year, energy input from 57Co begins to dominate. How the bolometric (ultraviolet-optical-infrared)
  light curve deviates from that given by 100\% deposition of the gamma-rays is a
  measure of the mixing that has gone on in the supernova. Current measurements favor
  a mixed model. The radioactive light curve decreases beneath 1039erg s-1 at an age
  of \equiv{}900 days, by which time the neutron star remnant should have made its
  presence known.
