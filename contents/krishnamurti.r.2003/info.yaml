abstract: Laboratory experiments were conducted on a double-diffusing fluid stabilized
  by the faster diffuser (T) and destabilized by the slower diffuser (S), the arrangement
  that leads to salt fingering. The experiments were conducted in three tanks of depths
  2 m, 1 m or 0.3 m, with initial linear profiles of S and T between two reservoirs
  at fixed or known values, S\_0 + Delta S, T\_0 + Delta T in the top reservoir, S\_0,
  T\_0 in the bottom reservoir.
