abstract: In the described model, a conducting, magnetized accretion disk of a massive
  black hole acts as an electric dynamo. The rotating disk creates an electric field,
  and two oppositely-directed, collimated, tenuous beams of ultrarelativistic protons
  are generated. It appears possible that the two-stream interaction can convert the
  energy of a tenuous proton beam into a relatively dense, collimated beam of relativistic
  electrons. Energy carried by the electron beams is released as synchrotron radiation
  in the radio components.
