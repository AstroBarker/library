abstract: Models of neutrino-driven core-collapse supernova explosions have matured
  considerably in recent years. Explosions of low-mass progenitors can routinely be
  simulated in 1D, 2D, and 3D. Nucleosynthesis calculations indicate that these supernovae
  could be contributors of some lighter neutron-rich elements beyond iron. The explosion
  mechanism of more massive stars remains under investigation, although first 3D models
  of neutrino-driven explosions employing multi-group neutrino transport have become
  available. Together with earlier 2D models and more simplified 3D simulations, these
  have elucidated the interplay between neutrino heating and hydrodynamic instabilities
  in the post-shock region that is essential for shock revival. However, some physical
  ingredients may still need to be added/improved before simulations can robustly
  explain supernova explosions over a wide range of progenitors. Solutions recently
  suggested in the literature include uncertainties in the neutrino rates, rotation,
  and seed perturbations from convective shell burning. We review the implications
  of 3D simulations of shell burning in supernova progenitors for the `perturbations-aided
  neutrino-driven mechanism,' whose efficacy is illustrated by the first successful
  multi-group neutrino hydrodynamics simulation of an 18 solar mass progenitor with
  3D initial conditions. We conclude with speculations about the impact of 3D effects
  on the structure of massive stars through convective boundary mixing.
