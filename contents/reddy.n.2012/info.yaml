abstract: We take advantage of the sensitivity and resolution of the Herschel Space
  Observatory at 100 and 160 mum to directly image the thermal dust emission and investigate
  the infrared luminosities (L IR) and dust obscuration of typical star-forming (L\textasteriskcentered)
  galaxies at high redshift. Our sample consists of 146 UV-selected galaxies with
  spectroscopic redshifts 1.5 <= z spec < 2.6 in the GOODS-North field. Supplemented
  with deep Very Large Array and Spitzer imaging, we construct median stacks at the
  positions of these galaxies at 24, 100, and 160 mum, and 1.4 GHz. The comparison
  between these stacked fluxes and a variety of dust templates and calibrations implies
  that typical star-forming galaxies with UV luminosities L UV >~ 1010 L \&sun; at
  z ~ 2 are luminous infrared galaxies with a median L IR = (2.2 $\pm$ 0.3) \texttimes{}
  1011 L \&sun;. Their median ratio of L IR to rest-frame 8 mum luminosity (L 8) is
  L IR/L 8 = 8.9 \$\pm\$ 1.3 and is \approx{}80\% larger than that found for most
  star-forming galaxies at z <~ 2. This apparent redshift evolution in the L IR/L
  8 ratio may be tied to the trend of larger infrared luminosity surface density for
  z >~ 2 galaxies relative to those at lower redshift. Typical galaxies at 1.5 <=
  z < 2.6 have a median dust obscuration L IR/L UV = 7.1 \$\pm\$ 1.1, which corresponds
  to a dust correction factor, required to recover the bolometric star formation rate
  (SFR) from the unobscured UV SFR, of 5.2 \$\pm\$ 0.6. This result is similar to
  that inferred from previous investigations of the UV, Halpha, 24 mum, radio, and
  X-ray properties of the same galaxies studied here. Stacking in bins of UV slope
  (beta) implies that L\textasteriskcentered galaxies with redder spectral slopes
  are also dustier and that the correlation between beta and dustiness is similar
  to that found for local starburst galaxies. Hence, the rest-frame ~= 30 and 50 mum
  fluxes validate on average the use of the local UV attenuation curve to recover
  the dust attenuation of typical star-forming galaxies at high redshift. In the simplest
  interpretation, the agreement between the local and high-redshift UV attenuation
  curves suggests a similarity in the dust production and stellar and dust geometries
  of starburst galaxies over the last 10 billion years.  Herschel is an ESA space
  observatory with science instruments provided by European-led Principal Investigator
  consortia and with important participation from NASA.
