abstract: A turning-point method is used to obtain a simple criterion governing the
  secular stability of uniformly rotating relativistic stars to axisymmetric perturbations.
  In particular, along a sequence of rotating neutron stars with fixed angular momentum
  and increasing central density, the configuration with maximum mass marks the onset
  of instability.
