abstract: The ejection of cold neutron-star matter is examined, and an attempt is
  made to determine whether the final composition of this matter may be similar to
  that normally associated with the hot high-neutron-flux r-process. A semiempirical
  liquid-drop model is used for the nucleus, and the equilibrium composition of the
  matter is determined by assuming it to be in its absolute ground state at a given
  density. Physical mechanisms operating during the expansion are analyzed, and the
  composition of the ejected matter is found as a function of its density during expansion.
  The results indicate that it is virtually impossible for deuterium to form, that
  neutrons can be captured only after beta decay increases the atomic numbers of nuclei,
  and that no free neutrons can escape. It is concluded that neutron-star ejecta can
  produce heavy neutron-rich nuclei and may produce somewhat heavier nuclei than a
  standard r-process.
