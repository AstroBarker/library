abstract: We have developed a technique to systematically discover and study high-redshift
  supernovae that can be used to measure the cosmological parameters. We report here
  results based on the initial seven of more than 28 supernovae discovered to date
  in the high-redshift supernova search of the Supernova Cosmology Project. We find
  an observational dispersion in peak magnitudes of sigmaMB=0.27 this dispersion narrows
  to sigmaMB,corr=0.19 after ``correcting'' the magnitudes using the light-curve ``width-luminosity''
  relation found for nearby (z <= 0.1) Type Ia supernovae from the Cal{\'a}n/Tololo
  survey (Hamuy et al.). Comparing light-curve width-corrected magnitudes as a function
  of redshift of our distant (z = 0.35-0.46) supernovae to those of nearby Type Ia
  supernovae yields a global measurement of the mass density, OmegaM=0.88+0.69-0.60
  for a Lambda = 0 cosmology. For a spatially flat universe (i.e., OmegaM + OmegaLambda
  = 1), we find OmegaM=0.94+0.34-0.28 or, equivalently, a measurement of the cosmological
  constant, OmegaLambda=0.06+0.28-0.34 (<0.51 at the 95\% confidence level). For the
  more general Friedmann-Lema{\^\i}tre cosmologies with independent OmegaM and OmegaLambda,
  the results are presented as a confidence region on the OmegaM-OmegaLambda plane.
  This region does not correspond to a unique value of the deceleration parameter
  q0. We present analyses and checks for statistical and systematic errors and also
  show that our results do not depend on the specifics of the width-luminosity correction.
  The results for OmegaLambda-versus-OmegaM are inconsistent with Lambda-dominated,
  low-density, flat cosmologies that have been proposed to reconcile the ages of globular
  cluster stars with higher Hubble constant values.  Based in part on data from the
  Isaac Newton Group Telescopes, KPNO and CTIO Observatories run by AURA, Mount Stromlo
  \& Siding Spring Observatory, Nordic Optical Telescope, and the W. M. Keck Observatory
