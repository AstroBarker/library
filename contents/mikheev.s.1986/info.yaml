abstract: Various resonant neutrino oscillation mechanisms are discussed analytically.
  Attention is given to resonant oscillation amplification due to modification by
  the presence of matter. The oscillation depth is shown to depend on the ratio between
  the oscillation length in a vacuum and the rest oscillation length, which is in
  turn controlled by the resonance characteristics. The conditions under which resonance
  is maximum are delineated. The analysis is extended to the case of matter with varying
  density, and thereby to the consideration of resonant oscillations in the sun and
  in the envelopes of massive collapsing stars. Resonance conditions are demonstrated
  to exist in specific layers of the sun and to induce significant oscillations when
  any neutrinos pass through. The locations of the resonance enhancements are dependent
  on the energy levels of neutrinos. Conditions which would suppress the neutrino
  flux near the earth are analyzed. It is shown that even weak resonance regions will
  cause strong oscillations in the neutrino flux. Many neutrinos are not able to pass
  through the resonance layers of the sun to reach the earth.
