abstract: Optical spectroscopy and photometry of SN 2006aj have been performed with
  the Subaru telescope at t>200 days after GRB 060218, the X-ray flash with which
  it was associated. Strong nebular emission lines with an expansion velocity of v~7300
  km s-1 were detected. The peaked but relatively broad [O I] lambdalambda6300, 6363
  suggests the existence of ~2 Msolar of materials in which ~1.3 Msolar is oxygen.
  The core might be produced by a mildly asymmetric explosion. The spectra are unique
  among SNe Ic in (1) the absence of [Ca II] lambdalambda7291, 7324 emission and (2)
  a strong emission feature at ~7400 {\AA}, which requires ~0.05 Msolar of newly synthesized
  58Ni. Such a large amount of stable neutron-rich Ni strongly indicates the formation
  of a neutron star. The progenitor and the explosion energy are constrained to 18
  Msolar<~Mms<~22 Msolar and E~(1-3)\texttimes{}1051 ergs, respectively.  Based on
  data collected at Subaru Telescope, which is operated by the National Astronomical
  Observatory of Japan.
