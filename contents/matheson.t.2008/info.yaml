abstract: We present 432 low-dispersion optical spectra of 32 Type Ia supernovae (SNe
  Ia) that also have well-calibrated light curves. The coverage ranges from 6 epochs
  to 36 epochs of spectroscopy. Most of the data were obtained with the 1.5 m Tillinghast
  telescope at the F. L. Whipple Observatory with typical wavelength coverage of 3700-7400
  {\AA} and a resolution of ~7 {\AA}. The earliest spectra are 13 days before B-band
  maximum; two-thirds of the SNe were observed before maximum brightness. Coverage
  for some SNe continues almost to the nebular phase. The consistency of the method
  of observation and the technique of reduction makes this an ideal data set for studying
  the spectroscopic diversity of SNe Ia.  Based in part on observations obtained at
  the F. L. Whipple Observatory, which is operated by the Smithsonian Astrophysical
  Observatory, and the MMT Observatory, a joint facility of the Smithsonian Institution
  and the University of Arizona.
