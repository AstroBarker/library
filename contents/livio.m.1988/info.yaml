abstract: The question of nova outbursts on magnetic white dwarfs among AM Her systems
  is examined. In particular, the effects of the presence of a strong magnetic field
  on the development of a thermonuclear runaway (TNR) are studied. The magnetic field
  is capable of weakening the outburst both through the inhibition of shear and diffusion
  mixing (which results in lower enrichments by heavy elements) and by interference
  with the development of convection during the TNR (which results in lower ejection
  velocities). The apparent absence of classical novae among AM Her systems may nevertheless
  have been due to selection effects, which are a consequence of the lower accretion
  rates below the period gap and the very narrow range in mass ratios capable of producing
  novae below the gap.
