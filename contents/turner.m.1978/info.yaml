abstract: 'Attention is given to the electromagnetic analog of the gravitational effects
  of neutrinos from supernova bursts. Neutrino emission is thus considered in light
  of quantum dynamics. The zero frequency limit (ZFL) technique of Weinberg is employed
  to obtain a classical source. Three problems in the analysis are outlined: (1) the
  source is relativistic (v = c),(2) the source is unbounded (because it moves with
  the radiation), and (3) an expression must be formulated to represent the stress-energy
  tensor involved in the creation of a neutrino. Photon radiation from beta-decay
  is considered as a specific example in the electromagnetic analogy.'
