abstract: We show model light curves of superluminous supernova 2006gy on the assumption
  that the supernova is powered by the collision of supernova ejecta and a dense circumstellar
  medium. The initial conditions are constructed based on the shock breakout condition,
  assuming that the circumstellar medium is dense enough to cause a shock breakout
  within it. We perform a set of numerical light-curve calculations using the one-dimensional
  multigroup radiation hydrodynamics code stella. We succeed in reproducing the overall
  features of the early light curve of SN 2006gy with a circumstellar medium of mass
  about 15 M\&sun; (the average mass-loss rate is \texttildelow{}0.1 M\&sun; yr-1).
  Thus, the progenitor of SN 2006gy is likely a very massive star. The density profile
  of the circumstellar medium is not well constrained by light-curve modelling alone,
  but our modelling disfavours a circumstellar medium formed by steady mass loss.
  The ejecta mass is estimated to be comparable to or less than 15 M\&sun; and the
  explosion energy is expected to be more than 4 \texttimes{} 1051 erg. No 56Ni is
  required to explain the early light curve. We find that multidimensional effects,
  e.g. Rayleigh-Taylor instability, which is expected to take place in the cool dense
  shell between the supernova ejecta and the dense circumstellar medium, are important
  in understanding supernovae powered by shock interaction. We also show the evolution
  of optical and near-infrared model light curves of high-redshift superluminous supernovae.
  They can potentially be used to identify SN 2006gy-like superluminous supernovae
  in future optical and near-infrared transient surveys.
