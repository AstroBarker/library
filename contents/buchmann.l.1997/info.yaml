abstract: In the paper "New Stellar Reaction Rate for 12C( alpha , gamma )16O" by
  L. Buchmann (ApJ, 468, L127 [1996]), there is an error in equation (2). In the denominator
  of the first two terms the factor (1 + p2/T ^{2/3}9 ) should be [1 + (p2/T ^{2/3}9
  )]2 and the factor (1 + p6/T ^{2/3}9 ) should be [1 + (p6/T ^{2/3}9 )]2. Equation
  (2) as corrected reads N\_{{\rm A}}\left sigma {\it v}\right\,=\frac {p1}{T29[1\,+\,(
  p2/T^{2/3}9)]2} \,{\rm exp}\,(\frac {\,-\,p3}{T^{1/ 3}9} \,-\frac {T29}{p4} )\,+\frac
  {p5}{T29[1\,+\ ,(p6/T^{2/3}9)]2} \,{\rm exp}\,(\frac {\,-\,p7 }{T^{1/3}9} )\,\,+\frac
  {p8}{T^{3/2}9} \,{\rm exp}\,(\frac { \,-\,p9}{T9} )\,+\frac {p10}{T^{2/3}9} \,(1\,+\,p11T^{
  1/3}9){\rm exp}\,(\frac {\,-\,p12}{T^{1/3}9} ).(2) The author would like to thank
  Dr. Edward Brown from the University of California at Berkeley for pointing out
  this error.
