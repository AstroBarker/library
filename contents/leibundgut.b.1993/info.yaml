abstract: While SN 1991bg is an unusual type Ia SN in such a feature as the brief
  duration of the photospheric phase, which ended only two weeks after maximum, it
  shares with other Ia SNs strong Si II and Ca II lines near maximum light. In addition,
  the light and color curve slopes are almost identical with the templates at late
  times. The spectral evolution of SN 1991bg is also unique but not unrecognizable;
  nevertheless, the peculiarities associated with this event complicate the fundamental
  question as to whether the Ia SNs make good standard candles.
