abstract: Selective laser excitation was used to measure the radiative lifetimes of
  the ZnI triplet states 4 sns 3 S 1( n=5 7) and 4 snd 3 D 3,3 D 2 and3 D 1( n=4 6).
  These states were excited from the metastable 4 s4 p 3 P states, which were collisionally
  populated in an atomic beam. The values are compared with the results of other experimental
  methods (beam-foil, pulsed electron excitation, Hanle effect) and with theoretical
  calculations. The corresponding oscillator strengths are discussed with respect
  to the astrophysical determination of the Zn photospheric abundance.
