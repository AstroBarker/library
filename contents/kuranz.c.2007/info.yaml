abstract: We present data from recent high-energy-density laboratory experiments designed
  to explore the Rayleigh Taylor instability under conditions relevant to supernovae.
  The Omega laser is used to create a blast wave structure that is similar to that
  of the explosion phase of a core-collapse supernova. An unstable interface is shocked
  and then decelerated by the planar blast wave, producing Rayleigh Taylor growth.
  Recent experiments were performed using dual, side-on, x-ray radiography to observe
  a 3D ``egg crate'' mode and an imposed, longer-wavelength, sinusoidal mode as a
  seed perturbation. This paper explores the method of data analysis and accurately
  estimating the position of important features in the data.
