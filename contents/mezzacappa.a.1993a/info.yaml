abstract: A simulation has been conducted of a realistic gravitational collapse in
  which neutrino-electron scattering is not approximated in the neutrino transport
  equation. The simulation code is based on the Newtonian gravity, the O(v/c) Lagrangian
  hydrodynamic equations, and the O(v/c) neutrino Boltzmann equation. Only electron-neutrino
  weak interactions were included; these encompass electron capture on nuclei and
  free protons, electron-neutrino absorption on nuclei and free neutrons, conservative
  scattering of electron-neutrinos on free protons and neutrons, conservative coherent
  scattering of electron-neutrinos on nuclei, and neutrino-electron scattering.
