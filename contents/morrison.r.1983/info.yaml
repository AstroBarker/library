abstract: An effective absorption cross section per hydrogen atom has been calculated
  as a function of energy in the 0.03-10 keV range using the most recent atomic cross
  section and cosmic abundance data. Coefficients of a piecewise polynomial fit to
  the numerical results are given to allow convenient application in automated calculations.
