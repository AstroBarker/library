abstract: The first galaxies to appear in the Universe at redshifts z > 20 created
  ionized bubbles in the intergalactic medium of neutral hydrogen left over from the
  Big Bang. The ionized bubbles grew with time, surrounding clusters of dwarf galaxies
  and eventually overlapped quickly throughout the Universe over a narrow redshift
  interval near z ~ 6. This event signalled the end of the reionization epoch when
  the Universe was a billion years old. Measuring the size distribution of the bubbles
  at their final overlap phase is a focus of forthcoming programmes to observe highly
  redshifted radio emission from atomic hydrogen. Here we show that the combined constraints
  of cosmic variance and light travel time imply an observed bubble size at the end
  of the overlap epoch of ~10 physical Mpc, and a scatter in the observed redshift
  of overlap along different lines-of-sight of ~0.15. This scatter is consistent with
  observational constraints from recent spectroscopic data on the farthest known quasars.
  This implies that future radio experiments should be tuned to a characteristic angular
  scale of 0.5 degrees and have a minimum frequency bandwidth of ~8MHz for an optimal
  detection of 21-cm flux fluctuations near the end of reionization.
