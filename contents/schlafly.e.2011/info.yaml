abstract: We present measurements of dust reddening using the colors of stars with
  spectra in the Sloan Digital Sky Survey. We measure reddening as the difference
  between the measured and predicted colors of a star, as derived from stellar parameters
  from the Sloan Extension for Galactic Understanding and Exploration Stellar Parameter
  Pipeline. We achieve uncertainties of 56, 34, 25, and 29 mmag in the colors u -
  g, g - r, r - i, and i - z, per star, though the uncertainty varies depending on
  the stellar type and the magnitude of the star. The spectrum-based reddening measurements
  confirm our earlier "blue tip" reddening measurements, finding reddening coefficients
  different by -3\%, 1\%, 1\%, and 2\% in u - g, g - r, r - i, and i - z from those
  found by the blue tip method, after removing a 4\% normalization difference. These
  results prefer an RV = 3.1 Fitzpatrick reddening law to O'Donnell or Cardelli et
  al. reddening laws. We provide a table of conversion coefficients from the Schlegel
  et al. (SFD) maps of E(B - V) to extinction in 88 bandpasses for four values of
  RV , using this reddening law and the 14\% recalibration of SFD first reported by
  Schlafly et al. and confirmed in this work.
