abstract: The study combines several novel techniques for spectrum simulation in the
  Eddington computer program which solves the comoving frame equation of transfer
  coupled with the statistical and radiative equilibrium equations. One of these is
  a generalization of the accelerated lambda iteration (ALI) scheme to include an
  approximate frequency-derivative operator. This greatly enhances the convergence
  rate of ALI in optically thick, high-velocity shear flows. Another is a partial
  linearization technique which is capable of efficiently solving a very large number
  of rate equations on a moderately sized computer. An expansion opacity and emissivity
  approximation is derived which makes it possible to determine the effect on the
  transfer and statistical equilibrium of a very large number of lines not explicitly
  represented in the frequency grid and additionally to treat line-blanketing from
  species not explicitly included in the rate equations. The utility of these techniques
  is illustrated with models of two supernovae.
