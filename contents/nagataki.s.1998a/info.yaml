abstract: The large abundance ratio of 44Ti/56Ni in Cassiopeia A is puzzling. In fact,
  the ratio seems to be larger than the theoretical constraint derived by Woosley
  \& Hoffman. However, this constraint is obtained on the assumption that the explosion
  is spherically symmetric, whereas Cas A is famous for the asymmetric form of the
  remnant. Recently, Nagataki et al. calculated the explosive nucleosynthesis of axisymmetrically
  deformed collapse-driven supernova. They reported that the ratio of 44Ti/56Ni was
  enhanced by the stronger alpha-rich freezeout in the polar region. In this Letter,
  we apply these results to Cas A and examine whether this effect can explain the
  large amount of 41Ti and the large ratio of 44Ti/56Ni. We demonstrate that the conventional,
  spherically symmetric explosion model cannot explain the 44Ti mass produced in Cas
  A if its lifetime is shorter than ~80 yr and the intervening space is transparent
  to the gamma-ray line from the decay of 44Ti. On the other hand, we show that the
  axisymmetric explosion models can solve the problem. We expect the same effect from
  a three-dimensionally asymmetric explosion, since the stronger alpha-rich freezeout
  will also occur in that case in the region where the larger energy is deposited.
