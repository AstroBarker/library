abstract: Detailed neutrino and antineutrino emission and absorption coefficients
  for beta-decay interactions are assembled, along with coefficients for neutrino
  and antineutrino scattering from protons, neutrons, electrons and positrons, absorption
  and emission coefficients for neutrino-antineutrino pair emission, and absorption
  by electron-positron pairs and plasmons. These formulas are presented in a form
  suitable for use in the neutrino and antineutrino transport equations. A numerical
  method to solve the problem of a plane-parallel, semiinfinite, static neutrino atmosphere
  'heated from below' is described in detail. Explicit relations are given for the
  entropy of a gas of free electrons, protons, neutrons, positrons, photons, neutrinos,
  and antineutrinos, and it is shown how these relations can be used to calculate
  the convective stability criterion discussed elsewhere.
