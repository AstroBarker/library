abstract: The present status of theories of presupernova stellar evolution and the
  triggering mechanisms of supernova explosions are reviewed. The validity of the
  single-star approximation for stellar core evolution is considered, and the central
  density and temperature of the stellar core are discussed. Attention is then given
  to the results of numerical models of supernova explosions by carbon deflagration
  of an intermediate mass star, resulting in the total disruption of the star; the
  photodissociation of iron nuclei in a massive star, resulting in neutron star or
  black hole formation; and stellar core collapse triggered by electron capture in
  stars of mass ranging between those of the intermediate mass and massive stars,
  resulting in neutron star formation despite oxygen deflagration. Helium and carbon
  combustion and detonation in accreting white dwarfs and the gravitational collapse
  triggered by electron-pair creation in supermassive stars are also discussed, and
  problems requiring future investigation are indicated.
