abstract: Peculiar velocity fields of galaxies, computed by cosmological N-body simulations,
  are analyzed in detail. This Monte Carlo approach provides not only the expectation
  values of the bulk flow velocity and the cosmic Mach number, but their probability
  distributions. The distribution of the cosmic Mach number is found to be almost
  Maxwellian in linear and mildly nonlinear regimes, independent of the shape of the
  density fluctuation spectrum. Applying the resulting probability distribution to
  the cold dark matter models based on the inflationary scenario, it is found that
  the constraints derived by Ostriker and Suto (1990) hold at the 90-percent confidence
  level.
