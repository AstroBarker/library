abstract: We present numerical simulations of an isothermal turbulent gas undergoing
  gravitational collapse, with the aim of testing for ``logatropic'' behavior of the
  form Pt ~ log rho, where Pt is the turbulent pressure and rho is the density. To
  this end, we monitor the evolution of the turbulent velocity dispersion sigma as
  the density increases during collapse. A logatropic behavior would require sigma
  ~ rho-1/2, a result that is not, however, verified in the simulations. Instead,
  the velocity dispersion increases with density, implying a polytropic behavior of
  Pt. This behavior is found both in purely hydrodynamic and in hydromagnetic runs.
  For purely hydrodynamic and rapidly collapsing magnetic cases, the velocity dispersion
  increases roughly as sigma ~ rho1/2, implying Pt ~ rho2, where Pt is the turbulent
  pressure. For slowly collapsing magnetic cases, the behavior is close to sigma ~
  rho1/4, implying Pt ~ rho3/2. We thus suggest that the logatropic ``equation of
  state'' may represent only the statistically most probable state of an ensemble
  of clouds in equilibrium between self-gravity and kinetic support, but does not
  adequately represent the behavior of the turbulent pressure within a cloud undergoing
  a dynamic compression as a result of gravitational collapse. Finally, we discuss
  the importance of the underlying physical model of the clouds (equilibrium versus
  dynamic) for the results obtained.
