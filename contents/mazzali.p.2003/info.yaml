abstract: The spectra of SN 2003dh, identified in the afterglow of GRB 030329, are
  modeled using radiation transport codes. It is shown that SN 2003dh had a high explosion
  kinetic energy (~4\texttimes{}1052 ergs in spherical symmetry), making it one of
  the most powerful hypernovae observed so far and supporting the case for association
  between hypernovae and gamma-ray bursts. However, the light curve derived from fitting
  the spectra suggests that SN 2003dh was not as bright as SN 1998bw, ejecting only
  ~0.35 Msolar of 56Ni. The spectra of SN 2003dh resemble those of SN 1998bw around
  maximum, but later they look more like those of the less energetic hypernova SN
  1997ef. The spectra and the inferred light curve can be modeled adopting a density
  distribution similar to that used for SN 1998bw at v>25,000 km s-1 but more like
  that of SN 1997ef at lower velocities. The mass of the ejecta is ~8 Msolar, somewhat
  less than in the other two hypernovae. The progenitor must have been a massive star
  (M~35-40 Msolar), as for other hypernovae. The need to combine different one-dimensional
  explosion models strongly indicates that SN 2003dh was an asymmetric explosion.
