abstract: A dissipative axisymmetric pulsar magnetosphere is calculated by a direct
  numerical simulation of the strong-field electrodynamics equations. The magnetic
  separatrix disappears; it is replaced by a region of enhanced dissipation. With
  a better numerical scheme, one should be able to calculate the bolometric light
  curves for a given conductivity.
