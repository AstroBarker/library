abstract: A new low-to-moderate resolution spectrograph has been designed and built
  for the Cassegrain focus of the Hale 5.08- meter telescope. To maximize efficiency,
  resolution, and wavelength coverage the light is divided into two spectral regions
  by a dichroic filter behind the entrance slit, after which there are two completely
  separate spectrographs. The blue spectrograph operates from 3200 {\AA} to 5200 {\AA}
  while the red one goes from 5200 {\AA} to 10,000 {\AA}. The red detector is an 800
  \texttimes{} 800 TI CCD while the blue detector is a 320 \texttimes{} 512 RCA CCD
  or a Shectrograph image pulse-counting system. A Boksenberg IPCS can also he mounted
  on the blue camera. The overall efficiency of the Cassegrain telescope, spectrographs,
  and CCD's combined, ranges from 5\% to 13\% between 3600 {\AA} and 8200 {\AA}. The
  spectrograph is usable from 3200 {\AA} to 10,400 {\AA}.
