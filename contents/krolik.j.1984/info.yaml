abstract: New calculations are presented of the soft X-ray opacity of gas having cosmic
  elemental abundances, but in a variety of ionization states. Coronal ionization
  equilibrium is considered over the range of temperatures 10 to the 4th to 3 x 10
  to the 8th K and photoionization equilibrium with power-law and thermal bremsstrahlung
  spectra over a wide range of ionization parameters. The results are displayed in
  illustrative figures. For temperatures and ionization parameters commonly found
  in astrophysical plasmas, the opacity (particularly to photons of equal to or less
  than 1 keV) can be diminished by substantial factors relative to the state in which
  all atoms are neutral. As the dominant ionization stages change, the positions and
  contrasts of prominent K-edges also change.
