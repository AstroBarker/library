abstract: The role of neutrino-antineutrino annihilation (producing an electron-positron
  pair) in delayed type II supernova explosions is investigated theoretically. The
  assumptions and analysis of Goodman et al. (1987) are examined in detail, with a
  focus on the need for a large density gradient at the edge of the neutrinosphere.
  It is found that the neutrino annihilation mechanism cannot contribute significantly
  to the energy of the explosion.
