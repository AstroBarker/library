abstract: This paper presents the Geneva stellar evolution code with special emphasis
  on the modeling of solar-type stars. The basic input physics used in the Geneva
  code as well as the modeling of atomic diffusion is first discussed. The physical
  description of rotation is then presented. Finally, the modeling of magnetic instabilities
  and transport of angular momentum by internal gravity waves is briefly summarized.
