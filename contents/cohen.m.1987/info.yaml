abstract: Spectroscopy of the starlike optical counterpart to IRAS 21282+5050, a source
  with the "hydrocarbon" infrared emission band spectrum, shows an O7(f)-[WC 11] planetary
  nebula nucleus suffering an extinction of 5.7 mag. Emission-line widths in the WC
  spectrum are only \equiv{}100 km s-1, indicating a very slow stellar wind. Optical
  diffuse interstellar bands (DIBs) are prominent. Five DIBs are strongly enhanced,
  namely lambdalambda5797, 6196, 6203,6283, and 6613. The presence of circumstellar
  hydrocarbon molecules may explain both the infrared emission bands and the enhanced
  DIBs.
