abstract: Polarized black-hole images carry information about both the magnetized
  plasma and the curved spacetime through which the radiation propagates. We present
  KPolaris, an open-source GPU-accelerated general-relativistic polarized radiative-transfer
  code built on the Kokkos framework. It supports analytic plasma models and GRMHD
  simulation data, with both fast-light and slow-light radiative transfer. The code
  also provides diagnostics that connect image structure to the emitting plasma and
  to propagation effects along the rays. These include emissivity-weighted plasma
  maps, emission contributions from selected regions, selected-ray histories, and
  sensitivities of the Stokes parameters to plasma parameters. Numerical convergence
  tests and comparisons with an independent radiative-transfer code assess the accuracy
  of the calculations. GPU acceleration reduces the computational cost of image generation,
  facilitating multi-frequency and time-dependent studies of polarized black-hole
  images.
