abstract: An alternative approach is proposed for the analysis of optical isotope
  shifts. It is shown that for many elements a plot of the shift for one isotope pair
  against that for another pair for a series of transitions is linear. In certain
  circumstances the gradient of this plot gives the ratio of the change in mean square
  charge radii of the isotope pairs directly. Alternatively the plot is helpful in
  making judgements as to whether specific mass effects are likely to be negligible,
  with the field shift dominant, and hence assisting other methods of analysis. The
  possible range of validity is discussed.
