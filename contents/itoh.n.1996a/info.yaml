abstract: The accuracy of the Braaten-Segel approximation for the plasma neutrino
  calculation is quantitatively assessed by comparison with the result obtained by
  using the Jancovici formula for the dielectric for degenerate electrons. It is found
  that the Braaten-Segel approximation is a reasonably good one when the plasma neutrino
  process is the most dominant process; the error is within \texttildelow{}5\% in
  this case. When the plasma neutrino process is not the most dominant, the accuracy
  of the Braaten-Segel approximation becomes much poorer.
