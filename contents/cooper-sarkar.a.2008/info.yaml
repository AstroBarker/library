abstract: We have updated predictions for high energy neutrino and antineutrino charged
  current cross-sections within the conventional DGLAP formalism of NLO QCD using
  a modern PDF fit to HERA data, which also accounts in a systematic way for PDF uncertainties
  deriving from both model uncertainties and from the experimental uncertainties of
  the input data sets. Furthermore the PDFs are determined using an improved treatment
  of heavy quark thresholds. A measurement of the neutrino cross-section outside these
  predictions would signal the need for extension of the conventional formalism as
  in BFKL resummation, or even gluon recombination effects as in the colour glass
  condensate model.
