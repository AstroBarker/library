abstract: In the present method for the construction of solutions to the gas dynamics
  Riemann problem by means of a general convex equation of state, the numerical fluxes
  in conservative finite difference schemes are calculated on the basis of approximate
  procedures that involve a local parameterization of the equation of state. Difference
  schemes are thereby obtained which are accurate and nearly as fast as analogous
  ones for polytropic gases. Attention is given to numerical results in one- and two-space
  variables.
