abstract: Results from the first detailed numerical simulations of the Kelvin-Helmholtz
  phase of the birth of a neutron star are presented. The transformation of a hot,
  bloated electron-rich residue into a cold, compact, neutronized object is studied.
  Its behavior during the first 20 sec of its life is investigated. The physics relevant
  to the problem and its exploration are discussed, and many useful formulas are derived.
  Highlighted is a baseline calculation of the evolution of a 1.4 solar mass residue
  of stellar collapse. The results are conveyed by means of a series of graphs and
  figures depicting the thermal, structural, and compositional changes the core experiences.
