abstract: The absolute cross section and branching ratios for dissociative recombination
  of CH+2 with electrons have been measured by means of the heavy-ion storage ring
  CRYRING. Contrary to what has been previously believed, recombination of CH+2 is
  dominated by the three-body channel C + H + H (63\%), whereas breakup into the CH
  + H and C + H2 channels occurs with branching ratios of 25\% and 12\%, respectively.
  The thermal rate coefficient for dissociative recombination at 300 K is 6.4 \texttimes{}
  10-7 cm3 s-1, which is higher by a factor of 2.5 than the value used in modeling
  dark molecular clouds. The low CH production and the high production of energetic
  carbon atoms could be favorable factors for the turbulence model to explain the
  large abundance of interstellar CH+. The cross section for dissociative excitation
  was also measured and found to be in good agreement with results from a crossed
  electron-ion beam experiment.
