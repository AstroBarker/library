abstract: We present a numerical investigation of the contribution of the presupernova
  ejecta of Wolf-Rayet stars to the environment surrounding gamma-ray bursts (GRBs)
  and describe how this external matter can affect the observable afterglow characteristics.
  An implicit hydrodynamic calculation for massive stellar evolution is used here
  to provide the inner boundary conditions for an explicit hydrodynamical code to
  model the circumstellar gas dynamics. The resulting properties of the circumstellar
  medium are then used to calculate the deceleration of a relativistic, gasdynamical
  jet and the corresponding afterglow light curve produced as the shock wave propagates
  through the shocked wind medium. We find that variations in the stellar wind drive
  instabilities that may produce radial filaments in the shocked wind region. These
  comet-like tails of clumps could give rise to strong temporal variations in the
  early afterglow light curve. Afterglows may be expected to differ widely among themselves,
  depending on the angular anisotropy of the jet and the properties of the stellar
  progenitor; a wide diversity of behaviors may be the rule, rather than the exception.
