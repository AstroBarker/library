abstract: A hadronic chiral SU(3) model is applied to neutron and proto-neutron stars,
  taking into account trapped neutrinos, finite temperature, and entropy. The transition
  to the chirally restored phase is studied, and global properties of the stars such
  as minimum and maximum masses and radii are calculated for different cases. In addition,
  the effects of rotation on neutron star masses are included, and the conservation
  of baryon number and angular momentum determines the maximum frequencies of rotation
  during the cooling.
