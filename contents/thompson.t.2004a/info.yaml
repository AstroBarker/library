abstract: The astrophysical origin of the r-process nuclei is unknown. Because of
  their association with supernovae and intrinsic neutron-richness, protoneutron star
  winds are considered as a likely candidate site for production of the r-process
  nuclei. However, most models of winds from "canonical" neutron stars with mass of
  1.4 M\&sun; and radius of 10 km fail to generate the heaviest r-process nuclei.
  In this proceedings we provide a brief review of the protoneutron star wind scenario
  and discuss the emergence of these outflows in the context of fully dynamical models
  of successful core-collapse supernovae. That standard models fail motivates an exploration
  of more extreme neutron star environments. We address some issues surrounding winds
  from highly magnetic (B0 \greaterequivlnt{} 1015 G) protoneutron stars ('proto-magnetars'),
  including magnetic trapping of wind material and entropy amplification. We further
  speculate on the role of rapid rotation in this context and the resulting nucleosynthesis.
