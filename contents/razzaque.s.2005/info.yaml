abstract: It has been hypothesized recently that core collapse supernovae are triggered
  by mildly relativistic jets following observations of radio properties of these
  explosions. Association of a jet, similar to a gamma-ray burst jet but only slower,
  allows shock acceleration of particles to high energy and non-thermal neutrino emission
  from a supernova. Detection of these high energy neutrinos in upcoming kilometer
  scale Cherenkov detectors may be the only direct way to probe inside these astrophysical
  phenomena as electromagnetic radiation is thermal and contains little information.
  Calculation of high energy neutrino signal from a simple and slow jet model buried
  inside the pre-supernova star is reviewed here. The detection prospect of these
  neutrinos in water or ice detector is also discussed in this brief review. Jetted
  core collapse supernovae in nearby galaxies may provide the strongest high energy
  neutrino signal from point sources.
