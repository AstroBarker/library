abstract: Since June 1987 the authors have had little cause to doubt the presence
  of radioactivity in supernova 1987A. The decay of 56Co to 56Fe would give rise to
  detectable gamma-ray line emission at 847 and 1,238 keV with a peak flux of 10-3photons
  cm-2s-1 about one year after the explosion. In August, both lines were detected,
  with a strength within a factor of two of 10-3photons cm-2s-1, but about six months
  earlier than predicted. The authors show that the early emergence of gamma-rays
  can be accounted for in a "mixed" model, in which an approximately isotropic process
  destroys chemical segregation with respect to radial mass coordinate and velocity.
