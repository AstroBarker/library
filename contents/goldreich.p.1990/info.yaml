abstract: Wave generation by turbulent convection in a plane parallel, stratified
  atmosphere lying in a gravitational field is studied. The turbulent spectrum is
  related to the convective energy flux via the Kolmogorov scaling and the mixing
  length hypothesis. Efficiencies for the conversion of the convective energy flux
  into both trapped and propagating waves are estimated.
