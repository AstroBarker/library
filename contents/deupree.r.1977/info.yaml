abstract: Two-dimensional conservation equations of mass, momentum, and energy are
  integrated over time by finite-difference techniques for several pulsating RR Lyrae
  models. Convective motion is generated naturally in convectively unstable regions
  from computer roundoff error. Time dependence is governed solely by the integration
  of the equations. The numerical approach and assumptions are discussed in detail.
  The analysis is primarily concerned with the dependence of convection on pulsation
  phase, which is the result most independent of the various approximations. Cases
  in which convection plays a major role and where its effects are comparatively minor
  are both considered. Based on the time dependence, the suppression of radial pulsation
  is discussed, and a preliminary determination is made of the position of the red
  edge.
