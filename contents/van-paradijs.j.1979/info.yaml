abstract: The effect of gravitational redshift on the blackbody radii, as deduced
  from the tails of X-ray bursts, is considered. Observed values of blackbody radii
  put an upper limit to the mass and constrain the mass-radius relations of neutron
  stars. Possible consequences for the equation of state of high-density matter are
  briefly discussed.
