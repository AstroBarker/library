abstract: Results are reported from a three-dimensional numerical calculation of the
  tidal disruption of a low-mass main-sequence star on a parabolic orbit around a
  massive black hole (Mh = 10 to the 6th stellar mass). The postdisruption evolution
  is followed until hydrodynamic forces becomes negligible and the liberated gas becomes
  ballistic. Also given is the rate at which bound mass returns to pericenter after
  orbiting the hole once. The processes that determine the time scale to circularize
  the debris orbits and allow an accretion torus to form are discussed. This time
  scale and the time scales for radiative cooling and accretion inflow determine the
  onset and duration of the subsequent flare in the AGN luminosity.
