abstract: 'Structures of nonrotating magnetized clouds are investigated from a standpoint
  of the equilibrium solution of the cloud confined by an external pressure which
  is threaded by uniform magnetic field at infinity. Equilibria for wide ranges of
  parameters are studied: the ratio of the external thermal pressure to the magnetic
  pressure ranges from 10-2 to 5 and the center-to-surface density ratio ranges from
  2 to 104. The authors obtain two different equilibrium states with the same mass
  but with different central density. It is shown from the mass - central density
  relation that the solution with lower central density is stable and that with higher
  central density is unstable.'
