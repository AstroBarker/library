abstract: A simple description of core-collapse supernovae is given. Properties of
  the neutrino-driven wind, neutrino fluxes and luminosities, reaction rates and the
  equilibrium electron fraction in supernova environments are discussed. Neutrino
  mixing and neutrino interactions that are relevant to core-collapse supernovae are
  briefly reviewed. The values of electron fraction under several evolution scenarios
  that may impact rapid neutron-capture process (r-process) nucleosynthesis are calculated.
