abstract: The Wide Field Planetary Camera 2 (WFPC2) was installed in the Hubble Space
  Telescope (HST) in 1993 December. Since then, the instrument has been providing
  high-quality images. A significant among of calibration data has been collected
  to aid in the understanding of the on-orbit performance of the instrument. Generally,
  the behavior of the camera is similar to its performance during the system-level
  thermal vacuum test at JPL in 1993 May. Surprises were a significant charge-transfer-efficiency
  (CTE) problem and a significant growth rate in hot pixels at the original operating
  temperature of the CCDs (-76 deg C). The operating temperature of the WFPC2 CCDs
  was changed to -88 deg C on 1994 April 23, and significant improvements in CTE and
  hot pixels are seen at this temperature. In this paper we describe the on-orbit
  performance of the WFPC2. We discuss the optical and thermal history, the instrument
  throughput and stability, the Point Spread Function (PSF), the effects of undersampling
  on photometry, the properties of cosmic rays observed on-orbit, and the geometric
  distortion in the camera. We present the best techniques for the reduction of WFPC2
  data, and describe the construction of calibration products including superbiases,
  super-darks, and flat fields.
