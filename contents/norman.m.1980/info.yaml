abstract: The isothermal collapse of a rotating axisymmetric gas cloud is calculated.
  The cloud is slowly rotating so that the collapse is deep, severely testing the
  angular momentum advection. Special care is taken to improve local conservation
  of angular momentum, which is monitored by a mass versus specific angular momentum
  spectrum. It is found that the collapse is a runaway yielding central disklike regions
  of increasing mass density and flatness. Although the numerical solution cannot
  become singular, it is shown that a possible final state for the cloud consistent
  with its mass versus specific angular momentum spectrum is an equilibrium thin disk
  which is singular in surface density and angular velocity at the rotation axis.
