abstract: This paper reports on the improved Mainz experiment on tritium beta spectroscopy
  which yields a 10 times higher signal to background ratio than before. The main
  experimental effects and systematic uncertainties have been investigated in side
  experiments, and possible error sources have been eliminated. Extensive data taking
  took place in the years 1997 to 2001. A residual analysis of the data sets yields
  for the square of the electron antineutrino mass the final result of m^2(nu\_e)
  = (-0.6 $\pm$ 2.2\_{{stat}} \$\pm\$ 2.1\_{{syst}}) eV2/c4. We derive an upper limit
  of m(nu\_e)<= 2.3 eV/c2 at 95\% confidence level for the mass itself.
