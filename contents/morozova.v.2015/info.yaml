abstract: We present the SuperNova Explosion Code (SNEC), an open-source Lagrangian
  code for the hydrodynamics and equilibrium-diffusion radiation transport in the
  expanding envelopes of supernovae. Given a model of a progenitor star, an explosion
  energy, and an amount and distribution of radioactive nickel, SNEC generates the
  bolometric light curve, as well as the light curves in different broad bands assuming
  blackbody emission. As a first application of SNEC, we consider the explosions of
  a grid of 15 M\&sun; (at zero-age main sequence, ZAMS) stars whose hydrogen envelopes
  are stripped to different extents and at different points in their evolution. The
  resulting light curves exhibit plateaus with durations of \texttildelow{}20-100
  days if \greaterequivlnt{}1.5-2 M\&sun; of hydrogen-rich material is left and no
  plateau if less hydrogen-rich material is left. If these shorter plateau lengths
  are not seen for SNe IIP in nature, it suggests that, at least for ZAMS masses \lessequivlnt{}20
  M\&sun;, hydrogen mass loss occurs as an all or nothing process. This perhaps points
  to the important role binary interactions play in generating the observed mass-stripped
  supernovae (i.e., Type Ib/c events). These light curves are also unlike what is
  typically seen for SNe IIL, arguing that simply varying the amount of mass loss
  cannot explain these events. The most stripped models begin to show double-peaked
  light curves similar to what is often seen for SNe IIb, confirming previous work
  that these supernovae can come from progenitors that have a small amount of hydrogen
  and a radius of \texttildelow{}500 R\&sun;.
