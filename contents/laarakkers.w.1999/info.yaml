abstract: Numerical models of rotating neutron stars are constructed for four equations
  of state using the computer code RNS written by Stergioulas. For five selected values
  of the star's gravitational mass (in the interval between 1.0 and 1.8 solar masses)
  and for each equation of state, the star's angular momentum is varied from J=0 to
  the Keplerian limit J=Jmax. For each neutron star configuration, we compute Q, the
  quadrupole moment of the mass distribution. We show that for given values of M and
  J, \vert{}Q\vert{} increases with the stiffness of the equation of state. For fixed
  mass and equation of state, the dependence on J is well reproduced with a simple
  quadratic fit, Q~=-aJ2/Mc2, where c is the speed of light and a is a parameter of
  order unity depending on the mass and the equation of state.
