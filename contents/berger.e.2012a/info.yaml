abstract: We present the Pan-STARRS1 discovery and light curves, and follow-up MMT
  and Gemini spectroscopy of an ultraluminous supernova (ULSN; dubbed PS1-11bam) at
  a redshift of z = 1.566 with a peak brightness of M UV \approx{} -22.3 mag. PS1-11bam
  is one of the highest redshift spectroscopically confirmed SNe known to date. The
  spectrum exhibits broad absorption features typical of previous ULSNe (e.g., C II,
  Si III), and strong and narrow Mg II and Fe II absorption lines from the interstellar
  medium (ISM) of the host galaxy, confirmed by an [O II]lambda3727 emission line
  at the same redshift. The equivalent widths of the Fe II lambda2600 and Mg II lambda2803
  lines are in the top quartile of the quasar intervening absorption system distribution,
  but are weaker than those of gamma-ray burst intrinsic absorbers (i.e., GRB host
  galaxies). We also detect the host galaxy in pre-explosion Pan-STARRS1 data and
  find that its UV spectral energy distribution is best fit with a young stellar population
  age of tau\textasteriskcentered \approx{} 15-45 Myr and a stellar mass of M \textasteriskcentered
  \approx{} (1.1-2.6) \texttimes{} 109 M \&sun; (for Z = 0.05-1 Z \&sun;). The star
  formation rate inferred from the UV continuum and [O II]lambda3727 emission line
  is \approx{}10 M \&sun; yr-1, higher than in previous ULSN hosts. PS1-11bam provides
  the first direct demonstration that ULSNe can serve as probes of the ISM in distant
  galaxies. The depth and red sensitivity of PS1 are uniquely suited to finding such
  events at cosmologically interesting redshifts (z ~ 1-2); the future combination
  of LSST and 30 m class telescopes promises to extend this technique to z ~ 4.
