abstract: Recent observations by IceCube, notably two PeV cascades accompanied by
  events at energies ~ (30-400) TeV, are clearly in excess over atmospheric background
  fluxes and beg for an astroparticle physics explanation. Although some models of
  astrophysical accelerators can account for the observations within current statistics,
  intriguing features in the energy and possibly angular distributions of the events
  make worth exploring alternatives. Here, we entertain the possibility of interpreting
  the data with a few PeV mass scale decaying dark matter, with lifetime of the order
  of 1027 s. We discuss generic signatures of this scenario, including its unique
  energy spectrum distortion with respect to the benchmark Enu-2 expectation for astrophysical
  sources, as well as peculiar anisotropies. A direct comparison with the data show
  a good match with the above-mentioned features. We further discuss possible future
  checks of this scenario.
