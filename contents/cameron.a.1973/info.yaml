abstract: The present status of abundance information for elements in meteorites and
  in the Sun is reviewed, and a new table of abundances of the elements, which should
  be characteristic of the primitive solar nebula, is compiled and presented. Special
  attention is called to the elemental abundances in the silicon-to-calcium region,
  where many of the abundances are rather poorly determined, and where these abundances
  have an impact on theories of nucleosynthesis of the elements. To each elemental
  isotope is assigned a mechanism of nucleosynthesis which may have been responsible
  for production of most of that isotope, and brief comments are made concerning the
  present status of understanding of the different mechanisms of nucleosynthesis.
