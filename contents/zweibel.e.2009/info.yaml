abstract: 'Magnetic reconnection is a topological rearrangement of magnetic field
  that converts magnetic energy to plasma energy. Astrophysical flares, from the Earth''s
  magnetosphere to gamma-ray bursts and sawtooth crashes in laboratory plasmas, may
  all be powered by reconnection. Reconnection is essential for dynamos and the large-scale
  restructuring known as magnetic self-organization. We review reconnection theory
  and evidence for it. We emphasize recent developments in two-fluid physics, and
  the experiments, observations, and simulations that verify two-fluid effects. We
  discuss novel environments such as line-tied, relativistic, and partially ionized
  plasmas, focusing on mechanisms that make reconnection fast, as observed. Because
  there is evidence that fast reconnection in astrophysics requires small-scale structure,
  we briefly introduce how such structure might develop. Several areas merit attention
  for astrophysical applications: development of a kinetic model of reconnection to
  enable spectroscopic predictions, better understanding of the interplay between
  local and global scales, the role of collisionless reconnection in large systems,
  and the effects of flows, including turbulence.'
