abstract: 'Aims: X-ray bursting neutron stars in low-mass X-ray binaries constitute
  an appropriate source class for constraining the masses and radii of neutron stars,
  but a sufficiently extended set of corresponding model atmospheres is necessary
  for these investigations.  Methods: We computed such a set of model atmospheres
  and emergent spectra in a plane-parallel, hydrostatic, and LTE approximation with
  Compton scattering taken into account.  Results: The models were calculated for
  six different chemical compositions: pure hydrogen, pure helium, and a solar mix
  of hydrogen and helium with various heavy element abundances Z = 1,0.3,0.1, and
  0.01 Z\&sun;. For each chemical composition the models are computed for three values
  of surface gravity, log g =14.0, 14.3, and 14.6, and for 20 values of the luminosity
  in units of the Eddington luminosity, L/LEdd, in the range 0.001-0.98. The emergent
  spectra of all models are redshifted and fitted by a diluted blackbody in the RXTE/PCA
  3-20 keV energy band, and corresponding values of the color correction (hardness
  factors) fc are presented.  Conclusions: Theoretical dependences fc-L/LEdd can be
  fitted to the observed dependence K -1/4-F of the blackbody normalization K on flux
  during cooling stages of X-ray bursts to determine the Eddington flux and the ratio
  of the apparent neutron star radius to the source distance. If the distance is known,
  these parameters can be transformed to the constraints on neutron star mass and
  radius. Theoretical atmosphere spectra can also be used for direct comparison with
  the observed X-ray burst spectra.  Tables A.1 and A.2 are only available in electronic
  form at CDS via anonymous ftp to cdsarc.u-strasbg.fr (130.79.125.5) or via http://cdsarc.u-strasbg.fr/viz-bin/qcat?J/A+A/527/A139'
