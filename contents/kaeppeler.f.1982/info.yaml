abstract: A best set of neutron-capture cross sections has been evaluated for the
  most important s-process isotopes. With this data base, s-process studies have been
  carried out using the traditional model which assumes a steady neutron flux and
  an exponential distribution of neutron irradiations. The calculated sigma-N curve
  is in excellent agreement with the empirical sigma-N-values of pure s-process nuclei.
  Simultaneously, good agreement is found between the difference of solar and s-process
  abundances and the abundances of pure r-process nuclei. The abundance pattern of
  the iron group elements where s-process results complement the abundances obtained
  from explosive nuclear burning is discussed. The results obtained from the traditional
  s-process model such as seed abundances, mean neutron irradiations, or neutron densities
  are compared to recent stellar model calculations which assume the He-burning shells
  of red giant stars as the site for the s-process.
