abstract: The origin of the shallow decay segment in Swift XRT light curves remains
  a puzzle. We analyze the properties of this segment with a sample of 53 long Swift
  GRBs detected before 2007 February. We show that the distributions of the sample's
  characteristics are lognormal or normal, and its isotropic X-ray energy (Eiso,X)
  is linearly correlated with the prompt gamma-ray energy but with a steeper photon
  spectrum, aside from some X-ray flashes. No significant spectral evolution is observed
  from this phase to the following phase, and the latter is usually consistent with
  external-shock models, implying that the shallow decay is also of external-shock
  origin, likely a refreshed external shock. Within the refreshed-shock model, the
  data are generally consistent with a roughly constant injection luminosity up to
  the end of this phase, tb. A positive correlation between Eiso,X and tb also favors
  this scenario. Among the 13 bursts that have well-sampled optical light curves,
  six have an optical break around tb and the breaks are consistent with being achromatic.
  However, the other seven either do not show an optical break or have a break at
  an epoch different from tb. This raises a concern for the energy injection scenario,
  suggesting that the optical and X-ray emission may not be the same component, at
  least for some bursts. There are four significant outliers in the sample, GRBs 060413,
  060522, 060607A, and 070110. The shallow decay phase in these bursts is immediately
  followed by a very steep decay after tb, which is inconsistent with any external-shock
  model. The optical data for these bursts evolve independently from the X-ray data.
  These X-ray plateaus likely have an internal origin and demand continuous operation
  of a long-term central engine. We conclude that the observed shallow decay phase
  likely has diverse physical origins.
