abstract: SN 1997D in NGC 1536 is possibly the least luminous and energetic Type II
  supernova discovered to date. The entire light curve is subluminous, never reaching
  MV=-14.65. The radioactive tail follows the 56Co decay slope. In the case of a nearly
  complete trapping of the gamma-rays, the 56Ni mass derived from the tail brightness
  is extremely small, ~0.002 Msolar. At discovery, the spectra showed a red continuum
  and line velocities on the order of 1000 km s-1. The luminosity and the photospheric
  expansion velocity suggest that the explosion occurred about 50 days before discovery
  and that a plateau probably followed. Model light curves and spectra of the explosion
  of a 26 Msolar star successfully fitted the observations. Low-mass models are inconsistent
  with the observations. The radius of the progenitor, constrained by the prediscovery
  upper limits, is R0<~300 Rsolar. A low explosion energy of ~4\texttimes{}1050 ergs
  is then required in the modeling. The strong Ba II lines in the photospheric spectra
  are reproduced with a solar abundance and low Teff. A scenario in which the low
  56Ni mass observed in SN 1997D is due to fallback of material onto the collapsed
  remnant of the explosion of a 25-40 Msolar star appears to be favored over the case
  of the explosion of an 8-10 Msolar star with low 56Ni production.  Based on observations
  collected at ESO-La Silla and Cerro Tololo Inter-American Observatory (CTIO) (Chile).
  CTIO, a part of the National Optical Astronomy Observatories, is operated by the
  Association of Universities for Research in Astronomy (AURA), Inc., under cooperative
  agreement with the National Science Foundation.
