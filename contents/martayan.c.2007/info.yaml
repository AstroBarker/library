abstract: 'Aims:Observations of hot stars belonging to the young cluster SMC-NGC 330
  and its surrounding region were obtained with the VLT-GIRAFFE facilities in MEDUSA
  mode. We investigated the B and Be star properties and proportions in this environment
  of low metallicity. We also searched for rapid variability in Be stars using photometric
  databases.  Methods: Using spectroscopic measurements, we characterized the emission
  and properties of Be stars. By cross-correlation with photometric databases such
  as MACHO and OGLE, we searched for binaries in our sample of hot stars, as well
  as for short-term variability in Be stars.  Results: We report on the global characteristics
  of the Be star sample (131 objects). We find that the proportion of early Be stars
  with a large equivalent width of the Halpha emission line is higher in the SMC than
  in the LMC and MW. We find a slight increase in the proportion of Be stars compared
  to B-type stars with decreasing metallicity. We also discovered spectroscopic and
  photometric binaries, and for the latter we give their orbital period. We identify
  13 Be stars with short-term variability. We determine their period(s) and find that
  9 Be stars are multiperiodic.  Figures 1, 5-20, and Tables 1, 6, 7 are only available
  in electronic form at http://www.aanda.org'
