abstract: We study how the internal structure of a neutron star and the physical processes
  that may occur during its evolution affect the quasi-normal mode spectrum, and consequently
  the gravitational radiation it emits. We discuss whether these modes can be excited
  and how much energy they should carry for the gravitational signal to be detectable
  by the first generation of interferometric antennas or by the new generation of
  high-frequency gravitational detectors, interferometric or resonant, that are under
  investigation.
