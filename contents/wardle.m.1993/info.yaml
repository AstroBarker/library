abstract: Equations are obtained which govern the disk-wind structure and identify
  the physical parameters relevant to circumstellar disks. The system of equations
  is analyzed in the thin-disk approximation, and it is shown that the system can
  be consistently reduced to a set of ordinary differential equations in z. Representative
  solutions are presented, and it is shown that the apparent paradox discussed by
  Shu (1991) is resolved when the finite thickness of the disk is taken into account.
  Implications of the results for the origin of bipolar flows in young stellar objects
  and possible application to active galactic nuclei are discussed.
