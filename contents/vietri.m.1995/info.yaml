abstract: Ultra-high-energy cosmic rays (UHECRs) are roughly isotropic and attain
  very large energies, E \greaterequivlnt{} 3 \texttimes{} 1020 eV. Conventional models
  fail to explain both facts. I show here that acceleration of UHECRs in gamma-ray
  bursts (GRBs) satisfies both observational constraints. Using the M{\'e}sz{\'a}ros
  \& Rees model (see their recent work) of GRBs as due to hyperrelativistic shocks,
  I show that the highest energies that can be attained thusly are E \allequal{} 1020
  theta-5/3/ n15/6 eV, explaining the energy of the Bird et al. event (described in
  their recent work) even without beaming. The traditional photopion catastrophe affecting
  UHECR acceleration in active galactic nuclei is circumvented. An order of magnitude
  estimate shows that the total energy flux of UHECRs at Earth is also correctly reproduced.
  A test of the model based upon the UHECRs' distribution upon the plane of the sky
  is briefly discussed.
