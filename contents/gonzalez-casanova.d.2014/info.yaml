abstract: The circumstellar medium (CSM) of a massive star is modified by its winds
  before a supernova (SN) explosion occurs, and thus the evolution of the resulting
  supernova remnant (SNR) is influenced by both the geometry of the explosion as well
  as the complex structure of the CSM. Motivated by recent work suggesting the SNR
  W49B was a jet-driven SN expanding in a complex CSM, we explore how the dynamics
  and the metal distributions in a jet-driven explosion are modified by the interaction
  with the surrounding environment. In particular, we perform hydrodynamical calculations
  to study the dynamics and explosive nucleosynthesis of a jet-driven SN triggered
  by the collapse of a 25 M \&sun; Wolf-Rayet star and its subsequent interaction
  with the CSM up to several hundred years following the explosion. We find that although
  the CSM has small-scale effects on the structure of the SNR, the overall morphology
  and abundance patterns are reflective of the initial asymmetry of the SN explosion.
  Thus, we predict that jet-driven SNRs, such as W49B, should be identifiable based
  on morphology and abundance patterns at ages up to several hundred years, even if
  they expand into a complex CSM environment.
