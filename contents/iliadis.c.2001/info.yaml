abstract: Proton-induced reaction rates on 26 stable and 29 unstable target nuclei
  in the mass A=20-40 region have been evaluated and compiled. Recommended reaction
  rates, assuming that all interacting nuclei are in the ground state, are presented
  in tabular form on a temperature grid in the range T=0.01-10.0 GK. Most reaction
  rates involving stable targets were normalized to a set of measured standard resonance
  strengths in the sd shell. For the majority of reaction rates, experimental information
  from transfer reaction studies has been used consistently. Our results are compared
  with recent statistical model (Hauser-Feshbach) calculations. Reaction rate uncertainties
  are presented and amount to several orders of magnitude for many of the reactions.
  Several of these reaction rates and/or their corresponding uncertainties deviate
  from results of previous compilations. In most cases, the deviations are explained
  by the fact that new experimental information became available recently. Examples
  are given for calculating reaction rates and reverse reaction rates for thermally
  excited nuclei from the present results. The survey of literature for this review
  was concluded in 2000 August.
