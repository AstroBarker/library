abstract: The hydrodynamical problem of nuclear explosion of a dense carbon core of
  a star with mass equal to 1.40 solar mass is solved numerically. In calculation
  the kinetics of carbon burning at the nuclear reaction C-12 + C-12 yields M-24 +
  gamma rate is included. Thus the inverse effect of hydrodynamical motion on the
  process of thermonuclear burning is taken into account, as compared with Bruenn's
  (1972) calculations. The calculations show that a pulsation regime of burning is
  realized which evolves to the detonation regime with full combustion and disruption
  of the star only at the third pulse. The effects of disintegration of iron group
  nuclei, neutronization of matter, and neutrino losses in URCA processes have not
  yet been considered in calculations. Conclusions are made on new possibilities of
  formation of a gravitationally bound remnant of the explosion and a neutron star.
