abstract: 'Results are presented from mathematical and modeling studies to make estimates
  of the intensity of the ionizing background more definite and quantitative. It is
  shown that the observed quasars fail to emit sufficient ionizing radiation to satisfy
  the Gunn-Peterson test. Two possible sources for the additional source of UV radiation
  are examined: main-sequence, high mass stars in primordial galaxies and quasars
  that have not been observed because of dust obscuration. Both of these models satisfy
  the observational constraints with reasonable parameters. It is suggested that observations
  of He lines from Ly-alpha clouds or an analysis of the line ratios in metal line
  absorption systems may be used to determine which sources produce the ionizing background.'
