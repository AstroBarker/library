abstract: We report the first year's on-orbit performance results for the Galaxy Evolution
  Explorer (GALEX), a NASA Small Explorer that is performing a survey of the sky in
  two ultraviolet bands. The instrument comprises a 50 cm diameter modified Ritchey-Chr{\'e}tien
  telescope with a 1.25d field of view, selectable imaging and objective-grism spectroscopic
  modes, and an innovative optical system with a thin-film multilayer dichroic beam
  splitter that enables simultaneous imaging by a pair of photon-counting, microchannel-plate,
  delay-line readout detectors. Initial measurements demonstrate that GALEX is performing
  well, meeting its requirements for resolution, efficiency, astrometry, bandpass
  definition, and survey sensitivity.
