abstract: A two dimensional radiation diffusion coupled to hydrodynamics calculation
  of nonspherical instabilities in the collapsed core from a massive star is performed.
  The core properties are taken from a one-dimensional collapse calculated with detailed
  microphysics and neutrino transport. The shocked outer core (mass between 0.7 and
  1.3 solar masses) is found to contain three subregions. The innermost is doubly
  diffusive (neutron fingers) unstable, the center subregion is dynamically unstable,
  and the outermost is stable. It is found that the unstable part of the outer core
  overturns in approximately 5 ms without disturbing the inner unshocked core of mass
  less than 0.7 solar masses. This overturned outer core expands as a piston, creating
  an outgoing shock wave which may help power envelope ejection. This outer core overturn
  would seem to be a generic feature of core collapse which has heretofore been neglected.
