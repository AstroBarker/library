abstract: A demonstration is presented that a finite-amplitude circularly-polarized
  Alfven wave is generally unstable in a MHD fluid. The wave decays by a four-wave
  coupling process in which the daughter waves are forward propagating random density
  and magnetic fluctuations and a backward-propagating magnetic wave. For parameters
  typical of the solar corona and the solar wind (thermal to magnetic energy density
  ratios between 0.1 and 1, and values between 0.1 and 0.9 for the ratio of magnetic
  energy density of the initial Alfven wave to that of the background magnetic field),
  large decay rates are found.
