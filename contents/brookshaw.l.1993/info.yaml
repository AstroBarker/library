abstract: We study numerically the average loss of specific angular momentum from
  binary systems due to mass outflow from one of the two stars for a variety of initial
  injection geometries and wind velocities. We present results of ballistic calculations
  in three dimensions for initial mass ratios q of the mass-losing star to primary
  star in the range q between 10 exp -5 and 10. We consider injection surfaces close
  to the Roche lobe equipotential surface of the mass-losing star, and also cases
  with the mass-losing star underfilling its Roche lobe. We obtain that the orbital
  period is expected to have a negative time derivative for wind-driven secular evolution
  of binaries with q greater than about 3 and with the mass-losing star near filling
  its Roche lobe. We also study the effect of the presence of an absorbing surface
  approximating an accretion disk on the average final value of the specific angular
  momentum loss. We find that the effect of an accretion disk is to increase the wind-driven
  angular momentum loss. Our results are relevant for evolutionary models of high-mass
  binaries and low-mass X-ray binaries.
