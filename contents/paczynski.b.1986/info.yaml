abstract: It is proposed that some, perhaps most, gamma-ray bursters are at cosmological
  distances, like quasars, with a redshift of about 1 or 2. This proposition requires
  a release of supernova-like energy of about 10 to the 51st ergs within less than
  1 s, making gamma-ray bursters the brightest objects known in the universe, many
  orders of magnitude brighter than any quasars. This power must drive a highly relativistic
  outflow of electron-positron plasma and radiation from the source. It is proposed
  that three gamma-ray bursts, all with identical spectra, detected from B1900 + 14
  by Mazets, Golenetskii, and Gur'yan and reported in 1979, were all due to a single
  event multiply imaged by a gravitational lens. The time intervals between the successive
  bursts, 10 hr to 3 days, were due to differences in the light travel time for different
  images.
