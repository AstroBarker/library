abstract: We analyze the neutron-capture element (Z greater than 30) abundance distribution
  of the ultra-metal-poor (but neutron-capture element rich) halo star CS 22892-052.
  The observed stellar elemental distribution is compared with those produced by the
  slow and rapid neutron capture processes (i.e., the s- and r-process) in solar system
  material. This comparison indicates that the elemental abundances, from barium to
  erbium, in this Galactic halo star, have the same relative proportions as the solar
  system r-process distirbution. Within the uncertainties of the abundance determinations,
  the elements strontium and zirconium, but not yttrium, also fall on the same scaled
  solar r-process curve. The main component of the s-process cannot reproduce the
  observed neutron-capture abundances in this star. The weak component of the s-process,
  expected to occur during core helium burning in massive stars, can fit the relative
  abundance distribution of Sr and Y, but not Zr, suggesting that for the currently
  observed abundances in CS 22892-052, an admixture of the weak s- and the r-process
  might be required for production of the elements Sr to Zr. These results give evidence
  of the occurrence of heavy element nucleosynthesis, particularly the r-process,
  early in the history of the Galaxy, and further suggest a generation of massive
  stars (the astrophysical site for the r-process), preceding the formation of this
  very metal poor halo star, that was responsible for producing the observed heavy
  elements.
