abstract: We present magnetohydrodynamic (MHD) models of stellar core collapse computed
  with our astrophysical MHD code GenASiS. Microphysics in the models include a realistic
  equation of state and a simple parametrization of deleptionization during collapse.
  We give a brief description of some numerical results, and discuss requirements
  for capturing the physics of the magnetorotational instability in the context of
  core collapse supernovae.
