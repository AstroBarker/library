abstract: The stability of axisymmetric, differential rotation in nonmagnetic stars
  of uniform chemical composition is studied in the context of general relativity
  theory. Criteria are found for stability against local, linear, axisymmetric perturbations
  in conducting, viscous stars and in perfect fluid models. When stated in the proper
  language, the relativistic stability conditions have the same forms as the nonrelativistic
  conditions. When thermal conduction is much more efficient than viscosity, a star
  must be barotropic (the level surfaces of the pressure and the total density of
  mass energy must coincide) and the gradient of the geometrical angular momentum
  (L) must never point toward the interior of the quasicylindrical level surfaces
  of L. When viscosity dominates thermal conductivity by a large margin, a star must
  be barotropic. When conduction and viscosity have comparable efficiencies or are
  absent, the criteria are slightly more complex. Applications of the stability conditions
  to models of specific astrophysical objects are discussed.
