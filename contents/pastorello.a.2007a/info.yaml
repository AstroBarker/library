abstract: An anomalous transient in the early Hubble-type (S0) galaxy Messier 85 (M85)
  in the Virgo cluster was discovered by Kulkarni et al. (2007) on 7 January 2006
  that had very low luminosity (peak absolute R-band magnitude MR of about -12) that
  was constant over more than 80 days, red colour and narrow spectral lines, which
  seem inconsistent with those observed in any known class of transient events. Kulkarni
  et al. (2007) suggest an exotic stellar merger as the possible origin. An alternative
  explanation is that the transient in M85 was a type II-plateau supernova of extremely
  low luminosity, exploding in a lenticular galaxy with residual star-forming activity.
  This intriguing transient might be the faintest supernova that has ever been discovered.
