abstract: We present here an efficient numerical scheme for solving the non-relativistic
  one-dimensional radiation-hydrodynamics equations including inelastic Compton scattering,
  which is not included in most codes and is crucial for solving problems such as
  shock breakout. The devised code is applied to the problems of a steady-state planar
  radiation mediated shock (RMS) and RMS breakout from a stellar envelope. The results
  are in agreement with those of a previous work on shock breakout, in which Compton
  equilibrium between matter and radiation was assumed and the "effective photon"
  approximation was used to describe the radiation spectrum. In particular, we show
  that the luminosity and its temporal dependence, the peak temperature at breakout,
  and the universal shape of the spectral fluence derived in this earlier work are
  all accurate. Although there is a discrepancy between the spectral calculations
  and the effective photon approximation due to the inaccuracy of the effective photon
  approximation estimate of the effective photon production rate, which grows with
  lower densities and higher velocities, the difference in peak temperature reaches
  only 30\% for the most discrepant cases of fast shocks in blue supergiants. The
  presented model is exemplified by calculations for supernova 1987A, showing the
  detailed evolution of the burst spectrum. The incompatibility of the stellar envelope
  shock breakout model results with observed properties of X-ray flashes (XRFs) and
  the discrepancy between the predicted and observed rates of XRFs remain unexplained.
