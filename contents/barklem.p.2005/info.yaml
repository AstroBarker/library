abstract: Data for the broadening of 24188 Fe II lines by collisions with neutral
  hydrogen atoms have been computed using the theory of Anstee \& O'Mara as extended
  to singly ionised species and higher orbital angular momentum states by Barklem
  \& O'Mara. Data have been computed for all Fe II lines between observed energy levels
  in the line lists of Kurucz with log gf > -5 for which the theory is applicable.
  The variable energy debt parameter Ep used in computing the second order perturbation
  theory potential is chosen to be consistent with the long range dispersion interaction
  constant C6 computed using the f-values from Kurucz.
