abstract: 'We explore the sensitivity of the nucleosynthesis of intermediate-mass
  elements (28<=A<~80) in supernovae derived from massive stars to the nuclear reaction
  rates employed in the model. Two standard sources of reaction rate data are employed
  in pairs of calculations that are otherwise identical. Both include as a common
  backbone the experimental reactions rates of Caughlan \& Fowler. Two stellar models
  are calculated for each of two masses: 15 and 25 Msolar. Each star is evolved from
  core hydrogen burning to a presupernova state carrying an appropriately large reaction
  network and then exploded using a piston near the edge of the iron core as described
  by Woosley \& Weaver. The final stellar yields from the models calculated with the
  two rate sets are compared and found to differ in most cases by less than a factor
  of 2 over the entire range of nuclei studied. Reasons for the major discrepancies
  along with the physics underlying the two reaction rate sets employed are discussed
  in detail. The nucleosynthesis results are relatively robust and less sensitive
  than might be expected to uncertainties in nuclear reaction rates, though they are
  sensitive to the stellar model employed.'
