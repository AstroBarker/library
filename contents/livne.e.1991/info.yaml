abstract: The paper presents results of two-dimensional simulations of detonations
  in helium shells, accreted above various C-O cores. The present calculations confirm
  results of one-dimensional calculations, showing that a detonation in a heavy helium
  layer of 0.1-0.3 solar mass, must ignite a detonation in the core, leading to the
  total disruption of the star (Livne).
