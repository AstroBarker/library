abstract: A fully general relativistic computer code is employed to follow the dynamical
  collapse of spherical supermassive stars to black holes. Collapse to a black hole
  can be followed accurately without encountering physical or numerical singularities,
  even after the formation of an event horizon. We find that, in spite of the initial
  central density concentration, the collapse proceeds quite homologously. Our singularity-free
  treatment thus confirms earlier findings of Appenzeller and Fricke and of Smarr
  and Wilson. The implications of our results for gravitational wave emission are
  discussed.
