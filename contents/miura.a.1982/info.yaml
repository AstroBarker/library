abstract: A general stability analysis is given of the Kevin-Helmholtz instability,
  for the case of sheared MHD flow of finite thickness in a compressible plasma which
  allows for the arbitrary orientation of the magnetic field, velocity flow, and wave
  vector in the plane perpendicular to the velocity gradient. The stability problem
  is reduced to the solution of a single second-order differential equation including
  a gravitational term to represent the coupling between the Kelvin-Helmholtz mode
  and the interchange mode. Compressibility and a magnetic field component parallel
  to the flow are found to be stabilizing effects, with destabilization of only the
  fast magnetosonic mode in the transverse case, and the presence of both Alfven and
  slow magnetosonic components in the parallel case. Analysis results are used in
  a discussion of the stability of sheared plasma flow at the magnetopause boundary
  and in the solar wind.
