abstract: Supernovae of Type II occur at the end of the evolution of massive stars.
  The phenomenon begins when the iron core of the star exceeds a Chandrasekhar mass.
  The collapse of that core under gravity is well understood and takes a fraction
  of a second. To understand the phenomenon, a detailed knowledge of the equation
  of state at the relevant densities and temperatures is required. After collapse,
  the shock wave moves outward, but probably does not succeed in expelling the mass
  of the star. The most likely mechanism to do so is the absorption of neutrinos from
  the core by the material at medium distances. Observations and theory connected
  with SN 1987A are discussed, as are the conditions just before collapse and the
  emission of neutrinos by the collapsed core.
