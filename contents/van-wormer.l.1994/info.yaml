abstract: Hot hydrogen burning has been analyzed for temperatures and densities typical
  for explosive burning on compact objects and in supernovae. Reaction flow impedances
  due to cyclic reaction sequences, the role of waiting point nuclei, and the transition
  from the rp-process to the alpha p-process are discussed as a function of increasing
  temperature and nuclear properties. The analysis gives a clear indication of which
  nuclei play a crucial role in the burning process. It is here where experimental
  verifications of the presented reaction rate estimates are highly desirable. The
  same nuclei can also be utilized to devise minimum-size energy generation networks
  to be employed in hydrodynamic explosion calculations. Examples for specific conditions
  during supernova explosions, nova outbursts, or the evolution of Thorne-Zytkow objects
  are given, with typical abundance patterns expected in such events.
