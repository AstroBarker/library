abstract: A near-infrared spectrum and several optical spectra of SN 1983N obtained
  over a period from 10 days before maximum light to about a week after maximum and
  of SN 1984L from about maximum light to about 60 days later are presented. On the
  basis of these spectra it is argued that the first definite identification of helium
  in supernova ejecta near maximum light has been made. The emergence of oxygen emission
  lines which presage the dramatic transition to the supernebular phase is identified.
  Supernova atmosphere models which are consistent with the observations are presented,
  and it is argued that a strong departure of helium level populations from LTE is
  necessary. The current status of SNe Ib, the arguments that they result from core
  collapse in moderately massive stars, and some of the immediate work necessary to
  further clarify the nature of these events are summarized.
