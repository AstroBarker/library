abstract: A procedure for estimating the ranges of parameters that describe the spectra
  of X-rays from clusters of galaxies is presented. The applicability of the method
  is proved by statistical simulations of cluster spectra; such a proof is necessary
  because of the nonlinearity of the spectral functions. Implications for the spectra
  of the Perseus, Coma, and Virgo clusters are discussed. The procedure can be applied
  in more general problems of parameter estimation.
