abstract: Detailed calculations are made of the neutrino spectra emitted during gravitational
  collapse events (Type II supernovae?). Those aspects of the neutrino signal which
  are relatively independent of the collapse model and those aspects which are sensitive
  to model details are discussed. The easier to detect high-energy tail of the emitted
  neutrinos has been calculated using the Boltzmann equation. This is compared with
  the result of the traditional multigroup flux-limited diffusion calculations. The
  harder to detect electron antineutrino background from historical supernovae might
  be enhanced by matter oscillation of higher energy mu and tau neutrinos to electon
  antineutrinos.
