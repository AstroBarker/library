abstract: We investigate the production of26Al during hydrogen burning and its ejection
  by massive single and binary stars. Effects of convection and rotation are studied.
  We discuss the importance of RSGs, LBVs and WR stars to the total Galactic26Al production,
  and the detection probability of the26Al decay in individual objects as P Cygni,gamma
  Velorum andeta Carinae.
