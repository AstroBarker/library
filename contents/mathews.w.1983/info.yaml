abstract: In the present investigation of the possibility of a stellar origin for
  the emission line gas and its confining medium in quasars and Seyfert galaxies,
  the radiative ablation of the photospheres by quasar radiation pressure appears
  preferable to thermal evaporation, thermally driven winds, stellar collisions and
  tidal disruptions, and evolutionary stellar mass loss mechanisms, as an abundant
  and steady source of low temperature gas. Several lines of evidence suggest that
  fully convective draft stars absorb and mix the energy of hard quasar X-radiation
  deep within their interiors, increasing the total energy of the stars, which then
  undergo reverse stellar evolution. Eventually, the radiative ablation of the inflated
  stars by hard quasar X-rays becomes possible. It is widely asserted that the near-IR
  source IRS 16 is the stellar nucleus of our galaxy. Its unusual CO absorption weakness
  suggests that reverse stellar evolution may have occurred in the galaxy during a
  previous Seyfert-like episode.
