abstract: An investigation is made of the dynamical effects of the intracluster magnetic
  field, whose radial inflow and shear can produce a dramatic increase in the field's
  strength while rendering it more radial, with cooling flows. It is found that field
  reconnection is the most likely dominant-loss mechanism, so that buoyancy effects
  are probably not important. Attention is given to the effect of the magnetic field
  on thermal instabilities. The most important observable effect of the magnetic field
  in cooling flows will probably be very strong Faraday rotation of the polarization
  of radio sources within or behind the cooling flow.
