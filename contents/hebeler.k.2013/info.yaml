abstract: Microscopic calculations of neutron matter based on nuclear interactions
  derived from chiral effective field theory, combined with the recent observation
  of a 1.97 $\pm$ 0.04 M \&sun; neutron star, constrain the equation of state of neutron-rich
  matter at sub- and supranuclear densities. We discuss in detail the allowed equations
  of state and the impact of our results on the structure of neutron stars, the crust-core
  transition density, and the nuclear symmetry energy. In particular, we show that
  the predicted range for neutron star radii is robust. For use in astrophysical simulations,
  we provide detailed numerical tables for a representative set of equations of state
  consistent with these constraints.
