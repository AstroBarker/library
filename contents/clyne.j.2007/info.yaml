abstract: The ever increasing processing capabilities of the supercomputers available
  to computational scientists today, combined with the need for higher and higher
  resolution computational grids, has resulted in deluges of simulation data. Yet
  the computational resources and tools required to make sense of these vast numerical
  outputs through subsequent analysis are often far from adequate, making such analysis
  of the data a painstaking, if not a hopeless, task. In this paper, we describe a
  new tool for the scientific investigation of massive computational datasets. This
  tool (VAPOR) employs data reduction, advanced visualization, and quantitative analysis
  operations to permit the interactive exploration of vast datasets using only a desktop
  PC equipped with a commodity graphics card. We describe VAPORs use in the study
  of two problems. The first, motivated by stellar envelope convection, investigates
  the hydrodynamic stability of compressible thermal starting plumes as they descend
  through a stratified layer of increasing density with depth. The second looks at
  current sheet formation in an incompressible helical magnetohydrodynamic flow to
  understand the early spontaneous development of quasi two-dimensional (2D) structures
  embedded within the 3D solution. Both of the problems were studied at sufficiently
  high spatial resolution, a grid of 5042 by 2048 points for the first and 15363 points
  for the second, to overwhelm the interactive capabilities of typically available
  analysis resources.
