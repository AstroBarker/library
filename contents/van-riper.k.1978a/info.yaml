abstract: Adiabatic (no transport of energy) evolutionary calculations are made to
  study the pure hydrodynamic motions of collapsing cores of massive stars. The equation
  of state is parameterized by an adiabatic index varying with density. The results
  of the evolution, in particular the densities and amplitude of the bounce, and the
  energy ejected from the surface by a reflected shock wave, are presented for a large
  number of parameters in the equation of state. Emphasis is placed in finding those
  parameters most favorable for mass ejection. The ejected energy depends mainly on
  the adiabatic index in the mantle rather than on the energy in the bounce. The evolutionary
  parameters scale simply with the total mass. The relevance of these calculations
  to transport calculations is considered. The remnant left by those models ejecting
  mass, for an initial 1.4-solar masses configuration, will evolve to a neutron star
  of mass about 1.3 solar masses.
