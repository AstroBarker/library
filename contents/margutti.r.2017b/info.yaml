abstract: We report the discovery of rising X-ray emission from the binary neutron
  star merger event GW170817. This is the first detection of X-ray emission from a
  gravitational-wave (GW) source. Observations acquired with the Chandra X-ray Observatory
  (CXO) at t\approx{} 2.3 days post-merger reveal no significant emission, with {L}x\lessequivlnt{}
  3.2\texttimes{} {10}38 {erg} {{{s}}}-1 (isotropic-equivalent). Continued monitoring
  revealed the presence of an X-ray source that brightened with time, reaching {L}x\approx{}
  9\texttimes{} {10}38 {erg} {{{s}}}-1 at \approx{} 15.1 days post-merger. We interpret
  these findings in the context of isotropic and collimated relativistic outflows
  (both on- and off-axis). We find that the broadband X-ray to radio observations
  are consistent with emission from a relativistic jet with kinetic energy {E}k\texttildelow{}
  {10}49-50 {erg}, viewed off-axis with {theta }{obs}\texttildelow{} 20^\circ {--}40^\circ
  . Our models favor a circumbinary density n\texttildelow{} {10}-4{--}{10}-2 {{cm}}-3,
  depending on the value of the microphysical parameter {\ensuremath{\epsilon} }B={10}-4{--}{10}-2.
  A central-engine origin of the X-ray emission is unlikely. Future X-ray observations
  at t\greaterequivlnt{} 100 days, when the target will be observable again with the
  CXO, will provide additional constraints to solve the model degeneracies and test
  our predictions. Our inferences on {theta }{obs} are testable with GW information
  on GW170817 from advanced LIGO/Virgo on the binary inclination.
