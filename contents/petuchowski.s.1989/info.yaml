abstract: A model for the formation of CO in the expanding ejecta of SN 1987A suggests
  that the 4.6-micron and 2.3 micron emissions noted in the SN spectrum may originate
  from the inner metal-rich regions of the ejecta. Also reported are the assignment
  of a 2.26-micron excess feature in the high-resolution IR spectra to the v = 2 to
  0 overtone of CO(+) and the possible identification of a 2.95-micron feature with
  the v = 2 to 0 transition of electronically excited CO. The results suggest that
  the regions in which CO formation takes place must be ionized to a substantially
  lower degree than regions which dominate the line emission of heavier metals.
