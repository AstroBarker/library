abstract: Local and global stability analyses of spherically symmetric, X-ray heated
  and optically thin accretion flow show that solutions exist which, although globally
  stable, become subject to a finite amplitude drift instability due to bremsstrahlung
  cooling at luminosities which exceed a near equality between the L(x)/L(E) ratio
  and the e(asterisk)/e ratio, where the former term is approximately 0.003 and e
  is the X-ray production efficiency. Time integrations in the unstable regime show
  X-ray flares on time scales of 0.4-30 (mass/solar mass) days.
