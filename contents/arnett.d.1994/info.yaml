abstract: With new hydrodynamic techniques, the relatively fast evolutionary stages
  of a star prior to core collapse may be explicitly computed in two spatial dimensions,
  with a treatment of the microphysics (e.g., nuclear reactions, equation of state,
  neutrino cooling) which is comparable to typical one-dimensional simulations. The
  nature of shell oxygen burning in a massive star, prior to core collapse, is used
  as a first example; it is of particular interest because it is (1) the region in
  which Ni-56 will be produced by the supernova shock, (2) the region of the 'mass
  cut', which will separate the collapsed core from the ejected mantle, (3) the site
  of much of the explosive nucleosynthesis, and (4) a suggested source of symmetry
  breaking to drive mixing instabilities which were observed in SN 1987A. The nature
  of the shell burning affects the size of the core which will collapse. The method
  is illustrated on this test case, and the character of the convection is examined.
