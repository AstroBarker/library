abstract: Previous work on neutrino emission from proto-neutron stars which employed
  full solutions of the Boltzmann equation showed that the average energies of emitted
  electron neutrinos and antineutrinos are closer to one another than predicted by
  older, more approximate work. This in turn implied that the neutrino driven wind
  is proton rich during its entire life, precluding r-process nucleosynthesis and
  the synthesis of Sr, Y, and Zr. This work relied on charged-current neutrino interaction
  rates that are appropriate for a free nucleon gas. Here, it is shown in detail that
  the inclusion of the nucleon potential energies and collisional broadening of the
  response significantly alters this conclusion. Isovector interactions, which give
  rise to the nuclear symmetry energy, produce a difference between the neutron and
  proton single-particle energies DeltaU=Un-Up and alter the kinematics of the charged-current
  reactions. In neutron-rich matter, and for a given neutrino/antineutrino energy,
  the rate for nue+n-->e-+p is enhanced while nu\textasciimacron{}e+p-->n+e+ is suppressed
  because the Q value for these reactions is altered by $\pm$DeltaU, respectively.
  In the neutrino decoupling region, collisional broadening acts to enhance both nue
  and nu\textasciimacron{}e cross sections, and random-phase approximation (RPA) corrections
  decrease the nue cross section and increase the nu\textasciimacron{}e cross section,
  but mean field shifts have a larger effect. Therefore, electron neutrinos decouple
  at lower temperature than when the nucleons are assumed to be free and have lower
  average energies. The change is large enough to allow for a reasonable period of
  time when the neutrino driven wind is predicted to be neutron rich. It is also shown
  that the electron fraction in the wind is influenced by the nuclear symmetry energy.
