abstract: An 8.8M\&sun; electron-capture supernova was simulated in spherical symmetry
  consistently from collapse through explosion to essentially complete deleptonization
  of the forming neutron star. The evolution time (\texttildelow{}9s) is short because
  high-density effects suppress our neutrino opacities. After a short phase of accretion-enhanced
  luminosities (\texttildelow{}200ms), luminosity equipartition among all species
  becomes almost perfect and the spectra of nu\textasciimacron{}e and nu\textasciimacron{}mu,tau
  very similar, ruling out the neutrino-driven wind as r-process site. We also discuss
  consequences for neutrino flavor oscillations.
