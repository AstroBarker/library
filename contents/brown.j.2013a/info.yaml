abstract: We explore the sensitivity of nucleosynthesis in massive stars to the truncation
  of supernova explosions above a certain mass. It is assumed that stars of all masses
  contribute to nucleosynthesis by their pre-explosive winds, but above a certain
  limiting main sequence mass, M BH, the presupernova star becomes a black hole and
  ejects nothing more. The solar abundances from oxygen to atomic mass 90 are fit
  quite well assuming no cutoff at all, i.e., by assuming all stars up to 120 M \&sun;
  make successful supernovae. Little degradation in the fit occurs if M BH is reduced
  to 25 M \&sun;. If this limit is reduced further however, the nucleosynthesis of
  the s-process declines precipitously and the production of species made in the winds,
  e.g., carbon, becomes unacceptably large compared with elements made in the explosion,
  e.g., silicon and oxygen. By varying uncertain physics, especially the mass loss
  rate for massive stars and the rate for the 22Ne(alpha, n)25Mg reaction rate, acceptable
  nucleosynthesis might still be achieved with a cutoff as low as 18 M \&sun;. This
  would require, however, a supernova frequency three times greater than the fiducial
  value obtained when all stars explode in order to produce the required 16O. The
  effects of varying M BH on the nucleosynthesis of 60Fe and 26Al, the production
  of helium as measured by DeltaY/DeltaZ, and the average masses of compact remnants
  are also examined.
