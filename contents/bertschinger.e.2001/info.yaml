abstract: This paper describes the generation of Gaussian random fields with multiple
  levels of resolution. We present the theory of adaptive mesh refinement of Gaussian
  random fields followed by the implementation and testing of a computer code package
  performing this refinement called ``GRAFIC2.'' This package is available to the
  computational cosmology community at http://arcturus.mit.edu/grafic/ or by e-mail
  from the author.
