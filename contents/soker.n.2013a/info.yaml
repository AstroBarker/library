abstract: We argue that the multiple shells of circumstellar material (CSM) and the
  supernovae (SNe) ejecta interaction with the CSM starting 59 d after the explosion
  of the Type Ia SN PTF 11kx are best described by a violent prompt merger. In this
  prompt merger scenario, the common envelope (CE) phase is terminated by a merger
  of a white dwarf (WD) companion with the hot core of a massive asymptotic giant
  branch star. In most cases, the WD is disrupted and accreted on to the more massive
  core. However, in the rare cases, where the merger takes place when the WD is denser
  than the core, the core will be disrupted and accreted on to the cooler WD. In such
  cases, the explosion might occur with no appreciable delay, i.e. months to years
  after the termination of the CE phase. This, we propose, might be the evolutionary
  route that could lead to the explosion of PTF 11kx. This scenario can account for
  the very massive CSM within \texttildelow{}1000 au of the exploding PTF 11kx star,
  for the presence of hydrogen, and for the presence of shells in the CSM.
