abstract: The K giant star CS 22892-052 is ultra-metal-poor ([Fe/H] ~=-3.1), but it
  has the largest abundance enhancements of neutron-capture elements yet discovered
  in any normal halo star. We have acquired new high-resolution, high signal-to-noise
  ratio spectra of CS 22892-052 and have determined a detailed abundance distribution
  of elements with Z > 30, in order to facilitate precise comparison with neutron-capture
  nucleosynthesis theories. Over 120 transitions throughout the wavelength range 3700-
  6500 {\AA} have been employed to derive abundances for 20 of these elements. We
  have detected several elements (Tb, Ho, Tm, Hf, and Os) never before seen in low-metallicity
  stars, and we have derived the abundance of Th from a clearly visible, mostly unblended,
  feature at 4019 {\AA}.  The elements from 56 <= Z <= 76 in CS 22892-052 are very
  well matched by a scaled solar system r-process abundance distribution. Scaled solar
  s-process or total abundances cannot be plausibly fitted to the observed data. The
  ratio of the Th abundance to that of any of these other elements is significantly
  subsolar, which suggests a much larger age for CS 22892-052 than 4.5 Gyr; a lower
  limit of 15.2.7 Gyr is inferred from a simple calculation.
