abstract: We have obtained time series optical spectra of the cataclysmic variable
  PQ And in quiescence. The spectra show a white dwarf continuum with narrow Balmer
  emission superimposed over strong Balmer absorption. The emission lines have blue
  and red components whose strength changes with time. An analysis of the Halpha emission
  line implies a short orbital period below the period gap. Given its lack of accretion
  disk features, its large and infrequent outbursts, and an orbital period below the
  period gap, PQ And is probably a low accretion rate object similar to WZ Sge. In
  addition, white dwarf model fits imply that PQ And is an excellent ZZ Cet candidate.
