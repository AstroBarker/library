abstract: We investigate the effect of nonevaporating primordial black holes (PBHs)
  on the ionization and thermal history of the universe. X-rays emitted by gas accretion
  onto PBHs modify the cosmic recombination history, producing measurable effects
  on the spectrum and anisotropies of the cosmic microwave background (CMB). Using
  the third-year WMAP data and COBE FIRAS data we improve existing upper limits on
  the abundance of PBHs with masses >0.1 M\&sun; by several orders of magnitude. The
  new upper limits still allow PBHs to be important for the origin of supermassive
  black holes and ultraluminous X-ray sources. Fitting WMAP3 data with cosmological
  models that do not allow for nonstandard recombination histories, as produced by
  PBHs or other early energy sources, may lead to an underestimate of the best-fit
  values of the amplitude of linear density fluctuations (sigma8) and the scalar spectral
  index (ns). Cosmological parameter estimates are affected because models with PBHs
  allow for larger values of the Thomson scattering optical depth, whose correlation
  with other parameters may not be correctly taken into account when PBHs are ignored.
  Values of taue ~ 0.2, ns ~ 1, and sigma8 ~ 0.9 are allowed at 95\% CF. This result
  may relieve recent tension between WMAP3 data and clusters data on the value of
  sigma8. PBHs may increase the primordial molecular hydrogen abundance by up to 2
  orders of magnitude, this promoting cooling and star formation. The suppression
  of galaxy formation due to X-ray heating is negligible for models consistent with
  the CMB data. Thus, the formation rate of the first galaxies and stars would be
  enhanced by a population of PBHs.
