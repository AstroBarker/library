abstract: Observations of the narrow lines from SN 1987 A have been reviewed, along
  with model interpretations of these observations. In addition, a discussion is provided
  on characteristics of the radiation from the supernova outburst, and how this affects
  the thermal structure of the circumstellar gas. Preliminary results from 2D hydrodynamical
  calculations for the circumstellar structure are also presented.
