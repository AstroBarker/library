abstract: Core-collapse supernovae are dramatic explosions marking the catastrophic
  end of massive stars. The only means to get direct information about the supernova
  engine is from observations of neutrinos emitted by the forming neutron star, and
  through gravitational waves which are produced when the hydrodynamic flow or the
  neutrino flux is not perfectly spherically symmetric. The multidimensionality of
  the supernova engine, which breaks the sphericity of the central core such as convection,
  rotation, magnetic fields, and hydrodynamic instabilities of the supernova shock,
  is attracting great attention as the most important ingredient to understand the
  long-veiled explosion mechanism. Based on our recent work, we summarize properties
  of gravitational waves, neutrinos, and explosive nucleosynthesis obtained in a series
  of our multidimensional hydrodynamic simulations and discuss how the mystery of
  the central engines can be unraveled by deciphering these multimessengers produced
  under the thick veils of massive stars.
