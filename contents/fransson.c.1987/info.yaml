abstract: Assuming that the progenitor star of SN 1987A had an initial mass in the
  15 - 25 M\_sun; range and had undergone considerable mass loss, the authors model
  the late emission from the mantle gas under the assumption of energy input by gamma-rays
  from 56Co decays. An emission-line spectrum of low-ionization species is produced
  at optical through infrared wavelengths. At an age of \equiv{}700 days an infrared
  catastrophe occurs and the gas temperature drops to a few hundred K; most of the
  radiation is then emitted in infrared fine-structure lines. The gamma-ray line intensity
  peaks in the 15 M\_sun; model at an age of 270 days. Radiation from a possible central
  pulsar nebula will be absorbed by the mantle gas; optical depth unity in the 15
  M\_sun; model at 10 keV is not reached for 18 yr. The radio emission from the pulsar
  is likely to be absorbed by the ejecta for several years.
