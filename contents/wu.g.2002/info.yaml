abstract: '{In this paper we establish several properties concerning solutions of
  the 3D magnetohydrodynamic (MHD) equations including global regularity conditions,
  a priori bounds, and real analyticity. We also explore two new approaches to the
  viscous and resistive MHD equations.}'
