abstract: We present results of general relativistic simulations of collapsing supermassive
  stars with and without rotation using the two-dimensional general relativistic numerical
  code Nada, which solves the Einstein equations written in the BSSN formalism and
  the general relativistic hydrodynamic equations with high-resolution shock-capturing
  schemes. These numerical simulations use an equation of state that includes the
  effects of gas pressure and, in a tabulated form, those associated with radiation
  and the electron-positron pairs. We also take into account the effect of thermonuclear
  energy released by hydrogen and helium burning. We find that objects with a mass
  of \approx{}5 \texttimes{} 105 M \&sun; and an initial metallicity greater than
  Z CNO \approx{} 0.007 do explode if non-rotating, while the threshold metallicity
  for an explosion is reduced to Z CNO \approx{} 0.001 for objects uniformly rotating.
  The critical initial metallicity for a thermonuclear explosion increases for stars
  with a mass \approx{}106 M \&sun;. For those stars that do not explode, we follow
  the evolution beyond the phase of black hole (BH) formation. We compute the neutrino
  energy loss rates due to several processes that may be relevant during the gravitational
  collapse of these objects. The peak luminosities of neutrinos and antineutrinos
  of all flavors for models collapsing to a BH are L nu ~ 1055 erg s-1. The total
  radiated energy in neutrinos varies between E nu ~ 1056 erg for models collapsing
  to a BH and E nu ~ 1045-1046 erg for models exploding.
