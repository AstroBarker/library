abstract: We use the VESPA algorithm and spectra from the Sloan Digital Sky Survey
  to investigate the star formation history of the host galaxies of 257 type Ia supernovae.
  We find 5sigma evidence of a short-lived population of progenitors with lifetimes
  of less than 180 Myr, indicating a type Ia supernova channel arising from stars
  in the mass range ~3.5-8 M\_\&sun;. As standardizeable candles, type Ia supernovae
  play an important role in determining the expansion history of the Universe, but
  to be useful for future cosmological surveys, the peak luminosity needs to be free
  of uncorrected systematic effects at the level of 1-2\%. If the different progenitor
  routes lead to supernovae with even moderately small differences in properties,
  then these need to be corrected for separately, or they could lead to a systematic
  bias in future supernovae surveys, as the prompt route is likely to increase in
  importance at high redshift. VESPA analysis of hosts could be a valuable tool in
  this, by identifying which progenitor route is most likely.
