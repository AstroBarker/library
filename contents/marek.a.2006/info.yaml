abstract: We investigate the possibility approximating relativistic effects in hydrodynamical
  simulations of stellar core collapse and post-bounce evolution by using a modified
  gravitational potential in an otherwise standard Newtonian hydrodynamic code. Different
  modifications of a previously introduced effective relativistic potential are discussed.
  Corresponding hydrostatic solutions are compared with solutions of the TOV equations,
  and hydrodynamic simulations with two different codes are compared with fully relativistic
  results. One code is applied for one- and two-dimensional calculations with a simple
  equation of state, and employs either the modified effective relativistic potential
  in a Newtonian framework or solves the general relativistic field equations under
  the assumption of the conformal flatness condition (CFC) for the three-metric. The
  second code allows for full-scale supernova runs including a microphysical equation
  of state and neutrino transport based on the solution of the Boltzmann equation
  and its moments equations. We present prescriptions for the effective relativistic
  potential for self-gravitating fluids to be used in Newtonian codes, which produce
  excellent agreement with fully relativistic solutions in spherical symmetry, leading
  to significant improvements compared to previously published approximations. Moreover,
  they also approximate qualitatively well relativistic solutions for models with
  rotation.
