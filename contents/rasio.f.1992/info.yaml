abstract: The hydrodynamics of the final merging of two neutron stars and the corresponding
  gravitational wave emission is studied in detail. Various test calculations are
  presented, including the compressible Roche and Darwin problems and the head-on
  collision of two polytropes. A complete coalescence calculation is presented for
  the simplest case of two identical neutron stars, represented by Gamma = 2 polytropes,
  in a circular orbit, with their spins aligned and synchronized with the orbital
  rotation.
