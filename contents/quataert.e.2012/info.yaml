abstract: During the late stages of stellar evolution in massive stars (C fusion and
  later), the fusion luminosity in the core of the star exceeds the star's Eddington
  luminosity. This can drive vigorous convective motions which in turn excite internal
  gravity waves. The local wave energy flux excited by convection is itself well above
  Eddington during the last few years in the life of the star. We suggest that an
  interesting fraction of the energy in gravity waves can, in some cases, convert
  into sound waves as the gravity waves propagate (tunnel) towards the stellar surface.
  The subsequent dissipation of the sound waves can unbind up to several M\&sun; of
  the stellar envelope. This wave-driven mass loss can explain the existence of extremely
  large stellar mass-loss rates just prior to core collapse, which are inferred via
  circumstellar interaction in some core-collapse supernovae (e.g. SNe 2006gy and
  PTF 09uj, and even Type IIn supernovae more generally). An outstanding question
  is understanding what stellar parameters (mass, rotation, metallicity and age) are
  the most susceptible to wave-driven mass loss. This depends on the precise internal
  structure of massive stars and the power spectrum of internal gravity waves excited
  by stellar convection.
