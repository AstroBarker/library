abstract: 'We present the first results of our spatially axisymmetric core-collapse
  supernova simulations with full Boltzmann neutrino transport, which amount to a
  time-dependent five-dimensional (two in space and three in momentum space) problem.
  Special relativistic effects are fully taken into account with a two-energy-grid
  technique. We performed two simulations for a progenitor of 11.2 M \&sun;, employing
  different nuclear equations of state (EOSs): Lattimer and Swesty''s EOS with the
  incompressibility of K = 220 MeV (LS EOS) and Furusawa''s EOS based on the relativistic
  mean field theory with the TM1 parameter set (FS EOS). In the LS EOS, the shock
  wave reaches \texttildelow{}700 km at 300 ms after bounce and is still expanding,
  whereas in the FS EOS it stalled at \texttildelow{}200 km and has started to recede
  by the same time. This seems to be due to more vigorous turbulent motions in the
  former during the entire postbounce phase, which leads to higher neutrino-heating
  efficiency in the neutrino-driven convection. We also look into the neutrino distributions
  in momentum space, which is the advantage of the Boltzmann transport over other
  approximate methods. We find nonaxisymmetric angular distributions with respect
  to the local radial direction, which also generate off-diagonal components of the
  Eddington tensor. We find that the rtheta component reaches \texttildelow{}10\%
  of the dominant rr component and, more importantly, it dictates the evolution of
  lateral neutrino fluxes, dominating over the thetatheta component, in the semitransparent
  region. These data will be useful to further test and possibly improve the prescriptions
  used in the approximate methods.'
