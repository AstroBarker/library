abstract: The deposition of mechanical feedback from a supermassive black hole (SMBH)
  in an active galactic nucleus into the surrounding galaxy occurs via broad-line
  winds which must carry mass and radial momentum as well as energy. The effect can
  be summarized by the dimensionless parameter eta ={\dot{M}\_outf}/{\dot{M}\_acc}=
  {2 \ensuremath{\epsilon}\_wc^2}/{v\_w^2} where epsilonw (\equiv{} \dot{E}\_w/(\dot{M}\_accc^2))
  is the efficiency with which accreted matter is turned into wind energy in the disk
  surrounding the central SMBH. The outflowing mass and momentum are proportional
  to eta, and many prior treatments have essentially assumed that eta = 0. We perform
  one- and two-dimensional simulations and find that the growth of the central SMBH
  is very sensitive to the inclusion of the mass and momentum driving but is insensitive
  to the assumed mechanical efficiency. For example in representative calculations,
  the omission of momentum and mass feedback leads to a hundred-fold increase in the
  mass of the SMBH to over 1010 M sun. When allowance is made for momentum driving,
  the final SMBH mass is much lower and the wind efficiencies that lead to the most
  observationally acceptable results are relatively low with epsilonw <~ 10-4.
