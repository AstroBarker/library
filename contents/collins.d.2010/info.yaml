abstract: In this work, we present EnzoMHD, the extension of the cosmological code
  Enzo to include the effects of magnetic fields through the ideal magnetohydrodynamics
  approximation. We use a higher order Godunov method for the computation of interface
  fluxes. We use two constrained transport methods to compute the electric field from
  those interface fluxes, which simultaneously advances the induction equation and
  maintains the divergence of the magnetic field. A second-order divergence-free reconstruction
  technique is used to interpolate the magnetic fields in the block-structured adaptive
  mesh refinement framework already extant in Enzo. This reconstruction also preserves
  the divergence of the magnetic field to machine precision. We use operator splitting
  to include gravity and cosmological expansion. We then present a series of cosmological
  and non-cosmological test problems to demonstrate the quality of solution resulting
  from this combination of solvers.
