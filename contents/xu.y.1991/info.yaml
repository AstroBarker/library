abstract: An equation is derived for calculating the energy distribution of fast electrons
  in a partially ionized gas and a method is provided to solve for the electron degradation
  spectrum and the energy deposition in different forms (ionization, excitation, or
  heating). As an example, the energy degradation of fast electrons in a gas of pure
  hydrogen is calculated, considering excitations to the lowest 10 atomic levels.
  The Bethe approximation and the continuous slowing-down approximation are discussed
  and it is concluded that these approximations are accurate to the order of 20 percent
  for electrons with initial energy of greater than about keV. The method and results
  can be used to determine heating, excitations, and ionizations by high-energy photoelectrons
  or cosmic-ray particles in various astrophysical circumstances, such as the interstellar
  medium, supernova envelopes, and QSO emission-line clouds.
