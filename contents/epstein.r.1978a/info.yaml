abstract: Formulae for the gravitational radiation due to the anisotropic axisymmetric
  emission of neutrinos from a small source are derived. We find that a burst of neutrinos
  released anisotropically from a supernova will generate a burst of gravitational
  radiation that may be comparable in amplitude and energy to the gravitational radiation
  generated by the fluid motion in the collapse of the supernova core.
