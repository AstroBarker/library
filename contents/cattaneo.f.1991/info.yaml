abstract: Numerical simulations with high spatial resolution (up to 96-cubed gridpoints)
  are used to study three-dimensional, compressible convection. A sequence of four
  models with decreasing viscous dissipation is considered in studying the changes
  in the flow structure and transport properties as the convection becomes turbulent.
