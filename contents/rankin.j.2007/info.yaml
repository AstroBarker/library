abstract: We re-examine the evidence for alignment of the proper motion and fiducial
  polarization-angle directions in radio pulsars given by Johnston et al., and we
  find that the case is probably stronger than this paper asserts. Other alignments
  are examined using the published literature and recent Arecibo polarimetry, providing
  an enlarged case that pulsar rotation axis and supernovae ``kick'' directions are
  aligned or orthogonal at birth. Pulsars' ``orthogonal'' polarization modes complicate
  fixing the orientation of such ``kicks,'' but we note that determining the absolute
  geometry of the polarization modes is a key objective for understanding the physical
  origins of pulsar emission.
