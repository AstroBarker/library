abstract: Charge transfer rate coefficients for collisions of C+ with H and H+ with
  C are presented for temperatures from 30,000 to 107 K and from 10 to 107 K, respectively.
  The rate coefficients were calculated from recommended cross sections deduced in
  a recent theoretical and experimental investigation that took into account previous
  measurements. Nonadiabatic radial coupling is the dominant mechanism for both reactions
  above ~50,000 K, but for lower temperatures the reaction of H+ with C proceeds primarily
  by radiative charge transfer. Implications, due to the magnitude of the rate coefficients,
  for various astrophysical environments are discussed.
