abstract: We report the direct measurement of orbital period decay in the double neutron
  star pulsar system PSR B2127+11C in the globular cluster M15 at the rate of (-3.95+/-0.13)\texttimes{}10-12,
  consistent with the prediction of general relativity at the ~3\% level. We find
  the pulsar mass to be mp=1.358+/-0.010 Msolar and the companion mass mc=1.354+/-0.010
  Msolar. We also report long-term pulse timing results for the pulsars PSR B2127+11A
  and PSR B2127+11B, including confirmation of the cluster proper motion.
