abstract: Of all the large interferometric gravitational-wave detectors, the German/British
  project GEO600 is the only one which uses dual recycling. During the four weeks
  of the international S4 data-taking run it reached an instrumental duty cycle of
  97\% with a peak sensitivity of 7 \texttimes{} 10-22 Hz-1/2 at 1 kHz. This paper
  describes the status during S4 and improvements thereafter.
adsnote: Provided by the SAO/NASA Astrophysics Data System
adsurl: http://adsabs.harvard.edu/abs/2006CQGra..23S..71L
