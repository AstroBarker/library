abstract: Improvements of the mixing-length theory (MLT) of turbulent convection in
  stellar atmospheres are developed theoretically. It is pointed out that inaccuracies
  are introduced into MLT by the approximating assumptions of a single large eddy
  (rather than many eddies of different sizes) and of incompressibility. In the proposed
  new model, the full spectrum of turbulent eddies is determined using more recent
  turbulence models (e.g., the eddy-damped quasi-normal Markovian model of Orszag,
  1977), and a new formula for the convective flux is obtained which gives values
  up to 10 times greater than those of the MLT at high convective efficiencies. The
  problem of compressibility is addressed by adding one of two new expressions (one
  with no free parameters) for the mixing length. Numerical results from simulations
  of a solar-type star and a 0.8-solar-mass globular-cluster star are presented in
  tables and graphs and discussed in detail; the agreement with observations is found
  to be better than with the MLT.
