abstract: Krstic has carried out the first quantum mechanical calculations near threshold
  for the charge transfer (CT) process H++H2(X1Sigma+g, nu=0, J=0)-->H(1s)+H+2. These
  results are relevant for models of primordial galaxy and first star formation that
  require reliable atomic and molecular data for obtaining the hydrogen chemistry
  of the early universe. Using the results of Krstic, we calculate the relevant CT
  rate coefficient for temperatures between 100 and 30,000 K. We also present a simple
  fit that can be readily implemented into early universe chemical models. Additionally,
  we explore how the range of previously published data for this reaction translates
  into uncertainties in the predicted gas temperature and H2 relative abundance in
  a collapsing primordial gas cloud. Our new data significantly reduce these cosmological
  uncertainties that are due to the uncertainties in the previously published CT rate
  coefficients.
