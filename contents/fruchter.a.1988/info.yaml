abstract: Observations intended to find the optical counterpart of the recently discovered
  millisecond pulsar PSR1957 + 20 and to study luminosity variations with orbital
  phase are reported. It is shown that the candidate optical counterpart is actually
  two stars, one the true counterpart, the other an unrelated background star. The
  luminosity of the system varies by at least a factor of five, with a maximum of
  magnitude 20.3 when the pulsar hides the companion. The phase of the variations
  implies that the light comes mostly from the companion star, and suggests that it
  is tidally locked, with the bright side constantly illuminated by the pulsar. The
  companion has a low color temperature, about 5500 K, which with its magnitude and
  the pulsar's dispersion-measure distance indicates a radius of 0.15 solar, about
  the size of a 0.02 solar mass hydrogen white dwarf.
