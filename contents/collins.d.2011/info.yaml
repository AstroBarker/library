abstract: In this work, we present the mass and magnetic distributions found in a
  recent adaptive mesh refinement magnetohydrodynamic simulation of supersonic, super-Alfv{\'e}nic,
  self-gravitating turbulence. Power-law tails are found in both mass density and
  magnetic field probability density functions, with P(rho) vprop rho-1.6 and P(B)
  vprop B -2.7. A power-law relationship is also found between magnetic field strength
  and density, with B vprop rho0.5, throughout the collapsing gas. The mass distribution
  of gravitationally bound cores is shown to be in excellent agreement with recent
  observation of prestellar cores. The mass-to-flux distribution of cores is also
  found to be in excellent agreement with recent Zeeman splitting measurements. We
  also compare the relationship between velocity dispersion and density to the same
  cores, and find an increasing relationship between the two, with sigma vprop n 0.25,
  also in agreement with the observations. We then estimate the potential effects
  of ambipolar diffusion in our cores and find that due to the weakness of the magnetic
  field in our simulation, the inclusion of ambipolar diffusion in our simulation
  will not cause significant alterations of the flow dynamics.
