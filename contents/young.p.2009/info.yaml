abstract: We consider the cospatial production of elements in supernova explosions
  to find observationally detectable proxies for enhancement of 26Al in supernova
  ejecta and stellar systems. Using four progenitors, we explore a range of one-dimensional
  explosions at different energies and an asymmetric three-dimensional explosion.
  We find that the most reliable indicator of the presence of 26Al in unmixed ejecta
  is a very low S/Si ratio (~0.05). Production of N in O/S/Si-rich regions is also
  indicative. The biologically important element P is produced at its highest abundance
  in the same regions. Proxies should be detectable in supernova ejecta with high
  spatial resolution multiwavelength observations, but the small absolute abundance
  of material injected into a proto-planetary disk makes detection unlikely in existing
  or forming stellar/planetary systems.
