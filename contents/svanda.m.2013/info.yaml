abstract: The consistency of time-distance inversions for horizontal components of
  the plasma flow on supergranular scales in the upper solar convection zone is checked
  by comparing the results derived using two k-omega filtering procedures---ridge
  filtering and phase-speed filtering---commonly used in time-distance helioseismology.
  I show that both approaches result in similar flow estimates when finite-frequency
  sensitivity kernels are used. I further demonstrate that the performance of the
  inversion improves (in terms of a simultaneously better averaging kernel and a lower
  noise level) when the two approaches are combined together in one inversion. Using
  the combined inversion, I invert for horizontal flows in the upper 10 Mm of the
  solar convection zone. The flows connected with supergranulation seem to be coherent
  only for the top ~5 Mm deeper down there is a hint of change of the convection scales
  toward structures larger than supergranules.
