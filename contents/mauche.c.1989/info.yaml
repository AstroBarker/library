abstract: 'The results are reported of an Einstein Observatory imaging proportional
  counter investigation of the X-ray halos of the four brightest young Galactic supernova
  remnants: the Crab Nebula, Cas A, Tycho''s, and Kepler''s supernova remnant. It
  is found that the size, shape, and rough intensity of each of these sources are
  consistent with the measured properties of the X-ray halos of compact Galactic X-ray
  sources, and as such are consistent with an origin due solely to the scattering
  of X-rays by interstellar grains.'
