abstract: The results of a new series of stellar evolution calculations are presented
  for very low mass stars (less than about 0.2 solar mass) and brown dwarfs (less
  than 0.08 solar mass). The dependence of the effective temperatures, luminosities,
  radii, etc., on the mixing length, the atmospheric opacities, and the helium fraction
  are studied along the very low mass star/brown dwarf continuum. Numerical data tables,
  isochrones, and evolutionary curves of the various observables and structural quantities
  are presented for seven models of fifteen masses each, between 0.03 solar mass and
  0.2 solar mass.
