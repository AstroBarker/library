abstract: The pulsational stability of nonlinear convective RR Lyrae models has been
  determined for a range of effective temperatures, fundamental and first-overtone
  modes, and helium abundances of Y = 0.2 and Y = 0.3. An instability strip of width
  1200 K at Y = 0.3 and 1000 K at Y = 0.2, both consistent with observations, is found.
  The first-overtone red edge is found to be 300-400 K bluer than the fundamental
  red edge, resulting in a narrower first-overtone strip. Convective blue edges lie
  to the blue of the radiative blue edges by 100 K at Y = 0.3 and 300 K at Y = 0.2.
  This unexpected convective destabilization near the blue edge seems to be due to
  increased driving in the hydrogen ionization zone, which causes a weaker dependence
  on helium abundance than found in the radiative models.
