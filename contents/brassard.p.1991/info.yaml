abstract: The fundamental issue of the region of period formaton in a degenerate star
  is examined, with special attention given to the treatment of the Brunt-Vaisala
  frequency. It is shown that, in order to obtain reliable numerical results in degenerate
  stellar models, the Brunt-Vaisala frequency must be appropriately transformed, because
  it is defined in terms of a difference between two numbers which become nearly equal
  in highly degenerate matter, causing serious numerical problems and systematic errors.
  An alternative expression is derived, which is valid for multicomponent nonideal
  partially degenerate and partially ionized plasmas such as those encountered in
  white dwarf envelopes. This expression is used to compute the period structure of
  the same white dwarf considered by Pesnell (1987). It is shown that the implicit
  numerical differencing used in the Lagrangian pulsation code of Pesnell leads to
  very serious difficulties when used with models of degenerate stars.
