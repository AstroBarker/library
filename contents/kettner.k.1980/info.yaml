abstract: The reaction12C+12C has been studied in the energy range E cm=2.45 6.15
  MeV by gamma-ray spectroscopy. Gamma-ray transitions from a large number of excited
  states in20Ne,23Na and23Mg were observed, which show strong and rapid yield variations.
  When the influence of the Coulomb barrier is removed, these structures appear superimposed
  on a flat reaction yield, which does not show a strong increase at low energies,
  in contrast to previous work. These results obviate the need for the hypothesis
  of absorption under the barrier at least down to E cm=2.45 MeV. The nuclear and
  astrophysical aspects of the data are discussed.
