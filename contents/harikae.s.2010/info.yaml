abstract: Bearing in mind the application to the collapsar models of gamma-ray bursts
  (GRBs), we develop a numerical scheme and code for estimating the deposition of
  energy and momentum due to the neutrino pair annihilation (nu + {\bar{nu}} --> e^{-}
  + e^{+}) in the vicinity of an accretion tori around a Kerr black hole. Our code
  is designed to solve the general relativistic (GR) neutrino transfer by a ray-tracing
  method. To solve the collisional Boltzmann equation in curved spacetime, we numerically
  integrate the so-called rendering equation along the null geodesics. We employ the
  Fehlberg (4,5) adaptive integrator in the Runge-Kutta method to perform the numerical
  integration accurately. For the neutrino opacity, the charged-current beta-processes,
  which are dominant in the vicinity of the accretion tori, are taken into account.
  The numerical accuracy of the developed code is certified by several tests in which
  we show comparisons with the corresponding analytical solutions. In order to solve
  the energy-dependent ray-tracing transport, we propose that an adaptive-mesh-refinement
  approach, which we take for the two radiation angles (theta, phi) and the neutrino
  energy, is useful in reducing the computational cost significantly. Based on the
  hydrodynamical data in our collapsar simulation, we estimate the annihilation rates
  in a post-processing manner. Increasing the Kerr parameter from 0 to 1, it is found
  that the GR effect can increase the local energy deposition rate by about one order
  of magnitude, and the net energy deposition rate by several tens of percent. After
  the accretion disk settles into a stationary state (typically later than ~9 s from
  the onset of gravitational collapse), we point out that the neutrino-heating timescale
  in the vicinity of the polar funnel region can be shorter than the dynamical timescale.
  Our results suggest that the neutrino pair annihilation is potentially as important
  as the conventional magnetohydrodynamic mechanism for igniting the GRB fireballs.
