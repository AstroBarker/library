abstract: A new code for following the evolution and emissions of proto-neutron stars
  during the first minute of their lives is developed and tested. The code is one
  dimensional, fully implicit, and general relativistic. Multi-group, multi-flavor
  neutrino transport is incorporated that makes use of variable Eddington factors
  obtained from a formal solution of the static general relativistic Boltzmann equation
  with linearized scattering terms. The timescales of neutrino emission and spectral
  evolution obtained using the new code are broadly consistent with previous results.
  Unlike other recent calculations, however, the new code predicts that the neutrino-driven
  wind will be characterized, at least for part of its existence, by a neutron excess.
  This change, potentially consequential for nucleosynthesis in the wind, is due to
  an improved treatment of the charged current interactions of electron-flavored neutrinos
  and anti-neutrinos with nucleons. A comparison is also made between the results
  obtained using either variable Eddington factors or simple equilibrium flux-limited
  diffusion. The latter approximation, which has been frequently used in previous
  studies of proto-neutron star cooling, accurately describes the total neutrino luminosities
  (to within 10\%) for most of the evolution, until the proto-neutron star becomes
  optically thin.
