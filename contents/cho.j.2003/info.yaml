abstract: Using numerical methods, we systematically study in the framework of ideal
  MHD the effect of magnetic fields on heat transfer within a turbulent gas. We measure
  the rates of passive scalar diffusion within magnetized fluids and make the comparisons
  (1) between MHD and hydrodynamic simulations, (2) between different MHD runs with
  different values of the external magnetic field (up to the energy equipartition
  value), and (3) between thermal conductivities parallel and perpendicular to the
  magnetic field. We do not find apparent suppression of diffusion rates by the presence
  of magnetic fields, which implies that magnetic fields do not suppress heat diffusion
  by turbulent motions.
