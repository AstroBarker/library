abstract: A number of test problems for radiation and radiation-hydrodynamics computer
  codes are described. These include evolution to radiative equilibrium, cooling from
  radiative equilibrium, subcritical and supercritical radiating shocks, and a radiating
  blast wave in a power-law density distribution. For each test problem, example input
  parameters and plots of the results are presented. Some test problems for pure hydrodynamics
  are also suggested. The radiation-hydrodynamics code used to perform the example
  test problems and the equations it solves are described in some detail.
