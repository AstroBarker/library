abstract: We analyze pre-explosion near- and mid-infrared (IR) imaging of the site         of
  SN 2023ixf in the nearby spiral galaxy M101 and characterize         the candidate
  progenitor star. The star displays compelling         evidence of variability with
  a period of  days and         an amplitude of \$\Delta m \approx 0.6\$ mag in extensive         monitoring
  with the Spitzer Space Telescope since 2004, likely         indicative of radial
  pulsations. Variability consistent with         this period is also seen in the
  near-IR \$J\$ and \$K\_{s}\$ bands         between 2010 and 2023, up to just 10
  days before the explosion.         Beyond the periodic variability, we do not find
  evidence for any         IR-bright pre-SN outbursts in this time period. The IR         brightness
  (\$M\_{K\_s} = -10.7\$ mag) and color (\$J-K\_{s} = 1.6\$         mag) of the star
  suggest a luminous and dusty red supergiant.         Modeling of the phase-averaged
  spectral energy distribution         (SED) yields constraints on the stellar temperature         (\$T\_{\mathrm{eff}}
  = 3500\_{-1400}^{+800}\$ K) and luminosity         (\$\log L/L\_{\odot} = 5.1\pm0.2\$).
  This places the candidate         among the most luminous Type II SN progenitors
  with direct         imaging constraints, with the caveat that many of these rely         only
  on optical measurements. Comparison with stellar evolution         models gives
  an initial mass of \$M\_{\mathrm{init}} = 17\pm4\$         \$M\_{\odot}\$. We estimate
  the pre-SN mass-loss rate of the star         between 3-19 years before explosion
  from the SED modeling at         \$\dot M \approx 3\times10^{-5}\$ to \$3\times10^{-4}\$
  \$M\_{\odot}\$         yr\$^{-1}\$, perhaps pointing to enhanced mass loss in a         pulsation-driven
  wind.
