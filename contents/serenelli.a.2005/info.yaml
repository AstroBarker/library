abstract: We investigate different methods used to construct (zero-age) horizontal
  branch models and compare the resulting horizontal branch evolution with that of
  models resulting from the calculation of the complete stellar evolution from the
  main sequence and through the core helium flash. We show that the approximate methods
  may lead to small but discernible effects, but that some methods, which are as simple,
  reproduce the complete evolution very well.
