abstract: We show that the high-temperature, high-entropy evacuated region outside
  the recent neutron star in a core-collapse supernova may be an ideal r-process site.
  In this high-entropy environment it is possible that most nucleons are in the form
  of free neutrons or bound into alpha particles. Thus, there can be many neutrons
  per seed nucleus even though the material is not particularly neutron rich. The
  predicted amount of r-process material ejected per event from this environment agrees
  well with that required by simple galactic evolution arguments. When averaged over
  regions of different neutron excess in the supernova ejecta, the calculated r-process
  abundance curve can give a good representation of the solar-system r-process abundances
  as long as the entropy per baryon is sufficiently high. Neutrino irradiation may
  aid in smoothing the final abundance distribution.
