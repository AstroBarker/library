abstract: The paper is concerned with the consequences for nucleosynthesis of the
  neutron release from the nuclear reaction Ne-22(alpha, n)Mg-25 when it occurs in
  the convective helium-burning cores of massive stars. The development of the neutron-induced
  buildup from an original solar system distribution for the cores of 9, 15, and 25
  solar masses is studied for the case in which the stars have an initial composition
  Y = 0.28, Z = 0.02. It is shown that significant enhancements in nuclear abundances
  up to atomic mass number A equals about 90 can be achieved in all but the lightest
  of the three models. The s-process nuclei in the mass range 60-70 are produced,
  and other features of the nucleosynthesis are examined. It is suggested that the
  results might help explain the origin of galactic cosmic rays and might serve as
  input for detailed supernova nucleosynthesis calculations.
