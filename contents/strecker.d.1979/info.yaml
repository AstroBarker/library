abstract: 'Airborne infrared spectrophotometry (1.2-5.5 microns, 1.5\% resolution)
  is presented for 13 stars which have been extensively used as infrared calibration
  objects: alpha Lyr, alpha CMA, alpha UMi, beta Dra, and mu Her; the K giants beta
  Gem, alpha UMa, alpha Boo, gamma-1 And, and alpha Tau; and the M giants beta And,
  beta Peg, and alpha Cet. These spectra, obtained using NASA''s Kuiper Airborne Observatory
  and Lear Jet Observatory, are virtually free of the interfering effects of terrestrial
  absorptions. Absolute calibration of the spectrophotometry was based on the theoretical
  model of alpha Lyr by Schild, Peterson, and Oke (1971), which fits photometric measurements
  at shorter wavelengths. The resulting flux densities are compared with previous
  ground-based photometry.'
