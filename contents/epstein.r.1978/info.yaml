abstract: We consider how an axisymmetric, uniformly and slowly rotating homogeneous
  star might be affected by the loss of energy and angular momentum via neutrino emission.
  For example, these losses can cause a collapsing, rotating star to flatten either
  faster or slower than would be the case if these losses were not taken fully into
  account, depending on the efficiency of the angular momentum loss mechanism.
