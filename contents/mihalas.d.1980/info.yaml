abstract: Within the framework of special relativity, radiative transport equations
  describing exactly, i.e., to all orders in (v/c), the interaction of radiation and
  matter in spherically symmetric flows are derived. The full angle- and frequency-dependent
  transfer equation, frequency-dependent moment equations, and frequency-integrated
  moment equations are obtained. The frequency-integrated moment equations are shown
  to be precisely equivalent to the equations obtained from the four-divergence of
  the radiation stress-energy tensor, and all three sets of equations recover the
  results obtained earlier by Castor in the limit (v/c) much less than 1. A method
  of solution of the steady-flow transfer equation is discussed, and two illustrative
  examples are presented.
