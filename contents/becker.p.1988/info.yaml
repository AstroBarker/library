abstract: A formalism is developed which simultaneously describes the evolution of
  both the photon distribution and the electron temperature in radiation-dominated
  shocks. The procedure permits the imposition of an arbitrary spectrum at any chosen
  optical depth and provides results which automatically satisfy the dynamical constraints
  derived by Blandford and Payne (1981). It is noted that radiation-dominated shocks
  may play an important role in a variety of astrophysical environments, from accreting
  neutron stars to quasars and the early universe.
