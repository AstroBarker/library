abstract: We examine the generation of a magnetic field in a solar-like star and its
  effects on the internal distribution of the angular velocity. We suggest that the
  evolution of a rotating star with magnetic fields leads to an equilibrium value
  of the differential rotation. This equilibrium is determined by the magnetic coupling,
  which favours a constant rotation profile, and meridional circulation which tends
  to build differential rotation. The global equilibrium stage is close to solid body
  rotation between about 0.7 and 0.2 R\&sun;, in good agreement with helioseismic
  measurements.
