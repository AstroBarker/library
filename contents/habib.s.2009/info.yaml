abstract: The target of the Roadrunner Universe project at Los Alamos National Laboratory
  is a set of very large cosmological N-body simulation runs on the hybrid supercomputer
  Roadrunner, the world's first petaflop platform. Roadrunner's architecture presents
  opportunities and difficulties characteristic of next-generation supercomputing.
  We describe a new code designed to optimize performance and scalability by explicitly
  matching the underlying algorithms to the machine architecture, and by using the
  physics of the problem as an essential aid in this process. While applications will
  differ in specific exploits, we believe that such a design process will become increasingly
  important in the future. The Roadrunner Universe project code, MC3 (Mesh-based Cosmology
  Code on the Cell), uses grid and direct particle methods to balance the capabilities
  of Roadrunner's conventional (Opteron) and accelerator (Cell BE) layers. Mirrored
  particle caches and spectral techniques are used to overcome communication bandwidth
  limitations and possible difficulties with complicated particle-grid interaction
  templates.
