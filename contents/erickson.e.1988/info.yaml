abstract: The first observation of the 26-micron line from singly ionized iron in
  SN 1987A is reported. The total flux is 4.5 + or - 0.9 x 20 to the -18th W/sq cm.
  The line width (FWHM) is 4000 + or - 600 km/s. The minimum iron mass is found to
  be about 0.02 solar, indicating that the emission originates in the heavy element
  mantle and not in the hydrogen-rich envelope. Since this mass is less than estimates
  based on near-infrared measurements or the optical light curve, the emission is
  probably optically thick. In this case, the flux measurement together with the observed
  line width suggest a temperature of 3500 + or - 1500 K for the mantle. The broad
  line width suggests that mixing of the ejected iron with lighter elements in overlying
  layers has occurred.
