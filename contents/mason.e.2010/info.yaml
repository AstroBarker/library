abstract: 'Aims: Nova Scorpii 2008 was the target of our Director Discretionary Time
  proposal at VLT+UVES in order to study the evolution, origin and abundances of the
  heavy-element absorption system recently discovered in 80\% of classical novae in
  outburst.  Methods: The early decline of nova Scorpii 2008 was monitored with high
  resolution echelle spectroscopy at 5 different epochs. The analysis of the absorption
  and the emission lines show many unusual characteristics.  Results: Nova Scorpii
  2008 is confirmed to differ from a common classical nova as well as a symbiotic
  recurrent nova, and it shows characteristics which are common to the so called,
  yet debated, red-novae. The origin of this new nova remains uncertain.  Based on
  data collected at UT2+UVES within the program 282-D.5055(A/B).'
