abstract: We present a detailed study of line structure in early to late-time spectra
  of supernova (SN) 1993J. Spectra during the nebular phase, but within the first
  two years after explosion, exhibit small-scale structure in the emission lines of
  some species, notably oxygen and magnesium, showing that the ejecta of SN 1993J
  are clumpy. On the other hand, a lack of structure in emission lines of calcium
  implies that the source of calcium emission is uniformly distributed throughout
  the ejecta. These results are interpreted as evidence that oxygen emission originates
  in clumpy, newly synthesized material, while calcium emission arises from material
  preexisting in the atmosphere of the progenitor. Spectra spanning the range 433-2454
  days after the explosion show boxlike profiles for the emission lines, clearly indicating
  circumstellar interaction in a roughly spherical shell. This is interpreted within
  the Chevalier \& Fransson model for SNe interacting with mass lost during prior
  stellar winds. At very late times, the emission lines have a two-horned profile,
  implying the formation of a somewhat flattened or disklike structure that is a significant
  source of emission. The very high signal-to-noise ratio spectra are used to demonstrate
  the potential significance of misinterpretation of telluric absorption lines in
  the spectra of bright SNe.
