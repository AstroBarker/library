abstract: From a sample of the Semarkona (LL 3.0) ordinary chondrite we report the
  in situ discovery of 60Ni isotopic anomalies attributable to the decay of short-lived
  60Fe (half-life 1.5 Myr) in the mineral phases troilite (FeS) and magnetite (Fe3O4).
  The troilite shows a 60Ni excesses of up to ~100 parts per thousand (0/00) relative
  to its solar isotopic abundance. A positive correlation between 60Ni excesses and
  56Fe/58Ni ratios provides evidence for live 60Fe in the early solar system. The
  inferred 60Fe/56Fe ratio of (0.92+/-0.24)\texttimes{}10-6 is the highest measured
  in any meteorite sample so far. This ratio is higher than predictions for production
  within asymptotic giant branch stars, but falls within the range expected for a
  Type II supernova source. This result is strongly suggestive of injection of freshly
  synthesized 60Fe into the nascent solar nebula by a nearby supernova explosion.
  Such a high abundance of 60Fe will exclude irradiation with solar energetic particles
  as the sole mechanism responsible for the production of short-lived radionuclides.
  It further shows that the decay of 60Fe was an important heat source for early planetary
  melting and differentiation and for keeping asteroids thermally active for much
  longer than would be possible from the decay of 26Al alone.
