abstract: Estimates of the cross sections and reaction rates for a variety of dissipative
  processes governing the formation and evolution of a population of tidally captured
  binary stars are presented. Cross sections and reaction rates can be used to derive
  analytical estimates of the globular cluster evolution up to and beyond core collapse.
  In order to illustrate the analytical applications of the cross sections and reaction
  rates, the dominant deviations in the later stages of core collapse are determined
  based on a standard homologous model. Finite-size effects of reactions involving
  tidally formed close binaries were also studied, using point-mass dynamics as a
  first approximation. The cross sections and reaction rates are expressed in terms
  of a single free parameter - the degree of penetration required to make two stars
  merge during collisions at relative velocities which are comparable to the escape
  velocity from their surface.
