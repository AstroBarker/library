abstract: We present the first spectroscopic study of the host environments of Type
  Ibc supernovae (SNe Ibc) discovered exclusively by untargeted SN searches. Past
  studies of SN Ibc host environments have been biased toward high-mass, high-metallicity
  galaxies by focusing on SNe discovered in galaxy-targeted SN searches. Our new observations
  more than double the total number of spectroscopic stellar population age and metallicity
  measurements published for untargeted SN Ibc host environments. For the 12 SNe Ib
  and 21 SNe Ic in our metallicity sample, we find median metallicities of 0.62 Z
  \&sun; and 0.83 Z \&sun;, respectively, but determine that the discrepancy in the
  full distribution of metallicities is not statistically significant. This median
  difference would correspond to only a small difference in the mass loss via metal-line-driven
  winds (lsim 30\%), suggesting this does not play the dominant role in distinguishing
  SNe Ib and Ic progenitors. However, the median metallicity of the seven broad-lined
  SNe Ic (SNe Ic-BL) in our sample is significantly lower, 0.45 Z \&sun;. The age
  of the young stellar population of SN Ic-BL host environments also seems to be lower
  than for SNe Ib and Ic, but our age sample is small. Combining all SN Ibc host environment
  spectroscopy from the literature to date does not reveal a significant difference
  in SN Ib and Ic metallicities, but reinforces the significance of the lower metallicities
  for SNe Ic-BL. This combined sample demonstrates that galaxy-targeted SN searches
  introduce a significant bias for studies seeking to infer the metallicity distribution
  of SN progenitors, and we identify and discuss other systematic effects that play
  smaller roles. We discuss the path forward for making progress on SN Ibc progenitor
  studies in the Large Synoptic Survey Telescope era. This paper includes data gathered
  with the 6.5 m Magellan Telescopes located at Las Campanas Observatory, Chile.
