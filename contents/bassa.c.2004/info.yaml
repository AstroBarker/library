abstract: We present optical astrometry of archival ground and space based imaging
  of the companion to PSR J1740-5340. The optical position of the companion is significantly
  offset from the timing position of the pulsar. We briefly investigate the effects
  of this inconsistency on other timing parameters and compare our position with an
  improved position of PSR J1740-5340 from recent, preliminary, timing results.
