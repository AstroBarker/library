abstract: We report the discovery of a supernova remnant (SNR) with an angular diameter
  of 24$\,^{\circ}$, centered on the southern constellation Antlia Pneumatica. The
  SNR is detected well in Halpha and X-rays. Within the Antlia SNR's outline, a marginally
  significant feature is detected in the 1.8 MeV gamma-ray line of the radioisotope
  26Al. At an estimated distance dA~=60-340 pc, the Antlia SNR is perhaps the nearest
  SNR except for the Local Bubble. Consequently, any associated neutron star or black
  hole is expected to have a large proper motion. Of the trajectories of nearby pulsars
  with well-determined proper motions, only B0950+08's passes within the SNR outline.
  If the SNR and the pulsar B0950+08 indeed both originated from the same supernova,
  then their age t=1.8(dA/100 pc) Myr.
