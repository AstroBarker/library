abstract: 'The characteristics of model stars consisting of a degenerate dwarf core
  and an envelope which is burning a nuclear fuel or fuels in its interior are explored.
  The models are relevant to stars which are accreting matter from a companion, to
  single stars in late stages of evolution, to stripped noninteracting remnants of
  binary star evolution, and to merging and merged degenerate dwarfs. For any given
  mass and choice of nuclear fuels, a sequence of models is constructed which differ
  with respect to the mass of the degenerate core and the envelope characteristics.
  Each sequence has at least three distinct branches: a degenerate dwarf branch along
  which envelope mass increases with decreasing luminosity, a plateau branch characterized
  by a very small envelope mass and by a nearly constant luminosity which reaches
  the maximum achievable value for the sequence, and an asymptotic giant branch which
  is at the lowest temperatures achievable and along which envelope mass decreases
  with increasing luminosity.'
