abstract: We present constraints on the dark energy equation-of-state parameter, w=P/(rhoc2),
  using 60 SNe Ia from the ESSENCE supernova survey. We derive a set of constraints
  on the nature of the dark energy assuming a flat universe. By including constraints
  on (OmegaM, w) from baryon acoustic oscillations, we obtain a value for a static
  equation-of-state parameter w=-1.05+0.13-0.12 (stat 1 sigma)+/-0.13 (sys) and OmegaM=0.274+0.033-0.020
  (stat 1 sigma) with a best-fit chi2/dof of 0.96. These results are consistent with
  those reported by the Supernova Legacy Survey from the first year of a similar program
  measuring supernova distances and redshifts. We evaluate sources of systematic error
  that afflict supernova observations and present Monte Carlo simulations that explore
  these effects. Currently, the largest systematic with the potential to affect our
  measurements is the treatment of extinction due to dust in the supernova host galaxies.
  Combining our set of ESSENCE SNe Ia with the first-results Supernova Legacy Survey
  SNe Ia, we obtain a joint constraint of w=-1.07+0.09-0.09 (stat 1 sigma)+/-0.13
  (sys), OmegaM=0.267+0.028-0.018 (stat 1 sigma) with a best-fit chi2/dof of 0.91.
  The current global SN Ia data alone rule out empty (OmegaM=0), matter-only OmegaM=0.3,
  and OmegaM=1 universes at >4.5 sigma. The current SN Ia data are fully consistent
  with a cosmological constant.
