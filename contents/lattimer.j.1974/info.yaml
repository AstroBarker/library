abstract: The tidal breakup of a neutron star near a black hole is examined. A simple
  model for the interaction is calculated, and the results show that the amount of
  neutron-star material ejected into the interstellar medium may be significant. Using
  reasonable stellar statistics, the estimated quantity of ejected material is found
  to be roughly comparable to abundance of r-process material.
