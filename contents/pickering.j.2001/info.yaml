abstract: The relative intensities of 694 emission lines of Ti II between 187 and
  602 nm from 89 levels have been measured by high-resolution Fourier transform spectrometry,
  using a hollow cathode lamp as light source. The spectral response function of the
  instrument was determined with calibrated tungsten halogen and deuterium lamps.
  Errors due to self-absorption in strong lines were eliminated by running the lamp
  at different currents. At least 95\% of the predicted transition intensity has been
  measured for 83 of these levels, allowing reliable branching fractions to be found.
  The branching fractions have been combined with 39 measured and 44 computed lifetimes
  to give absolute transition probabilities for 624 lines. These agree well with the
  most recent values for 55 of the lines obtained in a similar way from seven of the
  measured lifetimes.
