abstract: Absolute atomic transition probabilities are reported for many of the strongest
  lines in Tb II (the second spectra of terbium). Branching fractions were measured
  from Fourier transform spectrometer (FTS) data and combined with radiative lifetimes
  from recent laser-induced fluorescence measurements to determine these transition
  probabilities. Due to the absence of an extensive published classified line list
  for Tb II, accurate line positions in the FTS data as well as hyperfine structure
  patterns (described in the adjacent paper) were used to verify line classifications
  reported herein. These laboratory data are applied to determine photospheric terbium
  abundances in the Sun and the Galactic halo giant CS 22892-052.
