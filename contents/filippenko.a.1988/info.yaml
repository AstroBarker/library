abstract: Spectra of SN 1987K in NGC 4651 have been obtained 0-2 weeks past maximum
  brightness and 5-7 weeks past maximum. The results suggest that SNe II and at least
  some SNe Ib are closely related objects, and that SN 1987A could have been a massive
  star which lost a majority of its hydrogen prior to exploding. It is proposed that
  SN 1987A belongs to a new subclass, type IIb, of SN that have the spectral characteristics
  of type II near maximum brightness and those of type Ib long past maximum.
