abstract: The physical peculiarities of supernova shock breakout are discussed. A
  number of models for various types of supernovae have been constructed based on
  multigroup radiative transfer by taking these peculiarities into account. The results
  of numerical simulations and the influence of the effects of photon scattering by
  electrons and the thermalization depth on them are considered. It is shown under
  which conditions the appearance of hard X-ray emission is possible at shock breakout.
  It is pointed out what refinements are necessary in the computational algorithms
  for radiative transfer and hydrodynamics.
