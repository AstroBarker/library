abstract: Spectroscopic and photometric observations of SN 1990N were obtained at
  ultraviolet and optical wavelengths, beginning 14 days before maximum light. The
  early observations reveal important differences from spectra of SN Ia's around maximum
  light. Photometry and spectroscopy obtained after maximum show that SN 1990N is
  a typical SN Ia and that most of the observed differences are due to the early epoch
  of the observations. The most significant characteristics are (1) the high velocities
  of Ca and Si up to 22,000 km/s; (2) the presence of Co and Fe 2 weeks before maximum;
  and (3) the more rapid increase in the UV flux compared to the optical. The most
  popular models for white dwarf deflagration that have provided the standard interpretation
  for SN Ia's at maximum light do not reproduce the high velocities of Ca II and Si
  II lines observed in SN 1990N.
