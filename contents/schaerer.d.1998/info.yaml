abstract: Using the latest stellar evolution models, theoretical stellar spectra,
  and a compilation of observed emission line strengths from Wolf-Rayet (W-R) stars,
  we construct evolutionary synthesis models for young starbursts. We explicitly distinguish
  between the various W-R subtypes (WN, WC, WO), whose relative frequency is a strong
  function of metallicity, and we treat O and Of stars separately.  We calculate the
  numbers of O and W-R stars produced during a starburst and provide detailed predictions
  of UV and optical emission line strengths for both the W-R stellar lines and the
  major nebular hydrogen and helium emission lines, as a function of several input
  parameters related to the starburst episode. We also derive the theoretical frequency
  of W-R-rich starbursts.  Our models predict that nebular He II lambda4686 emission
  from a low-metallicity starburst should be associated with the presence of WC/WO
  stars and/or hot WN stars evolving to become WC/WO stars. In addition, W-R stars
  contribute to broad components beneath the nebular Balmer lines; the broad W-R component
  may constitute several percent of the total flux in the line.  We review the various
  techniques used to derive the W-R and O star content from integrated spectra, assess
  their accuracy, and propose two new formulae to estimate the W-R/O number ratio
  from UV or optical spectra.  We also explore the implications of the formation of
  W-R stars through mass transfer in close binary systems in instantaneous bursts.
  While the formation of W-R stars through Roche lobe overflow prolongs the W-R-dominated
  phase, there are clear observational signatures that allow us to distinguish the
  phases in which W-R stars are formed predominantly through single or binary star
  channels. In particular at low metallicities, when massive close binaries contribute
  significantly to the formation of W-R stars, the binary-dominated phase is expected
  to occur at ages corresponding to relatively low Hbeta equivalent widths.  The observational
  features predicted by our models allow a detailed quantitative determination of
  the massive star population in a starburst region (particularly in so-called ``W-R
  galaxies'') from its integrated spectrum and provide a means of deriving the burst
  properties (e.g., duration and age) and the parameters of the initial mass function
  of young starbursts. The model predictions should provide the most reliable determinations
  to date. They can also be used to test current theories of massive star evolution
  and atmospheres and to investigate the variation in stellar properties with metallicity.
