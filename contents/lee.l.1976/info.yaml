abstract: Published data on the interstellar scintillations of three pulsars are analyzed
  using a theory based on the Markov approximation for strong scintillations. The
  data are found to be consistent with either a Gaussian or Kolmogorov-like power-law
  irregularity spectrum for the interstellar material. For two of the pulsars, application
  of the Kolmogorov power law suggests the presence of regions of larger than normal
  electron density between us and the pulsar. The parameters of the deduced power-law
  spectrum are considered with independent measures of the large-scale structures
  of the gas and indicate the possibility of a broadly turbulent interstellar medium
  with a Kolmogorov-like spectrum.
