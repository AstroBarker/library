abstract: We study weak Alfvenic turbulence of an incompressible, magnetized fluid
  in some detail, with a view to developing a firm theoretical basis for the dynamics
  of small-scale turbulence in the interstellar medium. We prove that resonant 3-wave
  interactions are absent. We also show that the Iroshnikov-Kraichnan theory of incompressible,
  magnetohydrodynamic turbulence -- which is widely accepted -- describes weak 3-wave
  turbulence; consequently, it is incorrect. Physical arguments, as well as detailed
  calculations of the coupling coefficients are used to demonstrate that these interactions
  are empty. We then examine resonant 4-wave interactions, and show that the resonance
  relations forbid energy transport to small spatial scales along the direction of
  the mean magnetic field, for both the shear Alfven wave and the pseudo Alfven wave.
  The three-dimensional inertial-range energy spectrum of 4-wave shear Alfven turbulence
  guessed from physical arguments reads E(kz, kperpendicular) approximately VAvLL-1/3kperpendicular-10/3,
  where VA is the Alfven speed, and vL is the velocity difference across the outer
  scale L. Given this spectrum, the velocity difference across lambdaperpendicular
  approximately kperpendicular exp -1 is vlambda (sub perpendicular) is approximately
  vL(lambdaperpendicular/L)2/3. We derive a kinetic equation, and prove that this
  energy spectrum is a stationary solution and that it implies a positive flux of
  energy in k-space, along directions perpendicular to the mean magnetic field. Using
  this energy spectrum, we deduce that 4-wave interactions strengthen as the energy
  cascades to small, perpendicular spatial scales; beyond an upper bound in perpendicular
  wavenumber, kperpendicularL is approximately (VA/vL)3/2, weak turbulence theory
  ceases to be valid. Energy excitation amplitudes must be very small for the 4-wave
  inertial-range to be substantial. When the excitation is strong, the width of the
  4-wave inertial-range shrinks to zero. This seems likely to be the case in the interstellar
  medium.
