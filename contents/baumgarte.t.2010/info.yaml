abstract: 'Preface; Suggestions for using this book; 1. General relativity preliminaries;
  2. The 3+1 decomposition of Einstein''s equations; 3. Constructing initial data;
  4. Choosing coordinates: the lapse and shift; 5. Matter sources; 6. Numerical methods;
  7. Locating black hole horizons; 8. Spherically symmetric spacetimes; 9. Gravitational
  waves; 10. Collapse of collisionless clusters in axisymmetry; 11. Recasting the
  evolution equations; 12. Binary black hole initial data; 13. Binary black hole evolution;
  14. Rotating stars; 15. Binary neutron star initial data; 16. Binary neutron star
  evolution; 17. Binary black hole-neutron stars: initial data and evolution; 18.
  Epilogue; Appendixes; References; Index.'
