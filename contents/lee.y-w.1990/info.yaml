abstract: The origin of the disagreement between the results of the synthetic horizontal
  branch (HB) model of Lee et al. (1990) and the Sandage (1990) analysis of Lub's
  (1977) data on a sample of field RR Lyrae stars is investigated, extending the original
  synthetic HB calculations of Lee et al. to all HB types over the metallicity range
  of the Galactic halo. It is shown that the period shifts of the RR Lyrae stars in
  globular clusters depend strongly on their HB type and metallicity. Results suggest
  that the disagreement between the slopes, Delta logP(Teff)/Delta Fe/H, obtained
  by Lee et al. and the ones obtained by Sandage can be explained by the fact that
  Lub's sample may have contained many highly evolved stars in the metallicity range
  of Fe/H between -2.0 and -1.6, since Lee's analysis did not include these stars.
