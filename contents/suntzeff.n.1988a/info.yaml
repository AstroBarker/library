abstract: The authors report the results of deep imaging and spectrophotometry of
  the arcs around SN 1987A. The spectrophotometry verifies the nebular arcs as echoes
  of the light of SN 1987A near maximum. The clouds must be at distances of 115 and
  305 pc in front of SN 1987A. The authors also observe an apparent proper motion
  for the inner echo of 1.8 arcsec per month which, at 16 times the speed of light,
  is highly superluminal.
