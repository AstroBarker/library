abstract: We present non-Local Thermodynamic Equilibrium (LTE) synthetic spectra for
  a time series of observations of SN 1993J obtained on 1993 March 30-31, April 7,
  April 13-15, and June 13 UT. The spectra are dominated by hydrogen Balmer lines;
  neutral helium lines, which have been nonthermally excited; and Fe II features.
  The density profile evolves from an extremely steep 'brick wall' structure with
  an equivalent power-law index of about 50 on March 30 to a more typical SN II profile
  with a power law index of about 10. The early spectra are well fitted by a solar
  composition of metals, although an enhanced abundance of helium is required in order
  to fit the neutral helium lines. By June 13, the photosphere has receded deep into
  the helium layer, although there appears to be a layer of hydrogen at higher velocity.
  The distance is estimated for each epoch. While consistent results are found for
  spectra obtained in the month of April, the spread in distances from March to June
  is quite large. Our value for April is mu = 28.0 +/- 0.3 mag, consistent with the
  recent Cepheid distance to the host galaxy M81. We also compare our results to other
  implementations of the expanding photosphere method.
