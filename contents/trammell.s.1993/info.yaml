abstract: We have obtained low-resolution optical spectropolarimetry of SN 1993J which
  shows a high continuum linear polarization and a 0.5 percent drop in polarization
  across the H-alpha emission line accompanied by a position angle rotation of approximately
  15 deg. From these data we infer the presence of two distinct polarization components
  and conclude that at least part of the polarization is intrinsic to the supernova.
  We propose that the polarization observed at H-alpha is due to interstellar polarization
  within NGC 3031, while the continuum polarization is intrinsic to the object. After
  correcting the observed Stokes parameters for interstellar polarization, we find
  that the intrinsic continuum polarization is high, P = 1.6 +/- 0.1 percent at theta
  = 49 deg +/- 3 deg, and is wavelength-independent. The Stokes flux displays blueshifted
  H-alpha absorption which suggests that the polarization is generated primarily in
  the underlying continuum source.
