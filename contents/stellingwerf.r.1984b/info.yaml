abstract: An estimate of the effects of convection on the limiting amplitude behavior
  of RR Lyrae stars has been obtained by direct integration of a convective nonlinear
  model to limiting amplitude. A detailed analysis of the approach to the limit is
  made, over a 100 period interval. The presence of convection significantly lowers
  the final amplitude when compared with fully radiative models, but the actual amplitude
  obtained is sensitive to the form of the eddy viscosity. Artificial viscosity plays
  no role in this case, in sharp contrast to previous large-amplitude radiative models.
  An analysis of the stability of the limit cycle is presented, using a new analysis
  technique.
