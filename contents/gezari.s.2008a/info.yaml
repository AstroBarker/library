abstract: We present two luminous UV/optical flares from the nuclei of apparently
  inactive early-type galaxies at z = 0.37 and 0.33 that have the radiative properties
  of a flare from the tidal disruption of a star. In this paper we report the second
  candidate tidal disruption event discovery in the UV by the GALEX Deep Imaging Survey
  and present simultaneous optical light curves from the CFHTLS Deep Imaging Survey
  for both UV flares. The first few months of the UV/optical light curves are well
  fitted with the canonical t-5/3 power-law decay predicted for emission from the
  fallback of debris from a tidally disrupted star. Chandra ACIS X-ray observations
  during the flares detect soft X-ray sources with Tbb = (2-5) \texttimes{} 105 K
  or Gamma > 3 and place limits on hard X-ray emission from an underlying AGN down
  to LX(2-10 keV) lesssim 1041 ergs s-1. Blackbody fits to the UV/optical spectral
  energy distributions of the flares indicate peak flare luminosities of gtrsim1044-1045
  ergs s-1. The temperature, luminosity, and light curves of both flares are in excellent
  agreement with emission from a tidally disrupted main-sequence star onto a central
  black hole of several times 107 M\&sun;. The observed detection rate of our search
  over ~2.9 deg2 of GALEX Deep Imaging Survey data spanning from 2003 to 2007 is consistent
  with tidal disruption rates calculated from dynamical models, and we use these models
  to make predictions for the detection rates of the next generation of optical synoptic
  surveys.  Some of the data presented herein were obtained at the W. M. Keck Observatory,
  which is operated as a scientific partnership among the California Institute of
  Technology, the University of California, and the National Aeronautics and Space
  Administration. The Observatory was made possible by the generous financial support
  of the W. M. Keck Foundation.
