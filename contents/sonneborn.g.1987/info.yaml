abstract: Careful deconvolution of spatially resolved IUE ultraviolet spectra shows
  that only two of the three stars detected in plate material before 1987 are now
  present near the site of SN 1987A. The separation, magnitudes, and spectra of these
  two are consistent with their identification as star 2 and star 3 of the Sanduleak
  -69 trio. The clear implication is that star 1, the 12th mag B3 I star, has disappeared,
  and it may be identified as the progenitor of SN 1987A.
