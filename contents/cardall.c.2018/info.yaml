abstract: The large-scale computer simulation of a system of physical fields governed
  by partial differential equations requires some means of approximating the mathematical
  limit of continuity. For example, conservation laws are often treated with a 'finite-volume'
  approach in which space is partitioned into a large number of small 'cells,' with
  fluxes through cell faces providing an intuitive discretization modeled on the mathematical
  definition of the divergence operator. Here we describe and make available Fortran
  2003 classes furnishing extensible object-oriented implementations of simple meshes
  and the evolution of generic conserved currents thereon, along with individual 'unit
  test' programs and larger example problems demonstrating their use. These classes
  inaugurate the Mathematics division of our developing astrophysics simulation code
  GENASIS (Gen eral A strophysical Si mulation S ystem), which will be expanded over
  time to include additional meshing options, mathematical operations, solver types,
  and solver variations appropriate for many multiphysics applications.
