abstract: The meaning of hydrodynamic instability of close binary systems is clarified,
  and the resulting large (but finite) value of the radial infall velocity near the
  end of the coalescence is estimated. Emphasis is placed on the case where the orbital
  decay is driven by gravitational radiation. A simple calculation of the orbital
  decay is presented for a simple generic model of a close binary.
