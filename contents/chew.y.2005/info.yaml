abstract: With fast development of microfluidic systems, fluid micro-mixing becomes
  a very important issue. In this paper, recent developments on various micromixers
  and their working mechanisms are reviewed, including the external agitation methods
  applied in active mixing and the channel geometries adopted in passive mixer design.
  The chaotic mixing and the influences of Re would be mainly discussed. At moderate
  and high Re, the fluid inertial effects usually facilitate the chaotic mixing. At
  low Re, generation of chaotic advection becomes more difficult but can still be
  achieved through fluid manipulations such as stretching and folding. Chaotic mixers
  can be characterized using dynamical system techniques, such as Poincar{\'e} plot,
  and Lyapunov exponent.
