abstract: We present observations of the formation, propagation, and decay of vortex-shaped
  features in coronal images from the Solar Dynamics Observatory associated with an
  eruption starting at about 2:30 UT on 2010 April 8. The series of vortices were
  formed along the interface between an erupting (dimming) region and the surrounding
  corona. They ranged in size from several to 10 arcsec and traveled along the interface
  at 6-14 km s-1. The features were clearly visible in six out of the seven different
  EUV wave bands of the Atmospheric Imaging Assembly. Based on the structure, formation,
  propagation, and decay of these features, we identified the event as the first observation
  of the Kelvin-Helmholtz instability (KHI) in the corona in EUV. The interpretation
  is supported by linear analysis and by a nonlinear 2.5-dimensional magnetohydrodynamic
  model of KHI. We conclude that the instability is driven by the velocity shear between
  the erupting and closed magnetic field of the coronal mass ejection. The shear-flow-driven
  instability can play an important role in energy transfer processes in coronal plasma.
