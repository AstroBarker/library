abstract: Neutron stars are unique laboratories to probe matter in extreme conditions,
  not accessible in terrestrial laboratories. Here, we discuss the modelling of the
  neutron-star equation of state, particularly in connection with recent constraints
  coming from both nuclear physics (experiments and ab-initio calculations) and astrophysical
  observations.
