abstract: Core-collapse supernovae (CCSNe) are the first polluters of heavy elements
  in the galactic history. As such, it is important to study the nuclear compositions
  of their ejecta, and understand their dependence on the progenitor structure (e.g.,
  mass, compactness, metallicity). Here, we present a detailed nucleosynthesis study
  based on two long-term, two-dimensional CCSN simulations of a 11.2 M{}\&sun;  and
  a 17.0 M{}\&sun;  star. We find that in both models nuclei well beyond the iron
  group (up to Z\approx{} 44) can be produced, and discuss in detail also the nucleosynthesis
  of the p-nuclei 92,94Mo and 96,98Ru. While we observe the production of 92Mo and
  94Mo in slightly neutron-rich conditions in both simulations, 96,98Ru can only be
  produced efficiently via the nu p-process. Furthermore, the production of Ru in
  the nu p-process heavily depends on the presence of very proton-rich material in
  the ejecta. This disentanglement of production mechanisms has interesting consequences
  when comparing to the abundance ratios between these isotopes in the solar system
  and in presolar grains.
