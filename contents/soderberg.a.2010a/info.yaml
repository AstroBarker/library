abstract: We present extensive radio and X-ray observations of the nearby Type Ic
  SN 2007gr in NGC 1058 obtained with the Very Large Array (VLA) and the Chandra X-ray
  Observatory and spanning 5 to 150 days after explosion. Through our detailed modeling
  of these data, we estimate the properties of the blast wave and the circumstellar
  environment. We find evidence for a freely expanding and non-relativistic explosion
  with an average blast wave velocity, \overline{v}\approx{} 0.2c, and a total internal
  energy for the radio emitting material of E \approx{} 2 \texttimes{} 1046 erg assuming
  equipartition of energy between electrons and magnetic fields (epsilon e  = epsilon
  B  = 0.1). The temporal and spectral evolution of the radio emission points to a
  stellar wind-blown environment shaped by a steady progenitor mass loss rate of \dot{M}\approx{}
  6\texttimes{} 10^{-7} M\_{\&sun;} yr^{-1} (wind velocity, vw = 103 km s-1). These
  parameters are fully consistent with those inferred for other SNe Ibc and are in
  line with the expectations for an ordinary, homologous SN explosion. Our results
  are at odds with those of Paragi et al. who recently reported evidence for a relativistic
  blast wave in SN 2007gr based on their claim that the radio emission was resolved
  away in a low signal-to-noise Very Long Baseline Interferometry (VLBI) observation.
  Here we show that the exotic physical scenarios required to explain the claimed
  relativistic velocity---extreme departures from equipartition and/or a highly collimated
  outflow---are excluded by our detailed VLA radio observations. Moreover, we present
  an independent analysis of the VLBI data and propose that a modest loss of phase
  coherence provides a more natural explanation for the apparent flux density loss
  which is evident on both short and long baselines. We conclude that SN 2007gr is
  an ordinary Type Ibc supernova.
