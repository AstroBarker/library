abstract: 'Density inhomogeneities for a test bed of magnetic field amplification
  in supernova remnants (SNRs) were created in laser produced plasmas. The density
  inhomogeneity is considered to be essential to the large magnetic field amplification
  to account for the very fast cosmic ray acceleration. In order to model the density
  variations about an order of magnitude in an interstellar medium, we performed three
  types of experiments using a high-power laser system: (1) irradiating a plastic
  (CH) plane with a single focal spot beams, (2) the same target with spatial separation
  of laser focal spots, and (3) irradiating a striped target of thin and thick CH
  plane. By irradiating a CH plane target with a single focal spot laser beams, a
  plasma plume was produced with the large density range. On the other hand, when
  the several laser beams with displacements of the focal spots, bumpy structures
  of electron density were produced. Making thin stripes on a CH plane target, density
  and velocity inhomogeneities were produced by irradiating the striped target with
  the laser beams. In the all methods the density variations were very large, which
  can be used for a model experiment of the magnetic field amplification.'
