abstract: Detailed results of the calculation of the neutrino energy-loss rates due
  to pair, photo-, plasma, and bremsstrahlung processes corresponding to the density-temperature
  regime 1-10 to the 14th g/cu cm, 10 to the 7th - 10 to the 11th K are presented.
  The calculation is based on the Weinberg-Salam theory. The present calculation is
  the most accurate calculation to date covering the widest density-temperature regime.
  The discrepancies with the previous works are carefully examined. Extensive tables
  are prepared to show the detailed results of the photo-neutrino energy-loss rate.
