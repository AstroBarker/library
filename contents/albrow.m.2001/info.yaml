abstract: Differential time series photometry has been derived for 46,422 main-sequence
  stars in the core of 47 Tucanae. The observations consisted of near-continuous 160
  s exposures alternating between the F555W and F814W filters for 8.3 days in 1999
  July with the Wide Field Planetary Camera 2 on the Hubble Space Telescope. Using
  Fourier and other search methods, 11 detached eclipsing binaries and 15 W Ursa Majoris
  stars have been discovered plus an additional 10 contact or near-contact noneclipsing
  systems. After correction for nonuniform area coverage of the survey, the observed
  frequencies of detached eclipsing binaries and W UMa stars within 90" of the cluster
  center are 0.022\% and 0.031\%, respectively. The observed detached eclipsing binary
  frequency, the assumptions of a flat binary distribution with log period, and assuming
  that the eclipsing binaries with periods longer than about 4 days have essentially
  their primordial periods imply an overall binary frequency of 13\%+/-6\%. The observed
  W UMa frequency and the additional assumptions that W UMa stars have evolved to
  contact according to tidal circularization and angular momentum loss theory and
  that the contact binary lifetime is 109 yr imply an overall binary frequency of
  14\%+/-4\%. An additional 71 variables with periods from 0.4 to 10 days have been
  found, which are likely to be BY Draconis stars in binary systems. The radial distribution
  of these stars is the same as that of the eclipsing binaries and W UMa stars and
  is more centrally concentrated than average stars but less so than the blue straggler
  stars. A distinct subset of six of these stars falls in an unexpected domain of
  the color-magnitude diagram, comprising what we propose to call red stragglers.
  Based on observations with the NASA/ESA Hubble Space Telescope obtained at the Space
  Telescope Science Institute, which is operated by AURA, Inc. under NASA contract
  NAS 5-26555.
