abstract: 'The radial and vertical structure of the transition zone at the magnetospheric
  boundary of an aligned rotating neutron star accreting matter from a Keplerian disk
  are calculated. The results obtained indicate that: (1) the inner edge of the disk
  is located where the integrated magnetic stress acting on the disk plasma becomes
  comparable to the integrated material stress associated with its inward radial drift
  and orbital motion; (2) the stellar magnetic field threads the disk near its inner
  edge via the Kelvin-Helmholtz instability, turbulent diffusion, and reconnection,
  producing a broad transition zone between the unperturbed disk flow and corotating
  magnetosphere; (3) the transition zone consists of two qualitatively different regions,
  viz., a broad outer transition zone where the motion is Keplerian and a narrow inner
  zone, or boundary layer, where the departure from Keplerian motion is substantial;
  (4) the stellar magnetic field is largely but not entirely screened by currents
  flowing in the boundary layer; and (5) there are no steady-flow solutions for sufficiently
  fast stellar rotation.'
