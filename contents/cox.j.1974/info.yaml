abstract: 'After a short review of the relevant stellar time scales, the main observational
  data on pulsating stars are summarized, and then some elements of the basic theory
  of pulsating stars are presented. Considerable emphasis is given to the linear theory
  of radial pulsations, in part because of the important role that this theory has
  played in the development of our understanding of the causes and nature of stellar
  pulsations. Nonlinear pulsation calculations are also reviewed. An attempt is made
  to assess our present understanding of the causes and nature of pulsations in the
  various known types of pulsating stars and some important unsolved problems are
  summarized and discussed. One of the most important of these is the interaction
  between thermal convection and pulsations in stars. A section is included on the
  applications of pulsation theory to miscellaneous kinds of objects not ordinarily
  thought of as pulsating stars: stars in ''quasi-hydrostatic'' equilibrium, relativistic
  pulsation theory, white dwarfs, neutron stars, rotating stars, magnetic stars and
  oscillating models of the universe.'
