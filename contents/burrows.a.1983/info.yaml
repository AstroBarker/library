abstract: Neutrino emissions from stellar collapse followed by a supernova or formation
  of a black hole are quantified in terms of the rise-time and magnitude of the leading
  pulse and the average energy of the neutrinos emitted. The characteristics of the
  pulse at the shock breakout is examined to optical depths below unity. The resulting
  neutrino energy is expressed in terms of the shock-strength parameter, and it is
  assumed that neutrinos behind the shock reach an equilibrium with the matter. Attention
  is given to a supernova explosion with a mass ejection, and to shock stagnation
  with continued accretion. In either case a continuous decrease in emission is expected
  down to a minimum value, due to electron capture in the newly accreted matter. All
  the energy of a final cold neutron star is suggested to be carried away by particle-antiparticle
  neutrinos, which can be detected only by their interactions with protons in water
  tanks. The data from the supernova or black hole formation as recorded on earth
  will be similar, but a secondary pulse from recollapse will arrive sooner in the
  stalled shock case, which would have a pulsation time of 10-20 msec.
