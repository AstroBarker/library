abstract: Effective values for the key helium burning reaction rates, triple-alpha
  and C12(alpha, gamma)O16, are obtained by adjusting their strengths so as to obtain
  the best match with the solar abundance pattern of isotopes uniquely or predominately
  made in core-collapse supernovae. These effective rates are then used to determine
  the production of the neutrino isotopes. The use of effective rates considerably
  reduces the uncertainties in the production factors arising from uncertainties in
  the helium burning rates, and improves our ability to use the production of B11
  to constrain the neutrino emission from supernovae.
