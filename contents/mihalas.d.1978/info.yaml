abstract: Differential-equation methods for solving the transfer equation in two-dimensional
  planar geometries are developed. One method, which uses a Hermitian integration
  formula on ray segments through grid points, proves to be extremely well suited
  to velocity-dependent problems. An efficient elimination scheme is developed for
  which the computing time scales linearly with the number of angles and frequencies;
  problems with large velocity amplitudes can thus be treated accurately. A very accurate
  and efficient method for performing a formal solution is also presented. A discussion
  is given of several examples of periodic media and free-standing slabs, both in
  static cases and with velocity fields. For the free-standing slabs, two-dimensional
  transport effects are significant near boundaries, but no important effects were
  found in any of the periodic cases studied.
