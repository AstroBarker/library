abstract: We present a new abundance analysis of HE 1327-2326, which is currently
  the most iron-poor star, based on observational data obtained with the VLT Ultraviolet
  and Visual Echelle Spectrograph (UVES). We correct the one-dimensional (1D) LTE
  abundances for three-dimensional (3D) effects to provide an abundance pattern that
  supersedes previous works and should be used to observationally test current models
  of the chemical yields of the first-generation supernovae (SNe). Apart from confirming
  the 1D LTE abundances found in previous studies before accounting for 3D effects,
  we make use of a novel technique to apply the 3D-1D corrections for CNO which are
  a function of excitation potential and line strength for the molecular lines that
  comprise the observable CH, NH, and OH features. We find that the fit to the NH
  band at 3360 {\AA} is greatly improved due to the application of the 3D-1D corrections.
  This may indicate that 3D effects are actually observable in this star. We also
  report the first detection of several weak Ni lines. The cosmologically important
  element Li is still not detected; the new Li upper limit is extremely low, A(Li)
  < 0.62, and in stark contrast with results not only from the Wilkinson Microwave
  Anisotropy Probe (WMAP) but also from other metal-poor stars. We also discuss how
  the new corrected abundance pattern of HE 1327-2326 is being reproduced by individual
  and integrated yields of SNe.  Based on observations collected at the European Southern
  Observatory, Paranal, Chile (Proposal ID 075.D-0048).
