abstract: During the stalled-shock phase of our three-dimensional, hydrodynamical
  core-collapse simulations with energy-dependent, three-flavor neutrino transport,
  the lepton-number flux (nu e  minus \bar{nu }\_e) emerges predominantly in one hemisphere.
  This novel, spherical-symmetry breaking neutrino-hydrodynamical instability is termed
  LESA for "Lepton-number Emission Self-sustained Asymmetry." While the individual
  nu e  and \bar{nu }\_e fluxes show a pronounced dipole pattern, the heavy-flavor
  neutrino fluxes and the overall luminosity are almost spherically symmetric. Initially,
  LESA seems to develop stochastically from convective fluctuations. It exists for
  hundreds of milliseconds or more and persists during violent shock sloshing associated
  with the standing accretion shock instability. The nu e  minus \bar{nu }\_e flux
  asymmetry originates predominantly below the neutrinosphere in a region of pronounced
  proto-neutron star (PNS) convection, which is stronger in the hemisphere of enhanced
  lepton-number flux. On this side of the PNS, the mass accretion rate of lepton-rich
  matter is larger, amplifying the lepton-emission asymmetry, because the spherical
  stellar infall deflects on a dipolar deformation of the stalled shock. The increased
  shock radius in the hemisphere of less mass accretion and minimal lepton-number
  flux (\bar{nu }\_e flux maximum) is sustained by stronger convection on this side,
  which is boosted by stronger neutrino heating due to < epsilo \bar{nu \_e}> \gt
  < epsilo nu \_e>. Asymmetric heating thus supports the global deformation despite
  extremely nonstationary convective overturn behind the shock. While these different
  elements of the LESA phenomenon form a consistent picture, a full understanding
  remains elusive at present. There may be important implications for neutrino-flavor
  oscillations, the neutron-to-proton ratio in the neutrino-heated supernova ejecta,
  and neutron-star kicks, which remain to be explored.
