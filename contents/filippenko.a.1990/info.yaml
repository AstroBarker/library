abstract: Results are reported from spectroscopic observations of SN 1987M, obtained
  using a Cassegrain CCD spectrograph on the 3-m Shane reflector at Lick Observatory
  and a double spectrograph on the 5-m Hale telescope at Palomar Observatory between
  September 1987 and March 1988. The data are presented in tables, graphs, and sample
  spectra and characterized in detail. SN 1987M is found to be subluminous by 0.6
  mag (somewhat less than the mean value of 1.5 mag for type Ic SNe) and to exhibit
  many of the other properties of SNe Ic, including strong P Cyg profiles of Ca II
  and O I (777.4 nm) and evidence of possible weak H-alpha emission and Co II and
  Fe II absorption. The rapid decline in brightness seen in multicolor CCD light curves
  is found to be consistent with ejection of less than about 1 solar mass.
