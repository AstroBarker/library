abstract: Equilibrium models of rapidly rotating neutron stars supported by nonrelativistic,
  degenerate neutrons are examined in the Parameterized Post-Newtonian (PPN) framework.
  An energy variational principle is employed to analyze the effects of rapid rotation
  and relativistic gravity on the mass-density relation and maximum mass of neutron
  stars. The fractional increase in the mass of stable, equilibrium configurations
  due to rotation is smaller for neutron stars than for white dwarfs, a consequence
  of the destabilizing effects of post-Newtonian gravity. Currently viable conservative
  theories of gravity with high values of the PPN parameter beta can have significantly
  larger masses than predicted by general relativity. Also discussed qualitatively
  is the evolution of transient, rotating compact objects called 'fizzlers,' which
  contract to form pulsars and black holes on secular (gravitational radiation) time
  scales.
