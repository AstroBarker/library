abstract: As an alternative to the carbon detonation, the paper presents a carbon
  deflagration supernova model by a full hydrodynamic computation. A deflagration
  wave, which propagates through the core due to convective heat transport, does not
  grow into detonation. Though it results in a complete disruption of the star, the
  difficulty of overproduction of iron peak elements can be avoided if the deflagration
  is relatively slow.
