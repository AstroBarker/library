abstract: Spectroscopic observations for 1044 stars located primarily in the southern
  Galactic hemisphere are reported; the stars were chosen from a list of candidate
  metal-deficient stars discovered in the HK objective-prism survey. Radial velocities
  and line indices based on the equivalent widths of Ca II, K, H-gamma and H-delta,
  and the CH G band are reported. Estimates of metallicity for 874 stars with derived
  abundances less than -0.5 are presented. The number of extremely metal-poor stars
  (Fe/H is not greater than -2.0) reported in the present sample is roughly quadruple
  the same size of nonkinematically selected stars of similar metal abundance reported
  in previous work, and is on the order of the total previous samples of stars in
  this abundance regime when all sources are included. The number of stars with Fe/H
  not greater than -3.0 in the present sample is seven times the number of previously
  identified stars with spectroscopically determined abundances which are this low.
