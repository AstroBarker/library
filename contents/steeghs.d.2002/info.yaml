abstract: We present the first detection of the mass donor star in the prototype X-ray
  binary Scorpius X-1. Phase-resolved spectroscopy revealed narrow emission line components
  from the irradiated secondary star. Radial velocity fits to the Bowen blend emission
  are used to establish an absolute orbital ephemeris and derive an accurate value
  for the systemic velocity, gamma=-113.8+/-0.6 km s-1. Emission from the irradiated
  front side of the secondary leads to solid limits to the radial velocity of the
  mass donor of 87<~K2<~148 km s-1. In conjunction with an upper limit to the velocity
  of the primary K1<=53 km s-1, we derive a firm limit on the mass ratio of Sco X-1
  of q<~0.61. A likely set of system parameters satisfying the various constraints
  as well as the recent inclination estimate by Fomalont, Geldzahler, \& Bradshaw
  (2001) is K1=40 km s-1, K2=133 km s-1, q=0.30 corresponding to component masses
  of M1=1.4Msolar and M2=0.42Msolar for an orbital inclination of 38$\,^{\circ}$.
