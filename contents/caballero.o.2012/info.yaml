abstract: Black hole (BH) accretion disks have been proposed as good candidates for
  a range of interesting nucleosynthesis, including the r-process. The presence of
  the BH influences the neutrino fluxes and affects the nucleosynthesis resulting
  from the interaction of the emitted neutrinos and hot outflowing material ejected
  from the disk. We study the impact of general relativistic effects on the neutrinos
  emitted from BH accretion disks. We present abundances obtained by considering null
  geodesics and energy shifts for two different disk models. We find that both the
  bending of the neutrino trajectories and the energy shifts have important consequences
  for the nucleosynthetic outcome.
