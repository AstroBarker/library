abstract: 'We present detailed physics analyses of two different 4+1-dimensional asymptotically
  flat vacuum black hole solutions with spin in two independent planes: the doubly
  spinning black ring and the bicycling black ring system (``bi-rings''''). The latter
  is a new solution describing two concentric orthogonal rotating black rings which
  we construct using the inverse scattering technique. We focus particularly on extremal
  zero-temperature limits of the solutions. We construct the phase diagram of currently
  known zero-temperature vacuum black hole solutions with a single event horizon,
  and discuss the non-uniqueness introduced by more exotic black hole configurations
  such as bi-rings and multi-ring saturns.'
