abstract: We review the current status of our knowledge of the chemical composition
  of the Sun, essentially derived from the analysis of the solar photospheric spectrum.
  The comparison of solar and meteoritic abundances confirms that there is a very
  good agreement between the two sets of abundances. They are used to construct a
  Standard Abundance Distribution.
