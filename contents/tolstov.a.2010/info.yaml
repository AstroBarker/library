abstract: The results of numerical simulations of light curves and spectra and the
  influence of special relativity effects at the epoch of supernova shock breakout
  are considered. The algorithm of the RADA code used in the simulations is described.
  Prospects for using the numerical simulation results to analyze and interpret available
  and future data from the SWIFT and LOBSTER space observatories are discussed.
