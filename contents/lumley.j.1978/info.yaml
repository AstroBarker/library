abstract: It is shown that a classical gradient transport model for buoyant-turbulent
  transport in the upper part of the atmospheric boundary layer does not work because
  it transports energy in the wrong direction. It is found, on the other hand, that
  application of the eddy-damped quasi-Gaussian approximation to the equations for
  the third moments results in a transport model which predicts realistic inversion
  rise rates and heat-flux profiles. This is also a gradient transport model, but
  with a flux of one quantity depending on gradients of all relevant quantities. Transport
  coefficients are modified by the heat flux, so that the vertical transport is severely
  reduced near the inversion base. A simple Lagrangian model of transport of an indelible
  scalar in a stratified flow indicates that the form of the modified transport coefficients
  results from a marked anisotropic change in the Lagrangian time scale in stratification.
