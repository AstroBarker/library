abstract: We describe the implementation and optimization of the ESSENCE supernova
  survey, which we have undertaken to measure the dark energy equation-of-state parameter,
  w=P/(rhoc2). We present a method for optimizing the survey exposure times and cadence
  to maximize our sensitivity to w for a given fixed amount of telescope time. For
  our survey on the CTIO 4 m telescope, measuring the luminosity distances and redshifts
  for supernovae at modest redshifts (z~0.5+/-0.2) is optimal for determining w. We
  describe the data analysis pipeline based on using reliable and robust image subtraction
  to find supernovae automatically and in nearly real time. Since making cosmological
  inferences with supernovae relies crucially on accurate measurement of their apparent
  brightnesses, we describe our efforts to establish a thorough calibration of the
  CTIO 4 m telescope's natural photometric system. In its first four years, ESSENCE
  has discovered and spectroscopically confirmed 102 Type Ia supernovae, at redshifts
  from 0.10 to 0.78, identified through an impartial, effective methodology for spectroscopic
  classification and redshift determination. We present the resulting light curves
  for all of the Type Ia supernovae found by ESSENCE and used in our measurement of
  w, presented in a companion paper by Wood-Vasey and coworkers.
