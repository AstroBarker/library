abstract: The possibility of global mixing of matter by the nonspherical shock wave
  in the SN explosion was investigated by the two-dimensional axial symmetric hydrodynamical
  simulation. It is found that (1) the asymmetric shock wave is generated by passing
  through the flattened core induced by stellar rotation, and (2) inner matter tends
  to move toward the symmetric axis, and global matter mixing is possible if the degree
  of the deformation of the core is large, since this asymmetry of shock is not dumped
  even if the outer envelope is almost spherically symmetric. If the initial shock
  is jetlike, this tendency is strengthened more. This asymmetric shock wave also
  may explain the nonspherically expanding envelope in SN 1987A (suggested by the
  speckle and polarization observations).
