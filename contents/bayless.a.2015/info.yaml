abstract: Mass loss remains one of the primary uncertainties in stellar evolution.
  In the most massive stars, mass loss dictates the circumstellar medium and can significantly
  alter the fate of the star. Mass loss is caused by a variety of wind mechanisms
  and also through binary interactions. Supernovae (SNe) are excellent probes of this
  mass loss, both the circumstellar material and the reduced mass of the hydrogen-rich
  envelope. In this paper, we focus on the effects of reducing the hydrogen-envelope
  mass on the SN light curve, studying both the shock breakout and peak light-curve
  emission for a wide variety of mass-loss scenarios. Even though the trends of this
  mass loss will be masked somewhat by variations caused by different progenitors,
  explosion energies, and circumstellar media, these trends have significant effects
  on the SN light curves that should be seen in SN surveys. We conclude with a comparison
  of our results to a few key observations.
