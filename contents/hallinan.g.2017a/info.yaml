abstract: The gravitational wave event GW170817 was caused by the merger of two neutron
  stars (see the Introduction by Smith). In three papers, teams associated with the
  GROWTH (Global Relay of Observatories Watching Transients Happen) project present
  their observations of the event at wavelengths from x-rays to radio waves. Evans
  et al. used space telescopes to detect GW170817 in the ultraviolet and place limits
  on its x-ray flux, showing that the merger generated a hot explosion known as a
  blue kilonova. Hallinan et al. describe radio emissions generated as the explosion
  slammed into the surrounding gas within the host galaxy. Kasliwal et al. present
  additional observations in the optical and infrared and formulate a model for the
  event involving a cocoon of material expanding at close to the speed of light, matching
  the data at all observed wavelengths.
