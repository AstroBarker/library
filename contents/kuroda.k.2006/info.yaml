abstract: The current status of LCGT is described. The physical target of LCGT is
  to detect every year at least one event of gravitational wave signal produced at
  the coalescence of a binary neutron star. To attain this objective, LCGT is built
  underground by adopting cryogenic mirrors with a high power laser. To assure the
  reliable detection, two independent sets of interferometers are installed in a common
  vacuum system.
