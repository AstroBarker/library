abstract: The interaction between a protostellar magnetosphere and a surrounding dynamo-active
  accretion disc is investigated using an axisymmetric mean-field model. In all models
  investigated, the dynamo-generated magnetic field in the disc arranges itself such
  that in the corona, the field threading the disc is anti-aligned with the central
  dipole so that no X-point forms. When the magnetospheric field is strong enough
  (stellar surface field strength around 2 kG or larger), accretion happens in a recurrent
  fashion with periods of around 15 to 30 days, which is somewhat longer than the
  stellar rotation period of around 10 days. In the case of a stellar surface field
  strength of at least a few 100 G, the star is being spun up by the magnetic torque
  exerted on the star. The stellar accretion rates are always reduced by the presence
  of a magnetosphere which tends to divert a much larger fraction of the disc material
  into the wind. Both, a pressure-driven stellar wind and a disc wind form. In all
  our models with disc dynamo, the disc wind is structured and driven by magneto-centrifugal
  as well as pressure forces.
