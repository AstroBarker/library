abstract: We have measured radiative lifetimes of ten Th II levels by using the laser-induced
  fluorescence technique and branching fractions with Fourier transform spectroscopy.
  By combining the new branching fractions with a total of 23 lifetimes, from the
  present work and from measurements by Simonsen et al. (\cite{Simonsen}), absolute
  oscillator strengths for 180 lines have been derived. Some of these new f-values
  reported are relevant for radioactive dating of stars.
