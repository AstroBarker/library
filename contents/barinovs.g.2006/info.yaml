abstract: The results for the calculation of the CH+ formation rate by radiative association
  are presented. The calculation is performed on the lowest potential energy curves,
  which are coupled by the spin-orbit and rotational interaction. The association
  rate coefficient is calculated at temperatures up to 1000 K. The energy-dependent
  radiative association rate coefficient is marked by the presence of many resonances,
  which are responsible for significant contributions to the rate. The calculated
  rate coefficient is lower than that predicted by a previous quantum calculation.
  An analytical expression for the temperature-dependent association rate coefficient
  is given for the interval of temperatures 5-1000 K.
