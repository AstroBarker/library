abstract: The absolute visual magnitudes of three Type IIb, 11 Type Ib, and 13 Type
  Ic supernovae (collectively known as stripped-envelope supernovae) are studied by
  collecting data on the apparent magnitude, distance, and interstellar extinction
  of each event. Weighted and unweighted mean absolute magnitudes of the combined
  sample, as well as various subsets of the sample, are reported. The limited sample
  size and the considerable uncertainties, especially those associated with extinction
  in the host galaxies, prevent firm conclusions regarding differences between the
  absolute magnitudes of supernovae of Types Ib and Ic, and regarding the existence
  of separate groups of overluminous and normal-luminosity stripped-envelope supernovae.
  The spectroscopic characteristics of the events of the sample are considered. Three
  of the four overluminous events are known to have had unusual spectra. Most but
  not all of the normal-luminosity events have had typical spectra. The light curves
  of stripped-envelope supernovae are collected and compared. Because SN 1994I in
  M51 was very well observed, it often is regarded as the prototypical Type Ic supernova,
  but it has the fastest light curve in the sample. Light curves are modeled by means
  of a simple analytical technique that, combined with a constraint on E/M from spectroscopy,
  yields internally consistent values of ejected mass, kinetic energy, and nickel
  mass.
