abstract: The nup process is a primary nucleosynthesis process which occurs in core-collapse
  supernovae. An essential role in this process is being played by electron antineutrinos.
  They generate, by absorption on protons, a supply of neutrons which, by ( n, p)
  reactions, allow to overcome waiting point nuclei with rather long beta-decay and
  proton-capture lifetimes. The synthesis of heavy elements by the nup process depends
  sensitively on the bar nu \_e luminosity and spectrum. As has been shown recently,
  the latter are affected by collective neutrino flavor oscillations which can swap
  the bar nu \_e and bar nu \_{mu ,tau } spectra above a certain split energy. Assuming
  such a swap scenario, we have studied the impact of collective neutrino flavor oscillations
  on the nup-process nucleosynthesis. Our results show that the production of light
  p-nuclei up to mass number A = 108 is very sensitive to collective neutrino oscillations.
