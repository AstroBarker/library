abstract: We present an analysis of high resolution VLT-FLAMES spectra of 61 B-type
  stars with relatively narrow-lined spectra located in 4 fields centered on the Milky
  Way clusters; NGC 3293 and NGC 4755 and the Large and Small Magellanic cloud clusters;
  NGC 2004 and NGC 330. For each object a quantitative analysis was carried out using
  the non-LTE model atmosphere code TLUSTY; resulting in the determination of their
  atmospheric parameters and photospheric abundances of the dominant metal species
  (C, N, O, Mg, Si, Fe). The results are discussed in relation to our earlier work
  on 3 younger clusters in these galaxies; NGC 6611, N11 and NGC 346 paying particular
  attention to the nitrogen abundances which are an important probe of the role of
  rotation in the evolution of stars. This work along with that of the younger clusters
  provides a consistent dataset of abundances and atmospheric parameters for over
  100 B-type stars in the three galaxies. We provide effective temperature scales
  for B-type dwarfs in all three galaxies and for giants and supergiants in the SMC
  and LMC. In each galaxy a dependence on luminosity is found between the three classes
  with the unevolved dwarf objects having significantly higher effective temperatures.
  A metallicity dependence is present between the SMC and Galactic dwarf objects,
  and whilst the LMC stars are only slightly cooler than the SMC stars, they are significantly
  hotter than their Galactic counterparts.  Based on observations at the European
  Southern Observatory Very Large Telescope in programmes 68.D-0369 and 171.D-0237.
  Tables [see full text]- [see full text] are only available in electronic form at
  http://www.aanda.org
