abstract: We have conducted a reanalysis of the metallicity of six red giants within
  NGC 3201 on the basis of a new homogeneous set of spectra with resolution ~30,000.
  Iron line strengths and the MOOG software suite were used to derive metallicities
  based on spectroscopically and photometrically estimated values of Teff and logg.
  We cannot confirm the presence of a significant spread in metallicity within the
  cluster greater than about 0.3 dex nor any significant correlation between metallicity
  and temperature, as first suggested by Gonzalez \& Wallerstein. We call attention
  to the possibility that differences in boundary temperature for stars of the same
  Teff may lead to apparent differences in metallicity.
