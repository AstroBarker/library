abstract: In this paper we present an error analysis for polarimetric data obtained
  with dual-beam instruments. After recalling the basic concepts, we introduce the
  analytical expressions for the uncertainties of polarization degree and angle. These
  are then compared with the results of Monte Carlo simulations, which are also used
  to briefly discuss the statistical bias. We then approach the problem of background
  subtraction and the errors introduced by an imperfect Wollaston prism, flat-fielding,
  and retarder plate defects. Finally, we investigate the effects of instrumental
  polarization and propose a simple test to detect and characterize it. The application
  of this method to real VLT-FORS1 data has shown the presence of a spurious polarization
  that is of the order of ~1.5\% at the edges of the field of view. The cause of this
  problem has been identified as the presence of rather curved lenses in the collimator,
  combined with the incomplete removal of reflections by the coatings. This problem
  is probably common to all focal-reducer instruments equipped with a polarimetric
  mode. An additional spurious and asymmetric polarization field, whose cause is still
  unclear, is visible in the B band.  This paper is partially based on observations
  made with ESO telescope at Paranal Observatory, under programs 066.A-0397, 69.C-0579,
  069.D-0461, and 072.A-0025.
