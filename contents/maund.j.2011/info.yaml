abstract: 'We present the detection of the putative progenitor of the Type IIb SN
  2011dh in archival pre-explosion Hubble Space Telescope images. Using post-explosion
  Adaptive Optics imaging with Gemini NIRI+ALTAIR, the position of the supernova (SN)
  in the pre-explosion images was determined to within 23 mas. The progenitor candidate
  is consistent with an F8 supergiant star (logL/L sun = 4.92 $\pm$ 0.20 and T eff
  = 6000 \$\pm\$ 280 K). Through comparison with stellar evolution tracks, this corresponds
  to a single star at the end of core C-burning with an initial mass of M ZAMS = 13
  \$\pm\$ 3 M sun. The possibility of the progenitor source being a cluster is rejected,
  on the basis of: (1) the source not being spatially extended, (2) the absence of
  excess Halpha emission, and (3) the poor fit to synthetic cluster spectral energy
  distributions (SEDs). It is unclear if a binary companion is contributing to the
  observed SED, although given the excellent correspondence of the observed photometry
  to a single star SED we suggest that the companion does not contribute significantly.
  Early photometric and spectroscopic observations show fast evolution similar to
  the transitional Type IIb SN 2008ax and suggest that a large amount of the progenitor''s
  hydrogen envelope was removed before explosion. Late-time observations will reveal
  if the yellow supergiant or the putative companion star were responsible for this
  SN explosion.'
