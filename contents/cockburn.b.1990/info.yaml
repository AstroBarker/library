abstract: In this paper we study the two-dimensional version of the Runge-Kutta Local
  Projection Discontinuous Galerkin (RKDG) methods, already defined and analyzed in
  the one-dimensional case. These schemes are defined on general triangulations. They
  can easily handle the boundary conditions, verify maximum principles, and are formally
  uniformly high-ordrr accurate. Preliminary numerical results showing the performance
  of the schemes on a variety of initial-boundary value problems are shown.
