abstract: The next galactic core-collapse supernova (CCSN) has already exploded, and
  its electromagnetic (EM) waves, neutrinos, and gravitational waves (GWs) may arrive
  at any moment. We present an extensive study on the potential sensitivity of prospective
  detection scenarios for GWs from CCSNe within 5 Mpc, using realistic noise at the
  predicted sensitivity of the Advanced LIGO and Advanced Virgo detectors for 2015,
  2017, and 2019. We quantify the detectability of GWs from CCSNe within the Milky
  Way and Large Magellanic Cloud, for which there will be an observed neutrino burst.
  We also consider extreme GW emission scenarios for more distant CCSNe with an associated
  EM signature. We find that a three-detector network at design sensitivity will be
  able to detect neutrino-driven CCSN explosions out to \texttildelow{}5.5 kpc , while
  rapidly rotating core collapse will be detectable out to the Large Magellanic Cloud
  at 50 kpc. Of the phenomenological models for extreme GW emission scenarios considered
  in this study, such as long-lived bar-mode instabilities and disk fragmentation
  instabilities, all models considered will be detectable out to M31 at 0.77 Mpc,
  while the most extreme models will be detectable out to M82 at 3.52 Mpc and beyond.
