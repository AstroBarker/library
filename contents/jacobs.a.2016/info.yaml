abstract: The dynamics of helium shell convection driven by nuclear burning establish
  the conditions for runaway in the sub-Chandrasekhar-mass, double-detonation model
  for SNe Ia, as well as for a variety of other explosive phenomena. We explore these
  convection dynamics for a range of white dwarf core and helium shell masses in three
  dimensions using the low Mach number hydrodynamics code MAESTRO. We present calculations
  of the bulk properties of this evolution, including time-series evolution of global
  diagnostics, lateral averages of the 3D state, and the global 3D state. We find
  a variety of outcomes, including quasi-equilibrium, localized runaway, and convective
  runaway. Our results suggest that the double-detonation progenitor model is promising
  and that 3D dynamic convection plays a key role.
