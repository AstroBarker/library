abstract: The study of standing accretion shock instability (SASI) in core-collapse
  supernova cores has been done with three-dimensional (3D) computer simulations.
  Rotations with various perturbations were introduced from outer boundary of an initial
  steady accreting flow. We found that one or two armed spiral accreting flow onto
  the proto-neutron star (PNS) is formed inside the shock wave depending on perturbations.
  The linear growth of spiral modes are clearly diagnosed by the mode analysis of
  the shock surface, and the lower m modes grow quickly in the linear regime.
