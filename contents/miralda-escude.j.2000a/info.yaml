abstract: The Lyalpha absorption from intergalactic, once-ionized helium (He II) has
  been measured with the Hubble Space Telescope in four quasars over the last few
  years in the redshift range 2.4<z<3.2. These observations have indicated that the
  He II reionization may not have been completed until z~=2.8 and that large fluctuations
  in the intensity of the He II-ionizing background were present before this epoch.
  The detailed history of He II reionization at higher redshifts is, however, model-dependent
  and difficult to determine from these observations, since the intergalactic medium
  (IGM) can be completely optically thick to Lyalpha photons when only a small fraction
  of the helium remains as He II. In addition, finding quasars in which the He II
  Lyalpha absorption can be observed becomes increasingly difficult at higher redshift
  owing to the large abundance of hydrogen Lyman limit systems. It is pointed out
  here that He II in the IGM should also cause detectable continuum absorption in
  the soft X-rays. The spectrum of a high-redshift source seen behind the IGM when
  most of the helium was He II should recover from the He II Lyman continuum absorption
  at an observed energy of ~0.1 keV. Galactic absorption will generally be stronger,
  but not by a large factor; the intergalactic He II absorption can be detected as
  an excess over the expected Galactic absorption from the 21 cm H I column density.
  In principle, this method allows a direct determination of the fraction of helium
  that was singly ionized as a function of redshift if the measurement is done on
  a large sample of high-redshift sources over a range of redshifts.
