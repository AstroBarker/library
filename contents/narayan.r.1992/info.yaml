abstract: 'We propose that gamma-ray bursts are created in the mergers of double neutron
  star binaries and black hole neutron star binaries at cosmological distances. Two
  different processes provide the electromagnetic energy for the bursts: neutrino-antineutrino
  annihilation into electron-position pairs during the merger, and magnetic flares
  generated by the Parker instability in a postmerger differentially rotating disk.
  In both cases, an optically thick fireball of size less than or approximately equal
  to 100 km is initially created, which expands ultrarelativistically to large radii
  before radiating. The scenario is only qualitative at this time, but it eliminates
  many previous objections to the cosmological merger model. The strongest bursts
  should be found close to, but not at the centers of, galaxies at redshifts of order
  0.1, and should be accompanied by bursts of gravitational radiation from the spiraling-in
  binary which could be detected by LIGO.'
