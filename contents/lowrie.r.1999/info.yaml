abstract: The coupling of radiation transport and hydrodynamics is discussed for the
  Eulerian frame. The discussion is aimed at developing a suitable set of equations
  for nonrelativistic radiation hydrodynamics (RHD) that can be numerically integrated
  using high-resolution methods for conservation laws. We outline how numerical methods
  based on a wave decomposition may be developed, along with the importance of conservation,
  particularly in the equilibrium regime. The properties of the RHD equations are
  examined through asymptotic and dispersion analyses. The conditions required to
  obtain the classical equilibrium limit are rigorously studied. The results show
  that a simple coupling term developed recently by Morel, which retains a minimum
  of relativistic corrections, may be sufficient for nonrelativistic flows. We also
  give two constraints on the relativistic corrections that result in retaining terms
  on the order of the truncation. In addition, the dispersion results for the P1 approximation
  are studied in detail and are compared with both the exact-transport results and
  a full relativistic treatment. We also examine some nonintuitive behavior in the
  dispersion results.  This work was performed under the auspices of the US Department
  of Energy by Los Alamos National Laboratory. LAUR 98-1919.
