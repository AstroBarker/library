abstract: Presented in this paper is a detailed and direct comparison of the detection
  pipelines used by LIGO and Virgo in their attempt to observe gravitational waves
  from binary neutron star systems. In order to test the search programs, numerous
  inspiral signals were added to 24 h of simulated detector data. The efficiencies
  of the different pipelines were tested, and found to be very similar. Parameter
  estimation routines were also tested. We demonstrate that there are definite benefits
  if LIGO and Virgo conduct a joint coincident analysis; these advantages include
  increased detection efficiency and information on source sky location.
