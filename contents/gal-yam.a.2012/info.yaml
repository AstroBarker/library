abstract: Supernovae, the luminous explosions of stars, have been observed since antiquity.
  However, various examples of superluminous supernovae (SLSNe; luminosities >7 \texttimes{}
  1043 ergs per second) have only recently been documented. From the accumulated evidence,
  SLSNe can be classified as radioactively powered (SLSN-R), hydrogen-rich (SLSN-II),
  and hydrogen-poor (SLSN-I, the most luminous class). The SLSN-II and SLSN-I classes
  are more common, whereas the SLSN-R class is better understood. The physical origins
  of the extreme luminosity emitted by SLSNe are a focus of current research.
