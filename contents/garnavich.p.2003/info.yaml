abstract: We present the discovery and follow-up observations of the afterglow of
  the gamma-ray burst GRB 011121 and its associated supernova SN 2001ke. Images were
  obtained with the Optical Gravitational Lensing Experiment 1.3 m telescope in BVRI
  passbands, starting 10.3 hr after the burst. The temporal analysis of our early
  data indicates a steep decay, independent of wavelength, with Fnu~t-1.72+/-0.05.
  There is no evidence for a break in the light curve earlier than 2.5 days after
  the burst. The spectral energy distribution determined from the early broadband
  photometry is a power law with Fnu~nu-0.66+/-0.13 after correcting for a large reddening.
  Spectra obtained with the Magellan 6.5 m Baade telescope reveal narrow emission
  lines from the host galaxy that provide a redshift of z=0.362+/-0.001 to the GRB.
  We also present late R- and J-band observations of the afterglow ~7-17 days after
  the burst. The late-time photometry shows a large deviation from the initial decline,
  and our data combined with Hubble Space Telescope photometry provide strong evidence
  for a supernova peaking about 12 rest-frame days after the GRB. The first spectrum
  ever obtained of a GRB supernova at cosmological distance revealed a blue continuum.
  SN 2001ke was more blue near maximum than SN 1998bw and faded more quickly, which
  demonstrates that a range of properties are possible in supernovae that generate
  GRBs. The blue color is consistent with a supernova interacting with circumstellar
  gas, and this progenitor wind is also evident in the optical afterglow. This is
  the best evidence to date that classical, long GRBs are generated by core-collapse
  supernovae.  Based on data from the Optical Gravitational Lensing Experiment 1.3
  m and the Magellan 6.5 m Baade telescopes and the Hubble Space Telescope.
