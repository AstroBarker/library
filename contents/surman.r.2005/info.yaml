abstract: We examine the composition of matter as it flows away from gamma-ray burst
  (GRB) accretion disks in order to determine what sort of nucleosynthesis may occur.
  Since there is a large flux of neutrinos leaving the surface of the disk, the electron
  fraction of the outflowing material will change because of charged-current neutrino
  interactions. We calculate the electron fraction in the wind using detailed neutrino
  fluxes from every point on the disk and study a range of trajectories and outflow
  conditions for several different accretion disk models. We find that low electron
  fractions, conducive to making r-process elements, only appear in outflows from
  disks with high accretion rates that have significant regions both of trapped neutrinos
  and of antineutrinos. Disks with lower accretion rates that have only a significant
  region of trapped neutrinos can have outflows with very high electron fractions,
  whereas the lowest accretion rate disks with little trapping have outflow electrons
  fractions of closer to 1/2.
