abstract: The implications of Supernova 1987A are examined and compared with theoretical
  expectations. The relatively low luminosity follows from the progenitor having lower
  than solar abundances. The explosion energy is (1.0 - 2.0)\texttimes{}1051ergs for
  a 15 M\_sun; star. The neutrino signal is strikingly that expected from recent models
  of the core collapse process with advective overturn.
