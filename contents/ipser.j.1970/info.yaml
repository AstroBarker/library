abstract: This paper present two new theorems on the theory of the stability of highly
  relativistic stars. Thefirst theorem states that a highly relativistic, spherical
  star is stable if and only if its adiabatic index (assumed to be constant in the
  interior regions) is greater than a certain critical value,Gamma crit which depends
  in a specified way on the high-density equation of state. This critical value is
  analogous to the Newtonian valueGamma \_{{text{crit}}} = tfrac{4}{3}, but because
  of relativistic effects it is typically somewhat larger thantfrac{4}{3}. Thesecond
  theorem shows that at high central densities, the curves of ---(binding energy)
  vs. radius, ---E  B (R) for certain hot, isentropic sequences of stellar models
  must exhibit damped clockwise spirals. This spiraling reflects the onset of instability
  in one radial mode of pulsation after another as the central density increases along
  the sequence.
