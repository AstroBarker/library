abstract: The authors present measurements of the velocity line width, size, virial
  mass, and CO luminosity for 273 molecular clouds in the Galactic disk between longitudes
  of 8$\,^{\circ}$ and 90\$\,^{\circ}\$. These are obtained from three-dimensional
  data in the Massachusetts-Stony Brook CO Galactic Plane Survey. It is shown that
  the molecular clouds are in or near virial equilibrium and are not confined by pressure
  equilibrium with a warm or hot phase of interstellar matter. The velocity line width
  is proportional to the 0.5 power of the size, sigmav \propto{} S0.5. A tight relationship,
  over four orders of magnitude, is found between the cloud dynamical mass, as measured
  by the virial theorem, and the CO luminosity M \propto{} (LCO)0.81. The cloud CO
  luminosity is LCO\propto{} sigmav5.
