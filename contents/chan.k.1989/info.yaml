abstract: The behavior of turbulent convection in deep atmospheres is studied by numerically
  solving the three-dimensional Navier Stokes equations. It is found that the mean
  vertical velocity is an important link between the buoyancy work and the heat flux.
  In regions with efficient convection, the total flux is composed of the enthalpy
  flux and the flux of kinetic energy. The characteristics of these components of
  the total flux are examined. It is shown that the production of kinetic energy depends
  on the local variables and the flux. However, the dissipation of kinetic energy
  is nonlocal. A substantial amount of kinetic energy is carried away from the location
  of production to be dissipated in lower regions.
