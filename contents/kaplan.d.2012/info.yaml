abstract: The newfound prevalence of extremely low mass (ELM, M He < 0.2 M \&sun;)
  helium white dwarfs (WDs) in tight binaries with more massive WDs has raised our
  interest in understanding the nature of their mass transfer. Possessing small (M
  env ~ 10-3 M \&sun;) but thick hydrogen envelopes, these objects have larger radii
  than cold WDs and so initiate mass transfer of H-rich material at orbital periods
  of 6-10 minutes. Building on the original work of D'Antona et al., we confirm the
  106 yr period of continued inspiral with mass transfer of H-rich matter and highlight
  the fact that the inspiraling direct-impact double WD binary HM Cancri likely has
  an ELM WD donor. The ELM WDs have less of a radius expansion under mass loss, thus
  enabling a larger range of donor masses that can stably transfer matter and become
  a He mass transferring AM CVn binary. Even once in the long-lived AM CVn mass transferring
  stage, these He WDs have larger radii due to their higher entropy from the prolonged
  H-burning stage.
