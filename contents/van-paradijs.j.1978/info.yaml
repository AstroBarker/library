abstract: Total integrated fluxes, maximum fluxes, and spectra of X-ray bursts from
  10 sources are analyzed, and a uniformity in observed properties is detected. If
  it is assumed that the peak luminosity in a burst is a standard candle, the data
  suggest that (1) the effective black body radius observed in bursts is the same
  for all burst sources; (2) the tails of X-ray bursts are emitted by cooling surfaces
  whose size is the same for all burst sources (to within + or - 20\%); and (3) the
  total energy emitted from X-ray bursts is the same for all burst sources (to within
  + or - 30\%). This analysis applies to Type I bursts which are emitted by all burst
  sources and repeat at comparatively long time intervals. The analysis does not apply
  to Type II bursts, which repeat on time scales of seconds to minutes.
