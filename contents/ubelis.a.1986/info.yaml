abstract: The emission method has been used for measuring relative transition probabilities
  of spectral lines in Se I 196.1, 204.0, 206.3, 241.3 and 207.5, 216.4 mm.  Using
  known (radiative) lifetime (1.7 $\pm$ 0.2) ns for the state 4s24p35s3S10 absolute
  values of transition probabilities and their standard deviations (3.63 \$\pm\$ 0.51)
  \texttimes{} 108, (1.67 \$\pm\$ 0.26) \texttimes{} 108, (5.6 \$\pm\$ 1.0) \texttimes{}
  107, (2.0 \$\pm\$ 0.9) \texttimes{} 106s-1 have been obtained for the lines 196.1,
  204.0, 206.3, 241.3 nm.
