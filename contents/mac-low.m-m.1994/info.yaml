abstract: We use the astrophysical hydrocode ZEUS to compute high-resolution models
  of the disruption and deceleration of cometary fragments striking Jupiter. We find
  that simple analytic and semianalytic models work well for kilometer-size impactors.
  We show that previous numerical models that placed the explosion much deeper in
  the atmosphere failed to fully resolve important gasdynamical instabilities. These
  instabilities tear the comet apart, greatly increase its effective cross section,
  and bring it to an abrupt halt. A 1 km diameter fragment loses over 90\% of its
  kinetic energy within a single scale height at an atmospheric pressure of order
  10 bars. For all practical purposes, it explodes.
