abstract: Present understanding of SN 1987A is reviewed. The results of early optical
  and UV observations of the SN are summarized, and the reasons for the blue color
  of the progenitor star are theoretically examined. The physical processes involved
  in the explosion are discussed, and the neutrino burst, the light curve, and high-energy
  emissions are studied in detail. The spectral evaluation of SN 1987A is addressed,
  and issues for future study are briefly considered.
