abstract: We predict the flux and surface velocity perturbations produced by convectively
  excited gravity modes (g-modes) in main-sequence stars. Core convection in massive
  stars can excite g-modes to sufficient amplitudes to be detectable with high-precision
  photometry by Kepler and Convection, Rotation and planetary Transits (CoRoT), if
  the thickness of the convective overshoot region is \lessequivlnt{}30 per cent of
  a pressure scale height. The g-modes manifest as excess photometric variability,
  with amplitudes of \texttildelow{}10 mumag at frequencies \lessequivlnt{} 10 muHz
  (0.8 d-1) near the solar metallicity zero-age main sequence. The flux variations
  are largest for stars with M \greaterequivlnt{} 5 M\&sun;, but are potentially detectable
  down to M \texttildelow{} 2-3 M\&sun;. During the main-sequence evolution, radiative
  damping decreases such that ever lower frequency modes reach the stellar surface
  and flux perturbations reach up to \texttildelow{}100 mumag at the terminal-age
  main sequence. Using the same convective excitation model, we confirm previous predictions
  that solar g-modes produce surface velocity perturbations of \lessequivlnt{}0.3
  mm s-1. This implies that stochastically excited g-modes are more easily detectable
  in the photometry of massive main-sequence stars than in the Sun.
