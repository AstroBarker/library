abstract: We have studied the sensitivity to variations in the triple alpha and 12C(alpha,
  gamma)16O reaction rates of the production of 26Al, 44Ti, and 60Fe in core-collapse
  supernovae (SNe). We used the KEPLER code to model the evolution of 15 M sun, 20
  M sun, and 25 M sun stars to the onset of core collapse and simulated the ensuing
  SN explosion using a piston model for the explosion and an explosion energy of 1.2
  \texttimes{} 1051 erg. Calculations were performed for the Anders \& Grevesse and
  Lodders abundances. Over a range of twice the experimental uncertainty, sigma, for
  each helium-burning rate, the production of 26Al, 60Fe, and their ratio vary by
  factors of 5 or more. For some species, similar variations were observed for much
  smaller rate changes, 0.5sigma or less. The production of 44Ti was less sensitive
  to changes in the helium-burning rates. Production of all three isotopes depended
  on the solar abundance set used for the initial stellar composition.
