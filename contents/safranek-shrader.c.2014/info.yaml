abstract: We present results from three cosmological simulations, only differing in
  gas metallicity, that focus on the impact of metal fine-structure line cooling on
  stellar cluster formation in a high-redshift atomic cooling halo. Sink particles
  allow the process of gas hydrodynamics and accretion on to cluster stars to be followed
  for \texttildelow{}4 Myr corresponding to multiple local free-fall times. At metallicities
  at least 10-3 Z\&sun;, gas is able to reach the cosmic microwave background temperature
  floor and fragment pervasively resulting in a stellar cluster of size \texttildelow{}1
  pc and total mass \texttildelow{}1000 M\&sun;. The masses of individual sink particles
  vary, but are typically \texttildelow{}100 M\&sun;, consistent with the Jeans mass
  at TCMB, though some solar mass fragments are also produced. Below 10-4 Z\&sun;,
  fragmentation is strongly suppressed on scales greater than 0.01 pc and total stellar
  mass is lower by a factor of \texttildelow{}3 than in the higher metallicity simulations.
  The sink particle accretion rates, and thus their masses, are determined by the
  mass of the gravitationally unstable gas cloud and prolonged gas accretion over
  many Myr, exhibiting features of both monolithic collapse and competitive accretion.
  Even considering possible dust-induced fragmentation that may occur at higher densities,
  the formation of a bona fide stellar cluster seems to require metal line cooling
  and metallicities of at least \texttildelow{}10-3 Z\&sun;.
