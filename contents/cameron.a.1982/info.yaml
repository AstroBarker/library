abstract: Consideration of the contribution made to the abundances of the heavy element
  isotopes by the S- and R-processes of nucleosynthesis has led to the determination
  that the previous assumption concerning the exclusive alignment of isobars to one
  or the other of these processes is probably in error. If the relatively small odd
  and even mass number abundance fluctuations characterizing R-process abundances
  are always the case, as assumed by this study, S-process contributions to the abundances
  of R-process isobars are substantial, consistent with transient flashing episodes
  in the S-process neutron production processes. A smooth and monotonically-decreasing
  curve of the abundance of the S-process yields times the neutron capture cross-section
  versus mass number is therefore the primary tool for the separation of the abundances
  due to the two processes.
