abstract: We calculate accurate solar models and report the detailed time dependences
  of important solar quantities. We use helioseismology to constrain the luminosity
  evolution of the Sun and report the discovery of semiconvection in evolved solar
  models that include diffusion. In addition, we compare the computed sound speeds
  with the results of p-mode observations by BiSON, GOLF, GONG, LOWL, and MDI instruments.
  We contrast the neutrino predictions from a set of eight standard-like solar models
  and four deviant (or deficient) solar models with the results of solar neutrino
  experiments. For solar neutrino and helioseismological applications, we present
  present-epoch numerical tabulations of characteristics of the standard solar model
  as a function of solar radius, including the principal physical and composition
  variables, sound speeds, neutrino fluxes, and functions needed for calculating solar
  neutrino oscillations.
