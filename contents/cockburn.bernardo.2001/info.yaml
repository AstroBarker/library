abstract: In this paper, we review the development of the Runge-Kutta discontinuous
  Galerkin (RBLDG) methods for non-linear convection-dominated problems. These robust
  and accurate methods have made their way into the main stream of computational fluid
  dynamics and are quickly finding use in a wide variety of applications. They combine
  a special class of Runge-Kutta time discretizations, that allows the method to be
  non-linearly stable regardless of its accuracy, with a finite element space discretization
  by discontinuous approximations, that incorporates the ideas of numerical fluxes
  and slope limiters coined during the remarkable development of the high-resolution
  finite difference and finite volume schemes. The resulting RBLDG methods are stable,
  high-order accurate, and highly parallelizable schemes that can easily handle complicated
  geometries and boundary conditions. We review the theoretical and algorithmic aspects
  of these methods and show several applications including nonlinear conservation
  laws, the compressible and incompressible Navier-Stokes equations, and Hamilton-Jacobi-like
  equations.
