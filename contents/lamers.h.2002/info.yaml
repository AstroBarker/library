abstract: The stellar winds of massive stars show large changes in mass-loss rates
  and terminal velocities during their evolution from O-star through the Luminous
  Blue Variable phase to the Wolf-Rayet phase. The luminosity remains approximately
  unchanged during these phases. These large changes in wind properties are explained
  in the context of the radiation driven wind theory, of which we consider four different
  models. They are due to the evolutionary changes in radius, gravity and surface
  composition and to the change from optically thin (in continuum) line driven winds
  to optically thick radiation driven winds.
