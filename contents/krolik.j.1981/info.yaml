abstract: It is demonstrated that the emitting gas in clouds of quasar emission line
  regions must be confined by a hot intercloud medium, provided only that the heating
  mechanisms are strong enough to drive the low-density intercloud gas above a few
  tens of millions degrees K. The study of the thermal properties of the gas presented
  includes heating by photoionization, Compton scattering, suprathermal particles,
  absorption of radio frequency radiation, cloud friction, thermal conduction, and
  shocks. Cooling curves for photoionized gases are presented, and phase diagrams
  analogous to the pressure-temperature diagrams used in studying the interstellar
  medium are constructed for various conditions. It is shown that two-phase equilibria
  occur over a wide range of mean density, but over a much narrower range of pressure.
  The implications of these results for the emission line region are discussed, and
  it is shown that the emission clouds may be short-lived.
