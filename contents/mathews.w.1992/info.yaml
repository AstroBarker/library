abstract: A novel type of radiation instability which arises from the enhanced escape
  rate of Ly-alpha radiation from a plasma containing a velocity field is discussed.
  If a small localized velocity perturbation is introduced in an equilibrium plasma
  cloud, Ly-alpha photons escape more freely and the total pressure drops locally.
  The resulting pressure gradient creates a more spatially extended flow toward the
  site of the perturbation, allowing further line photons to escape over a larger
  region. Equilibrium structures are described for clouds ionized by isotropic radiation
  and having P-alpha/P greater than approximately 1. These structures are then perturbed
  and shown to be unstable. The symbiotic relationship between the continuum instability
  and the line radiation instability is discussed.
