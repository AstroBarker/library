abstract: We present ray-tracing computations for light emitted from the surface of
  a rapidly rotating neutron star in order to construct light curves for X-ray pulsars
  and bursters. These calculations are for realistic models of rapidly rotating neutron
  stars that take into account both the correct exterior metric and the oblate shape
  of the star. We find that the most important effect arising from rotation comes
  from the oblate shape of the rotating star. Approximating a rotating neutron star
  as a sphere introduces serious errors in fitted values of the star's radius and
  mass if the rotation rate is very large. However, in most cases acceptable fits
  to the ratio M/R can be obtained with the spherical approximation.
