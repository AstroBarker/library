abstract: 'Early-time X-ray observations of gamma-ray bursts (GRBs) with the Swift
  satellite have revealed a more complicated phenomenology than was known before.
  In particular, the presence of flaring activity on a wide range of timescales probably
  requires late-time energy production within the GRB engine. Since the flaring activity
  is observed in both long and short GRBs, its origin must be within what is in common
  for the two likely progenitors of the two classes of bursts: a hyperaccreting accretion
  disk around a black hole of a few solar masses. Here we show that some of the observational
  properties of the flares, such as the duration-timescale correlation, and the duration-peak
  luminosity anticorrelation displayed by most flares within a given burst, are qualitatively
  consistent with viscous disk evolution, provided that the disk at large radii either
  fragments or otherwise suffers large-amplitude variability. We discuss the physical
  conditions in the outer parts of the disk and conclude that gravitational instability,
  possibly followed by fragmentation, is the most likely candidate for this variability.'
