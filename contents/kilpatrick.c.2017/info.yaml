abstract: Eleven hours after the detection of gravitational wave source GW170817 by
  the Laser Interferometer Gravitational-Wave Observatory and Virgo Interferometers,
  an associated optical transient, SSS17a, was identified in the galaxy NGC 4993.
  Although the gravitational wave data indicate that GW170817 is consistent with the
  merger of two compact objects, the electromagnetic observations provide independent
  constraints on the nature of that system. We synthesize the optical to near-infrared
  photometry and spectroscopy of SSS17a collected by the One-Meter Two-Hemisphere
  collaboration, finding that SSS17a is unlike other known transients. The source
  is best described by theoretical models of a kilonova consisting of radioactive
  elements produced by rapid neutron capture (the r-process). We conclude that SSS17a
  was the result of a binary neutron star merger, reinforcing the gravitational wave
  result.
