abstract: We examine the global, hydrodynamic stability of solar latitudinal differential
  rotation in a ``shallow-water'' model of the tachocline. Charbonneau, Dikpati, \&
  Gilman have recently shown that two-dimensional disturbances are stable in the tachocline
  (which contains a pole-to-equator differential rotation s<18\%). In our model, the
  upper boundary of the thin shell is allowed to deform in latitude, longitude, and
  time, thus including simplified three-dimensional effects. We examine the stability
  of differential rotation as a function of the effective gravity of the stratification
  in the tachocline. High effective gravity corresponds to the radiative part of the
  tachocline; for this case, the instability is similar to the strictly two-dimensional
  case (appearing only for s>=18\%), driven primarily by the kinetic energy of differential
  rotation extracted through the work of the Reynolds stress. For low effective gravity,
  which corresponds to the overshoot part of the tachocline, a second mode of instability
  occurs, fed again by the kinetic energy of differential rotation, which is primarily
  extracted by additional stresses and correlations of perturbations arising in the
  deformed shell. In this case, instability occurs for differential rotation as low
  as about 11\% between equator and pole. If this mode occurs in the Sun, it should
  destabilize the latitudinal differential rotation in the overshoot part of the tachocline,
  even without a toroidal field. For the full range of effective gravity, the vorticity
  associated with the perturbations, coupled with radial motion due to horizontal
  divergence/convergence of the fluid, gives rise to a longitude-averaged, net kinetic
  helicity pattern, and hence a source of alpha-effect in the tachocline. Thus there
  could be a dynamo in the tachocline, driven by this alpha-effect and the latitudinal
  and radial gradients of rotation.
