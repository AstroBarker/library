abstract: We present X-ray emission-line equivalent width images of the bright Galactic
  supernova remnant Cassiopeia A for the elements Si, S, Ar, Ca, and Fe using a 50,000
  s observation with the Advanced CCD Imaging Spectrometer on the Chandra X-Ray Observatory.
  The images essentially map the bulk of detectable ejecta of these elements over
  a wide range of surface brightnesses and show morphologies distinctly different
  from that of the broadband X-ray emission and the 4-6 keV continuum emission. The
  Si, S, Ar, and Ca maps, while different in turn from those of Fe, are similar to
  the distribution of fast optical ejecta knots in that they clearly delineate the
  X-ray counterpart of the northeast optical jet. Low surface brightness regions just
  outside the bright shell in the north and west are also shown to have strong line
  emission. The strong Fe emission is exterior to that of other elements in the east,
  as previously noted, but is generally coincident elsewhere. The projected interior
  has relatively little emission traced by high line equivalent widths.
