abstract: The predictions of the standard plasma emission codes are inconsistent with
  spectroscopic data acquired during the ASCA performance verification phase. The
  discrepancies are evident in the 0.7-1.5 keV spectral range, the domain of n approaches
  2 (L-shell) transitions in highly ionized Fe species. We have recalculated Fe L-shell
  spectra using the HULLAC atomic physics package and find that an update of the Fe
  data used in the current generation of emission line codes is warranted. We present
  here a synopsis of our results for the charge states Fe XXIII and Fe XXIV. These
  results are relevant to the interpretation of spectroscopic data from stellar coronae,
  supernova remnants, and galaxy clusters.
