abstract: Numerical models of core-bounce supernovae with hydrogenless "Wolf-Rayet"
  progenitors are presented. The luminosity near peak light of these supernovae is
  provided by the escape of radioactive decay energy which accumulates in the optically
  thick interior and diffuses outward until it meets the inwardly moving photosphere
  (recombination front). It has been suggested that such stars are the source of Type
  Ib supernovae. Type Ib peak magnitudes and light curves have been collected from
  the literature, analyzed, and compared with the models. If some or all Type Ib progenitors
  are Wolf-Rayet-like stars, the widths of the supernova light curves constrain them
  to be between about 4 and 7 M\_sun;, originally 15 - 25 M\_sun; on the main sequence.
