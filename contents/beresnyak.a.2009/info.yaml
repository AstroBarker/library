abstract: We performed a series of high-resolution (up to 10243) direct numerical
  simulations of hydro and magnetohydrodynamic (MHD) turbulence. Our simulations correspond
  to the "strong" MHD turbulence regime that cannot be treated perturbatively. We
  found that for simulations with normal viscosity the slopes for energy spectra of
  MHD are similar to ones in hydro, although slightly more shallower. However, for
  simulations with hyperviscosity the slopes were very different, for instance, the
  slopes for hydro simulations showed a pronounced and well defined bottleneck effect,
  while the MHD slopes were relatively much less affected. We believe that this is
  indicative of MHD strong turbulence being less local than the Kolmogorov turbulence.
  This calls for revision of MHD strong turbulence models that assume local "as-in-hydro
  case" cascading. Nonlocality of MHD turbulence casts doubt on numerical determination
  of the slopes with currently available (5123-10243) numerical resolutions, including
  simulations with normal viscosity. We also measure various so-called alignment effects
  and discuss their influence on the turbulent cascade.
