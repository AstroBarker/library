abstract: 2D numerical simulations of magnetorotational (MR) supernova mechanism are
  described. It is shown that magnetic field is amplified due to the differential
  rotation after core collapse. When magnetic pressure reaches some level, a compression
  wave starts to move outwards. Moving along steeply decreasing density profile the
  compression wave transforms quickly into fast MHD shock. The magnetorotational instability
  (MRI) was found in our simulations. MRI leads to the exponential growth of the components
  of the magnetic field. The MRI significantly reduces MR supernova explosion time.
  Configuration of the initial magnetic field qualitatively defines the shape of MR
  supernova explosion. For the quadrupole-like initial poloidal field the MR supernova
  explosion develops mainly along equatorial plane, the dipole-like initial field
  results in MR supernova developing as mildly collimated jet along axis of rotation.
  The explosion energy of MR supernova found in our simulations is \texttildelow{}0.5
  0.6\texttimes{}1051 erg.
