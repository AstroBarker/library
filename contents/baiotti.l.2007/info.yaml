abstract: We provide details and present additional results on the numerical study
  of the gravitational-wave emission from the collapse of neutron stars to rotating
  black holes in three dimensions. More specifically, we concentrate on the advantages
  and disadvantages of the use of the excision technique and on how alternative approaches
  to that of excision can be successfully employed. Furthermore, as a first step towards
  source characterization, we present a systematic discussion of the influence that
  rotation and different perturbations have on the waveforms and hence on the energy
  emitted in gravitational waves.
