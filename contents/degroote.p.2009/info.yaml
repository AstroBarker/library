abstract: 'Context: We search for new variable B-type pulsators in the CoRoT data
  assembled primarily for planet detection, as part of CoRoT''s additional programme.  Aims:
  We aim to explore the properties of newly discovered B-type pulsators from the uninterrupted
  CoRoT space-based photometry and to compare them with known members of the beta
  Cep and slowly pulsating B star (SPB) classes.  Methods: We developed automated
  data analysis tools that include algorithms for jump correction, light-curve detrending,
  frequency detection, frequency combination search, and for frequency and period
  spacing searches.  Results: Besides numerous new, classical, slowly pulsating B
  stars, we find evidence for a new class of low-amplitude B-type pulsators between
  the SPB and delta Sct instability strips, with a very broad range of frequencies
  and low amplitudes, as well as several slowly pulsating B stars with residual excess
  power at frequencies typically a factor three above their expected g-mode frequencies.   Conclusions:
  The frequency data we obtained for numerous new B-type pulsators represent an appropriate
  starting point for further theoretical analyses of these stars, once their effective
  temperature, gravity, rotation velocity, and abundances will be derived spectroscopically
  in the framework of an ongoing FLAMES survey at the VLT.  The CoRoT space mission
  was developed and is operated by the French space agency CNES, with the participation
  of ESA''s RSSD and Science Programmes, Austria, Belgium, Brazil, Germany, and Spain.
  All frequency tables, including the identification of combination frequencies, are
  only available as online material. Frequency Tables are only available in electronic
  form at the CDS via anonymous ftp to cdsarc.u-strasbg.fr (130.79.128.5) or via http://cdsweb.u-strasbg.fr/cgi-bin/qcat?J/A+A/506/471
  B{\^a}timent 121, 91405, Orsay Cedex, France. Postdoctoral Researcher, Fonds de
  la Recherche Scientifique - FNRS, Belgium. Postdoctoral Fellow of the Fund for Scientific
  Research, Flanders.'
