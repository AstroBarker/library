abstract: In Casares et al. we presented the first radial velocity curve of the companion
  star to BW Cir which demonstrates the presence of a black hole in this historical
  X-ray transient. But these data were affected by aliasing and two possible periods
  at 2.5445 days and 2.5635 days were equally possible. Here we present new spectroscopic
  data that enable us to break the 1-year aliasing and confirm 2.5445 days as the
  correct orbital period. We also present R-band photometry over 14 years, which reveals
  the presence of important flaring activity dominating the light curves.
