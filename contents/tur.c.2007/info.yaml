abstract: We explore the dependence of presupernova evolution and supernova nucleosynthesis
  yields on the uncertainties in helium-burning reaction rates. Using the revised
  solar abundances of Lodders for the initial stellar composition, instead of those
  of Anders and Grevesse, changes the supernova yields and limits the constraints
  that those yields place on the 12C(alpha,gamma)16O reaction rate. The production
  factors of medium-weight elements (A=16-40) were found to be in reasonable agreement
  with observed solar ratios within the current experimental uncertainties in the
  triple-alpha reaction rate. Simultaneous variations by the same amount in both reaction
  rates or in either of them separately, however, can induce significant changes in
  the central 12C abundance at core carbon ignition and in the mass of the supernova
  remnant. It therefore remains important to have experimental determinations of the
  helium-burning rates so that their ratio and absolute values are known with an accuracy
  of 10\% or better.
