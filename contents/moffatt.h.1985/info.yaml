abstract: Arnol'd (1974) has considered the 'magnetic-relaxation' problem in magnetohydrodynamics.
  This problem has an immediate bearing on the question of existence and structure
  of solutions of the steady Euler equations of fluid flow. In the present paper,
  the magnetic relaxation problem is treated ab initio, and the constraint that the
  magnetic field should necessarily remain smooth has been abandoned. The problem
  of magnetic relaxation is employed as a vehicle for proof of the existence of magnetostatic
  equilibria, and hence of analogous Euler flows, of arbitrarily topological structure.
  Attention is given to constrained and unconstrained relaxation, the magnetic relaxation
  problem, the case of trivial topology, the case of 'simple-linkage' topology, the
  role of helicity invariants, the topology of chaos, the implications for Euler flows,
  and speculations concerning the structure of turbulence.
