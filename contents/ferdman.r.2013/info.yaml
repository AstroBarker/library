abstract: The double pulsar system PSR J0737-3039A/B is a double neutron star binary,
  with a 2.4 hr orbital period, which has allowed measurement of relativistic orbital
  perturbations to high precision. The low mass of the second-formed neutron star,
  as well as the low system eccentricity and proper motion, point to a different evolutionary
  scenario compared to most other known double neutron star systems. We describe analysis
  of the pulse profile shape over 6 years of observations and present the resulting
  constraints on the system geometry. We find the recycled pulsar in this system,
  PSR J0737-3039A, to be a near-orthogonal rotator with an average separation between
  its spin and magnetic axes of 90$\,^{\circ}$ \$\pm\$ 11\$\,^{\circ}\$ \$\pm\$ 5\$\,^{\circ}\$.
  Furthermore, we find a mean 95\% upper limit on the misalignment between its spin
  and orbital angular momentum axes of 3.\, assuming that the observed emission comes
  from both magnetic poles. This tight constraint lends credence to the idea that
  the supernova that formed the second pulsar was relatively symmetric, possibly involving
  electron capture onto an O-Ne-Mg core.
