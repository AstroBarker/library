abstract: An alternative view on the origin of the powerful X-ray emission from SN
  1986J is proposed. The model suggests that the supernova envelope is colliding with
  the clumpy circumstellar wind, and the bulk of the observed X-rays originates from
  the shocked dense wind clumps. The required mass loss rate for the clumpy component
  of the wind is about 0.0001 solar mass/yr, while the filling factor is approximately
  equal to 0.005. The homogeneous wind is relatively rarefied and contains significantly
  lower mass than the clumpy component. The model of the clumpy wind is qualitatively
  consistent with optical and radio data.
