abstract: We present our NextGen Model Atmosphere grid for low-mass stars for effective
  temperatures larger than 3000 K. These LTE models are calculated with the same basic
  model assumptions and input physics as the VLMS part of the NextGen grid so that
  the complete grid can be used, e.g., for consistent stellar evolution calculations
  and for internally consistent analysis of cool star spectra. This grid is also the
  starting point for a large grid of detailed NLTE model atmospheres for dwarfs and
  giants. The models were calculated from 3000 to 10,000 K (in steps of 200 K) for
  3.5<=logg<=5.5 (in steps of 0.5) and metallicities of -4.0<=[M/H]<=0.0.  We discuss
  the results of the model calculations and compare our results to the Kurucz grid.
  Some comparisons to standard stars like Vega and the Sun are presented and compared
  with detailed NLTE calculations.
