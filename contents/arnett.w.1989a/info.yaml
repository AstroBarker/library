abstract: Observations of the late (t = 20-1500 days) bolometric light curve and the
  gamma-lines and X-rays from supernova 1987A are compared to theoretical models.
  It is found that 0.073 + or - 0.015 solar masses of freshly synthesized Ni-56 must
  be present to fit the bolometric light curve. The results place limits on the luminosity
  and presumed period of the newly formed pulsar/neutron star. In the second half
  of the paper, the problem of computing the luminosities in gamma-ray lines and in
  X-rays from supernova 1987A is addressed. High-energy observations suggest the development
  of large-scale clumping and bubbling of radioactive material in the ejecta. A model
  is proposed with a hydrogen envelope mass of about 7 solar masses, homologous scale
  expansion velocities of about 3000 km/s, and an approximately uniform mass distribution.
