abstract: Properties of white dwarfs which are accreting hydrogen-rich matter at rates
  in the range 1.5 x 10 to the -9th to 2.5 x 10 to the -7th solar mass/yr are investigated
  in several approximations. Steady-burning models, in which matter is processed through
  nuclear-burning shells as rapidly as it is accreted, provide a framework for understanding
  the properties of models in which thermal pulses induced by hydrogen burning and
  helium burning are allowed to occur. In these latter models, the underlying carbon-oxygen
  core is chosen to be in a cycle-averaged steady state with regard to compressional
  heating and neutrino losses. Several of these models are evolved in the quasi-static
  approximation. Combining results obtained in the steady-burning approximation with
  those obtained in the quasi-static approximation, expressions are obtained for estimating,
  as functions of accretion rate and white dwarf mass, the thermal pulse recurrence
  period and the duration of hydrogen-burning phases.
