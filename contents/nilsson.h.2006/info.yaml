abstract: We report absolute oscillator strengths for 119 ion{Cr}{ii} transitions
  in the wavelength region 2050-4850 {\AA}. The transition probabilities have been
  derived by combining radiative lifetimes, measured with time-resolved laser induced
  fluorescence, and branching fractions from intensity calibrated Fouirer transform
  spectrometer data. New radiative lifetimes for the 3d^4(^5D)4p ^4F, ^4D and ^6P
  terms are reported, adding up to a total of 25 energy levels with measured lifetimes
  used to derive this improved set of atomic data.
