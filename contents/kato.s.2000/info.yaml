abstract: We consider narrow transition regions in accretion disks where an outer
  standard disk (Shakura-Sunyaev-type disk; SSD) changes to an inner advection-dominated
  accretion flow (ADAF). By using the WKB method, we show that if the transition occurs
  in a relatively narrow region, trapped low-frequency oscillations, or slowly growing
  localized motions, are possible in the transition region. Their characteristic frequencies
  are much lower than the Keplerian frequency in this region. This type of trapped
  oscillation may be a possible cause of the 1-15 Hz quasi-periodic oscillations observed
  in GRS 1915+105.
