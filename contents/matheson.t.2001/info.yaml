abstract: We present 84 spectra of Type Ib/c and Type IIb supernovae (SNe), describing
  the individual SNe in detail. The relative depths of the helium absorption lines
  in the spectra of the SNe Ib appear to provide a measurement of the temporal evolution
  of the SN, with He I lambda5876 and He I lambda7065 growing in strength relative
  to He I lambda6678 over time. Light curves for three of the SNe Ib provide a sequence
  for correlating the helium line strengths. We find that some SNe Ic show evidence
  for weak helium absorption, but most do not. Aside from the presence or absence
  of the helium lines, there are other spectroscopic differences between SNe Ib and
  SNe Ic. On average, the O I lambda7774 line is stronger in SNe Ic than in SNe Ib.
  In addition, the SNe Ic have distinctly broader emission lines at late times, indicating
  a consistently larger explosion energy and/or lower envelope mass for SNe Ic than
  for SNe Ib. While SNe Ib appear to be basically homogeneous, the SNe Ic are quite
  heterogeneous in their spectroscopic characteristics. Three SNe Ic that may have
  been associated with gamma-ray bursts are also discussed; two of these have clearly
  peculiar spectra, while the third seems fairly typical.
