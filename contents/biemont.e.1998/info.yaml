abstract: Oscillator strengths and lifetime values for Yb II levels have been calculated
  within the framework of a pseudo-relativistic Hartree-Fock (HFR) approximation combined
  with a least-squares fitting of the calculated eigenvalues to the observed energy
  levels. A considerable amount of configuration interaction together with core-polarization
  effects have been included in the calculations. The quality of the HFR results has
  been assessed through a comparison with data obtained using the completely independent
  relativistic quantum defect orbital (RQDO) method. The theoretical lifetimes reported
  in the present paper are now in good agreement with most of the accurate experimental
  values available. The origin of the persisting discrepancies is suggested.
