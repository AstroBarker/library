abstract: This paper, the second in a series on radiation-regulated accretion onto
  black holes (BHs) from galactic scales, focuses on the effects of radiation pressure
  and angular momentum of the accreting gas. We simulate accretion onto intermediate-mass
  black holes, but we derive general scaling relationships that are solutions of the
  Bondi problem with radiation feedback valid for any mass of the BH M bh. Thermal
  pressure of the ionized sphere around the BH regulates the accretion rate, producing
  periodic and short-lived luminosity bursts. We find that for ambient gas densities
  exceeding n cr H, \infty{}vpropM -1 bh, the period of the oscillations decreases
  rapidly and the duty cycle increases from 6\%, in agreement with observations of
  the fraction of active galactic nuclei at z ~ 3, to 50\%. The mean accretion rate
  becomes Eddington limited for n H, \infty{} > n Edd H, \infty{} ~= n cr H, \infty{}
  T \infty{}, 4 -1 where T \infty{}, 4 is the gas temperature in units of 104 K. In
  the sub-Eddington regime, the mean accretion rate onto BHs is about 1\%T 2.5 \infty{},
  4 of the Bondi rate, and thus is proportional to the thermal pressure of the ambient
  medium. The period of the oscillations coincides with the depletion timescale of
  the gas inside the ionized bubble surrounding the BH. Gas depletion is dominated
  by a pressure gradient pushing the gas outward if n H, \infty{} < n cr H, \infty{}
  and by accretion onto the BH otherwise. Generally, for n H, \infty{} < n cr H, \infty{}
  angular momentum does not significantly affect the accretion rate and period of
  the oscillations.
