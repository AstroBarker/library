abstract: Nuclear partition functions were calculated for a grid of temperatures from
  1.2\texttimes{}1010 to 2.75\texttimes{}1011 K (1MeV<=kT<=24 MeV) within a Fermi-gas
  approach, including all nuclides from the proton-dripline to the neutron-dripline
  with proton number 9<=Z<=85. The calculation is based on a nuclear level density
  description published elsewhere, thus extending the previous tables of partition
  functions beyond 1010 K. Additional high-temperature corrections had to be applied.
