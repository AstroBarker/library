abstract: The impact of an expanding supernova shell on a companion star is investigated.
  The results of a two-dimensional numerical hydrodynamic calculation are compared
  to the results of previous attempts to solve the problem analytically which assumed
  the stellar surface to be planar. The curved surface of the star and the finite
  thickness of the shell are found to have a significant effect in reducing the drag
  on the companion. In addition, not all of the matter which is ablated from the star
  is ejected straight back toward the supernova, further reducing the momentum imparted
  to the companion. As a result, the final momentum of the companion star is actually
  less than the incident momentum of the shell. It seems unlikely that the collision
  between the supernova shell and the companion star will have a significant effect
  on the orbit of the binary, except perhaps in extreme cases.
