abstract: Radiative charge transfer has been investigated for collisions of O with
  He+ with both a fully quantum mechanical theory and an optical potential method.
  Cross sections and rate coefficients are presented for the process O(3P)+He+-->O+(4So,2Po,2Do)+He+\hslash{}omega
  and are compared to those of direct charge transfer. The relative collision energies
  considered range from 0.1 meV to ~3 eV with a semiclassical extension to 10 keV
  and temperatures between 10 and 2.0\texttimes{}106 K. The results demonstrate that
  radiative charge transfer is the dominant process over the energy and temperature
  region considered. Total emission spectra for the two strongest of the ten possible
  transitions are given for several collision energies, and the origin of resonance-like
  structures in the spectra is discussed.
