abstract: Common envelope (CE) evolution is an outstanding open problem in stellar         evolution,
  critical to the formation of compact binaries         including gravitational-wave
  sources. In the ``classical''         isolated binary evolution scenario for double
  compact objects,         the CE is usually the second mass transfer phase. Thus,
  the         donor star of the CE is the product of a previous binary         interaction,
  often stable Roche lobe overflow (RLOF). Because of         the accretion of mass
  during the first RLOF, the main-sequence         core of the accretor star grows
  and is ``rejuvenated.'' This         modifies the core-envelope boundary region
  and decreases         significantly the envelope binding energy for the remaining         evolution.
  Comparing accretor stars from self-consistent binary         models to stars evolved
  as single, we demonstrate that the         rejuvenation can lower the energy required
  to eject a CE by         \raisebox{-0.5ex}\textasciitilde42\%-96\% for both black
  hole         and neutron star progenitors, depending on the evolutionary         stage
  and final orbital separation. Therefore, binaries         experiencing first stable
  mass transfer may more easily survive         subsequent CE events and result in
  possibly wider final         separations compared to current predictions. Despite
  their high         mass, our accretors also experience extended ``blue loops,''         which
  may have observational consequences for low-metallicity         stellar populations
  and asteroseismology.
