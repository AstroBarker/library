abstract: '``Evolve ZAMS'''' (EZ) is a code derived from Peter Eggleton''s stellar
  evolution program. The core of EZ is a stripped down, rewritten version of a subset
  of Eggleton''s code, specialized to handle single star evolution from the zero-age
  main sequence until forced to stop by an event such as a helium flash or a crystallizing
  core. The procedure and data interfaces to the program are designed to be easy to
  use while still providing a wide range of function. EZ is written in Fortran 95
  following current programming practices and can be downloaded from the Web at http://theory.kitp.ucsb.edu/~paxton.'
