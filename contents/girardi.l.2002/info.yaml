abstract: 'We provide tables of theoretical isochrones in several photometric systems.
  To this aim, the following steps are followed: (1) first, we re-write the formalism
  for converting synthetic stellar spectra into tables of bolometric corrections.
  The resulting formulas can be applied to any photometric system, provided that the
  zero-points are specified by means of either ABmag, STmag, VEGAmag, or a standard
  star system that includes well-known spectrophotometric standards. Interstellar
  absorption can be considered in a self-consistent way. (2) We assemble an extended
  and updated library of stellar intrinsic spectra. It is mostly based on ``non-overshooting''''
  ATLAS9 models, suitably extended to both low and high effective temperatures. This
  offers an excellent coverage of the parameter space of T\_eff, log g, and [M/H].
  We briefly discuss the main uncertainties and points still deserving more improvement.
  (3) From the spectral library, we derive tables of bolometric corrections for Johnson-Cousins-Glass,
  HST/WFPC2, HST/NICMOS, Washington, and ESO Imaging Survey systems (this latter consisting
  on the WFI, EMMI, and SOFI filter sets). (4) These tables are used to convert several
  sets of Padova isochrones into the corresponding absolute magnitudes and colours,
  thus providing a useful database for several astrophysical applications. All data
  files are made available in electronic form.'
