abstract: This compilation extends the 1991 listing of atomic data by Morton to the
  heavier stable elements from germanium to bismuth. Technetium, thorium, and uranium
  are added because they can live long enough to be astrophysically detectable. The
  tabulation emphasizes resonance lines, i.e., lines the lower level of which is the
  ground state, or an excited fine-structure state of the ground term, and is restricted
  to wavelengths longward of the H I Lyman limit at 911.75 {\AA}. This paper has attempted
  to review all data published by mid-1999 and includes some later material. The tables
  contain the best data available to the author on level designations, ionization
  potentials, vacuum and air wavelengths, lower and upper energy levels, statistical
  weights, transition probabilities, natural damping constants (reciprocal lifetimes),
  oscillator strengths, and the often-used combinations of loggf and loglambdaf. All
  ion stages with classified lines are included. Individual components resulting from
  isotope shift and hyperfine structure are listed explicitly for Rb I, Cs I, Hg I
  and Hg II, Ti II, and Pb II. The accompanying text provides references, explanations
  for the critical selection of data, and notes indicating where new measurements
  or calculations are needed. This compilation should be particularly useful in the
  analysis of interstellar and quasar absorption lines and other astrophysical sites
  where the density of particles and radiation is low enough to excite only the lowest
  atomic levels. The data also are relevant to the study of stellar atmospheres, particularly
  those with enhanced abundances of heavy elements.
