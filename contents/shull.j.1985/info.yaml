abstract: Accurate Monte Carlo computations of the X-ray secondary electron heating,
  ionization, and excitation of H and He gas in interstellar space and in quasar emission-line
  clouds, are presented. The fraction of energy deposited in each form is sensitive
  to the background ionization fraction, x = n(H+)/n(Htot), and can affect the temperature,
  ionization state, and line emissivities at large depths in X-ray photoionized clouds.
  Analytic fits are provided for these energy fractions over the range 0.0001-1 for
  primary electron energies up to many keV. In both broad-line and narrow-line clouds,
  emission lines sensitive to the energy budget and electron density may be strongly
  affected.
