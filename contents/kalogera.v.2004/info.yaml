abstract: In our original Letter, we calculated the likely size of the Galactic double
  neutron star (DNS) population in two stages. First, we simulated the DNS distribution
  in the Galaxy. At this stage, in addition to storing the spatial properties and
  luminosities of the model pulsars, we also computed their expected dispersion measures
  and pulse scatter broadening times using a model for the electron density distribution.
  This information was stored to an intermediate file for subsequent analysis by our
  simulation code, in which the simulated population was ``searched'' using detailed
  models of the various pulsar surveys. Unfortunately, while the scatter-broadening
  times created in the first part of the calculation were saved in units of milliseconds,
  the survey simulation code assumed them in units of seconds. This error led to an
  underprediction of the number of pulsars in the model observed samples, which in
  turn resulted in an overestimate of the true number, and hence in-spiral rate, of
  DNS binaries in the Galaxy.  We have now repeated these calculations using the correct
  unit conversion and find the Galactic DNS in-spiral rate R to be 83.0+209.1-66.1
  Myr-1 at a 95\% confidence interval (model 6), a factor of ~2.2 smaller than in
  the original paper. The corresponding detection rates for the initial and advanced
  LIGO are Rdet,ini=(34.8+87.6-27.7)\texttimes{}10-3 yr-1 and Rdet,adv=186.8+470.5-148.7
  yr-1, respectively. For all models we consider, the estimated DNS in-spiral rates
  range between ~4 and 224 Myr-1. We show the revised result for our reference model
  in Figure 1. Table 1 summarizes the revised calculations for all models in our original
  paper. However, we note that the increase rate factor (IRF) due to the discovery
  of J0737-3039 remains essentially unaffected, since the unit error cancels out,
  the IRF being a measure of relative changes in rate. The IRF is found to be in the
  range 6-7 for all models under consideration. The exact values of IRF are shown
  in Table 1.  This error also propagates through to our predictions for future DNS
  discoveries in the Parkes multibeam survey. Repeating the analysis in {\S} 4 of
  our original Letter, we find that the average number of DNS with properties similar
  to those currently known to be detected using full acceleration search processing
  is ~4. The revised probability distribution of expected detections is shown in Figure
  2.
