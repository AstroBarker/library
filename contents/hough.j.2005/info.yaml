abstract: Results are now appearing from the first generation of long baseline gravitational
  wave detectors that use laser interferometry for motion sensing. In this short review
  the history of the field will be briefly discussed, and the principles of the novel
  laser interferometry developed will be outlined in the context of present and future
  instruments.
