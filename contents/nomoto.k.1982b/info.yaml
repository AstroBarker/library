abstract: The initial mass of the Crab Nebula's progenitor star is estimated by comparing
  the observed nebular chemical abundances with detailed evolutionary calculations
  for 2.4- and 2.6-solar-mass helium cores of stars with masses of 8 to 10 solar masses.
  The results indicate that the mass of the Crab's progenitor was between the upper
  limit of about 8 solar masses for carbon deflagration and the lower limit of about
  9.5 solar masses set by the dredge-up of the helium layer before the development
  of the helium-burning convective region. A scenario is outlined for the evolution
  of the progenitor star. It is suggested that the Crab Nebula was probably the product
  of an electron-capture supernova.
