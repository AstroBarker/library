abstract: We use Chandra data to derive a detailed gas temperature map of the nearby,
  hot, merging galaxy cluster A754. Combined with the X-ray and optical images, the
  map reveals a more complex merger geometry than previously thought, possibly involving
  more than two subclusters or a cool gas cloud sloshing independently from its former
  host subcluster. In the cluster central region, we detect spatial variations of
  the gas temperature on all linear scales, from 100 kpc (the map resolution) and
  up, which likely remain from a merger shock passage. These variations are used to
  derive an upper limit on effective thermal conductivity on a 100 kpc scale, which
  is at least an order of magnitude lower than the Spitzer value. This constraint
  pertains to the bulk of the intracluster gas, as compared to the previously reported
  estimates for cold fronts (which are rather peculiar sites). If the conductivity
  in a tangled magnetic field is at the recently predicted higher values (i.e., about
  1/5 Spitzer), the observed suppression can be achieved, for example, if the intracluster
  gas consists of magnetically isolated domains.
