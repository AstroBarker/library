abstract: We obtained high-resolution, high signal-to-noise ratio (S/N) spectroscopy
  for the very metal poor star HD 122563 with the Subaru Telescope High Dispersion
  Spectrograph. Previous studies have shown that this object has excesses of light
  neutron-capture elements, while its abundances of heavy ones are very low. In our
  spectrum, which covers 3070-4780 {\AA} of this object, 19 neutron-capture elements
  have been detected, including seven for the first time in this star (Nb, Mo, Ru,
  Pd, Ag, Pr, and Sm). Upper limits are given for five other elements including Th.
  The abundance pattern shows a gradually decreasing trend, as a function of atomic
  number, from Sr to Yb, which is quite different from those in stars with excesses
  of r-process elements. This abundance pattern of neutron-capture elements provides
  new strong constraints on the models of nucleosynthesis responsible for the very
  metal poor stars with excesses of light neutron-capture elements but without enhancement
  of heavy ones.  Based on data collected at the Subaru Telescope, which is operated
  by the National Astronomical Observatory of Japan.
