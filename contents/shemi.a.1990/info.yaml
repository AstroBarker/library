abstract: The influence of matter on a radiation fireball is examined. Even when a
  small amount of baryonic material is present, most of the radiation energy of the
  fireball will be converted to a kinetic energy of the matter, and almost no electromagnetic
  signal will be observed. The implications of this result for several processes in
  which such a fireball might occur are discussed.
