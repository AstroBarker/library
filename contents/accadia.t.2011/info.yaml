abstract: We describe the present state and future evolution of the Virgo gravitational
  wave detector, realized by the Virgo Collaboration at the European Gravitational
  Observatory, in Cascina near Pisa in Italy. We summarize basic principles of the
  operation and the design features of the Virgo detector. We present the sensitivity
  evolution due to a series of intermediate upgrades called Virgo+ which is being
  completed this year and includes new monolithic suspensions. We describe the present
  scientific potential of the detector. Finally we discuss the plans for the second
  generation of the detector, called Advanced Virgo, introducing its new features,
  the expected sensitivity evolution and the scientific potential.
