abstract: A new spectrograph has been commissioned for use on the Multiple-Mirror
  Telescope (MMT). The instrument is a low-to-moderate-resolution CCD channel for
  the two-beam MMT spectrograph which has until now been operated only with a blue-sensitive
  photon-counting detector array. The new CCD channel offers very high throughput
  in a range of operating modes, including long-slit spectroscopy using a variety
  of single-order gratings, direct imaging, and cross-dispersed ('echellette') spectroscopy.
  The latter mode makes efficient use of the full format of a TI 800 x 800 CCD by
  providing complete spectral coverage from 4500 A to 1 micron in several spectral
  orders at a resolution between 80 and 250 km/s. The design philosophy, details,
  and performance of the instrument are discussed in the context of current needs
  and future plans for upgrade of the MMT to a single 6.5-m primary.
