abstract: We present a detailed analysis of the extremely luminous and long-lasting
  Type IIn supernova (SN) 2006gy using spectra obtained between days 36 and 237 after
  explosion. We derive the temporal evolution of the effective temperature, radius,
  blast-wave and SN-ejecta expansion speeds, and bolometric luminosity, as well as
  the progenitor wind density and total swept-up mass overtaken by the shock. SN 2006gy
  can be interpreted in the context of shock interaction with a dense circumstellar
  medium (CSM), but with quite extreme values for the CSM mass of ~20 M sun and SN
  explosion kinetic energy of at least 5 \texttimes{} 1051 erg. A key difference between
  SN 2006gy and other SNe IIn is that, owing to its large amount of swept-up mass,
  the interaction region remained opaque much longer. At early times, Halpha emission-line
  widths suggest that the photosphere is ahead of the shock, and photons diffuse out
  through the opaque CSM shell. The pivotal transition to optically thin emission
  occurs around day 110, when we start to see a decrease in the blackbody radius R
  BB and strengthening tracers of the post-shock shell. From the evolution of pre-shock
  velocities, we deduce that the CSM was ejected by the progenitor star in a gsim1049
  erg precursor event ~8 yr before the explosion. The large CSM mass definitively
  rules out models involving stars with initial masses of lsim10 M sun. If the pre-SN
  mass budget also includes the likely SN ejecta mass of 10-20 M sun and the distant
  >10 M sun shell inferred from a light echo, then even massive M ZAMS = 30-40 M sun
  progenitor stars are inadequate. At roughly solar metallicity, substantial mass
  loss probably occurred during the star's life, so SN 2006gy's progenitor is more
  consistent with sequential giant luminous blue variable eruptions or pulsational
  pair-instability ejections in extremely massive stars with initial masses above
  100 M sun. This requires significant revision to current paradigms of massive-star
  evolution.
