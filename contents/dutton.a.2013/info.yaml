abstract: We use the relations between aperture stellar velocity dispersion (sigmaap),
  stellar mass (MSPS) and galaxy size (Re) for a sample of \texttildelow{}150 000
  early-type galaxies from Sloan Digital Sky Survey/DR7 to place constraints on the
  stellar initial mass function (IMF) and dark halo response to galaxy formation.
  We build lambda cold dark matter-based mass models that reproduce, by construction,
  the relations between galaxy size, light concentration and stellar mass, and use
  the spherical Jeans equations to predict sigmaap. Given our model assumptions (including
  those in the stellar population synthesis models), we find that reproducing the
  median sigmaap versus MSPS relation is not possible with both a universal IMF and
  a universal dark halo response. Significant departures from a universal IMF and/or
  dark halo response are required, but there is a degeneracy between these two solutions.
  We show that this degeneracy can be broken using the strength of the correlation
  between residuals of the velocity-mass (Deltalog sigmaap) and size-mass (Deltalog
  Re) relations. The slope of this correlation, \partial{}VR \equiv{} Deltalog sigmaap/Deltalog
  Re, varies systematically with galaxy mass from \partial{}VR ~= -0.45 at MSPS \texttildelow{}
  1010 M\&sun; to \partial{}VR ~= -0.15 at MSPS \texttildelow{} 1011.6 M\&sun;. The
  virial Fundamental Plane (FP) has \partial{}VR = -1/2, and thus we find that the
  tilt of the observed FP is mass dependent. Reproducing this tilt requires both a
  non-universal IMF and a non-universal halo response. Our best model has mass-follows-light
  at low masses (MSPS \lessequivlnt{} 1011.2 M\&sun;) and unmodified Navarro, Frenk
  and White haloes at MSPS \texttildelow{} 1011.5 M\&sun;. The stellar masses imply
  a mass-dependent IMF which is `lighter' than Salpeter at low masses and `heavier'
  than Salpeter at high masses.
