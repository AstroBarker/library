abstract: The nonlinear characteristics of RR Lyrae models containing a nonlocal,
  time-dependent treatment of convection are discussed. Both fundamental and first-overtone
  modes are considered. Convection in these models is very weak except for a short
  time near minimum radius when the two unstable zones merge and convection carries
  nearly all the flux near the hydrogen ionization zone and 45 percent of the flux
  in the helium ionization zone. Turbulent pressure work, destabilizing at small amplitude,
  becomes a stabilizing influence in the nonlinear regime and should act to reduce
  limiting amplitude.
