abstract: The main features of a three-dimensional, high-resolution special relativistic
  hydro code based on relativistic Riemann solvers are described. The capabilities
  and performance of the code are discussed. In particular, we present the results
  of extensive test calculations that demonstrate that the code can accurately and
  efficiently handle strong shocks in three spatial dimensions. Results of the performance
  of the code on single and multiprocessor machines are given. Simulations (in double
  precision) with <=7\texttimes{}106 computational cells require less than 1 Gbyte
  of RAM memory and ~7\texttimes{}10-5 CPU s per zone and time step (on a SCI Cray-Origin
  2000 with a R10000 processor). Currently, a version of the numerical code is under
  development, which is suited for massively parallel computers with distributed memory
  architecture (such as, e.g., Cray T3E).
