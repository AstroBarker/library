abstract: A model of a thin polytropic disk accretion onto a polytropic star through
  a polytropic boundary layer is analyzed and a one-parameter series of models is
  calculated with the stellar angular velocity varying from small to somewhat supercritical
  values along the series. It is demonstrated that there is no limit to the amount
  of mass that can be accreted from a disk onto a star. The dimensionless accretion
  rate of angular momentum changes sign when the rotation becomes somewhat supercritical.
  As long the rotation is subcritical, this rate is almost constant, but when the
  angular velocity of the star exceeds the critical value by just 0.5 percent, its
  value drops dramatically.
