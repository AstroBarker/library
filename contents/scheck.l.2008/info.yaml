abstract: Performing two-dimensional hydrodynamic simulations including a detailed
  treatment of the equation of state of the stellar plasma and for the neutrino transport
  and interactions, we investigate here the interplay between different kinds of non-radial
  hydrodynamic instabilities that can play a role during the postbounce accretion
  phase of collapsing stellar cores. The convective mode of instability, which is
  driven by the negative entropy gradients caused by neutrino heating or by variations
  in the shock strength in transient phases of shock expansion and contraction, can
  be identified clearly by the development of typical Rayleigh-Taylor mushrooms. However,
  in those cases where the gas in the postshock region is rapidly advected towards
  the gain radius, the growth of such a buoyancy instability can be suppressed. In
  this situation the shock and postshock flow can nevertheless develop non-radial
  asymmetry with an oscillatory growth in the amplitude. This phenomenon has been
  termed "standing (or spherical) accretion shock instability" (SASI). It is shown
  here that the SASI oscillations can trigger convective instability, and like the
  latter, they lead to an increase in the average shock radius and in the mass of
  the gain layer. Both hydrodynamic instabilities in combination stretch the advection
  time of matter accreted through the neutrino-heating layer and thus enhance the
  neutrino energy deposition in support of the neutrino-driven explosion mechanism.
  A rapidly contracting and more compact nascent neutron star turns out to be favorable
  for explosions, because the accretion luminosity and neutrino heating are greater
  and the growth rate of the SASI is higher. Moreover, we show that the oscillation
  period of the SASI observed in our simulations agrees with the one estimated for
  the advective-acoustic cycle (AAC), in which perturbations are carried by the accretion
  flow from the shock to the neutron star and pressure waves close an amplifying global
  feedback loop. A variety of other features in our models, as well as differences
  in their behavior, can also be understood on the basis of the AAC hypothesis. The
  interpretation of the SASI in our simulations as a purely acoustic phenomenon, however,
  appears difficult.
