abstract: We know from observations that globular clusters are very efficient catalysts
  in forming unusual short-period binary systems or their offspring, such as low-mass
  X-ray binaries (LMXBs; neutron stars accreting matter from low-mass stellar companions),
  cataclysmic variables (white dwarfs accreting matter from stellar companions), and
  millisecond pulsars (rotating neutron stars with spin periods of a few milliseconds).
  Although there has been little direct evidence, the overabundance of these objects
  in globular clusters has been attributed by numerous authors to the high densities
  in the cores, which leads to an increase in the formation rate of exotic binary
  systems through close stellar encounters. Many such close binary systems emit X-radiation
  at low luminosities (LX<~1034 ergs s-1) and are being found in large numbers through
  observations with the Chandra X-Ray Observatory. Here we present conclusive observational
  evidence of a link between the number of close binaries observed in X-rays in a
  globular cluster and the stellar encounter rate of the cluster. We also make an
  estimate of the total number of LMXBs in globular clusters in our Galaxy.
