abstract: The fluctuation spectrum that must arise in a mean field dynamo generation
  of galactic fields if the initial field is weak is considered. A kinetic equation
  for its evolution is derived and solved. The spectrum evolves by transfer of energy
  from one magnetic mode to another by interaction with turbulent velocity modes.
  This kinetic equation is valid in the limit that the rate of evolution of the magnetic
  modes is slower than the reciprocal decorrelation time of the turbulent modes. This
  turns out to be the case by a factor greater than 3. Most of the fluctuation energy
  concentrates on small scales, shorter than the hydrodynamic turbulent scales. The
  fluctuation energy builds up to equipartition with the turbulent energy in times
  that are short compared to the e-folding time of the mean field. The turbulence
  becomes strongly modified before the dynamo amplification starts. Thus, the kinematic
  assumption of the mean dynamo theory is invalid. Thus, the galactic field must have
  a primordial origin, although it may subsequently be modified by dynamo action.
