abstract: Neutrino-driven winds, which follow core-collapse supernova explosions,
  present a fascinating nuclear-astrophysics problem that requires an understanding
  of advanced astrophysics simulations, the properties of matter and neutrino interactions
  under extreme conditions, the structure and reactions of exotic nuclei, and comparisons
  with forefront astronomical observations. The neutrino-driven wind has attracted
  vast attention over the last 20 years as it was suggested as a candidate for the
  astrophysics site where half of the heavy elements are produced via the r-process.
  In this review, we summarize our present understanding of neutrino-driven winds
  from the dynamical and nucleosynthesis perspectives. Rapid progress has been made
  during recent years in understanding the wind with improved simulations and better
  micro physics. The current status of the fields is that hydrodynamical simulations
  do not reach the extreme conditions necessary for the r-process, and the proton
  or neutron richness of the wind remains to be investigated in more detail. However,
  nucleosynthesis studies and observations already point to neutrino-driven winds
  to explain the origin of lighter heavy elements, such as Sr, Y, Zr.
