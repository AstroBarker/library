abstract: HET optical spectroscopy and unfiltered ROTSE-III photometry spanning the
  first 11 months since explosion of the Type II-P SN 2006bp are presented. The data
  suggest that the supernova was first detected just hours after shock breakout. Optical
  spectra obtained about 2 days after breakout exhibit narrow emission lines corresponding
  to He II lambda4200, He II lambda4686, and C IV lambda5805 in the rest frame. These
  emission features persist in a second observation obtained 5 hr later but are not
  detected the following night or in subsequent observations. These lines probably
  emanate from material close to the explosion site, possibly in the outer layers
  of the progenitor that have been ionized by the high-energy photons released at
  shock breakout. A P Cygni profile is observed around 4450 {\AA} in the +2 and +3
  day spectra. We propose that this line is due to He II lambda4687 rather than high-velocity
  Hbeta, as previously suggested. Further HET spectra cover the evolution across the
  photometric plateau up to 73 days after breakout and during the nebular phase around
  day +340. Expansion velocities are derived for key features. The measured decay
  slope for the unfiltered light curve is 0.0073+/-0.0004 mag day-1 between days +121
  and +335, which is significantly slower than the decay of rate 56Co. We present
  a quasi-bolometric light curve through day +60. We see a slow cooling over the first
  25 days but no sign of an early sharp peak; any such feature from the shock breakout
  must have lasted less than ~1 day.  Based on observations obtained with the Hobby-Eberly
  Telescope, which is a joint project of the University of Texas at Austin, the Pennsylvania
  State University, Stanford University, Ludwig-Maximilians-Universit{\"a}t M{\"u}nchen,
  and Georg-August-Universit{\"a}t G{\"o}ttingen.
