abstract: 'A new, three-dimensional, shock-capturing, hydrodynamic code is utilized
  to determine the distribution of hot gas in a cold dark matter (CDM) + lambda model
  universe. Periodic boundary conditions are assumed: a box with size 85/h Mpc, having
  cell size 0.31/h Mpc, is followed in a simulation with 2703 = 107.3 cells. We adopt
  omega = 0.45, lambda = 0.55, h identically equal to H/100 km/s/Mpc = 0.6, and then,
  from the cosmic background explorer (COBE) and light element nucleosynthesis, sigma8
  = 0.77, omegab = 0.043. We identify the X-ray emitting clusters in the simulation
  box, compute the luminosity function at several wavelength bands, the temperature
  function and estimated sizes, as well as the evolution of these quantities with
  redshift. This open model succeeds in matching local observations of clusters in
  contrast to the standard omega = 1, CDM model, which fails. It predicts an order
  of magnitude decline in the number density of bright (h nu = 2-10 keV) clusters
  from z = 0 to z = 2 in contrast to a slight increase in the number density for standard
  omega = 1, CDM model. This COBE-normalized CDM + lambda model produces approximately
  the same number of X-ray clusters having Lx greater than 1043 erg/s as observed.
  The background radiation field at 1 keV due to clusters is approximately the observed
  background which, after correction for numerical effects, again indicates that the
  model is consistent with observations.'
