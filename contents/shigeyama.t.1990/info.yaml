abstract: The applicability of theoretical models of He-star explosions to type Ib
  SN explosions is explored. Particular attention is given to light curves and mixing,
  Rayleigh-Taylor instabilities and mixing, and nucleosynthesis and the mass of Ni-56.
  Typical numerical results are presented in graphs, and it is concluded that the
  explosions of SN 1983N and SN 1983I can be accurately represented in terms of explosions
  of He stars with M(alpha) of 3-4 solar mass. A strong M(alpha) dependence of light-curve
  shape, photospheric velocity, and Ni-56 mass is found.
