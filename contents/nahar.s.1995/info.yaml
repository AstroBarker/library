abstract: A new unified treatment for electron-ion recombination is employed to obtain
  recombination rate coefficients for silicon, sulfur, and carbon ions of importance
  in the study of the interstellar medium and H II regions in general. Improved and
  extended results are also presented for ions in the carbon isoelectronic sequence.
  Recombination rate coefficients are tabulated at a wide range of temperatures, from
  101 to l09 K. These rates correspond to total electron-ion recombination incorporating
  both the radiative and dielectronic recombination processes calculated in an ab
  initio manner.
