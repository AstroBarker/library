abstract: 'The effect of stellar structure on supernova remnant formation is studied
  with a series of computer models of a 10 to the 51st erg explosion in a 15 solar
  mass star. Immediately after the explosion shock wave travels down a steep density
  gradient, the material in the gradient goes into free expansion, forming a collapsible
  piston. At the outer edge of such a piston are two shock waves: the expanding supernova
  shock and a reverse shock moving back into the collapsible piston. Until the piston
  is completely collapsed it is Rayleigh-Taylor stable, but after collapse the inner
  material behaves as a massive piston and the interface is Rayleigh-Taylor unstable.
  If there is a significant mass in an external density gradient, the material between
  the supernova shock moving out through the interstellar medium and the reverse shock
  will be a significant source of X-rays during the pre-blast-wave phase of remnant
  formation.'
