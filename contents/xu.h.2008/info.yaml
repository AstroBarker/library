abstract: We report the results of the first self-consistent three-dimensional adaptive
  mesh refinement magnetohydrodynamical simulations of Population III star formation
  including the Biermann battery effect. We find that the Population III stellar cores
  formed including this effect are both qualitatively and quantitatively similar to
  those from hydrodynamics-only (non-MHD) cosmological simulations. We observe peak
  magnetic fields of simeq 10-9 G in the center of our star-forming halo at z simeq
  17.55 at a baryon density of nB ~ 1010 cm-3. The magnetic fields created by the
  Biermann battery effect are predominantly formed early in the evolution of the primordial
  halo at low density and large spatial scales, and then grow through compression
  and by shear flows. The fields seen in this calculation are never large enough to
  be dynamically important (with beta >= 1015 at all times before the termination
  of our calculation), and should be considered the minimum possible fields in existence
  during Population III star formation. The lack of magnetic support lends credibility
  to assumptions made in previous calculations regarding the lack of importance of
  magnetic fields in Population III star formation. In addition, these magnetic fields
  may be seed fields for the stellar dynamo or the magnetorotational instability at
  higher densities and smaller spatial scales.
