abstract: Estimates of the Galactic coalescence rate (R) of close binaries with two
  neutron stars (NS-NS) are known to be uncertain by large factors (about 2 orders
  of magnitude) mainly because of the small number of systems detected as binary radio
  pulsars. We present an analysis method that allows us to estimate the Galactic NS-NS
  coalescence rate using the current observed sample and, importantly, to assign a
  statistical significance to these estimates and calculate the allowed ranges of
  values at various confidence levels. The method involves the simulation of selection
  effects inherent in all relevant radio pulsar surveys and a Bayesian statistical
  analysis for the probability distribution of the rate. The most likely values for
  the total Galactic coalescence rate (Rpeak) lie in the range 2-60 Myr-1 depending
  on different pulsar population models. For our reference model 1, in which the most
  likely estimates of pulsar population properties are adopted, we obtain Rtot=8+9-5
  Myr-1 at a 68\% statistical confidence level. The corresponding ranges of expected
  detection rates of NS-NS inspiral are 3+4-2\texttimes{}10-3 yr-1 for the initial
  LIGO and 18+21-11 yr-1 for the advanced LIGO.
