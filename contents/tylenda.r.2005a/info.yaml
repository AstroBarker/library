abstract: We summarize and analyze the available observational data on the progenitor
  and the environment of V838 Mon. From the available photometric data for the progenitor
  of V838 Mon we exclude the possibility that the object before eruption was an evolved
  red giant star (AGB or RGB star). We find that most likely it was a main sequence
  or pre-main sequence star of \texttildelow{} 5-10~ M\&sun;. From the light echo
  structure and evolution we conclude that the reflecting dust is of interstellar
  nature rather than blown by V838 Mon in the past. We discuss the IRAS and CO data
  for interstellar medium observed near the position of V838 Mon. Several interstellar
  molecular regions have radial velocities similar to that of V838 Mon, so dust seen
  in the light echo might be related to one of them.
