abstract: An electromagnetic transient powered by the radioactive decay of r-process
  elements, a so-called kilonova/macronova, is one of the possible observable consequences
  of compact binary mergers including at least one neutron star. Recent observations
  strongly suggest the discovery of the first electromagnetic transient, which is
  associated with the short gamma ray burst 130603B. We explore a possible progenitor
  of this event by combining numerical-relativity simulations and radiative transfer
  simulations of the dynamical ejecta of binary neutron star and black hole-neutron
  star mergers. We show that the ejecta models within a realistic parameter range
  consistently reproduce the observed near-infrared excess. We also show that the
  soft equation-of-state models for binary neutron star mergers and the stiff equation-of-state
  models for black hole-neutron star mergers are suitable for reproducing the observed
  luminosity.
