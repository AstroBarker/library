abstract: Accurate assessment of the value of the incompressibility coefficient, K,
  of symmetric nuclear matter, which is directly related to the curvature of the equation
  of state (EOS), is needed to extend our knowledge of the EOS in the vicinity of
  the saturation point. We review the current status of K as determined from experimental
  data on isoscalar giant monopole and dipole resonances (compression modes) in nuclei,
  by employing the microscopic theory based on the random-phase approximation (RPA).
