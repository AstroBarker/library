abstract: Explosive hydrogen burning in type I X-ray bursts (XRBs) is driven by charged
  particle reactions creating isotopes with masses up to A ~ 100. Since charged particle
  reactions in a stellar environment are very temperature sensitive, we use a realistic
  time-dependent general relativistic and self-consistent model of type I X-ray bursts
  to provide accurate values of the burst temperatures and densities. This allows
  a detailed and accurate time-dependent identification of the reaction flow from
  the surface layers through the convective region and the ignition region to the
  neutron star ocean. Using this, we determine the relative importance of specific
  nuclear reactions in the X-ray burst.
