abstract: Observational evidence points to a red supergiant (RSG) progenitor for         SN
  2023ixf. The progenitor candidate has been detected in         archival images at
  wavelengths (>0.6 micron) where RSGs         typically emit profusely. This object
  is distinctly variable in         the infrared (IR). We characterize the variability
  using pre-         explosion mid-IR (3.6 and 4.5 micron) Spitzer and ground-based         near-IR
  (JHKs) archival data jointly covering a duration of         around 19 yr. The IR
  light curves exhibit significant         variability with RMS amplitudes in the
  range of 0.2-0.4 mag,         increasing with decreasing wavelength. From a robust
  period         analysis of the more densely sampled Spitzer data, we measure a         period
  of 1091+/-71 days. We demonstrate using Gaussian Process         modeling that this
  periodicity is also present in the near-IR         light curves, thus indicating
  a common physical origin, which is         likely pulsational instability also seen
  in other RSGs. We use         the period-luminosity relation for RSGs from the literature
  to         derive a value of M\_K=-11.58+/-0.12 mag, corresponding to         log(L/L\_sun)
  in the range 5.2-5.5 dex assuming an M spectral         type for the RSG progenitor
  candidate. This gives an independent         estimate of its luminosity, unaffected
  by uncertainties in         extinction and distance. Assuming the progenitor candidate         underwent
  enhanced dust-driven mass-loss during the time of         these archival observations,
  and using an empirical period-         luminosity-based mass-loss prescription,
  we obtain a mass-loss         rate of around (2-4)x10\^-4 M\_sun/yr. Comparing the
  above         luminosity with stellar evolution models, we infer an initial         mass
  for the progenitor candidate of 20+/-4 M\_sun, making this         one of the most
  massive progenitors for a Type II SN detected         to-date.
