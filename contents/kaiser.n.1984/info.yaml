abstract: If rich clusters formed where the primordial density enhancement, when averaged
  over an appropriate volume, was unusually large, then they give a biased measure
  of the large-scale density correlation function determiend by the probability distribution
  of the density fluctuations on a rich cluster mass scale. If this distribution was
  Gaussian, the correlation function is amplified. The amplification for rich clusters
  is estimated to be eaual about ten and predicted trend of amplification with richness
  agrees qualitatively with that observed. Some implications of these results for
  the large-scale density correlations are discussed.
