abstract: The 12C( alpha , gamma )16O reaction rate has been reevaluated using recently
  published cross section estimates. The results suggest that the temperature dependence
  of the reaction rate as given by Caughlan \& Fowler should be revised, even though
  the absolute cross section of 12C( alpha , gamma )16O still needs a better determination
  at low energies. Values for the stellar reaction rate of 12C( alpha , gamma )16O
  have been calculated for a recommended cross section as well as for the experimental
  upper and lower limits of the cross section. In addition, analytic expressions for
  these reaction rates are given for 0.03 <= T9 <= 2.
