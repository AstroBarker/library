abstract: Open clusters offer us the means to study stellar properties in samples
  with well-defined ages and initial chemical composition. Here we present a survey
  of projected rotational velocities for a large sample of mainly B-type stars in
  young clusters to study the time evolution of the rotational properties of massive
  stars. The survey is based on moderate-resolution spectra made with the WIYN 3.5
  m and CTIO 4 m telescopes and Hydra multi-object spectrographs, and the target stars
  are members of 19 young open clusters with an age range of approximately 6-73 Myr.
  We made fits of the observed lines He I lambdalambda4026, 4387, 4471, and Mg II
  lambda4481, using model theoretical profiles to find projected rotational velocities
  for a total of 496 OB stars. We find that there are fewer slow rotators among the
  cluster B-type stars relative to nearby B stars in the field. We present evidence
  consistent with the idea that the more massive B stars (M>9 Msolar) spin down during
  their main-sequence phase. However, we also find that the rotational velocity distribution
  appears to show an increase in the numbers of rapid rotators among clusters with
  ages of 10 Myr and higher. These rapid rotators appear to be distributed between
  the zero age and terminal age main-sequence locations in the Hertzsprung-Russell
  diagram, and thus only a minority of them can be explained as the result of a spin-up
  at the terminal age main sequence due to core contraction. We suggest instead that
  some of these rapid rotators may have been spun up through mass transfer in close
  binary systems.
