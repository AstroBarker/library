abstract: We have compiled a sample of 45 Type Ia supernovae (SNe Ia) discovered by
  the Lick Observatory Supernova Search (LOSS) and the Beijing Astronomical Observatory
  Supernova Survey (BAOSS), and determined the rate of spectroscopically peculiar
  SNe Ia (i.e., SN 1986G-like, SN 1991bg-like, and SN 1991T-like objects) and the
  luminosity function of SNe Ia. Because of the nature of the two surveys (distance-limited
  with small baselines and deep limiting magnitudes), nearly all SNe Ia have been
  discovered in the sample galaxies of LOSS and BAOSS; thus, the observed peculiarity
  rate and luminosity function of SNe Ia are intrinsic. We find that 36\%+/-9\% of
  nearby SNe Ia are peculiar; specifically, the luminosity function of SNe Ia consists
  of 20\% SN 1991T-like, 64\% normal, and 16\% SN 1991bg-like objects. We have compared
  our results to those found by earlier studies, and to those found at high redshift.
  The apparent dearth of SN 1991T-like objects at high redshift may be due to extinction,
  and especially to the difficulty of recognizing them from spectra obtained past
  maximum brightness or from spectra with low signal-to-noise ratios. Implications
  of the high peculiarity rate for the progenitor systems of SNe Ia are also briefly
  discussed.
