abstract: The mechanism for revival of a stalled supernova shock found by Wilson (1982)
  in a computation is analyzed. Neutrinos from the hot, inner core of the supernova
  are absorbed in the outer layers, and although only about 0.1 percent of their energy
  is so absorbed, this is enough to eject the outer part of the star and leave only
  enough mass to form a neutron star. The neutrino absorption is independent of the
  density of material. After the shock recedes to some extent, neutrino heating establishes
  a sufficient pressure gradient to push the material beyond about 150 km outward,
  while the material further in falls rapidly toward the core. This makes the density
  near 150 km decrease spectacularly, creating a quasi-vacuum in which the pressure
  is mainly carried by radiation. This is a perfect condition to make the internal
  energy of the matter sufficient to escape from the gravitational attraction of the
  star. The net energy of the outgoing shock is about 4 x 10 to the 50th ergs.
