abstract: Models are used to explore the outcome of explosive ignition of ONeMg cores,
  which result from the evolution of stars in a mass range between 8 and 10 solar
  masses. Arguments are presented showing that the thermonuclear supernova production
  or the 'iron' dwarf formation by milder outbursts are possibile outcomes of the
  explosive ignition of ONeMg cores. It is suggested that the physics of the explosive
  ignition of ONeMg cores may well be a key to such phenomena as SN Ia and SN Ib/c
  outbursts, or perhaps to a new type of objects.
