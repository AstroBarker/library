abstract: We observed the Galactic black hole candidate XTE J1650-500 early in its
  fall of 2001 outburst with the XMM-Newton European Photon Imaging pn Camera (EPIC-pn).
  The observed spectrum is consistent with the source having been in the ``very high''
  state. We find a broad, skewed Fe Kalpha emission line that suggests the primary
  in this system may be a Kerr black hole and that indicates a steep disk emissivity
  profile that is hard to explain in terms of a standard accretion disk model. These
  results are quantitatively and qualitatively similar to those from an XMM-Newton
  observation of the Seyfert galaxy MCG -6-30-15. The steep emissivity in MCG -6-30-15
  may be explained by the extraction and dissipation of rotational energy from a black
  hole with nearly maximal angular momentum or from material in the plunging region
  via magnetic connections to the inner accretion disk. If this process is at work
  in both sources, an exotic but fundamental general relativistic prediction may be
  confirmed across a factor of 106 in black hole mass. We discuss these results in
  terms of the accretion flow geometry in stellar-mass black holes and the variety
  of enigmatic phenomena often observed in the very high state.
