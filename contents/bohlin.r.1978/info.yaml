abstract: 'This paper presents interstellar H I column densities, mean H I space densities,
  total neutral hydrogen column densities, and total mean hydrogen space densities
  toward 100 stars surveyed in the L-alpha region with the U2 detector of the Copernicus
  satellite. The data for 47 stars are compared with OAO 2 results, and ratios of
  gas to E(B-V) color excess are computed for 30 ''intercloud'' stars, 45 ''cloud''
  stars, and the combined sample of 75 stars. A definitive value of 5.8 x 10 to the
  21st power atoms/sq cm per mag is obtained for the mean ratio of total neutral hydrogen
  to color excess, indicating that this ratio seems to be a constant, independent
  of location in the sky, except possibly toward stars with anomalous extinction.
  The anomalous ratio determined for Rho Oph is examined, and the galactic distribution
  of neutral hydrogen is evaluated. The following values are estimated for matter
  in the galactic plane within 500 pc of the sun: a total mean hydrogen space density
  of 1.15 atoms/cu cm, a mean H2 space density of 0.143 molecule/cu cm (possibly a
  lower limit), and a mean H I space density of 0.86 atom/cu cm (a possible overestimate).'
