abstract: Observations of the type II supernovae 1987F and 1988I are discussed. The
  overall optical spectroscopic properties of SN 1987F are shown to resemble those
  of type I Seyfert nuclei and quasars. The properties of SN 1987F are compared with
  the spectrum of 3C 48. Similar results are obtained for SN 1988I. It is suggested
  that if either of these supernovae had occurred in the nucleus of a normal galaxy,
  the nucleus would have been classified as a type 1 Seyfert, if the only data available
  were low-resolution optical spectra. Thus, it is concluded that some low-luminosity
  active galaxies might actually be due to violent bursts of star formation rather
  than accretion onto a supermassive black hole.
