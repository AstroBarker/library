abstract: The enhancement factor for the rate of thermonuclear reactions in dense
  stellar matter is calculated in the one-component, strongly coupled plasma model.
  The nuclear reaction rate is related to the short-range behavior of the quantum-mechanical
  pair correlation function. Within the range of parameters which is investigated
  here, the pair correlation function is expressed in terms of classical quantities,
  which are known from existing computer results; the classical potential of mean
  force is found to play an important role, from the practical point of view. Numerical
  results are given.
