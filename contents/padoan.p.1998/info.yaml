abstract: 'The dynamics of molecular clouds is characterized by supersonic random
  motions in the presence of a magnetic field. We study this situation using numerical
  solutions of the three-dimensional compressible magnetohydrodynamic (MHD) equations
  in a regime of highly supersonic random motions. The non-LTE radiative transfer
  calculations are performed through the complex density and velocity fields obtained
  as solutions of the MHD equations, and more than 5 \texttimes{} 105 spectra of 12CO,
  13CO, and CS are obtained. In this way we build synthetic molecular clouds of 5
  and 20 pc diameter, evolved for about one dynamical time from their initial configuration.
  We use a numerical flow without gravity or external forcing. The flow is super-Alfv{\''e}nic.  Synthetic
  data consist of sets of 90 \texttimes{} 90 synthetic spectra with 60 velocity channels,
  in five molecular transitions: J = 1 --> 0 and J = 2 --> 1 for 12CO and 13CO, and
  J = 1 --> 0 for CS. Although we do not consider the effects of stellar radiation,
  gravity, or mechanical energy input from discrete sources, our models do contain
  the basic physics of magnetofluid dynamics and non-LTE radiation transfer and are
  therefore more realistic than previous calculations. As a result, these synthetic
  maps and spectra bear a remarkable resemblance to the corresponding observations
  of real clouds.'
