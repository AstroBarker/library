abstract: We have imaged the X-ray binary SS 433 with unprecedented Fourier plane
  coverage at 6 cm using simultaneously the Very Long Baseline Array (VLBA), MERLIN,
  and the Very Large Array and also at 20 cm using the VLBA. At both wavelengths we
  have securely detected smooth, low surface brightness emission having the appearance
  of a ``ruff'' or collar attached perpendicularly to the well-studied knotty jets
  in this system and extending over at least a few hundred AU. We interpret this smooth
  emission as a windlike outflow from the binary and discuss its implications for
  the present evolutionary stage of this system.
