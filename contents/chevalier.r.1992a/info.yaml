abstract: An initial study aimed at elucidating the multidimensional aspects of the
  hydrodynamic instabilities in supernova remnants is presented. Self-similar solutions
  are found to exist for the interaction of a steep power-law density profile expanding
  into a relatively flat stationary power-law density profile. Consideration of the
  pressure and entropy profiles in the shocked 1D flows shows that the flows are subject
  to convective instability, by a local criterion. The growth rate for the instability
  becomes very large near the contact discontinuity between the two shocked regions.
  A linear analysis of the complete self-similar solutions shows that the solutions
  are unstable above a critical wavenumber and that the growth rate is greatest at
  the position of the contact discontinuity. The X-ray image of the remnant of SN
  1572 (Tycho) shows emission from clumps of supernova ejecta, which is good evidence
  for instabilities in this remnant.
