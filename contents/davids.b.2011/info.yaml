abstract: We present a Monte Carlo calculation of the astrophysical rate of the 15O(alpha,
  gamma)19Ne reaction based on an evaluation of published experimental data. By considering
  the likelihood distributions of individual resonance parameters derived from measurements,
  estimates of upper and lower limits on the reaction rate at the 99.73\% confidence
  level are derived in addition to the recommended, median value. These three reaction
  rates are used as input for three separate calculations of Type I X-ray bursts (XRBs)
  using spherically symmetric, hydrodynamic simulations of an accreting neutron star.
  In this way the influence of the 15O(alpha, gamma)19Ne reaction rate on the peak
  luminosity, recurrence time, and associated nucleosynthesis in models of Type I
  XRBs is studied. Contrary to previous findings, no substantial effect on any of
  these quantities is observed in a sequence of four bursts when varying the reaction
  rate between its lower and upper limits. Rather, the differences in these quantities
  are comparable to the burst-to-burst variations with a fixed reaction rate, indicating
  that uncertainties in the 15O(alpha, gamma)19Ne reaction rate do not strongly affect
  the predictions of this Type I XRB model.
