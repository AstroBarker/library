abstract: Nuclear reactions in accreting neutron-star crusts and the heat release
  accompanying them are studied, under different assumptions concerning the composition
  of the outermost layer formed of the ashes of X-ray bursts. Particular examples
  of ashes containing nuclides with A =~ 90-110 are considered and compared with a
  standard A=56 case. In all cases, evolution of a crust shell is followed from 108
  g cm-3 to a few times 1013 g cm-3. The total crustal heating produced in the non-equilibrium
  processes in the accreting crust is 1.1-1.5 MeV per one accreted nucleon. The composition
  of the accreted crust at densities exceeding the threshold for the pycnonuclear
  fusion (rho >1012 g cm-3) is essentially independent of the assumed initial composition
  of the X-ray burst ashes.
