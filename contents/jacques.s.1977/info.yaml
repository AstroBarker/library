abstract: The fluid equations for the solar wind are presented in a form which includes
  the momentum and energy flux of waves in a general and consistent way. The concept
  of conservation of wave action is introduced and is used to derive expressions for
  the wave energy density as a function of heliocentric distance. The explicit form
  of the terms due to waves in both the momentum and energy equations are given for
  radially propagating acoustic, Alfven, and fast mode waves. The effect of waves
  as a source of momentum is explored by examining the critical points of the momentum
  equation for isothermal spherically symmetric flow. We find that the principal effect
  of waves on the solutions is to bring the critical point closer to the sun's surface
  and to increase the Mach number at the critical point. When a simple model of dissipation
  is included for acoustic waves, in some cases there are multiple critical points.
