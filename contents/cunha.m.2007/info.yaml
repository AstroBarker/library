abstract: Asteroseismology provides us with a unique opportunity to improve our understanding
  of stellar structure and evolution. Recent developments, including the first systematic
  studies of solar-like pulsators, have boosted the impact of this field of research
  within astrophysics and have led to a significant increase in the size of the research
  community. In the present paper we start by reviewing the basic observational and
  theoretical properties of classical and solar-like pulsators and present results
  from some of the most recent and outstanding studies of these stars. We centre our
  review on those classes of pulsators for which interferometric studies are expected
  to provide a significant input. We discuss current limitations to asteroseismic
  studies, including difficulties in mode identification and in the accurate determination
  of global parameters of pulsating stars, and, after a brief review of those aspects
  of interferometry that are most relevant in this context, anticipate how interferometric
  observations may contribute to overcome these limitations. Moreover, we present
  results of recent pilot studies of pulsating stars involving both asteroseismic
  and interferometric constraints and look into the future, summarizing ongoing efforts
  concerning the development of future instruments and satellite missions which are
  expected to have an impact in this field of research.
