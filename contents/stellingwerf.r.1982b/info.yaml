abstract: Solutions to the problem of spherically symmetric and optically thin, X-ray
  heated accretion flow, obtained by relaxation techniques, show that heating effects
  can reduce the mass flux in luminous models with X-ray production efficiencies exceeding
  0.003 X (10 keV/epsilon(max)). The flow disrupts only when supercritical, implying
  (1) a luminosity limit for steady flow, and (2) that flows exceeding this limit
  will flare on time scales from seconds to months (X mass/solar mass), with shorter
  periods at higher luminosities. Models near this limit show stable, steady flow
  with a slight shell structure, and are found to have an alternate flaring mode if
  perturbed strongly enough. Models with efficiencies lower than 0.003 X (10 keV/epsilon(max))
  are not heated in the optically thin region, but may disrupt near the Schwartzschild
  radius if the accreting object is a black hole whose L/L(E) ratio is greater than
  its mass flux reduction efficiency.
