abstract: Using the 3.5-m Herschel Space Observatory, imaging photometry of Cas A
  has been obtained in six bands between 70 and 500 mum with the PACS and SPIRE instruments,
  with angular resolutions ranging from 6 to 37''. In the outer regions of the remnant
  the 70-mum PACS image resembles the 24-mum image Spitzer image, with the emission
  attributed to the same warm dust component, located in the reverse shock region.
  At longer wavelengths, the three SPIRE bands are increasingly dominated by emission
  from cold interstellar dust knots and filaments, particularly across the central,
  western and southern parts of the remnant. Nonthermal emission from the northern
  part of the remnant becomes prominent at 500 mum. We have estimated and subtracted
  the contributions from the nonthermal, warm dust and cold interstellar dust components.
  We confirm and resolve for the first time a cool (~35 K) dust component, emitting
  at 70-160 mum, that is located interior to the reverse shock region, with an estimated
  mass of 0.075 M\_\&sun;.  Herschel is an ESA space observatory with science instruments
  provided by European-led Principal Investigator consortia and with important participation
  from NASA.Figure 3 is only available in electronic form at http://www.aanda.org
