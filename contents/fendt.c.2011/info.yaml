abstract: In this paper, we present a detailed numerical investigation of the hypothesis
  that a rotation of astrophysical jets can be caused by magnetohydrodynamic (MHD)
  shocks in a helical magnetic field. Shock compression of the helical magnetic field
  results in a toroidal Lorentz force component that will accelerate the jet material
  in the toroidal direction. This process transforms magnetic angular momentum (magnetic
  stress) carried along the jet into kinetic angular momentum (rotation). The mechanism
  proposed here only works in a helical magnetic field configuration. We demonstrate
  the feasibility of this mechanism by axisymmetric MHD simulations in 1.5 and 2.5
  dimensions using the PLUTO code. In our setup, the jet is injected into the ambient
  gas with zero kinetic angular momentum (no rotation). We apply different dynamical
  parameters for jet propagation such as the jet internal Alfv{\'e}n Mach number and
  fast magnetosonic Mach number, the density contrast of the jet to the ambient medium,
  and the external sonic Mach number of the jet. The mechanism we suggest should work
  for a variety of jet applications, e.g., protostellar or extragalactic jets, and
  internal jet shocks (jet knots) or external shocks between the jet and the ambient
  gas (entrainment). For typical parameter values for protostellar jets, the numerically
  derived rotation feature looks consistent with the observations, i.e., rotational
  velocities of 0.1\%-1\% of the jet bulk velocity.
