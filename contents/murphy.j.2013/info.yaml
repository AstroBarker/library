abstract: Multi-dimensional instabilities have become an important ingredient in core-collapse
  supernova (CCSN) theory. Therefore, it is necessary to understand the driving mechanism
  of the dominant instability. We compare our parameterized three-dimensional CCSN
  simulations with other buoyancy-driven simulations and propose scaling relations
  for neutrino-driven convection. Through these comparisons, we infer that buoyancy-driven
  convection dominates post-shock turbulence in our simulations. In support of this
  inference, we present four major results. First, the convective fluxes and kinetic
  energies in the neutrino-heated region are consistent with expectations of buoyancy-driven
  convection. Second, the convective flux is positive where buoyancy actively drives
  convection, and the radial and tangential components of the kinetic energy are in
  rough equipartition (i.e., Kr ~ K theta + K phi). Both results are natural consequences
  of buoyancy-driven convection, and are commonly observed in simulations of convection.
  Third, buoyant driving is balanced by turbulent dissipation. Fourth, the convective
  luminosity and turbulent dissipation scale with the driving neutrino power. In all,
  these four results suggest that in neutrino-driven explosions, the multi-dimensional
  motions are consistent with neutrino-driven convection.
