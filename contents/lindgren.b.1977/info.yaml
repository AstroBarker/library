abstract: Se I resonance lines have been measured in absorption to an accuracy of
  a few milliangstroms by using the flash photolysis technique. As a result it was
  found that the 4p3nl levels and the ionization limit given by Morillon and Verges
  should be increased by 0.23 plus or minus 0.02 per cm. Calculated wavelengths are
  given for Se I lines which may be searched for in the solar spectrum in order to
  find selenium in the sun.
