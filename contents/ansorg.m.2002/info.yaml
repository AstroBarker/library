abstract: A new spectral code for constructing general-relativistic models of rapidly
  rotating stars with an unprecedented accuracy is presented. As a first application,
  we reexamine uniformly rotating homogeneous stars and compare our results with those
  obtained by several previous codes. Moreover, representative relativistic examples
  corresponding to highly flattened rotating bodies are given.
