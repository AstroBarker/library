abstract: Statistical observations of the epoch of reionization (EOR) power spectrum
  provide a rich data set for understanding the transition from the cosmic ``dark
  ages'' to the ionized universe we see today. EOR observations have become an active
  area of experimental cosmology, and three first-generation observatories-MWA, PAST,
  and LOFAR-are currently under development. In this paper we provide the first quantitative
  calculation of the three-dimensional power spectrum sensitivity, incorporating the
  design parameters of a planned array. This calculation is then used to explore the
  constraints these first-generation observations can place on the EOR power spectrum.
  The results demonstrate the potential for upcoming power spectrum observations to
  constrain theories of structure formation and reionization.
