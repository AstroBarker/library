abstract: 'We present a photometric and spectroscopic study of the white dwarf (WD)
  population of the populous, intermediate-age open cluster M35 (NGC 2168); this study
  expands upon our previous study of the WDs in this cluster. We spectroscopically
  confirm 14 WDs in the field of the cluster: 12 DAs, 1 hot DQ, and 1 DB star. For
  each DA, we determine the WD mass and cooling age, from which we derive each star''s
  progenitor mass. These data are then added to the empirical initial-final mass relation
  (IFMR), where the M35 WDs contribute significantly to the high-mass end of the relation.
  The resulting points are consistent with previously published linear fits to the
  IFMR, modulo moderate systematics introduced by the uncertainty in the star cluster
  age. Based on this cluster alone, the observational lower limit on the maximum mass
  of WD progenitors is found to be ~5.1 M sun - 5.2 M sun at the 95\% confidence level;
  including data from other young open clusters raises this limit to as high as 7.1
  M sun, depending on the cluster membership of three massive WDs and the core composition
  of the most massive WDs. We find that the apparent distance modulus and extinction
  derived solely from the cluster WDs ((m - M) V  = 10.45 $\pm$ 0.08 and E(B-V) =
  0.185 \$\pm\$ 0.010, respectively) is fully consistent with that derived from main-sequence
  fitting techniques. Four M35 WDs may be massive enough to have oxygen-neon cores;
  the assumed core composition does not significantly affect the empirical IFMR. Finally,
  the two non-DA WDs in M35 are photometrically consistent with cluster membership;
  further analysis is required to determine their memberships.  Some of the data presented
  herein were obtained at the W.M. Keck Observatory, which is operated as a scientific
  partnership among the California Institute of Technology, the University of California
  and the National Aeronautics and Space Administration. The Observatory was made
  possible by the generous financial support of the W.M. Keck Foundation.'
