abstract: 'Aims:This paper presents 452 new 21-cm neutral hydrogen line measurements
  carried out with the FORT receiver of the meridian transit Nan{\c c}ay radiotelescope
  (NRT) in the period April 2003-March 2005. Methods:  This observational programme
  is part of a larger project aiming at an exhaustive and magnitude-complete HI extragalactic
  catalogue for Tully-Fisher applications (the so-called KLUN project, for Kinematics
  of the Local Universe studies, to end in 2008). The whole on-line HI archive of
  the NRT today contains reduced HI-profiles for 4500 spiral galaxies of declination
  delta > -40$\,^{\circ}$ (http://klun.obs-nancay.fr).  Results: As an example of
  this application, we used the direct Tully-Fisher relation in three (JHK) bands
  in deriving distances to a large catalogue of 3126 spiral galaxies distributed through
  the whole sky and sampling the radial velocity range well between 0 and 8000 km
  s-1. Thanks to an iterative method accounting for selection bias and smoothing effects,
  we show a detailed and original map of the velocity field in the Local Universe
  as a preliminary output.  Data Tables [see full text], [see full text], and [see
  full text] and HI-profiles (Fig. [see full text]) are only available in electronic
  form at the CDS via anonymous ftp to cdsarc.u-strasbg.fr (130.79.128.5) or via http://cdsweb.u-strasbg.fr/cgi-bin/qcat?J/465/71'
