abstract: We use two-dimensional stellar models and a two-dimensional finite difference
  integration of the linearized pulsation equations to calculate nonradial oscillations.
  This approach allows us to directly calculate the pulsation modes for a distorted
  rotating star without treating the rotation as a perturbation. We are also able
  to express the finite difference solution in the horizontal direction as a sum of
  multiple spherical harmonics for any given mode. Using these methods, we have investigated
  the effects of increasing rotation and the number of spherical harmonics on the
  calculated eigenfrequencies and eigenfunctions and compared the results to perturbation
  theory. We use 10 M\&sun; models with velocities ranging from 0 to 420 km s-1 (0.89Omegac)
  and examine low-order p-modes. We find that one spherical harmonic remains reasonable
  up to a rotation rate around 300 km s-1 (0.69Omegac) for the radial fundamental
  mode, but can fail at rotation rates as low as 90 km s-1 (0.23Omegac) for the l
  = 2 p2 mode, based on the eigenfrequencies alone. Depending on the mode in question,
  a single spherical harmonic may fail at lower rotation rates if the shape of the
  eigenfunction is taken into consideration. Perturbation theory, in contrast, remains
  valid up to relatively high rotation rates for most modes. We find the lowest failure
  surface equatorial velocity is 120 km s-1 (0.30Omegac) for the l = 2 p2 mode, but
  failure velocities between 240 and 300 km s-1 (0.58Omegac-0.69Omegac) are more typical.
