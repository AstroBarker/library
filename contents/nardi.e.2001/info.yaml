abstract: A convincing explanation for the observed pulsar large peculiar velocities
  is still missing. We argue that any viable particle physics solution would most
  likely involve the resonant production of a noninteracting neutrino nus of mass
  mnus~20-50 keV. We propose a model where anisotropic magnetic field configurations
  strongly bias the resonant spin flavor precession of tau antineutrinos into nus.
  For internal magnetic fields Bint>~1015 G, a nutau-nus transition magnetic moment
  of the order of 10-12 Bohr magnetons is required. The asymmetric emission of nus
  from the core can produce sizable natal kicks and account for recoil velocities
  of several hundred kilometers per second.
