abstract: 'Context: Higher resolution telescopes as well as 3D numerical simulations
  will require the development of detailed 3D radiative transfer calculations. Building
  upon our previous work we extend our method to include both continuum and line transfer.  Aims:
  We present a general method to calculate radiative transfer including scattering
  in the continuum as well as in lines in 3D static atmospheres.   Methods: The scattering
  problem for line transfer is solved via means of an operator splitting (OS) technique.
  The formal solution is based on a long-characteristics method. The approximate Lambda
  operator is constructed considering nearest neighbors exactly. The code is parallelized
  over both wavelength and solid angle using the MPI library. Results: We present
  the results of several test cases with different values of the thermalization parameter
  and two choices for the temperature structure. The results are directly compared
  to 1D spherical tests. With our current grid setup the interior resolution is much
  lower in 3D than in 1D, nevertheless the 3D results agree very well with the well-tested
  1D calculations. We show that, with relatively simple parallelization, the code
  scales to very large number of processors which is mandatory for practical applications.   Conclusions:
  Advances in modern computers will make realistic 3D radiative transfer calculations
  possible in the near future. Our current code scales to very large numbers of processors,
  but requires larger memory per processor at high spatial resolution.'
