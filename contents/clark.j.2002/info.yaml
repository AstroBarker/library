abstract: We present the results of a detailed non-LTE analysis of the ultraviolet
  and optical spectrum of the O6.5 Iaf+ star HD 153919 - the mass donor in the high-mass
  X-ray binary 4U1700-37. We find that the star has a luminosity log(L\textasteriskcentered/Lsun)=5.82
  +/- 0.07, T\_eff=35 000 +/- 1000 K, radius R\textasteriskcentered=21.9+1.3-0.5 Rsun,
  mass-loss rate dot {M}=9.5x 10-6 Msun yr-1, and a significant overabundance of nitrogen
  (and possibly carbon) relative to solar values. Given the eclipsing nature of the
  system these results allow us to determine the most likely masses of both components
  of the binary via Monte Carlo simulations. These suggest a mass for HD 153919 of
  M\textasteriskcentered = 58 +/- 11 Msun - implying the initial mass of the companion
  was rather high (ga 60 Msun). The most likely mass for the compact companion is
  found to be M\_x =2.44+/- 0.27 Msun, with only 3.5 per cent of the trials resulting
  in a mass less than 2.0 Msun and none less than 1.65 Msun. Such a value is significantly
  in excess of the upper observational limit to the masses of neutron stars of 1.45
  Msun found by Thorsett \& Chakrabarthy (\cite{thorsett}), although a mass of 1.86
  Msun has recently been reported for the Vela X-1 pulsar (Barziv et al. \cite{barziv}).
  Our observational data is inconsistent with the canonical neutron star mass and
  the lowest black hole mass observed (ga 4.4 Msun; Nova Vel). Significantly changing
  observational parameters can force the compact object mass into either of these
  regimes but, given the strong proportionality between M\textasteriskcentered and
  M\_x, the O-star mass changes by factors of greater than 2, well beyond the limits
  determined from its evolutionary state and surface gravity. The low mass of the
  compact object implies that it is difficult to form high mass black holes through
  both the Case A \& B mass transfer channels and, if the compact object is a neutron
  star, would significantly constrain the high density nuclear equation of state.
  Based on observations collected at the European Southern Observatory, La Silla,
  Chile (64.H-0224).
