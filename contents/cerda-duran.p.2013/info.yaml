abstract: We present general relativistic numerical simulations of collapsing stellar
  cores. Our initial model consists of a low metallicity rapidly-rotating progenitor
  which is evolved in axisymmetry with the latest version of our general relativistic
  code CoCoNuT, which allows for black hole formation and includes the effects of
  a microphysical equation of state (LS220) and a neutrino leakage scheme to account
  for radiative losses. The motivation of our study is to analyze in detail the emission
  of gravitational waves in the collapsar scenario of long gamma-ray bursts. Our simulations
  show that the phase during which the proto-neutron star (PNS) survives before ultimately
  collapsing to a black hole is particularly optimal for gravitational wave emission.
  The high-amplitude waves last for several seconds and show a remarkable quasi-periodicity
  associated with the violent PNS dynamics, namely during the episodes of convection
  and the subsequent nonlinear development of the standing-accretion shock instability
  (SASI). By analyzing the spectrogram of our simulations we are able to identify
  the frequencies associated with the presence of g-modes and with the SASI motions
  at the PNS surface. We note that the gravitational waves emitted reach large enough
  amplitudes to be detected with third-generation detectors such as the Einstein Telescope
  within a Virgo Cluster volume at rates <~ 0.1 yr-1.
