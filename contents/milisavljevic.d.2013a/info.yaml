abstract: We present X-ray, UV/optical, and radio observations of the stripped-envelope,
  core-collapse supernova (SN) 2011ei, one of the least luminous SNe IIb or Ib observed
  to date. Our observations begin with a discovery within ~1 day of explosion and
  span several months afterward. Early optical spectra exhibit broad, Type II-like
  hydrogen Balmer profiles that subside rapidly and are replaced by Type Ib-like He-rich
  features on a timescale of one week. High-cadence monitoring of this transition
  suggests absorption attributable to a high-velocity (gsim 12, 000 km s-1) H-rich
  shell, which is likely present in many Type Ib events. Radio observations imply
  a shock velocity of v \approx{} 0.13 c and a progenitor star average mass-loss rate
  of \dot{M}\approx{} 1.4 \texttimes{} 10^{-5} M\_{\&sun;} yr^{-1} (assuming wind
  velocity vw = 103 km s-1). This is consistent with independent constraints from
  deep X-ray observations with Swift-XRT and Chandra. Overall, the multi-wavelength
  properties of SN 2011ei are consistent with the explosion of a lower-mass (3-4 M
  \&sun;), compact (R \textasteriskcentered <~ 1 \texttimes{} 1011 cm), He-core star.
  The star retained a thin hydrogen envelope at the time of explosion, and was embedded
  in an inhomogeneous circumstellar wind suggestive of modest episodic mass loss.
  We conclude that SN 2011ei's rapid spectral metamorphosis is indicative of time-dependent
  classifications that bias estimates of the relative explosion rates for Type IIb
  and Ib objects, and that important information about a progenitor star's evolutionary
  state and mass loss immediately prior to SN explosion can be inferred from timely
  multi-wavelength observations.
