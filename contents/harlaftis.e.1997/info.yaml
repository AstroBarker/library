abstract: We have reanalyzed Keck observations of Nova Oph 1977 to extend the work
  done by Filippenko et al. (1997), who recently determined a mass function f(M\_x)
  = 4.86 +/- 0.13 Msun for the compact object. We constrain the rotational broadening,
  upsilon sin i <= 79 km s(-1) , at the 90\% confidence level, which gives a mass
  ratio q <= 0.053. The K-type companion star of Nova Oph 1977 contributes 28-37\%
  of the light at red wavelengths. The abnormal Li 1 lambda 6708 absorption line from
  the companion star is not detected (EW < 0.12 Angstroms), in contrast to four other
  X-ray binaries. An Halpha Doppler image of the system shows emission from the companion
  star in addition to the accretion disk.
