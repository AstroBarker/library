abstract: We discuss implications of recent precision measurements for the 93Rh proton
  separation energy for the production of the lightest molybdenum isotopes in proton-rich
  Type II supernova (SN II) ejecta. It has recently been shown that a novel neutrino-induced
  process makes these ejecta a promising site for the production of the light molybdenum
  isotopes and other "p-nuclei" with atomic mass near 100. The origin of these isotopes
  has long been uncertain. A distinguishing feature of nucleosynthesis in neutrino-irradiated
  outflows is that the relative production of 92Mo and 94Mo is set by a competition
  governed by the proton separation energy of 93Rh. We use the detailed nuclear network
  calculations and the recent experimental results for this proton separation energy
  to place constraints on the outflow characteristics that produce the lightest molybdenum
  isotopes in their solar proportions. It is found that for the conditions calculated
  in recent two-dimensional SN simulations, and also for a large range of outflow
  characteristics around these conditions, the solar ratio of 92Mo to 94Mo cannot
  be achieved. This suggests that either proton-rich winds from SNe II do not exclusively
  produce both isotopes, or that these winds are qualitatively different than calculated
  in today's SN models.
