abstract: The first results of a search for high energy neutrinos in excess of the
  atmospheric neutrino background, both from any sky direction and from 26 known sources,
  using 9 strings of IceCube are presented. We summarize also the results of AMANDA-II
  from 2000 to 2006. The expected performance of future configurations of the growing
  IceCube detector are discussed.
