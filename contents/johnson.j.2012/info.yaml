abstract: The collapse of baryons into extremely massive stars with masses gsim104
  M \&sun; in a small fraction of protogalaxies at z >~ 10 is a promising candidate
  for the origin of supermassive black holes (SMBHs), some of which grow to a billion
  solar masses by z ~ 7. We determine the maximum masses such stars can attain by
  accreting primordial gas. We find that at relatively low accretion rates the strong
  ionizing radiation of these stars limits their masses to M \textasteriskcentered
  ~ 103 M \&sun; (\dot{M}\_acc/10-3 M \&sun; yr-1)8/7, where \dot{M}\_acc is the rate
  at which the star gains mass. However, at the higher central infall rates usually
  found in numerical simulations of protogalactic collapse (gsim0.1 M \&sun; yr-1),
  the lifetime of the star instead limits its final mass to ~106 M \&sun;. Furthermore,
  for the spherical accretion rates at which the star can grow, its ionizing radiation
  is confined deep within the protogalaxy, so the evolution of the star is decoupled
  from that of its host galaxy. Lyalpha emission from the surrounding H II region
  is trapped in these heavy accretion flows and likely reprocessed into strong Balmer
  series emission, which may be observable by the James Webb Space Telescope. This,
  strong He II lambda1640, and continuum emission are likely to be the key observational
  signatures of the progenitors of SMBHs at high redshift.
