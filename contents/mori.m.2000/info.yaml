abstract: Many clusters of galaxies contain an appreciable amount of hot gas, the
  intracluster medium. As a consequence, gas will be stripped from galaxies that move
  through the inter cluster medium, if the ram pressure exceeds the internal gravitational
  force. We study the interaction between the intracluster medium and an extended
  gas component of dwarf galaxies confined by a surrounding cold dark matter halo
  analytically and numerically, using axisymmetric two-dimensional hydrodynamical
  simulations at high resolution. The results show that the gas within the dark matter
  halo is totally stripped in a typical galactic cluster. The process of ram pressure
  stripping therefore must have played an important role during the chemodynamical
  evolution of dwarf galaxies in galactic clusters. Our results predict that most
  of the chemical evolution of dwarf galaxies must have occurred at high redshift,
  before the virialized cluster had formed.
