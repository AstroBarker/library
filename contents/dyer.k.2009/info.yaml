abstract: We present interferometric+single-dish images, constructed from the Green
  Bank Telescope (GBT) and VLA observations, of the supernova remnant SN 1006. The
  image was created using a Multiscale CLEAN algorithm in conjunction with a novel
  approach for correcting the effect of the non-coplanar baselines. We demonstrate
  that integrating with a single dish to the confusion limit of the highest resolution
  interferometric element is not required. Instead, the noise in the map is limited
  by the signal-to-noise ratio in each observation. The noise in the combined map
  at the full resolution is dominated by uncertainties in the VLA data, not by uncertainties
  in our short GBT observation. The resulting image is a significant improvement over
  images missing short spacing information, and paves the way for future joint GBT+VLA
  proposals that need to accurately image objects ranging from galaxies to H II regions.
