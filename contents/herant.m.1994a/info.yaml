abstract: Shock propagation, mixing, and clumping are studied in the explosion of
  red supergiants as Type II supernovae using a two-dimensional smooth particle hydrodynamic
  (SPH) code. We show that extensive Rayleigh-Talor instabilities develop in the ejecta
  in the wake of the reverse shock wave. In all cases, the shell structure of the
  progenitor is obliterated to leave a clumpy, well-mixed supernova remnant. However,
  the occurrence of mass loss during the lifetime of the progenitor can significantly
  reduce the amount of mixing. These results are independent of the Type II supernova
  explosion mechanism.
