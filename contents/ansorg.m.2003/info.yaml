abstract: We give a detailed description of the recently developed multi-domain spectral
  method for constructing highly accurate general-relativistic models of rapidly rotating
  stars. For both ``ordinary'' and ``critical'' configurations, we show using representative
  examples, how the accuracy improves as the order of the approximation increases.
  As well as homogeneous fluid bodies, we also discuss models of polytropic and strange
  stars.
