abstract: Burstein and Heiles (1978) have reported the discovery of a new and potentially
  accurate method for predicting line-of-sight reddening in the galaxy. The present
  investigation is concerned with an assessment of the accuracy of this method, taking
  into account a comparison of its reddening predictions to those of two independent
  and highly accurate methods, including the uvby-beta photometry of early-type stars
  and the strong absorption line-strength-color relationship for the integrated spectra
  of elliptical galaxies. On the basis of the results of the investigation, it is
  concluded that a reasonable estimate of the relative accuracy of the H I/galaxy
  counts method reported by Burstein and Heiles is 0.01 mag in E(B-V) or 10\% of the
  reddening, whichever is larger.
