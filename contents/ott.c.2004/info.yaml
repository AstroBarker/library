abstract: We have carried out an extensive set of two-dimensional, axisymmetric, purely
  hydrodynamic calculations of rotational stellar core collapse with a realistic,
  finite-temperature nuclear equation of state and realistic massive star progenitor
  models. For each of the total number of 72 different simulations we performed, the
  gravitational wave signature was extracted via the quadrupole formula in the slow-motion,
  weak-field approximation. We investigate the consequences of variation in the initial
  ratio of rotational kinetic energy to gravitational potential energy and in the
  initial degree of differential rotation. Furthermore, we include in our model suite
  progenitors from recent evolutionary calculations that take into account the effects
  of rotation and magnetic torques. For each model, we calculate gravitational radiation
  waveforms, characteristic wave strain spectra, energy spectra, final rotational
  profiles, and total radiated energy. In addition, we compare our model signals with
  the anticipated sensitivities of the first- and second-generation LIGO detectors
  coming on line. We find that most of our models are detectable by LIGO from anywhere
  in the Milky Way.
