abstract: In this review we discuss some observational aspects and theoretical models
  of astrophysical collisionless shocks in partly ionized plasma with the presence
  of non-thermal components. A specific feature of fast strong collisionless shocks
  is their ability to accelerate energetic particles that can modify the shock upstream
  flow and form the shock precursors. We discuss the effects of energetic particle
  acceleration and associated magnetic field amplification and decay in the extended
  shock precursors on the line and continuum multi-wavelength emission spectra of
  the shocks. Both Balmer-type and radiative astrophysical shocks are discussed in
  connection to supernova remnants interacting with partially neutral clouds. Quantitative
  models described in the review predict a number of observable line-like emission
  features that can be used to reveal the physical state of the matter in the shock
  precursors and the character of nonthermal processes in the shocks. Implications
  of recent progress of gamma-ray observations of supernova remnants in molecular
  clouds are highlighted.
