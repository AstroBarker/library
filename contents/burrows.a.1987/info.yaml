abstract: Results from a study of the effects of convection on the early life of a
  neutron star and the mechanism of type II supernovae are presented. It is found
  that entropy-driven convection can enhance the neutrino luminosities in the quasi-static
  postcollapse stage of the core of a massive star by at times an order of magnitude.
  Furthermore, the neutrinospheric temperatures and, hence, the energy of the emitted
  neutrinos are increased by up to about 50 percent. These effects significantly strengthen
  the energy coupling between the core and the envelope. If these results are confirmed,
  convection must play a significant, perhaps pivotal, role in the long-term mechanism
  for type II supernovae.
