abstract: Type Iax supernovae are stellar explosions that are spectroscopically similar
  to some type Ia supernovae at the time of maximum light emission, except with lower
  ejecta velocities. They are also distinguished by lower luminosities. At late times,
  their spectroscopic properties diverge from those of other supernovae, but their
  composition (dominated by iron-group and intermediate-mass elements) suggests a
  physical connection to normal type Ia supernovae. Supernovae of type Iax are not
  rare; they occur at a rate between 5 and 30 per cent of the normal type Ia rate.
  The leading models for type Iax supernovae are thermonuclear explosions of accreting
  carbon-oxygen white dwarfs that do not completely unbind the star, implying that
  they are `less successful' versions of normal type Ia supernovae, where complete
  stellar disruption is observed. Here we report the detection of the luminous, blue
  progenitor system of the type Iax SN 2012Z in deep pre-explosion imaging. The progenitor
  system's luminosity, colours, environment and similarity to the progenitor of the
  Galactic helium nova V445 Puppis suggest that SN 2012Z was the explosion of a white
  dwarf accreting material from a helium-star companion. Observations over the next
  few years, after SN 2012Z has faded, will either confirm this hypothesis or perhaps
  show that this supernova was actually the explosive death of a massive star.
