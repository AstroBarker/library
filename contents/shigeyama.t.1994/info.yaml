abstract: The observed feature of the light curve of SN 1993J, which has two maxima,
  are shown to be well reproduced by the explosion of red supergiants if its H/He
  envelope mass has been decreased below about 0.9 solar mass. The first maximum of
  the light curve is due to shock heating of the thin envelope, while the second maximum
  is due to the radioactive decay of Co-56. From the date of the second maximum, the
  progenitor's main-sequence mass is estimated to be about 12-15 solar mass. The thin
  envelope is likely to be the result of a close binary evolution. The mass of Ni-56
  synthesized in SN 1993J is about 0.08 solar mass. The light curve properties, in
  particular, the date of the minimum, and the decline rate of the tail suggest that
  substantial Ni-56 was mixed into helium layers as has been predicted for Type Ib/Ic
  supernovae. We also calculate the light curves of line gamma-rays as well as the
  spectral evolution of hard X-rays resulting from the Ni-56 (-) Co-56 decays and
  discuss the possiblity of observing hard radiation with the Compton Gamma-Ray Observatory.
  We show that hard X-rays from the pulsar can be observed with ASCA in about 3 years
  if the pulsar luminosity is as high as the Crab Nebula.
