abstract: The existence of a weak galactic magnetic field has been repeatedly confirmed
  by observational data. The origin of this field has not been explained as yet in
  a fully satisfactory way and represents one of the main challenges of the astrophysical
  dynamo theory. In both the galactic dynamo theory and the primordial-origin theory,
  a major influence is exerted by the small-scale magnetic fluctuations. This article
  is devoted to constructing a systematic second-order statistical theory of such
  small-scale fields. The statistics of these fields are studied in the kinematic
  approximation and for the case of large Prandtl numbers, which is relevant for the
  galactic and protogalactic plasma. The advecting velocity field is assumed to be
  Gaussian and short-time correlated. Theoretical understanding of this kinematic
  dynamo model is a necessary prerequisite for any prospective nonlinear dynamo theory.
  The theory is developed for an arbitrary degree of compressibility and formally
  in d dimensions, which generalizes the previously known results, elicits the structure
  of the solutions, and uncovers a number of new effects. The magnetic energy spectra
  are studied as they grow and spread over scales during the initial stage of the
  field amplification. Exact Green's function solutions are obtained. The spectral
  theory is supplemented by the study of magnetic field correlation functions in the
  configuration space, where the dynamo problem can be mapped onto a particular one-dimensional
  quantum-mechanical problem. The latter approach is most suitable for the description
  of the kinematic dynamo in the long-time limit, i.e., when the magnetic excitation
  has spread over all scales present in the system. A simple way of calculating the
  growth rates of the magnetic fields in this long-time limit is proposed.
