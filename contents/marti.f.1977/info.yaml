abstract: Radiative transfer and resonance-line formation in expanding, decelerating
  stellar atmospheres are analyzed in the supersonic approximation, taking spherical
  geometry into account and assuming complete redistribution over the line profile
  in the fluid frame. The influence of interlayer radiative coupling is investigated,
  and cases where the 'disconnected approximation' of Kuan and Kuhi (1975) applies
  are identified. The radiation force on the atmospheric material is evaluated, the
  applicability of decelerating atmospheres to real stars is discussed, and the effect
  of the disconnected approximation is tested by using a program to turn the interlayer
  radiative coupling on and off at will. Numerical results are presented which show
  that the value of the source function is not very sensitive to the disconnected
  approximation except at large radii and that the line profile is very sensitive
  to the outer cutoff radius. Some cases of accelerating, infalling matter are also
  considered.
