abstract: Diffusion settling of elements heavier then helium in the solar interior
  is considered using a multi-component hydrodynamic description. The multi-component
  description includes thermal diffusion in a self-consistent way and introduces corrections
  due to partial ionization using the mean charge of the elements. The interaction
  between elements and the radiation field affects the diffusion settling rate. Taking
  into account partial ionization in the radiative zone appreciably increases the
  settling rates of elements heavier than neon, especially iron. Interaction with
  the radiation field opposes the pressure diffusion; this effect is appreciable only
  for partially ionized heavy ions. The description can also be used to study effects
  of the next smallest order, and the obtained chemical composition profiles can be
  applied to the construction of precise solar models.
