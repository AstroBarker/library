abstract: 'Aims: We study the effects of local environmental conditions affecting
  the diffuse interstellar band (DIB) carriers within the Upper Scorpius subgroup
  of the Sco OB2 association. The aim is to reveal how the still unidentified DIB
  carriers respond to different physical conditions prevailing in interstellar clouds,
  in order to shed light on the origin of the DIB carriers.  Methods: We obtained
  optical spectra with FEROS on the ESO 1.52 m telescope at La Silla, Chile, and measured
  the equivalent widths of five DIBs (at 5780, 5797, 6196, 6379, and 6613 {\AA}) as
  well as those of absorption lines of di-atomic molecules (CH, CH+, CN) and atoms
  (K i, Ca i) towards 89 targets in the direction of Upper Scorpius. We construct
  a simple radiative transfer and chemical network model of the diffuse interstellar
  medium (ISM) sheet in front of Upp Sco to infer the effective radiation field.  Results:
  By measuring the DIB and molecular spectrum of diffuse clouds towards 89 sightlines
  in the Upper Scorpius region, we have obtained a valuable statistical dataset that
  provides information on the physical conditions that influence the band strengths
  of the DIBs. Both the interstellar radiation field strength, IUV, and the molecular
  hydrogen fraction, fH2, have been derived for 55 sightlines probing the Upp Sco
  ISM. We discuss the relations between DIB strengths, CH and CH+ line strengths,
  E(B-V), IUV, and fH2. The ratio between the 5780 and 5797 {\AA} DIBs reveals a (spatial)
  dependence on the local environment in terms of cloud density and exposure to the
  interstellar radiation field, reflecting the molecular nature of these DIB carriers.  Based
  on observations collected at the European Southern Observatory, Paranal, Chile (ESO
  program 63.H-0456).Tables 1, 2, and 5, and Appendices are available in electronic
  form at http://www.aanda.org'
