abstract: New observations are presented of the radio supernova SN 1979 C made with
  the VLA at wavelengths of 20, 6, and 2 cm from March 1985 through December 1990,
  augmenting previous observations which began only 8 days after optical maximum in
  April 1979 and exended through November, 1984. It is found that the 'mini-shell'
  model of Chevalier (1984) still provides the best representation of these more complete
  light curves at all three wavelengths. Shorter period fluctuations in the observations
  are real and are probably due to emission efficiency variations caused by structure
  in the presupernova stellar wind density. Evidence is also found for more than 1
  solar mass lost from the progenitor star in the presupernova stellar wind. This
  suggests that the star's mass was originally not less than 13 solar masses. These
  observations represent the longest and most complete data set available for the
  emission from any supernova in any wavelength band.
