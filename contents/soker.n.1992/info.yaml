abstract: The possibility is studied that during its transition from the AGB to the
  central star of a PN, a rotating star blows a collimated wind along the symmetry
  axis. The wind results from the deformation of the stellar surface due to fast rotation.
  Evolutionary calculations using a spherical stellar model are used to argue that
  an essential ingredient in the proposed scenario is that the evolving star is in
  a common envelope with a lower mass companion which spins up the envelope.
