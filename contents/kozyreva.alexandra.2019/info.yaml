abstract: 'In the present study, we systematically explore the effect of the         radioactive
  $^{56}$Ni and its mixing properties in the ejecta on         the plateau of Type
  IIP supernovae (SNe IIP). We evaluate the         importance of \$^{56}\$Ni in shaping
  light curves of SNe IIP by         simulating light curves for two red supergiant
  models using         different amounts of \$^{56}\$Ni and with different types of         mixing:
  uniform distribution of \$^{56}\$Ni out to different         fractions of the envelope
  and `boxcar'' distribution of         \$^{56}\$Ni. We find, similarly to previous
  studies, that         \$^{56}\$Ni extends duration of the plateau. We find a formula
  to         estimate the extension based on the observed bolometric light         curves
  and show that for most SNe IIP \$^{56}\$Ni extends the         plateau by about
  20 per cent. Another effect of \$^{56}\$Ni         consists in reduction of the
  plateau decline rate, i.e.         \$^{56}\$Ni presented in the ejecta flattens
  the plateau. Our         simulations suggest that for typical SNe IIP it can reduce
  the         decline rate by about 1 mag per 100 d. We find that for the         contribution
  of \$^{56}\$Ni seen in most supernovae (SNe) our         simulated bolometric light
  curves resemble observed ones for         various types of \$^{56}\$Ni mixing. We
  thereby cannot determine         the level of \$^{56}\$Ni mixing in these SNe based
  on the light         curve alone. However, for SN 2009ib we find that only a model         where
  \$^{56}\$Ni is mixed significantly throughout most of the         hydrogen envelope
  is consistent with the observed light curve.         Our light curves are available
  via link https://wwwmpa.mpa-         garching.mpg.de/ccsnarchive/data/Kozyreva2018/'
