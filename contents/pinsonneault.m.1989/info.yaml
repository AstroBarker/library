abstract: 'A new rotating stellar evolution code is developed and applied to the sun.
  A hydrostatic fully convective premain-sequence model is evolved to the age of the
  sun. As the model evolves, it accounts for angular-momentum loss via a magnetic
  wind and angular-momentum redistribution by rotationally induced instabilities.
  The resulting models have an oblateness in agreement with observed upper limits.
  The rotation curves show two main features: the outer layers exhibit minimal radial
  differential rotation, and a rapidly rotating central core is preserved. These basic
  features persist through a wide range of model parameters.'
