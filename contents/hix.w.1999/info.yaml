abstract: Having examined the application of quasi-equilibrium to hydrostatic silicon
  burning in Paper I of this series, we now turn our attention to explosive silicon
  burning. Previous authors have shown that for material that is heated to high temperature
  by a passing shock and then cooled by adiabatic expansion, the results can be divided
  into three broad categories, incomplete burning, normal freezeout, and alpha-rich
  freezeout, with the outcome depending on the temperature, density, and cooling timescale.
  In all three cases, we find that the important abundances obey quasi-equilibrium
  for temperatures greater than approximately 3\texttimes{}109 K, with relatively
  little nucleosynthesis occurring following the breakdown of quasi-equilibrium. We
  will show that quasi-equilibrium provides better abundance estimates than global
  nuclear statistical equilibrium, even for normal freezeout, and particularly for
  alpha-rich freezeout. We will also examine the accuracy with which the final nuclear
  abundances can be estimated from quasi-equilibrium.
