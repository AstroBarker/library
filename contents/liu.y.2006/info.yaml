abstract: We report on large scale ab initio calculation for the 4s21S0-4s4p1,3P0,1,2
  transitions in the zinc-like sequence, using the multiconfiguration Dirac-Fock (MCDF)
  method. Our attention is focused on the spin-forbidden transition 4s21S0-4s4p3P1
  and the hyperfine-induced (HPF) transition 4s21S0-4s4p3P0 for ions between Z = 30
  (Zn) and Z = 47 (Ag). Our results provide a base for settling the existing conflicts
  in previous experimental and theoretical data for these transitions. We also report
  on rates of forbidden lines within the 4s4p3P term and between this term and the
  ground state. Accurate values for the hyperfine constants, showing excellent agreement
  with experimental values where available, are also given. We also give transition
  energies and lifetimes for the 4s21S0-4s4p1P1 resonance line.  Work supported by
  the NSFC under contract number 10434050.
