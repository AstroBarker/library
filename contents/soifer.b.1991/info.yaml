abstract: The 60-micron selected IRAS Bright Galaxy Sample is used as a starting point
  to derive additional complete flux-limited samples of extragalactic objects at 12,
  25, and 100 microns. With these complete samples the luminosity functions at all
  IRAS wavelengths are derived for the local universe. These luminosity functions
  are used to determine the infrared emission of the local universe. The maximum in
  the energy output of galaxies occurs at 100 microns. The infrared emission of galaxies
  at 12 and 25 micron represents about 30 percent of the total infrared luminosity
  in the local universe. The mean infrared colors of infrared selected galaxies vary
  systematically with infrared luminosity; the ratio Snu (60 microns)/Snu(100 microns)
  increases and Snu(12 microns)/Snu(25 microns) decreases with increasing infrared
  luminosity.
