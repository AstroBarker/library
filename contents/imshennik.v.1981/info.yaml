abstract: It is assumed that a compact structure of a low-mass TYPE I presupernovae
  is an essential feature of the hydrodynamical problem dealing with the supernova
  Type I (SNI) envelope outbursts. This structure is characterized by a degenerate
  carbon-oxygen core, which suffers a thermonuclear explosion of carbon fuel, and
  by a compact low-mass envelope having an external radius of approximately 10 to
  the 9th cm. The parameters of this hydrostatic envelope are specified and then,
  for a relatively small explosion energy (2-10 x 10 to 49th erg) the hydrodynamic
  problem of the envelope ejection is solved numerically. It is noted that this energy
  comes from neutrino-induced detonative carbon burning. The resulting structure of
  the SNI atmosphere expanding with the velocity gradient can be used for an interpretation
  of the observed SNI spectra.
