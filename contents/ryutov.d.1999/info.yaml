abstract: The conditions for validity and the limitations of experiments intended
  to simulate astrophysical hydrodynamics are discussed, with application to some
  ongoing experiments. For systems adequately described by the Euler equations, similarity
  criteria required for properly scaled experiments are identified. The conditions
  for the applicability of the Euler equations are formulated, based on the analysis
  of localization, heat conduction, viscosity, and radiation. Other considerations
  involved in such a scaling, including its limitations at small spatial scales, are
  discussed. The results are applied to experiments aimed at simulating three-dimensional
  hydrodynamics during supernova explosions and hydrodynamic instabilities in young
  supernova remnants. In addition, hydrodynamic situations with significant radiative
  effects are discussed.
