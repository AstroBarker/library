abstract: Absolute oscillator strengths of neutral cobalt have been determined from
  hook measurements for 159 transitions and emission intensity measurements for 314
  transitions between 2276 {\AA} and 9357 {\AA}. Ninety-five of these transitions
  were subjected to the procedure developed by Cardon, Smith, and Whaling which fits
  combined absorption and emission data to a set of consistent, optimum, relative
  oscillator strengths and upper level lifetimes. These relative values were normalized
  to the radiative lifetimes of Figger et al. and of Marek and Vogt obtained by pulsed
  laser fluorescence. Absolute oscillator strengths for 362 transitions and 36 lifetimes
  were determined. Typical uncertainties in the reported absolute oscillator strengths
  are -25\% (2/3 confidence level).  Equivalent widths were obtained for nineteen
  solar cobalt lines with the McMath solar telescope at Kitt Peak National Observatory.
  These widths were used to redetermine the solar cobalt abundance, assuming the photospheric
  model of Holweger and a microturbulence velocity of 1.0 km s-1. The adopted solar
  cobalt abundance is the mean value log Co/NH> + 12 = 4.92 \$\pm\$ 0.08 (\\%), from
  the 19 cobalt transitions. This value is in excellent agreement with the solar values
  of Ross and Aller, of Biemont, and of Holweger and that of Cameron for carbonaceous
  chondrites.
