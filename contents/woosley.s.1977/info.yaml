abstract: A model has been suggested wherein the neutrino flux from a collapsing stellar
  core might induce nuclear transformations in the mantle and envelope of the surrounding
  presupernova star, and such weak interactions might be responsible for producing
  p-process nuclei. A weakness in this model as a mechanism for p-process nucleosynthesis
  is pointed out which involves the rapid photodisintegration of all heavy seed nuclei
  in the stellar region of interest. An alternative mechanism for deuterium synthesis
  is proposed which may have been operative during an early generation of supermassive
  stars and which entails production of a neutron flux by antineutrinos in the hydrogen
  envelope surrounding a strong antineutrino source as well as the subsequent capture
  of the neutrons by protons. It is shown that this mechanism is probably not viable
  in supernovae, but might operate during the explosion of a 100-million-solar-mass
  star or the formation of a 1-million-solar-mass black hole. It is concluded that
  the present-day abundance of deuterium could be understood if even a small fraction
  of all the hydrogen in a galaxy were processed in this manner.
