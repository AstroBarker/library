abstract: 'Aims: We have previously analysed the spectra of 135 early B-type stars
  in the Large Magellanic Cloud (LMC) and found several groups of stars that have
  chemical compositions that conflict with the theory of rotational mixing. Here we
  extend this study to Galactic and Small Magellanic Cloud (SMC) metallicities.  Methods:
  We provide chemical compositions for ~50 Galactic and ~100 SMC early B-type stars
  and compare these to the LMC results. These samples cover a range of projected rotational
  velocities up to ~300 km s-1 and hence are well suited to testing rotational mixing
  models. The surface nitrogen abundances are utilised as a probe of the mixing process
  since nitrogen is synthesized in the core of the stars and mixed to the surface.  Results:
  In the SMC, we find a population of slowly rotating nitrogen-rich stars amongst
  the early B type core-hydrogen burning stars, which is comparable to that found
  previously in the LMC. The identification of non-enriched rapid rotators in the
  SMC is not possible due to the relatively high upper limits on the nitrogen abundance
  for the fast rotators. In the Galactic sample we find no significant enrichment
  amongst the core hydrogen-burning stars, which appears to be in contrast with the
  expectation from both rotating single-star and close binary evolution models. However,
  only a small number of the rapidly rotating stars have evolved enough to produce
  a significant nitrogen enrichment, and these may be analogous to the non-enriched
  rapid rotators previously found in the LMC sample. Finally, in each metallicity
  regime, a population of highly enriched supergiants is observed, which cannot be
  the immediate descendants of core-hydrogen burning stars. Their abundances are,
  however, compatible with them having gone through a previous red supergiant phase.
  Together, these observations paint a complex picture of the nitrogen enrichment
  in massive main sequence and supergiant stellar atmospheres, where age and binarity
  cause crucial effects. Whether rotational mixing is required to understand our results
  remains an open question at this time, but could be answered by identifying the
  true binary fraction in those groups of stars that do not agree with single-star
  evolutionary models.  Based on observations at the European Southern Observatory
  in programmes 171.0237 and 073.0234.  Figure 1 and Tables 1 and 2 are only available
  in electronic form at http://www.aanda.org'
