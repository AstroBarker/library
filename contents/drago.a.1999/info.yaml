abstract: We study the equation of state (EOS) of quark matter at finite temperature,
  using a confinement model in which chiral symmetry remains broken in the deconfined
  phase. Using the Walecka model to describe the hadronic phase, a deconfinement transition
  at densities slightly larger than nuclear matter saturation density takes place
  in pre-supernova matter. The presence of a mixed-phase region softens the EOS and
  open the possibility of a direct explosion. At larger densities the EOS is stiff
  enough to support a neutron star compatible with observations.
