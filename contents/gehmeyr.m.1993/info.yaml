abstract: An adaptive-grid algorithm is employed to construct a sequence of convective
  RR Lyrae envelopes with varying effective temperatures. For the first time, the
  theoretical red edge is derived and analyzed from full-amplitude models. 'Convective
  quenching' is confirmed as the mechanism that stalls the pulsational driving when
  the red edge is approached from within the instability strip. It is demonstrated
  that the theoretical properties of this approach are qualitatively consistent with
  the empirical properties. A quantitative comparison, however, depends strongly on
  details of the convection model.
