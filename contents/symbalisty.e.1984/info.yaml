abstract: During its final evolutionary stages, a massive star, as considered in current
  astrophysical theory, undergoes rapid collapse, thereby triggering a sequence of
  a catastrophic event which results in a Type II supernova explosion. A remnant neutron
  star or a black hole is left after the explosion. Stellar collapse occurs, when
  thermonuclear fusion has consumed the lighter elements present. At this stage, the
  core consists of iron. Difficulties arise regarding an appropriate model with respect
  to the core collapse. The present investigation is concerned with the evolution
  of a Type II supernova core including the effects of rotation and magnetic fields.
  A simple neutrino model is developed which reproduced the spherically symmetric
  results of Bowers and Wilson (1982). Several two-dimensional computational models
  of stellar collapse are studied, taking into account a case in which a 15 solar
  masses iron core was artificially given rotational and magnetic energy.
