abstract: This paper presents new calculations of instabilities, mixing, and clumping
  in the ejecta of SN 1987A, which are an extension of calculations published of Arnett
  et al. (1989) and which make it possible to differentiate between physical and numerical
  effects. It is shown that perturbations of physically reasonable amplitude provide
  sufficient mixing and clumping to explain the earlier than expected observations
  of X-rays and gamma rays and the shape of the SN 1987A light curve. It is also shown
  that the degree of clumping also affects estimates of mass from modeling the light
  curves of SN Ib.
