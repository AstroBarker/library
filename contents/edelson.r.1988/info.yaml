abstract: A method of measuring correlation functions without interpolating in the
  temporal domain, "the discrete correlation function," is introduced. It provides
  an assumption-free representation of the correlation measured in the data and allows
  meaningful error estimates. This method avoids the problem of spurious correlations
  at zero lag due to correlated errors. The method is applied to the case of AGN line-continuum
  cross-correlation functions by using published data for Akn 120 and NGC 4151. No
  correlation was found for the optical data for Akn 120, but the ultraviolet NGC
  4151 data show a strong correlation, indicating that the broad C IV feature emanates
  from a region whose size is greater than 1.2 and less than 20 light-days.
