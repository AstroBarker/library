abstract: Supermassive black holes ejected from galaxy nuclei by gravitational wave
  recoil will carry a retinue of bound stars, even in the absence of an accretion
  disk. We discuss the observable signatures related to these stars, with an emphasis
  on electromagnetic flares from stars which are tidally disrupted by the black hole.
  We calculate disruption rates for the bound, and the unbound, stars. The rates are
  smaller than, but comparable to, rates for nonrecoiling black holes. A key observational
  consequence is the existence of powerful off-nuclear and intergalactic X-ray flares.
  We also discuss other observable signatures associated with the bound stars, including
  episodic X-ray emission from accretion due to stellar mass loss, intergalactic supernovae,
  and feedback trails.
