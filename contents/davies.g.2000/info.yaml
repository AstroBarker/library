abstract: We demonstrate that the Biermann battery mechanism for the creation of large-scale
  magnetic fields can arise in a simple model protogalaxy. Analytic calculations and
  numerical simulations follow explicitly the generation of vorticity (and hence magnetic
  field) at the outward-moving shock that develops as the protogalactic perturbation
  collapses. Shear angular momentum then distorts this field into a dipole-like configuration.
  The magnitude of the field created in the fully formed disk galaxy is estimated
  to be 10-17 G, approximately what is needed as a seed for the galactic dynamo.
