abstract: Large radio sources are influenced by the intergalactic medium and the cosmic
  black body radiation, both of which depend on red-shift in a predictable way. The
  type of source evolution implied by the radio data can be fitted by a simple model.
  This topic links with the X-ray background and the intergalactic cosmic ray density.
