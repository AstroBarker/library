abstract: The emission spectrum of a platinum hollow cathode lamp has been recently
  recorded by means of a grating spectrograph at the National Institute of Standards
  and Technology (N.I.S.T.) and by Fourier transform spectrometry at Kitt Peak National
  Observatory and at Laboratoire Aim{\'e} Cotton. The classification of Pt I lines
  is revised and extended. One hundred-nineteen new energy levels have been added
  to the 83 earlier ones, four of which are assigned revised J-values. Seventy percent
  of the levels are interpreted theoretically by means of Slater-Condon type calculations
  of (5d + 6s)^{10}, 5d^96d, 5d^97s, 5d^97d, 5d^98s and (5d^96p + 5d^86s6p + 5d^76s^26p
  + 5d^97p). The ionisation limit 5d^9 ^2D{5/2} at 72 230$\pm$ 50 cm^{-1} (8.956\$\pm\$
  0.006 eV) has been derived from 5d^9ns, 5d^96f and 5d^86s5f levels.   Le spectre
  d'{\'e}mission du platine dans une cathode creuse a {\'e}t{\'e} r{\'e}cemment enregistr{\'e}
  sur un spectographe {\`a} r{\'e}seau au N.I.S.T. et par spectroscopie de Fourier
  {\`a} l'observatoire de Kitt Peak et au laboratoire Aim{\'e} Cotton. La classification
  des raies de Pt I est r{\'e}vis{\'e}e et {\'e}tendue. pour 4 des 83 niveaux d{\'e}j{\`a}
  connus, le nombre quantique J a {\'e}t{\'e} corrig{\'e} et 119 niveaux nouveaux
  ont {\'e}t{\'e} d{\'e}termin{\'e}s. Les identificaitons de 70 \% des niveaux s'appuient
  sur l'{\'e}tude th{\'e}orique par la m{\'e}thode de Slater-Condon des configurations
  m{\'e}lang{\'e}es (5d + 6s)^{10}, 5d^96d, 5d^97s, 5d^97d, 5d^98s, (5d^96p + 5d^86s6p
  + 5d^76s^26p + 5d^97p). La limite d'ionisation 72 230\$\pm\$ 50 cm^{-1} (8,956 \$\pm\$
  0,006 eV) a {\'e}t{\'e} d{\'e}duite des configurations 5d^9ns, 5d^95f et 5d^86s5f.
