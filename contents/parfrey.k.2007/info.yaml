abstract: Solar active regions, produced by the emergence of tubes of strong magnetic
  field in the photosphere, are restricted to within 35deg of the solar equator. The
  nature of the dynamo processes that create and renew these fields, and are therefore
  responsible for solar magnetic phenomena, are not well understood. We analyze the
  magnetorotational stability of the solar tachocline for general field geometry.
  This thin region of strong radial and latitudinal differential rotation, between
  the radiative and convective zones, is unstable at latitudes above 37deg, yet is
  stable closer to the equator. We propose that small-scale magnetorotational turbulence
  prevents coherent magnetic dynamo action in the tachocline except in the vicinity
  of the equator, thus explaining the latitudinal restriction of active regions. Tying
  the magnetic dynamo to the tachocline elucidates the physical conditions and processes
  relevant to solar magnetism.
