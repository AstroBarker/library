abstract: We present multicolor light curves of SN 1998bw which appeared in ESO184-G82
  in close temporal and spatial association with GRB 980425. The light curves are
  based on observations conducted at Cerro Tololo Inter-American Observatory (CTIO)
  and data from the literature. The CTIO photometry reaches ~86 days after the gamma-ray
  burst (GRB) in U and ~160 days after the GRB in BV(RI) C . The observations in U
  extend the previously known coverage by about 30 days and determine the slope of
  the early exponential tail. We calibrate a large set of local standards in common
  with those of previous studies and use them to transform published observations
  of the supernova (SN) to our realization of the standard photometric system. We
  show that the photometry from different sources merges smoothly and we provide a
  unified set of 300 observations of the SN in five bands. Using the extensive set
  of spectra in the public domain, we compute extinction and K-corrections and build
  quasi-bolometric unreddened rest-frame light curves. We provide low-degree piecewise
  spline fits to these light curves with daily sampling. They reach ~86 rest-frame
  days after the GRB with U-band coverage and ~498 rest-frame days after the GRB without
  U.
