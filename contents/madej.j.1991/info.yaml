abstract: Model atmosphere equations are derived which correspond to plane-parallel
  nongray atmospheres of very hot neutron stars in hydrostatic and radiative equilibrium.
  The nonlinear transfer equation used implements an exact photon redistribution function
  which precisely traces even those scattering events having large photon-electron
  energy exchange. The numerical results thus obtained encompass tables of the surface
  fluxes for 20 model atmospheres whose T(eff) ranges from 6 to 30 million K. The
  spectra of high gravity models are virtually identical with the blackbody spectrum
  shifted toward higher energies, while models approaching the Eddington limit develop
  a large low-energy hump.
