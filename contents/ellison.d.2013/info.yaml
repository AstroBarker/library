abstract: We present results from a Monte Carlo simulation of a parallel collisionless
  shock undergoing particle acceleration. Our simulation, which contains parameterized
  scattering and a particular thermal leakage injection model, calculates the feedback
  between accelerated particles ahead of the shock, which influence the shock precursor
  and "smooth" the shock, and thermal particle injection. We show that there is a
  transition between nonrelativistic shocks, where the acceleration efficiency can
  be extremely high and the nonlinear compression ratio can be substantially greater
  than the Rankine-Hugoniot value, and fully relativistic shocks, where diffusive
  shock acceleration is less efficient and the compression ratio remains at the Rankine-Hugoniot
  value. This transition occurs in the trans-relativistic regime and, for the particular
  parameters we use, occurs around a shock Lorentz factor gamma0 = 1.5. We also find
  that nonlinear shock smoothing dramatically reduces the acceleration efficiency
  presumed to occur with large-angle scattering in ultra-relativistic shocks. Our
  ability to seamlessly treat the transition from ultra-relativistic to trans-relativistic
  to nonrelativistic shocks may be important for evolving relativistic systems, such
  as gamma-ray bursts and Type Ibc supernovae. We expect a substantial evolution of
  shock accelerated spectra during this transition from soft early on to much harder
  when the blast-wave shock becomes nonrelativistic.
