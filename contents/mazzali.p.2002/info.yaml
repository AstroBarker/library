abstract: Photometric and spectroscopic data of the energetic Type Ic supernova (SN)
  2002ap are presented, and the properties of the SN are investigated through models
  of its spectral evolution and its light curve. The SN is spectroscopically similar
  to the ``hypernova'' SN 1997ef. However, its kinetic energy [~(4-10)\texttimes{}1051
  ergs] and the mass ejected (2.5-5 Msolar) are smaller, resulting in a faster evolving
  light curve. The SN synthesized ~0.07 Msolar of 56Ni, and its peak luminosity was
  similar to that of normal SNe. Brightness alone should not be used to define a hypernova,
  whose defining character, namely very broad spectral features, is the result of
  high kinetic energy. The likely main-sequence mass of the progenitor star was 20-25
  Msolar, which is also lower than that of both hypernovae SN 1997ef and SN 1998bw.
  SN 2002ap appears to lie at the low-energy and low-mass end of the hypernova sequence
  as it is known so far. Observations of the nebular spectrum, which is expected to
  dominate by the summer of 2002, are necessary to confirm these values.
