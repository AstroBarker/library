abstract: The supernova neutrino flavor evolution in the presence of the non-trivial
  neutrino magnetic moment and strong magnetic field is numerically derived using
  the two-flavor and single-angle approximation. The novel properties of collective
  neutrino oscillations are studied and distinct patterns of flavor and spin-flavor
  spectral splits are presented. Finally we also discuss how the neutrino magnetic
  moment affects the observable supernova neutrino energy spectra.
