abstract: Over the course of the past 10 years, a large body of homogeneous spectrophotometric
  data on relatively bright stars has been gathered to serve as a library with which
  to synthesize galaxy spectra in population studies. As the data might be generally
  useful, they are presented in three tables. One hundred seventy-five (175) stars
  were selected, most from the Navy photometric catalog. Covered are complete ranges
  of spectral type and luminosity class. Normalized spectral energy distributions
  of these stars in pictorial form are provided along with tables of calculated colors,
  scan line and continuum indices, and some information on the relation of the scan
  colors to real photometric systems.
