abstract: We implement a general relativistic neutrino transport scheme appropriate
  to problems in stellar collapse and neutron star formation. In this scheme the spectral
  energy and momentum balance equations are solved as a coupled set. We perform transport
  calculations on two frozen stellar background models neglecting the feedback of
  the neutrinos on the matter. We compare with schemes that ignore either relativity
  or momentum balance or both. The work performed by the neutrino stress on the matter
  is taken into account and has an important effect. In particular, if there is a
  hydrodynamical shock in the system, this work contribution boosts the energy deposition
  behind the shock. This may enhance the chances for a successful neutrino driven
  supernova explosion.
