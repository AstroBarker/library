abstract: Integrated spectra of 55 nearby normal and peculiar galaxies have been compiled
  into a spectrophotometric atlas. Most observations cover the spectral range 3650-7100
  A, with a resolution of 5-8 A, and sufficient signal-to-noise ratio to measure the
  prominent emission and absorption features. The spectra have been reduced to a common
  spectrophotometric scale and are presented as a series of plots, arranged according
  to morphological and spectral types. A digital version of the data is also available.
  The general characteristics of the integrated spectra of galaxies are discussed.
