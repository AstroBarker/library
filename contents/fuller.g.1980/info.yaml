abstract: Astrophysical positron emission, continuum electron capture, and neutrino
  energy loss rates are calculated for 26Al --> 26Mg, 30P --> 30Si;, 31S --> 31P,
  32S --> 32P 33S --> 33P, and 35Cl --> 35S.  Measured nuclear level information and
  matrix elements are used where available. Unmeasured matrix elements for allowed
  transitions are assigned on the basis of simple shell model arguments and the results
  of detailed large-scale shell model calculations by Wildenthal and his collaborators.
  The experimentally determined matrix elements are found to dominate the rates over
  most of the range of temperatures and densities considered. The uncertainties in
  the rates are estimated.  Appropriate average matrix elements for unmeasured Gamow-Teller
  transitions are estimated for use in other sd-shell nuclei. The rates presented
  agree roughly with those of Hansen over a wide range of conditions, but potentially
  important differences in the rates exist at temperatures and densities relevant
  for the production and destruction of 26Al and for neutronization and neutrino loss
  in the late stages of presupernova evolution.
