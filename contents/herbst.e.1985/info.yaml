abstract: The theoretical evidence that recently calculated radiative association
  reaction rate coefficients involving polyatomic molecular ions may be an order of
  magnitude too low in many cases is explained and developed. A faster radiative stabilization
  rate is utilized to lessen the discrepancy between theory and experiment on the
  important interstellar association between CH3(+) and H2. Proposed update rate coefficients
  for a variety of radiative association processes in the 10-50 K temperature range
  are given for inclusion in future models of dense interstellar clouds.
