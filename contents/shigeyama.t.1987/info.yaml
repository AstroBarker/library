abstract: The shock wave propagation, the subsequent expansion of ejected matter,
  and the optical light curve of supernova SN1987A in the LMC have been computed,
  and the results are discussed. It is found that the early light curve can be accounted
  for by the diffusive release of energy deposited by the shock wave, that the progenitor's
  radius should be as small as 1-3 x 10 to the 12th cm, and that the explosion energy
  per unit mass should be relatively large at 2-3 x 10 to the 51st erg for ejected
  matter of 7-10 solar masses. The light curve after eight days is well reproduced
  by a model with constant energy input. This input may be due to the activity of
  an embedded pulsar. The light curves calculated by invoking the radioactive decay
  of Ni-56 and Co-56 are less satisfactory in accounting for the nearly flat portion
  observed after 65 days. If Sk-69 202 is the progenitor of SN1987A, its explosion
  energy should be more than 2 x 10 to the 51st erg; this suggests that a prompt shock
  mechanism forms a neutron star.
