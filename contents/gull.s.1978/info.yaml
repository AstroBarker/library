abstract: In many problems the primary data are the Fourier transform of the physical
  quantities which are of interest and the inverse Fourier transform is normally calculated
  with a digital computer. Disadvantages concerning this approach related to the presence
  of experimental errors in the data are pointed out and a description is presented
  of an alternative method of analysis based on the idea of maximum entropy. The concept
  is illustrated with the aid of data produced by the radio telescopes at the Mullard
  Radio Astronomy Observatory, UK. In this application the data are samples of the
  two-dimensional Fourier transform of the radio brightness from the sky. The combination
  of maximum-entropy analysis with a proper treatment of experimental errors promises
  to be a powerful, yet safe, method for estimating the Fourier transform of incomplete
  and noisy data. The method is very easily generalized to deal with other types of
  data, not involving a Fourier transform.
