abstract: Hydrogen-rich matter has been added to a carbon-oxygen white dwarf of initial
  mass 0.516 Msolar at the rates 10-8 and 2\texttimes{}10-8 Msolar yr-1, and results
  are compared with those for a white dwarf of the same initial mass that accretes
  pure helium at the same rates. For the chosen accretion rates, hydrogen burns in
  a series of recurrent mild flashes and the ashes of hydrogen burning build up a
  helium layer at the base of which a helium flash eventually occurs. In previous
  studies involving accretion at higher rates and including initially more massive
  white dwarfs, the diffusion of energy inward from the hydrogen shell-flashing region
  contributes to the increase in the temperature at the base of the helium layer,
  and the mass of the helium layer when the helium flash begins is significantly smaller
  than in a comparison model accreting pure helium; the helium shell flash is strong
  enough to cause the model to expand beyond its Roche lobe, but not strong enough
  to develop into a supernova explosion. In contrast, for the conditions adopted here,
  the temperature at the base of the helium layer becomes gradually independent of
  the deposition of energy by hydrogen shell flashes, and the mass of the helium layer
  when the helium flash occurs is a function only of the accretion rate, independent
  of the hydrogen content of the accreted matter. Several thousand hydrogen shell
  flashes must be followed before the helium flash takes place. Because of the high
  degeneracy at the base of the helium layer, temperatures in the flashing zone will
  rise without a corresponding increase in pressure, nuclear burning will continue
  until nuclear statistical equilibrium is achieved, and structural evolution will
  proceed hydrodynamically; the model will become a supernova, but not of the classical
  Type Ia variety.
