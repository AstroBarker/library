abstract: In recent work we presented the first results of global general relativistic
  magnetohydrodynamic (GRMHD) simulations of tilted (or misaligned) accretion disks
  around rotating black holes. The simulated tilted disks showed dramatic differences
  from comparable untilted disks, such as asymmetrical accretion onto the hole through
  opposing "plunging streams" and global precession of the disk powered by a torque
  provided by the black hole. However, those simulations used a traditional spherical-polar
  grid that was purposefully under-resolved along the pole, which prevented us from
  assessing the behavior of any jets that may have been associated with the tilted
  disks. To address this shortcoming we have added a block-structured "cubed-sphere"
  grid option to the Cosmos++ GRMHD code, which will allow us to simultaneously resolve
  the disk and polar regions. Here we present our implementation of this grid and
  the results of a small suite of validation tests intended to demonstrate that the
  new grid performs as expected. The most important test in this work is a comparison
  of identical tilted disks, one evolved using our spherical-polar grid and the other
  with the cubed-sphere grid. We also demonstrate an interesting dependence of the
  early-time evolution of our disks on their orientation with respect to the grid
  alignment. This dependence arises from the differing treatment of current sheets
  within the disks, especially whether or not they are aligned with symmetry planes
  of the grid.
