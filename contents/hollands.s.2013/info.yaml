abstract: 'We establish a new criterion for the dynamical stability of black holes
  in D >= 4 spacetime dimensions in general relativity with respect to axisymmetric
  perturbations: Dynamical stability is equivalent to the positivity of the canonical
  energy, {{E}}, on a subspace, {{T}}, of linearized solutions that have vanishing
  linearized ADM mass, momentum, and angular momentum at infinity and satisfy certain
  gauge conditions at the horizon. This is shown by proving that---apart from pure
  gauge perturbations and perturbations towards other stationary black holes---{{E}}
  is nondegenerate on {{T}} and that, for axisymmetric perturbations, {{E}} has positive
  flux properties at both infinity and the horizon. We further show that {{E}} is
  related to the second order variations of mass, angular momentum, and horizon area
  by {{E} = delta^2 M -sum\_A Omega\_A delta^2 J\_A - kappa/8pidelta^2 A}, thereby
  establishing a close connection between dynamical stability and thermodynamic stability.
  Thermodynamic instability of a family of black holes need not imply dynamical instability
  because the perturbations towards other members of the family will not, in general,
  have vanishing linearized ADM mass and/or angular momentum. However, we prove that
  for any black brane corresponding to a thermodynamically unstable black hole, sufficiently
  long wavelength perturbations can be found with {{E} < 0} and vanishing linearized
  ADM quantities. Thus, all black branes corresponding to thermodynmically unstable
  black holes are dynamically unstable, as conjectured by Gubser and Mitra. We also
  prove that positivity of {{E}} on {{T}} is equivalent to the satisfaction of a "
  local Penrose inequality," thus showing that satisfaction of this local Penrose
  inequality is necessary and sufficient for dynamical stability. Although we restrict
  our considerations in this paper to vacuum general relativity, most of the results
  of this paper are derived using general Lagrangian and Hamiltonian methods and therefore
  can be straightforwardly generalized to allow for the presence of matter fields
  and/or to the case of an arbitrary diffeomorphism covariant gravitational action.'
