abstract: 'We use two epochs of Hubble Space Telescope WFPC2 images separated by 2
  yr to determine the location and propagation of the reverse shock (RS) in the young
  supernova remnant Cassiopeia A (Cas A). The images trace optical line emission from
  fast-moving knots and filaments of highly processed ejecta as they cross the RS,
  become heated and compressed, and radiatively cool. At numerous positions around
  the optical shell, new emission features are seen in the 2002 images that were not
  yet visible in the 2000 exposures. In a few instances emission features seen in
  the first epoch have completely disappeared in the second epoch. We concentrate
  on two regions along the rim of the main emission shell in Cas A for close inspection:
  one in the northwestern part of the shell and another along the southwestern part
  of it. In these regions the RS is viewed almost edge-on, and its precise position
  has been measured. The RS is coherent in these regions over arcminute (~1 pc) scales
  but is highly distorted perpendicular to the direction of expansion. We find the
  RS to be generally expanding at 50\%-60\% of the ~5500 km s-1 bulk velocity of the
  optical ejecta. We present shock models for the ejecta that are consistent with
  the high densities and short cooling times observed in the optical knots of the
  Cas A remnant.  Based on observations with the NASA/ESA Hubble Space Telescope obtained
  at the Space Telescope Science Institute, which is operated by the Association of
  Universities for Research in Astronomy, Inc., under NASA contract NAS5-26555.'
