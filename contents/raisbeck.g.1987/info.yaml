abstract: A detailed concentration profile for Be-10 is reported for deep ice cores
  from Vostok, Antarctica. The results confirm a Be 'peak', lasting 1000-2000 years,
  at about 60,000 yr BP, and show another similar peak at about 35,000 yr BP. The
  latter peak has also been observed in the Dome C deep ice core. Possible sources
  for these peaks and their potential as stratigraphic markers are discussed.
