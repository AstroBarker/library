abstract: We calculate the angular momentum transport by gravito-inertial-Alfv{\'e}n
  waves and show that, so long as prograde and retrograde gravity waves are excited
  to roughly the same amplitude, the sign of angular momentum deposit in the radiative
  interior of the Sun is such as to lead to an exponential growth of any existing
  small radial gradient of rotation velocity just below the convection zone. This
  leads to formation of a strong thin shear layer (of thickness about 0.3\% Rsolar)
  near the top of the radiative zone of the Sun on a timescale of order 20 yr. When
  the magnitude of differential rotation across this layer reaches about 0.1 muHz,
  the layer becomes unstable to shear instability and undergoes mixing, and the excess
  angular momentum deposited in the layer is returned to the convection zone. The
  strong shear in this layer generates a toroidal magnetic field which is also deposited
  in the convection zone when the layer becomes unstable. This could possibly start
  a new magnetic activity cycle seen at the surface.
