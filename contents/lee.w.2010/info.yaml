abstract: We present a detailed assessment of the various dynamical pathways leading
  to the coalescence of compact objects in globular clusters (GCs) and Short Gamma-ray
  Burst (SGRB) production. We consider primordial binaries, dynamically formed binaries
  (through tidal two-body and three-body exchange interactions), and direct impacts
  of compact objects (WD/NS/BH). Here, we show that if the primordial binary fraction
  is small, close encounters dominate the production rate of coalescing compact systems.
  We find that the two dominant channels are the interaction of field neutron stars
  (NSs) with dynamically formed binaries and two-body encounters. Under such conditions,
  we estimate the redshift distribution and host galaxy demographics of SGRB progenitors,
  and find that GCs can provide a significant contribution to the overall observed
  rate. Regarding the newly identified channel of close stellar encounters involving
  WD/NS/BH, we have carried out precise modeling of the hydrodynamical evolution,
  giving us a detailed description of the resulting merged system. Our calculations
  show that there is in principle no problem in accounting for the global energy budget
  of a typical SGRB. The particulars of each encounter, however, are variable in several
  aspects and can lead to interesting diversity. First and most importantly, the characteristics
  of the encounter are highly dependent on the impact parameter. This is in contrast
  to the merger scenario, where the masses of the compact objects dictate a typical
  length and luminosity scale for SGRB activity. Second, the nature of the compact
  star itself can produce very different outcomes. Finally, the presence of tidal
  tails in which material will fall back onto the central object at a later time is
  a robust feature of the present set of calculations. The mass involved in these
  structures is considerably larger than for binary mergers. It is thus possible to
  account generically in this scenario for a prompt episode of energy release, as
  well as for activity many dynamical time scales later.
