abstract: 'Recent studies have highlighted the sensitivity of core-collapse         supernovae
  (CCSNe) models to electron-capture (EC) rates on         neutron-rich nuclei near
  the N = 50 closed-shell region. In this         work, we perform a large suite of
  one-dimensional CCSN         simulations for 200 stellar progenitors using recently
  updated         EC rates in this region. For comparison, we repeat the         simulations
  using two previous implementations of EC rates: a         microphysical library
  with parametrized N = 50 rates (LMP), and         an older independent-particle
  approximation (IPA). We follow the         simulations through shock revival up
  to several seconds post-         bounce, and show that the EC rates produce a consistent
  imprint         on CCSN properties, often surpassing the role of the progenitor         itself.
  Notable impacts include the timescale of core collapse,         the electron fraction
  and mass of the inner core at bounce, the         accretion rate through the shock,
  the success or failure of         revival, and the properties of the central compact
  remnant. We         also compare the observable neutrino signal of the         neutronization
  burst in a DUNE-like detector, and find         consistent impacts on the counts
  and mean energies. Overall, the         updated rates result in properties that
  are intermediate between         LMP and IPA, and yet slightly more favorable to
  explosion than         both.'
