abstract: 'Light curves computed from hydrodynamic models of supernova are compared
  graphically with the average observed B and V-band light curves of linear Type II
  supernovae. Models are based on the following explosion scenarios: carbon deflagration
  within a C + O core near the Chandrasekhar mass, electron-capture-induced core collapse
  of an O-Ne-Mg core of the Chandrasekhar mass, and collapse of an Fe core in a massive
  star. A range of envelope mass, initial radius, and composition is investigated.
  Only a narrow range of values of these parameters are consistent with observations.
  Within this narrow range, most of the observed light curve properties can be obtained
  in part, but none of the models can reproduce the entire light curve shape and absolute
  magnitude over the full 200 day comparison period. The observed lack of a plateau
  phase is explained in terms of a combination of small envelope mass and envelope
  helium enhancement. The final cobalt tail phase of the light curve can be reproduced
  only if the mass of explosively synthesized radioactive Ni-56 is small. The results
  presented here, in conjunction with the observed homogeneity among individual members
  of the supernova subclass, argue favorably for the O-Ne-Mg core collapse mechanism
  as an explanation for linear Type II supernovae. The Crab Nebula may arisen from
  such an explosion. Carbon deflagrations may lead to brighter events like SN 1979C.'
