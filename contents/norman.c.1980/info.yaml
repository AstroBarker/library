abstract: A model is proposed which can account for the longevity, energetics, and
  dynamical structure of dark molecular clouds. Recent observations of a high space
  density of T Tauri stars in some dark clouds provide the basis for the assertion
  that high-velocity winds from these low mass pre-main-sequence stars provide a continuous
  dynamic input into molecular clouds. It is postulated that as clumps are driven
  above the Jeans mass, both by coalescence and the enhancement of ram pressure through
  continuing acceleration by protostellar winds, collapse is followed by the formation
  of low-mass stars that generate additional protostellar winds. Finally, it is found
  that star formation occurs on a relatively slow time scale, comparable to the cloud
  lifetime
