abstract: New photoionization models of optically thin low-density intergalactic gas
  at constant pressure, photoionized by QSOs, are presented. All ion stages of H,
  He, C, N, O, Si, and Fe, plus H2 are modeled, and the column density ratios of clouds
  at specified values of the ionization parameter of ngamma/n sub H and cloud metallicity
  are predicted. If Ly-alpha clouds are much cooler than the previously assumed value,
  30,000 K, the ionization parameter must be very low, even with the cooling contribution
  of a trace component of molecules. If the clouds cool below 6000 K, their final
  equilibrium must be below 3000 K, owing to the lack of a stable phase between 6000
  and 3000 K. If it is assumed that the clouds are being irradiated by an EUV power-law
  continuum typical of WSOs, with J0 = 10 exp -21 ergs/s sq cm Hz, typical cloud thicknesses
  along the line of sight that are much smaller than would be expected from shocks,
  thermal instabilities, or gravitational collapse are derived.
