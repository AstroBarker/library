abstract: Dust formation in the winds of hot stars is inextricably linked to the classic
  eruptive state of luminous blue variables because it requires very high mass-loss
  rates, \dot{M}\gtrsim 10^{-2.5}\,M\_\odot year-1, for grains to grow and for the
  non-dust optical depth of the wind to shield the dust formation region from the
  true stellar photosphere. Thus, dusty shells around hot stars trace the history
  of "great" eruptions, and the statistics of such shells in the Galaxy indicate that
  these eruptions are likely the dominant mass-loss mechanism for evolved, M ZAMS
  >~ 40 M \&sun; stars. Dust formation at such high \dot{M} also explains why very
  large grains (a max >~ 1 mum) are frequently found in these shells, since a\_{max}\propto
  \dot{M}. The statistics of these shells (numbers, ages, masses, and grain properties
  such as a max) provide an archaeological record of this mass-loss process. In particular,
  the velocities v shell, transient durations (where known), and ejected masses M
  shell of the Galactic shells and the supernova (SN) "impostors" proposed as their
  extragalactic counterparts are very different. While much of the difference is a
  selection effect created by shell lifetimes \propto (v\_{shell}\sqrt{M\_{shell}})^{-1},
  more complete Galactic and extragalactic surveys are needed to demonstrate that
  the two phenomena share a common origin given that their observed properties are
  essentially disjoint. If even small fractions (1\%) of SNe show interactions with
  such dense shells of ejecta, as is currently believed, then the driving mechanism
  of the eruptions must be associated with the very final phases of stellar evolution,
  suggestive of some underlying nuclear burning instability.
