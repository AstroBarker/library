abstract: The charge-transfer and momentum-transfer cross sections for protons in
  collisions with helium are calculated at relative energies up to 5 keV. Rate coefficients
  are presented for temperatures up to 10 exp 5 K. Charge transfer is more rapid than
  radiative association at temperatures above 7500 K.
