abstract: We present our first results from a study of the supernova remnants (SNRs)
  in the Large Magellanic Cloud (LMC) using data from ASCA. The three remnants we
  have analyzed to date, 0509-67.5, 0519-69.0, and N103B, are among the smallest,
  and presumably also the youngest, in the Cloud. The X-ray spectra of these SNRs
  show strong K alpha emission lines of silicon, sulfur, argon, and calcium with no
  evidence for corresponding lines of oxygen, neon, or magnesium. The dominant feature
  in the spectra is a broad blend of emission lines around 1 keV which we attribute
  to L-shell emission lines of iron. Model calculations (Nomoto, Thielemann, \& Yokoi
  1984) show that the major products of nucleosynthesis in Type Ia supernovae (SNs)
  are the elements from silicon to iron, as observed here. The calculated nucleosynthetic
  yields from Type Ib and II SNs are shown to be qualitatively inconsistent with the
  data. We conclude that the SNs which produced these remnants were of Type Ia. This
  finding also confirms earlier suggestions that the class of Balmer-dominated remnants
  arise from Type Ia SN explosions. Based on these early results from the LMC SNR
  sample, we find that roughly one-half of the SNRs produced in the LMC within the
  last approximately 1500 yr came from Type Ia SNs.
