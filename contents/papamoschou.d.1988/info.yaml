abstract: The compressibility effect and the effects of density and velocity ratios
  on the turbulent shear layer were investigated experimentally for two-stream shear
  layers between similar or dissimilar gases at a variety of free-stream Mach numbers.
  Using a specially designed flow facility, ten combinations of gases were studied
  in which free-stream Mach numbers ranged from 0.2 to 4. Schlieren photography revealed
  very low spreading rates and large-scale structures. A compressibility-effect parameter
  was defined that correlates and unifies the experimental results, and a concept
  of convective Mach number was introduced, which is the Mach number in a coordinate
  system convecting with the velocity of the dominant waves and structures of the
  shear layer. It was found that the normalized growth rate decreases rapidly with
  increasing convective Mach number, reaching an asymptotic value of about 0.2 for
  supersonic convective Mach numbers.
