abstract: Using the Fourier Transform Spectrometer at Lund Observatory, intensity
  calibrated spectra of singly ionized zirconium have been recorded and analyzed.
  Oscillator strengths for 263 Zr II spectral lines in the region 2500-5400 {\AA}
  have been derived by combining new experimental branching fractions with previously
  measured radiative lifetimes. The transitions combine 34 odd parity levels with
  29 low metastable levels between 0 and 2.4 eV. The experimental branching fractions
  have been compared with theoretical values and the oscillator strengths with previously
  published data when available. The oscillator strengths have been employed to derive
  the solar photospheric Zr abundance based on both 1D and 3D model atmospheres. Based
  on the seven best and least perturbed Zr II lines in the solar disk-center spectrum,
  we determine the solar Zr abundance to log \ensuremath{\epsilon}\_Zr=2.58$\pm$.02
  when using a 3D hydrodynamical solar model atmosphere. The new value is in excellent
  agreement with the meteoritic Zr abundance.
