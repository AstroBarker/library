abstract: It is pointed out that MeV photons have actually been observed in bursts.
  These observations imply that the nonrelativistic sources cannot be further away
  than a few kpc from the sun and, therefore, must be galactic. The 27 April 1972
  event observed by Apollo 16 shows at higher energies a power law spectrum with a
  possible line feature around 4 MeV. The optical depth of a homogeneous, isotropic
  radiation field is estimated with the aid of formulae used by Nikishov (1962) and
  Jauch and Rohrlich (1955). On the basis of an investigation of the various factors
  involved, it is tentatively suggested that the gamma-ray bursts which have been
  detected are galactic, but are in the majority of the cases not connected with unique
  irreversible star transformation. It appears also unlikely that the gamma-ray bursts
  are connected with galactic novae.
