abstract: Ultraviolet spectroscopy of the Crab Nebula done by the International Ultraviolet
  Explorer satellite is described, and an estimate of the carbon abundance is made,
  noting data reduction to remove spectral defects caused by radiation hits. The important
  C IV 1549, He II 1640, and semiforbidden C III 1908 emission line intensities were
  measured and upper limits placed on other ultraviolet features for the brightest
  filamentary region in the Nebula. The emission lines imply an average ionic abundance
  ratio n(C+2)/n(O+2) in the range from 0.4 to 1.5 in the observed gaseous condensations.
  The elemental abundance ratio of carbon to oxygen is probably in the same range.
  Analysis shows that there is no perceptible excess of carbon due to presupernova
  nucleosynthesis in the observed region. The large helium abundance, small carbon
  and oxygen abundances, and presence of a neutron star in the Crab Nebula suggest
  that the presupernova star had a mass close to eight solar masses.
