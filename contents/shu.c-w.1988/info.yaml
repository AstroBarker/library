abstract: 'In the computation of discontinuous solutions of hyperbolic conservation
  laws, TVD (total-variation-diminishing), TVB (total-variation-bounded), and the
  recently developed ENO (essentially non-oscillatory) schemes have proven to be very
  useful. In this paper two improvements are discussed: a simple TVD Runge-Kutta type
  time discretization, and an ENO construction procedure based on fluxes rather than
  on cell averages. These improvements simplify the schemes considerably-especially
  for multi-dimensional problems with forcing terms. Preliminary numerical results
  are also given.'
