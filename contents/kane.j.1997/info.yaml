abstract: Supernova 1987A focused attention on the critical role of hydrodynamic instabilities
  in the evolution of supernovae. To test the modeling of these instabilities, we
  are developing laboratory experiments of hydrodynamic mixing under conditions relevant
  to supernovae. The target consists of a two-layer planar package composed of 85
  mum Cu backed by 500 mum CH2, having a single-mode sinusoidal perturbation at the
  interface, with lambda = 200 mum and eta0 = 20 mum. The Nova Laser is used to generate
  a 10-15 Mbar [(10-15) \texttimes{} 1012 dyne cm2] shock at the interface, which
  triggers perturbation growth as a result of the Richtmyer-Meshkov instability, followed
  by the Rayleigh-Taylor instability as the interface decelerates. This resembles
  the hydrodynamics of the He-H interface of a Type II supernova at intermediate times,
  up to a few times 103 s. The experiment is modeled using the hydrodynamics codes
  HYADES and CALE and the supernova code PROMETHEUS. Results of the experiments and
  simulations are presented.
