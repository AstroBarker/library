abstract: We show that in a supernova core the annihilation process nuenue-->numu,taunumu,tau
  is always more important than the traditional reaction e+e--->numu,taunumu,tau as
  a source for muon and tau neutrino pairs. We study the impact of the new process
  by means of a Monte Carlo transport code with a static stellar background model
  and by means of a self-consistent hydrodynamic simulation with Boltzmann neutrino
  transport. Nucleon bremsstrahlung NN-->NNnumu,taunumu,tau is also included as another
  important source term. Taking into account nuenue-->numu,taunumu,tau increases the
  numu and nutau luminosities by as much as 20\%, while the spectra remain almost
  unaffected. In our hydrodynamic simulation, the shock was somewhat weakened. Elastic
  numu,taunue and numu,taunue scattering is not negligible but less important than
  numu,taue+/- scattering. Its influence on the numu,tau fluxes and spectra is small
  after all other processes have been included.
