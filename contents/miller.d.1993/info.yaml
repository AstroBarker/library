abstract: We performed several two-dimensional calculations of a Type II supernova
  explosion through the first 0.4 s past bounce, to examine the effect of convection
  on the shock. We used the two-dimensional code to compute a convective velocity
  to compare with the Mayle and Wilson (MW, 1993) one-dimensional code (which includes
  more of the relevant physics) and find that the MW code does not produce an explosion
  using the two-dimensional convective velocity. We find that convection develops
  exponentially with a growth rate of about 100/s. If the initial perturbation is
  sufficient, this instability grows enough to develop significant convective velocities.
  The convective eddies then deliver energy to the shock. We present results from
  several runs with varying sizes of initial perturbation, as well as a case with
  no initial perturbation but including the effects of rotation. We see that convection
  enhances the outward propagation of the shock.
