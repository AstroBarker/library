abstract: On 2017 August 17, Swope Supernova Survey 2017a (SSS17a) was discovered
  as the optical counterpart of the binary neutron star gravitational wave event GW170817.
  We report time-series spectroscopy of SSS17a from 11.75 hours until 8.5 days after
  merger. Over the first hour of observations the ejecta rapidly expanded and cooled.
  Applying blackbody fits to the spectra, we measure the photosphere cooling from
  $11,000^{+3400}_{-900}$ K to \$9300^{+300}\_{-300}\$ K, and determine a photospheric
  velocity of roughly 30\% of the speed of light. The spectra of SSS17a begin displaying
  broad features after 1.46 days, and evolve qualitatively over each subsequent day,
  with distinct blue (early-time) and red (late-time) components. The late-time component
  is consistent with theoretical models of r-process-enriched neutron star ejecta,
  whereas the blue component requires high velocity, lanthanide-free material.
