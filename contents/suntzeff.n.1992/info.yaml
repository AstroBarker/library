abstract: Observations performed in order to elucidate the late-time bolometric evolution
  of SN 1987A are reported. New optical and infrared data show that a third radioactive
  nuclide, Co-57, is now powering the SN nebula. The best fit to the late-time bolometric
  light curve is with 0.01-solar-mass Co-57 (about five times the amount expected
  based on the solar ratio of Fe-57/Fe-56). If recent theoretical upper limits on
  the expected production of Co-57 and Ti-44 are correct, then either an additional
  energy input is needed or one of the fundamental assumptions used in the modeling
  of the data is in error. If a pulsar is present in the center of SN 1987A, it can
  be providing no more than about 8 x 10 exp 36 ergs/s on day 1500.
