abstract: We analyze the dynamics of a neutron-proton relativistic wind, paying particular
  attention to fireballs of cosmological gamma-ray bursts (GRBs). Specific effects
  of the neutron component depend on whether the final Lorentz factor of a plasma
  wind exceeds some critical value or not. In the first case, velocity decoupling
  of the neutron and proton flows takes place, giving rise to an electromagnetic cascade
  induced by pion production in inelastic collisions of nucleons. Otherwise, all nucleons
  in the wind behave as a single fluid. In both cases neutrons can strongly influence
  a GRB by changing the dynamics of a shock initiated by protons in the surrounding
  medium. Conditions for the decoupling of the neutron flow as well as observational
  consequences of the resulting pion-induced cascade are discussed, including preburst
  of high-energy photons and neutrinos and annihilation afterglow of a huge number
  of ejected electron-positron pairs. The critical value of the Lorentz factor is
  estimated to lie in the range expected for cosmological GRBs, so there possibly
  exist two different populations of bursts. A number of tests for decoupling of the
  neutron flow is suggested. The results obtained for the radiation-driven wind allow
  straightforward generalization for winds driven by other mechanisms, e.g., for the
  MHD winds.
