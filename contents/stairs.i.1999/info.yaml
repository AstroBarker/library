abstract: We present a large sample of high-precision, coherently dedispersed polarization
  profiles of millisecond pulsars (MSPs) at frequencies between 410 and 1414 MHz.
  These data include the first polarimetric observations of several of the pulsars
  and the first low-frequency polarization profiles for others. Our observations support
  previous suggestions that the pulse shapes and polarimetry of MSPs are more complex
  than those of their slower relatives. An immediate conclusion is that polarimetry-based
  classification schemes proposed for young pulsars are of only limited use when applied
  to millisecond pulsars.
