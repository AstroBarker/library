abstract: We review the theory of electron-conduction opacity, a fundamental ingredient
  in the computation of low-mass stellar models; shortcomings and limitations of the
  existing calculations used in stellar evolution are discussed. We then present new
  determinations of the electron-conduction opacity in stellar conditions for an arbitrary
  chemical composition that improve over previous works and, most importantly, cover
  the whole parameter space relevant to stellar evolution models (i.e., both the regime
  of partial and high electron degeneracy). A detailed comparison with the currently
  used tabulations is also performed. The impact of our new opacities on the evolution
  of low-mass stars is assessed by computing stellar models along both the H- and
  He-burning evolutionary phases, as well as main sequence models of very low-mass
  stars and white dwarf cooling tracks.
