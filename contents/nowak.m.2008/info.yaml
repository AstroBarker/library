abstract: We present simultaneous Chandra High-Energy Transmission Gratings (HETG)
  and Rossi X-ray Timing Explorer (RXTE) observations of a "soft state" of the black
  hole candidate 4U 1957+11. These spectra, having limited hard X-ray excess, are
  an excellent test of disk atmosphere models that include effects of black hole spin.
  The HETG data show, by modeling the broadband continuum and direct fitting of absorption
  edges, that the disk spectrum is only very mildly absorbed, with NH = (1-2) \texttimes{}
  1021 cm-2. These data additionally reveal lambdalambda13.449 Ne IX absorption consistent
  with the warm/hot phase of the interstellar medium. The fitted disk model implies
  an inclined disk around a low-mass black hole rotating with normalized spin a\textasteriskcentered
  \approx{} 1. We show, however, that pure Schwarzschild models describe the data
  extremely well, albeit with large disk atmosphere ``color-correction'' factors.
  Standard correction factors can be attained if one incorporates mild Comptonization.
  We find that the Chandra observations do not uniquely determine spin, even with
  this otherwise extremely well-measured, nearly pure disk spectrum. XMM-Newton RXTE
  observations, taken only six weeks later, are equally unconstraining. This lack
  of constraint is partly driven by the unknown mass and distance of 4U 1957+11; however,
  it is also driven by the limited Chandra and XMM-Newton bandpasses. We therefore
  present a series of 48 RXTE observations taken at different brightness/hardness
  levels. These data prefer a spin of a\textasteriskcentered \approx{} 1, even when
  including a mild Comptonization component; however, they also show evolution of
  the color-correction factors. If the rapid-spin models with standard correction
  factors are to be believed, then the RXTE observations predict that 4U 1957+11 can
  range from a 3 M\&sun; black hole at 10 kpc with a\textasteriskcentered \approx{}
  0.83 to a 16 M\&sun; black hole at 22 kpc with a\textasteriskcentered \approx{}
  1.
