abstract: We report results from a multiwavelength observing campaign conducted during
  2000 March on the flare star AD Leo. Simultaneous data were obtained from several
  ground- and space-based observatories, including observations of eight sizable flares.
  We discuss the correlation of line and continuum emission in the optical and ultraviolet
  wavelength regimes, as well as the flare energy budget, and we find that the emission
  properties are remarkably similar even for flares of very different evolutionary
  morphology. This suggests a common heating mechanism and atmospheric structure that
  are independent of the detailed evolution of individual flares. We also discuss
  the Neupert effect, chromospheric line broadening, and velocity fields observed
  in several transition region emission lines. The latter show significant downflows
  during and shortly after the flare impulsive phase. Our observations are broadly
  consistent with the solar model of chromospheric evaporation and condensation following
  impulsive heating by a flux of nonthermal electrons. These data place strong constraints
  on the next generation of radiative hydrodynamic models of stellar flares.
