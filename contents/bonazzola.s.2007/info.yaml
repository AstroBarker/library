abstract: 'We present a numerical technique for solving evolution equations, such
  as the wave equation, in the description of rotating astrophysical compact objects
  in comoving coordinates, which avoids the problems associated with the light cylinder.
  The technique implements a fast spectral matching between two domains in relative
  rotation: an inner spherical domain, comoving with the sources and lying strictly
  inside the light cylinder, and an outer inertial spherical shell. Even though the
  emphasis is placed on spectral techniques, the matching is independent of the specific
  manner in which equations are solved inside each domain, and can be adapted to different
  schemes. We illustrate the strategy with some simple but representative examples.'
