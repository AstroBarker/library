abstract: The piecewise parabolic method and related schemes are widely used to model
  stellar flows. Several different methods for extending the validity of these methods
  to a general equation of state (EOS) have been proposed over time, but direct comparisons
  among one-another and exact solutions with stellar EOSs are not widely available.
  We introduce some simple test problems with exact solutions run with a popular stellar
  EOS and test how two existing codes with different approaches to incorporating general
  gases perform. The source code for generating the exact solutions is made available.
