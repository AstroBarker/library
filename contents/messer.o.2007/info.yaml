abstract: 'CHIMERA is a multi-dimensional radiation hydrodynamics code designed to
  study core-collapse supernovae. The code is made up of three essentially independent
  parts: a hydrodynamics module, a nuclear burning module, and a neutrino transport
  solver combined within an operator-split approach. We describe some major algorithmic
  facets of the code and briefly discuss some recent results. The multi-physics nature
  of the problem, and the specific implementation of that physics in CHIMERA, provide
  a rather straightforward path to effective use of multi-core platforms in the near
  future.'
