abstract: Secondary nucleosynthesis accompanying central He burning in massive         stars
  (the site of the so-called 'weak' s-process component) is         reinvestigated.
  A 'complete' set of stellar models (i.e.,         covering the whole mass range
  of massive stars) and the most         recent nuclear data is used. For the first
  time, the production         of secondary nuclei as a function of metallicity is
  investigated         in detail, and a large range of initial stellar metallicities
  is         explored; a thorough study of the various neutron sources and         poisons
  reveals important effects at low metallicities, never         analyzed in detail
  before. A comparison to solar system data is         made, and yields of s-nuclei
  as a function of stellar mass and         metallicity are given, for use in galactic
  chemical evolution         models.
author: Prantzos, N. and Hashimoto, M. and Nomoto, K.
