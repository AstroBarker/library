abstract: An estimate can be made of the effect of a central mass on an explosion
  through the study of self-similar blast waves in a medium having an inverse-square-of-r
  density profile, as is approximately the case in the inner core of the progenitor
  of SN 1987A; its parameters are such that the nucleon density is substantially constant
  within the shock front. In SN explosions with a massive envelopes, the core material
  is decelerated by its interaction with the envelope, and a reverse shock wave propagates
  back to the center.
