abstract: As is well known, the requirement that gamma-ray bursts be optically thin
  to high-energy photons yields a lower limit on the Lorentz factor (gamma) of the
  expansion. In this paper, we provide a simple derivation of the lower limit on gamma
  due to the annihilation of photon pairs and correct the errors in some of the previous
  calculations of this limit. We also derive a second limit on gamma due to scattering
  of photons by pair-created electrons and positrons. For some bursts, this limit
  is the more stringent. In addition, we show that a third limit on gamma, obtained
  by considering the scattering of photons by electrons that accompany baryons, is
  nearly always less important than the second limit. Finally, we evaluate these limits
  for a number of bursts.
