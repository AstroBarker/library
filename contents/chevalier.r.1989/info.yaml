abstract: Analytic models for the spherically symmetric expansion of SN 1987 A are
  discussed. The SN model includes a bend in the expanded density profiles at a velocity
  of about 4000 km/s and employs an asymmetric initial density distribution or energy
  deposition on the assumption of radial flow. The calculations show that there is
  a tendency for the flow to become more spherical during the expansion phase, and
  that the sense of density asymmetry changes across the bend in the density profile.
