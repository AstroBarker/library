abstract: Energy spectra and zenith-angle distributions are calculated for cosmic-ray
  muons, neutrons, and antineutrinos in the 1 to 1 million TeV energy interval. Nuclear
  effects are accounted for using the additive quark model and the optical model of
  the nucleus. Results obtained with the recombination quark-parton model are compared
  with corresponding predictions obtained with the quark-gluon string model.
