abstract: 'This work presents an implementation of the resistive magnetohydrodynamic
  equations for a generic algebraic Ohm''s law which includes the effects of finite
  resistivity within full General Relativity. The implementation naturally accounts
  for magnetic field induced anisotropies and, by adopting a phenomenological current,
  is able to accurately describe electromagnetic fields in the star and in its magnetosphere.
  We illustrate the application of this approach in interesting systems with astrophysical
  implications: the aligned rotator solution and the collapse of a magnetized rotating
  neutron star to a black hole.'
