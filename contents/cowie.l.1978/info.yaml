abstract: Analytical arguments and a numerical hydrodynamic code are used to investigate
  spherically symmetric accretion onto a compact object, in an attempt to provide
  some insight into gas flows heated by an outgoing X-ray flux. It is shown that preheating
  of spherically symmetric accretion flows by energetic radiation from an X-ray source
  results in time-dependent behavior for a much wider range of source parameters than
  was determined previously and that there are two distinct types of instability.
  The results are compared with observations of X-ray bursters and transients as well
  as with theories on quasars and active galactic nuclei that involve quasi-spherically
  symmetric accretion onto massive black holes. Models based on spherically symmetric
  accretion are found to be inconsistent with observations of bursters and transients.
