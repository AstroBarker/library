abstract: Even though the solar photospheric abundances are now on the whole in very
  good agreement with the meteoritic values, some problems remain which will only
  be solved with a higher level of accuracy in the atomic data, especially the transition
  probabilities for faint lines. The authors justify this request for many more very
  accurate gf-values through a few particularly striking points.
