abstract: We present the first three-dimensional simulations of fingering convection
  performed at parameter values approaching those relevant for astrophysics. Our simulations
  reveal the existence of simple asymptotic scaling laws for turbulent heat and compositional
  transport, which can be straightforwardly extrapolated from our numerically tractable
  values to the true astrophysical regime. Our investigation also indicates that thermo-compositional
  "staircases," a key consequence of fingering convection in the ocean, cannot form
  spontaneously in the fingering regime in stellar interiors. Our proposed empirically
  determined transport laws thus provide simple prescriptions for mixing by fingering
  convection in a variety of astrophysical situations, and should, from here on, be
  used preferentially over older and less accurate parameterizations. They also establish
  that fingering convection does not provide sufficient extra-mixing to explain observed
  chemical abundances in red giant branch stars.
