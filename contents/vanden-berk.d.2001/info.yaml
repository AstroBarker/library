abstract: We have created a variety of composite quasar spectra using a homogeneous
  data set of over 2200 spectra from the Sloan Digital Sky Survey (SDSS). The quasar
  sample spans a redshift range of 0.044<=z<=4.789 and an absolute r' magnitude range
  of -18.0 to -26.5. The input spectra cover an observed wavelength range of 3800-9200
  {\AA} at a resolution of 1800. The median composite covers a rest-wavelength range
  from 800 to 8555 {\AA} and reaches a peak signal-to-noise ratio of over 300 per
  1 {\AA} resolution element in the rest frame. We have identified over 80 emission-line
  features in the spectrum. Emission-line shifts relative to nominal laboratory wavelengths
  are seen for many of the ionic species. Peak shifts of the broad permitted and semiforbidden
  lines are strongly correlated with ionization energy, as previously suggested, but
  we find that the narrow forbidden lines are also shifted by amounts that are strongly
  correlated with ionization energy. The magnitude of the forbidden line shifts is
  <~100 km s-1, compared with shifts of up to 550 km s-1 for some of the permitted
  and semiforbidden lines. At wavelengths longer than the Lyalpha emission, the continuum
  of the geometric mean composite is well fitted by two power laws, with a break at
  ~5000 {\AA}. The frequency power-law index, alphanu, is -0.44 from ~1300 to 5000
  {\AA} and -2.45 redward of ~5000 {\AA}. The abrupt change in slope can be accounted
  for partly by host-galaxy contamination at low redshift. Stellar absorption lines,
  including higher order Balmer lines, seen in the composites suggest that young or
  intermediate-age stars make a significant contribution to the light of the host
  galaxies. Most of the spectrum is populated by blended emission lines, especially
  in the range 1500-3500 {\AA}, which can make the estimation of quasar continua highly
  uncertain unless large ranges in wavelength are observed. An electronic table of
  the median quasar template is available. Based on observations obtained with the
  Sloan Digital Sky Survey, which is owned and operated by the Astrophysical Research
  Consortium.
