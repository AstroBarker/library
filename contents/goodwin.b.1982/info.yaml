abstract: Transport coefficients for degenerate neutrinos in dense matter are calculated
  in order to determine the energy dissipation due to degenerate neutrinos in the
  core of a newly formed neutron star. Comparison of thermally averaged scattering
  rates by different processes indicates simple absorption and scattering to be the
  two most important processes limiting neutrino mean free path. The kinetic equations
  for shear viscosity, diffusion coefficient, thermal conductivity and bulk viscosity
  are then solved exactly taking into account both scattering and absorption to obtain
  the transport coefficients. It is found that the rate of scattering by nucleons
  is a function only of neutrino density, and that neutron-proton interactions reduce
  neutrino concentration at a given lepton fraction and thus the scattering rate.
  Calculations indicate neutrino diffusion to be the primary source of energy dissipation
  under many circumstances.
