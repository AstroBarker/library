abstract: 'As the core of a massive star collapses to form a neutron star, the flux
  of neutrinos in the overlying shells of heavy elements becomes so great that, despite
  the small cross section, substantial nuclear transmutation is induced. Neutrinos
  excite heavy elements and even helium to particle unbound levels. The evaporation
  of a single neutron or proton, and the back reaction of these nucleons on other
  species present, significantly alters the outcome of traditional nucleosynthesis
  calculations leading to a new process: nu-nucleosynthesis. Modifications to traditional
  hydrostatic and explosive varieties of helium, carbon, neon, oxygen, and silicon
  burning are considered. The results show that a large number of rare isotopes, including
  many of the odd-Z nuclei from boron through copper, owe much of their present abundance
  in nature to this process.'
