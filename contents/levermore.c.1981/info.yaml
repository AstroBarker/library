abstract: A diffusion theory for radiative transfer is derived which is naturally
  flux limited, i.e., the magnitude of the flux can be no greater than the density
  times the maximum transport speed. Numerical comparisons with exact solutions of
  the equation of transfer indicate that this approximate theory is significantly
  more accurate than classical isotropic diffusion theory (the Eddington approximation)
  and asymptotic diffusion theory.
