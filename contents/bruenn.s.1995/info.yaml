abstract: The instabilities that are believed to play an important role in the supernova
  mechanism are reviewed. We then investigate the dynamics of two of these instabilities,
  prompt convection and neutron fingers, and its consequences for the supernova outcome.
  We find that prompt convection occurs immediately after shock propagation and is
  primarily entropy driven. A number of detailed one-dimensional spherically symmetric
  simulations of prompt convection are performed using a mixing length algorithm in
  a code coupling the core hydrodynamics with multigroup flux-limited diffusion of
  neutrinos of all types. We find that prompt convection does not have a significant
  effect on the neutrino luminosities or spectra and, furthermore, that the core is
  not amenable to shock revival at this time. Consequently, we do not find that prompt
  convection is important for the supernova mechanism.
